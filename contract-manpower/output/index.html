年資補償金者，於申請養老年金給付前，須將依原領取補償金法令所定應繳回金額，一次全數繳回相關權責機關或交由承保機關繳還相關權責機關，始得依規定請領養老年金給付。","title":"第 四 章 附則"},{"no":"第49條","text":"被保險人符合下列情形者，得於年滿六十五歲時，併計其曾參加勞工保險之保險年資，請領本保險養老年金給付：\n一、中華民國九十九年一月一日以後退保。\n二、繳付本保險保險費及曾參加勞工保險各未滿十五年之保險年資合計達十五年以上。\n三、符合第十六條第一項或第二十六條所定養老給付請領條件。\n前項被保險人應按退出本保險當時之平均保俸額，依基本年金率計給養老年金給付；該參加勞工保險之保險年資不計給本保險養老給付。\n被保險人之本保險或勞工保險年資，有下列情形之一者，不予併計：\n一、已請領勞工保險老年給付。\n二、已請領本保險養老給付。\n三、已領取本保險或勞工保險年資之補償金。\n被保險人有下列情形之一者，不適用第一項及第二項規定：\n一、犯貪污治罪條例之罪，或犯刑法瀆職罪，或於動員戡亂時期終止後，犯內亂罪、外患罪，經判刑確定。\n二、依所適用人事法令應予免職、解聘或撤職；於處分前離職者，亦同。\n三、依所適用人事法令應予停職（聘）或休職，且未依法復職；於處分前離職者，亦同。\n第一項及第二項人員請領之本保險養老年金給付，應自申請之日起發給。\n被保險人於本法中華民國一百零三年一月十四日修正施行前死亡者，不適用第一項及第二項規定。\n第一項第二款所定未滿十五年之保險年資，應包含已請領本保險養老給付或勞工保險老年給付之保險年資。","title":"第 四 章 附則"},{"no":"第50條","text":"本法施行細則由考試院會同行政院定之。","title":"第 四 章 附則"},{"no":"第51條","text":"本法施行日期，由考試院會同行政院定之。\n本法修正條文，除中華民國一百十年十二月二十四日修正條文之施行日期由考試院會同行政院定之；一百十一年十二月十六日修正條文自一百十二年七月一日施行外，自公布日施行。","title":"第 四 章 附則"}],"tags":["公務人員","保險","公保"],"note":"第 2 條、第 6 條被保險人範圍：法定機關編制內有給專任人員；聘用人員得參加公保，約僱人員自 103 年起改投勞保（依本法及相關規定）。"},{"id":"B08","name":"公務人員協會法","pcode":"S0010008","level":"法律","authority":"銓敘部","category":"考試＞銓敘部＞公務人員協會目","modified_date":"2006-05-17","history":[{"date":"2002-07-10","summary":"中華民國九十一年七月十日總統華總一義字第 09100138710 號令制定公布全文 52 條；依第 52 條規定：本法施行日期，由考試院以命令定之中華民國九十一年十一月二十二日考試院考臺組貳二字第 0910009488號令發布自九十二年一月一日施行"},{"date":"2005-06-15","summary":"中華民國九十四年六月十五日總統華總一義字第 09400088821 號令修正公布第 2、8、10、11、13 條條文；並增訂第 11-1 條條文；本法施行日期，由考試院以命令定之中華民國九十四年七月一日考試院考臺組貳一字第 09400052381 號令發布自九十四年七月一日施行"},{"date":"2006-05-17","summary":"中華民國九十五年五月十七日總統華總一義字第 09500069761 號令修正公布第 4、5、10、26、38 條條文；施行日期，由考試院以命令定之中華民國九十五年六月十三日考試院考臺組貳一字第 09500045491 號令發布定自九十五年五月十九日施行"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=S0010008","articles":[{"no":"第1條","text":"公務人員為加強為民服務、提昇工作效率、維護其權益、改善工作條件並促進聯誼合作，得組織公務人員協會。\n公務人員協會之組織、管理及活動，依本法之規定；本法未規定者，適用民法有關法人之規定。"},{"no":"第2條","text":"本法所稱公務人員，指於各級政府機關、公立學校、公營事業機構（以下簡稱機關）擔任組織法規所定編制內職務支領俸（薪）給之人員。\n前項規定不包括下列人員：\n一、政務人員。\n二、各級政府機關、公立學校首長及副首長。\n三、公立學校教師。\n四、各級政府所經營之各類事業機構中，對經營政策負有主要決策責任以外之人員。\n五、軍職人員。"},{"no":"第3條","text":"公務人員協會為法人。"},{"no":"第4條","text":"公務人員協會之組織分為下列二級：\n一、機關公務人員協會。\n二、全國公務人員協會。\n前項機關公務人員協會包括：\n一、總統府、國家安全會議、五院之機關公務人員協會。\n二、各部及同層級機關之機關公務人員協會。\n三、各直轄市、縣（市）之機關公務人員協會。"},{"no":"第5條","text":"公務人員協會之主管機關如下：\n一、全國公務人員協會、總統府、國家安全會議、五院、各部及同層級之機關公務人員協會，其主管機關為銓敘部。\n二、直轄市、縣（市）之機關公務人員協會，其主管機關為各該直轄市政府、縣（市）政府。\n公務人員協會所興辦之事業應受各該目的事業主管機關之指導、監督。"},{"no":"第6條","text":"公務人員協會對於下列事項，得提出建議：\n一、考試事項。\n二、公務人員之銓敘、保障、撫卹、退休事項。\n三、公務人員任免、考績、級俸、陞遷、褒獎之法制事項。\n四、公務人員人力規劃及人才儲備、訓練進修、待遇調整之規劃及擬議、給假、福利、住宅輔購、保險、退休撫卹基金等權益事項。\n五、有關公務人員法規之制（訂）定、修正及廢止事項。\n六、工作簡化事項。"},{"no":"第7條","text":"公務人員協會對於下列事項，得提出協商：\n一、辦公環境之改善。\n二、行政管理。\n三、服勤之方式及起訖時間。\n有下列各款情形之一者，不得提出協商：\n一、法律已有明文規定者。\n二、依法得提起申訴、復審、訴願、行政訴訟之事項。\n三、為公務人員個人權益事項者。\n四、與國防、安全、警政、獄政、消防及災害防救等事項相關者。"},{"no":"第8條","text":"公務人員協會得辦理下列事項：\n一、會員福利事項。\n二、會員訓練進修事項。\n三、會員與機關間或會員間糾紛之調處與協助。\n四、學術講座之舉辦、圖書資料之蒐集及出版。\n五、交流、互訪等聯誼合作事項。\n六、接受政府機關或公私團體之委託事項。\n七、會員自律公約之訂定。\n八、其他法律規定事項。\n全國公務人員協會得推派代表參與涉及全體公務人員權益有關之法定機關（構）、團體。"},{"no":"第9條","text":"公務人員得依本法組織及加入機關公務人員協會。"},{"no":"第10條","text":"公務人員協會之發起及籌組，依下列規定：\n一、機關公務人員協會：\n（一）總統府、國家安全會議、五院，經各該機關公務人員三十人以上之發起；各部及同層級機關，經各該機關或其所屬機關公務人員三十人以上之發起，得籌組機關公務人員協會。機關公務人員人數未達三十人者，得加入同層級機關之機關公務人員協會。\n（二）各直轄市、縣（市）經行政區域內地方機關之公務人員三十人以上之發起，得籌組各直轄市、縣（市）之機關公務人員協會。\n（三）總統府、國家安全會議、五院、各部及同層級機關公務人員協會應冠以各該機關名稱；各直轄市、縣（市）之機關公務人員協會應冠以行政區域名稱。\n（四）各機關成立之機關公務人員協會以一個為限。\n二、全國公務人員協會：\n（一）依本法成立之總統府、國家安全會議、五院、各部及同層級機關公務人員協會數超過總統府、國家安全會議、五院、各部及同層級機關總數五分之一時及各直轄市、縣（市）之機關公務人員協會數超過直轄市、縣（市）總數三分之一時，得共同發起、籌組全國公務人員協會。\n（二）全國公務人員協會應冠以中華民國名稱。\n各部及同層級機關其所屬機關、各直轄市、縣（市）行政區域內地方機關之公務人員會員，得於服務機關內組成各該部及同層級機關公務人員協會之分會或各該直轄市、縣（市）機關公務人員協會之分會。但同一機關以設一分會為限。\n前項分會受其機關公務人員協會之指導處理一切事務。"},{"no":"第11條","text":"發起、籌組公務人員協會，應由發起人檢具申請書、章程草案及發起人名冊，向主管機關申請立案。\n發起人經向主管機關申請立案後，應組成籌備會，辦理會員招募、召開成立大會等籌備工作。但機關公務人員協會成立大會之召開，於招募會員人數已達八百人或超過機關預算員額數五分之一，且不低於三十人時，始得為之。\n召開成立大會應函請主管機關備查，主管機關得派員列席。\n公務人員協會應於成立大會召開後三十日內，檢具章程、會員名冊、理事、監事及會務人員簡歷冊各一份，報請主管機關許可。合於本法規定者，由主管機關發給立案證書及圖記。"},{"no":"第11-1條","text":"主管機關先後收受多組發起人申請立案時，應優先受理先申請者之案件；其同意立案以一組為限。\n發起人經向主管機關申請立案同意後，應於六個月內召開成立大會，逾期廢止其立案同意。但報經主管機關核准者，得延長之，其期間以三個月為限。"},{"no":"第12條","text":"公務人員協會章程應載明下列事項：\n一、名稱。\n二、宗旨。\n三、會址。\n四、組織。\n五、會員之入會、出會及除名。\n六、會員之權利與義務。\n七、理事、監事與候補理事、候補監事之名額、權限、任期及其選任與解任。\n八、會議。\n九、經費及會計。\n十 財產之處分。\n十一、章程之修改。\n十二、定有會員代表大會者，其組織、會員代表之權限、任期及其選任與解任。\n十三、定有獎懲事項者，其事項。\n十四、設有基金者，其設立與管理事項。\n十五、興辦事業者，其事業名稱及相關事項。\n十六、其他依法令規定應載明之事項。\n公務人員協會章程之訂定或修改，應有全體會員或會員代表過半數之出席，並經出席會員或會員代表三分之二以上之同意。\n公務人員協會章程之修改，應函請主管機關備查。"},{"no":"第13條","text":"公務人員協會置理事、監事，分別組成理事會、監事會。理事、監事由全體會員或會員代表就會員中選任，其名額依下列之規定：\n一、機關公務人員協會置理事五人至十五人。\n二、全國公務人員協會之理事總額不得逾三十五人。\n三、各級公務人員協會之監事名額不得超過該協會理事名額三分之一。\n四、各級公務人員協會均得置候補理事、候補監事，其名額不得超過該協會理事、監事名額三分之一。但不足一人時，以一人計。\n前項各款理事、監事之變更，應函請主管機關備查。\n理事、監事名額在三人以上者，得分別互選常務理事及常務監事，其名額不得超過理事或監事總額之三分之一；並由理事就常務理事中選舉一人為理事長，對外代表協會，其不設常務理事者，就理事中互選之。常務監事在三人以上時，應互推一人為監事會召集人。"},{"no":"第14條","text":"公務人員協會理事、監事之任期均為二年，連選得連任。理事長之連任以一次為限。"},{"no":"第15條","text":"公務人員協會理事會、監事會應依章程及會員或會員代表大會之決議，分別執行職務。\n理事會處理公務人員協會之事務，監事會監督章程之遵守及會員或會員代表大會決議事項之執行，並審核理事會所提出之帳冊。"},{"no":"第16條","text":"公務人員協會之理事、監事有下列各款情形之一者，應即解任：\n一、喪失會員資格者。\n二、因故辭職經理事會或監事會決議通過者。\n三、被罷免或撤免者。\n四、經會員或會員代表大會決議停權處分，期間逾任期二分之一者。\n前項第二款情形應提請會員或會員代表大會追認。"},{"no":"第17條","text":"公務人員協會理事、監事執行職務，如有違反法令、章程或會員或會員代表大會決議情事者，除依有關法令及章程處理外，得經會員或會員代表大會通過罷免之。"},{"no":"第18條","text":"公務人員協會理事會、監事會，每三個月至少舉行會議一次，候補理事，候補監事均得列席。\n前項會議之決議，各以理事、監事過半數之出席，出席人數過半數或較多數之同意行之。"},{"no":"第19條","text":"公務人員協會理事長或監事會召集人，無故不召開理事會或監事會超過二個會次者，應由主管機關解除理事長或監事會召集人職務，另行改選或改推。"},{"no":"第20條","text":"公務人員協會理事、監事應親自出席理事、監事會議，不得委託他人代理；非有正當理由不得請假，無故連續二次缺席者，視為辭職，由候補理事、候補監事分別依次遞補。"},{"no":"第21條","text":"公務人員協會如有違背法令或章程、逾越權限，妨害公益情事或廢弛會務者，主管機關應為下列之處分：\n一、警告。\n二、撤銷其決議。\n三、停止其業務之一部或全部。\n四、撤免其理事、監事。\n前項第一款至第三款之處分，目的事業主管機關亦得為之。"},{"no":"第22條","text":"公務人員協會之理事、監事出缺時，其缺額由候補理事、候補監事依次遞補；其任期至原任理事、監事之任期屆滿為止。"},{"no":"第23條","text":"公務人員協會以會員或會員代表大會為最高機關。\n下列事項應經會員或會員代表大會之議決：\n一、章程之修改。\n二、理事、監事之罷免。\n三、會員之除名。\n四、財產之處分。\n五、有關公務人員法規制（訂）定、修正及廢止之建議。\n六、收支預算之編列。\n七、會務報告及收支決算之承認。\n八、理事會、監事會提案之審議。\n九、全國公務人員協會或國際性組織之加入或退出。\n十、其他應經會員或會員代表大會決議事項。"},{"no":"第24條","text":"會員或會員代表大會分定期會議及臨時會議二種，由理事長召集之，理事長因故不能召集時，由理事互推一人召集之。\n定期會議每年至少召開一次。臨時會議經理事會決議、會員或會員代表五分之一以上之請求或監事會之請求，應召開之。\n定期會議及臨時會議，應分別於十五日及五日前將召開會議之事由、時間、地點連同議程通知各會員或會員代表，並報請主管機關備查。"},{"no":"第25條","text":"會員或會員代表大會應有全體會員或會員代表過半數之出席，出席會員或會員代表過半數之同意，始得議決。但第二十三條第二項第一款至第五款之決議，應經出席會員或會員代表三分之二以上之同意。"},{"no":"第26條","text":"全國公務人員協會以總統府、國家安全會議、五院、各部及同層級機關公務人員協會及各直轄市、縣（市）之機關公務人員協會為會員共同組織之，並分別自各該機關公務人員協會推選會員代表，其會員人數在一千人以下者，各推選一名，超過一千人者，每一千人增加代表一名，尾數未滿一千人者，以一千人計，分別代表各該機關公務人員協會行使職權。"},{"no":"第27條","text":"公務人員協會經費來源如下：\n一、入會費。\n二、常年會費。\n三、捐款。\n四、委託收益。\n五、基金及其孳息。\n六、政府補助費。\n七、其他收入及孳息。\n前項第一款、第二款之數額及繳納方式，應經會員或會員代表大會議決。\n捐款人依第一項第三款之捐款支出，得依所得稅法規定，列為扣除額。"},{"no":"第28條","text":"全國公務人員協會或機關公務人員協會依第七條規定提出協商時，應就協商事項之性質向各該事項主管機關提出。\n接獲協商案件之機關如非協商案件之主管機關，應將協商案件移轉至該案件之主管機關。"},{"no":"第29條","text":"受理協商案件之主管機關與相關機關應自接獲協商之日起三十日內，指定人員與公務人員協會進行協商。並應就協商之議題、時間、場所、參加人員及其他相關事項先行會商決定。\n正式協商時，如發生未經指定之代表出席、或有妨礙機關之正常運作、或有阻礙協商進行之虞者，得停止協商。"},{"no":"第30條","text":"公務人員協會與協商案件之主管機關及相關機關協商所獲致之結果，參與協商之機關及公務人員協會均應履行。\n公務人員協會不得向主管機關或相關機關請求締結團體協約。"},{"no":"第31條","text":"公務人員協會依第二十八條規定提出協商，而受理機關未於期限內進行協商，或協商不成，或未完全履行協商結果時，公務人員協會得向其主管機關申請調解。"},{"no":"第32條","text":"公務人員協會申請調解時，主管機關應組成調解委員會處理之。\n前項調解委員會置委員三人，以下列人員組成之：\n一、由爭議當事人雙方分別選定之第三人各一人。\n二、公正並富學識經驗人士一人。\n前項第二款之委員，應由爭議當事人雙方選定之調解委員共同推選，並為會議之主席。\n調解委員會應於主席確定後十日內召開之。"},{"no":"第33條","text":"主管機關於接獲公務人員協會申請調解後，應於三日內通知爭議當事人於五日內選定調解委員，並將調解委員之姓名、性別、年齡、職業及住所或居所具報，逾期不為具報者，視為調解不成立。"},{"no":"第34條","text":"主管機關於接獲爭議當事人雙方選定之調解委員名單後，應於三日內通知雙方調解委員於五日內依第三十二條第三項規定共同推選公正並富學識經驗人士為調解委員，逾期不為具報者，視為調解不成立。\n主管機關應備置公正並富學識經驗人士名單，供推選參考。"},{"no":"第35條","text":"調解成立者，主管機關應作成調解書，並由爭議當事人及出席調解委員簽名；調解不成立者，應於七日內發給調解不成立證明書。"},{"no":"第36條","text":"調解申請得於調解期日前撤回，調解申請經撤回者，不得復提起同一之申請。\n申請調解之公務人員協會無正當理由，於調解期日不到場者，視為撤回調解申請。"},{"no":"第37條","text":"參與調解之相對人無正當理由，於調解期日不到場者，視為調解不成立。但主管機關認為有成立調解之望者，得另定調解期日。\n前項另定調解期日之次數以一次為限。"},{"no":"第38條","text":"全國公務人員協會或機關公務人員協會之主管機關於接獲調解申請後，未依期限進行調解或調解不成立時，原申請調解之公務人員協會得於期限屆滿後或收到調解不成立證明書之日起七日內向其主管機關申請爭議裁決。\n全國公務人員協會或機關公務人員協會申請爭議裁決時，全國公務人員協會、總統府、國家安全會議、五院、各部及同層級機關公務人員協會之主管機關應於接獲申請之日起十四日內組成爭議裁決委員會處理之。各直轄市、縣（市）機關公務人員協會之主管機關應於接獲申請之日起十日內提出爭議裁決申請書，函請銓敘部組成爭議裁決委員會，銓敘部應於接獲爭議裁決申請書之日起十四日內組成爭議裁決委員會處理之。"},{"no":"第39條","text":"爭議裁決委員會置爭議裁決委員九人，以下列人員組成之，並由爭議裁決委員互選一人為主席：\n一、銓敘部、公務人員保障暨培訓委員會及行政院人事行政局各指派一人為當然委員。\n二、相關機關及公務人員協會之代表就爭議裁決委員名冊中各選定爭議裁決委員二人。\n三、由前款爭議裁決委員就爭議裁決委員名冊中專長與爭議事件領域相關者，抽籤選定爭議裁決委員二人。\n前項第二款之爭議裁決委員，應由爭議當事人雙方於接到主管機關通知之日起五日內分別選定具報，逾期不為具報者，即由主管機關代為指定。\n爭議裁決案件，如因其性質特殊，而無法於第四十條所聘人員中覓妥適當人選擔任時，於經主管機關同意後，雙方當事人得選定其他人員擔任爭議裁決委員。"},{"no":"第40條","text":"銓敘部每二年應函請全國公務人員協會及相關業務主管機關分別推薦公正且富學識經驗者十二人至四十八人聘為爭議裁決委員，並建立爭議裁決委員名冊備選。但全國公務人員協會未成立前，僅就相關業務主管機關推薦之人員，建立爭議裁決委員名冊備選。\n爭議裁決委員會之行政作業，由銓敘部相關人員兼任。"},{"no":"第41條","text":"爭議裁決委員會開會時，得邀請爭議當事人或其他關係機關派員列席說明。"},{"no":"第42條","text":"銓敘部應於爭議裁決委員會組成後二十日內召開爭議裁決會議，並將開會處所及期日，通知爭議當事人及其他關係機關。爭議裁決委員會應於會議結束後三個月內作成裁決書；必要時，得予延長。延長以一次為限，最長不得逾二個月。"},{"no":"第43條","text":"爭議裁決委員會之裁決過程均不公開。\n爭議裁決委員會應有全體爭議裁決委員過半數之出席，始得開會；其裁決以出席委員過半數同意為之；可否同數時，取決於主席。對裁決有不同意見之委員及其意見，得列入紀錄。"},{"no":"第44條","text":"爭議裁決委員會之裁決送達後，有拘束爭議當事人及其他關係機關之效力。爭議當事人及其他關係機關對於爭議裁決委員會之裁決，不得聲明不服。\n爭議裁決委員會裁決應為一定行為之關係機關，應於接獲裁決書之次日起二個月內，將辦理情形回復銓敘部。必要時，得報請銓敘部同意延長一個月。"},{"no":"第45條","text":"各關係機關未依前條第二項規定辦理者，銓敘部應檢具證據將違失人員移送監察院依法處理。但違失人員為薦任第九職等以下人員由銓敘部通知服務機關之上級機關依法處理；無上級機關者，應通知本機關依法處理。\n前項違失人員如為民意機關首長，由銓敘部處新臺幣十萬元以上五十萬元以下罰鍰，並公布違失事實。\n前項罰鍰，經通知限期繳納，逾期不繳納者，依法移送強制執行。"},{"no":"第46條","text":"公務人員協會不得發起、主辦、幫助或參與任何罷工、怠職或其他足以產生相當結果之活動，並不得參與政治活動。"},{"no":"第47條","text":"公務人員協會應於每年三月前將下列事項，函送其主管機關備查：\n一、會員名冊。\n二、財務收支報告。\n三、事業之經營狀況。\n四、各項糾紛事件之調處經過。\n前項備查事項，主管機關認為必要時，得隨時派員查核或請公務人員協會函送。"},{"no":"第48條","text":"公務人員協會與外國公務人員團體之聯合或締結聯盟，應經會員或會員代表大會之議決，並函報主管機關許可。"},{"no":"第49條","text":"各機關不得因公務人員發起、籌組或加入公務人員協會、擔任公務人員協會會務人員或從事與公務人員協會有關之合法行為，而予以不利處分。"},{"no":"第50條","text":"公務人員協會於不影響服務機關之公務並向機關首長報告後，得於上班時間召開理事會、監事會或進行協商、調解。代表公務人員協會進行協商、調解或列席爭議裁決委員會之公務人員，得請公假。\n理事長、理事及監事因辦理會務，得請公假，其時數如下：\n一、機關公務人員協會理事長每月不得超過二十小時；全國公務人員協會理事長每月不得超過四十小時。\n二、機關公務人員協會理事、監事每人每月不得超過十小時；全國公務人員協會理事、監事每人每月不得超過二十小時。"},{"no":"第51條","text":"各機關依法令聘用或僱用之人員得準用第九條規定，加入服務機關之公務人員協會。"},{"no":"第52條","text":"本法施行日期，由考試院以命令定之。"}],"tags":["公務人員","協會","結社"],"note":""},{"id":"B09","name":"公務人員行政中立法","pcode":"S0110036","level":"法律","authority":"銓敘部","category":"考試＞銓敘部＞人事管理目","modified_date":"2014-11-26","history":[{"date":"2009-06-10","summary":"中華民國九十八年六月十日總統華總一義字第 09800141571 號令制定公布全文 20 條；並自公布日施行"},{"date":"2014-11-26","summary":"中華民國一百零三年十一月二十六日總統華總一義字第 10300177231號令修正公布第 5、9、17 條條文"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=S0110036","articles":[{"no":"第1條","text":"為確保公務人員依法行政、執行公正、政治中立，並適度規範公務人員參與政治活動，特制定本法。\n公務人員行政中立之規範，依本法之規定；本法未規定或其他法律另有嚴格規定者，適用其他有關之法律。"},{"no":"第2條","text":"本法所稱公務人員，指法定機關依法任用、派用之有給專任人員及公立學校依法任用之職員。"},{"no":"第3條","text":"公務人員應嚴守行政中立，依據法令執行職務，忠實推行政府政策，服務人民。"},{"no":"第4條","text":"公務人員應依法公正執行職務，不得對任何團體或個人予以差別待遇。"},{"no":"第5條","text":"公務人員得加入政黨或其他政治團體。但不得兼任政黨或其他政治團體之職務。\n公務人員不得利用職務上之權力、機會或方法介入黨派紛爭。\n公務人員不得兼任公職候選人競選辦事處之職務。"},{"no":"第6條","text":"公務人員不得利用職務上之權力、機會或方法，使他人加入或不加入政黨或其他政治團體；亦不得要求他人參加或不參加政黨或其他政治團體有關之選舉活動。"},{"no":"第7條","text":"公務人員不得於上班或勤務時間，從事政黨或其他政治團體之活動。但依其業務性質，執行職務之必要行為，不在此限。\n前項所稱上班或勤務時間，指下列時間：\n一、法定上班時間。\n二、因業務狀況彈性調整上班時間。\n三、值班或加班時間。\n四、因公奉派訓練、出差或參加與其職務有關活動之時間。"},{"no":"第8條","text":"公務人員不得利用職務上之權力、機會或方法，為政黨、其他政治團體或擬參選人要求、期約或收受金錢、物品或其他利益之捐助；亦不得阻止或妨礙他人為特定政黨、其他政治團體或擬參選人依法募款之活動。"},{"no":"第9條","text":"公務人員不得為支持或反對特定之政黨、其他政治團體或公職候選人，從事下列政治活動或行為：\n一、動用行政資源編印製、散發、張貼文書、圖畫、其他宣傳品或辦理相關活動。\n二、在辦公場所懸掛、張貼、穿戴或標示特定政黨、其他政治團體或公職候選人之旗幟、徽章或服飾。\n三、主持集會、發起遊行或領導連署活動。\n四、在大眾傳播媒體具銜或具名廣告。但公職候選人之配偶及二親等以內血親、姻親只具名不具銜者，不在此限。\n五、對職務相關人員或其職務對象表達指示。\n六、公開為公職候選人站台、助講、遊行或拜票。但公職候選人之配偶及二親等以內血親、姻親，不在此限。\n前項第一款所稱行政資源，指行政上可支配運用之公物、公款、場所、房舍及人力等資源。\n第一項第四款及第六款但書之行為，不得涉及與該公務人員職務上有關之事項。"},{"no":"第10條","text":"公務人員對於公職人員之選舉、罷免或公民投票，不得利用職務上之權力、機會或方法，要求他人不行使投票權或為一定之行使。"},{"no":"第11條","text":"公務人員登記為公職候選人者，自候選人名單公告之日起至投票日止，應依規定請事假或休假。\n公務人員依前項規定請假時，長官不得拒絕。"},{"no":"第12條","text":"公務人員於職務上掌管之行政資源，受理或不受理政黨、其他政治團體或公職候選人依法申請之事項，其裁量應秉持公正、公平之立場處理，不得有差別待遇。"},{"no":"第13條","text":"各機關首長或主管人員於選舉委員會發布選舉公告日起至投票日止之選舉期間，應禁止政黨、公職候選人或其支持者之造訪活動；並應於辦公、活動場所之各出入口明顯處所張貼禁止競選活動之告示。"},{"no":"第14條","text":"長官不得要求公務人員從事本法禁止之行為。\n長官違反前項規定者，公務人員得檢具相關事證向該長官之上級長官提出報告，並由上級長官依法處理；未依法處理者，以失職論，公務人員並得向監察院檢舉。"},{"no":"第15條","text":"公務人員依法享有之權益，不得因拒絕從事本法禁止之行為而遭受不公平對待或不利處分。\n公務人員遭受前項之不公平對待或不利處分時，得依公務人員保障法及其他有關法令之規定，請求救濟。"},{"no":"第16條","text":"公務人員違反本法，應按情節輕重，依公務員懲戒法、公務人員考績法或其他相關法規予以懲戒或懲處；其涉及其他法律責任者，依有關法律處理之。"},{"no":"第17條","text":"下列人員準用本法之規定：\n一、公立學校校長及公立學校兼任行政職務之教師。\n二、教育人員任用條例公布施行前已進用未納入銓敘之公立學校職員及私立學校改制為公立學校未具任用資格之留用職員。\n三、公立社會教育機構專業人員及公立學術研究機構兼任行政職務之研究人員。\n四、各級行政機關具軍職身分之人員及各級教育行政主管機關軍訓單位或各級學校之軍訓教官。\n五、各機關及公立學校依法聘用、僱用人員。\n六、公營事業對經營政策負有主要決策責任之人員。\n七、經正式任用為公務人員前，實施學習或訓練人員。\n八、行政法人有給專任人員。\n九、代表政府或公股出任私法人之董事及監察人。"},{"no":"第18條","text":"憲法或法律規定須超出黨派以外，依法獨立行使職權之政務人員，準用本法之規定。"},{"no":"第19條","text":"本法施行細則，由考試院定之。"},{"no":"第20條","text":"本法自公布日施行。"}],"tags":["公務人員","行政中立"],"note":"第 17 條：各機關依法聘用、僱用人員準用本法。"},{"id":"C01","name":"勞動基準法","pcode":"N0030001","level":"法律","authority":"勞動部","category":"行政＞勞動部＞勞動條件及就業平等目","modified_date":"2024-07-31","history":[{"date":"1984-07-30","summary":"中華民國七十三年七月三十日總統（73）華總（一）義字第 14069 號令制定公布全文 86 條"},{"date":"1996-12-27","summary":"中華民國八十五年十二月二十七日總統（85）華總（一）義字第 8500298370 號令修正公布第 3 條條文；並增訂第 30-1、84-1、84-2 條條文"},{"date":"1998-05-13","summary":"中華民國八十七年五月十三日總統（87）華總（一）義字第 8700098000 號令修正公布第 30-1 條條文"},{"date":"2000-06-28","summary":"中華民國八十九年六月二十八日總統（89）華總一義字第 8900158760號令修正公布第 30 條條文"},{"date":"2000-07-19","summary":"中華民國八十九年七月十九日總統（89）華總一義字第 8900177630 號令修正公布第 4、72 條條文"},{"date":"2002-06-12","summary":"中華民國九十一年六月十二日總統華總一義字第 09100120620 號令修正公布第 3、21、30-1、56 條條文"},{"date":"2002-12-25","summary":"中華民國九十一年十二月二十五日總統華總一義字第 09100248770 號令修正公布第 30、30-1、32、49、77、79、86 條條文；本法自公布日施行，依第 86 條規定：八十九年六月二十八日修正公布之第 30 條第1 項及第 2 項規定自中華民國九十年一月一日施行"},{"date":"2008-05-14","summary":"中華民國九十七年五月十四日總統華總一義字第 09700055071 號令修正公布第 54 條條文"},{"date":"2009-04-22","summary":"中華民國九十八年四月二十二日總統華總一義字第 09800094001 號令修正公布第 53 條條文"},{"date":"2011-06-29","summary":"中華民國一百年六月二十九日總統華總一義字第 10000136181 號令修正公布第 75～79、80 條條文；增訂第 79-1 條條文"},{"date":"2013-12-11","summary":"中華民國一百零二年十二月十一日總統華總一義字第 10200225221號令修正公布第 45、47、77、79-1 條條文中華民國一百零三年二月十四日行政院院臺規字第 1030124618 號公告第 4 條所列屬「行政院勞工委員會」之權責事項，自一百零三年二月十七日起改由「勞動部」管轄；第 28 條第 5 項所列屬「勞工保險局」之權責事項，自一百零三年二月十七日起，積欠工資墊償基金收繳、墊償業務，改由「勞動部勞工保險局」管轄；積欠工資墊償基金投資及運用業務，改由「勞動部勞動基金運用局」管轄；第 56條第 2 項所列屬「勞工退休基金監理委員會」之權責事項，自一百零三年二月十七日起，監理業務改由「勞動部」管轄；勞工退休基金投資及運用業務，改由「勞動部勞動基金運用局」管轄"},{"date":"2015-02-04","summary":"中華民國一百零四年二月四日總統華總一義字第 10400012401 號令修正公布第 17、28、55、56、78、79、86 條條文；增訂第 80-1 條條文；依第 86 條規定：除第 28 條第 1 項自公布後八個月施行外，自公布日施行"},{"date":"2015-06-03","summary":"中華民國一百零四年六月三日總統華總一義字第 10400064421 號令修正公布第 4、30、79、86 條條文；並自一百零五年一月一日施行"},{"date":"2015-07-01","summary":"中華民國一百零四年七月一日總統華總一義字第 10400077211 號令修正公布第 58 條條文"},{"date":"2015-12-16","summary":"中華民國一百零四年十二月十六日總統華總一義字第 10400146731號令修正公布第 44、46 條條文；增訂第 9-1、10-1、15-1 條條文"},{"date":"2016-11-16","summary":"中華民國一百零五年十一月十六日總統華總一義字第 10500140131號令修正公布第 14 條條文"},{"date":"2016-12-21","summary":"中華民國一百零五年十二月二十一日總統華總一義字第 10500157731號令修正公布第 23、24、30-1、34、36～39、74、79 條條文；並自公布日施行；但第 34 條第 2 項規定，施行日期由行政院定之；第37 條第 1 項規定及第 38 條條文，自一百零六年一月一日施行"},{"date":"2017-12-27","summary":"中華民國一百零六年十二月二十七日總統華總一義字第 10600155871號令修正公布第 61 條條文"},{"date":"2018-01-31","summary":"中華民國一百零七年一月三十一日總統華總一義字第 10700009781號令修正公布第 24、32、34、36～38、86 條條文；增訂第 32-1 條條文；依第 86 條規定：自一百零七年三月一日施行"},{"date":"2018-11-21","summary":"中華民國一百零七年十一月二十一日總統華總一義字第 10700125351號令修正公布第 54、55、59 條條文"},{"date":"2019-05-15","summary":"中華民國一百零八年五月十五日總統華總一義字第 10800049091 號令修正公布第 2、9 條條文；增訂第 22-1 條條文"},{"date":"2019-06-19","summary":"中華民國一百零八年六月十九日總統華總一義字第 10800060011 號令修正公布第 63、78 條條文；增訂第 17-1、63-1 條條文"},{"date":"2020-06-10","summary":"中華民國一百零九年六月十日總統華總一義字第 10900063561 號令修正公布第 80-1 條條文"},{"date":"2024-07-31","summary":"中華民國一百十三年七月三十一日總統華總一義字第 11300068311號令修正公布第 54 條條文"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0030001","articles":[{"no":"第1條","text":"為規定勞動條件最低標準，保障勞工權益，加強勞雇關係，促進社會與經濟發展，特制定本法；本法未規定者，適用其他法律之規定。\n雇主與勞工所訂勞動條件，不得低於本法所定之最低標準。","title":"第 一 章 總則"},{"no":"第2條","text":"本法用詞，定義如下：\n一、勞工：指受雇主僱用從事工作獲致工資者。\n二、雇主：指僱用勞工之事業主、事業經營之負責人或代表事業主處理有關勞工事務之人。\n三、工資：指勞工因工作而獲得之報酬；包括工資、薪金及按計時、計日、計月、計件以現金或實物等方式給付之獎金、津貼及其他任何名義之經常性給與均屬之。\n四、平均工資：指計算事由發生之當日前六個月內所得工資總額除以該期間之總日數所得之金額。工作未滿六個月者，指工作期間所得工資總額除以工作期間之總日數所得之金額。工資按工作日數、時數或論件計算者，其依上述方式計算之平均工資，如少於該期內工資總額除以實際工作日數所得金額百分之六十者，以百分之六十計。\n五、事業單位：指適用本法各業僱用勞工從事工作之機構。\n六、勞動契約：指約定勞雇關係而具有從屬性之契約。\n七、派遣事業單位：指從事勞動派遣業務之事業單位。\n八、要派單位：指依據要派契約，實際指揮監督管理派遣勞工從事工作者。\n九、派遣勞工：指受派遣事業單位僱用，並向要派單位提供勞務者。\n十、要派契約：指要派單位與派遣事業單位就勞動派遣事項所訂立之契約。","title":"第 一 章 總則"},{"no":"第3條","text":"本法於左列各業適用之：\n一、農、林、漁、牧業。\n二、礦業及土石採取業。\n三、製造業。\n四、營造業。\n五、水電、煤氣業。\n六、運輸、倉儲及通信業。\n七、大眾傳播業。\n八、其他經中央主管機關指定之事業。\n依前項第八款指定時，得就事業之部分工作場所或工作者指定適用。\n本法適用於一切勞雇關係。但因經營型態、管理制度及工作特性等因素適用本法確有窒礙難行者，並經中央主管機關指定公告之行業或工作者，不適用之。\n前項因窒礙難行而不適用本法者，不得逾第一項第一款至第七款以外勞工總數五分之一。","title":"第 一 章 總則"},{"no":"第4條","text":"本法所稱主管機關：在中央為勞動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","title":"第 一 章 總則"},{"no":"第5條","text":"雇主不得以強暴、脅迫、拘禁或其他非法之方法，強制勞工從事勞動。","title":"第 一 章 總則"},{"no":"第6條","text":"任何人不得介入他人之勞動契約，抽取不法利益。","title":"第 一 章 總則"},{"no":"第7條","text":"雇主應置備勞工名卡，登記勞工之姓名、性別、出生年月日、本籍、教育程度、住址、身分證統一號碼、到職年月日、工資、勞工保險投保日期、獎懲、傷病及其他必要事項。\n前項勞工名卡，應保管至勞工離職後五年。","title":"第 一 章 總則"},{"no":"第8條","text":"雇主對於僱用之勞工，應預防職業上災害，建立適當之工作環境及福利設施。其有關安全衛生及福利事項，依有關法律之規定。","title":"第 一 章 總則"},{"no":"第9條","text":"勞動契約，分為定期契約及不定期契約。臨時性、短期性、季節性及特定性工作得為定期契約；有繼續性工作應為不定期契約。派遣事業單位與派遣勞工訂定之勞動契約，應為不定期契約。\n定期契約屆滿後，有下列情形之一，視為不定期契約：\n一、勞工繼續工作而雇主不即表示反對意思者。\n二、雖經另訂新約，惟其前後勞動契約之工作期間超過九十日，前後契約間斷期間未超過三十日者。\n前項規定於特定性或季節性之定期工作不適用之。","title":"第 二 章 勞動契約"},{"no":"第9-1條","text":"未符合下列規定者，雇主不得與勞工為離職後競業禁止之約定：\n一、雇主有應受保護之正當營業利益。\n二、勞工擔任之職位或職務，能接觸或使用雇主之營業秘密。\n三、競業禁止之期間、區域、職業活動之範圍及就業對象，未逾合理範疇。\n四、雇主對勞工因不從事競業行為所受損失有合理補償。\n前項第四款所定合理補償，不包括勞工於工作期間所受領之給付。\n違反第一項各款規定之一者，其約定無效。\n離職後競業禁止之期間，最長不得逾二年。逾二年者，縮短為二年。","title":"第 二 章 勞動契約"},{"no":"第10條","text":"定期契約屆滿後或不定期契約因故停止履行後，未滿三個月而訂定新約或繼續履行原約時，勞工前後工作年資，應合併計算。","title":"第 二 章 勞動契約"},{"no":"第10-1條","text":"雇主調動勞工工作，不得違反勞動契約之約定，並應符合下列原則：\n一、基於企業經營上所必須，且不得有不當動機及目的。但法律另有規定者，從其規定。\n二、對勞工之工資及其他勞動條件，未作不利之變更。\n三、調動後工作為勞工體能及技術可勝任。\n四、調動工作地點過遠，雇主應予以必要之協助。\n五、考量勞工及其家庭之生活利益。","title":"第 二 章 勞動契約"},{"no":"第11條","text":"非有左列情事之一者，雇主不得預告勞工終止勞動契約：\n一、歇業或轉讓時。\n二、虧損或業務緊縮時。\n三、不可抗力暫停工作在一個月以上時。\n四、業務性質變更，有減少勞工之必要，又無適當工作可供安置時。\n五、勞工對於所擔任之工作確不能勝任時。","title":"第 二 章 勞動契約"},{"no":"第12條","text":"勞工有左列情形之一者，雇主得不經預告終止契約：\n一、於訂立勞動契約時為虛偽意思表示，使雇主誤信而有受損害之虞者。\n二、對於雇主、雇主家屬、雇主代理人或其他共同工作之勞工，實施暴行或有重大侮辱之行為者。\n三、受有期徒刑以上刑之宣告確定，而未諭知緩刑或未准易科罰金者。\n四、違反勞動契約或工作規則，情節重大者。\n五、故意損耗機器、工具、原料、產品，或其他雇主所有物品，或故意洩漏雇主技術上、營業上之秘密，致雇主受有損害者。\n六、無正當理由繼續曠工三日，或一個月內曠工達六日者。\n雇主依前項第一款、第二款及第四款至第六款規定終止契約者，應自知悉其情形之日起，三十日內為之。","title":"第 二 章 勞動契約"},{"no":"第13條","text":"勞工在第五十條規定之停止工作期間或第五十九條規定之醫療期間，雇主不得終止契約。但雇主因天災、事變或其他不可抗力致事業不能繼續，經報主管機關核定者，不在此限。","title":"第 二 章 勞動契約"},{"no":"第14條","text":"有下列情形之一者，勞工得不經預告終止契約：\n一、雇主於訂立勞動契約時為虛偽之意思表示，使勞工誤信而有受損害之虞者。\n二、雇主、雇主家屬、雇主代理人對於勞工，實施暴行或有重大侮辱之行為者。\n三、契約所訂之工作，對於勞工健康有危害之虞，經通知雇主改善而無效果者。\n四、雇主、雇主代理人或其他勞工患有法定傳染病，對共同工作之勞工有傳染之虞，且重大危害其健康者。\n五、雇主不依勞動契約給付工作報酬，或對於按件計酬之勞工不供給充分之工作者。\n六、雇主違反勞動契約或勞工法令，致有損害勞工權益之虞者。\n勞工依前項第一款、第六款規定終止契約者，應自知悉其情形之日起，三十日內為之。但雇主有前項第六款所定情形者，勞工得於知悉損害結果之日起，三十日內為之。\n有第一項第二款或第四款情形，雇主已將該代理人間之契約終止，或患有法定傳染病者依衛生法規已接受治療時，勞工不得終止契約。\n第十七條規定於本條終止契約準用之。","title":"第 二 章 勞動契約"},{"no":"第15條","text":"特定性定期契約期限逾三年者，於屆滿三年後，勞工得終止契約。但應於三十日前預告雇主。\n不定期契約，勞工終止契約時，應準用第十六條第一項規定期間預告雇主。","title":"第 二 章 勞動契約"},{"no":"第15-1條","text":"未符合下列規定之一，雇主不得與勞工為最低服務年限之約定：\n一、雇主為勞工進行專業技術培訓，並提供該項培訓費用者。\n二、雇主為使勞工遵守最低服務年限之約定，提供其合理補償者。\n前項最低服務年限之約定，應就下列事項綜合考量，不得逾合理範圍：\n一、雇主為勞工進行專業技術培訓之期間及成本。\n二、從事相同或類似職務之勞工，其人力替補可能性。\n三、雇主提供勞工補償之額度及範圍。\n四、其他影響最低服務年限合理性之事項。\n違反前二項規定者，其約定無效。\n勞動契約因不可歸責於勞工之事由而於最低服務年限屆滿前終止者，勞工不負違反最低服務年限約定或返還訓練費用之責任。","title":"第 二 章 勞動契約"},{"no":"第16條","text":"雇主依第十一條或第十三條但書規定終止勞動契約者，其預告期間依左列各款之規定：\n一、繼續工作三個月以上一年未滿者，於十日前預告之。\n二、繼續工作一年以上三年未滿者，於二十日前預告之。\n三、繼續工作三年以上者，於三十日前預告之。\n勞工於接到前項預告後，為另謀工作得於工作時間請假外出。其請假時數，每星期不得超過二日之工作時間，請假期間之工資照給。\n雇主未依第一項規定期間預告而終止契約者，應給付預告期間之工資。","title":"第 二 章 勞動契約"},{"no":"第17條","text":"雇主依前條終止勞動契約者，應依下列規定發給勞工資遣費：\n一、在同一雇主之事業單位繼續工作，每滿一年發給相當於一個月平均工資之資遣費。\n二、依前款計算之剩餘月數，或工作未滿一年者，以比例計給之。未滿一個月者以一個月計。\n前項所定資遣費，雇主應於終止勞動契約三十日內發給。","title":"第 二 章 勞動契約"},{"no":"第17-1條","text":"要派單位不得於派遣事業單位與派遣勞工簽訂勞動契約前，有面試該派遣勞工或其他指定特定派遣勞工之行為。\n要派單位違反前項規定，且已受領派遣勞工勞務者，派遣勞工得於要派單位提供勞務之日起九十日內，以書面向要派單位提出訂定勞動契約之意思表示。\n要派單位應自前項派遣勞工意思表示到達之日起十日內，與其協商訂定勞動契約。逾期未協商或協商不成立者，視為雙方自期滿翌日成立勞動契約，並以派遣勞工於要派單位工作期間之勞動條件為勞動契約內容。\n派遣事業單位及要派單位不得因派遣勞工提出第二項意思表示，而予以解僱、降調、減薪、損害其依法令、契約或習慣上所應享有之權益，或其他不利之處分。\n派遣事業單位及要派單位為前項行為之一者，無效。\n派遣勞工因第二項及第三項規定與要派單位成立勞動契約者，其與派遣事業單位之勞動契約視為終止，且不負違反最低服務年限約定或返還訓練費用之責任。\n前項派遣事業單位應依本法或勞工退休金條例規定之給付標準及期限，發給派遣勞工退休金或資遣費。","title":"第 二 章 勞動契約"},{"no":"第18條","text":"有左列情形之一者，勞工不得向雇主請求加發預告期間工資及資遣費：\n一、依第十二條或第十五條規定終止勞動契約者。\n二、定期勞動契約期滿離職者。","title":"第 二 章 勞動契約"},{"no":"第19條","text":"勞動契約終止時，勞工如請求發給服務證明書，雇主或其代理人不得拒絕。","title":"第 二 章 勞動契約"},{"no":"第20條","text":"事業單位改組或轉讓時，除新舊雇主商定留用之勞工外，其餘勞工應依第十六條規定期間預告終止契約，並應依第十七條規定發給勞工資遣費。其留用勞工之工作年資，應由新雇主繼續予以承認。","title":"第 二 章 勞動契約"},{"no":"第21條","text":"工資由勞雇雙方議定之。但不得低於基本工資。\n前項基本工資，由中央主管機關設基本工資審議委員會擬訂後，報請行政院核定之。\n前項基本工資審議委員會之組織及其審議程序等事項，由中央主管機關另以辦法定之。","title":"第 三 章 工資"},{"no":"第22條","text":"工資之給付，應以法定通用貨幣為之。但基於習慣或業務性質，得於勞動契約內訂明一部以實物給付之。工資之一部以實物給付時，其實物之作價應公平合理，並適合勞工及其家屬之需要。\n工資應全額直接給付勞工。但法令另有規定或勞雇雙方另有約定者，不在此限。","title":"第 三 章 工資"},{"no":"第22-1條","text":"派遣事業單位積欠派遣勞工工資，經主管機關處罰或依第二十七條規定限期令其給付而屆期未給付者，派遣勞工得請求要派單位給付。要派單位應自派遣勞工請求之日起三十日內給付之。\n要派單位依前項規定給付者，得向派遣事業單位求償或扣抵要派契約之應付費用。","title":"第 三 章 工資"},{"no":"第23條","text":"工資之給付，除當事人有特別約定或按月預付者外，每月至少定期發給二次，並應提供工資各項目計算方式明細；按件計酬者亦同。\n雇主應置備勞工工資清冊，將發放工資、工資各項目計算方式明細、工資總額等事項記入。工資清冊應保存五年。","title":"第 三 章 工資"},{"no":"第24條","text":"雇主延長勞工工作時間者，其延長工作時間之工資，依下列標準加給：\n一、延長工作時間在二小時以內者，按平日每小時工資額加給三分之一以上。\n二、再延長工作時間在二小時以內者，按平日每小時工資額加給三分之二以上。\n三、依第三十二條第四項規定，延長工作時間者，按平日每小時工資額加倍發給。\n雇主使勞工於第三十六條所定休息日工作，工作時間在二小時以內者，其工資按平日每小時工資額另再加給一又三分之一以上；工作二小時後再繼續工作者，按平日每小時工資額另再加給一又三分之二以上。","title":"第 三 章 工資"},{"no":"第25條","text":"雇主對勞工不得因性別而有差別之待遇。工作相同、效率相同者，給付同等之工資。","title":"第 三 章 工資"},{"no":"第26條","text":"雇主不得預扣勞工工資作為違約金或賠償費用。","title":"第 三 章 工資"},{"no":"第27條","text":"雇主不按期給付工資者，主管機關得限期令其給付。","title":"第 三 章 工資"},{"no":"第28條","text":"雇主有歇業、清算或宣告破產之情事時，勞工之下列債權受償順序與第一順位抵押權、質權或留置權所擔保之債權相同，按其債權比例受清償；未獲清償部分，有最優先受清償之權：\n一、本於勞動契約所積欠之工資未滿六個月部分。\n二、雇主未依本法給付之退休金。\n三、雇主未依本法或勞工退休金條例給付之資遣費。\n雇主應按其當月僱用勞工投保薪資總額及規定之費率，繳納一定數額之積欠工資墊償基金，作為墊償下列各款之用：\n一、前項第一款積欠之工資數額。\n二、前項第二款與第三款積欠之退休金及資遣費，其合計數額以六個月平均工資為限。\n積欠工資墊償基金，累積至一定金額後，應降低費率或暫停收繳。\n第二項費率，由中央主管機關於萬分之十五範圍內擬訂，報請行政院核定之。\n雇主積欠之工資、退休金及資遣費，經勞工請求未獲清償者，由積欠工資墊償基金依第二項規定墊償之；雇主應於規定期限內，將墊款償還積欠工資墊償基金。\n積欠工資墊償基金，由中央主管機關設管理委員會管理之。基金之收繳有關業務，得由中央主管機關，委託勞工保險機構辦理之。基金墊償程序、收繳與管理辦法、第三項之一定金額及管理委員會組織規程，由中央主管機關定之。","title":"第 三 章 工資"},{"no":"第29條","text":"事業單位於營業年度終了結算，如有盈餘，除繳納稅捐、彌補虧損及提列股息、公積金外，對於全年工作並無過失之勞工，應給與獎金或分配紅利。","title":"第 三 章 工資"},{"no":"第30條","text":"勞工正常工作時間，每日不得超過八小時，每週不得超過四十小時。\n前項正常工作時間，雇主經工會同意，如事業單位無工會者，經勞資會議同意後，得將其二週內二日之正常工作時數，分配於其他工作日。其分配於其他工作日之時數，每日不得超過二小時。但每週工作總時數不得超過四十八小時。\n第一項正常工作時間，雇主經工會同意，如事業單位無工會者，經勞資會議同意後，得將八週內之正常工作時數加以分配。但每日正常工作時間不得超過八小時，每週工作總時數不得超過四十八小時。\n前二項規定，僅適用於經中央主管機關指定之行業。\n雇主應置備勞工出勤紀錄，並保存五年。\n前項出勤紀錄，應逐日記載勞工出勤情形至分鐘為止。勞工向雇主申請其出勤紀錄副本或影本時，雇主不得拒絕。\n雇主不得以第一項正常工作時間之修正，作為減少勞工工資之事由。\n第一項至第三項及第三十條之一之正常工作時間，雇主得視勞工照顧家庭成員需要，允許勞工於不變更每日正常工作時數下，在一小時範圍內，彈性調整工作開始及終止之時間。","title":"第 四 章 工作時間、休息、休假"},{"no":"第30-1條","text":"中央主管機關指定之行業，雇主經工會同意，如事業單位無工會者，經勞資會議同意後，其工作時間得依下列原則變更：\n一、四週內正常工作時數分配於其他工作日之時數，每日不得超過二小時，不受前條第二項至第四項規定之限制。\n二、當日正常工作時間達十小時者，其延長之工作時間不得超過二小時。\n三、女性勞工，除妊娠或哺乳期間者外，於夜間工作，不受第四十九條第一項之限制。但雇主應提供必要之安全衛生設施。\n依中華民國八十五年十二月二十七日修正施行前第三條規定適用本法之行業，除第一項第一款之農、林、漁、牧業外，均不適用前項規定。","title":"第 四 章 工作時間、休息、休假"},{"no":"第31條","text":"在坑道或隧道內工作之勞工，以入坑口時起至出坑口時止為工作時間。","title":"第 四 章 工作時間、休息、休假"},{"no":"第32條","text":"雇主有使勞工在正常工作時間以外工作之必要者，雇主經工會同意，如事業單位無工會者，經勞資會議同意後，得將工作時間延長之。\n前項雇主延長勞工之工作時間連同正常工作時間，一日不得超過十二小時；延長之工作時間，一個月不得超過四十六小時，但雇主經工會同意，如事業單位無工會者，經勞資會議同意後，延長之工作時間，一個月不得超過五十四小時，每三個月不得超過一百三十八小時。\n雇主僱用勞工人數在三十人以上，依前項但書規定延長勞工工作時間者，應報當地主管機關備查。\n因天災、事變或突發事件，雇主有使勞工在正常工作時間以外工作之必要者，得將工作時間延長之。但應於延長開始後二十四小時內通知工會；無工會組織者，應報當地主管機關備查。延長之工作時間，雇主應於事後補給勞工以適當之休息。\n在坑內工作之勞工，其工作時間不得延長。但以監視為主之工作，或有前項所定之情形者，不在此限。","title":"第 四 章 工作時間、休息、休假"},{"no":"第32-1條","text":"雇主依第三十二條第一項及第二項規定使勞工延長工作時間，或使勞工於第三十六條所定休息日工作後，依勞工意願選擇補休並經雇主同意者，應依勞工工作之時數計算補休時數。\n前項之補休，其補休期限由勞雇雙方協商；補休期限屆期或契約終止未補休之時數，應依延長工作時間或休息日工作當日之工資計算標準發給工資；未發給工資者，依違反第二十四條規定論處。","title":"第 四 章 工作時間、休息、休假"},{"no":"第33條","text":"第三條所列事業，除製造業及礦業外，因公眾之生活便利或其他特殊原因，有調整第三十條、第三十二條所定之正常工作時間及延長工作時間之必要者，得由當地主管機關會商目的事業主管機關及工會，就必要之限度內以命令調整之。","title":"第 四 章 工作時間、休息、休假"},{"no":"第34條","text":"勞工工作採輪班制者，其工作班次，每週更換一次。但經勞工同意者不在此限。\n依前項更換班次時，至少應有連續十一小時之休息時間。但因工作特性或特殊原因，經中央目的事業主管機關商請中央主管機關公告者，得變更休息時間不少於連續八小時。\n雇主依前項但書規定變更休息時間者，應經工會同意，如事業單位無工會者，經勞資會議同意後，始得為之。雇主僱用勞工人數在三十人以上者，應報當地主管機關備查。","title":"第 四 章 工作時間、休息、休假"},{"no":"第35條","text":"勞工繼續工作四小時，至少應有三十分鐘之休息。但實行輪班制或其工作有連續性或緊急性者，雇主得在工作時間內，另行調配其休息時間。","title":"第 四 章 工作時間、休息、休假"},{"no":"第36條","text":"勞工每七日中應有二日之休息，其中一日為例假，一日為休息日。\n雇主有下列情形之一，不受前項規定之限制：\n一、依第三十條第二項規定變更正常工作時間者，勞工每七日中至少應有一日之例假，每二週內之例假及休息日至少應有四日。\n二、依第三十條第三項規定變更正常工作時間者，勞工每七日中至少應有一日之例假，每八週內之例假及休息日至少應有十六日。\n三、依第三十條之一規定變更正常工作時間者，勞工每二週內至少應有二日之例假，每四週內之例假及休息日至少應有八日。\n雇主使勞工於休息日工作之時間，計入第三十二條第二項所定延長工作時間總數。但因天災、事變或突發事件，雇主有使勞工於休息日工作之必要者，其工作時數不受第三十二條第二項規定之限制。\n經中央目的事業主管機關同意，且經中央主管機關指定之行業，雇主得將第一項、第二項第一款及第二款所定之例假，於每七日之週期內調整之。\n前項所定例假之調整，應經工會同意，如事業單位無工會者，經勞資會議同意後，始得為之。雇主僱用勞工人數在三十人以上者，應報當地主管機關備查。","title":"第 四 章 工作時間、休息、休假"},{"no":"第37條","text":"內政部所定應放假之紀念日、節日、勞動節及其他中央主管機關指定應放假日，均應休假。\n中華民國一百零五年十二月六日修正之前項規定，自一百零六年一月一日施行。","title":"第 四 章 工作時間、休息、休假"},{"no":"第38條","text":"勞工在同一雇主或事業單位，繼續工作滿一定期間者，應依下列規定給予特別休假：\n一、六個月以上一年未滿者，三日。\n二、一年以上二年未滿者，七日。\n三、二年以上三年未滿者，十日。\n四、三年以上五年未滿者，每年十四日。\n五、五年以上十年未滿者，每年十五日。\n六、十年以上者，每一年加給一日，加至三十日為止。\n前項之特別休假期日，由勞工排定之。但雇主基於企業經營上之急迫需求或勞工因個人因素，得與他方協商調整。\n雇主應於勞工符合第一項所定之特別休假條件時，告知勞工依前二項規定排定特別休假。\n勞工之特別休假，因年度終結或契約終止而未休之日數，雇主應發給工資。但年度終結未休之日數，經勞雇雙方協商遞延至次一年度實施者，於次一年度終結或契約終止仍未休之日數，雇主應發給工資。\n雇主應將勞工每年特別休假之期日及未休之日數所發給之工資數額，記載於第二十三條所定之勞工工資清冊，並每年定期將其內容以書面通知勞工。\n勞工依本條主張權利時，雇主如認為其權利不存在，應負舉證責任。","title":"第 四 章 工作時間、休息、休假"},{"no":"第39條","text":"第三十六條所定之例假、休息日、第三十七條所定之休假及第三十八條所定之特別休假，工資應由雇主照給。雇主經徵得勞工同意於休假日工作者，工資應加倍發給。因季節性關係有趕工必要，經勞工或工會同意照常工作者，亦同。","title":"第 四 章 工作時間、休息、休假"},{"no":"第40條","text":"因天災、事變或突發事件，雇主認有繼續工作之必要時，得停止第三十六條至第三十八條所定勞工之假期。但停止假期之工資，應加倍發給，並應於事後補假休息。\n前項停止勞工假期，應於事後二十四小時內，詳述理由，報請當地主管機關核備。","title":"第 四 章 工作時間、休息、休假"},{"no":"第41條","text":"公用事業之勞工，當地主管機關認有必要時，得停止第三十八條所定之特別休假。假期內之工資應由雇主加倍發給。","title":"第 四 章 工作時間、休息、休假"},{"no":"第42條","text":"勞工因健康或其他正當理由，不能接受正常工作時間以外之工作者，雇主不得強制其工作。","title":"第 四 章 工作時間、休息、休假"},{"no":"第43條","text":"勞工因婚、喪、疾病或其他正當事由得請假；請假應給之假期及事假以外期間內工資給付之最低標準，由中央主管機關定之。","title":"第 四 章 工作時間、休息、休假"},{"no":"第44條","text":"十五歲以上未滿十六歲之受僱從事工作者，為童工。\n童工及十六歲以上未滿十八歲之人，不得從事危險性或有害性之工作。","title":"第 五 章 童工、女工"},{"no":"第45條","text":"雇主不得僱用未滿十五歲之人從事工作。但國民中學畢業或經主管機關認定其工作性質及環境無礙其身心健康而許可者，不在此限。\n前項受僱之人，準用童工保護之規定。\n第一項工作性質及環境無礙其身心健康之認定基準、審查程序及其他應遵行事項之辦法，由中央主管機關依勞工年齡、工作性質及受國民義務教育之時間等因素定之。\n未滿十五歲之人透過他人取得工作為第三人提供勞務，或直接為他人提供勞務取得報酬未具勞僱關係者，準用前項及童工保護之規定。","title":"第 五 章 童工、女工"},{"no":"第46條","text":"未滿十八歲之人受僱從事工作者，雇主應置備其法定代理人同意書及其年齡證明文件。","title":"第 五 章 童工、女工"},{"no":"第47條","text":"童工每日之工作時間不得超過八小時，每週之工作時間不得超過四十小時，例假日不得工作。","title":"第 五 章 童工、女工"},{"no":"第48條","text":"童工不得於午後八時至翌晨六時之時間內工作。","title":"第 五 章 童工、女工"},{"no":"第49條","text":"雇主不得使女工於午後十時至翌晨六時之時間內工作。但雇主經工會同意，如事業單位無工會者，經勞資會議同意後，且符合下列各款規定者，不在此限：\n一、提供必要之安全衛生設施。\n二、無大眾運輸工具可資運用時，提供交通工具或安排女工宿舍。\n前項第一款所稱必要之安全衛生設施，其標準由中央主管機關定之。但雇主與勞工約定之安全衛生設施優於本法者，從其約定。\n女工因健康或其他正當理由，不能於午後十時至翌晨六時之時間內工作者，雇主不得強制其工作。\n第一項規定，於因天災、事變或突發事件，雇主必須使女工於午後十時至翌晨六時之時間內工作時，不適用之。\n第一項但書及前項規定，於妊娠或哺乳期間之女工，不適用之。","title":"第 五 章 童工、女工"},{"no":"第50條","text":"女工分娩前後，應停止工作，給予產假八星期；妊娠三個月以上流產者，應停止工作，給予產假四星期。\n前項女工受僱工作在六個月以上者，停止工作期間工資照給；未滿六個月者減半發給。","title":"第 五 章 童工、女工"},{"no":"第51條","text":"女工在妊娠期間，如有較為輕易之工作，得申請改調，雇主不得拒絕，並不得減少其工資。","title":"第 五 章 童工、女工"},{"no":"第52條","text":"子女未滿一歲須女工親自哺乳者，於第三十五條規定之休息時間外，雇主應每日另給哺乳時間二次，每次以三十分鐘為度。\n前項哺乳時間，視為工作時間。","title":"第 五 章 童工、女工"},{"no":"第53條","text":"勞工有下列情形之一，得自請退休：\n一、工作十五年以上年滿五十五歲者。\n二、工作二十五年以上者。\n三、工作十年以上年滿六十歲者。","title":"第 六 章 退休"},{"no":"第54條","text":"勞工非有下列情形之一，雇主不得強制其退休：\n一、年滿六十五歲者。\n二、身心障礙不堪勝任工作者。\n前項第一款所規定之年齡，得由勞雇雙方協商延後之；對於擔任具有危險、堅強體力等特殊性質之工作者，得由事業單位報請中央主管機關予以調整，但不得少於五十五歲。","title":"第 六 章 退休"},{"no":"第55條","text":"勞工退休金之給與標準如下：\n一、按其工作年資，每滿一年給與兩個基數。但超過十五年之工作年資，每滿一年給與一個基數，最高總數以四十五個基數為限。未滿半年者以半年計；滿半年者以一年計。\n二、依第五十四條第一項第二款規定，強制退休之勞工，其身心障礙係因執行職務所致者，依前款規定加給百分之二十。\n前項第一款退休金基數之標準，係指核准退休時一個月平均工資。\n第一項所定退休金，雇主應於勞工退休之日起三十日內給付，如無法一次發給時，得報經主管機關核定後，分期給付。本法施行前，事業單位原定退休標準優於本法者，從其規定。","title":"第 六 章 退休"},{"no":"第56條","text":"雇主應依勞工每月薪資總額百分之二至百分之十五範圍內，按月提撥勞工退休準備金，專戶存儲，並不得作為讓與、扣押、抵銷或擔保之標的；其提撥之比率、程序及管理等事項之辦法，由中央主管機關擬訂，報請行政院核定之。\n雇主應於每年年度終了前，估算前項勞工退休準備金專戶餘額，該餘額不足給付次一年度內預估成就第五十三條或第五十四條第一項第一款退休條件之勞工，依前條計算之退休金數額者，雇主應於次年度三月底前一次提撥其差額，並送事業單位勞工退休準備金監督委員會審議。\n第一項雇主按月提撥之勞工退休準備金匯集為勞工退休基金，由中央主管機關設勞工退休基金監理委員會管理之；其組織、會議及其他相關事項，由中央主管機關定之。\n前項基金之收支、保管及運用，由中央主管機關會同財政部委託金融機構辦理。最低收益不得低於當地銀行二年定期存款利率之收益；如有虧損，由國庫補足之。基金之收支、保管及運用辦法，由中央主管機關擬訂，報請行政院核定之。\n雇主所提撥勞工退休準備金，應由勞工與雇主共同組織勞工退休準備金監督委員會監督之。委員會中勞工代表人數不得少於三分之二；其組織準則，由中央主管機關定之。\n雇主按月提撥之勞工退休準備金比率之擬訂或調整，應經事業單位勞工退休準備金監督委員會審議通過，並報請當地主管機關核定。\n金融機構辦理核貸業務，需查核該事業單位勞工退休準備金提撥狀況之必要資料時，得請當地主管機關提供。\n金融機構依前項取得之資料，應負保密義務，並確實辦理資料安全稽核作業。\n前二項有關勞工退休準備金必要資料之內容、範圍、申請程序及其他應遵行事項之辦法，由中央主管機關會商金融監督管理委員會定之。","title":"第 六 章 退休"},{"no":"第57條","text":"勞工工作年資以服務同一事業者為限。但受同一雇主調動之工作年資，及依第二十條規定應由新雇主繼續予以承認之年資，應予併計。","title":"第 六 章 退休"},{"no":"第58條","text":"勞工請領退休金之權利，自退休之次月起，因五年間不行使而消滅。\n勞工請領退休金之權利，不得讓與、抵銷、扣押或供擔保。\n勞工依本法規定請領勞工退休金者，得檢具證明文件，於金融機構開立專戶，專供存入勞工退休金之用。\n前項專戶內之存款，不得作為抵銷、扣押、供擔保或強制執行之標的。","title":"第 六 章 退休"},{"no":"第59條","text":"勞工因遭遇職業災害而致死亡、失能、傷害或疾病時，雇主應依下列規定予以補償。但如同一事故，依勞工保險條例或其他法令規定，已由雇主支付費用補償者，雇主得予以抵充之：\n一、勞工受傷或罹患職業病時，雇主應補償其必需之醫療費用。職業病之種類及其醫療範圍，依勞工保險條例有關之規定。\n二、勞工在醫療中不能工作時，雇主應按其原領工資數額予以補償。但醫療期間屆滿二年仍未能痊癒，經指定之醫院診斷，審定為喪失原有工作能力，且不合第三款之失能給付標準者，雇主得一次給付四十個月之平均工資後，免除此項工資補償責任。\n三、勞工經治療終止後，經指定之醫院診斷，審定其遺存障害者，雇主應按其平均工資及其失能程度，一次給予失能補償。失能補償標準，依勞工保險條例有關之規定。\n四、勞工遭遇職業傷害或罹患職業病而死亡時，雇主除給與五個月平均工資之喪葬費外，並應一次給與其遺屬四十個月平均工資之死亡補償。其遺屬受領死亡補償之順位如下：\n（一）配偶及子女。\n（二）父母。\n（三）祖父母。\n（四）孫子女。\n（五）兄弟姐妹。","title":"第 七 章 職業災害補償"},{"no":"第60條","text":"雇主依前條規定給付之補償金額，得抵充就同一事故所生損害之賠償金額。","title":"第 七 章 職業災害補償"},{"no":"第61條","text":"第五十九條之受領補償權，自得受領之日起，因二年間不行使而消滅。\n受領補償之權利，不因勞工之離職而受影響，且不得讓與、抵銷、扣押或供擔保。\n勞工或其遺屬依本法規定受領職業災害補償金者，得檢具證明文件，於金融機構開立專戶，專供存入職業災害補償金之用。\n前項專戶內之存款，不得作為抵銷、扣押、供擔保或強制執行之標的。","title":"第 七 章 職業災害補償"},{"no":"第62條","text":"事業單位以其事業招人承攬，如有再承攬時，承攬人或中間承攬人，就各該承攬部分所使用之勞工，均應與最後承攬人，連帶負本章所定雇主應負職業災害補償之責任。\n事業單位或承攬人或中間承攬人，為前項之災害補償時，就其所補償之部分，得向最後承攬人求償。","title":"第 七 章 職業災害補償"},{"no":"第63條","text":"承攬人或再承攬人工作場所，在原事業單位工作場所範圍內，或為原事業單位提供者，原事業單位應督促承攬人或再承攬人，對其所僱用勞工之勞動條件應符合有關法令之規定。\n事業單位違背職業安全衛生法有關對於承攬人、再承攬人應負責任之規定，致承攬人或再承攬人所僱用之勞工發生職業災害時，應與該承攬人、再承攬人負連帶補償責任。","title":"第 七 章 職業災害補償"},{"no":"第63-1條","text":"要派單位使用派遣勞工發生職業災害時，要派單位應與派遣事業單位連帶負本章所定雇主應負職業災害補償之責任。\n前項之職業災害依勞工保險條例或其他法令規定，已由要派單位或派遣事業單位支付費用補償者，得主張抵充。\n要派單位及派遣事業單位因違反本法或有關安全衛生規定，致派遣勞工發生職業災害時，應連帶負損害賠償之責任。\n要派單位或派遣事業單位依本法規定給付之補償金額，得抵充就同一事故所生損害之賠償金額。","title":"第 七 章 職業災害補償"},{"no":"第64條","text":"雇主不得招收未滿十五歲之人為技術生。但國民中學畢業者，不在此限。\n稱技術生者，指依中央主管機關規定之技術生訓練職類中以學習技能為目的，依本章之規定而接受雇主訓練之人。\n本章規定，於事業單位之養成工、見習生、建教合作班之學生及其他與技術生性質相類之人，準用之。","title":"第 八 章 技術生"},{"no":"第65條","text":"雇主招收技術生時，須與技術生簽訂書面訓練契約一式三份，訂明訓練項目、訓練期限、膳宿負擔、生活津貼、相關教學、勞工保險、結業證明、契約生效與解除之條件及其他有關雙方權利、義務事項，由當事人分執，並送主管機關備案。\n前項技術生如為未成年人，其訓練契約，應得法定代理人之允許。","title":"第 八 章 技術生"},{"no":"第66條","text":"雇主不得向技術生收取有關訓練費用。","title":"第 八 章 技術生"},{"no":"第67條","text":"技術生訓練期滿，雇主得留用之，並應與同等工作之勞工享受同等之待遇。雇主如於技術生訓練契約內訂明留用期間，應不得超過其訓練期間。","title":"第 八 章 技術生"},{"no":"第68條","text":"技術生人數，不得超過勞工人數四分之一。勞工人數不滿四人者，以四人計。","title":"第 八 章 技術生"},{"no":"第69條","text":"本法第四章工作時間、休息、休假，第五章童工、女工，第七章災害補償及其他勞工保險等有關規定，於技術生準用之。\n技術生災害補償所採薪資計算之標準，不得低於基本工資。","title":"第 八 章 技術生"},{"no":"第70條","text":"雇主僱用勞工人數在三十人以上者，應依其事業性質，就左列事項訂立工作規則，報請主管機關核備後並公開揭示之：\n一、工作時間、休息、休假、國定紀念日、特別休假及繼續性工作之輪班方法。\n二、工資之標準、計算方法及發放日期。\n三、延長工作時間。\n四、津貼及獎金。\n五、應遵守之紀律。\n六、考勤、請假、獎懲及升遷。\n七、受僱、解僱、資遣、離職及退休。\n八、災害傷病補償及撫卹。\n九、福利措施。\n十、勞雇雙方應遵守勞工安全衛生規定。\n十一、勞雇雙方溝通意見加強合作之方法。\n十二、其他。","title":"第 九 章 工作規則"},{"no":"第71條","text":"工作規則，違反法令之強制或禁止規定或其他有關該事業適用之團體協約規定者，無效。","title":"第 九 章 工作規則"},{"no":"第72條","text":"中央主管機關，為貫徹本法及其他勞工法令之執行，設勞工檢查機構或授權直轄市主管機關專設檢查機構辦理之；直轄市、縣（市）主管機關於必要時，亦得派員實施檢查。\n前項勞工檢查機構之組織，由中央主管機關定之。","title":"第 十 章 監督與檢查"},{"no":"第73條","text":"檢查員執行職務，應出示檢查證，各事業單位不得拒絕。事業單位拒絕檢查時，檢查員得會同當地主管機關或警察機關強制檢查之。\n檢查員執行職務，得就本法規定事項，要求事業單位提出必要之報告、紀錄、帳冊及有關文件或書面說明。如需抽取物料、樣品或資料時，應事先通知雇主或其代理人並掣給收據。","title":"第 十 章 監督與檢查"},{"no":"第74條","text":"勞工發現事業單位違反本法及其他勞工法令規定時，得向雇主、主管機關或檢查機構申訴。\n雇主不得因勞工為前項申訴，而予以解僱、降調、減薪、損害其依法令、契約或習慣上所應享有之權益，或其他不利之處分。\n雇主為前項行為之一者，無效。\n主管機關或檢查機構於接獲第一項申訴後，應為必要之調查，並於六十日內將處理情形，以書面通知勞工。\n主管機關或檢查機構應對申訴人身分資料嚴守秘密，不得洩漏足以識別其身分之資訊。\n違反前項規定者，除公務員應依法追究刑事與行政責任外，對因此受有損害之勞工，應負損害賠償責任。\n主管機關受理檢舉案件之保密及其他應遵行事項之辦法，由中央主管機關定之。","title":"第 十 章 監督與檢查"},{"no":"第75條","text":"違反第五條規定者，處五年以下有期徒刑、拘役或科或併科新臺幣七十五萬元以下罰金。","title":"第 十一 章 罰則"},{"no":"第76條","text":"違反第六條規定者，處三年以下有期徒刑、拘役或科或併科新臺幣四十五萬元以下罰金。","title":"第 十一 章 罰則"},{"no":"第77條","text":"違反第四十二條、第四十四條第二項、第四十五條第一項、第四十七條、第四十八條、第四十九條第三項或第六十四條第一項規定者，處六個月以下有期徒刑、拘役或科或併科新臺幣三十萬元以下罰金。","title":"第 十一 章 罰則"},{"no":"第78條","text":"未依第十七條、第十七條之一第七項、第五十五條規定之標準或期限給付者，處新臺幣三十萬元以上一百五十萬元以下罰鍰，並限期令其給付，屆期未給付者，應按次處罰。\n違反第十三條、第十七條之一第一項、第四項、第二十六條、第五十條、第五十一條或第五十六條第二項規定者，處新臺幣九萬元以上四十五萬元以下罰鍰。","title":"第 十一 章 罰則"},{"no":"第79條","text":"有下列各款規定行為之一者，處新臺幣二萬元以上一百萬元以下罰鍰：\n一、違反第二十一條第一項、第二十二條至第二十五條、第三十條第一項至第三項、第六項、第七項、第三十二條、第三十四條至第四十一條、第四十九條第一項或第五十九條規定。\n二、違反主管機關依第二十七條限期給付工資或第三十三條調整工作時間之命令。\n三、違反中央主管機關依第四十三條所定假期或事假以外期間內工資給付之最低標準。\n違反第三十條第五項或第四十九條第五項規定者，處新臺幣九萬元以上四十五萬元以下罰鍰。\n違反第七條、第九條第一項、第十六條、第十九條、第二十八條第二項、第四十六條、第五十六條第一項、第六十五條第一項、第六十六條至第六十八條、第七十條或第七十四條第二項規定者，處新臺幣二萬元以上三十萬元以下罰鍰。\n有前三項規定行為之一者，主管機關得依事業規模、違反人數或違反情節，加重其罰鍰至法定罰鍰最高額二分之一。","title":"第 十一 章 罰則"},{"no":"第79-1條","text":"違反第四十五條第二項、第四項、第六十四條第三項及第六十九條第一項準用規定之處罰，適用本法罰則章規定。","title":"第 十一 章 罰則"},{"no":"第80條","text":"拒絕、規避或阻撓勞工檢查員依法執行職務者，處新臺幣三萬元以上十五萬元以下罰鍰。","title":"第 十一 章 罰則"},{"no":"第80-1條","text":"違反本法經主管機關處以罰鍰者，主管機關應公布其事業單位或事業主之名稱、負責人姓名、處分期日、違反條文及罰鍰金額，並限期令其改善；屆期未改善者，應按次處罰。\n主管機關裁處罰鍰，得審酌與違反行為有關之勞工人數、累計違法次數或未依法給付之金額，為量罰輕重之標準。","title":"第 十一 章 罰則"},{"no":"第81條","text":"法人之代表人、法人或自然人之代理人、受僱人或其他從業人員，因執行業務違反本法規定，除依本章規定處罰行為人外，對該法人或自然人並應處以各該條所定之罰金或罰鍰。但法人之代表人或自然人對於違反之發生，已盡力為防止行為者，不在此限。\n法人之代表人或自然人教唆或縱容為違反之行為者，以行為人論。","title":"第 十一 章 罰則"},{"no":"第82條","text":"本法所定之罰鍰，經主管機關催繳，仍不繳納時，得移送法院強制執行。","title":"第 十一 章 罰則"},{"no":"第83條","text":"為協調勞資關係，促進勞資合作，提高工作效率，事業單位應舉辦勞資會議。其辦法由中央主管機關會同經濟部訂定，並報行政院核定。","title":"第 十二 章 附則"},{"no":"第84條","text":"公務員兼具勞工身分者，其有關任（派）免、薪資、獎懲、退休、撫卹及保險（含職業災害）等事項，應適用公務員法令之規定。但其他所定勞動條件優於本法規定者，從其規定。","title":"第 十二 章 附則"},{"no":"第84-1條","text":"經中央主管機關核定公告之下列工作者，得由勞雇雙方另行約定，工作時間、例假、休假、女性夜間工作，並報請當地主管機關核備，不受第三十條、第三十二條、第三十六條、第三十七條、第四十九條規定之限制。\n一、監督、管理人員或責任制專業人員。\n二、監視性或間歇性之工作。\n三、其他性質特殊之工作。\n前項約定應以書面為之，並應參考本法所定之基準且不得損及勞工之健康及福祉。","title":"第 十二 章 附則"},{"no":"第84-2條","text":"勞工工作年資自受僱之日起算，適用本法前之工作年資，其資遣費及退休金給與標準，依其當時應適用之法令規定計算；當時無法令可資適用者，依各該事業單位自訂之規定或勞雇雙方之協商計算之。適用本法後之工作年資，其資遣費及退休金給與標準，依第十七條及第五十五條規定計算。","title":"第 十二 章 附則"},{"no":"第85條","text":"本法施行細則，由中央主管機關擬定，報請行政院核定。","title":"第 十二 章 附則"},{"no":"第86條","text":"本法自公布日施行。\n本法中華民國八十九年六月二十八日修正公布之第三十條第一項及第二項，自九十年一月一日施行；一百零四年二月四日修正公布之第二十八條第一項，自公布後八個月施行；一百零四年六月三日修正公布之條文，自一百零五年一月一日施行；一百零五年十二月二十一日修正公布之第三十四條第二項施行日期，由行政院定之、第三十七條及第三十八條，自一百零六年一月一日施行。\n本法中華民國一百零七年一月十日修正之條文，自一百零七年三月一日施行。","title":"第 十二 章 附則"}],"tags":["勞動","勞基法","約用","臨時人員","工友"],"note":"第 3 條適用範圍；第 84 條：公務員兼具勞工身分者，其任（派）免、薪資、獎懲、退休、撫卹及保險事項，應適用公務員法令。公部門臨時人員自 97.1.1 起、技工工友自 87.7.1 起經勞動部（勞委會）公告適用。"},{"id":"C02","name":"勞工保險條例","pcode":"N0050001","level":"法律","authority":"勞動部","category":"行政＞勞動部＞勞動保險目","modified_date":"2026-01-21","history":[{"date":"1958-07-21","summary":"中華民國四十七年七月二十一日總統令制定公布全文 87 條（附表一、二、三）、四十九年二月二十四日行政院令臺灣省施行"},{"date":"1968-07-23","summary":"中華民國五十七年七月二十三日總統令修正公布全文 88 條（附表一、二）"},{"date":"1973-04-25","summary":"中華民國六十二年四月二十五日總統（62）台總（一）義字第 1858 號令修正公布第 10、18 條條文"},{"date":"1979-02-19","summary":"中華民國六十八年二月十九日總統（68）台總（一）義字第 0854 號令修正公布全文 79 條（附一、二）"},{"date":"1988-02-03","summary":"中華民國七十七年二月三日總統（77）華總（一）義字第 0319 號令修正公布第 4、6、8～17、19～21、27、28、31、32、41、43、44、51、58、59、61、64、72、76 條條文；增訂第 9-1、21-1、39-1 條條文；並刪除第 60、75 條條文"},{"date":"1995-02-28","summary":"中華民國八十四年二月二十八日總統（84）華總（一）義字第 1235 號令修正公布第 5、13、15 條條文；並增訂第 76-1 條條文"},{"date":"2000-07-19","summary":"中華民國八十九年七月十九日總統（89）華總一義字第 8900177660 號令修正公布第 4、15、67～69 條條文"},{"date":"2001-12-19","summary":"中華民國九十年十二月十九日總統（90）華總一義字第 9000252750 號令修正公布第 12、58 條條文"},{"date":"2003-01-20","summary":"中華民國九十二年一月二十日總統華總一義字第 09200012650 號令修正公布第 29、67 條條文"},{"date":"2003-01-29","summary":"中華民國九十二年一月二十九日總統華總一義字第 09200015210 號令修正公布第 10、13、28、72 條條文；並增訂第 14-1、14-2、20-1、42-1 條條文"},{"date":"2008-05-14","summary":"中華民國九十七年五月十四日總統華總一義字第 09700055081 號令修正公布第 17 條條文"},{"date":"2008-08-13","summary":"中華民國九十七年八月十三日總統華總一義字第 09700153201 號令修正公布第 2、13、19～20-1、53～59、63～65、79 條條文及第四章第五節節名；增訂第 54-1、54-2、58-1、58-2、63-1～63-4、65-1～65-5、74-1、74-2 條條文及第四章第八節節名；刪除第 21、21-1、38、47、61 條條文；依第 79 條規定：除第 54-1 條第 2 項「職業輔導評量及個別化之專業評估機制」自公布後五年施行外，其餘修正條文施行日期由行政院定之中華民國九十七年十月九日行政院院臺勞字第 0970039730 號令發布除第 54-1 條已明定施行日期及第 13 條第 3 項、第 4 項定自九十九年一月一日施行外，其餘條文定自九十八年一月一日施行"},{"date":"2009-01-23","summary":"中華民國九十八年一月二十三日總統華總一義字第 09800015971 號令修正公布第 20 條條文"},{"date":"2009-04-22","summary":"中華民國九十八年四月二十二日總統華總一義字第 09800094011 號令修正公布第 72 條條文"},{"date":"2009-11-25","summary":"中華民國九十八年十一月二十五日總統華總一義字第 09800292201號令修正公布第 29 條條文"},{"date":"2011-04-27","summary":"中華民國一百年四月二十七日總統華總一義字第 10000079401 號令修正公布第 15、44、72、79 條條文；依第 79 條規定：自公布日施行，但第 15 條之施行日期，由行政院定之中華民國一百零一年六月一日行政院院臺勞字第 1010132810 號令發布第 15 條定自一百零一年七月一日施行"},{"date":"2012-12-05","summary":"中華民國一百零一年十二月五日總統華總一義字第 10100269291 號令修正公布第 6、9 條條文；並增訂第 29-1 條條文"},{"date":"2012-12-19","summary":"中華民國一百零一年十二月十九日總統華總一義字第 10100279771號令修正公布第 30 條條文"},{"date":"2013-05-08","summary":"中華民國一百零二年五月八日總統華總一義字第 10200082741 號令修正公布第 54-1 條條文；第 2 項規定自一百零二年八月十三日施行"},{"date":"2014-01-08","summary":"中華民國一百零三年一月八日總統華總一義字第 10300000661 號令修正公布第 29 條條文中華民國一百零三年二月十四日行政院院臺規字第 1030124618 號公告第 4 條所列屬「行政院勞工委員會」之權責事項，自一百零三年二月十七日起改由「勞動部」管轄；第 5 條第 1 項、第 2 項、第 67 條第 1 項第 4 款、第 3 項、第 68 條所列屬「勞工保險局」之權責事項，自一百零三年二月十七日起改由「勞動部勞工保險局」管轄；第 67 條第 1 項第 1 款、第 2 款、第 3 款、第 5款、第 2 項所列屬「勞工保險局」之權責事項，自一百零三年二月十七日起，勞工保險基金投資及運用業務，改由「勞動部勞動基金運用局」管轄；其他業務改由「勞動部勞工保險局」管轄；第 5 條第1 項、第 2 項、第 28 條、第 65 條之 5 第 1 項、第 2 項、第 67 條第 1 項序文、第 68 條所列屬「勞工保險監理委員會」之權責事項，自一百零三年二月十七日起改由「勞動部」管轄"},{"date":"2014-05-28","summary":"中華民國一百零三年五月二十八日總統華總一義字第 10300084341號令修正公布第 32 條條文"},{"date":"2015-07-01","summary":"中華民國一百零四年七月一日總統華總一義字第 10400077061 號令修正公布第 4 條條文；增訂第 17-1 條條文"},{"date":"2021-04-28","summary":"中華民國一百十年四月二十八日總統華總一義字第 11000038701 號令修正公布第 29 條條文"},{"date":"2026-01-21","summary":"中華民國一百十五年一月二十一日總統華總一義字第 11500003951號令修正公布第 29、66、69 條條文"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0050001","articles":[{"no":"第1條","text":"為保障勞工生活，促進社會安全，制定本條例；本條例未規定者，適用其他有關法律。","title":"第 一 章 總則"},{"no":"第2條","text":"勞工保險之分類及其給付種類如下：\n一、普通事故保險：分生育、傷病、失能、老年及死亡五種給付。\n二、職業災害保險：分傷病、醫療、失能及死亡四種給付。","title":"第 一 章 總則"},{"no":"第3條","text":"勞工保險之一切帳冊、單據及業務收支，均免課稅捐。","title":"第 一 章 總則"},{"no":"第4條","text":"勞工保險之主管機關：在中央為勞動部；在直轄市為直轄市政府。","title":"第 一 章 總則"},{"no":"第5條","text":"中央主管機關統籌全國勞工保險業務，設勞工保險局為保險人，辦理勞工保險業務。為監督勞工保險業務及審議保險爭議事項，由有關政府代表、勞工代表、資方代表及專家各佔四分之一為原則，組織勞工保險監理委員會行之。\n勞工保險局之組織及勞工保險監理委員會之組織，另以法律定之。\n勞工保險爭議事項審議辦法，由中央主管機關擬訂，報請行政院核定之。","title":"第 二 章 保險人、投保單位及被保險人"},{"no":"第6條","text":"年滿十五歲以上，六十五歲以下之左列勞工，應以其雇主或所屬團體或所屬機構為投保單位，全部參加勞工保險為被保險人：\n一、受僱於僱用勞工五人以上之公、民營工廠、礦場、鹽場、農場、牧場、林場、茶場之產業勞工及交通、公用事業之員工。\n二、受僱於僱用五人以上公司、行號之員工。\n三、受僱於僱用五人以上之新聞、文化、公益及合作事業之員工。\n四、依法不得參加公務人員保險或私立學校教職員保險之政府機關及公、私立學校之員工。\n五、受僱從事漁業生產之勞動者。\n六、在政府登記有案之職業訓練機構接受訓練者。\n七、無一定雇主或自營作業而參加職業工會者。\n八、無一定雇主或自營作業而參加漁會之甲類會員。\n前項規定，於經主管機關認定其工作性質及環境無礙身心健康之未滿十五歲勞工亦適用之。\n前二項所稱勞工，包括在職外國籍員工。","title":"第 二 章 保險人、投保單位及被保險人"},{"no":"第7條","text":"前條第一項第一款至第三款規定之勞工參加勞工保險後，其投保單位僱用勞工減至四人以下時，仍應繼續參加勞工保險。","title":"第 二 章 保險人、投保單位及被保險人"},{"no":"第8條","text":"左列人員得準用本條例之規定，參加勞工保險：\n一、受僱於第六條第一項各款規定各業以外之員工。\n二、受僱於僱用未滿五人之第六條第一項第一款至第三款規定各業之員工。\n三、實際從事勞動之雇主。\n四、參加海員總工會或船長公會為會員之外僱船員。\n前項人員參加保險後，非依本條例規定，不得中途退保。\n第一項第三款規定之雇主，應與其受僱員工，以同一投保單位參加勞工保險。","title":"第 二 章 保險人、投保單位及被保險人"},{"no":"第9條","text":"被保險人有左列情形之一者，得繼續參加勞工保險：\n一、應徵召服兵役者。\n二、派遣出國考察、研習或提供服務者。\n三、因傷病請假致留職停薪，普通傷病未超過一年，職業災害未超過二年者。\n四、在職勞工，年逾六十五歲繼續工作者。\n五、因案停職或被羈押，未經法院判決確定者。","title":"第 二 章 保險人、投保單位及被保險人"},{"no":"第9-1條","text":"被保險人參加保險，年資合計滿十五年，被裁減資遣而自願繼續參加勞工保險者，由原投保單位為其辦理參加普通事故保險，至符合請領老年給付之日止。\n前項被保險人繼續參加勞工保險及保險給付辦法，由中央主管機關定之。","title":"第 二 章 保險人、投保單位及被保險人"},{"no":"第10條","text":"各投保單位應為其所屬勞工，辦理投保手續及其他有關保險事務，並備僱用員工或會員名冊。\n前項投保手續及其他有關保險事務，投保單位得委託其所隸屬團體或勞工團體辦理之。\n保險人為查核投保單位勞工人數、工作情況及薪資，必要時，得查對其員工或會員名冊、出勤工作紀錄及薪資帳冊。\n前項規定之表冊，投保單位應自被保險人離職、退會或結（退）訓之日起保存五年。","title":"第 二 章 保險人、投保單位及被保險人"},{"no":"第11條","text":"符合第六條規定之勞工，各投保單位應於其所屬勞工到職、入會、到訓、離職、退會、結訓之當日，列表通知保險人；其保險效力之開始或停止，均自應為通知之當日起算。但投保單位非於勞工到職、入會、到訓之當日列表通知保險人者，除依本條例第七十二條規定處罰外，其保險效力之開始，均自通知之翌日起算。","title":"第 二 章 保險人、投保單位及被保險人"},{"no":"第12條","text":"被保險人退保後再參加保險時，其原有保險年資應予併計。\n被保險人於八十八年十二月九日以後退職者，且於本條例六十八年二月二十一日修正前停保滿二年或七十七年二月五日修正前停保滿六年者，其停保前之保險年資應予併計。\n前項被保險人已領取老年給付者，得於本條施行後二年內申請補發併計年資後老年給付之差額。","title":"第 二 章 保險人、投保單位及被保險人"},{"no":"第13條","text":"本保險之保險費，依被保險人當月投保薪資及保險費率計算。\n普通事故保險費率，為被保險人當月投保薪資百分之七點五至百分之十三；本條例中華民國九十七年七月十七日修正之條文施行時，保險費率定為百分之七點五，施行後第三年調高百分之零點五，其後每年調高百分之零點五至百分之十，並自百分之十當年起，每兩年調高百分之零點五至上限百分之十三。但保險基金餘額足以支付未來二十年保險給付時，不予調高。\n職業災害保險費率，分為行業別災害費率及上、下班災害費率二種，每三年調整一次，由中央主管機關擬訂，報請行政院核定，送請立法院查照。\n僱用員工達一定人數以上之投保單位，前項行業別災害費率採實績費率，按其前三年職業災害保險給付總額占應繳職業災害保險費總額之比率，由保險人依下列規定，每年計算調整之：\n一、超過百分之八十者，每增加百分之十，加收其適用行業之職業災害保險費率之百分之五，並以加收至百分之四十為限。\n二、低於百分之七十者，每減少百分之十，減收其適用行業之職業災害保險費率之百分之五。\n前項實績費率實施之辦法，由中央主管機關定之。\n職業災害保險之會計，保險人應單獨辦理。","title":"第 三 章 保險費"},{"no":"第14條","text":"前條所稱月投保薪資，係指由投保單位按被保險人之月薪資總額，依投保薪資分級表之規定，向保險人申報之薪資；被保險人薪資以件計算者，其月投保薪資，以由投保單位比照同一工作等級勞工之月薪資總額，按分級表之規定申報者為準。被保險人為第六條第一項第七款、第八款及第八條第一項第四款規定之勞工，其月投保薪資由保險人就投保薪資分級表範圍內擬訂，報請中央主管機關核定適用之。\n被保險人之薪資，如在當年二月至七月調整時，投保單位應於當年八月底前將調整後之月投保薪資通知保險人；如在當年八月至次年一月調整時，應於次年二月底前通知保險人。其調整均自通知之次月一日生效。\n第一項投保薪資分級表，由中央主管機關擬訂，報請行政院核定之。","title":"第 三 章 保險費"},{"no":"第14-1條","text":"投保單位申報被保險人投保薪資不實者，由保險人按照同一行業相當等級之投保薪資額逕行調整通知投保單位，調整後之投保薪資與實際薪資不符時，應以實際薪資為準。\n依前項規定逕行調整之投保薪資，自調整之次月一日生效。","title":"第 三 章 保險費"},{"no":"第14-2條","text":"依第八條第一項第三款規定加保，其所得未達投保薪資分級表最高一級者，得自行舉證申報其投保薪資。但最低不得低於所屬員工申報之最高投保薪資適用之等級。","title":"第 三 章 保險費"},{"no":"第15條","text":"勞工保險保險費之負擔，依下列規定計算之：\n一、第六條第一項第一款至第六款及第八條第一項第一款至第三款規定之被保險人，其普通事故保險費由被保險人負擔百分之二十，投保單位負擔百分之七十，其餘百分之十，由中央政府補助；職業災害保險費全部由投保單位負擔。\n二、第六條第一項第七款規定之被保險人，其普通事故保險費及職業災害保險費，由被保險人負擔百分之六十，其餘百分之四十，由中央政府補助。\n三、第六條第一項第八款規定之被保險人，其普通事故保險費及職業災害保險費，由被保險人負擔百分之二十，其餘百分之八十，由中央政府補助。\n四、第八條第一項第四款規定之被保險人，其普通事故保險費及職業災害保險費，由被保險人負擔百分之八十，其餘百分之二十，由中央政府補助。\n五、第九條之一規定之被保險人，其保險費由被保險人負擔百分之八十，其餘百分之二十，由中央政府補助。","title":"第 三 章 保險費"},{"no":"第16條","text":"勞工保險保險費依左列規定，按月繳納：\n一、第六條第一項第一款至第六款及第八條第一項第一款至第三款規定之被保險人，其應自行負擔之保險費，由投保單位負責扣、收繳，並須於次月底前，連同投保單位負擔部分，一併向保險人繳納。\n二、第六條第一項第七款、第八款及第八條第一項第四款規定之被保險人，其自行負擔之保險費，應按月向其所屬投保單位繳納，於次月底前繳清，所屬投保單位應於再次月底前，負責彙繳保險人。\n三、第九條之一規定之被保險人，其應繳之保險費，應按月向其原投保單位或勞工團體繳納，由原投保單位或勞工團體於次月底前負責彙繳保險人。\n勞工保險之保險費一經繳納，概不退還。但非歸責於投保單位或被保險人之事由所致者，不在此限。","title":"第 三 章 保險費"},{"no":"第17條","text":"投保單位對應繳納之保險費，未依前條第一項規定限期繳納者，得寬限十五日；如在寬限期間仍未向保險人繳納者，自寬限期滿之翌日起至完納前一日止，每逾一日加徵其應納費額百分之零點一滯納金；加徵之滯納金額，以至應納費額之百分之二十為限。\n加徵前項滯納金十五日後仍未繳納者，保險人應就其應繳之保險費及滯納金，依法訴追。投保單位如無財產可供執行或其財產不足清償時，其主持人或負責人對逾期繳納有過失者，應負損害賠償責任。\n保險人於訴追之日起，在保險費及滯納金未繳清前，暫行拒絕給付。但被保險人應繳部分之保險費已扣繳或繳納於投保單位者，不在此限。\n第六條第一項第七款、第八款及第八條第一項第四款規定之被保險人，依第十五條規定負擔之保險費，應按期送交所屬投保單位彙繳。如逾寬限期間十五日而仍未送交者，其投保單位得適用第一項規定，代為加收滯納金彙繳保險人；加徵滯納金十五日後仍未繳納者，暫行拒絕給付。\n第九條之一規定之被保險人逾二個月未繳保險費者，以退保論。其於欠繳保險費期間發生事故所領取之保險給付，應依法追還。","title":"第 三 章 保險費"},{"no":"第17-1條","text":"勞工保險之保險費及滯納金，優先於普通債權受清償。","title":"第 三 章 保險費"},{"no":"第18條","text":"被保險人發生保險事故，於其請領傷病給付或住院醫療給付未能領取薪資或喪失收入期間，得免繳被保險人負擔部分之保險費。\n前項免繳保險費期間之年資，應予承認。","title":"第 三 章 保險費"},{"no":"第19條","text":"被保險人於保險效力開始後停止前，發生保險事故者，被保險人或其受益人得依本條例規定，請領保險給付。\n以現金發給之保險給付，其金額按被保險人平均月投保薪資及給付標準計算。被保險人同時受僱於二個以上投保單位者，其普通事故保險給付之月投保薪資得合併計算，不得超過勞工保險投保薪資分級表最高一級。但連續加保未滿三十日者，不予合併計算。\n前項平均月投保薪資之計算方式如下：\n一、年金給付及老年一次金給付之平均月投保薪資：按被保險人加保期間最高六十個月之月投保薪資予以平均計算；參加保險未滿五年者，按其實際投保年資之平均月投保薪資計算。但依第五十八條第二項規定選擇一次請領老年給付者，按其退保之當月起前三年之實際月投保薪資平均計算；參加保險未滿三年者，按其實際投保年資之平均月投保薪資計算。\n二、其他現金給付之平均月投保薪資：按被保險人發生保險事故之當月起前六個月之實際月投保薪資平均計算；其以日為給付單位者，以平均月投保薪資除以三十計算。\n第二項保險給付標準之計算，於保險年資未滿一年者，依其實際加保月數按比例計算；未滿三十日者，以一個月計算。\n被保險人如為漁業生產勞動者或航空、航海員工或坑內工，除依本條例規定請領保險給付外，於漁業、航空、航海或坑內作業中，遭遇意外事故致失蹤時，自失蹤之日起，按其平均月投保薪資百分之七十，給付失蹤津貼；於每滿三個月之期末給付一次，至生還之前一日或失蹤滿一年之前一日或受死亡宣告判決確定死亡時之前一日止。\n被保險人失蹤滿一年或受死亡宣告判決確定死亡時，得依第六十四條規定，請領死亡給付。","title":"第 一 節 通則"},{"no":"第20條","text":"被保險人在保險有效期間發生傷病事故，於保險效力停止後一年內，得請領同一傷病及其引起之疾病之傷病給付、失能給付、死亡給付或職業災害醫療給付。\n被保險人在保險有效期間懷孕，且符合本條例第三十一條第一項第一款或第二款規定之參加保險日數，於保險效力停止後一年內，因同一懷孕事故而分娩或早產者，得請領生育給付。","title":"第 一 節 通則"},{"no":"第20-1條","text":"被保險人退保後，經診斷確定於保險有效期間罹患職業病者，得請領職業災害保險失能給付。\n前項得請領失能給付之對象、職業病種類、認定程序及給付金額計算等事項之辦法，由中央主管機關定之。","title":"第 一 節 通則"},{"no":"第21條","text":"（刪除）","title":"第 一 節 通則"},{"no":"第21-1條","text":"（刪除）","title":"第 一 節 通則"},{"no":"第22條","text":"同一種保險給付，不得因同一事故而重複請領。","title":"第 一 節 通則"},{"no":"第23條","text":"被保險人或其受益人或其他利害關係人，為領取保險給付，故意造成保險事故者，保險人除給與喪葬津貼外，不負發給其他保險給付之責任。","title":"第 一 節 通則"},{"no":"第24條","text":"投保單位故意為不合本條例規定之人員辦理參加保險手續，領取保險給付者，保險人應依法追還；並取消該被保險人之資格。","title":"第 一 節 通則"},{"no":"第25條","text":"被保險人無正當理由，不接受保險人特約醫療院、所之檢查或補具應繳之證件，或受益人不補具應繳之證件者，保險人不負發給保險給付之責任。","title":"第 一 節 通則"},{"no":"第26條","text":"因戰爭變亂或因被保險人或其父母、子女、配偶故意犯罪行為，以致發生保險事故者，概不給與保險給付。","title":"第 一 節 通則"},{"no":"第27條","text":"被保險人之養子女，其收養登記在保險事故發生時未滿六個月者，不得享有領取保險給付之權利。","title":"第 一 節 通則"},{"no":"第28條","text":"保險人為審核保險給付或勞工保險監理委員會為審議爭議案件認有必要者，得向被保險人、受益人、投保單位、各該醫院、診所或領有執業執照之醫師、助產士等要求提出報告，或調閱各該醫院、診所及投保單位之病歷、薪資帳冊、檢查化驗紀錄或放射線診斷攝影片（Ｘ光照片）及其他有關文件，被保險人、受益人、投保單位、各該醫院、診所及領有執業執照之醫師或助產士等均不得拒絕。","title":"第 一 節 通則"},{"no":"第29條","text":"被保險人、受益人或支出殯葬費之人領取各種保險給付之權利，不得讓與、抵銷、扣押或供擔保。\n依本條例規定請領保險給付或申請第六十七條第一項第四款之貸款者，得檢具保險人出具之證明文件，於金融機構開立專戶，專供存入保險給付或貸款本金之用。\n前項專戶內之存款，不得作為抵銷、扣押、供擔保或強制執行之標的。\n被保險人已領取之保險給付，經保險人撤銷或廢止，應繳還而未繳還者，保險人得以其本人或其受益人請領之保險給付扣減之。\n被保險人有未償還第六十七條第一項第四款之貸款本息者，於被保險人或其受益人請領保險給付時逕予扣減之。\n本保險之保險費、滯納金及前項未償還之貸款本息，不適用下列規定；貸款本息並溯自中華民國九十二年一月二十二日施行：\n一、公司法有關債務免責之規定。\n二、消費者債務清理條例有關債務免責之規定。\n三、破產法有關債務免責之規定。\n四、其他法律有關請求權消滅時效規定。\n第四項及第五項有關扣減保險給付之種類、方式及金額等事項之辦法，由中央主管機關定之。\n保險人應每年書面通知有未償還第六十七條第一項第四款貸款本息之被保險人或其受益人之積欠金額，並請其依規定償還。\n本條例中華民國一百十四年十二月三十日修正之條文施行前，有未繳清保險費及滯納金之事實者，應適用第六項規定，保險人並依第十七條第三項或第四項規定，暫行拒絕給付；經繳清欠費後，保險人應依規定發給。","title":"第 一 節 通則"},{"no":"第29-1條","text":"依本條例以現金發給之保險給付，經保險人核定後，應在十五日內給付之；年金給付應於次月底前給付。如逾期給付可歸責於保險人者，其逾期部分應加給利息。","title":"第 一 節 通則"},{"no":"第30條","text":"領取保險給付之請求權，自得請領之日起，因五年間不行使而消滅。","title":"第 一 節 通則"},{"no":"第31條","text":"被保險人合於左列情形之一者，得請領生育給付：\n一、參加保險滿二百八十日後分娩者。\n二、參加保險滿一百八十一日後早產者。\n三、參加保險滿八十四日後流產者。\n被保險人之配偶分娩、早產或流產者，比照前項規定辦理。","title":"第 二 節 生育給付"},{"no":"第32條","text":"生育給付標準，依下列各款辦理：\n一、被保險人或其配偶分娩或早產者，按被保險人平均月投保薪資一次給與分娩費三十日，流產者減半給付。\n二、被保險人分娩或早產者，除給與分娩費外，並按其平均月投保薪資一次給與生育補助費六十日。\n三、分娩或早產為雙生以上者，分娩費及生育補助費比例增給。\n被保險人難產已申領住院診療給付者，不再給與分娩費。\n被保險人同時符合相關社會保險生育給付或因軍公教身分請領國家給與之生育補助請領條件者，僅得擇一請領。但農民健康保險者，不在此限。","title":"第 二 節 生育給付"},{"no":"第33條","text":"被保險人遭遇普通傷害或普通疾病住院診療，不能工作，以致未能取得原有薪資，正在治療中者，自不能工作之第四日起，發給普通傷害補助費或普通疾病補助費。","title":"第 三 節 傷病給付"},{"no":"第34條","text":"被保險人因執行職務而致傷害或職業病不能工作，以致未能取得原有薪資，正在治療中者，自不能工作之第四日起，發給職業傷害補償費或職業病補償費。職業病種類表如附表一。\n前項因執行職務而致傷病之審查準則，由中央主管機關定之。","title":"第 三 節 傷病給付"},{"no":"第35條","text":"普通傷害補助費及普通疾病補助費，均按被保險人平均月投保薪資半數發給，每半個月給付一次，以六個月為限。但傷病事故前參加保險之年資合計已滿一年者，增加給付六個月。","title":"第 三 節 傷病給付"},{"no":"第36條","text":"職業傷害補償費及職業病補償費，均按被保險人平均月投保薪資百分之七十發給，每半個月給付一次；如經過一年尚未痊癒者，其職業傷害或職業病補償費減為平均月投保薪資之半數，但以一年為限。","title":"第 三 節 傷病給付"},{"no":"第37條","text":"被保險人在傷病期間，已領足前二條規定之保險給付者，於痊癒後繼續參加保險時，仍得依規定請領傷病給付。","title":"第 三 節 傷病給付"},{"no":"第38條","text":"（刪除）","title":"第 三 節 傷病給付"},{"no":"第39條","text":"醫療給付分門診及住院診療。","title":"第 四 節 醫療給付"},{"no":"第39-1條","text":"為維護被保險人健康，保險人應訂定辦法，辦理職業病預防。\n前項辦法，應報請中央主管機關核定之。","title":"第 四 節 醫療給付"},{"no":"第40條","text":"被保險人罹患傷病時，應向保險人自設或特約醫療院、所申請診療。","title":"第 四 節 醫療給付"},{"no":"第41條","text":"門診給付範圍如左：\n一、診察（包括檢驗及會診）。\n二、藥劑或治療材料。\n三、處置、手術或治療。\n前項費用，由被保險人自行負擔百分之十。但以不超過中央主管機關規定之最高負擔金額為限。","title":"第 四 節 醫療給付"},{"no":"第42條","text":"被保險人合於左列規定之一，經保險人自設或特約醫療院、所診斷必須住院治療者，由其投保單位申請住院診療。但緊急傷病，須直接住院診療者，不在此限。\n一、因職業傷害者。\n二、因罹患職業病者。\n三、因普通傷害者。\n四、因罹患普通疾病，於申請住院診療前參加保險之年資合計滿四十五日者。","title":"第 四 節 醫療給付"},{"no":"第42-1條","text":"被保險人罹患職業傷病時，應由投保單位填發職業傷病門診單或住院申請書（以下簡稱職業傷病醫療書單）申請診療；投保單位未依規定填發者，被保險人得向保險人請領，經查明屬實後發給。\n被保險人未檢具前項職業傷病醫療書單，經醫師診斷罹患職業病者，得由醫師開具職業病門診單；醫師開具資格之取得、喪失及門診單之申領、使用辦法，由保險人擬訂，報請中央主管機關核定發布。","title":"第 四 節 醫療給付"},{"no":"第43條","text":"住院診療給付範圍如左：\n一、診察（包括檢驗及會診）。\n二、藥劑或治療材料。\n三、處置、手術或治療。\n四、膳食費用三十日內之半數。\n五、勞保病房之供應，以公保病房為準。\n前項第一款至第三款及第五款費用，由被保險人自行負擔百分之五。但以不超過中央主管機關規定之最高負擔金額為限。\n被保險人自願住較高等病房者，除依前項規定負擔外，其超過之勞保病房費用，由被保險人負擔。\n第二項及第四十一條第二項之實施日期及辦法，應經立法院審議通過後實施之。","title":"第 四 節 醫療給付"},{"no":"第44條","text":"醫療給付不包括法定傳染病、麻醉藥品嗜好症、接生、流產、美容外科、義齒、義眼、眼鏡或其他附屬品之裝置、病人運輸、特別護士看護、輸血、掛號費、證件費、醫療院、所無設備之診療及第四十一條、第四十三條未包括之項目。但被保險人因緊急傷病，經保險人自設或特約醫療院、所診斷必須輸血者，不在此限。","title":"第 四 節 醫療給付"},{"no":"第45條","text":"被保險人因傷病住院診療，住院日數超過一個月者，每一個月應由醫院辦理繼續住院手續一次。\n住院診療之被保險人，經保險人自設或特約醫院診斷認為可出院療養時，應即出院；如拒不出院時，其繼續住院所需費用，由被保險人負擔。","title":"第 四 節 醫療給付"},{"no":"第46條","text":"被保險人有自由選擇保險人自設或特約醫療院、所診療之權利，但有特殊規定者，從其規定。","title":"第 四 節 醫療給付"},{"no":"第47條","text":"（刪除）","title":"第 四 節 醫療給付"},{"no":"第48條","text":"被保險人在保險有效期間領取醫療給付者，仍得享有其他保險給付之權利。","title":"第 四 節 醫療給付"},{"no":"第49條","text":"被保險人診療所需之費用，由保險人逕付其自設或特約醫療院、所，被保險人不得請領現金。","title":"第 四 節 醫療給付"},{"no":"第50條","text":"在本條例施行區域內之各級公立醫療院、所符合規定者，均應為勞工保險之特約醫療院、所。各投保單位附設之醫療院、所及私立醫療院、所符合規定者，均得申請為勞工保險之特約醫療院、所。\n前項勞工保險特約醫療院、所特約及管理辦法，由中央主管機關會同中央衛生主管機關定之。","title":"第 四 節 醫療給付"},{"no":"第51條","text":"各特約醫療院、所辦理門診或住院診療業務，其診療費用，應依照勞工保險診療費用支付標準表及用藥種類與價格表支付之。\n前項勞工保險診療費用支付標準表及用藥種類與價格表，由中央主管機關會同中央衛生主管機關定之。\n保險人為審核第一項診療費用，應聘請各科醫藥專家組織診療費用審查委員會審核之；其辦法由中央主管機關定之。","title":"第 四 節 醫療給付"},{"no":"第52條","text":"投保單位填具之門診就診單或住院申請書，不合保險給付、醫療給付、住院診療之規定，或虛偽不實或交非被保險人使用者，其全部診療費用應由投保單位負責償付。\n特約醫療院、所對被保險人之診療不屬於醫療給付範圍者，其診療費用應由醫療院、所或被保險人自行負責。","title":"第 四 節 醫療給付"},{"no":"第53條","text":"被保險人遭遇普通傷害或罹患普通疾病，經治療後，症狀固定，再行治療仍不能期待其治療效果，經保險人自設或特約醫院診斷為永久失能，並符合失能給付標準規定者，得按其平均月投保薪資，依規定之給付標準，請領失能補助費。\n前項被保險人或被保險人為身心障礙者權益保障法所定之身心障礙者，經評估為終身無工作能力者，得請領失能年金給付。其給付標準，依被保險人之保險年資計算，每滿一年，發給其平均月投保薪資之百分之一點五五；金額不足新臺幣四千元者，按新臺幣四千元發給。\n前項被保險人具有國民年金保險年資者，得依各保險規定分別核計相關之年金給付，並由保險人合併發給，其所需經費由各保險分別支應。\n本條例中華民國九十七年七月十七日修正之條文施行前有保險年資者，於符合第二項規定條件時，除依前二項規定請領年金給付外，亦得選擇一次請領失能給付，經保險人核付後，不得變更。","title":"第 五 節 失能給付"},{"no":"第54條","text":"被保險人遭遇職業傷害或罹患職業病，經治療後，症狀固定，再行治療仍不能期待其治療效果，經保險人自設或特約醫院診斷為永久失能，並符合失能給付標準規定發給一次金者，得按其平均月投保薪資，依規定之給付標準，增給百分之五十，請領失能補償費。\n前項被保險人經評估為終身無工作能力，並請領失能年金給付者，除依第五十三條規定發給年金外，另按其平均月投保薪資，一次發給二十個月職業傷病失能補償一次金。","title":"第 五 節 失能給付"},{"no":"第54-1條","text":"前二條失能種類、狀態、等級、給付額度、開具診斷書醫療機構層級及審核基準等事項之標準，由中央主管機關定之。\n前項標準，應由中央主管機關建立個別化之專業評估機制，作為失能年金給付之依據。\n前項個別化之專業評估機制，應於本條例中華民國九十七年七月十七日修正之條文公布後五年施行。","title":"第 五 節 失能給付"},{"no":"第54-2條","text":"請領失能年金給付者，同時有符合下列條件之眷屬時，每一人加發依第五十三條規定計算後金額百分之二十五之眷屬補助，最多加計百分之五十：\n一、配偶應年滿五十五歲且婚姻關係存續一年以上。但有下列情形之一者，不在此限：\n（一）無謀生能力。\n（二）扶養第三款規定之子女。\n二、配偶應年滿四十五歲且婚姻關係存續一年以上，且每月工作收入未超過投保薪資分級表第一級。\n三、子女應符合下列條件之一。但養子女須有收養關係六個月以上：\n（一）未成年。\n（二）無謀生能力。\n（三）二十五歲以下，在學，且每月工作收入未超過投保薪資分級表第一級。\n前項所稱無謀生能力之範圍，由中央主管機關定之。\n第一項各款眷屬有下列情形之一時，其加給眷屬補助應停止發給：\n一、配偶：\n（一）再婚。\n（二）未滿五十五歲，且其扶養之子女不符合第一項第三款所定請領條件。\n（三）不符合第一項第二款所定請領條件。\n二、子女不符合第一項第三款所定之請領條件。\n三、入獄服刑、因案羈押或拘禁。\n四、失蹤。\n前項第三款所稱拘禁，指受拘留、留置、觀察勒戒、強制戒治、保安處分或感訓處分裁判之宣告，在特定處所執行中，其人身自由受剝奪或限制者。但執行保護管束、僅受通緝尚未到案、保外就醫及假釋中者，不包括在內。","title":"第 五 節 失能給付"},{"no":"第55條","text":"被保險人之身體原已局部失能，再因傷病致身體之同一部位失能程度加重或不同部位發生失能者，保險人應按其加重部分之失能程度，依失能給付標準計算發給失能給付。但合計不得超過第一等級之給付標準。\n前項被保險人符合失能年金給付條件，並請領失能年金給付者，保險人應按月發給失能年金給付金額之百分之八十，至原已局部失能程度依失能給付標準所計算之失能一次金給付金額之半數扣減完畢為止。\n前二項被保險人在保險有效期間原已局部失能，而未請領失能給付者，保險人應按其加重後之失能程度，依失能給付標準計算發給失能給付。但合計不得超過第一等級之給付標準。","title":"第 五 節 失能給付"},{"no":"第56條","text":"保險人於審核失能給付，認為有複檢必要時，得另行指定醫院或醫師複檢，其費用由保險基金負擔。\n被保險人領取失能年金給付後，保險人應至少每五年審核其失能程度。但經保險人認為無須審核者，不在此限。\n保險人依前項規定審核領取失能年金給付者之失能程度，認為已減輕至不符合失能年金請領條件時，應停止發給其失能年金給付，另發給失能一次金。","title":"第 五 節 失能給付"},{"no":"第57條","text":"被保險人經評估為終身無工作能力，領取失能給付者，應由保險人逕予退保。","title":"第 五 節 失能給付"},{"no":"第58條","text":"年滿六十歲有保險年資者，得依下列規定請領老年給付：\n一、保險年資合計滿十五年者，請領老年年金給付。\n二、保險年資合計未滿十五年者，請領老年一次金給付。\n本條例中華民國九十七年七月十七日修正之條文施行前有保險年資者，於符合下列規定之一時，除依前項規定請領老年給付外，亦得選擇一次請領老年給付，經保險人核付後，不得變更：\n一、參加保險之年資合計滿一年，年滿六十歲或女性被保險人年滿五十五歲退職者。\n二、參加保險之年資合計滿十五年，年滿五十五歲退職者。\n三、在同一投保單位參加保險之年資合計滿二十五年退職者。\n四、參加保險之年資合計滿二十五年，年滿五十歲退職者。\n五、擔任具有危險、堅強體力等特殊性質之工作合計滿五年，年滿五十五歲退職者。\n依前二項規定請領老年給付者，應辦理離職退保。\n被保險人請領老年給付者，不受第三十條規定之限制。\n第一項老年給付之請領年齡，於本條例中華民國九十七年七月十七日修正之條文施行之日起，第十年提高一歲，其後每二年提高一歲，以提高至六十五歲為限。\n被保險人已領取老年給付者，不得再行參加勞工保險。\n被保險人擔任具有危險、堅強體力等特殊性質之工作合計滿十五年，年滿五十五歲，並辦理離職退保者，得請領老年年金給付，且不適用第五項及第五十八條之二規定。\n第二項第五款及前項具有危險、堅強體力等特殊性質之工作，由中央主管機關定之。","title":"第 六 節 老年給付"},{"no":"第58-1條","text":"老年年金給付，依下列方式擇優發給：\n一、保險年資合計每滿一年，按其平均月投保薪資之百分之零點七七五計算，並加計新臺幣三千元。\n二、保險年資合計每滿一年，按其平均月投保薪資之百分之一點五五計算。","title":"第 六 節 老年給付"},{"no":"第58-2條","text":"符合第五十八條第一項第一款及第五項所定請領老年年金給付條件而延後請領者，於請領時應發給展延老年年金給付。每延後一年，依前條規定計算之給付金額增給百分之四，最多增給百分之二十。\n被保險人保險年資滿十五年，未符合第五十八條第一項及第五項所定請領年齡者，得提前五年請領老年年金給付，每提前一年，依前條規定計算之給付金額減給百分之四，最多減給百分之二十。","title":"第 六 節 老年給付"},{"no":"第59條","text":"依第五十八條第一項第二款請領老年一次金給付或同條第二項規定一次請領老年給付者，其保險年資合計每滿一年，按其平均月投保薪資發給一個月；其保險年資合計超過十五年者，超過部分，每滿一年發給二個月，最高以四十五個月為限。\n被保險人逾六十歲繼續工作者，其逾六十歲以後之保險年資，最多以五年計，合併六十歲以前之一次請領老年給付，最高以五十個月為限。","title":"第 六 節 老年給付"},{"no":"第60條","text":"（刪除）","title":"第 六 節 老年給付"},{"no":"第61條","text":"（刪除）","title":"第 六 節 老年給付"},{"no":"第62條","text":"被保險人之父母、配偶或子女死亡時，依左列規定，請領喪葬津貼：\n一、被保險人之父母、配偶死亡時，按其平均月投保薪資，發給三個月。\n二、被保險人之子女年滿十二歲死亡時，按其平均月投保薪資，發給二個半月。\n三、被保險人之子女未滿十二歲死亡時，按其平均月投保薪資，發給一個半月。","title":"第 七 節 死亡給付"},{"no":"第63條","text":"被保險人在保險有效期間死亡時，除由支出殯葬費之人請領喪葬津貼外，遺有配偶、子女、父母、祖父母、受其扶養之孫子女或受其扶養之兄弟、姊妹者，得請領遺屬年金給付。\n前項遺屬請領遺屬年金給付之條件如下：\n一、配偶符合第五十四條之二第一項第一款或第二款規定者。\n二、子女符合第五十四條之二第一項第三款規定者。\n三、父母、祖父母年滿五十五歲，且每月工作收入未超過投保薪資分級表第一級者。\n四、孫子女符合第五十四條之二第一項第三款第一目至第三目規定情形之一者。\n五、兄弟、姊妹符合下列條件之一：\n（一）有第五十四條之二第一項第三款第一目或第二目規定情形。\n（二）年滿五十五歲，且每月工作收入未超過投保薪資分級表第一級。\n第一項被保險人於本條例中華民國九十七年七月十七日修正之條文施行前有保險年資者，其遺屬除得依前項規定請領年金給付外，亦得選擇一次請領遺屬津貼，不受前項條件之限制，經保險人核付後，不得變更。","title":"第 七 節 死亡給付"},{"no":"第63-1條","text":"被保險人退保，於領取失能年金給付或老年年金給付期間死亡者，其符合前條第二項規定之遺屬，得請領遺屬年金給付。\n前項被保險人於本條例中華民國九十七年七月十七日修正之條文施行前有保險年資者，其遺屬除得依前項規定請領年金給付外，亦得選擇一次請領失能給付或老年給付，扣除已領年金給付總額之差額，不受前條第二項條件之限制，經保險人核付後，不得變更。\n被保險人保險年資滿十五年，並符合第五十八條第二項各款所定之條件，於未領取老年給付前死亡者，其符合前條第二項規定之遺屬，得請領遺屬年金給付。\n前項被保險人於本條例中華民國九十七年七月十七日修正之條文施行前有保險年資者，其遺屬除得依前項規定請領年金給付外，亦得選擇一次請領老年給付，不受前條第二項條件之限制，經保險人核付後，不得變更。","title":"第 七 節 死亡給付"},{"no":"第63-2條","text":"前二條所定喪葬津貼、遺屬年金及遺屬津貼給付標準如下：\n一、喪葬津貼：按被保險人平均月投保薪資一次發給五個月。但其遺屬不符合請領遺屬年金給付或遺屬津貼條件，或無遺屬者，按其平均月投保薪資一次發給十個月。\n二、遺屬年金：\n（一）依第六十三條規定請領遺屬年金者：依被保險人之保險年資合計每滿一年，按其平均月投保薪資之百分之一點五五計算。\n（二）依前條規定請領遺屬年金者：依失能年金或老年年金給付標準計算後金額之半數發給。\n三、遺屬津貼：\n（一）參加保險年資合計未滿一年者，按被保險人平均月投保薪資發給十個月。\n（二）參加保險年資合計已滿一年而未滿二年者，按被保險人平均月投保薪資發給二十個月。\n（三）參加保險年資合計已滿二年者，按被保險人平均月投保薪資發給三十個月。\n前項第二款之遺屬年金給付金額不足新臺幣三千元者，按新臺幣三千元發給。\n遺屬年金給付於同一順序之遺屬有二人以上時，每多一人加發依第一項第二款及前項規定計算後金額之百分之二十五，最多加計百分之五十。","title":"第 七 節 死亡給付"},{"no":"第63-3條","text":"遺屬具有受領二個以上遺屬年金給付之資格時，應擇一請領。\n本條例之喪葬津貼、遺屬年金給付及遺屬津貼，以一人請領為限。符合請領條件者有二人以上時，應共同具領，未共同具領或保險人核定前如另有他人提出請領，保險人應通知各申請人協議其中一人代表請領，未能協議者，喪葬津貼應以其中核計之最高給付金額，遺屬津貼及遺屬年金給付按總給付金額平均發給各申請人。\n同一順序遺屬有二人以上，有其中一人請領遺屬年金時，應發給遺屬年金給付。但經共同協議依第六十三條第三項、第六十三條之一第二項及第四項規定一次請領給付者，依其協議辦理。\n保險人依前二項規定發給遺屬給付後，尚有未具名之其他當序遺屬時，應由具領之遺屬負責分與之。","title":"第 七 節 死亡給付"},{"no":"第63-4條","text":"領取遺屬年金給付者，有下列情形之一時，其年金給付應停止發給：\n一、配偶：\n（一）再婚。\n（二）未滿五十五歲，且其扶養之子女不符合第六十三條第二項第二款所定請領條件。\n（三）不符合第六十三條第二項第一款所定請領條件。\n二、子女、父母、祖父母、孫子女、兄弟、姊妹，於不符合第六十三條第二項第二款至第五款所定請領條件。\n三、有第五十四條之二第三項第三款、第四款規定之情形。","title":"第 七 節 死亡給付"},{"no":"第64條","text":"被保險人因職業災害致死亡者，除由支出殯葬費之人依第六十三條之二第一項第一款規定請領喪葬津貼外，有符合第六十三條第二項規定之遺屬者，得請領遺屬年金給付及按被保險人平均月投保薪資，一次發給十個月職業災害死亡補償一次金。\n前項被保險人之遺屬依第六十三條第三項規定一次請領遺屬津貼者，按被保險人平均月投保薪資發給四十個月。","title":"第 七 節 死亡給付"},{"no":"第65條","text":"受領遺屬年金給付及遺屬津貼之順序如下：\n一、配偶及子女。\n二、父母。\n三、祖父母。\n四、孫子女。\n五、兄弟、姊妹。\n前項當序受領遺屬年金給付或遺屬津貼者存在時，後順序之遺屬不得請領。\n前項第一順序之遺屬全部不符合請領條件，或有下列情形之一且無同順序遺屬符合請領條件時，第二順序之遺屬得請領遺屬年金給付：\n一、在請領遺屬年金給付期間死亡。\n二、行蹤不明或於國外。\n三、提出放棄請領書。\n四、於符合請領條件起一年內未提出請領者。\n前項遺屬年金嗣第一順序之遺屬主張請領或再符合請領條件時，即停止發給，並由第一順序之遺屬請領；但已發放予第二順位遺屬之年金不得請求返還，第一順序之遺屬亦不予補發。","title":"第 七 節 死亡給付"},{"no":"第65-1條","text":"被保險人或其受益人符合請領年金給付條件者，應填具申請書及檢附相關文件向保險人提出申請。\n前項被保險人或其受益人，經保險人審核符合請領規定者，其年金給付自申請之當月起，按月發給，至應停止發給之當月止。\n遺屬年金之受益人未於符合請領條件之當月提出申請者，其提出請領之日起前五年得領取之給付，由保險人依法追溯補給之。但已經其他受益人請領之部分，不適用之。","title":"第 八 節 年金給付之申請及核發"},{"no":"第65-2條","text":"被保險人或其遺屬請領年金給付時，保險人得予以查證，並得於查證期間停止發給，經查證符合給付條件者，應補發查證期間之給付，並依規定繼續發給。\n領取年金給付者不符合給付條件或死亡時，本人或其法定繼承人應自事實發生之日起三十日內，檢具相關文件資料，通知保險人，自事實發生之次月起停止發給年金給付。\n領取年金給付者死亡，應發給之年金給付未及撥入其帳戶時，得由其法定繼承人檢附申請人死亡戶籍謄本及法定繼承人戶籍謄本請領之；法定繼承人有二人以上時，得檢附共同委任書及切結書，由其中一人請領。\n領取年金給付者或其法定繼承人未依第二項規定通知保險人致溢領年金給付者，保險人應以書面命溢領人於三十日內繳還；保險人並得自匯發年金給付帳戶餘額中追回溢領之年金給付。","title":"第 八 節 年金給付之申請及核發"},{"no":"第65-3條","text":"被保險人或其受益人符合請領失能年金、老年年金或遺屬年金給付條件時，應擇一請領失能、老年給付或遺屬津貼。","title":"第 八 節 年金給付之申請及核發"},{"no":"第65-4條","text":"本保險之年金給付金額，於中央主計機關發布之消費者物價指數累計成長率達正負百分之五時，即依該成長率調整之。","title":"第 八 節 年金給付之申請及核發"},{"no":"第65-5條","text":"保險人或勞工保險監理委員會為處理本保險業務所需之必要資料，得洽請相關機關提供之，各該機關不得拒絕。\n保險人或勞工保險監理委員會依規定所取得之資料，應盡善良管理人之注意義務，確實辦理資訊安全稽核作業，其保有、處理及利用，並應遵循電腦處理個人資料保護法之規定。","title":"第 八 節 年金給付之申請及核發"},{"no":"第66條","text":"勞工保險基金之來源如下：\n一、創立時政府一次撥付之金額。\n二、政府撥補之金額。\n三、當年度保險費及其孳息之收入與保險給付支出之結餘。\n四、保險費滯納金。\n五、基金運用之收益。\n六、其他財源挹注及相關收入。\n前項第二款政府撥補之金額，於本條例中華民國一百十四年十二月三十日修正之條文施行後，由中央主管機關依政府財政及本保險財務狀況，每年編列預算撥補之；遇當年度保險費收入少於保險給付支出之情形，中央政府應有適當經費撥入或補助。","title":"第 五 章 保險基金及經費"},{"no":"第67條","text":"勞工保險基金，經勞工保險監理委員會之通過，得為左列之運用：\n一、對於公債、庫券及公司債之投資。\n二、存放於公營銀行或中央主管機關指定之金融機構。\n三、自設勞保醫院之投資及特約公立醫院勞保病房整修之貸款；其辦法，由中央主管機關定之。\n四、對於被保險人之貸款。\n五、政府核准有利於本基金收入之投資。\n勞工保險基金除作為前項運用及保險給付支出外，不得移作他用或轉移處分；其管理辦法，由中央主管機關定之。基金之收支、運用情形及其積存數額，應由保險人報請中央主管機關按年公告之。\n第一項第四款對於被保險人之貸款資格、用途、額度、利率、期限及還款方式等事項，應由保險人報請中央主管機關公告之。","title":"第 五 章 保險基金及經費"},{"no":"第68條","text":"勞工保險機構辦理本保險所需之經費，由保險人按編製預算之當年六月份應收保險費百分之五點五全年伸算數編列預算，經勞工保險監理委員會審議通過後，由中央主管機關撥付之。","title":"第 五 章 保險基金及經費"},{"no":"第69條","text":"勞工保險之財務，由中央政府負最後支付責任。\n本條例中華民國一百十四年十二月三十日修正之條文施行後，中央主管機關應至少每三年檢討本保險財務。","title":"第 五 章 保險基金及經費"},{"no":"第70條","text":"以詐欺或其他不正當行為領取保險給付或為虛偽之證明、報告、陳述及申報診療費用者，除按其領取之保險給付或診療費用處以二倍罰鍰外，並應依民法請求損害賠償；其涉及刑責者，移送司法機關辦理。特約醫療院、所因此領取之診療費用，得在其已報應領費用內扣除。","title":"第 六 章 罰則"},{"no":"第71條","text":"勞工違背本條例規定，不參加勞工保險及辦理勞工保險手續者，處一百元以上、五百元以下罰鍰。","title":"第 六 章 罰則"},{"no":"第72條","text":"投保單位違反本條例規定，未為其所屬勞工辦理投保手續者，按自僱用之日起，至參加保險之前一日或勞工離職日止應負擔之保險費金額，處四倍罰鍰。勞工因此所受之損失，並應由投保單位依本條例規定之給付標準賠償之。\n投保單位未依本條例之規定負擔被保險人之保險費，而由被保險人負擔者，按應負擔之保險費金額，處二倍罰鍰。投保單位並應退還該保險費與被保險人。\n投保單位違反本條例規定，將投保薪資金額以多報少或以少報多者，自事實發生之日起，按其短報或多報之保險費金額，處四倍罰鍰，並追繳其溢領給付金額。勞工因此所受損失，應由投保單位賠償之。\n投保單位於保險人依第十條第三項規定為查對時，拒不出示者，或違反同條第四項規定者，處新臺幣六千元以上一萬八千元以下罰鍰。\n投保單位於本條例中華民國九十七年五月十六日修正生效前，依第十七條第一項規定加徵滯納金至應納費額一倍者，其應繳之保險費仍未向保險人繳納，且未經保險人處以罰鍰或處以罰鍰未執行者，不再裁處或執行。","title":"第 六 章 罰則"},{"no":"第73條","text":"本條例所規定之罰鍰，經催告送達後，無故逾三十日，仍不繳納者，移送法院強制執行。","title":"第 六 章 罰則"},{"no":"第74條","text":"失業保險之保險費率、實施地區、時間及辦法，由行政院以命令定之。","title":"第 七 章 附則"},{"no":"第74-1條","text":"被保險人於本條例中華民國九十七年七月十七日修正之條文施行前發生失能、老年或死亡保險事故，其本人或其受益人領取保險給付之請求權未超過第三十條所定之時效者，得選擇適用保險事故發生時或請領保險給付時之規定辦理。","title":"第 七 章 附則"},{"no":"第74-2條","text":"本條例中華民國九十七年七月十七日修正之條文施行後，被保險人符合本保險及國民年金保險老年給付請領資格者，得向任一保險人同時請領，並由受請求之保險人按其各該保險之年資，依規定分別計算後合併發給；屬他保險應負擔之部分，由其保險人撥還。\n前項被保險人於各該保險之年資，未達請領老年年金給付之年限條件，而併計他保險之年資後已符合者，亦得請領老年年金給付。\n被保險人發生失能或死亡保險事故，被保險人或其遺屬同時符合國民年金保險給付條件時，僅得擇一請領。","title":"第 七 章 附則"},{"no":"第75條","text":"（刪除）","title":"第 七 章 附則"},{"no":"第76條","text":"被保險人於轉投軍人保險、公務人員保險或私立學校教職員保險時，不合請領老年給付條件者，其依本條例規定參加勞工保險之年資應予保留，於其年老依法退職時，得依本條例第五十九條規定標準請領老年給付。\n前項年資之保留辦法，由中央主管機關擬訂，報請行政院核定之。","title":"第 七 章 附則"},{"no":"第76-1條","text":"本條例第二條、第三十一條、第三十二條及第三十九條至第五十二條有關生育給付分娩費及普通事故保險醫療給付部分，於全民健康保險施行後，停止適用。","title":"第 七 章 附則"},{"no":"第77條","text":"本條例施行細則，由中央主管機關擬訂，報請行政院核定之。","title":"第 七 章 附則"},{"no":"第78條","text":"本條例施行區域，由行政院以命令定之。","title":"第 七 章 附則"},{"no":"第79條","text":"本條例自公布日施行。\n本條例中華民國九十七年七月十七日修正條文施行日期，除另定施行日期者外，由行政院定之。\n本條例中華民國一百年四月八日修正之第十五條之施行日期，由行政院定之。","title":"第 七 章 附則"}],"tags":["勞動","勞保"],"note":"第 6 條、第 8 條被保險人範圍。","attachments":[{"FileName":"附表一勞工保險職業病種類表.PDF","FileURL":"https://law.moj.gov.tw/LawClass/LawGetFile.ashx?FileId=0000233127"},{"FileName":"附表一勞工保險職業病種類表.DOC","FileURL":"https://law.moj.gov.tw/LawClass/LawGetFile.ashx?FileId=0000006979"}]},{"id":"C03","name":"勞工退休金條例","pcode":"N0030020","level":"法律","authority":"勞動部","category":"行政＞勞動部＞勞動福祉退休目","modified_date":"2019-05-15","history":[{"date":"2004-06-30","summary":"中華民國九十三年六月三十日總統華總一義字第 09300121821 號令制定公布全文 58 條；並自公布後一年施行"},{"date":"2007-07-04","summary":"中華民國九十六年七月四日總統華總一義字第 09600083771 號令修正公布第 53 條條文；修正之第 1 項及第 2 項規定，溯自九十四年七月一日生效"},{"date":"2014-01-15","summary":"中華民國一百零三年一月十五日總統華總一義字第 10300004871 號令修正公布第 5、7、12、14、15、17、19、21、33、35、36、38、39、49、50、53、58 條條文；增訂第 8-1、24-1、24-2、35-1、35-2 條條文；刪除第 22 條條文；並自公布日施行中華民國一百零三年二月十四日行政院院臺規字第 1030124618 號公告第 2 條所列屬「行政院勞工委員會」之權責事項，自一百零三年二月十七日起改由「勞動部」管轄；第 5 條、第 6 條第 1 項、第 8條之 1 第 5 項、第 9 條第 3 項序文、第 15 條第 1 項、第 2項、第 3 項、第 17 條第 1 項、第 18 條、第 19 條第 1 項、第2 項、第 3 項、第 4 項、第 20 條第 1 項、第 23 條第 3 項、第 28 條第 1 項、第 34 條第 1 項、第 35 條之 2、第 36 條第 2項、第 4 項、第 40 條第 1 項、第 2 項、第 42 條、第 43 條、第 46 條、第 54 條第 2 項所列屬「勞工保險局」之權責事項，自一百零三年二月十七日起改由「勞動部勞工保險局」管轄；第 44 條所列屬「勞工保險局」之權責事項，自一百零三年二月十七日起，分別改由「勞動部勞工保險局」、「勞動部勞動基金運用局」管轄；第 4 條所列屬「勞工退休基金監理委員會」之權責事項，自一百零三年二月十七日起改由「勞動部」管轄；第 33 條第 2 項、第 34 條第 1 項、第2 項、第 41 條、第 42 條、第 43 條所列屬「勞工退休基金監理委員會」之權責事項，自一百零三年二月十七日起，監理業務改由「勞動部」管轄；勞工退休基金投資及運用業務，改由「勞動部勞動基金運用局」管轄"},{"date":"2015-07-01","summary":"中華民國一百零四年七月一日總統華總一義字第 10400077121 號令修正公布第 2、29 條條文"},{"date":"2016-11-16","summary":"中華民國一百零五年十一月十六日總統華總一義字第 10500140121 號令修正公布第 5、24、46、48 條條文"},{"date":"2019-05-15","summary":"中華民國一百零八年五月十五日總統華總一義字第 10800049101 號令修正公布第 4、7、8-1、14、23、26～29、33、34、41～44、50、53、54 條條文；增訂第 45-1、53-1、54-1、56-1～56-3 條條文；刪除第47 條條文"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0030020","articles":[{"no":"第1條","text":"為增進勞工退休生活保障，加強勞雇關係，促進社會及經濟發展，特制定本條例。\n勞工退休金事項，優先適用本條例。本條例未規定者，適用其他法律之規定。","title":"第 一 章 總則"},{"no":"第2條","text":"本條例所稱主管機關：在中央為勞動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","title":"第 一 章 總則"},{"no":"第3條","text":"本條例所稱勞工、雇主、事業單位、勞動契約、工資及平均工資之定義，依勞動基準法第二條規定。","title":"第 一 章 總則"},{"no":"第4條","text":"中央主管機關為監理本條例與勞動基準法第五十六條第三項規定勞工退休基金之管理及運用業務，應聘請政府機關代表、勞工代表、雇主代表及專家學者，以勞動基金監理會（以下簡稱監理會）行之。\n前項監理會之監理事項、程序、人員組成、任期與遴聘及其他相關事項之辦法，由中央主管機關定之。","title":"第 一 章 總則"},{"no":"第5條","text":"勞工退休金之收支、保管、滯納金之加徵及罰鍰處分等業務，由中央主管機關委任勞動部勞工保險局（以下簡稱勞保局）辦理之。","title":"第 一 章 總則"},{"no":"第6條","text":"雇主應為適用本條例之勞工，按月提繳退休金，儲存於勞保局設立之勞工退休金個人專戶。\n除本條例另有規定者外，雇主不得以其他自訂之勞工退休金辦法，取代前項規定之勞工退休金制度。","title":"第 一 章 總則"},{"no":"第7條","text":"本條例之適用對象為適用勞動基準法之下列人員，但依私立學校法之規定提撥退休準備金者，不適用之：\n一、本國籍勞工。\n二、與在中華民國境內設有戶籍之國民結婚，且獲准居留而在臺灣地區工作之外國人、大陸地區人民、香港或澳門居民。\n三、前款之外國人、大陸地區人民、香港或澳門居民，與其配偶離婚或其配偶死亡，而依法規規定得在臺灣地區繼續居留工作者。\n四、前二款以外之外國人，經依入出國及移民法相關規定許可永久居留，且在臺灣地區工作者。\n本國籍人員、前項第二款至第四款規定之人員具下列身分之一，得自願依本條例規定提繳及請領退休金：\n一、實際從事勞動之雇主。\n二、自營作業者。\n三、受委任工作者。\n四、不適用勞動基準法之勞工。","title":"第 二 章 制度之適用與銜接"},{"no":"第8條","text":"本條例施行前已適用勞動基準法之勞工，於本條例施行後仍服務於同一事業單位者，得選擇繼續適用勞動基準法之退休金規定。但於離職後再受僱時，應適用本條例之退休金制度。\n公營事業於本條例施行後移轉民營，公務員兼具勞工身分者繼續留用，得選擇適用勞動基準法之退休金規定或本條例之退休金制度。","title":"第 二 章 制度之適用與銜接"},{"no":"第8-1條","text":"下列人員自下列各款所定期日起，應適用本條例之退休金制度：\n一、第七條第一項第二款、第三款人員及於中華民國九十九年七月一日後始取得本國籍之勞工，於本條例一百零二年十二月三十一日修正之條文施行日。\n二、第七條第一項第四款人員，於本條例一百零八年四月二十六日修正之條文施行日。\n三、前二款人員於各該修正條文施行後始取得各該身分者，為取得身分之日。\n前項所定人員於各該修正條文施行前已受僱且仍服務於同一事業單位者，於適用本條例之日起六個月內，得以書面向雇主表明選擇繼續適用勞動基準法之退休金規定。\n依前項規定向雇主表明選擇繼續適用勞動基準法之退休金規定者，不得再變更選擇適用本條例之退休金制度。\n勞工依第一項規定適用本條例退休金制度者，其適用本條例前之工作年資依第十一條規定辦理。\n雇主應為依第一項及第二項規定適用本條例退休金制度之勞工，向勞保局辦理提繳手續，並至遲於第一項及第二項規定期限屆滿之日起十五日內申報。","title":"第 二 章 制度之適用與銜接"},{"no":"第9條","text":"雇主應自本條例公布後至施行前一日之期間內，就本條例之勞工退休金制度及勞動基準法之退休金規定，以書面徵詢勞工之選擇；勞工屆期未選擇者，自本條例施行之日起繼續適用勞動基準法之退休金規定。\n勞工選擇繼續自本條例施行之日起適用勞動基準法之退休金規定者，於五年內仍得選擇適用本條例之退休金制度。\n雇主應為適用本條例之退休金制度之勞工，依下列規定向勞保局辦理提繳手續：\n一、依第一項規定選擇適用者，應於本條例施行後十五日內申報。\n二、依第二項規定選擇適用者，應於選擇適用之日起十五日內申報。\n三、本條例施行後新成立之事業單位，應於成立之日起十五日內申報。","title":"第 二 章 制度之適用與銜接"},{"no":"第10條","text":"勞工適用本條例之退休金制度後，不得再變更選擇適用勞動基準法之退休金規定。","title":"第 二 章 制度之適用與銜接"},{"no":"第11條","text":"本條例施行前已適用勞動基準法之勞工，於本條例施行後，仍服務於同一事業單位而選擇適用本條例之退休金制度者，其適用本條例前之工作年資，應予保留。\n前項保留之工作年資，於勞動契約依勞動基準法第十一條、第十三條但書、第十四條、第二十條、第五十三條、第五十四條或職業災害勞工保護法第二十三條、第二十四條規定終止時，雇主應依各法規定，以契約終止時之平均工資，計給該保留年資之資遣費或退休金，並於終止勞動契約後三十日內發給。\n第一項保留之工作年資，於勞動契約存續期間，勞雇雙方約定以不低於勞動基準法第五十五條及第八十四條之二規定之給與標準結清者，從其約定。\n公營事業之公務員兼具勞工身分者，於民營化之日，其移轉民營前年資，依民營化前原適用之退休相關法令領取退休金。但留用人員應停止其領受月退休金及相關權利，至離職時恢復。","title":"第 二 章 制度之適用與銜接"},{"no":"第12條","text":"勞工適用本條例之退休金制度者，適用本條例後之工作年資，於勞動契約依勞動基準法第十一條、第十三條但書、第十四條及第二十條或職業災害勞工保護法第二十三條、第二十四條規定終止時，其資遣費由雇主按其工作年資，每滿一年發給二分之一個月之平均工資，未滿一年者，以比例計給；最高以發給六個月平均工資為限，不適用勞動基準法第十七條之規定。\n依前項規定計算之資遣費，應於終止勞動契約後三十日內發給。\n選擇繼續適用勞動基準法退休金規定之勞工，其資遣費與退休金依同法第十七條、第五十五條及第八十四條之二規定發給。","title":"第 二 章 制度之適用與銜接"},{"no":"第13條","text":"為保障勞工之退休金，雇主應依選擇適用勞動基準法退休制度與保留適用本條例前工作年資之勞工人數、工資、工作年資、流動率等因素精算其勞工退休準備金之提撥率，繼續依勞動基準法第五十六條第一項規定，按月於五年內足額提撥勞工退休準備金，以作為支付退休金之用。\n勞雇雙方依第十一條第三項規定，約定結清之退休金，得自勞動基準法第五十六條第一項規定之勞工退休準備金專戶支應。\n依第十一條第四項規定應發給勞工之退休金，應依公營事業移轉民營條例第九條規定辦理。","title":"第 二 章 制度之適用與銜接"},{"no":"第14條","text":"雇主應為第七條第一項規定之勞工負擔提繳之退休金，不得低於勞工每月工資百分之六。\n雇主得為第七條第二項第三款或第四款規定之人員，於每月工資百分之六範圍內提繳退休金。\n第七條規定之人員，得在其每月工資百分之六範圍內，自願提繳退休金；其自願提繳之退休金，不計入提繳年度薪資所得課稅。\n第七條第二項第一款至第三款規定之人員，得在其每月執行業務所得百分之六範圍內，自願提繳退休金；其自願提繳之退休金，不計入提繳年度執行業務收入課稅。\n第一項至第三項所定每月工資及前項所定每月執行業務所得，由中央主管機關擬訂月提繳分級表，報請行政院核定之。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第15條","text":"於同一雇主或依第七條第二項、前條第三項自願提繳者，一年內調整勞工退休金之提繳率，以二次為限。調整時，雇主應於調整當月底前，填具提繳率調整表通知勞保局，並自通知之次月一日起生效；其提繳率計算至百分率小數點第一位為限。\n勞工之工資如在當年二月至七月調整時，其雇主應於當年八月底前，將調整後之月提繳工資通知勞保局；如在當年八月至次年一月調整時，應於次年二月底前通知勞保局，其調整均自通知之次月一日起生效。\n雇主為第七條第一項所定勞工申報月提繳工資不實或未依前項規定調整月提繳工資者，勞保局查證後得逕行更正或調整之，並通知雇主，且溯自提繳日或應調整之次月一日起生效。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第16條","text":"勞工退休金自勞工到職之日起提繳至離職當日止。但選擇自本條例施行之日起適用本條例之退休金制度者，其提繳自選擇適用本條例之退休金制度之日起至離職當日止。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第17條","text":"依第七條第二項自願提繳退休金者，由雇主或自營作業者向勞保局辦理開始或停止提繳手續，並按月扣、收繳提繳數額。\n前項自願提繳退休金者，自申報自願提繳之日起至申報停止提繳之當日止提繳退休金。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第18條","text":"雇主應於勞工到職、離職、復職或死亡之日起七日內，列表通知勞保局，辦理開始或停止提繳手續。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第19條","text":"雇主應提繳及收取之退休金數額，由勞保局繕具繳款單於次月二十五日前寄送事業單位，雇主應於再次月底前繳納。\n勞工自願提繳退休金者，由雇主向其收取後，連同雇主負擔部分，向勞保局繳納。其退休金之提繳，自申報自願提繳之日起至離職或申報停繳之日止。\n雇主未依限存入或存入金額不足時，勞保局應限期通知其繳納。\n自營作業者之退休金提繳，應以勞保局指定金融機構辦理自動轉帳方式繳納之，勞保局不另寄發繳款單。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第20條","text":"勞工留職停薪、入伍服役、因案停職或被羈押未經法院判決確定前，雇主應於發生事由之日起七日內以書面向勞保局申報停止提繳其退休金。勞工復職時，雇主應以書面向勞保局申報開始提繳退休金。\n因案停職或被羈押勞工復職後，應由雇主補發停職期間之工資者，雇主應於復職當月之再次月底前補提繳退休金。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第21條","text":"雇主提繳之金額，應每月以書面通知勞工。\n雇主應置備僱用勞工名冊，其內容包括勞工到職、離職、出勤工作紀錄、工資、每月提繳紀錄及相關資料，並保存至勞工離職之日起五年止。\n勞工依本條例規定選擇適用退休金制度相關文件之保存期限，依前項規定辦理。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第22條","text":"（刪除）","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第23條","text":"退休金之領取及計算方式如下：\n一、月退休金：勞工個人之退休金專戶本金及累積收益，依據年金生命表，以平均餘命及利率等基礎計算所得之金額，作為定期發給之退休金。\n二、一次退休金：一次領取勞工個人退休金專戶之本金及累積收益。\n前項提繳之勞工退休金運用收益，不得低於以當地銀行二年定期存款利率計算之收益；有不足者，由國庫補足之。\n第一項第一款所定年金生命表、平均餘命、利率及金額之計算，由勞保局擬訂，報請中央主管機關核定。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第24條","text":"勞工年滿六十歲，得依下列規定之方式請領退休金：\n一、工作年資滿十五年以上者，選擇請領月退休金或一次退休金。\n二、工作年資未滿十五年者，請領一次退休金。\n依前項第一款規定選擇請領退休金方式，經勞保局核付後，不得變更。\n第一項工作年資採計，以實際提繳退休金之年資為準。年資中斷者，其前後提繳年資合併計算。\n勞工不適用勞動基準法時，於有第一項規定情形者，始得請領。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第24-1條","text":"勞工領取退休金後繼續工作者，其提繳年資重新計算，雇主仍應依本條例規定提繳勞工退休金；勞工領取年資重新計算之退休金及其收益次數，一年以一次為限。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第24-2條","text":"勞工未滿六十歲，有下列情形之一，其工作年資滿十五年以上者，得請領月退休金或一次退休金。但工作年資未滿十五年者，應請領一次退休金：\n一、領取勞工保險條例所定之失能年金給付或失能等級三等以上之一次失能給付。\n二、領取國民年金法所定之身心障礙年金給付或身心障礙基本保證年金給付。\n三、非屬前二款之被保險人，符合得請領第一款失能年金給付或一次失能給付之失能種類、狀態及等級，或前款身心障礙年金給付或身心障礙基本保證年金給付之障礙種類、項目及狀態。\n依前項請領月退休金者，由勞工決定請領之年限。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第25條","text":"勞工開始請領月退休金時，應一次提繳一定金額，投保年金保險，作為超過第二十三條第三項所定平均餘命後之年金給付之用。\n前項規定提繳金額、提繳程序及承保之保險人資格，由中央主管機關定之。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第26條","text":"勞工於請領退休金前死亡者，應由其遺屬或指定請領人請領一次退休金。\n已領取月退休金勞工，於未屆第二十三條第三項所定平均餘命或第二十四條之二第二項所定請領年限前死亡者，停止給付月退休金。其個人退休金專戶結算賸餘金額，由其遺屬或指定請領人領回。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第27條","text":"依前條規定請領退休金遺屬之順位如下：\n一、配偶及子女。\n二、父母。\n三、祖父母。\n四、孫子女。\n五、兄弟、姊妹。\n前項遺屬同一順位有數人時，應共同具領，有未具名之遺屬者，由具領之遺屬負責分配之；有死亡、拋棄或因法定事由喪失繼承權時，由其餘遺屬請領之。但生前預立遺囑指定請領人者，從其遺囑。\n勞工死亡後，有下列情形之一者，其退休金專戶之本金及累積收益應歸入勞工退休基金：\n一、無第一項之遺屬或指定請領人。\n二、第一項之遺屬或指定請領人之退休金請求權，因時效消滅。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第28條","text":"勞工或其遺屬或指定請領人請領退休金時，應填具申請書，並檢附相關文件向勞保局請領；相關文件之內容及請領程序，由勞保局定之。\n請領手續完備，經審查應予發給月退休金者，應自收到申請書次月起按季發給；其為請領一次退休金者，應自收到申請書之日起三十日內發給。\n勞工或其遺屬或指定請領人請領之退休金結算基準，由中央主管機關定之。\n第一項勞工之遺屬或指定請領人退休金請求權，自得請領之日起，因十年間不行使而消滅。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第29條","text":"勞工之退休金及請領勞工退休金之權利，不得讓與、扣押、抵銷或供擔保。\n勞工依本條例規定請領退休金者，得檢具勞保局出具之證明文件，於金融機構開立專戶，專供存入退休金之用。\n前項專戶內之存款，不得作為抵銷、扣押、供擔保或強制執行之標的。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第30條","text":"雇主應為勞工提繳之金額，不得因勞工離職，扣留勞工工資作為賠償或要求勞工繳回。約定離職時應賠償或繳回者，其約定無效。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第31條","text":"雇主未依本條例之規定按月提繳或足額提繳勞工退休金，致勞工受有損害者，勞工得向雇主請求損害賠償。\n前項請求權，自勞工離職時起，因五年間不行使而消滅。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第32條","text":"勞工退休基金之來源如下：\n一、勞工個人專戶之退休金。\n二、基金運用之收益。\n三、收繳之滯納金。\n四、其他收入。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第33條","text":"勞工退休基金除作為給付勞工退休金及投資運用之用外，不得扣押、供擔保或移作他用；其管理、運用及盈虧分配之辦法，由中央主管機關擬訂，報請行政院核定之。\n勞工退休基金之管理、經營及運用業務，由勞動部勞動基金運用局（以下簡稱基金運用局）辦理；該基金之經營及運用，基金運用局得委託金融機構辦理，委託經營規定、範圍及經費，由基金運用局擬訂，報請中央主管機關核定之。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第34條","text":"勞保局與基金運用局對於勞工退休金及勞工退休基金之財務收支，應分戶立帳，並與其辦理之其他業務分開處理；其相關之會計報告及年度決算，應依有關法令規定辦理，並由基金運用局彙整，報請中央主管機關備查。\n勞工退休基金之收支、運用與其積存金額及財務報表，基金運用局應按月報請中央主管機關備查，中央主管機關應按年公告之。","title":"第 三 章 退休金專戶之提繳與請領"},{"no":"第35條","text":"事業單位僱用勞工人數二百人以上，經工會同意，或無工會者，經勞資會議同意後，得為以書面選擇投保年金保險之勞工，投保符合保險法規定之年金保險。\n前項選擇投保年金保險之勞工，雇主得不依第六條第一項規定為其提繳勞工退休金。\n第一項所定年金保險之收支、核准及其他應遵行事項之辦法，由中央主管機關定之；事業單位採行前項規定之年金保險者，應報請中央主管機關核准。\n第一項年金保險之平均收益率不得低於第二十三條之標準。","title":"第 四 章 年金保險"},{"no":"第35-1條","text":"保險人應依保險法規定專設帳簿，記載其投資資產之價值。\n勞工死亡後無遺屬或指定請領人者，其年金保險退休金之本金及累積收益，應歸入年金保險專設帳簿之資產。","title":"第 四 章 年金保險"},{"no":"第35-2條","text":"實施年金保險之事業單位內適用本條例之勞工，得以一年一次為限，變更原適用之退休金制度，改為參加個人退休金專戶或年金保險，原已提存之退休金或年金保險費，繼續留存。雇主應於勞工書面選擇變更之日起十五日內，檢附申請書向勞保局及保險人申報。","title":"第 四 章 年金保險"},{"no":"第36條","text":"雇主每月負擔之年金保險費，不得低於勞工每月工資百分之六。\n前項雇主應負擔之年金保險費，及勞工自願提繳之年金保險費數額，由保險人繕具繳款單於次月二十五日前寄送事業單位，雇主應於再次月月底前繳納。雇主應提繳保險費之收繳情形，保險人應於繳納期限之次月七日前通知勞保局。\n勞工自願提繳年金保險費者，由雇主向其收取後，連同雇主負擔部分，向保險人繳納。其保險費之提繳，自申報自願提繳之日起至離職或申報停繳之日止。\n雇主逾期未繳納年金保險費者，保險人應即進行催收，並限期雇主於應繳納期限之次月月底前繳納，催收結果應於再次月之七日前通知勞保局。","title":"第 四 章 年金保險"},{"no":"第37條","text":"年金保險之契約應由雇主擔任要保人，勞工為被保險人及受益人。事業單位以向一保險人投保為限。保險人之資格，由中央主管機關會同該保險業務之主管機關定之。","title":"第 四 章 年金保險"},{"no":"第38條","text":"勞工離職後再就業，所屬年金保險契約應由新雇主擔任要保人，繼續提繳保險費。新舊雇主開辦或參加之年金保險提繳率不同時，其差額由勞工自行負擔。但新雇主自願負擔者，不在此限。\n前項勞工之新雇主未辦理年金保險者，應依第六條第一項規定提繳退休金。除勞雇雙方另有約定外，所屬年金保險契約之保險費由勞工全額自行負擔；勞工無法提繳時，年金保險契約之存續，依保險法及各該保險契約辦理。\n第一項勞工離職再就業時，得選擇由雇主依第六條第一項規定提繳退休金。\n勞工離職再就業，前後適用不同退休金制度時，選擇移轉年金保險之保單價值準備金至個人退休金專戶，或個人退休金專戶之本金及收益至年金保險者，應全額移轉，且其已提繳退休金之存儲期間，不得低於四年。","title":"第 四 章 年金保險"},{"no":"第39條","text":"第七條至第十三條、第十四條第二項至第五項、第十五條、第十六條、第二十條、第二十一條、第二十四條、第二十四條之一、第二十四條之二、第二十七條第一項、第二項、第二十九條至第三十一條規定，於本章所定年金保險準用之。","title":"第 四 章 年金保險"},{"no":"第40條","text":"為確保勞工權益，主管機關、勞動檢查機構或勞保局必要時得查對事業單位勞工名冊及相關資料。\n勞工發現雇主違反本條例規定時，得向雇主、勞保局、勞動檢查機構或主管機關提出申訴，雇主不得因勞工提出申訴，對其做出任何不利之處分。","title":"第 五 章 監督及經費"},{"no":"第41條","text":"受委託運用勞工退休基金之金融機構，發現有意圖干涉、操縱、指示其運用或其他有損勞工利益之情事時，應通知基金運用局。基金運用局認有處置必要者，應即通知中央主管機關採取必要措施。","title":"第 五 章 監督及經費"},{"no":"第42條","text":"主管機關、勞保局、基金運用局、受委託之金融機構及其相關機關、團體所屬人員，不得對外公布業務處理上之秘密或謀取非法利益，並應善盡管理人忠誠義務，為基金謀取最大之效益。","title":"第 五 章 監督及經費"},{"no":"第43條","text":"勞保局及基金運用局辦理本條例規定行政所須之費用，應編列預算支應。","title":"第 五 章 監督及經費"},{"no":"第44條","text":"勞保局及基金運用局辦理本條例規定業務之一切帳冊、單據及業務收支，均免課稅捐。","title":"第 五 章 監督及經費"},{"no":"第45條","text":"受委託運用勞工退休基金之機構違反第三十三條第二項規定，將勞工退休基金用於非指定之投資運用項目者，處新臺幣二百萬元以上一千萬元以下罰鍰，中央主管機關並應限期令其附加利息歸還。","title":"第 六 章 罰則"},{"no":"第45-1條","text":"雇主有下列各款情事之一者，處新臺幣三十萬元以上一百五十萬元以下罰鍰，並限期令其給付；屆期未給付者，應按次處罰：\n一、違反第十一條第二項或第十二條第一項、第二項規定之給與標準或期限。\n二、違反第三十九條準用第十一條第二項或第十二條第一項、第二項規定之給與標準或期限。","title":"第 六 章 罰則"},{"no":"第46條","text":"保險人違反第三十六條第二項規定，未於期限內通知勞保局者，處新臺幣六萬元以上三十萬元以下罰鍰，並限期令其改善；屆期未改善者，應按次處罰。","title":"第 六 章 罰則"},{"no":"第47條","text":"（刪除）","title":"第 六 章 罰則"},{"no":"第48條","text":"事業單位違反第四十條規定，拒絕提供資料或對提出申訴勞工為不利處分者，處新臺幣三萬元以上三十萬元以下罰鍰。","title":"第 六 章 罰則"},{"no":"第49條","text":"雇主違反第八條之一第五項、第九條、第十八條、第二十條第一項、第二十一條第二項、第三十五條之二或第三十九條規定，未辦理申報提繳、停繳手續、置備名冊或保存文件，經限期改善，屆期未改善者，處新臺幣二萬元以上十萬元以下罰鍰，並按月處罰至改正為止。","title":"第 六 章 罰則"},{"no":"第50條","text":"雇主違反第十三條第一項規定，未繼續按月提撥勞工退休準備金者，處新臺幣二萬元以上三十萬元以下罰鍰，並應按月處罰，不適用勞動基準法之罰鍰規定。\n主管機關對於前項應執行而未執行時，應以公務員考績法令相關處罰規定辦理。\n第一項收繳之罰鍰，歸入勞動基準法第五十六條第三項勞工退休基金。","title":"第 六 章 罰則"},{"no":"第51條","text":"雇主違反第三十條或第三十九條規定，扣留勞工工資者，處新臺幣一萬元以上五萬元以下罰鍰。","title":"第 六 章 罰則"},{"no":"第52條","text":"雇主違反第十五條第二項、第二十一條第一項或第三十九條申報、通知規定者，處新臺幣五千元以上二萬五千元以下罰鍰。","title":"第 六 章 罰則"},{"no":"第53條","text":"雇主違反第十四條第一項、第十九條第一項或第二十條第二項規定，未按時提繳或繳足退休金者，自期限屆滿之次日起至完繳前一日止，每逾一日加徵其應提繳金額百分之三滯納金至應提繳金額之一倍為止。\n前項雇主欠繳之退休金，經勞保局限期令其繳納，屆期未繳納者，依法移送行政執行。雇主有不服者，得依法提起行政救濟。\n雇主違反第三十六條及第三十九條規定，未按時繳納或繳足保險費者，處其應負擔金額同額之罰鍰，並按月處罰至改正為止。\n第一項及第二項規定，溯自中華民國九十四年七月一日生效。","title":"第 六 章 罰則"},{"no":"第53-1條","text":"雇主違反本條例，經主管機關或勞保局處以罰鍰或加徵滯納金者，應公布其事業單位或事業主之名稱、負責人姓名、處分期日、違反條文及處分金額；受委託運用勞工退休基金之機構經依第四十五條規定處以罰鍰者，亦同。","title":"第 六 章 罰則"},{"no":"第54條","text":"依本條例加徵之滯納金及所處之罰鍰，受處分人應於收受通知之日起三十日內繳納；屆期未繳納者，依法移送行政執行。\n第三十九條所定年金保險之罰鍰處分及移送行政執行業務，委任勞保局辦理之。","title":"第 六 章 罰則"},{"no":"第54-1條","text":"雇主未依本條例規定繳納退休金或滯納金，且無財產可供執行或其財產不足清償者，由其代表人或負責人負清償責任。\n前項代表人或負責人經勞保局限期令其繳納，屆期未繳納者，依法移送行政執行。","title":"第 六 章 罰則"},{"no":"第55條","text":"法人之代表人或其他從業人員、自然人之代理人或受僱人，因執行業務違反本條例規定，除依本章規定處罰行為人外，對該法人或自然人並應處以各該條所定之罰鍰。但法人之代表人或自然人對於違反之發生，已盡力為防止行為者，不在此限。\n法人之代表人或自然人教唆或縱容為違反之行為者，以行為人論。","title":"第 六 章 罰則"},{"no":"第56條","text":"事業單位因分割、合併或轉讓而消滅者，其積欠勞工之退休金，應由受讓之事業單位當然承受。","title":"第 七 章 附則"},{"no":"第56-1條","text":"勞保局對於雇主未依本條例規定繳納之退休金及滯納金，優先於普通債權受清償。","title":"第 七 章 附則"},{"no":"第56-2條","text":"勞工退休金不適用下列規定：\n一、公司法有關公司重整之債務免責規定。\n二、消費者債務清理條例有關清算之債務免責規定。\n三、破產法有關破產之債務免責規定。","title":"第 七 章 附則"},{"no":"第56-3條","text":"勞保局為辦理勞工退休金業務所需必要資料，得請相關機關提供，各該機關不得拒絕。\n勞保局依前項規定取得之資料，應盡善良管理人之注意義務，相關資料之保有、處理及利用等事項，應依個人資料保護法之規定為之。","title":"第 七 章 附則"},{"no":"第57條","text":"本條例施行細則，由中央主管機關定之。","title":"第 七 章 附則"},{"no":"第58條","text":"本條例自公布後一年施行。\n本條例修正條文，除已另定施行日期者外，自公布日施行。","title":"第 七 章 附則"}],"tags":["勞動","勞退"],"note":"第 7 條適用對象；公務機構臨時人員自 95.1.1 起提繳。"},{"id":"C04","name":"政府採購法","pcode":"A0030057","level":"法律","authority":"行政院公共工程委員會","category":"行政＞行政院公共工程委員會＞通用目","modified_date":"2019-05-22","history":[{"date":"1998-05-27","summary":"中華民國八十七年五月二十七日總統（87）華總（一）義字第 8700105740 號令制定公布全文 114 條；依第 114 條規定：自公布後一年施行"},{"date":"2001-01-10","summary":"中華民國九十年一月十日總統（90）華總一義字第 9000003820 號令修正公布第 7 條條文"},{"date":"2002-02-06","summary":"中華民國九十一年二月六日總統（91）華總一義字第 09100025610 號令修正公布第 6、11、13、20、22、24、25、28、30、34、35、37、40、48、50、66、70、74、75、76、78、83、85～88、95、97、98、101～103、114 條條文；並刪除第 69 條條文；並增訂第 85-1～85-4、93-1 條條文；並自公布日施行"},{"date":"2007-07-04","summary":"中華民國九十六年七月四日總統華總一義字第 09600085741 號令修正公布第 85-1 條條文"},{"date":"2011-01-26","summary":"中華民國一百年一月二十六日總統華總一義字第 10000015641 號令修正公布第 11、52、63 條條文中華民國一百零一年二月三日行政院院臺規字第 1010122318 號公告第13 條第 4 項所列屬「行政院主計處」之權責事項，自一百零一年二月六日起改由「行政院主計總處」管轄"},{"date":"2016-01-06","summary":"中華民國一百零五年一月六日總統華總一義字第 10400154101 號令修正公布第 85-1、86 條條文；增訂 73-1 條條文"},{"date":"2019-05-22","summary":"中華民國一百零八年五月二十二日總統華總一義字第 10800049691 號令修正公布第 4、15、17、22、25、30、31、50、52、59、63、76、85、93、94、95、101、103 條條文；增訂第 11-1、26-1、70-1 條條文中華民國一百十二年八月十八日行政院院臺規字第 1121028221 號公告第 96 條第 3 項所列屬「行政院環境保護署」之權責事項，自一百十二年八月二十二日起改由「環境部」管轄"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030057","articles":[{"no":"第1條","text":"為建立政府採購制度，依公平、公開之採購程序，提升採購效率與功能，確保採購品質，爰制定本法。","title":"第 一 章 總則"},{"no":"第2條","text":"本法所稱採購，指工程之定作、財物之買受、定製、承租及勞務之委任或僱傭等。","title":"第 一 章 總則"},{"no":"第3條","text":"政府機關、公立學校、公營事業（以下簡稱機關）辦理採購，依本法之規定；本法未規定者，適用其他法律之規定。","title":"第 一 章 總則"},{"no":"第4條","text":"法人或團體接受機關補助辦理採購，其補助金額占採購金額半數以上，且補助金額在公告金額以上者，適用本法之規定，並應受該機關之監督。\n藝文採購不適用前項規定，但應受補助機關之監督；其辦理原則、適用範圍及監督管理辦法，由文化部定之。","title":"第 一 章 總則"},{"no":"第5條","text":"機關採購得委託法人或團體代辦。\n前項採購適用本法之規定，該法人或團體並受委託機關之監督。","title":"第 一 章 總則"},{"no":"第6條","text":"機關辦理採購，應以維護公共利益及公平合理為原則，對廠商不得為無正當理由之差別待遇。\n辦理採購人員於不違反本法規定之範圍內，得基於公共利益、採購效益或專業判斷之考量，為適當之採購決定。\n司法、監察或其他機關對於採購機關或人員之調查、起訴、審判、彈劾或糾舉等，得洽請主管機關協助、鑑定或提供專業意見。","title":"第 一 章 總則"},{"no":"第7條","text":"本法所稱工程，指在地面上下新建、增建、改建、修建、拆除構造物與其所屬設備及改變自然環境之行為，包括建築、土木、水利、環境、交通、機械、電氣、化工及其他經主管機關認定之工程。\n本法所稱財物，指各種物品（生鮮農漁產品除外）、材料、設備、機具與其他動產、不動產、權利及其他經主管機關認定之財物。\n本法所稱勞務，指專業服務、技術服務、資訊服務、研究發展、營運管理、維修、訓練、勞力及其他經主管機關認定之勞務。\n採購兼有工程、財物、勞務二種以上性質，難以認定其歸屬者，按其性質所占預算金額比率最高者歸屬之。","title":"第 一 章 總則"},{"no":"第8條","text":"本法所稱廠商，指公司、合夥或獨資之工商行號及其他得提供各機關工程、財物、勞務之自然人、法人、機構或團體。","title":"第 一 章 總則"},{"no":"第9條","text":"本法所稱主管機關，為行政院採購暨公共工程委員會，以政務委員一人兼任主任委員。\n本法所稱上級機關，指辦理採購機關直屬之上一級機關。其無上級機關者，由該機關執行本法所規定上級機關之職權。","title":"第 一 章 總則"},{"no":"第10條","text":"主管機關掌理下列有關政府採購事項︰\n一、政府採購政策與制度之研訂及政令之宣導。\n二、政府採購法令之研訂、修正及解釋。\n三、標準採購契約之檢討及審定。\n四、政府採購資訊之蒐集、公告及統計。\n五、政府採購專業人員之訓練。\n六、各機關採購之協調、督導及考核。\n七、中央各機關採購申訴之處理。\n八、其他關於政府採購之事項。","title":"第 一 章 總則"},{"no":"第11條","text":"主管機關應設立採購資訊中心，統一蒐集共通性商情及同等品分類之資訊，並建立工程價格資料庫，以供各機關採購預算編列及底價訂定之參考。除應秘密之部分外，應無償提供廠商。\n機關辦理工程採購之預算金額達一定金額以上者，應於決標後將得標廠商之單價資料傳輸至前項工程價格資料庫。\n前項一定金額、傳輸資料內容、格式、傳輸方式及其他相關事項之辦法，由主管機關定之。\n財物及勞務項目有建立價格資料庫之必要者，得準用前二項規定。","title":"第 一 章 總則"},{"no":"第11-1條","text":"機關辦理巨額工程採購，應依採購之特性及實際需要，成立採購工作及審查小組，協助審查採購需求與經費、採購策略、招標文件等事項，及提供與採購有關事務之諮詢。\n機關辦理第一項以外之採購，依採購特性及實際需要，認有成立採購工作及審查小組之必要者，準用前項規定。\n前二項採購工作及審查小組之組成、任務、審查作業及其他相關事項之辦法，由主管機關定之。","title":"第 一 章 總則"},{"no":"第12條","text":"機關辦理查核金額以上採購之開標、比價、議價、決標及驗收時，應於規定期限內，檢送相關文件報請上級機關派員監辦；上級機關得視事實需要訂定授權條件，由機關自行辦理。\n機關辦理未達查核金額之採購，其決標金額達查核金額者，或契約變更後其金額達查核金額者，機關應補具相關文件送上級機關備查。\n查核金額由主管機關定之。","title":"第 一 章 總則"},{"no":"第13條","text":"機關辦理公告金額以上採購之開標、比價、議價、決標及驗收，除有特殊情形者外，應由其主（會）計及有關單位會同監辦。\n未達公告金額採購之監辦，依其屬中央或地方，由主管機關、直轄市或縣（市）政府另定之。未另定者，比照前項規定辦理。\n公告金額應低於查核金額，由主管機關參酌國際標準定之。\n第一項會同監辦採購辦法，由主管機關會同行政院主計處定之。","title":"第 一 章 總則"},{"no":"第14條","text":"機關不得意圖規避本法之適用，分批辦理公告金額以上之採購。其有分批辦理之必要，並經上級機關核准者，應依其總金額核計採購金額，分別按公告金額或查核金額以上之規定辦理。","title":"第 一 章 總則"},{"no":"第15條","text":"機關承辦、監辦採購人員離職後三年內不得為本人或代理廠商向原任職機關接洽處理離職前五年內與職務有關之事務。\n機關人員對於與採購有關之事項，涉及本人、配偶、二親等以內親屬，或共同生活家屬之利益時，應行迴避。\n機關首長發現前項人員有應行迴避之情事而未依規定迴避者，應令其迴避，並另行指定人員辦理。","title":"第 一 章 總則"},{"no":"第16條","text":"請託或關說，宜以書面為之或作成紀錄。\n政風機構得調閱前項書面或紀錄。\n第一項之請託或關說，不得作為評選之參考。","title":"第 一 章 總則"},{"no":"第17條","text":"外國廠商參與各機關採購，應依我國締結之條約或協定之規定辦理。\n前項以外情形，外國廠商參與各機關採購之處理辦法，由主管機關定之。\n外國法令限制或禁止我國廠商或產品服務參與採購者，主管機關得限制或禁止該國廠商或產品服務參與採購。\n機關辦理涉及國家安全之採購，有對我國或外國廠商資格訂定限制條件之必要者，其限制條件及審查相關作業事項之辦法，由主管機關會商相關目的事業主管機關定之。","title":"第 一 章 總則"},{"no":"第18條","text":"採購之招標方式，分為公開招標、選擇性招標及限制性招標。\n本法所稱公開招標，指以公告方式邀請不特定廠商投標。\n本法所稱選擇性招標，指以公告方式預先依一定資格條件辦理廠商資格審查後，再行邀請符合資格之廠商投標。\n本法所稱限制性招標，指不經公告程序，邀請二家以上廠商比價或僅邀請一家廠商議價。","title":"第 二 章 招標"},{"no":"第19條","text":"機關辦理公告金額以上之採購，除依第二十條及第二十二條辦理者外，應公開招標。","title":"第 二 章 招標"},{"no":"第20條","text":"機關辦理公告金額以上之採購，符合下列情形之一者，得採選擇性招標：\n一、經常性採購。\n二、投標文件審查，須費時長久始能完成者。\n三、廠商準備投標需高額費用者。\n四、廠商資格條件複雜者。\n五、研究發展事項。","title":"第 二 章 招標"},{"no":"第21條","text":"機關為辦理選擇性招標，得預先辦理資格審查，建立合格廠商名單。但仍應隨時接受廠商資格審查之請求，並定期檢討修正合格廠商名單。\n未列入合格廠商名單之廠商請求參加特定招標時，機關於不妨礙招標作業，並能適時完成其資格審查者，於審查合格後，邀其投標。\n經常性採購，應建立六家以上之合格廠商名單。\n機關辦理選擇性招標，應予經資格審查合格之廠商平等受邀之機會。","title":"第 二 章 招標"},{"no":"第22條","text":"機關辦理公告金額以上之採購，符合下列情形之一者，得採限制性招標：\n一、以公開招標、選擇性招標或依第九款至第十一款公告程序辦理結果，無廠商投標或無合格標，且以原定招標內容及條件未經重大改變者。\n二、屬專屬權利、獨家製造或供應、藝術品、秘密諮詢，無其他合適之替代標的者。\n三、遇有不可預見之緊急事故，致無法以公開或選擇性招標程序適時辦理，且確有必要者。\n四、原有採購之後續維修、零配件供應、更換或擴充，因相容或互通性之需要，必須向原供應廠商採購者。\n五、屬原型或首次製造、供應之標的，以研究發展、實驗或開發性質辦理者。\n六、在原招標目的範圍內，因未能預見之情形，必須追加契約以外之工程，如另行招標，確有產生重大不便及技術或經濟上困難之虞，非洽原訂約廠商辦理，不能達契約之目的，且未逾原主契約金額百分之五十者。\n七、原有採購之後續擴充，且已於原招標公告及招標文件敘明擴充之期間、金額或數量者。\n八、在集中交易或公開競價市場採購財物。\n九、委託專業服務、技術服務、資訊服務或社會福利服務，經公開客觀評選為優勝者。\n十、辦理設計競賽，經公開客觀評選為優勝者。\n十一、因業務需要，指定地區採購房地產，經依所需條件公開徵求勘選認定適合需要者。\n十二、購買身心障礙者、原住民或受刑人個人、身心障礙福利機構或團體、政府立案之原住民團體、監獄工場、慈善機構及庇護工場所提供之非營利產品或勞務。\n十三、委託在專業領域具領先地位之自然人或經公告審查優勝之學術或非營利機構進行科技、技術引進、行政或學術研究發展。\n十四、邀請或委託具專業素養、特質或經公告審查優勝之文化、藝術專業人士、機構或團體表演或參與文藝活動或提供文化創意服務。\n十五、公營事業為商業性轉售或用於製造產品、提供服務以供轉售目的所為之採購，基於轉售對象、製程或供應源之特性或實際需要，不適宜以公開招標或選擇性招標方式辦理者。\n十六、其他經主管機關認定者。\n前項第九款專業服務、技術服務、資訊服務及第十款之廠商評選辦法與服務費用計算方式與第十一款、第十三款及第十四款之作業辦法，由主管機關定之。\n第一項第九款社會福利服務之廠商評選辦法與服務費用計算方式，由主管機關會同中央目的事業主管機關定之。\n第一項第十三款及第十四款，不適用工程採購。","title":"第 二 章 招標"},{"no":"第23條","text":"未達公告金額之招標方式，在中央由主管機關定之；在地方由直轄市或縣（市）政府定之。地方未定者，比照中央規定辦理。","title":"第 二 章 招標"},{"no":"第24條","text":"機關基於效率及品質之要求，得以統包辦理招標。\n前項所稱統包，指將工程或財物採購中之設計與施工、供應、安裝或一定期間之維修等併於同一採購契約辦理招標。\n統包實施辦法，由主管機關定之。","title":"第 二 章 招標"},{"no":"第25條","text":"機關得視個別採購之特性，於招標文件中規定允許一定家數內之廠商共同投標。\n第一項所稱共同投標，指二家以上之廠商共同具名投標，並於得標後共同具名簽約，連帶負履行採購契約之責，以承攬工程或提供財物、勞務之行為。\n共同投標以能增加廠商之競爭或無不當限制競爭者為限。\n同業共同投標應符合公平交易法第十五條第一項但書各款之規定。\n共同投標廠商應於投標時檢附共同投標協議書。\n共同投標辦法，由主管機關定之。","title":"第 二 章 招標"},{"no":"第26條","text":"機關辦理公告金額以上之採購，應依功能或效益訂定招標文件。其有國際標準或國家標準者，應從其規定。\n機關所擬定、採用或適用之技術規格，其所標示之擬採購產品或服務之特性，諸如品質、性能、安全、尺寸、符號、術語、包裝、標誌及標示或生產程序、方法及評估之程序，在目的及效果上均不得限制競爭。\n招標文件不得要求或提及特定之商標或商名、專利、設計或型式、特定來源地、生產者或供應者。但無法以精確之方式說明招標要求，而已在招標文件內註明諸如「或同等品」字樣者，不在此限。","title":"第 二 章 招標"},{"no":"第26-1條","text":"機關得視採購之特性及實際需要，以促進自然資源保育與環境保護為目的，依前條規定擬定技術規格，及節省能源、節約資源、減少溫室氣體排放之相關措施。\n前項增加計畫經費或技術服務費用者，於擬定規格或措施時應併入計畫報核編列預算。","title":"第 二 章 招標"},{"no":"第27條","text":"機關辦理公開招標或選擇性招標，應將招標公告或辦理資格審查之公告刊登於政府採購公報並公開於資訊網路。公告之內容修正時，亦同。\n前項公告內容、公告日數、公告方法及政府採購公報發行辦法，由主管機關定之。\n機關辦理採購時，應估計採購案件之件數及每件之預計金額。預算及預計金額，得於招標公告中一併公開。","title":"第 二 章 招標"},{"no":"第28條","text":"機關辦理招標，其自公告日或邀標日起至截止投標或收件日止之等標期，應訂定合理期限。其期限標準，由主管機關定之。","title":"第 二 章 招標"},{"no":"第29條","text":"公開招標之招標文件及選擇性招標之預先辦理資格審查文件，應自公告日起至截止投標日或收件日止，公開發給、發售及郵遞方式辦理。發給、發售或郵遞時，不得登記領標廠商之名稱。\n選擇性招標之文件應公開載明限制投標廠商資格之理由及其必要性。\n第一項文件內容，應包括投
