<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>契約人力制度查詢</title>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--border:rgba(11,11,11,.10);--accent:#2a78d6;--accent-soft:#cde2fb;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
  --good:#0ca30c;--warn:#fab219;--crit:#d03b3b;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;
    --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);--accent:#3987e5;--accent-soft:#1c5cab;
    --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;
  --grid:#2c2c2a;--axis:#383835;--border:rgba(255,255,255,.10);--accent:#3987e5;--accent-soft:#1c5cab;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
header h1{font-size:17px;margin:0;font-weight:600}
header .meta{color:var(--muted);font-size:12px}
nav{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
nav button{border:1px solid var(--border);background:transparent;color:var(--ink2);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:14px}
nav button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:1200px;margin:0 auto;padding:16px}
section[hidden]{display:none}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.toolbar input[type=search],.toolbar select{font:inherit;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);min-width:160px}
.toolbar input[type=search]{flex:1 1 260px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--ink2);padding:3px 10px;border-radius:999px;font-size:13px;cursor:pointer;user-select:none}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.chip .sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:16px}
.card .sub{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink);margin:2px 4px 2px 0}
.count{color:var(--muted);font-size:13px;margin-left:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--grid);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--ink2);font-weight:600;background:var(--surface);position:sticky;top:0;z-index:1}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
details summary{cursor:pointer;color:var(--accent)}
article.law{white-space:pre-wrap;font-size:14px}
article.law .art{margin:8px 0;padding-left:8px;border-left:3px solid var(--grid)}
article.law .art b{color:var(--ink2)}
mark{background:#fff3b0;color:#0b0b0b;padding:0 1px}
.timeline{position:relative;padding-left:24px}
.timeline:before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--grid)}
.tl{position:relative;margin-bottom:14px}
.tl:before{content:"";position:absolute;left:-21px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.tl .date{font-weight:600;font-variant-numeric:tabular-nums}
.tl .actor{color:var(--muted);font-size:13px}
.matrix td{min-width:170px}
.matrix td .b{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.matrix tr td:first-child{font-weight:600;background:var(--surface);position:sticky;left:0}
.chartcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px 4px;margin-bottom:12px;position:relative}
.chartcard h3{margin:0 0 2px;font-size:15px}
.chartcard .sub{color:var(--muted);font-size:13px;margin-bottom:6px}
svg.chart{width:100%;height:340px;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);margin:4px 0 8px}
.legend i{display:inline-block;width:14px;height:2px;background:currentColor;vertical-align:middle;margin-right:6px;border-radius:1px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.12);display:none;z-index:3;min-width:160px}
.tip b{font-variant-numeric:tabular-nums}
.tip .k{display:inline-block;width:12px;height:2px;margin-right:6px;vertical-align:middle}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.note{color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:24px;text-align:center}
.src a{color:var(--accent);text-decoration:none}
.src a:hover{text-decoration:underline}
.ok{color:var(--good)}.na{color:var(--muted)}
@media (max-width:640px){main{padding:10px}.matrix td{min-width:140px}}
</style>
</head>
<body>
<header>
  <h1>契約人力制度查詢</h1>
  <span class="meta" id="built"></span>
  <nav id="nav" role="tablist">
    <button role="tab" data-tab="laws">法規</button>
    <button role="tab" data-tab="timeline">沿革</button>
    <button role="tab" data-tab="compare">權益對照</button>
    <button role="tab" data-tab="headcount">員額趨勢</button>
    <button role="tab" data-tab="local">地方樣態</button>
  </nav>
</header>
<main>
<section id="tab-laws" hidden>
  <div class="toolbar">
    <input type="search" id="lawq" placeholder="搜尋法規名稱或條文全文（空白分隔多關鍵字）">
    <select id="lawtag"><option value="">全部人員類別／主題</option></select>
    <select id="lawlevel"><option value="">全部位階</option></select>
    <span class="count" id="lawcount"></span>
  </div>
  <div id="lawlist"></div>
</section>
<section id="tab-timeline" hidden>
  <div class="toolbar">
    <input type="search" id="tlq" placeholder="搜尋事件">
    <select id="tlactor"><option value="">全部行動者</option></select>
    <select id="tlcat"><option value="">全部類型</option></select>
    <span class="count" id="tlcount"></span>
  </div>
  <div class="grid2">
    <div><div class="timeline" id="tllist"></div></div>
    <div id="drafts"></div>
  </div>
</section>
<section id="tab-compare" hidden>
  <div class="toolbar">
    <span id="cmpgroups"></span>
    <span class="count" id="cmpnote"></span>
  </div>
  <div class="tablewrap"><table class="matrix" id="cmptable"></table></div>
</section>
<section id="tab-headcount" hidden>
  <div class="toolbar">
    <select id="hcscope"></select>
    <select id="hcgroup"></select>
    <select id="hcmeasure"></select>
    <span id="hccats"></span>
  </div>
  <div class="chartcard">
    <h3 id="hctitle">各類人員人數</h3>
    <div class="sub" id="hcsub"></div>
    <div class="legend" id="hclegend"></div>
    <svg class="chart" id="hcsvg" role="img" aria-label="各類人員人數折線圖"></svg>
    <div class="tip" id="hctip"></div>
  </div>
  <details><summary>資料表（含來源）</summary><div class="tablewrap"><table id="hctable"></table></div></details>
  <p class="note">提示：先選「中央」「總員額法第二類」與「臨時人員」兩條線並列，即可檢視目的二的「第二類員額消退 vs 約用人員增加」對照。</p>
</section>
<section id="tab-local" hidden>
  <div class="toolbar">
    <input type="search" id="lgq" placeholder="搜尋縣市或規定內容">
    <select id="lgfilter">
      <option value="">全部</option>
      <option value="political">有隨首長進退條款</option>
      <option value="caps">有總量管制</option>
      <option value="core">有核心／公權力限制</option>
      <option value="lsa">適用勞基法</option>
    </select>
    <span class="count" id="lgcount"></span>
  </div>
  <div class="tablewrap"><table id="lgtable"></table></div>
  <div id="lgcards" style="margin-top:12px"></div>
</section>
</main>
<script>
const DATA = {"built":"2026-10-31","laws":[{"id":"A01","name":"聘用人員聘用條例","pcode":"S0020014","level":"法律","authority":"銓敘部","category":"考試＞銓敘部＞任用目","modified_date":"1972-02-03","history":[{"date":"1969-04-28","summary":"中華民國五十八年四月二十八日總統令制定公布全文 10 條"},{"date":"1972-02-03","summary":"中華民國六十一年二月三日總統令修正公布第 6 條條文"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=S0020014","articles":[{"no":"第1條","text":"本條例依公務人員任用法第二十一條之規定制定之。"},{"no":"第2條","text":"各機關應業務需要，定期聘用人員，依本條例之規定；本條例未規定者，適用其他法律之規定。"},{"no":"第3條","text":"本條例所稱聘用人員，指各機關以契約定期聘用之專業或技術人員。其職稱、員額、期限及報酬，應詳列預算，並列冊送銓敘部登記備查；解聘時亦同。"},{"no":"第4條","text":"聘用契約應記載左列事項：\n　一、約聘期間。\n　二、約聘報酬。\n　三、業務內容及預定完成期限。\n  四、受聘人違背義務時應負之責任。"},{"no":"第5條","text":"聘用人員之約聘期間，有左列情形之一者，得予續聘：\n　一、原定約聘期間少於預定完成期限者。\n　二、因業務計畫變更或因不可抗力之事由，致預定完成期限必須延長者。"},{"no":"第6條","text":"聘用人員不適用俸給法、退休法及撫卹法之規定；其在約聘期間病故或因公死亡者，得酌給撫慰金。"},{"no":"第7條","text":"聘用人員不適用各該機關組織法規所定簡任職或薦任職各項職務之名稱，並不得兼任有職等之職務。\n各機關法定主管職位，不得以聘用人員充任之。"},{"no":"第8條","text":"各機關聘用人員不合本條例規定者，其所支經費，審計機關應不予核銷。"},{"no":"第9條","text":"本條例施行細則，由考試院定之。"},{"no":"第10條","text":"本條例自公布日施行。"}],"tags":["聘用","契約人力","本體法規"],"note":"聘用人員之母法；依公務人員任用法第 36 條（原第 21 條）制定。"},{"id":"A02","name":"聘用人員聘用條例施行細則","pcode":"S0020015","level":"命令","authority":"銓敘部","category":"考試＞銓敘部＞任用目","modified_date":"2019-10-01","history":[{"date":"1969-08-12","summary":"中華民國五十八年八月十二日考試院（58）考台秘一字第 1694 號令訂定發布全文 9 條"},{"date":"1971-12-22","summary":"中華民國六十年十二月二十二日考試院（60）考台秘一字第 2641 號令修正發布第 8 條條文"},{"date":"1982-07-15","summary":"中華民國七十一年七月十五日考試院（71）考台秘議字第 2601 號令修正發布第 1、3 條各款款次數字及第 9 條條文"},{"date":"2007-06-23","summary":"中華民國九十六年六月二十三日考試院考臺組貳二字第 09600043841號令修正發布第 3 條條文"},{"date":"2019-10-01","summary":"中華民國一百零八年十月一日考試院考臺組貳二字第 10800078141 號令修正發布第 6 條條文"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=S0020015","articles":[{"no":"第1條","text":"本細則依聘用人員聘用條例第九條規定訂定之。"},{"no":"第2條","text":"本條例第二條所稱應業務需要，以發展科學技術，或執行專門性之業務，或專司技術性研究設計工作，非本機關現有人員所能擔任者為限。"},{"no":"第3條","text":"本條例第三條所稱專業或技術人員，指所具專門知能堪任前條各項工作者而言。其約聘應經主管機關核准。所稱列冊送銓敘部，應將聘用人員之職務、姓名、年齡、籍貫、擔任事項、約聘期限及報酬；連同履歷表，分別造填二份，於到職後一個月內，送銓敘部登記備查。\n前項主管機關為：\n一、總統府。\n二、國家安全會議。\n三、行政院。\n四、立法院。\n五、司法院。\n六、考試院。\n七、監察院。"},{"no":"第4條","text":"聘用人員約聘期間，得以業務預定完成期限為準；其依本條例第五條之規定續聘者，應經主管機關核准，並通知銓敘部。"},{"no":"第5條","text":"本條例第四條所稱聘用契約，應由聘用機關以副本送存主管機關。"},{"no":"第6條","text":"本條例第六條所稱酌給撫慰金，依下列規定發給：\n一、病故者：按聘用人員約聘報酬發給十三又二分之一個月之一次給與。\n二、因公死亡者：按聘用人員約聘報酬發給二十七個月之一次給與。\n前項第二款因公死亡之情事比照公務人員退休資遣撫卹法及其相關規定，事由及因果關係之認定於遇有疑義時，各機關應延聘相關領域之學者或專家，組成專案審查小組審認之。\n撫慰金之遺族領受方式，比照勞工退休金條例遺屬請領退休金規定辦理。無遺族且無遺囑指定領受人者，得由原服務機關先行具領，辦理喪葬事宜，如有賸餘，歸屬公庫。\n聘用人員依法令留職停薪期間病故者，得依本條規定辦理。"},{"no":"第7條","text":"聘用人員旅居國外者，得參照國外出差旅費規則之標準，核給往返旅費。"},{"no":"第8條","text":"各機關現職人員不得以契約聘用，亦不得接受其他機關之約聘職務。"},{"no":"第9條","text":"本細則自發布之日施行。"}],"tags":["聘用","契約人力","本體法規"],"note":""},{"id":"A03","name":"行政院與所屬中央及地方各機關約僱人員僱用辦法","pcode":"S0110014","level":"命令","authority":"行政院人事行政總處","category":"行政＞行政院人事行政總處＞組編人力目","modified_date":"2022-09-13","history":[{"date":"1972-12-27","summary":"中華民國六十一年十二月二十七日行政院（61）台院人政貳字第 45123號令訂定發布"},{"date":"1979-11-28","summary":"中華民國六十八年十一月二十八日行政院（68）台人政貳字第 26142號函修正發布第 9、10 條條文"},{"date":"1982-01-06","summary":"中華民國七十一年一月六日行政院（71）台人政貳字第 0214 號令修正發布第 3、5、12 條條文"},{"date":"2019-10-01","summary":"中華民國一百零八年十月一日行政院院授人組字第 10800446561 號令修正發布名稱及全文 11 條；並自發布日施行（原名稱：行政院暨所屬機關約僱人員僱用辦法；新名稱：行政院與所屬中央及地方各機關約僱人員僱用辦法）"},{"date":"2020-05-01","summary":"中華民國一百零九年五月一日行政院院授人組字第 10900319971 號令修正發布第 8、9 條條文；並增訂第 8-1 條條文"},{"date":"2022-09-13","summary":"中華民國一百十一年九月十三日行政院院授人組字第 11120012841 號令修正發布第 4 條條文"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=S0110014","articles":[{"no":"第1條","text":"行政院與所屬中央及地方各機關（以下簡稱各機關）約僱人員之僱用，除法規另有規定外，依本辦法之規定。"},{"no":"第2條","text":"本辦法所稱約僱人員，指各機關以行政契約定期僱用，辦理事務性、簡易性等行政或技術工作之人員。\n約僱人員之僱用，以本機關確無適當人員可資擔任，且年度計畫中已列有預算或經專案核准者為限。\n約僱人員不得擔任或兼任主管職務。"},{"no":"第3條","text":"各機關僱用約僱人員時應注意其品德及對國家之忠誠，年齡未滿六十五歲，並具有擬任工作所需之知能條件。"},{"no":"第4條","text":"各機關首長不得僱用其配偶及三親等以內血親、姻親為本機關之約僱人員；對於本機關各級主管之配偶及三親等以內血親、姻親，在其主管單位中應迴避僱用。但在機關首長或各級主管接任以前已訂立之僱用契約，不在此限。\n各機關首長於公務人員任用法第二十六條之一第一項各款所定期間內，不得僱用約僱人員。\n有公務人員任用法第二十八條第一項第一款至第八款、第十款及第十一款情事之一者，不得僱用為約僱人員。\n約僱人員於僱用後，發現其於僱用時有前三項所定不得僱用情事之一者，應即終止契約。約僱人員於僱用後，發生前項所定不得僱用之情事者，亦同。"},{"no":"第5條","text":"約僱人員之僱用期間，以一年為限。但業務完成之期限在一年以內者，應按實際所需時間僱用之，其完成期限需要超過一年時，得依原業務計畫預定完成之時間，繼續每年約僱一次，至計畫完成時為止；其約僱期限超過五年時，應定期檢討該計畫之存廢。\n約僱人員僱用期滿，或僱用至屆滿六十五歲之當月末日為止，應即終止契約。"},{"no":"第6條","text":"約僱人員之僱用應訂立契約，其內容如下：\n一、僱用期間。\n二、擔任工作內容及工作標準。\n三、僱用期間報酬及給酬方式。\n四、溢領報酬之處理方式。\n五、權利及義務。\n六、違背義務時，應負之責任。\n七、終止契約事由。\n八、其他必要事項。\n約僱人員僱用契約書格式，由行政院人事行政總處定之。"},{"no":"第7條","text":"各機關約僱人員之僱用，以採公開甄選為原則，必要時得委託就業服務機構代為甄選。\n前項各機關或受委託之就業服務機構辦理公開甄選時，應將職缺之機關名稱、職稱、所需資格條件及月支報酬等資料於報刊或網路公告三日以上。"},{"no":"第8條","text":"約僱人員之報酬應視工作之職責程度及應具備之知能條件，認定支給報酬之等別及薪點，折合通用貨幣後於僱用契約中訂定之。約僱人員報酬標準表如附件。\n各機關進用約僱人員，除就具擬任職務相關職前年資另有規定者外，依其僱用計畫表所列薪點範圍內最低薪點起支。"},{"no":"第8-1條","text":"各機關應於每年十二月底前辦理約僱人員考核作業。\n前項考核結果得作為晉薪或續約之依據，並自次年一月一日起執行。\n考核之項目、配分基準、考核方式、結果及其他相關事項，由各機關視業務需要自行訂定之。"},{"no":"第9條","text":"約僱人員不適用公務人員俸給、考績、退休、撫卹及公教人員保險等法規之規定；其在僱用期間死亡者，得依下列規定酌給撫慰金：\n一、病故或意外死亡：以實際月支報酬金額為計算基準，給與十三又二分之一個月之一次給與。\n二、因公死亡：以實際月支報酬金額為計算基準，給與二十七個月之一次給與。但低於二八○薪點者，按二八○薪點乘以實際薪點折合率所得金額為計算基準。\n前項第二款因公死亡之情事比照公務人員退撫法規相關規定，其事由之認定遇有疑義時，各機關應延聘相關領域之學者或專家，組成專案審查小組審認之。\n約僱人員死亡，除依第一項基準酌給撫慰金外，並依其死亡時公務人員委任第五職等本俸五級之俸額計算，發給七個月之一次殮葬補助。\n撫慰金及殮葬補助之遺族領受順序，比照勞工退休金條例遺屬請領退休金順位辦理。但約僱人員生前預立遺囑指定領受人者，從其遺囑。無遺族且無遺囑指定領受人者，得由原服務機關先行具領，辦理喪葬事宜，如有賸餘，歸屬公庫。\n約僱人員依法令留職停薪期間因病故或意外死亡者，得依本條規定辦理。"},{"no":"第10條","text":"各機關於年度編列概算，或於年度中須增列約僱人員時，應填具約僱人員僱用計畫表，中央機關層報行政院核准後約僱之，地方機關報由直轄市、縣（市）政府核准後約僱之。\n各機關於約僱人員到職一個月內，應填列約僱人員僱用名冊，層報各該部、會、行、總處、署或各直轄市、縣（市）政府備查。但經各該部、會、行、總處、署或各直轄市、縣（市）政府授權自行核處者，不在此限。\n前二項約僱人員僱用計畫表及約僱人員僱用名冊之格式，由行政院人事行政總處定之。"},{"no":"第11條","text":"本辦法自發布日施行。"}],"tags":["約僱","契約人力","本體法規"],"note":"原名「行政院暨所屬機關約僱人員僱用辦法」（61.12.27 訂定），108.10.1 修正名稱及全文。附件「約僱人員報酬標準表」已另存 raw/laws/dgpa/S0110014_附件_約僱人員報酬標準表.odt。","attachments":[{"FileName":"附件 約僱人員報酬標準表.ODT","FileURL":"https://law.moj.gov.tw/LawClass/LawGetFile.ashx?FileId=0000268727"}]},{"id":"A04a","name":"行政院暨所屬各級機關聘用人員注意事項","pcode":"","level":"行政規則","authority":"行政院（行政院人事行政總處）","category":"行政＞行政院人事行政總處＞組編人力","modified_date":"2008-01-21","history":[{"date":"1970-10-24","summary":"中華民國59年10月24日行政院台 （59）人政貳字14494號令訂頒布"},{"date":"1972-11-18","summary":"中華民國61年11月18日行政院台 （61）院人政貳字40549號令修正"},{"date":"1979-11-21","summary":"中華民國68年11月21日行政院台 （68）人政貳字26318號函修正"},{"date":"1983-03-23","summary":"中華民國72年3月23日行政院台（72） 人政貳字5754號函修正"},{"date":"2008-01-21","summary":"中華民國97年1月21日行政院院授人力 字第0970000936號函修正附表一"}],"url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa%2Ffiles%2F202211%2Fed1435f4-811c-46c3-9725-570f089a145b.pdf&name=x.pdf","articles":[{"no":"第1點","text":"各機關聘用人員應依聘用條例施行細則第二條規定，以所任工作非本機關現有人員所能擔任者為限。除機關組織法規另有規定者外，其員額以\n不超過該機關預算總人數百分之五為原則。"},{"no":"第2點","text":"各機關編制內現職人員，除法令另有規定者外，不得轉任本機關或兼任\n其他機關聘用職務。"},{"no":"第3點","text":"各機關聘用人員，在約聘前，應依人事查核程序之規定辦理。"},{"no":"第4點","text":"各機關聘用人員於年度編列概算時，或年度中須增列聘用人員時，應填\n具聘用計畫書二份，格式如附表（一），中央機關層報本院，核准後聘用之，地方機關報由省、市政府，核准後聘用之。"},{"no":"第5點","text":"聘用人員報酬標準由聘用機關及各級層轉機關，視工作之繁簡難易，責\n任輕重，羅致困難程度，與應具之專門知能條件，參照職位分類標準，認定支給報酬之薪點，折合通用貨幣後，於聘用契約中訂定之。\n前項薪點折合通用貨幣之比率，另定之。聘用人員酬金標準如附表（二）。"},{"no":"第6點","text":"各機關應於受聘人員到職前，依聘用人員聘用條例第四條之規定，訂定聘用契約。於受聘人員到職一個月內，填列聘用人員聘用名冊，同附表\n（一）格式，中央機關送本院，地方機關送各該省、市政府備查。"},{"no":"第7點","text":"公營事業機關聘用人員之聘用程序及報酬標準比照本注意事項之規定由各主管部及省、市政府另定辦法呈報本院核定後實施。"}],"tags":["聘用","契約人力","行政規則","報酬"],"note":"不在全國法規資料庫。全文取自行政院人事行政總處《聘僱人員管理作業參考手冊》（111 年 11 月編印版）第 27–32 頁，本機下載檔 raw/laws/dgpa/聘僱人員管理作業參考手冊_111.11.pdf。第 5 點附表（二）即「聘用人員比照分類職位公務人員俸點支給報酬標準表」，另建 A04b。"},{"id":"A04b","name":"聘用人員比照分類職位公務人員俸點支給報酬標準表","pcode":"","level":"行政規則（附表）","authority":"行政院（行政院人事行政總處）","category":"行政＞行政院人事行政總處＞組編人力","modified_date":"2008-01-21","history":[{"date":"2008-01-21","summary":"行政院 97.1.21 院授人力字第 0970000936 號函修正「行政院暨所屬各級機關聘用人員注意事項」附表（手冊沿革記為附表一；手冊內文列為附表二）"}],"url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa%2Ffiles%2F202211%2Fed1435f4-811c-46c3-9725-570f089a145b.pdf&name=x.pdf","articles":[{"no":"附表","title":"聘用人員比照分類職位公務人員俸點支給報酬標準表（薪點區間摘錄）","text":"相當第十三職等：報酬薪點 670–790（790、760、730、700、670）\n相當第十二職等：604–714\n相當第十一職等：538–648\n相當第十職等：472–582\n相當第九職等：424–520\n相當第八職等：376–472\n相當第七職等：328–424\n相當第六職等：280–376\n（相當第五職等以下另依約僱人員報酬標準表）\n附註：1. 聘用人員應具有本表所列相當職等之專門知能條件之一。2. 依本表支給報酬，其比照支給報酬之薪點最高不得超過本機關副首長職位之薪點。本表薪點折合率另以命令規定，情形特殊者專案報院核定。"}],"tags":["聘用","報酬","薪點","行政規則"],"note":"表格版面為多欄（職等／俸點／職責程度／所具專門知能條件／報酬薪點），PDF 轉文字後欄位交錯，此處僅摘錄各職等薪點區間；完整表格請見 raw/laws/dgpa/聘僱人員管理作業參考手冊_111.11.pdf 第 29–32 頁。薪點折合率隨軍公教待遇調整由行政院另函頒（目前聘僱人員每薪點折合率與公務人員俸點相同標準）。"},{"id":"A05","name":"各機關學校聘僱人員離職給與辦法","pcode":"S0110027","level":"命令","authority":"銓敘部","category":"考試＞銓敘部＞人事管理目","modified_date":"2025-05-15","history":[{"date":"1995-02-10","summary":"中華民國八十四年二月十日考試院、行政院令會同訂定發布全文 11 條"},{"date":"2003-02-19","summary":"中華民國九十二年二月十九日考試院考臺組貳二字第 09200012051 號令、行政院院授人給字第 09200507621 號令會同修正發布第 4、7、10、11 條條文；並自九十二年一月一日施行"},{"date":"2005-06-28","summary":"中華民國九十四年六月二十八日考試院考臺組貳二字第 09400049951號令、行政院院授人給字第 09400144952 號令會同修正發布第 3、11條條文；並自九十四年七月一日起施行"},{"date":"2018-08-28","summary":"中華民國一百零七年八月二十八日考試院考臺組貳二字第 10700075541號令、行政院院授人給揆字第 10700489492 號令會同修正發布名稱及第 1、7、8、11 條條文；增訂第 8-1 條條文；並自一百零七年七月一日施行（原名稱：各機關學校聘僱人員離職儲金給與辦法；新名稱：各機關學校聘僱人員離職給與辦法）"},{"date":"2025-05-15","summary":"中華民國一百十四年五月十五日考試院考臺銓二字第 11400019021 號令、行政院院授人給揆字第 11400006902 號令會同修正發布第 2、3、6、8-1、11 條條文；除第 3 條施行日期由考試院會同行政院以命令定之外，自發布日施行中華民國一百十四年七月三日考試院考臺銓二字第 11400026551 號令、行政院院授人給揆字第 11400015322 號令會同發布第 3 條自一百十四年七月一日施行"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=S0110027","articles":[{"no":"第1條","text":"各機關學校聘僱人員之離職給與，依本辦法行之。"},{"no":"第2條","text":"本辦法所稱聘僱人員，指各機關學校依聘用人員聘用條例聘用或適用及比照適用行政院與所屬中央及地方各機關約僱人員僱用辦法約僱之人員。"},{"no":"第3條","text":"各機關學校進用聘僱人員時，應於聘僱契約內訂定聘僱人員每月按月支報酬之百分之十二提存儲金，其中百分之五十由聘僱人員於每月報酬中扣繳作為自提儲金；另百分之五十由聘僱機關學校提撥作為公提儲金。\n聘僱人員之月支報酬較公務人員俸表最高俸點折算俸額加一倍之數額為高者，應以上開最高俸點折算俸額加一倍之數額為準；其未達該數額者，以實際月支報酬為準。"},{"no":"第4條","text":"聘僱人員公、自提儲金，應由各機關學校自行在銀行或郵局開立專戶儲存孳息，並按人分戶列帳管理。\n前項各機關學校對於公、自提儲金之管理，應盡善良管理人之注意義務。"},{"no":"第5條","text":"聘僱人員因契約期限屆滿離職、或經服務機關學校同意於契約期限屆滿前離職、或在職因公、因病或意外死亡者，發給公、自提儲金本息。\n前項死亡人員公、自提儲金本息，其遺族領受順序依民法繼承編之規定辦理。"},{"no":"第6條","text":"聘僱人員於契約期間內因違反契約所定義務而經服務機關學校予以解聘僱，或未經服務機關學校同意而於契約期限屆滿前離職者，僅發給該契約期間自提儲金之本息。"},{"no":"第7條","text":"聘僱人員或其遺族請領離職儲金本息之權利，自聘僱人員離職或在職死亡之日起，經過十年不行使而消滅。\n聘僱人員離職時未請領離職儲金本息，於請領時效屆滿前死亡者，得由其遺族於聘僱人員死亡之日起十年內請領。"},{"no":"第8條","text":"聘僱人員依第六條規定離職而不合發給之公提儲金本息，及逾前條規定之請領時效而未請領之離職儲金本息，均由原服務機關學校解繳公庫。"},{"no":"第8-1條","text":"本辦法中華民國一百零七年七月一日修正生效後，聘僱人員應依勞工退休金條例（以下簡稱勞退條例）第七條第二項及相關規定提繳退休金。\n各機關學校應於聘僱契約內訂定聘僱機關學校及聘僱人員依第三條第二項規定計算之月支報酬，按勞工退休金月提繳分級表之標準，分別提繳百分之六之公、自提退休金。\n各機關學校提存離職儲金之聘僱人員於原契約期滿重新訂定契約，或提前解約新訂契約時，應依前二項規定提繳退休金。但經同機關學校聘（僱）用且聘（僱）用期間接續未中斷者，得繼續依第三條規定提存離職儲金。\n依前項規定選擇提繳退休金前年資所提存之離職儲金請領事宜，仍依第五條至第七條相關規定辦理。\n聘僱人員未具適用勞退條例提繳退休金規定之身分者，仍依第三條規定提存離職儲金。"},{"no":"第9條","text":"各機關學校依本辦法應負擔之經費在年度預算人事費項下列支。"},{"no":"第10條","text":"各學校、研究、公營事業機構對於聘僱之人員，及各機關對於依其組織法律特聘或遴聘之有給專任人員，未訂定退休、資遣、撫卹或離職給與規定者，得比照本辦法辦理。"},{"no":"第11條","text":"本辦法自中華民國八十四年七月一日施行。\n本辦法中華民國一百十四年五月十五日修正之條文，除第三條施行日期由考試院會同行政院以命令定之外，自發布日施行。"}],"tags":["聘用","約僱","離職給與","契約人力"],"note":"原名「各機關學校聘僱人員離職儲金給與辦法」（84.2.10 訂定），107.8.28 修正名稱為「離職給與辦法」。"},{"id":"A06a","name":"行政院及所屬各機關學校臨時人員進用及運用要點","pcode":"","level":"行政規則","authority":"行政院（行政院人事行政總處）","category":"行政＞行政院人事行政總處＞組編人力","modified_date":"2019-11-15","history":[{"date":"2008-01-10","summary":"行政院 97 年 1 月 10 日院授人力字第 09700602751 號函訂 定，並自 97 年 1 月 1 日生效"},{"date":"2009-11-20","summary":"行政院 98 年 11 月 20 日院授人力字第 09800656361 號函修 正第 2 點至第 5 點、第 7 點及第 11 點，並自即日生效"},{"date":"2011-09-21","summary":"行政院 100 年 9 月 21 日院授人力字第 10000518511 號函修 正發布第 2 點、第 11 點，並自即日生效"},{"date":"2012-03-05","summary":"行政院 101 年 3 月 5 日院授人法字第 1010027206 號函修 正，並自 101 年 2 月 6 日生效"},{"date":"2014-05-30","summary":"行政院 103 年 5 月 30 日院授人組字第 10300353051 號函修 正全文 15 點，並自即日生效"},{"date":"2016-11-07","summary":"行政院 105 年 11 月 7 日院授人組字第 10500575971 號函停 止適用第 5 點第 2 項，並自 105 年 10 月 27 日生效"},{"date":"2017-10-30","summary":"行政院 106 年 10 月 30 日院授人組字第 10600600391 號函修 正第 2 點、第 5 點，並自即日生效"},{"date":"2018-02-02","summary":"行政院 107 年 2 月 2 日院授人組字第 10700319271 號函修正 第 7 點及附件 1、附件 2，並自 107 年 3 月 1 日生效"},{"date":"2018-08-10","summary":"行政院 107 年 8 月 10 日院授人組字第 10700485981 號函修 正第 4 點條文之附表；並自即日生效"},{"date":"2019-11-15","summary":"行政院 108 年 11 月 15 日院授人組字第 10800481201 號函修 正全文 15 點及第 7 點附件 1、附件 3，並自即日生效"}],"url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa%2Ffiles%2F202104%2Fd3a48621-a8eb-4dbd-bd83-fe0c15e3c0ec.doc&nfix=pdf&name=x.pdf","articles":[{"no":"第1點","text":"為使行政院（以下簡稱本院）及所屬各機關學校（以下簡稱各機關）進用臨時人員有所依據，並妥善運用臨時人員協助業務推動，特訂定本要點。"},{"no":"第2點","text":"本要點用詞，定義如下：\n(一)臨時人員：指機關非依公務人員法規，且以人事費\n以外經費自行進用之人員，不包括下列人員：\n１、依聘用人員聘用條例、行政院暨所屬機關約僱人員僱用辦法、國軍聘用及雇用人員管理作業要點進用之人員。\n２、技工、駕駛、工友、清潔隊員、國防工業訓儲及研發替代役第三階段人員。\n３、國立大專校院依「國立大學校務基金進用教學人員研究人員及工作人員實施原則」及「國立大專校院行政人力契僱化實施原則」進用之人員。\n４、公立幼兒園依幼兒教育及照顧法以契約進用之教\n保員、助理教保員及其他人員。\n５、公立博物館依博物館法以契約進用之編制外人員。\n６、依教育部所屬機構作業基金設置條例以契約進用\n之編制外人員。\n７、依各機關學校團體駐衛警察設置管理辦法進用之駐衛警察。\n(二)主管機關：指本院、中央二級機關及相當二級或三級機關之獨立機關。\n(三)經費核撥機關：指就主管業務編列專款補助特定用途或委託研究計畫經費之機關。"},{"no":"第3點","text":"臨時人員得辦理之業務，以非屬行使公權力之工作為限。機關應依勞動基準法規定與臨時人員訂立勞動契約。"},{"no":"第4點","text":"各機關進用臨時人員，應符合下列各款條件之一：\n(一)機關現有業務經按下列方式檢討後，現有人力仍不能負荷者：\n１、以委託外包方式辦理。\n２、以推動工作簡化、業務資訊化及運用志工等人力替代措施辦理。\n(二)機關接受專案經費補助辦理特定業務或委託研究計畫，不能以現有人力辦理者。\n(三)機關辦理營繕工程，依中央政府各機關工程管理費支用要點規定得進用之人力。\n(四)配合本院核定具通案性之重大政策進用者。"},{"no":"第5點","text":"各機關依身心障礙者權益保障法第三十八條及原住民族工\n作權保障法第四條或第五條規定，進用身心障礙者或原住民而未足額進用時，依本要點規定得進用臨時人員者，優\n先進用身心障礙者及原住民。"},{"no":"第6點","text":"主管機關與所屬機關以臨時人員酬金科目預算進用之總人數，不得超過下列各款之合計總數：\n(一)九十六年度主管機關與所屬機關以該科目預算進用之\n人數。\n(二)主管機關與所屬機關依行政院暨所屬機關（構）檢討運用勞動派遣實施計畫，由派遣勞工改自僱臨時人員\n之人數。\n(三)九十七年以後新設之機關，於本要點中華民國一百零\n八年十一月十五日修正生效前實際進用人數。\n主管機關得於前項總數內，分配其與所屬機關之進用人數。\n依第四點第二款及第四款進用者，不受前二項規定之限\n制。"},{"no":"第7點","text":"各機關臨時人員進用及運用之審核，依下列規定辦理。但\n依第四點第四款進用者，不在此限：\n(一)審核程序：\n１、依第四點第一款規定進用，且單一用人計畫進用\n人數在三十人以上者，應填具臨時人員進用計畫表（格式如附件一），報經主管機關審核。但屬\n勞動基準法施行細則第六條第三款之季節性工作或第四款之特定性工作其契約期間超過一年，曾報經主管機關審核者，得依第二目規定辦理。\n２、其餘計畫及依第十三點進用者，得由主管機關（經費核撥機關）視實際需要或業務性質授權進用機關（受撥經費機關）審核，並將審核結果副知\n主管機關（經費核撥機關）。\n３、依前目由主管機關（經費核撥機關）授權進用機關自行審核者，主管機關（經費核撥機關）仍應就審核結果負督導之責，並就未符本要點規定者立即要求限期改正。\n４、屬依第十三點規定進用人員，主管機關及經費核撥機關應按年填具臨時人員進用審核結果彙整表\n（格式如附件二），於次年一月三十一日前函知本院人事行政總處。\n(二)審核項目：\n１、臨時人員進用計畫是否符合第二點至前點之規定。\n２、給假、薪資待遇及其他權利事項，是否符合勞動基準法規相關規定。\n３、前一年度臨時人員之進用及運用是否達到計畫預期成效，是否有不符經費用途、效益不彰、不當運用或其他未依相關規定辦理之情形。\n(三)成效評估：\n１、各機關函報臨時人員進用計畫表或依授權審核之結果文件時，相關業務或計畫如曾進用臨時人員，應將前一年度或前次臨時人員運用成效檢討報告（格式如附件三），併送主管機關、經費核撥機關。\n２、主管機關、經費核撥機關於年度進行中得訪查或抽查所屬機關或受補助機關臨時人員之運用情形，如發現有不符經費用途、效益不彰、運用不當或其他未依相關規定辦理者，應促請其改善，\n並作為次一年度進用審核之參考。\n３、各機關於特定業務或委託研究計畫結束時，應將臨時人員運用情形，函送經費核撥機關查照，並\n作為經費核撥機關爾後審酌補助或委託研究之參考。\n(四)各機關於中華民國九十六年十二月三十一日前進用\n之臨時人員，仍應依上開審核規定重新審核進用。"},{"no":"第8點","text":"各機關進用臨時人員，以公開甄選為原則。"},{"no":"第9點","text":"各機關進用及運用臨時人員，未依本要點辦理者，主管機關應要求改正，並依權責懲處相關人員。"},{"no":"第10點","text":"為瞭解各機關臨時人員進用及運用情形，本院人事行政總處得會同本院主計總處等相關機關進行訪查，並為適當之處理。"},{"no":"第11點","text":"各機關長官對於配偶及三親等以內血親、姻親，不得進用為本機關或所屬機關之臨時人員。對於本機關各級主管長官之配偶及三親等以內血親、姻親，在其主管單位中應迴避進用。但機關首長就任前，其配偶及三親等以內血親、姻親，已於本機關或所屬機關擔任臨時人員者，不在此限。\n前項但書不受迴避進用規定限制之臨時人員，不包括原契約之期限屆滿或其他原因終止後，由機關首長另訂新契約進用之情形。機關首長於公務人員任用法第二十六條之一第一項所定期間內，不得新進用臨時人員。"},{"no":"第12點","text":"各機關於本要點生效前進用之臨時人員，除符合本要點進用規定者外，得依下列方式檢討其所辦理業務，並依勞\n動基準法等相關規定辦理：\n（一）所辦理業務非屬機關核心業務，且具有計畫性、階段性者，檢討改採其他替代性人力措施辦理。\n（二）所辦理業務屬常態性、核心業務或涉及行使公權力者，檢討改由正式公務人員、聘僱人員擔任，或改採\n其他替代性人力措施辦理。"},{"no":"第13點","text":"因機關組織特性、特殊業務需要，其工作於中華民國九\n十六年十二月三十一日前經本院核定以契約進用人員辦理者，所進用之人員，不適用第六點、第七點第三款第三目\n之規定。"},{"no":"第14點","text":"各級地方自治團體之地方行政機關及立法機關，其臨時\n人員之進用及運用，得準用本要點規定辦理。但地方機關受中央機關補助或委託研究經費進用臨時人員者，應依本要點規定辦理。"},{"no":"第15點","text":"主管機關得依業務實際需要及機關特性，另訂定補充規定。"}],"tags":["臨時人員","約用","勞動","勞基法","行政規則","契約人力"],"note":"不在全國法規資料庫（行政院函頒之行政規則）。全文取自人事總處網站（108.11.15 修正版，本機檔 raw/laws/dgpa/臨時人員進用及運用要點_108.11.15.pdf）。113.1.30 修正名稱為「約用人員進用及運用要點」（另建 A06b）。原「行政院與所屬中央及地方各機關學校臨時人員進用及運用要點」之正式名稱為「行政院及所屬各機關學校臨時人員進用及運用要點」。"},{"id":"A06b","name":"行政院及所屬各機關學校約用人員進用及運用要點","pcode":"","level":"行政規則","authority":"行政院（行政院人事行政總處）","category":"行政＞行政院人事行政總處＞組編人力","modified_date":"2024-01-30","history":[{"date":"2008-01-10","summary":"行政院 97 年 1 月 10 日院授人力字第 09700602751 號函訂 定，並自 97 年 1 月 1 日生效"},{"date":"2009-11-20","summary":"行政院 98 年 11 月 20 日院授人力字第 09800656361 號函修 正第 2 點至第 5 點、第 7 點及第 11 點，並自即日生效"},{"date":"2011-09-21","summary":"行政院 100 年 9 月 21 日院授人力字第 10000518511 號函修 正發布第 2 點、第 11 點，並自即日生效"},{"date":"2012-03-05","summary":"行政院 101 年 3 月 5 日院授人法字第 1010027206 號函修 正，並自 101 年 2 月 6 日生效"},{"date":"2014-05-30","summary":"行政院 103 年 5 月 30 日院授人組字第 10300353051 號函修 正全文 15 點，並自即日生效"},{"date":"2016-11-07","summary":"行政院 105 年 11 月 7 日院授人組字第 10500575971 號函停 止適用第 5 點第 2 項，並自 105 年 10 月 27 日生效"},{"date":"2017-10-30","summary":"行政院 106 年 10 月 30 日院授人組字第 10600600391 號函修 正第 2 點、第 5 點，並自即日生效"},{"date":"2018-02-02","summary":"行政院 107 年 2 月 2 日院授人組字第 10700319271 號函修正 第 7 點及附件 1、附件 2，並自 107 年 3 月 1 日生效"},{"date":"2018-08-10","summary":"行政院 107 年 8 月 10 日院授人組字第 10700485981 號函修 正第 4 點條文之附表；並自即日生效"},{"date":"2019-11-15","summary":"行政院 108 年 11 月 15 日院授人組字第 10800481201 號函修 正全文 15 點及第 7 點附件 1、附件 3，並自即日生效"},{"date":"2024-01-30","summary":"行政院 113 年 1 月 30 日院授人組字第 11320000341 號函修正名稱（臨時人員→約用人員）及全文，並自即日生效"},{"date":null,"summary":"（據各機關轉知公文）行政院再修正第 3、4、6 點，自 115 年 1 月 1 日生效（新增勞動契約應載明遵守臺灣地區與大陸地區人民關係條例等）；原始公文來源網域受限未能取得，待補。"}],"url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa%2Ffiles%2F202402%2F6fe2dab8-4b2c-4275-9112-b5dde436166c.pdf&nfix=&name=x.pdf","articles":[{"no":"第1點","text":"為使行政院（以下簡稱本院）及所屬各機關學校（以下簡稱各機關）進用約用人員有所依據，並妥善運用約用人員協助業務推動，特訂定本要點。"},{"no":"第2點","text":"本要點用詞，定義如下：\n（一） 約用人員：指機關非依公務人員法規，且以人事費以外經費自行進用之人員，不包括下列人員：\n１、依聘用人員聘用條例、行政院與所屬中央及地方各機關約僱人員僱用辦法、國軍聘用及雇用人員管理作業要點進用之人員。\n２、技工、駕駛、工友、清潔隊員、國防工業訓儲及研發替代役第三階段人員。\n３、國立大專校院依「專科以上學校進用編制外專任教學人員實施原則」、「國立大學校務基金進用研究人員及工作人員實施原則」及「國立大專校院行政人力契僱化實施原則」進用之人員。\n４、公立幼兒園依幼兒教育及照顧法以契約進用之教保員、助理教\n保員及其他人員。\n５、公立博物館依博物館法以契約進用之編制外人員。\n６、依教育部所屬機構作業基金設置條例以契約進用之編制外人員。\n７、依各機關學校團體駐衛警察設置管理辦法進用之駐衛警察。\n（二） 主管機關：指本院、中央二級機關及相當二級或三級機關之獨立機關。\n（三） 經費核撥機關：指就主管業務編列專款補助特定用途或委託研究計畫經費之機關。"},{"no":"第3點","text":"約用人員得辦理之業務，以非屬行使公權力之工作為限。機關應依勞動基準法規定與約用人員訂立勞動契約。"},{"no":"第4點","text":"各機關進用約用人員，應符合下列各款條件之一：\n（一） 機關現有業務經按下列方式檢討後，現有人力仍不能負荷者：\n１、以委託外包方式辦理。\n２、以推動工作簡化、業務資訊化及運用志工等人力替代措施辦理。\n（二） 機關接受專案經費補助辦理特定業務或委託研究計畫，不能以現有人力辦理者。\n（三） 機關辦理營繕工程，依中央政府各機關工程管理費支用要點規定得進用之人力。\n（四） 配合本院核定具通案性之重大政策進用者。"},{"no":"第5點","text":"各機關依身心障礙者權益保障法第三十八條及原住民族工作權保障法第四條或第五條規定，進用身心障礙者或原住民而未足額進用時，\n依本要點規定得進用約用人員者，優先進用身心障礙者及原住民。"},{"no":"第6點","text":"本院與所屬機關以臨時人員酬金科目預算進用約用人員之總人數，\n不得超過下列各款之合計總數：\n（一） 九十六年度本院與所屬機關以該科目預算進用之人數。\n（二） 本院與所屬機關依行政院暨所屬機關（構）檢討運用勞動派遣實施計畫，由派遣勞工改自僱臨時人員之人數。\n（三） 九十七年以後新設之機關，於本要點中華民國一百零八年十一月\n十五日修正生效前實際進用人數。本院得於前項總數內，核定各主管機關進用人數上限，並由各主管機關統籌分配其與所屬機關之進用人數。\n依第四點第二款及第四款進用者，不受前二項規定之限制。"},{"no":"第7點","text":"各機關約用人員進用及運用之審核，依下列規定辦理。但依第四點第四款進用者，不在此限：\n（一） 審核程序：\n１、依第四點第一款規定進用，且單一用人計畫進用人數在三十人\n以上者，應填具約用人員進用計畫表（格式如附件一），報經主管機關審核。但屬勞動基準法施行細則第六條第三款之季節性工作或第四款之特定性工作其契約期間超過一年，曾報經主管機關審核者，得依第二目規定辦理。\n２、其餘計畫及依第十三點進用者，得由主管機關（經費核撥機關）視實際需要或業務性質授權進用機關（受撥經費機關）審核，並將審核結果副知主管機關（經費核撥機關）。\n３、依前目由主管機關（經費核撥機關）授權進用機關（經費受撥機關）自行審核者，主管機關（經費核撥機關）仍應就審核結果負督導之責，並就未符本要點規定者立即要求限期改正。\n（二） 審核項目：\n１、約用人員進用計畫是否符合第二點至前點之規定。\n２、給假、薪資待遇及其他權利事項，是否符合勞動基準法規相關規定。\n３、前一年度約用人員之進用及運用是否達到計畫預期成效，是否有不符經費用途、效益不彰、不當運用或其他未依相關規定辦理\n之情形。\n（三） 成效評估：\n１、各機關函報約用人員進用計畫表或依授權審核之結果文件時，相關業務或計畫如曾進用約用人員，主管機關、經費核撥機關得視需要請機關提供前一年度或前次約用人員運用成效檢討報告\n(格式如附件二)。\n２、主管機關、經費核撥機關於年度進行中得訪查或抽查所屬機關或受補助機關約用人員之運用情形，如發現有不符經費用途、效益不彰、運用不當或其他未依相關規定辦理者，應促請其改善，\n並作為次一年度進用審核之參考。\n３、各機關於特定業務或委託研究計畫結束時，應將約用人員運用情形，函送經費核撥機關查照，並作為經費核撥機關爾後審酌補\n助或委託研究之參考。\n（四） 各機關於中華民國九十六年十二月三十一日前進用之臨時人員，\n仍應依上開審核規定重新審核進用。"},{"no":"第8點","text":"各機關進用約用人員，以公開甄選為原則。"},{"no":"第9點","text":"各機關進用及運用約用人員，未依本要點辦理者，主管機關應要求改正，並依權責懲處相關人員。"},{"no":"第10點","text":"為瞭解各機關約用人員進用及運用情形，本院人事行政總處得會同本院主計總處等相關機關進行訪查，並為適當之處理。"},{"no":"第11點","text":"各機關長官對於配偶及三親等以內血親、姻親，不得進用為本機關或所屬機關之約用人員。對於本機關各級主管長官之配偶及三親等以內血親、姻親，在其主管單位中應迴避進用。但應迴避人員，在各該長官接任以前進用者，不在此限。\n前項但書不受迴避進用規定限制之約用人員，不包括原契約之期限屆滿或其他原因終止後，機關與約用人員另訂新契約進用之情形。機關首長於公務人員任用法第二十六條之一第一項所定期間內，\n不得新進用約用人員。"},{"no":"第12點","text":"各機關於中華民國九十六年十二月三十一日前進用之臨時人員，除符合本要點進用規定者外，得依下列方式檢討其所辦理業務，並依\n勞動基準法等相關規定辦理：\n（一） 所辦理業務非屬機關核心業務，且具有計畫性、階段性者，檢討改採其他替代性人力措施辦理。\n（二） 所辦理業務屬常態性、核心業務或涉及行使公權力者，檢討改由正式公務人員、聘僱人員擔任，或改採其他替代性人力措施辦理。"},{"no":"第13點","text":"因機關組織特性、特殊業務需要，其工作於中華民國九十六年十\n二月三十一日前經本院核定以契約進用人員辦理者，所進用之人員，\n不適用第六點、第七點第三款第三目之規定。"},{"no":"第14點","text":"各級地方自治團體之地方行政機關及立法機關，其約用人員之進用及運用，得準用本要點規定辦理。但地方機關受中央機關補助或委託研究經費進用約用人員者，應依本要點規定辦理。"},{"no":"第15點","text":"主管機關得依業務實際需要及機關特性，另訂定補充規定。"}],"tags":["約用","臨時人員","勞動","勞基法","行政規則","契約人力"],"note":"不在全國法規資料庫。全文取自人事總處網站公告（113.1.30 修正版，本機檔 raw/laws/dgpa/約用人員進用及運用要點_1130130.pdf；公告頁 https://www.dgpa.gov.tw/information?uid=2&pid=11786）。115.1.1 生效之再修正版未能自可連網域取得。"},{"id":"A07","name":"中央政府機關總員額法","pcode":"S0110038","level":"法律","authority":"行政院人事行政總處","category":"行政＞行政院人事行政總處＞組編人力目","modified_date":"2019-12-31","history":[{"date":"2010-02-03","summary":"中華民國九十九年二月三日總統華總一義字第 09900024191 號令制定公布全文 11 條；依第 11 條規定：施行日期，由行政院會同考試院定之中華民國九十九年三月十八行政院院授人力字第 09900613781 號令、考試院考臺組貳一字第 09900018551 號令會同發布定自九十九年四月一日施行"},{"date":"2019-12-31","summary":"中華民國一百零八年十二月三十一日總統華總一義字第 10800142781號令修正公布第 3、4、11 條條文；並自公布日施行"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=S0110038","articles":[{"no":"第1條","text":"為管理中央政府機關員額，增進員額調配彈性，提升用人效能，特制定本法。"},{"no":"第2條","text":"本法適用於一級機關及所屬各級機關（以下簡稱機關）。\n前項所稱一級機關如下：\n一、行政院。\n二、立法院。\n三、司法院。\n四、考試院。\n五、監察院。\n一級機關所屬之各級機關，依其層級，稱為二級機關、三級機關、四級機關。\n本法於總統府及國家安全會議準用之。"},{"no":"第3條","text":"本法所稱員額，分為下列五類：\n一、第一類：機關為執行業務所置政務人員，定有職稱、官等職等之文職人員，醫事人員及聘任人員。但不包括第三類至第五類員額、公立學校教職員及公立醫院職員。\n二、第二類：機關依法令進用之聘僱人員、駐衛警察及工友（含技工、駕駛）。但不包括第三類及第四類員額。\n三、第三類：司法院及所屬機關職員（含法警）、聘僱人員、駐衛警察及工友（含技工、駕駛）。\n四、第四類：法務部所屬檢察機關職員（含法警）、聘僱人員、駐衛警察及工友（含技工、駕駛）。\n五、第五類：警察、消防及海岸巡防機關職（警）員。\n前項員額，不包括軍職人員。"},{"no":"第4條","text":"機關員額總數最高限為十六萬零九百人。\n第一類人員員額最高為七萬四千六百人，第二類人員員額最高為四萬零一百人，第三類人員員額最高為一萬五千人，第四類人員員額最高為六千九百人，第五類人員員額最高為二萬四千三百人。\n本法施行後，行政院人事主管機關或單位每四年應檢討分析中央政府總員額狀況，釐定合理精簡員額數，於總預算案中向立法院提出報告。\n本法施行後，因組織改制或地方政府業務移撥中央，中央機關所增加原非適用本法之員額，不受本法規定員額高限限制。\n因應國家政治經濟環境變遷，或處理突發、特殊或新興之重大事務，行政院於徵詢一級機關後，得在第一項員額總數最高限之下彈性調整各類人員員額最高限。但第二項所定第三類人員員額最高限不得調降。"},{"no":"第5條","text":"司法院以外各一級機關及所屬各級機關員額配置，依以下方式辦理：\n一、各一級機關及所屬各級機關配置員額之總數，由行政院在前條第二項所定各類人員員額最高限內，徵詢一級機關後定之。\n二、各二級機關及所屬各級機關配置員額之總數，由該管一級機關就前款分配之總數定之。\n三、各三級以下機關配置之員額數，由該管二級機關擬訂，報請一級機關就前款分配之總數定之。\n司法院及所屬機關配置之員額數，由該院就前條第二項第三類員額最高限內定之。\n各機關應將實際員額數及人力類型，編入年度總預算案。年度中機關改隸、整併或調整之員額，應報請該管一級機關核定之。\n第二條第四項準用機關各年度員額數及人力類型，應會商行政院後編入年度總預算案。"},{"no":"第6條","text":"機關組織除以法律定其職稱、官等、職等及員額者外，應依公務人員任用法第六條規定，就其職責程度、業務性質及機關層級，依職務列等表，妥適配置各官等職等之人員，訂定編制表。\n前項編制表，其有關考銓業務事項，不得牴觸考銓法規，並應函送考試院核備。\n本法施行後，除本法、各機關組織法規及編制表外，不得以作用法或其他法規規定機關之員額。"},{"no":"第7條","text":"機關業務移撥其他機關或地方政府，現職人員應隨同業務移撥或依相關規定辦理退休、資遣。\n機關改制為法人型態或民營化時，現職人員應隨同業務移轉，原機關公務人員不願隨同移轉者，由主管機關協助安置或於機關改制之日，依相關規定辦理退休、資遣。\n前二項應隨同業務移撥、移轉之人員，應依公務人員任用法、公務人員保障法及相關法規等處理現職人員之權益問題。\n依第一項及第二項規定應精簡之員額，得由一級機關於精簡員額最高百分之二十範圍內，配合次年度預算審查核定分配予該管二級機關運用。"},{"no":"第8條","text":"各機關應定期評鑑所屬人力之工作狀況，並依相關法令對於不適任人力採取考核淘汰、資遣、不續約、訓練、工作重新指派等管理措施。\n機關新增業務時，應先就所掌理業務實際需要及消長情形，調整現有人力之配置；有下列情形之一者，其員額應予裁減或移撥其他機關：\n一、機關或內部單位裁撤或簡併。\n二、業務及功能萎縮。\n三、現有業務由民間或地方辦理較有效率或便利。\n四、完成國家重大建設、專案業務或計畫等階段性任務。\n五、實施組織及員額評鑑所為裁減或調整移撥員額之決議。\n六、實施分層負責、逐級授權，或推動業務資訊化、委任、委託、外包及運用社會資源節餘之人力。\n七、其他因政策或業務需要須為裁減或調整移撥之情事。\n一級機關每兩年應評鑑所屬二級機關員額總數之合理性；二級機關每兩年應評鑑所屬三級機關員額總數之合理性。員額合理性之檢討，應特別著重機關策略和業務狀況配合程度。評鑑結果可要求員額應予裁減或移撥其他機關，移撥員額時，現職人員不得拒絕，但得依相關規定辦理退休、資遣。\n前項員額評鑑，應本獨立專業原則，由一級機關或二級機關指派高級職員及遴聘學者專家，以任務編組方式為之。\n移撥人員，應由受撥機關或有關主管機關實施專長轉換訓練。\n裁減人員，必要時得由有關主管機關提供轉業訓練。"},{"no":"第9條","text":"行政院應指定專責機關或單位，掌理各機關員額管理之規劃、調整、監督及員額評鑑等事項；其員額管理、第二條第四項準用機關準用本法之範圍及其他相關事項之辦法，由行政院定之。\n司法院及所屬機關員額管理之規劃、調整、監督及員額評鑑等事項，由司法院參照前項規定辦理，並函知行政院指定之專責機關或單位。"},{"no":"第10條","text":"為增進人力精簡之效果，行政院得不定期採取具有時限性之人員優惠離職措施，並應以自願申請方式進行；其辦法，由行政院定之。"},{"no":"第11條","text":"本法施行日期，由行政院會同考試院定之。\n本法修正條文自公布日施行。"}],"tags":["員額","聘僱","契約人力","公務人員"],"note":"99.4.1 施行；第 3 條定義第一至五類員額（聘僱人員、工友屬第二類），第 4 條定各類員額最高限。"},{"id":"A08","name":"中央政府機關員額管理辦法","pcode":"S0110040","level":"命令","authority":"行政院人事行政總處","category":"行政＞行政院人事行政總處＞組編人力目","modified_date":"2022-10-19","history":[{"date":"2010-03-30","summary":"中華民國九十九年三月三十日行政院院授人力字第 09900615641 號令訂定發布全文 26 條；並自九十九年四月一日施行中華民國一百零一年二月三日行政院院臺規字第 1010122318 號公告第2 條、第 7 條第 2 項、第 12 條第 4 項所列屬「行政院人事行政局」之權責事項，自一百零一年二月六日起改由「行政院人事行政總處」管轄；第 7 條第 2 項所列屬「行政院主計處」之權責事項，自一百零一年二月六日起改由「行政院主計總處」管轄"},{"date":"2022-10-19","summary":"中華民國一百十一年十月十九日行政院院授人組字第 11120014761 號令修正發布第 2、7、9、12、23、25、26 條條文；並自發布日施行"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=S0110040","articles":[{"no":"第1條","text":"本辦法依中央政府機關總員額法（以下簡稱本法）第九條第一項規定訂定之。"},{"no":"第2條","text":"中央政府各機關員額管理之規劃、調整、監督及員額評鑑等事項之專責機關為行政院人事行政總處。"},{"no":"第3條","text":"本辦法之適用範圍，不包括司法院及其所屬機關、行政院所屬國營事業機構。"},{"no":"第4條","text":"本法所稱人力類型，係於中央政府總預算案以公務預算或非營業特種基金編列預算員額之職員、警察、法警、駐衛警察、工友、技工、駕駛、聘用人員、約僱人員及駐外雇員。"},{"no":"第5條","text":"本法準用機關得視業務需要，準用本法第五條第一項、第六條至第八條及第十條之規定。"},{"no":"第6條","text":"各機關因業務推動所需之預算員額，應本撙節原則，考量施政優先順序、實際業務消長、組織設置情形及機關人事費或用人費可支應程度，核實配置。"},{"no":"第7條","text":"各一級機關及所屬各級機關配置年度預算員額之總數，應以前一年度各人力類型配置預算員額總數為基準，考量下列各款因素，由行政院徵詢一級機關後定之：\n一、行政院核定年度歲出概算額度內辦理各項施政計畫之優先緩急，與機關新增業務時，就所掌理業務消長情形及實際需要，調整現有人力配置情形。\n二、依本法第七條第一項及第二項、第八條第二項規定，預算員額應予以精簡或裁減情形。\n三、各機關經列管出缺不補預算員額之缺額情形。\n四、員額評鑑結論之執行情形。\n五、前一年度預算員額調整情形。\n六、其他有關人力進用時程、須具備專長條件、原已配置預算員額進用及運用等涉及預算員額配置之情形。\n各一級機關應於前項獲配年度預算員額總數內，依機關層級及人力類型，辦理所屬各級機關年度預算員額分配作業，並應於前項年度預算員額總數確定後一個月內，將分配結果函送行政院人事行政總處彙整，並由該總處彙送行政院主計總處編入年度總預算案。"},{"no":"第8條","text":"為增進員額管理彈性，各二級機關得審酌所屬三級以下機關業務特性，有符合下列情形之一者，報請該管一級機關核定後，實施跨機關員額總量管理：\n一、職掌業務或管轄事務屬性相同或相近。\n二、管轄事務不同，而轄區相同，且人力性質可相互調任運用。\n三、業務具有高度協調聯繫關係，或基於業務共同目的之達成，在業務上得分工辦理。\n四、配合政策或組織調整需要，跨機關統籌運用人力較具效益。\n依前項規定實施跨機關總量管理者，得於該二級機關及其所屬各級機關年度預算員額總數額度內，決定年度預算員額配置數。"},{"no":"第9條","text":"各機關有下列各款情形之一者，不得增加年度預算員額：\n一、非屬因應新設機關、執行各一級機關核定新增重大專案計畫或業務之人力需求。\n二、所需預算員額，經檢討該機關現有業務優先緩急調整、資訊化、行政程序簡化、去任務化、地方化、法人化或委外化等方式，可由原配置人力調整運用。\n三、具延續性中長程業務之人力需求，可循環運用前一階段已配置之人力。\n四、各機關職員、警察、法警、聘用人員及約僱人員預算員額缺額總數逾其預算員額總數百分之五。但一級單位主管以上人員、機要人員、依法規保留職缺、列管考試分發及遴補中之職缺，不計入上開缺額總數。\n五、各機關列管出缺不補之職員、警察、法警、聘用人員及約僱人員預算員額，經檢討可調整支應新增業務者。\n各機關因安置其他機關現有人員，而增加配置預算員額者，不受前項規定之限制；所增預算員額並應列管為出缺不補。"},{"no":"第10條","text":"各機關有本法第七條第一項及第二項、第八條第二項規定情形者，應核實減少年度預算員額，或列管為出缺不補。"},{"no":"第11條","text":"各機關於第七條第二項獲配年度預算員額內，應依下列原則，合理配置業務單位及輔助單位人力：\n一、先充實業務單位所需人力，再妥適配置輔助單位人力。\n二、輔助單位所需人力，應於組織法令規定編制範圍內，依業務繁簡、機關層級及規模等因素核實配置。\n三、各機關應適時檢討輔助單位人力配置及運用情形；經檢討有節餘人力者，應配合減列預算員額、列管為出缺不補或調整為業務單位人力。"},{"no":"第12條","text":"二級以下機關於年度中須調整預算員額配置時，除因機關改隸、整併或調整之預算員額者外，由該二級機關就所掌理業務消長情形及實際需要，於原配置各該人力類型預算員額額度內核定之。\n一級機關於年度中須調整預算員額配置時，由該管一級機關於原配置各該人力類型預算員額總數核定之。\n各機關因改隸、整併或調整之預算員額，應報請該管一級機關核定。\n各機關依前三項規定調整之預算員額，核定機關應於核定時並函知行政院人事行政總處。"},{"no":"第13條","text":"各機關因業務移撥其他機關，其預算員額之調整原則如下：\n一、職員、警察、法警、聘用人員及約僱人員：\n（一）以原機關業務移撥時預算員額為基礎，扣除因業務萎縮及辦理優惠退離應精簡之預算員額數，隨同業務移撥。\n（二）原機關輔助單位人員，應參照業務單位移撥人數，按其比例隨同移撥。\n二、駐衛警察、工友、技工及駕駛：以業務移撥時在職人數為基礎，依職員、警察、法警、聘用人員及約僱人員移撥人數，按其比例辦理移撥。"},{"no":"第14條","text":"各機關因機關裁撤（併）、組織變更或業務緊縮，而須精簡人員時，依行政院及所屬各級機關精簡人員優惠退離辦法（以下簡稱優退辦法）辦理優惠退離措施，其每次精簡預算員額不得低於現有員額百分之四或一百人。\n機關首長、副首長、幕僚長或一級單位正、副主管不適用優退辦法。但常務之首長因機關裁撤（併）或常務之副首長、幕僚長或一級單位正、副主管因機關裁撤（併）或職務裁併者，不在此限；其精簡之職缺均予註銷，不得再行遞補或代理，並相對減列該機關預算員額。\n前項以外人員辦理優惠退離所遺職缺，該機關預算員額應相對減列，除工友、技工、駕駛、駐衛警察、聘用人員及約僱人員外，各機關並得於各該優惠退離之職缺二分之一範圍內，再行遞補或進用人員。\n依臺灣省政府功能業務與組織調整暫行條例改隸之機關及地區辦公室，經辦理優惠退離之人員，其精簡之職缺均予註銷，不得再行遞補或進用人員，並相對減列預算員額。\n實施優惠退離之機關，五年內該機關預算員額不得增加。但有業務特殊需要者，不在此限。"},{"no":"第15條","text":"各一級機關、二級機關（以下稱評鑑機關）對所屬機關之員額評鑑，依下列方式辦理：\n一、一級機關每兩年應評鑑所屬二級機關人力之工作狀況及員額總數合理性，並應著重機關整體策略與未來業務發展狀況之配合程度。\n二、二級機關每兩年應評鑑所屬機關人力之工作狀況及員額總數合理性，並應著重機關整體策略與未來業務發展狀況之配合程度。"},{"no":"第16條","text":"評鑑機關應本自我管理及專業原則，定期辦理所屬機關員額評鑑，並由下列人員組成評鑑小組為之：\n一、一級機關：本機關代表、相關機關代表及遴聘學者專家。\n二、二級機關：上級機關代表、本機關代表、相關機關代表及遴聘學者專家。\n前項機關代表及學者專家，以具備人力資源管理或受評機關業務職掌相關之專長領域為原則。\n第一項學者專家人數，以不少於三分之一為原則。"},{"no":"第17條","text":"評鑑機關應於辦理評鑑前，訂定評鑑計畫，並送受評機關。\n前項評鑑計畫內容，應載明下列事項：\n一、評鑑目的。\n二、評鑑重點。\n三、評鑑成員。\n四、評鑑期程。\n五、評鑑方式。\n六、評鑑程序。\n七、其他有關事項。\n前項評鑑重點，應包括組織、業務、人力、財務、工作方法與流程及其他等項目。\n受評機關應於評鑑十日前，提出受評書面報告送評鑑機關分送評鑑小組人員先行審閱。"},{"no":"第18條","text":"評鑑小組完成評鑑後三個月內，依評鑑重點進行會商，並提出評鑑結論，經評鑑機關核定後，送受評機關據以執行。\n前項二級機關所作評鑑結論，並應送一級機關備查。\n經評鑑認有現職工作不適任者，受評機關應依相關法令採取考核淘汰、資遣、不續約、訓練、工作重新指派等措施。"},{"no":"第19條","text":"受評機關應依評鑑結論所定執行期間內完成各項建議事項，每半年並將執行情形送評鑑機關核定。評鑑機關應依評鑑結論各項建議之執行情形，核予同意解除列管、自行列管或繼續追蹤列管之管考，並作為預算員額調整之依據。\n評鑑機關對受評機關未依評鑑結論所定期限完成者，除已同意展延完成期限或另為適當處理外，應追究受評機關相關人員行政責任。"},{"no":"第20條","text":"評鑑機關辦理員額評鑑所需經費，由各該機關年度相關經費項下勻支。"},{"no":"第21條","text":"各機關依本法第六條規定訂定編制表時，一級機關之編制表，由該一級機關訂定發布；二級以下機關之編制表，由二級機關擬訂，經一級機關核定後發布。其修正或廢止時，亦同。\n前項編制表之訂定、修正或廢止，經發布後，應由各該一級機關送考試院核備。"},{"no":"第22條","text":"各機關編制員額應依下列原則核實訂定︰\n一、編制員額總數，應以該機關配置職員、警察及法警之預算員額數為基礎，考量機關業務消長趨勢，核實訂定。\n二、機關各職務之職稱、官職等及員額，應依職責程度、業務性質及機關層次等因素，於編制員額總數範圍內，依機關所適用之職務列等表、各機關職稱及官等職等員額配置準則等相關規定，核實訂定。\n三、機關首長、副首長、政務職務及幕僚長等職稱、官職等或員額，應依該機關組織法規規定訂定。"},{"no":"第23條","text":"各機關聘用人員與約僱人員之管理及進用，應確實依下列原則辦理：\n一、聘用人員及約僱人員之進用，應以專業性、技術性、事務性及簡易性業務需要為基礎，專案計畫或擔任工作已完成者，應檢討不再續聘僱。\n二、對於長期以聘用人員及約僱人員辦理之業務，應檢討其續聘僱之必要性，如屬經常性業務者，應由編制內職員辦理。\n三、不得以續聘僱為考量，延長計畫期程或另訂性質相似之新計畫。\n四、機關未列管出缺不補之聘用人員及約僱人員出缺時，應依法規規定之進用程序，檢討進用其他所屬機關列管出缺不補且具所須專門知能條件之聘用人員及約僱人員。\n五、各機關聘用人員及約僱人員應確實辦理原核定計畫所列擔任工作內容，不得逕自調整移作他用或借調至其他機關。"},{"no":"第24條","text":"依各機關學校團體駐衛警察設置管理辦法進用之駐衛警察，除環境確屬特殊，經行政院核准繼續進用者外，均應檢討委託民間保全業務辦理或改採其他替代措施，現有駐衛警察預算員額應列管為出缺不補。"},{"no":"第25條","text":"各機關工友、技工及駕駛之員額管理原則如下：\n一、各機關非超額工友、技工及駕駛缺額之進用，應由本機關工友、技工及駕駛轉化或其他機關工友、技工及駕駛移撥，除行政院另有規定外，不得以新僱方式辦理。其經行政院核定為超額工友、技工及駕駛之預算員額，應列管為出缺不補，並配合年度預算編列核實減列。\n二、各機關應將其事務性工作積極採取廣泛使用現代化事務機具、推動業務資訊化、簡化流程、擴大外包、運用志工、替代役等人力，及全面推行職員自我服務等替代措施辦理，並鼓勵現有工友、技工及駕駛提早退離及有效運用其人力。"},{"no":"第26條","text":"本辦法自中華民國九十九年四月一日施行。\n本辦法修正條文自發布日施行。"}],"tags":["員額","聘僱","契約人力"],"note":"依總員額法第 10 條（授權）訂定之員額管理規範；總員額法無「施行細則」，此辦法即其子法。"},{"id":"A09","name":"行政院及所屬機關（構）聘僱人員進用及管理（相關規範彙整）","pcode":"","level":"行政規則／參考手冊","authority":"行政院人事行政總處","category":"行政＞行政院人事行政總處＞組編人力","modified_date":"2022-11-01","history":[{"date":"2022-11-01","summary":"行政院人事行政總處 111 年 11 月編印《聘僱人員管理作業參考手冊》（彙整聘用條例、約僱辦法、聘用人員注意事項、職務代理注意事項及釋例）"}],"url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa%2Ffiles%2F202211%2Fed1435f4-811c-46c3-9725-570f089a145b.pdf&name=x.pdf","articles":[],"tags":["聘用","約僱","聘僱","契約人力","參考資料"],"note":"查全國法規資料庫及人事總處網站，中央並無以此為名之單一法規；聘僱人員之進用及管理分別規定於聘用條例及施行細則、約僱辦法、聘用人員注意事項、職務代理注意事項、離職給與辦法、給假辦法，人事總處以《聘僱人員管理作業參考手冊》（111.11）彙整，各地方政府則另訂「○○政府及所屬各機關學校聘僱人員進用及管理要點」（如臺北市 FL101961，來源網域受限）。本機檔 raw/laws/dgpa/聘僱人員管理作業參考手冊_111.11.pdf。"},{"id":"A10","name":"各機關職務代理應行注意事項","pcode":"FL000605","level":"行政規則","authority":"銓敘部","category":"考試＞銓敘部＞銓敘部行政規則","modified_date":"2025-07-03","history":[{"date":"1987-11-06","summary":"銓敘部 76.11.6 訂定發布"},{"date":"1995-04-25","summary":"84.4.25 修正（考試院法規系統歷史版本 hid=1926）"},{"date":null,"summary":"94 年、96 年修正（放寬以約聘僱人員辦理所遺業務之授權，見人事總處手冊釋例）"},{"date":"2015-05-29","summary":"銓敘部 104.5.29 部銓三字第 10439723581 號令修正發布"},{"date":"2025-07-03","summary":"銓敘部 114.7.3 部銓三字第 11458440041 號令修正發布（第 5 點等）"}],"url":"https://law.exam.gov.tw/LawContent.aspx?id=FL000605","articles":[{"no":"第1點","text":"為規範各機關職務代理相關事項，以因應機關用人需要，並避免機關職務長期代理，影響考試用人政策，特訂定本注意事項。"},{"no":"第2點","text":"各機關職務代理，除法令另有規定外，以下列情形之一者為限：\n（一）出缺之職務，尚未派員或分發人員。\n（二）公差、公假、請假或休假。\n（三）依法停職或休職。\n（四）其他依規定奉准保留職缺。\n前項第一款出缺職務之代理期間，以一年為限。但有下列特殊情形之\n一者，得延長代理一次，並以一年為限：\n（一）現職人員代理：\n1.配合機關精簡、整併、改隸、改制、裁撤或與出缺職務有關之修編，經權責主管機關核定並確定生效日期。\n2.機關基於精簡用人需要或特殊需要，機關首長、副首長、一級單\n位主管及副主管職務出缺，由同職務列等或較高職務列等人員代理。\n3.偏遠地區難以羅致人員。\n4.駐外館處之首長職務出缺，因業務需要延長代理。\n（二）現職人員代理或約聘僱人員辦理：\n1.經提列公務人員相關考試任用計畫之職缺，因錄取不足額、錄取\n人員未報到、錄取人員保留受訓資格或廢止受訓資格，且無正額、增額錄取人員或補訓人員可資分發，並列入其他公務人員相關考試任用計畫。\n2.經提列考試分發之出缺職務，分發機關以未設置公務人員考試相關類科，致無法列入考試任用計畫。\n3.經提列公務人員相關考試任用計畫之職缺，尚未分配錄取人員或錄取人員未占編制職缺訓練。\n前項但書第一款第一目、第三目及第二款第一目、第二目之延長代理，應報經分發機關同意。第二項但書第一款第一目之延長代理，如係配合行政院組織調整，無法於二年內完成組織法規之立法程序者，不受第二項期間之限制。"},{"no":"第3點","text":"各機關應依各職務之職責及工作性質，預為排定現職人員代理順序及行使權責之特殊限制。如係出缺之職務，除應確依公務人員考試及格\n人員分發辦法規定，申請分發考試及格人員外，其由現職人員代理職\n務者，依下列規定辦理：\n（一）機關首長、副首長（或單位主管、副主管）職務出缺，尚未派員遞補時，得依序由本機關（或單位）法定代理人、同官等同層級、同官等次一層級、次一官等最高職等人員代理；如由其他機關（或本機關其他單位）人員代理，須具有被代理職務所列職等之任用資格或得權理之資格。\n（二）其他職務出缺，尚未派員或分發人員，亦應依前款順序代理。但本機關確無具有該職務任用資格人員可資代理時，始得由本機關具有次一官等最高職等任用資格人員代理。未具任用資格之現職機要人員、留用人員或派用人員，不得代理出缺\n之職務。但由派用機關改制之任用機關，其未具任用資格之派用人員，得代理本機關任用職務。教育人員任用條例公布施行前已遴用未經銓敘合格之公立學校職員，得代理其所任職學校任用職務。\n前二項職務代理之順序，參照第一項各款規定辦理。醫事人員、警察人員、交通事業人員或行政機關聘任人員代理本機關簡薦委任官等職等職務時，得依其具有各該人事法律所定之任用資格，以其所敘級別、官等官階、資位或等級薪額，對照行政機關公務人員相當官等職等後，再行參照第一項各款規定辦理。"},{"no":"第4點","text":"各機關依前點規定，由現職人員代理職務者，其職務代理之排定及權責，依下列各款規定辦理：\n（一）職務之代理除有法定代理人者，應由法定代理人代理外，其餘人員由機關依其職責及工作性質排定職務代理人。如排由一人代理確有困難者，得酌情分別指派數人代理，或由上級機關指派人員代理之。\n（二）各機關應重視各級屬員平時工作調配，實施職務輪換，使排定之職\n務代理人熟悉被代理人之工作。\n（三）現職人員代理職務時，應確實負責辦理所代理職務之工作，除報經核准者外，不得留待本人處理。代理人代理期間在半個月以上負責盡職，成績優良者，得酌予適當獎勵。\n（四）被代理人除特殊情形外，應先行將其工作及持有之資料交代清楚並對代理人負業務指導之責，其因交代不清以致耽誤者，應自行負責。"},{"no":"第5點","text":"各機關職務代理有下列情形之一，且本機關確實無法指定現職人員代理者，所遺業務得以其官等或級別，分別依聘用人員聘用條例或行政院與所屬中央及地方各機關約僱人員僱用辦法規定約聘或約僱人員辦理，雇員比照委任辦理：\n（一）薦任以下非主管職務，有第二點第一項第一款情形，經列管為考試\n分發職缺，並報經分發機關同意，在未分配考試錄取人員遞補前。經機關擇定外補，自函商原服務機關之日起至人員到職前，期間達\n一個月以上，亦同。\n（二）薦任以下非主管職務或雇員，有第二點第一項第二款至第四款情形\n之一，期間達一個月以上。但期間未達一個月，與留職停薪期間接續合計達一個月以上，亦同。\n（三）辦公場所位於偏遠地區，其薦任以下非主管職務或雇員，有第二點第一項第二款至第四款情形之一。\n（四）委任跨列薦任官等之非主管職缺（務），由機關視前三款規定約聘或約僱人員辦理其所遺業務。\n（五）各級公立學校、原公立托兒所，各類醫事人員僅置一人，有第二點第一項第二款至第四款情形之一，得約聘或約僱具有各該專業法規所定資格人員辦理其所遺業務。薦任以下主管人員有下列情形之一，其所遺業務，由現職薦任以下非\n主管人員代理時，該現職非主管人員之業務，得比照前項規定約聘或約僱人員辦理：\n（一）分娩或流產前後，連續請假、休假期間。\n（二）因安胎事由請假期間達一個月以上。\n（三）因公傷病請公假期間達一個月以上。"},{"no":"第6點","text":"未經列管臨時出缺之薦任以下非主管職務，機關依規定申請列入考試\n分發職缺，並經分發機關同意，在尚未分配相關等級類科考試錄取人員遞補前，得依前點第一項第一款、第四款規定辦理。"},{"no":"第7點","text":"各機關依本注意事項規定約聘僱人員時，應注意其品德及對國家之忠誠；在約聘僱期間，須遵守公務員服務法、公務人員行政中立法及其\n他相關法令之規定。"},{"no":"第8點","text":"公務人員任用法第二十六條至第二十八條規定，於依各相關法令規定約聘僱人員時，準用之。"},{"no":"第9點","text":"代理人員於代理原因消失時，應即解除代理，約聘僱人員於約聘僱原因消失或期限屆滿時，應即予解聘僱，不得以任何理由要求留用或救\n助。"},{"no":"第10點","text":"依本注意事項之代理，由各機關人事單位自行列冊管理；代理後發現\n不符規定者，應即改正並查明責任，業已依規定所支酬金，不予追繳。"}],"tags":["職務代理","聘用","約僱","公務人員","行政規則","契約人力"],"note":"不在全國法規資料庫；全文取自考試院主管法規共用系統（law.exam.gov.tw，本機檔 raw/laws/exam/FL000605_職務代理注意事項.html）。pcode 欄為該系統之法規代碼，非全國法規資料庫 PCode。第 5 點：薦任以下非主管職務出缺或請假達一個月以上等情形，得依聘用條例或約僱辦法約聘僱人員辦理所遺業務；第 9 點：原因消失應即解聘僱。"},{"id":"A11","name":"行政院與所屬中央及地方各機關聘僱人員給假辦法","pcode":"A0030128","level":"命令","authority":"行政院人事行政總處","category":"行政＞行政院人事行政總處＞培訓考用目","modified_date":"2025-10-09","history":[{"date":"2001-07-31","summary":"中華民國九十年七月三十一日行政院（90）台人政考字第 200496 號令訂定發布全文 8 條；並自發布日施行"},{"date":"2002-03-07","summary":"中華民國九十一年三月七日行政院（91）院授人考字第 0910200244 號令修正發布第 3、8 條條文"},{"date":"2008-03-12","summary":"中華民國九十七年三月十二日行政院院授人考字第 0970060937 號令修正發布第 3、4、8 條條文；並自九十七年一月一日施行"},{"date":"2015-03-24","summary":"中華民國一百零四年三月二十四日行政院院授人培字第 1040028127 號令修正發布名稱及第 3 條條文（原名稱：行政院及所屬各機關聘僱人員給假辦法；新名稱：行政院與所屬中央及地方各機關聘僱人員給假辦法）"},{"date":"2016-12-30","summary":"中華民國一百零五年十二月三十日行政院院授人培字第 10500635641號令修正發布第 3 條條文"},{"date":"2017-12-29","summary":"中華民國一百零六年十二月二十九日行政院院授人培字第 10600654192號令修正發布第 3、5、8 條條文；並自一百零七年一月一日施行"},{"date":"2018-12-07","summary":"中華民國一百零七年十二月七日行政院院授人培字第 10700579141 號令修正發布第 3、4 條條文"},{"date":"2019-04-22","summary":"中華民國一百零八年四月二十二日行政院院授人培字第 10800324321號令修正發布第 4、5、8 條條文；並自一百零九年一月一日施行"},{"date":"2020-07-15","summary":"中華民國一百零九年七月十五日行政院院授人培字第 10900369291 號令修正發布第 2、3、6 條條文"},{"date":"2022-07-15","summary":"中華民國一百十一年七月十五日行政院院授人培字第 11100173971號令修正發布第 1、3 條條文"},{"date":"2025-10-09","summary":"中華民國一百十四年十月九日行政院院授人培字第 11400212791 號令修正發布全文 9 條；除第 3 條有關身心調適假部分自一百十四年十月十日施行外，自一百十五年一月一日施行"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030128","articles":[{"no":"第1條","text":"本辦法依公務員服務法第十三條第四項規定訂定之。"},{"no":"第2條","text":"本辦法所稱聘僱人員，指依聘用人員聘用條例聘用及行政院與所屬中央及地方各機關約僱人員僱用辦法僱用之人員。"},{"no":"第3條","text":"行政院與所屬中央及地方各機關（以下簡稱各機關）聘僱人員之給假，依下列規定：\n一、因事得請事假，每年准給七日。其家庭成員預防接種、發生嚴重之疾病或其他重大事故須親自照顧時，得請家庭照顧假，每年准給七日；為調適身心需要，得請身心調適假，每年准給三日。請家庭照顧假及身心調適假之日數，均併入事假計算。超過規定日數之事假，應按日扣除報酬。\n二、因疾病或安胎必須治療或休養者，得請病假，每年准給十四日。女性聘僱人員因生理日致工作有困難者，每月得請生理假一日，全年請假日數未逾三日，不併入病假計算，逾三日之日數併入病假計算。超過病假日數者，以事假抵銷。因重大傷病非短時間所能治癒或因安胎確有需要請假休養者，於依規定核給之病假、事假、慰勞假及補休均請畢後，經機關長官核准得請延長病假，其六個月內合併計算不得超過三十日。\n三、因結婚者，給婚假十四日，應自結婚之日前十日起三個月內請畢。但因特殊事由經機關長官核准者，得於一年內請畢。\n四、因懷孕者，於分娩前，給產前假八日，得分次申請，不得保留至分娩後；分娩後，給娩假四十二日；懷孕滿二十週以上流產者，給流產假四十二日；懷孕十二週以上未滿二十週流產者，給流產假二十一日；懷孕未滿十二週流產者，給流產假十四日。娩假或流產假應一次請畢。分娩前已請畢產前假者，必要時得於分娩前先申請部分娩假，並以十二日為限，不限一次請畢；流產者，其流產假應扣除先請之娩假日數。\n五、因陪伴配偶懷孕產檢，或因配偶分娩或懷孕滿二十週以上流產者，給陪產檢及陪產假七日，除陪產檢於配偶懷孕期間請假外，陪產之請假應於配偶分娩或流產之當日及其前後合計十五日（含例假日）期間內為之，並得分次申請。\n六、因父母、配偶死亡者，給喪假十日；繼父母、配偶之父母、子女死亡者，給喪假七日；曾祖父母、祖父母、配偶之祖父母、配偶之繼父母、兄弟姐妹死亡者，給喪假三日。除繼父母、配偶之繼父母，以聘僱人員或其配偶於成年前受該繼父母扶養或於該繼父母死亡前仍與共居者為限外，其餘喪假應以原因發生時所存在之天然血親或擬制血親為限。喪假應於死亡之日起百日內請畢。\n七、因捐贈骨髓或器官者，視實際需要給假。\n前項第一款所定准給事假日數，於二月以後到職、復職或再任者，按到職、復職或再任當月至年終之在職月數占全年比例計算之，尾數未滿半日者，以半日計，超過半日未滿一日者，以一日計。但依性別平等工作法第十六條第一項及第三項規定留職停薪後復職者，視為年資銜接，其事假接續核給。\n聘僱人員應先請畢依規定核給之慰勞假及補休後，始得依第一項第一款後段規定，請超過規定日數之事假，其給假應由機關長官綜合考量其請假事由之急迫性、必要性及全年上班日數之合理性後，審慎決定。但併入事假日數計算之家庭照顧假及身心調適假不適用之。\n聘僱人員依第一項規定申請家庭照顧假、身心調適假、生理假、產前假、娩假、流產假、陪產檢及陪產假，及因安胎事由申請其他假別之假時，機關不得拒絕，且不得影響其考核或為其他不利之處分。"},{"no":"第4條","text":"聘僱人員至年終連續服務滿一年者，第二年起，每年應給慰勞假七日；服務滿三年者，第四年起，每年應給慰勞假十四日；滿六年者，第七年起，每年應給慰勞假二十一日；滿九年者，第十年起，每年應給慰勞假二十八日；滿十四年者，第十五年起，每年應給慰勞假三十日。\n初聘僱人員於二月以後到職者，於次年一月以其計至到職當年年終之慰勞假年資，依前項所定慰勞假日數，按到職當月至年終之在職月數占全年比例計算核給慰勞假，其尾數之計算依前條第二項規定；年資未滿一年者，以七日按上開比例計算之。第三年一月起，以其慰勞假年資依前項規定給假。\n聘僱人員應休畢之慰勞假日數，應於當年度全部休畢；應休而未休畢者，視為放棄。\n聘僱人員年資銜接者，其應休畢日數以外之慰勞假經用人機關核准，得保留至次一年度實施，於次一年度終結或契約終止仍未休畢之日數，視為放棄。\n聘僱人員休慰勞假得酌予補助。應休畢日數以外之慰勞假確因公務需要經機關長官核准無法休畢，且未依前項規定保留者，得酌予發給未休畢慰勞假加班費或給予其他獎勵。"},{"no":"第5條","text":"聘僱人員未具慰勞假三日資格者，每年應給慰勞假三日。但在同一年度內已請畢及已給予未休畢慰勞假加班費或其他獎勵之慰勞假日數，均應予扣除。未請畢者，視為放棄。\n原任聘僱人員以外其他受有俸（薪）給之文職公務員、公營事業機構純勞工以外之人員、公立學校教育人員及志願役軍職人員，受撤職、免職或其他相當處分後轉任聘僱人員者，不適用前項規定。"},{"no":"第6條","text":"公假、例假日、曠職、年資採計、請（銷）假方式、應休畢之慰勞假日數、慰勞假補助費及未休畢慰勞假加班費等相關事項，準用公務人員請假規則或其他公務人員法令。\n聘用住院醫師之慰勞假年資，得採計其於專科醫師分科及甄審辦法所定畢業後綜合臨床醫學訓練期間之年資。"},{"no":"第7條","text":"業務性質特殊機關聘僱人員之給假，得參照本辦法另作特別規定，並送行政院所屬二級機關、相當二級或三級機關之獨立機關、直轄市政府、直轄市議會、縣（市）政府及縣（市）議會核定。"},{"no":"第8條","text":"各機關應將依本辦法所定聘僱人員給假內容，於聘僱契約中載明。"},{"no":"第9條","text":"本辦法除第三條有關身心調適假部分自中華民國一百十四年十月十日施行外，自一百十五年一月一日施行。"}],"tags":["聘用","約僱","契約人力","給假"],"note":"聘僱人員給假之行政院法規命令（補充蒐集）。"},{"id":"A12","name":"工友退職補償金發給辦法","pcode":"S0110028","level":"命令","authority":"行政院人事行政總處","category":"行政＞行政院人事行政總處＞組編人力目","modified_date":"2021-03-11","history":[{"date":"1996-02-10","summary":"中華民國八十五年二月十日行政院（85）台人政企字第 05513 號令訂定發布全文 14 條"},{"date":"2004-08-06","summary":"中華民國九十三年八月六日行政院院授人企字第 0930063572 號函修正發布第 7、8 條條文之附表二、三；並自即日起實施"},{"date":"2011-06-08","summary":"中華民國一百年六月八日行政院院授人企字第 10000391021 號令修正發布第 7 條條文中華民國一百零一年二月三日行政院院臺規字第 1010122318 號公告第4 條第 2 項所列屬「行政院人事行政局」之權責事項，自一百零一年二月六日起改由「行政院人事行政總處」管轄"},{"date":"2017-11-17","summary":"中華民國一百零六年十一月十七日行政院院授人綜字第 10600614251號令修正發布第 4、6、14 條條文；除第 6 條自一百零七年七月一日施行外，自發布日施行"},{"date":"2021-03-11","summary":"中華民國一百十年三月十一日行政院院授人綜字第 11010001511 號令修正發布全文 7 條；並自發布日施行"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=S0110028","articles":[{"no":"第1條","text":"為辦理退職工友，比照公教人員退休金其他現金給與補償金發給辦法發給退職補償金（以下簡稱補償金），特訂定本辦法。"},{"no":"第2條","text":"本辦法適用對象為工友管理要點所稱編制內之普通工友及技術工友（含駕駛）（以下合稱工友），其具有八十四年六月三十日以前服務年資，經採計核給退休金或離職給與者。"},{"no":"第3條","text":"工友合於前條規定之年資，其補償金總額，應以工友補償金基數乘以補償金基數內涵計算。\n前項所定工友補償金基數，為依工友管理要點及中央各機關學校工友員額管理作業要點規定，所計得應領退休金或離職給與之基數。\n第一項所定工友補償金基數內涵，為工友最後在職餉級之月工餉百分之十五。"},{"no":"第4條","text":"補償金於核定退休或離職案時併同核定，並由退休金或離職給與之發放機關、學校一次發給。"},{"no":"第5條","text":"有下列情形之一者，喪失請領補償金之權利：\n一、禠奪公權終身。\n二、動員戡亂時期終止後，曾犯內亂、外患罪，經判刑確定。\n三、喪失中華民國國籍。"},{"no":"第6條","text":"補償金由支付退休、離職給與之機關、學校在年度相關經費項下支應。"},{"no":"第7條","text":"本辦法自發布日施行。"}],"tags":["工友","技工","勞動","契約人力"],"note":"工友（含技工、駕駛）退職補償金；工友適用勞基法後之過渡給與（補充蒐集）。"},{"id":"A13","name":"公立幼兒園契約進用人員之進用考核及待遇辦法","pcode":"H0070038","level":"命令","authority":"教育部","category":"行政＞教育部＞國民及學前教育目","modified_date":"2026-06-30","history":[{"date":"2012-04-27","summary":"中華民國一百零一年四月二十七日教育部臺參字第 1010071990C 號令訂定發布全文 22 條；並自發布日施行中華民國一百零三年三月二十四日行政院院臺規字第 1030128812 號公告第 7 條第 5 項所列屬「行政院原住民族委員會」之權責事項，自一百零三年三月二十六日起改由「原住民族委員會」管轄"},{"date":"2014-04-08","summary":"中華民國一百零三年四月八日教育部臺教授國部字第 1030024403B 號令修正發布第 12、13、18 條條文"},{"date":"2017-02-03","summary":"中華民國一百零六年二月三日教育部臺教授國部字第 1050151956B 號令修正發布第 13 條條文"},{"date":"2017-05-08","summary":"中華民國一百零六年五月八日教育部臺教授國部字第 1060046682B 號令修正發布全文 23 條；並自發布日施行"},{"date":"2018-02-05","summary":"中華民國一百零七年二月五日教育部臺教授國部字第 1060148681B 號令修正發布第 13、23 條條文；除第十三條附表自一百零七年一月一日施行外，自發布日施行"},{"date":"2018-03-27","summary":"中華民國一百零七年三月二十七日教育部臺教授國部字第 1070027169B號令修正發布第 1、2、11、13～16、18～20 條條文"},{"date":"2019-05-28","summary":"中華民國一百零八年五月二十八日教育部臺教授國部字第 1080054502B號令修正發布第 1、2、11、13、14、17、23 條條文；除第 14 條第 5項第 4 款規定自一百零七年六月二十九日施行外，自發布日施行"},{"date":"2021-01-13","summary":"中華民國一百十年一月十三日教育部臺教授國部字第 1090166681B 號令修正發布第 15、16、18、19、23 條條文；除另定施行日期者外，自發布日施行"},{"date":"2021-07-20","summary":"中華民國一百十年七月二十日教育部臺教授國部字第 1100074126B 號令修正發布第 13、15～20 條條文；第 13 條第 1 項之附表，自一百十年八月一日施行"},{"date":"2021-12-30","summary":"中華民國一百十年十二月三十日教育部臺教授國部字第 1100170904A號令修正發布第 13 條條文；修正之附表自一百十一年一月一日施行"},{"date":"2023-02-27","summary":"中華民國一百十二年二月二十七日教育部臺教授國部字第 1120015242A 號令修正發布第 1、2、7、11、13～15、17 條條文"},{"date":"2023-12-25","summary":"中華民國一百十二年十二月二十五日教育部臺教授國部字第 1120175146A 號令修正發布第 13 條條文；第 1 項之附表自一百十三年一月一日施行"},{"date":"2024-12-31","summary":"中華民國一百十三年十二月三十一日教育部臺教授國部字第 1135603184A 號令修正發布第 2、3、8、13、20 條條文；除第 13 條第 1項附表，自一百十四年一月一日施行；第 20 條第 5、6 項自一百十四年八月一日施行外，其餘條文自發布日施行"},{"date":"2026-06-30","summary":"中華民國一百十五年六月三十日教育部臺教授國部字第 1155601478A號令修正發布第 7、14、17 條條文；除第 7 條第 3 項，自一百十五年八月一日施行；第 14 條第 5、6 項，自一百十四年九月一日施行；第 17 條第 5 項第 4 款、第 6 項，自一百十五年一月一日施行；第 17 條第 4 項及第 5 項第 1 款規定，自一百十五年五月二十九日施行外，自發布日施行"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=H0070038","articles":[{"no":"第1條","text":"本辦法依教保服務人員條例（以下簡稱本條例）第十八條第二項、第二十條、第二十五條第二項與第二十七條，及幼兒教育及照顧法（以下簡稱幼照法）第二十二條第一項規定訂定之。"},{"no":"第2條","text":"本辦法所稱契約進用人員，指直轄市、縣（市）、鄉（鎮、市）、直轄市山地原住民區立幼兒園（以下簡稱幼兒園）及公立學校附設幼兒園（以下簡稱附幼）依下列規定進用之人員：\n一、於本條例施行後依勞動基準法規定以現職契約進用之教保員身分任園長。\n二、於幼照法施行後依勞動基準法規定進用之教保員、助理教保員及社會工作人員、護理人員、廚工與職員等之其他人員。\n前項人員之進用，除園長之進用應依本條例第二十五條第四項規定辦理外，應依第三條第一項至第三項規定採聯合或自行公開甄選方式為之；其為現職教保員或助理教保員，符合下列規定者，得採遷調方式為之：\n一、在現職幼兒園或附幼實際服務累計達直轄市、縣（市）主管機關規定之年限。\n二、留職停薪者，經幼兒園或附幼所屬學校（以下簡稱學校）核准於當學年度遷調生效日前回職復薪。\n三、無本條例第十二條、第十三條、第十四條第一項各款情形之一或尚在調查、處理程序中。\n四、其他直轄市、縣（市）主管機關規定之條件。\n第一項人員為廚工者，應以專任或兼任方式進用。\n中華民國一百年十二月三十一日以前已依勞動基準法規定，以契約進用之人員，得繼續原契約。但原從事幼兒教保服務之人員，未具本條例所定教保服務人員資格者，不得繼續從事幼兒教保服務，幼兒園或附幼應將其調整至適當職務，仍不能勝任者，得依勞動基準法規定終止契約。\n第一項契約進用人員，應符合本條例及幼照法各類人員資格之規定；本條例及幼照法未規定者，應具擬任工作所需之相關知能。"},{"no":"第3條","text":"直轄市、縣（市）主管機關、鄉（鎮、市）公所、直轄市山地原住民區公所或國立學校，每學期至少辦理一次聯合公開甄選作業。但幼兒園或學校未有開缺或第一學期以聯合公開甄選方式作業，並有備取名單足供當學年使用者，不在此限。\n前項前段規定，於鄉（鎮、市）、直轄市山地原住民區立幼兒園及國立學校附設幼兒園，其契約進用人員之公開甄選作業，規定如下：\n一、鄉（鎮、市）、直轄市山地原住民區立幼兒園：得擬具甄選簡章報直轄市、縣（市）主管機關備查後，由鄉（鎮、市）公所、直轄市山地原住民區公所依第五條至第七條、第九條、第十條及第二十一條相關規定辦理，或委由所在地直轄市、縣（市）主管機關辦理。\n二、國立學校附設幼兒園：得擬具甄選簡章報中央主管機關備查後，由國立學校依第五條至第七條、第九條、第十條及第二十一條相關規定辦理，或委由所在地直轄市、縣（市）主管機關辦理。\n教保員及助理教保員以外之其他契約進用人員，得委由各地公立就業服務機構辦理公開甄選作業，並免依第五條及第六條規定辦理。\n依前三項規定進用之人員，其所從事之工作為繼續性工作者，應依勞動基準法規定，簽訂不定期契約。"},{"no":"第4條","text":"契約進用人員依相關規定請假、留職停薪期間，或因遷調作業或甄選作業尚未完成期間，以依勞動基準法規定簽訂定期勞動契約之人員，執行其原有職務；其契約期間應至契約進用人員回任或到任為止。\n前項因遷調作業或甄選作業尚未完成期間所進用之定期勞動契約人員，契約期間不得超過六個月。\n第一項簽訂定期勞動契約之人員，其期間未滿三個月者，由幼兒園或學校自行辦理，得免經公開甄選；三個月以上者，由幼兒園或學校公開甄選，並免依第五條及第六條規定辦理。"},{"no":"第5條","text":"直轄市、縣（市）主管機關辦理聯合公開甄選作業，應設契約進用人員甄選會（以下簡稱甄選會）；其任務如下：\n一、審定甄選簡章。\n二、訂修試場規則。\n三、確認作業程序。\n四、督導試務工作。\n五、審議錄取名單。\n六、處理偶發事件。\n七、其他有關契約進用人員甄選事項。"},{"no":"第6條","text":"甄選會置委員九人至十七人，委員中應有三分之一以上為現任或曾任幼兒教育及照顧研究或從事幼兒教育及照顧相關工作者；其外聘委員及任一性別委員，應各占委員總數三分之一以上。\n直轄市、縣（市）主管機關辦理聯合公開甄選作業，其甄選會委員，由辦理甄選作業之機關首長遴聘之，並由首長或其指定之人員擔任召集人，開會時並為主席；召集人因故未能出席時，得由出席委員互推一人擔任主席。\n甄選會應有三分之二以上委員出席，始得開會，並經出席委員過半數之同意，始得決議；同數時，由主席裁決之。"},{"no":"第7條","text":"教保員、助理教保員之甄選，至少應就筆試、口試、試教及實作，擇二種以上方式綜合考評。\n教保員、助理教保員以外之其他契約進用人員，其甄選方式，得採筆試、口試或實作之一種方式辦理。\n辦理第一項人員甄選時，就具備一定期間以上之公立托兒所或幼稚園教保服務經驗者，應酌予加分，並明定於甄選簡章。\n前項一定期間以上之教保服務經驗，及酌予加分之限制規定，由直轄市、縣（市）主管機關定之。\n第三條第二項鄉（鎮、市）、直轄市山地原住民區立幼兒園位於原住民族地區者，其為推動族語、歷史及文化教育之需，於辦理第一項人員甄選時，得就經原住民族委員會族語認證通過並有證明文件者，酌予加分，且應明定於甄選簡章。\n第三項規定，自中華民國一百十五年八月一日施行。"},{"no":"第8條","text":"依本辦法辦理之遷調事項，由直轄市、縣（市）主管機關訂定相關規定為之；其遷調跨其他直轄市、縣（市）行政區域者，相關直轄市、縣（市）主管機關得共同訂定相關規定，並組成跨直轄市、縣（市）遷調作業小組為之。\n直轄市、縣（市）主管機關依前項所定規定辦理遷調作業，應尊重教保員、助理教保員之意願。\n國立學校附設幼兒園之教保員、助理教保員，其遷調作業，得委由所在地直轄市、縣（市）主管機關辦理。"},{"no":"第9條","text":"依本辦法辦理之契約進用人員公開甄選、遷調作業有關資訊，應於辦理作業之資訊網站公告；自公告起至報名截止期間，不得少於五日（不包括例假日）。"},{"no":"第10條","text":"依本辦法辦理之甄選、考評及遷調作業有關資料，應參照檔案法及相關法規規定妥善保存。"},{"no":"第11條","text":"經聯合公開甄選作業錄取之人員及達成遷調之教保員、助理教保員，除有本條例第十二條、第十三條、第十四條第一項各款與幼照法第二十三條、第二十四條及第二十五條第一項各款情形之一者外，幼兒園或學校不得拒絕進用。\n教保員、助理教保員經達成遷調而未報到，致影響其他幼兒園或附幼教保員、助理教保員遷調者，各該遷調均失其效力，各教保員、助理教保員仍留原幼兒園或附幼服務，原幼兒園或學校不得拒絕。但未報到教保員、助理教保員之原幼兒園或學校可增開缺額而達成遷調者，各該遷調不失其效力。"},{"no":"第12條","text":"幼兒園或學校應與進用人員訂定契約；其契約應記載下列事項：\n一、契約進用人員之權利義務。\n二、擔任工作項目及工作考核。\n三、契約期間工作報酬及給酬方式。\n四、其他必要事項。\n前項契約範本，由中央主管機關定之。"},{"no":"第13條","text":"教保員、助理教保員、社會工作人員及護理人員之薪資支給基準，規定如附表。但有第二條第四項所定繼續原契約情形者，仍依原規定薪資給付。\n前項以外契約進用人員之薪資，各幼兒園或學校得依其擔任工作繁簡難易、責任輕重及應具備之知能條件，自行議定，並不得低於最低工資法規定之最低工資。\n幼兒園或學校新進用之契約進用人員，其職稱為教保員者，依其學歷之薪資第一級給付；其職稱為助理教保員者，依其職稱之薪資第一級給付；其為護理人員及社會工作人員者，依其所具證書，分別以各該薪資第一級給付。\n本辦法薪資支給，以採計簽訂契約同一幼兒園、附幼或學校之工作年資為限。但有下列情形之一者，不在此限：\n一、依行政院與所屬中央及地方各機關約僱人員僱用辦法規定進用曾任同一幼兒園、附幼或學校約聘僱人員期間服務年資，其與現任職務性質相近且服務成績優良者，得以一月至十二月之全年在職年資採計所敘薪級，每滿一年採計一級，畸零月數不予併計，至多採計五級。\n二、本辦法中華民國一百零六年五月八日修正施行後，以遷調進用或依第三條第一項及第二項規定以公開甄選進用之教保員、助理教保員，其薪資支給及休假年資，得採計該員公開甄選或遷調前一任職於幼兒園或附幼擔任教保員或助理教保員，且持續任職之年資。\n三、經各直轄市、縣（市）主管機關遴選為公立幼兒園園長之教保員，其薪資支給及休假年資，得採計該員遴選前一任職於幼兒園或附幼擔任教保員，且持續任職之年資。\n第四條第一項簽訂定期勞動契約之人員，執行教保員職務者，其薪資依第一項支給基準表之級別及學歷，按初任第一級之薪資計算。\n第四條第一項簽訂定期勞動契約之人員，執行助理教保員、社會工作人員及護理人員職務者，其薪資依第一項支給基準表之級別，按初任第一級之薪資計算。\n前二項人員薪資之計算方式，規定如第一項附表。\n中華民國一百十年十二月三十日修正發布之第一項附表，自一百十一年一月一日施行。\n中華民國一百十二年十二月二十五日修正發布之第一項附表，自一百十三年一月一日施行。\n中華民國一百十三年十二月三十一日修正發布之第一項附表，自一百十四年一月一日施行。"},{"no":"第14條","text":"幼兒園或學校應依相關保險法令，為契約進用人員投保。\n幼兒園或學校應依下列規定，為契約進用人員辦理退休或資遣相關事宜：\n一、適用勞動基準法退休金制度之工作年資，依勞動基準法及相關規定辦理。\n二、適用勞工退休金條例之工作年資，依勞工退休金條例及相關規定辦理。\n契約進用人員年終工作獎金，比照當年度軍公教人員年終工作獎金發給注意事項（以下簡稱注意事項）規定辦理；其於年度中轉任為注意事項所定適用或比照適用之對象，且於十二月一日仍在職者，由原幼兒園或學校按其以契約進用身分實際任職月數占全年度月數之比率，以契約進用人員身分在職最後一個月所支待遇為計算基準，於不重領、不兼領原則下，發給年終工作獎金。\n前項於年度中轉任為注意事項所定適用或比照適用對象之規定，適用於本辦法施行後進用之契約進用人員。\n契約進用人員專（兼）任主管職務者，依下列規定支給職務加給：\n一、教保員兼任組長：比照公立高級中等以下學校組長職務加給之規定，其薪資為第五級以下者，以相當委任第五職等支給；第六級至第八級者，以相當薦任第六職等支給；第九級以上者，以相當薦任第七職等支給。\n二、教保員專（兼）任主任：比照公立高級中等以下學校主任職務加給之國小處、室主任規定，以相當薦任第七職等支給。\n三、教保員專任園長：比照公立高級中等以下學校主任職務加給之規定，以相當薦任第八職等支給。\n四、職員兼任組長：比照公立高級中等以下學校組長職務加給之規定，其年終考核為甲等累計未達六次者，以相當委任第五職等支給；累計達六次至八次者，以相當薦任第六職等支給；累計達九次以上者，以相當薦任第七職等支給。\n契約進用教保服務人員專（兼）任主管職務者，其行政工作獎金之發給，準用公立學校教師獎金發給辦法及其相關規定辦理。\n直轄市、縣（市）主管機關應就所轄之偏遠及離島地區，訂定契約進用人員地域加給之補充規定，並發給之。\n直轄市、縣（市）主管機關得視財政狀況，規劃辦理園長福利措施。\n第五項及第六項規定，自中華民國一百十四年九月一日施行。"},{"no":"第15條","text":"契約進用人員應接受考核；其考核類別如下：\n一、平時考核：應就平時之工作、操行、敬業精神、工作成效、出勤紀錄等項目考核，隨時根據具體事實，詳予記錄，並作為年終考核之依據。\n二、年終考核：應就敬業精神、團隊精神、工作成效、專業知能、出勤紀錄、獎懲情形、完成本條例及幼照法規定相關研習時數及平時考核情形等，綜合考核。\n三、專案考核：契約進用人員涉有重大違失情事、違反勞動基準法第十二條第一項各款情形或受刑事處分時，應辦理專案考核。\n契約進用人員平時有合於獎懲基準之具體事實者，應予以獎勵或懲處；獎勵分嘉獎、記功、記大功；懲處分申誡、記過、記大過。\n第一項第二款年終考核之細目及前項獎懲基準，由各直轄市、縣（市）主管機關訂定，並報中央主管機關備查。\n契約進用人員有第十七條第一項及第二項第二款所定情形者，直屬主管應與其面談，就園務計畫、目標、方法及態度等，進行溝通討論；面談內容及結果，應記錄於平時考核紀錄。"},{"no":"第16條","text":"契約進用人員任職至學年度終了屆滿一學年者，應予年終考核。\n年終考核分為甲等、乙等及丙等；其各等分數及規定如下：\n一、甲等：八十分以上。其次學年薪資提高一級。\n二、乙等：七十分以上，未滿八十分。其次學年薪資留原薪級。\n三、丙等：未滿七十分。其次學年薪資留原薪級，並不發給年終工作獎金。\n契約進用人員連續任職滿六個月，未滿一學年者，另予考核；其考核項目、各等分數，比照年終考核之規定辦理，次學年仍留原薪級。"},{"no":"第17條","text":"契約進用人員有下列情形之一者，年終考核不得考列甲等：\n一、有曠職之紀錄。\n二、未經幼兒園園長或學校校長同意，擅自在外兼課兼職。\n三、因病已達延長病假。\n四、事、病假合計超過二十八日。\n五、工作不力致影響整體業務之完成或推展，有具體事實。\n六、影響幼兒園或學校聲譽，有具體事實。\n契約進用人員有下列情形之一者，年終考核僅得考列丙等：\n一、對幼兒有身心虐待、體罰、霸凌、性騷擾、不當管教，或其他對幼兒之身心暴力或不當對待之行為，有具體事實。\n二、其他影響幼兒重大權益事項，且有具體之事實。\n第一項第三款因病已達延長病假之情形，不包括經醫師診斷需安胎休養者，其治療、照護或休養期間之請假。\n第一項第四款事、病假合計之日數，應扣除請家庭照顧假、身心調適假、生理假及因安胎事由請假之日數。\n直轄市、縣（市）主管機關、鄉（鎮、市）公所、直轄市山地原住民區公所、幼兒園或學校於辦理契約進用教保服務人員考核時，不得以下列事由，作為年終考核等次之考量因素：\n一、依法令規定日數所核給之家庭照顧假、身心調適假、生理假、婚假、產前假、娩假、流產假或陪產檢及陪產假。\n二、經醫師診斷需安胎休養者，其治療、照護或休養期間請假之日數。\n三、依法令規定核給之哺集乳時間、因育嬰減少之工作時間或辦理育嬰留職停薪。\n四、一年內請普通傷病假日數未超過十日。\n契約進用人員請普通傷病假，一年內超過十日者，仍應以其工作能力、工作態度、實際績效及其他因素，綜合考量辦理考核，不得僅以請普通傷病假日數作為考量因素。\n第五項第四款及前項規定，自中華民國一百十五年一月一日施行；第四項及第五項第一款規定，自一百十五年五月二十九日施行。"},{"no":"第18條","text":"直轄市、縣（市）主管機關、鄉（鎮、市）公所、直轄市山地原住民區公所、幼兒園或學校，為辦理契約進用人員考核，應設契約進用人員考核小組（以下簡稱考核小組）；其任務如下：\n一、平時考核紀錄及獎懲結果之初核或核議。\n二、年終考核及專案考核之初核、核議或復議。\n三、年終考核及專案考核之考核評分基準、等級及流程之審定。\n四、專案考核之考核項目及內容之審定。\n五、其他考核事項。"},{"no":"第19條","text":"考核小組置委員五人至九人，其中任一性別委員不得少於委員總數三分之一，且應有契約進用之教保服務人員代表二人以上。但該機關、幼兒園或學校任一性別總人數少於委員總數三分之一，或契約進用之教保服務人員人數未達二人者，不在此限。\n直轄市、縣（市）主管機關、鄉（鎮、市）公所、直轄市山地原住民區公所之考核小組委員，由直轄市、縣（市）主管機關、鄉（鎮、市）公所、直轄市山地原住民區公所首長遴聘，指定其中一人為召集人，並為主席。\n幼兒園或學校考核小組委員，除契約進用之教保服務人員代表由幼兒園園務會議或學校校務會議遴選產生外，其餘由幼兒園園長或學校校長遴聘，並指定其中一人為召集人且為主席。\n考核小組召開契約進用人員考核會議時，應有全體委員三分之二以上出席，出席委員過半數之同意，始得為決議。\n考核小組於審查年終考核為乙等以下，及專案考核或平時考核之懲處事項時，應以書面通知當事人陳述意見；陳述意見，得以書面或言詞為之，並應列入考核小組會議紀錄。\n考核小組委員之任期，自每年九月一日至次年八月三十一日止。"},{"no":"第20條","text":"契約進用人員年終考核，應於每年七月三十一日前完成。\n前項考核程序，規定如下：\n一、園長：由直轄市、縣（市）主管機關、鄉（鎮、市）公所、直轄市山地原住民區公所之考核小組初核後，報直轄市、縣（市）主管機關、鄉（鎮、市）公所、直轄市山地原住民區公所首長覆核。\n二、前款以外人員：由幼兒園或學校之考核小組初核後，報幼兒園園長或學校校長覆核。但鄉（鎮、市）、直轄市山地原住民區立幼兒園，報各鄉（鎮、市）公所、直轄市山地原住民區公所首長覆核。\n前項覆核結果與初核不同時，直轄市、縣（市）主管機關、鄉（鎮、市）公所、直轄市山地原住民區公所首長、幼兒園園長或學校校長，應敘明理由交考核小組復議；對復議結果仍不同意時，得變更之，並敘明改核之事實及理由。\n直轄市、縣（市）立幼兒園由契約進用教保員代理園長者，其考核程序準用第二項第一款及前項規定。\n直轄市、縣（市）主管機關、鄉（鎮、市）公所、直轄市山地原住民區公所、幼兒園或學校，就契約進用人員之年終考核結果，應以書面通知受考核人員。受考核人員對考核結果不服者，得於收受考核通知書之次日起三十日內，敘明理由向直轄市、縣（市）主管機關陳情；逾期者，不予受理。\n直轄市、縣（市）主管機關為處理前項所定陳情事項，應設處理小組。\n前二項規定，自中華民國一百十四年八月一日施行。"},{"no":"第21條","text":"依本辦法辦理甄選、考評、遷調及考核之人員，應確實保密，並遵守行政程序法有關利益迴避之規定。\n幼兒園或學校辦理甄選作業者，其甄選委員、考評人員如已知為參加甄選者之實習輔導教師時，應自行迴避，且不得擔任閱卷、評分工作。"},{"no":"第22條","text":"直轄市、縣（市）主管機關得依本辦法規定，訂定補充規定。"},{"no":"第23條","text":"本辦法除另定施行日期者外，自發布日施行。"}],"tags":["約用","契約進用","教保員","契約人力"],"note":"公立幼兒園契約進用人員（教保員等）之進用、考核及待遇——教育體系「契約進用人員」範例（補充蒐集）。","attachments":[{"FileName":"附表：公立幼兒園契約進用人員薪資支給基準表.PDF","FileURL":"https://law.moj.gov.tw/LawClass/LawGetFile.ashx?FileId=0000381982"}]},{"id":"B01","name":"公務人員任用法","pcode":"S0020001","level":"法律","authority":"銓敘部","category":"考試＞銓敘部＞任用目","modified_date":"2025-08-01","history":[{"date":"1949-01-01","summary":"中華民國三十八年一月一日總統令公布施行"},{"date":"1954-01-09","summary":"中華民國四十三年一月九日總統令公布同日施行"},{"date":"1962-09-01","summary":"中華民國五十一年九月一日總統令修正公布同日施行"},{"date":"1968-12-18","summary":"中華民國五十七年十二月十八日總統令修正公布第 4、6、8、9 條條文；並刪除第 22 條條文，其餘依次遞次"},{"date":"1980-12-03","summary":"中華民國六十九年十二月三日總統令公布第 6、7 條條文；並增訂第 15-1 條條文"},{"date":"1986-04-21","summary":"中華民國七十五年四月二十一日總統令制定公布全文 40 條"},{"date":"1990-12-28","summary":"中華民國七十九年十二月二十八日總統（79）華總（一）義字第 7434號令修正公布第 13、17 條；並增訂第 18-1 條條文"},{"date":"1995-01-18","summary":"中華民國八十四年一月十八日總統（84）華總（一）義字第 0254 號令修正公布第 13、16 條條文"},{"date":"1995-01-28","summary":"中華民國八十四年一月二十八日總統（84）華總（一）義字第 0643 號令修正公布第 28 條條文"},{"date":"1996-11-14","summary":"中華民國八十五年十一月十四日總統（85）華總（一）義字第 8500267540 號令修正公布第 6、10、12、13、16～18、22、24、25、28、33、36～38 條條文；並增訂第 26-1、28-1 條條文"},{"date":"2002-01-29","summary":"中華民國九十一年一月二十九日總統（91）華總一義字第 09100017050 號令修正公布第 4、6、9～11、13、17、18、18-1、20、22、26-1、28、32、33、35、40 條條文；刪除第 19 條條文；並增訂第 11-1、33-1 條條文"},{"date":"2005-11-30","summary":"中華民國九十四年十一月三十日總統華總一義字第 09400192891 號令修正公布第 17 條條文"},{"date":"2007-03-21","summary":"中華民國九十六年三月二十一日總統華總一義字第 09600034541 號令修正公布第 18、26-1 條條文"},{"date":"2008-01-16","summary":"中華民國九十七年一月十六日總統華總一義字第 09700005011 號令修正公布第 6、7、10、12、13、17、18、20、26-1、28、30 條條文；並增訂第 13-1、24-1 條條文"},{"date":"2010-01-06","summary":"中華民國九十九年一月六日總統華總一義字第 09800326941 號令修正公布第 28、40 條條文；並自九十八年十一月二十三日施行"},{"date":"2010-07-28","summary":"中華民國九十九年七月二十八日總統華總一義字第 09900189121 號令修正公布第 40 條條文；刪除第 29 條條文；依第 40 條規定：第29 條條文自一百年一月一日施行"},{"date":"2013-01-23","summary":"中華民國一百零二年一月二十三日總統華總一義字第 10200012391號令修正公布第 28 條條文"},{"date":"2015-06-17","summary":"中華民國一百零四年六月十七日總統華總一義字第 10400070711 號令修正公布第 36 條條文；並增訂第 36-1 條條文"},{"date":"2019-04-03","summary":"中華民國一百零八年四月三日總統華總一義字第 10800034141 號令修正公布第 25、26-1、28、35 條條文"},{"date":"2022-05-25","summary":"中華民國一百十一年五月二十五日總統華總一義字第 11100043821號令修正公布第 6、10、17、20、26-1、28、28-1、33-1 條條文；並刪除第 12 條條文"},{"date":"2023-02-15","summary":"中華民國一百十二年二月十五日總統華總一義字第 11200010671 號令修正公布第 22 條條文"},{"date":"2025-08-01","summary":"中華民國一百十四年八月一日總統華總一義字第 11400077471 號令修正公布第 36-1 條條文"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=S0020001","articles":[{"no":"第1條","text":"公務人員之任用，依本法行之。"},{"no":"第2條","text":"公務人員之任用，應本專才、專業、適才、適所之旨，初任與升調並重，為人與事之適切配合。"},{"no":"第3條","text":"本法所用名詞意義如左：\n一、官等：係任命層次及所需基本資格條件範圍之區分。\n二、職等：係職責程度及所需資格條件之區分。\n三、職務：係分配同一職稱人員所擔任之工作及責任。\n四、職系：係包括工作性質及所需學識相似之職務。\n五、職組：係包括工作性質相近之職系。\n六、職等標準：係敘述每一職等之工作繁、簡、難、易，責任輕、重及所需資格條件程度之文書。\n七、職務說明書：係說明每一職務之工作性質及責任之文書。\n八、職系說明書：係說明每一職系工作性質之文書。\n九、職務列等表：係將各種職務，按其職責程度依序列入適當職等之文書。"},{"no":"第4條","text":"各機關任用公務人員，應注意其品德及對國家之忠誠，其學識、才能、經驗及體格，應與擬任職務之種類職責相當。如係主管職務，並應注意其領導能力。\n前項人員之品德及忠誠，各機關應於任用前辦理查核。必要時，得洽請有關機關協助辦理。其涉及國家安全或重大利益者，得辦理特殊查核；有關特殊查核之權責機關、適用對象、規範內涵、辦理方式及救濟程序，由行政院會同考試院另定辦法行之。\n各機關辦理前項各種查核時，應將查核結果通知當事人，於當事人有不利情形時，應許其陳述意見及申辯。"},{"no":"第5條","text":"公務人員依官等及職等任用之。\n官等分委任、薦任、簡任。\n職等分第一至第十四職等，以第十四職等為最高職等。\n委任為第一至第五職等；薦任為第六至第九職等；簡任為第十至第十四職等。"},{"no":"第6條","text":"各機關組織法規所定之職務，應就其工作職責及所需資格，依職等標準列入職務列等表。必要時，一職務得列二個至三個職等。\n前項職等標準及職務列等表，依職責程度、業務性質及機關層次，由考試院定之。必要時，得由銓敘部會商相關機關後擬訂，報請考試院核定。\n各機關組織除以法律定其職稱、官等、職等及員額者外，應依其業務性質就其適用之職務列等表選置職稱，並妥適配置各官等、職等職務，訂定編制表，函送考試院核備。但主管機關因業務需要或情形特殊，得合併所屬同層級類別相同機關，報經考試院同意，訂定共用編制表。\n前項職稱及官等、職等員額配置準則，由考試院會同行政院定之。\n各機關組織法律原定各職務之官等、職等與中華民國八十五年一月考試院平衡中央與地方薦任第八職等以下公務人員職務列等通案修正之職務列等表不一致時，暫先適用該職務列等表之規定。但各機關組織法律於本條文修正施行後制定或修正者，仍依組織法律之規定。"},{"no":"第7條","text":"各機關對組織法規所定之職務，應賦予一定範圍之工作項目、適當之工作量及明確之工作權責，並訂定職務說明書，以為該職務人員工作指派及考核之依據。職務內容變動時，應即配合修訂職務說明書。\n前項職務各機關應每年或間年進行職務普查。"},{"no":"第8條","text":"各機關組織法規所定之職務，應依職系說明書歸入適當之職系，列表送銓敘部核備。"},{"no":"第9條","text":"公務人員之任用，應具有左列資格之一：\n一、依法考試及格。\n二、依法銓敘合格。\n三、依法升等合格。\n特殊性質職務人員之任用，除應具有前項資格外，如法律另有其他特別遴用規定者，並應從其規定。\n初任各職務人員，應具有擬任職務所列職等之任用資格；未具擬任職務職等任用資格者，在同官等高二職等範圍內得予權理。權理人員得隨時調任與其所具職等資格相當性質相近之職務。"},{"no":"第10條","text":"各機關初任各職等人員，除法律別有規定外，應由分發機關或申請舉辦考試機關就公務人員各等級考試正額錄取，依序分配訓練，經訓練期滿成績及格人員分發任用。如可資分配之正額錄取人員已分配完畢，由分發機關或申請舉辦考試機關就列入候用名冊之增額錄取人員按考試成績定期依序分配訓練，經訓練期滿成績及格後予以任用。\n已無前項考試錄取人員可資分配時，得經分發機關同意，由各機關自行遴用具任用資格之合格人員。\n第一項分配訓練、分發任用之程序、辦理方式、限制及有關事項之辦法，由考試院會同行政院定之。"},{"no":"第11條","text":"各機關辦理機要職務之人員，得不受第九條任用資格之限制。\n前項人員，機關長官得隨時免職。機關長官離職時應同時離職。"},{"no":"第11-1條","text":"各機關辦理進用機要人員時，應注意其公平性、正當性及其條件與所任職務間之適當性。\n各機關機要人員進用時，其員額、所任職務範圍及各職務應具之條件等規範，由考試院定之。"},{"no":"第12條","text":"（刪除）"},{"no":"第13條","text":"考試及格人員之任用，依下列規定：\n一、高等考試之一級考試或特種考試之一等考試及格者，取得薦任第九職等任用資格。\n二、高等考試之二級考試或特種考試之二等考試及格者，取得薦任第七職等任用資格。\n三、高等考試之三級考試或特種考試之三等考試及格者，取得薦任第六職等任用資格。\n四、普通考試或特種考試之四等考試及格者，取得委任第三職等任用資格。\n五、初等考試或特種考試之五等考試及格者，取得委任第一職等任用資格。\n中華民國八十五年一月十七日公務人員考試法修正施行前，考試及格人員之任用，依下列規定：\n一、特種考試之甲等考試及格者，取得簡任第十職等任用資格；初任人員於三年內，不得擔任簡任主管職務。\n二、高等考試或特種考試之乙等考試及格者，取得薦任第六職等任用資格。高等考試按學歷分一、二級考試者，其及格人員分別取得薦任第七職等、薦任第六職等任用資格。\n三、普通考試或特種考試之丙等考試及格者，取得委任第三職等任用資格。\n四、特種考試之丁等考試及格者，取得委任第一職等任用資格。\n第一項第一款至第三款及第二項第一款、第二款各等級考試及格人員，無相當職等職務可資任用時，得先以低一職等任用。\n第一項及第二項各等級考試職系及格者，取得該職系之任用資格。\n第一項及第二項各等級考試及格人員，得予任用之機關及職系等範圍，依各該考試及任用法規之限制行之。"},{"no":"第13-1條","text":"在本法施行前經依法考試及格或依法銓敘合格實授者，取得與擬任職務性質相近、程度相當之任用資格。\n前項依法考試及格人員考試類科適用職系，由銓敘部會同考選部定之。\n依公務人員考試法規辦理之考試，其考試類科未列明職系者，依前項規定認定其考試類科適用職系。"},{"no":"第14條","text":"職系、職組及職系說明書，由考試院定之。"},{"no":"第15條","text":"升官等考試及格人員之任用，依左列規定：\n一、雇員升委任考試及格者，取得委任第一職等任用資格。\n二、委任升薦任考試及格者，取得薦任第六職等任用資格。\n三、薦任升簡任考試及格者，取得簡任第十職等任用資格。"},{"no":"第16條","text":"高等考試或相當高等考試以上之特種考試及格人員，曾任行政機關人員、公立學校教育人員或公營事業人員服務成績優良之年資，除依法令限制不得轉調者外，於相互轉任性質程度相當職務時，得依規定採計提敘官、職等級；其辦法由考試院定之。"},{"no":"第17條","text":"公務人員官等之晉升，應經升官等考試及格或晉升官等訓練合格。\n經銓敘部銓敘審定合格實授現任薦任第九職等職務人員，具有下列資格之一，且其以該職等職務辦理之年終考績最近三年二年列甲等、一年列乙等以上，並已晉敘至薦任第九職等本俸最高級後，再經晉升簡任官等訓練合格者，取得升任簡任第十職等任用資格：\n一、經高等考試、相當高等考試之特種考試或公務人員薦任升官等考試、薦任升等考試或於本法施行前經分類職位第六職等至第九職等考試或分類職位第六職等升等考試及格，並任合格實授薦任第九職等職務滿三年。\n二、經大學或獨立學院以上學校畢業，並任合格實授薦任第九職等職務滿六年。\n前項公務人員如有特殊情形或係駐外人員，報經主管機關核准，得先予調派簡任職務，並於一年內或回國服務後一年內補訓合格，不受應先經升官等訓練，始取得簡任任用資格之限制。\n前項應予補訓人員，如未依規定補訓或補訓成績不合格，應予撤銷簡任任用資格，並回任薦任職務，不適用第十八條第一項第二款之規定，且均不得再依前項規定調派簡任職務。\n薦任第九職等職務人員經參加晉升簡任官等訓練不合格或廢止受訓資格，須至第九項辦法所定得再參加該訓練之年度時，始得依第三項規定調派簡任職務。\n經銓敘部銓敘審定合格實授現任委任第五職等職務人員，具有下列資格之一，且其以該職等職務辦理之年終考績最近三年二年列甲等、一年列乙等以上，並已晉敘至委任第五職等本俸最高級後，再經晉升薦任官等訓練合格者，取得升任薦任第六職等任用資格：\n一、經普通考試、相當普通考試之特種考試或相當委任第三職等以上之銓定資格考試或於本法施行前經分類職位第三職等至第五職等考試及格，並任合格實授委任第五職等職務滿三年。\n二、經高級中等學校畢業，並任合格實授委任第五職等職務滿十年，或專科學校畢業，並任合格實授委任第五職等職務滿八年，或大學、獨立學院以上學校畢業，並任合格實授委任第五職等職務滿六年。\n前項升任薦任官等人員，以擔任職務列等最高為薦任第七職等以下之職務為限。但具有碩士以上學位且最近五年薦任第七職等職務年終考績四年列甲等、一年列乙等以上者，得擔任職務列等最高為薦任第八職等以下職務。\n依公務人員考績法相關法規規定不得作為晉升職等及在同官等內調任低職等職務仍以原職等任用之考績、年資，均不得作為第二項及第六項規定之考績、年資。\n第二項及第六項晉升官等訓練期間、實施方式、受訓資格、名額分配與遴選、成績考核、延訓、停訓、免訓、廢止受訓資格、保留受訓資格、訓練費用及有關事項之辦法，由考試院定之。"},{"no":"第18條","text":"現職公務人員調任，依下列規定：\n一、簡任第十二職等以上人員，在各職系之職務間得予調任；其餘各職等人員在同職組各職系及曾經銓敘審定有案職系之職務間得予調任。\n二、經依法任用人員，除自願者外，不得調任低一官等之職務。自願調任低官等人員，以調任官等之最高職等任用。\n三、在同官等內調任低職等職務，除自願者外，以調任低一職等之職務為限，均仍以原職等任用，且機關首長及副首長不得調任本機關同職務列等以外之其他職務，主管人員不得調任本單位之副主管或非主管，副主管人員不得調任本單位之非主管。但有特殊情形，報經總統府、主管院或國家安全會議核准者，不在此限。\n前項人員之調任，必要時，得就其考試、學歷、經歷或訓練等認定其職系專長，並得依其職系專長調任。\n考試及格人員得予調任之機關及職系等範圍，依各該考試及任用法規之限制行之。\n現職公務人員調任時，其職系專長認定標準、再調任限制及有關事項之辦法，由考試院定之。"},{"no":"第18-1條","text":"各機關職務，依職務列等表規定列二個或三個職等者，初任該職務人員應自所列最低職等任用。但未具擬任職務最低職等任用資格者，依第九條第三項規定辦理；已具較高職等任用資格者，仍以敘至該職務所列最高職等為限。\n調任人員，依第十八條第一項第二款及第三款規定辦理。\n再任人員所具任用資格高於職務列等表所列該職務最低職等時，依職務列等表所列該職務所跨範圍內原職等任用。但以至所跨最高職等為限。"},{"no":"第19條","text":"（刪除）"},{"no":"第20條","text":"初任各官等人員，未具與擬任職務職責程度相當或低一職等之經驗六個月以上者，應先予試用六個月，並由各機關指派專人負責指導。試用期滿成績及格，予以實授；試用期滿成績不及格，予以解職。\n試用人員於試用期間有下列情事之一者，應為試用成績不及格：\n一、有公務人員考績法相關法規所定年終考績得考列丁等情形之一。\n二、有公務人員考績法相關法規所定一次記一大過以上情形之一。\n三、平時考核獎懲互相抵銷後，累積達一大過以上。\n四、曠職繼續達二日或累積達三日。\n五、其他不適任情形有具體事實。\n前項第五款所定不適任情形，應就其工作表現、忠誠守法、品行態度、發展潛能、體能狀況等項目予以考核，並將其具體事實詳實記載。\n試用人員於試用期滿時，由主管人員考核其成績，經機關首長核定後，依送審程序，送銓敘部銓敘審定；其試用成績不及格者，於機關首長核定前，應先送考績委員會審查。\n考績委員會對於試用成績不及格案件有疑義時，得調閱有關平時試用成績紀錄及案卷，或查詢有關人員。試用成績不及格人員得向考績委員會陳述意見及申辯。\n試用成績不及格人員，自機關首長核定之日起解職，並自處分確定之日起執行，未確定前，應先行停職。\n試用人員不得充任各級主管職務。\n試用人員於試用期間不得調任其他職系職務。"},{"no":"第21條","text":"除法律另有規定外，各機關不得指派未具第九條資格之人員代理或兼任應具同條資格之職務。"},{"no":"第22條","text":"各機關不得任用其他機關人員。如業務需要時，得指名商調之。但指名商調考試及格人員時，仍應受第十三條第五項及第十八條第三項規定之限制。\n高等考試各等級考試、普通考試、初等考試、特種考試地方政府公務人員考試、公務人員特種考試身心障礙人員考試及公務人員特種考試原住民族考試（以下簡稱原住民族特種考試）及格，依各該考試法規受有轉調機關限制人員，同時具有下列各款規定情形者，為親自養育三足歲以下子女，得於限制轉調期間內，調任至該子女實際居住地之直轄市或縣（市）之其他機關服務，不受原轉調機關範圍之限制，並以調任一次為限：\n一、因現職機關所在地與三足歲以下子女實際居住地未在同一直轄市、縣（市），有證明文件。\n二、實際任職達公務人員考試法所定限制轉調期間三分之一以上。\n各機關依前項規定商調公務人員前，應就其子女年齡及實際居住地查明符合規定後，始得辦理指名商調。原服務機關就該指名商調應優先考量。\n依第二項規定調任之人員於各該考試法規所定原限制轉調期間內再轉調時，以調任至原指名商調機關之主管機關及其所屬機關、原考試法規得任用之機關為限。"},{"no":"第23條","text":"各機關現職人員，在本法施行前，經依其他法律規定取得任用資格者，或擔任非臨時性職務之派用人員，具有任用資格者，予以改任；其改任辦法，由考試院定之。\n前項人員，原敘等級較其改任後之職等為高者，其與原敘等級相當職等之任用資格，仍予保留，俟將來調任相當職等之職務時，再予回復。"},{"no":"第24條","text":"各機關擬任公務人員，經依職權規定先派代理，限於實際代理之日起三個月內送請銓敘部銓敘審定。但確有特殊情形未能依限送審者，應報經銓敘部核准延長，其期限除另有規定者從其規定外，最多再延長以二個月為限，經銓敘審定不合格者，應即停止其代理。"},{"no":"第24-1條","text":"各機關主管之人事人員對於試用及擬任人員之送審，應負責查催，並主動協助於前條所定期限內送銓敘部銓敘審定。逾限不送審者，各該機關得予停止代理。試用及擬任人員依限送審並經銓敘審定者，自其實際到職或代理之日起算試用期間及任職年資，未依限送審而可歸責於當事人者，自各該機關送審之日起算其試用期間及任職年資。如因人事人員疏誤者，各機關應查明責任予以懲處，並送銓敘部備查。\n公務人員經依前項規定程序銓敘審定後，如有不服，得依公務人員保障法提起救濟；如有顯然錯誤，或有發生新事實、發現新證據等行政程序再開事由，得依行政程序法相關規定辦理。"},{"no":"第25條","text":"各機關初任簡任、薦任、委任官等公務人員，經銓敘部銓敘審定合格後，呈請總統任命。"},{"no":"第26條","text":"各機關長官對於配偶及三親等以內血親、姻親，不得在本機關任用，或任用為直接隸屬機關之長官。對於本機關各級主管長官之配偶及三親等以內血親、姻親，在其主管單位中應迴避任用。\n應迴避人員，在各該長官接任以前任用者，不受前項之限制。"},{"no":"第26-1條","text":"各機關首長於下列期間，不得任用或遷調人員：\n一、自退休案核定之日起至離職日止。\n二、自免職、調職或新職任命令發布日起至離職日止。\n三、民選首長，自次屆同一選舉候選人名單公告之日起至當選人名單公告之日止。但競選連任未當選或未再競選連任者，至離職日止。\n四、民意機關首長，自次屆同一民意代表選舉候選人名單公告之日起至其首長當選人宣誓就職止。\n五、參加公職選舉者，自選舉候選人名單公告之日起至離職日止。但未當選者，至當選人名單公告之日止。\n六、憲法或法規未定有任期之中央各級機關政務首長，於總統競選連任未當選或未再競選連任時，自次屆該項選舉當選人名單公告之日起至當選人宣誓就職止。地方政府所屬機關政務首長及其同層級機關首長，於民選首長競選連任未當選或未再競選連任時，亦同。\n七、民選首長及民意機關首長受罷免者，自罷免案宣告成立之日起至罷免投票結果公告之日止。\n八、自辭職書提出、停職令發布或受免除職務、撤職、休職懲戒處分判決確定之日起至離職日止。\n九、其他定有任期者，自任期屆滿之日前一個月起至離職日止。但連任者，至確定連任之日止。\n駐外人員之任用或遷調，必要時，得不受前項規定之限制。\n考試及格人員分發任用，不受第一項規定之限制。\n第一項規定期間內，機關出缺之職務，得依規定由現職人員代理。"},{"no":"第27條","text":"已屆限齡退休人員，各機關不得進用。"},{"no":"第28條","text":"有下列情事之一者，不得任用為公務人員：\n一、未具或喪失中華民國國籍。\n二、具中華民國國籍兼具外國國籍。但本法或其他法律另有規定者，不在此限。\n三、動員戡亂時期終止後，曾犯內亂罪、外患罪，經有罪判決確定或通緝有案尚未結案。\n四、曾服公務有貪污行為，經有罪判決確定或通緝有案尚未結案。\n五、犯前二款以外之罪，判處有期徒刑以上之刑確定，尚未執行或執行未畢。但受緩刑宣告者，不在此限。\n六、曾受免除職務懲戒處分。\n七、依法停止任用。\n八、褫奪公權尚未復權。\n九、經原住民族特種考試及格，而未具或喪失原住民身分。但具有其他考試及格資格者，得以該考試及格資格任用之。\n十、依其他法律規定不得任用為公務人員。\n十一、受監護或輔助宣告，尚未撤銷。\n前項第二款具中華民國國籍兼具外國國籍者，無法完成喪失外國國籍及取得證明文件，係因該外國國家法令致不得放棄國籍，且已於到職前依規定辦理放棄外國國籍，並出具書面佐證文件經外交部查證屬實，仍得任用為公務人員，並以擔任不涉及國家安全或國家機密之機關及職務為限。\n前項涉及國家安全或國家機密之機關及職務，於本法施行細則定之。\n公務人員於任用後，有第一項第一款至第十款情事之一，或於任用時，有第一項第二款情事，業依國籍法第二十條第四項規定於到職前辦理放棄外國國籍，而未於到職之日起一年內完成喪失該國國籍及取得證明文件，且無第二項情形者，應予免職；有第十一款情事者，應依規定辦理退休或資遣。任用後發現其於任用時有第一項各款情事之一者，應撤銷任用。\n前項人員任職期間之職務行為，不失其效力；業已依規定支付之俸給及其他給付，不予追還。但經依第一項第二款情事撤銷任用者，應予追還。"},{"no":"第28-1條","text":"公務人員因育嬰、侍親、進修及其他情事，經機關核准，得留職停薪，並於原因消失後回職復薪。\n公務人員留職停薪辦法，由考試院會同行政院定之。"},{"no":"第29條","text":"（刪除）"},{"no":"第30條","text":"各機關任用人員，違反本法規定者，銓敘部應通知該機關改正，並副知審計機關，不准核銷其俸給；情節重大者，應報請考試院逕予降免，並得核轉監察院依法處理。"},{"no":"第31條","text":"依法應適用本法之機關，其組織法規與本法牴觸者，應適用本法。"},{"no":"第32條","text":"司法人員、審計人員、主計人員、關務人員、外交領事人員及警察人員之任用，均另以法律定之。但有關任用資格之規定，不得與本法牴觸。"},{"no":"第33條","text":"教育人員、醫事人員、交通事業人員及公營事業人員之任用，均另以法律定之。"},{"no":"第33-1條","text":"中華民國八十年十一月一日公布之技術人員任用條例（以下簡稱該條例）廢止後，原依該條例銓敘審定有案之人員，除適用醫事人員人事條例規定辦理改任者外，依下列規定辦理：\n一、原依該條例第五條第一項規定銓敘審定有案之人員，改依本法任用。\n二、原依該條例第五條第三項規定銓敘審定有案之人員，仍繼續任用。但不得轉調其他職系及公立醫療機構以外之醫療行政職務。\n三、原依該條例第十條規定銓敘審定以技術人員任用之人員，仍繼續以技術人員任用，並得在同官等範圍內晉升職等及調任技術職系職務；其官等之晉升，應經升官等考試及格。"},{"no":"第34條","text":"經高等考試、普通考試或特種考試及格之專門職業及技術人員轉任公務人員，另以法律定之。"},{"no":"第35條","text":"蒙藏邊區人員任用條例（以下簡稱蒙藏任用條例）廢止後，原依法銓敘審定以蒙藏邊區人員任用之現職人員，得適用原蒙藏任用條例繼續任用至退休或離職時為止。但以調任中央各機關為限。"},{"no":"第36條","text":"各機關以契約定期聘用之專業或技術人員，其聘用另以法律定之。"},{"no":"第36-1條","text":"派用人員派用條例（以下簡稱派用條例）廢止後，原依派用條例銓敘審定有案之現職人員，依下列規定辦理：\n一、臨時機關派用人員：\n（一）具所敘官等職等任用資格者，改依本法或原適用之任用法規任用。\n（二）未具所敘官等職等任用資格者：\n      1.於派用條例廢止之日起九年內，得適用原派用條例及其施行細則繼續派用。\n      2.派用條例廢止滿九年之翌日起，得分別於派用條例廢止滿九年之日任職隸屬之中央三級與所屬機關間，或隸屬之直轄市政府所屬一級機關與所屬機關間適用原派用條例及其施行細則繼續派用。\n二、臨時專任職務派用人員，於派用條例廢止之日起九年內，得適用原派用條例等相關規定繼續派用至派用期限屆滿時為止，並自派用條例廢止滿九年之翌日起，留任原職稱原官等之職務至派用期限屆滿時為止。派用期限屆滿不予延長時，應辦理退休或資遣。但機關基於業務需要，認有延長之必要，得酌予延長，每次不得逾三年。\n三、派用條例廢止前已由派用機關改制為任用機關，依各該組織法規留任或繼續派用之派用人員，仍依原有之組織法規辦理。\n第一項第一款所定臨時機關，應於派用條例廢止之日起三年內，修正組織法規為任用機關。\n派用條例廢止後，各機關組織法規與本條規定不符者，應依本條規定辦理。"},{"no":"第37條","text":"雇員管理規則，由考試院定之。\n前項規則適用至中華民國八十六年十二月三十一日止。期限屆滿仍在職之雇員，得繼續僱用至離職為止。\n本條文修正施行後，各機關不得新進雇員。"},{"no":"第38條","text":"本法除第二十六條、第二十六條之一及第二十八條規定外，於政務人員不適用之。"},{"no":"第39條","text":"本法施行細則，由考試院定之。"},{"no":"第40條","text":"本法施行日期，由考試院以命令定之。\n本法修正條文，自公布日施行。\n本法中華民國九十八年十二月十五日修正之條文，自九十八年十一月二十三日施行。\n本法中華民國九十九年七月十三日修正之第二十九條條文，自一百年一月一日施行。"}],"tags":["公務人員","任用"],"note":"第 36 條：各機關以契約定期聘用之專業或技術人員，其聘用另以法律定之（聘用條例之授權依據）；第 26 條之 1、第 28 條於約聘僱人員準用。"},{"id":"B02","name":"公務人員保障法","pcode":"S0120001","level":"法律","authority":"公務人員保障暨培訓委員會","category":"考試＞公務人員保障暨培訓委員會＞保障目","modified_date":"2025-07-09","history":[{"date":"1996-10-16","summary":"中華民國八十五年十月十六日總統（85）華總（一）義字第 8500249280 號令制定公布全文 35 條"},{"date":"2003-05-28","summary":"中華民國九十二年五月二十八日總統華總一義字第 09200100280 號令修正公布全文 104 條；並自公布日施行"},{"date":"2015-12-23","summary":"中華民國一百零四年十二月二十三日總統華總一義字第 10400149661號令修正公布第 76 條條文"},{"date":"2017-06-14","summary":"中華民國一百零六年六月十四日總統華總一義字第 10600080021 號令修正公布第 3、10、11、17、21、22、26、43、51、71、74、77、78、80、83、85～88、91、93～95、100～103 條條文；並增訂第 9-1、11-1、11-2、12-1、24-1 條條文"},{"date":"2022-06-22","summary":"中華民國一百十一年六月二十二日總統華總一義字第 11100050761 號令修正公布第 23、104 條條文；依第 104 條規定：第 23 條施行日期，由考試院定之中華民國一百十一年七月二十九日考試院考臺組一字第 11100054981號令發布定自一百十二年一月一日施行"},{"date":"2025-07-09","summary":"中華民國一百十四年七月九日總統華總一義字第 11400068141 號令修正公布第 19、21、102、104 條條文；增訂第 19-1、19-2 條條文；依第 104 條規定：自公布後六個月施行"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=S0120001","articles":[{"no":"第1條","text":"為保障公務人員之權益，特制定本法。本法未規定者，適用其他有關法律之規定。","title":"第 一 章 總則"},{"no":"第2條","text":"公務人員身分、官職等級、俸給、工作條件、管理措施等有關權益之保障，適用本法之規定。","title":"第 一 章 總則"},{"no":"第3條","text":"本法所稱公務人員，係指法定機關（構）及公立學校依公務人員任用法律任用之有給專任人員。","title":"第 一 章 總則"},{"no":"第4條","text":"公務人員權益之救濟，依本法所定復審、申訴、再申訴之程序行之。\n公務人員提起之復審、再申訴事件（以下簡稱保障事件），由公務人員保障暨培訓委員會（以下簡稱保訓會）審議決定。\n保障事件審議規則，由考試院定之。","title":"第 一 章 總則"},{"no":"第5條","text":"保訓會對於保障事件，於復審人、再申訴人表示不服之範圍內，不得為更不利於該公務人員之決定。","title":"第 一 章 總則"},{"no":"第6條","text":"各機關不得因公務人員依本法提起救濟而予不利之行政處分、不合理之管理措施或有關工作條件之處置。\n公務人員提起保障事件，經保訓會決定撤銷者，自決定書送達之次日起三年內，該公務人員經他機關依法指名商調時，服務機關不得拒絕。","title":"第 一 章 總則"},{"no":"第7條","text":"審理保障事件之人員有下列各款情形之一者，應自行迴避：\n一、與提起保障事件之公務人員有配偶、前配偶、四親等內血親、三親等內姻親、家長、家屬或曾有此關係者。\n二、曾參與該保障事件之行政處分、管理措施、有關工作條件之處置或申訴程序者。\n三、現為或曾為該保障事件當事人之代理人、輔佐人者。\n四、於該保障事件，曾為證人、鑑定人者。\n五、與該保障事件有法律上利害關係者。\n前項迴避，於協助辦理保障事件人員準用之。\n前二項人員明知應迴避而不迴避者，應依法移送懲戒。\n有關機關副首長兼任保訓會之委員者，不受第一項第二款迴避規定限制。但涉及本機關有關保障事件之決定，無表決權。\n復審人、再申訴人亦得備具書狀敘明理由向保訓會申請迴避。","title":"第 一 章 總則"},{"no":"第8條","text":"保障事件審理期間，如有查證之必要，經保訓會委員會議之決議得派員前往調閱相關文件及訪談有關人員；受調閱機關或受訪談人員應予必要之協助；受指派人員應將查證結果向保訓會委員會議提出報告。","title":"第 一 章 總則"},{"no":"第9條","text":"公務人員之身分應予保障，非依法律不得剝奪。基於身分之請求權，其保障亦同。","title":"第 二 章 實體保障"},{"no":"第9-1條","text":"公務人員非依法律，不得予以停職。\n公務人員於停職、休職或留職停薪期間，仍具公務人員身分。但不得執行職務。","title":"第 二 章 實體保障"},{"no":"第10條","text":"經依法停職之公務人員，於停職事由消滅後三個月內，得申請復職；服務機關或其上級機關，除法律另有規定者外，應許其復職，並自受理之日起三十日內通知其復職。\n依前項規定復職之公務人員，服務機關或其上級機關應回復原職務或與原職務職等相當或與其原敘職等俸級相當之其他職務；如仍無法回復職務時，應依公務人員任用法及公務人員俸給法有關調任之規定辦理。\n經依法停職之公務人員，於停職事由消滅後三個月內，未申請復職者，服務機關或其上級機關人事單位應負責查催；如仍未於接到查催通知之日起三十日內申請復職，除有不可歸責於該公務人員之事由外，視為辭職。","title":"第 二 章 實體保障"},{"no":"第11條","text":"受停職處分之公務人員，其停職處分經撤銷者，除得依法另為處理者外，其服務機關或其上級機關應予復職，並準用前條第二項之規定。\n前項之公務人員於復職報到前，仍視為停職。\n依第一項應予復職之公務人員，於接獲復職令後，應於三十日內報到，並於復職報到後，回復其應有之權益；其未於期限內報到者，除經核准延長或有不可歸責於該公務人員之事由外，視為辭職。","title":"第 二 章 實體保障"},{"no":"第11-1條","text":"留職停薪原因消滅後或期間屆滿，有關復職之事項，除法規另有規定者外，準用第十條之規定。","title":"第 二 章 實體保障"},{"no":"第11-2條","text":"經依法休職之公務人員，有關復職之事項，除法律另有規定者外，準用第十條之規定。","title":"第 二 章 實體保障"},{"no":"第12條","text":"公務人員因機關裁撤、組織變更或業務緊縮時，除法律另有規定者外，其具有考試及格或銓敘合格之留用人員，應由上級機關或承受其業務之機關辦理轉任或派職，必要時先予輔導、訓練。\n依前項規定轉任或派職時，除自願降低官等者外，其官等職等應與原任職務之官等職等相當，如無適當職缺致轉任或派職同官等內低職等職務者，應依公務人員任用法及公務人員俸給法有關調任之規定辦理。","title":"第 二 章 實體保障"},{"no":"第12-1條","text":"公務人員之辭職，應以書面為之。除有危害國家安全之虞或法律另有規定者外，服務機關或其上級機關不得拒絕之。\n服務機關或其上級機關應於收受辭職書之次日起三十日內為准駁之決定。逾期未為決定者，視為同意辭職，並以期滿之次日為生效日。但公務人員指定之離職日逾三十日者，以該日為生效日。","title":"第 二 章 實體保障"},{"no":"第13條","text":"公務人員經銓敘審定之官等職等應予保障，非依法律不得變更。","title":"第 二 章 實體保障"},{"no":"第14條","text":"公務人員經銓敘審定之俸級應予保障，非依法律不得降級或減俸。","title":"第 二 章 實體保障"},{"no":"第15條","text":"公務人員依其職務種類、性質與服務地區，所應得之法定加給，非依法令不得變更。","title":"第 二 章 實體保障"},{"no":"第16條","text":"公務人員之長官或主管對於公務人員不得作違法之工作指派，亦不得以強暴脅迫或其他不正當方法，使公務人員為非法之行為。","title":"第 二 章 實體保障"},{"no":"第17條","text":"公務人員對於長官監督範圍內所發之命令有服從義務，如認為該命令違法，應負報告之義務；該管長官如認其命令並未違法，而以書面署名下達時，公務人員即應服從；其因此所生之責任，由該長官負之。但其命令有違反刑事法律者，公務人員無服從之義務。\n前項情形，該管長官非以書面署名下達命令者，公務人員得請求其以書面署名為之，該管長官拒絕時，視為撤回其命令。","title":"第 二 章 實體保障"},{"no":"第18條","text":"各機關應提供公務人員執行職務必要之機具設備及良好工作環境。","title":"第 二 章 實體保障"},{"no":"第19條","text":"公務人員執行職務之安全應予保障。各機關對於公務人員之執行職務，應提供安全及衛生之防護措施，並使公務人員免於遭受職場霸凌等行為。有關辦法，由考試院會同行政院定之。\n前項所稱職場霸凌，指本機關人員於職務上假借權勢或機會，逾越職務上必要合理範圍，持續以威脅、冒犯、歧視、侮辱、孤立言行或其他方式，造成敵意性、脅迫性或冒犯性之不友善工作環境，致公務人員身心健康遭受危害。但情節重大者，不以持續發生為必要。\n公務人員遭受職場霸凌，得依第一項所定辦法提起申訴，其提起申訴之期限，應依下列規定辦理：\n一、被申訴人屬非具權勢地位者，自職場霸凌行為終了時起，逾三年者，不予受理。\n二、被申訴人屬具權勢地位者，自職場霸凌行為終了時起，逾五年者，不予受理。","title":"第 二 章 實體保障"},{"no":"第19-1條","text":"各機關違反前條第一項所定辦法之規定，有下列情形之一者，其應負責人員，應按情節輕重，依公務員懲戒法、公務人員考績法或其他相關法規予以懲戒或懲處：\n一、對提出安全及衛生防護措施事項之建議者，或對提出職場霸凌申訴者，予以不利對待或不合理處置。\n二、知悉職場霸凌之情形，未採取具體有效措施。\n三、未提供符合規定之必要安全及衛生防護措施。\n前項第一款情形，處應負責人員新臺幣三萬元以上七十五萬元以下罰鍰，並得按次處罰。\n第一項第二款及第三款情形，經上級機關通知限期改善，或無上級機關經保訓會通知限期改善，屆期未改善者，處應負責人員新臺幣三萬元以上一百五十萬元以下罰鍰。\n第一項第三款情形，致生重大災害者，處應負責人員三年以下有期徒刑、拘役或科或併科新臺幣一百萬元以下罰金；致生死亡事故者，處七年以下有期徒刑、拘役或科或併科新臺幣二百萬元以下罰金。但如有不可歸責之事由，或應負責人員對災害之發生，已善盡防止義務者，不在此限。\n前項情形，涉及刑事責任者，機關應移送檢察機關。\n機關首長或一級單位主管人員經認定職場霸凌成立者，處新臺幣五萬元以上一百萬元以下罰鍰。\n第一項至第四項所稱應負責人員，係指機關首長或於該工作場所中，代表機關首長實際執行管理、指揮或監督公務人員執行職務之人。\n第四項所稱重大災害，指發生災害之罹災人數在三人以上者。","title":"第 二 章 實體保障"},{"no":"第19-2條","text":"前條第二項、第三項及第六項之罰鍰，由保訓會裁處之。裁處權時效因三年期間經過而消滅。\n前條第四項就重大災害或死亡事故因果關係之認定及裁處，由保訓會延聘學者專家五人至七人，組成安全衛生事故審議小組審認之。任一性別比例不得少於三分之一。有關因果關係之審認與裁處原則、審議程序及組成等事項，由保訓會定之。\n保訓會知悉各機關安全及衛生防護措施或防免職場霸凌行為有不當或違法時，得主動實施檢查，或通知其上級機關實施檢查。其有不合規定者，應告知違反法令條款，並通知屆期改善；屆期未改善，按違失情節輕重，依相關規定處理。\n職場霸凌申訴受理機關應將前條第六項職場霸凌成立與否之決定及調查事證函送保訓會。該決定之調查程序與人員組成，有未符第十九條第一項所定辦法之規定者，保訓會得依職權要求機關重行調查。\n前條第二項之裁處權時效，自公務人員就機關因其提出職場霸凌申訴或安全及衛生建議，所為不利對待或不合理處置，提起救濟之日起算。前條第三項之裁處權時效，自上級機關就機關屆期未改善情形，通報保訓會之日起算。前條第四項裁處權時效，自機關向保訓會通報重大災害或死亡事故之日起算。前條第六項裁處權時效，自職場霸凌申訴受理機關將職場霸凌成立與否之決定及調查事證，函報保訓會之日起算；如經保訓會要求重行調查，應自職場霸凌申訴受理機關重行調查後，再函報保訓會之日起算。\n不服保訓會所為第一項裁處處分，有關其權益之救濟，依訴願法之規定行之。","title":"第 二 章 實體保障"},{"no":"第20條","text":"公務人員執行職務時，現場長官認已發生危害或明顯有發生危害之虞者，得視情況暫時停止執行。","title":"第 二 章 實體保障"},{"no":"第21條","text":"公務人員因機關未提供安全及衛生防護措施或提供之安全及衛生防護措施有瑕疵，致其生命、身心健康受損時，得依國家賠償法請求賠償。\n公務人員執行職務時，發生意外致受傷、失能或死亡者，應發給慰問金。但該公務人員有故意或重大過失情事者，得不發或減發慰問金。\n前項慰問金發給辦法，由考試院會同行政院定之。","title":"第 二 章 實體保障"},{"no":"第22條","text":"公務人員依法執行職務涉訟時，服務機關應輔助其延聘律師為其辯護及提供法律上之協助。\n前項情形，其涉訟係因公務人員之故意或重大過失所致者，應不予輔助；如服務機關已支付涉訟輔助費用者，應予追還。\n第一項之涉訟輔助辦法，由考試院會同行政院定之。","title":"第 二 章 實體保障"},{"no":"第23條","text":"公務人員經指派於法定辦公時數以外執行職務者為加班，服務機關應給予加班費、補休假。但因機關預算之限制或必要範圍內之業務需要，致無法給予加班費、補休假，應給予公務人員考績（成、核）法規所定平時考核之獎勵。\n實施輪班、輪休制度之業務性質特殊機關對所屬公務人員之加班補償，應考量加班之性質、強度、密度、時段等因素，以符合一般社會通念之合理執行職務對價及保障公務人員健康權之原則下，予以適當評價，並依加班補償評價之級距與下限，訂定換算基準，核給加班費、補休假。各機關對所屬公務人員待命時數之加班補償，亦同。\n公務人員補休假應於機關規定之補休假期限內補休完畢，補休假期限至多為二年。遷調人員於原服務機關未休畢之補休假，得於原補休假期限內至新任職機關續行補休。\n機關確實因必要範圍內之業務需要，致公務人員加班時數無法於補休假期限內補休完畢時，應計發加班費。但因機關預算之限制，致無法給予加班費，除公務人員離職或已亡故者，仍計發加班費外，應給予第一項之獎勵。公務人員遷調後於期限內未休畢之加班時數，亦同。\n加班費支給基準、第二項加班補償評價換算基準之級距與下限、第三項補休假期限及其他相關事項，由行政院定之。各主管機關得在行政院訂定範圍內，依其業務特性，訂定加班補償評價換算基準。","title":"第 二 章 實體保障"},{"no":"第24條","text":"公務人員執行職務墊支之必要費用，得請求服務機關償還之。","title":"第 二 章 實體保障"},{"no":"第24-1條","text":"下列公務人員之公法上財產請求權，其消滅時效期間依本法行之：\n一、因十年間不行使而消滅者：\n（一）執行職務時，發生意外致受傷、失能或死亡應發給之慰問金。\n（二）依法執行職務涉訟輔助之費用。\n二、因二年間不行使而消滅者：\n（一）經服務機關核准實施公務人員一般健康檢查之費用。\n（二）經服務機關核准之加班費。\n（三）執行職務墊支之必要費用。","title":"第 二 章 實體保障"},{"no":"第25條","text":"公務人員對於服務機關或人事主管機關（以下均簡稱原處分機關）所為之行政處分，認為違法或顯然不當，致損害其權利或利益者，得依本法提起復審。非現職公務人員基於其原公務人員身分之請求權遭受侵害時，亦同。\n公務人員已亡故者，其遺族基於該公務人員身分所生之公法上財產請求權遭受侵害時，亦得依本法規定提起復審。","title":"第 三 章 復審程序"},{"no":"第26條","text":"公務人員因原處分機關對其依法申請之案件，於法定期間內應作為而不作為，或予以駁回，認為損害其權利或利益者，得提起請求該機關為行政處分或應為特定內容之行政處分之復審。\n前項期間，法令未明定者，自機關受理申請之日起為二個月。","title":"第 三 章 復審程序"},{"no":"第27條","text":"原處分機關告知之復審期間有錯誤時，應由該機關以通知更正之，並自通知送達之次日起算法定期間。\n如未告知復審期間，或告知錯誤未通知更正，致受處分人遲誤者，如於處分書送達之次日起一年內提起復審，視為復審期間內所為。","title":"第 三 章 復審程序"},{"no":"第28條","text":"原處分機關之認定，以實施行政處分時之名義為準。但上級機關本於法定職權所為行政處分，交由下級機關執行者，以該上級機關為原處分機關。","title":"第 三 章 復審程序"},{"no":"第29條","text":"原處分機關裁撤或改組，應以承受其業務之機關視為原處分機關。","title":"第 三 章 復審程序"},{"no":"第30條","text":"復審之提起，應自行政處分達到之次日起三十日內為之。\n前項期間，以原處分機關收受復審書之日期為準。\n復審人誤向原處分機關以外機關提起復審者，以該機關收受之日，視為提起復審之日。","title":"第 三 章 復審程序"},{"no":"第31條","text":"復審人因天災或其他不應歸責於己之事由，致遲誤前條之復審期間者，於其原因消滅後十日內，得以書面敘明理由向保訓會申請回復原狀。但遲誤復審期間已逾一年者，不得為之。\n申請回復原狀，應同時補行期間內應為之復審行為。","title":"第 三 章 復審程序"},{"no":"第32條","text":"復審人不在原處分機關所在地住居者，計算法定期間，應扣除在途期間。但有復審代理人住居原處分機關所在地，得為期間內應為之復審行為者，不在此限。\n前項扣除在途期間之辦法，由保訓會定之。","title":"第 三 章 復審程序"},{"no":"第33條","text":"期日期間，除本法另有規定外，準用行政程序法之規定。","title":"第 三 章 復審程序"},{"no":"第34條","text":"能獨立以法律行為負義務者，有復審能力。\n無復審能力人應由其法定代理人代為復審行為。\n關於復審之法定代理，依民法之規定。","title":"第 三 章 復審程序"},{"no":"第35條","text":"多數人對於同一原因事實之行政處分共同提起復審時，得選定三人以下之代表人；其未選定代表人者，保訓會得限期通知其選定代表人；逾期不選定者，保訓會得依職權指定之。","title":"第 三 章 復審程序"},{"no":"第36條","text":"代表人之選定、更換或增減，應提出文書證明並通知保訓會，始生效力。","title":"第 三 章 復審程序"},{"no":"第37條","text":"代表人經選定或指定後，由其代表全體復審人為復審行為。但撤回復審，非經全體復審人書面同意，不得為之。\n代表人有二人以上者，均得單獨代表共同復審人為復審行為。\n代表人之代表權不因其他共同復審人死亡、喪失復審能力或法定代理變更而消滅。","title":"第 三 章 復審程序"},{"no":"第38條","text":"復審人得委任熟諳法律或有專業知識之人為代理人，每一復審人委任者以不超過三人為限，並應於最初為復審代理行為時，向保訓會提出委任書。\n保訓會認為復審代理人不適當時，得禁止之，並以書面通知復審人。\n復審代理人之更換、增減或解除，非以書面通知保訓會，不生效力。\n復審委任之解除，由復審代理人提出者，自為解除意思表示之日起十五日內，仍應為維護復審人權利或利益之必要行為。","title":"第 三 章 復審程序"},{"no":"第39條","text":"復審代理人就其受委任之事件，得為一切復審行為。但撤回復審，非受特別委任不得為之。\n復審代理人有二人以上者，均得單獨代理復審人。\n違反前項規定而為委任者，其復審代理人仍得單獨代理。\n復審代理人事實上之陳述，經到場之復審人本人即時撤銷或更正者，不生效力。\n復審代理權不因復審人本人死亡、破產、喪失復審能力或法定代理變更而消滅。","title":"第 三 章 復審程序"},{"no":"第40條","text":"復審人或復審代理人經保訓會之許可，得於期日偕同輔佐人到場。\n保訓會認為必要時，亦得命復審人或復審代理人偕同輔佐人到場。\n前二項之輔佐人，保訓會認為不適當時，得廢止其許可或禁止其續為輔佐。\n輔佐人到場所為之陳述，復審人或復審代理人不即時撤銷或更正者，視為其所自為。","title":"第 三 章 復審程序"},{"no":"第41條","text":"復審事件之文書，保訓會應編為卷宗保存。\n保訓會審議復審事件，應指定人員製作審議紀錄附卷，並得以錄音或錄影輔助之；其經言詞辯論者，應另行製作辯論要旨，編為審議紀錄之附件。","title":"第 三 章 復審程序"},{"no":"第42條","text":"復審人或其代理人得向保訓會請求閱覽、抄錄、影
