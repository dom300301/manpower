公布第 976 條條文；並自公布日施行"},{"date":"2019-06-19","summary":"中華民國一百零八年六月十九日總統華總一義字第 10800060031 號令修正公布第 14 條條文；增訂第 1113-2～1113-10 條條文及第四編第四章第三節節名"},{"date":"2021-01-13","summary":"中華民國一百十年一月十三日總統華總一義字第 11000001891 號令修正公布第 12、13、973、980、1049、1077、1091、1127、1128 條條文；刪除第 981、990 條條文；並自一百十二年一月一日施行"},{"date":"2021-01-20","summary":"中華民國一百十年一月二十日總統華總一義字第 11000004851 號令修正公布第 205 條條文；並自公布後六個月施行中華民國一百十年一月二十日總統華總一義字第 11000004151 號令修正公布第 1030-1 條條文；並自公布日施行"},{"date":"2026-08-17","summary":"中華民國一百十五年八月十七日總統華總一義字第 11500076161 號令修正公布第 1223 條條文；並自公布六個月後施行"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=B0000001","articles":[{"no":"第482條","text":"稱僱傭者，謂當事人約定，一方於一定或不定之期限內為他方服勞務，他方給付報酬之契約。","title":"第 七 節 僱傭"},{"no":"第483條","text":"如依情形，非受報酬即不服勞務者，視為允與報酬。\n未定報酬額者，按照價目表所定給付之；無價目表者，按照習慣給付。","title":"第 七 節 僱傭"},{"no":"第483-1條","text":"受僱人服勞務，其生命、身體、健康有受危害之虞者，僱用人應按其情形為必要之預防。","title":"第 七 節 僱傭"},{"no":"第484條","text":"僱用人非經受僱人同意，不得將其勞務請求權讓與第三人，受僱人非經僱用人同意，不得使第三人代服勞務。\n當事人之一方違反前項規定時，他方得終止契約。","title":"第 七 節 僱傭"},{"no":"第485條","text":"受僱人明示或默示保證其有特種技能時，如無此種技能時，僱用人得終止契約。","title":"第 七 節 僱傭"},{"no":"第486條","text":"報酬應依約定之期限給付之；無約定者，依習慣；無約定亦無習慣者，依左列之規定：\n一、報酬分期計算者，應於每期屆滿時給付之。\n二、報酬非分期計算者，應於勞務完畢時給付之。","title":"第 七 節 僱傭"},{"no":"第487條","text":"僱用人受領勞務遲延者，受僱人無補服勞務之義務，仍得請求報酬。但受僱人因不服勞務所減省之費用，或轉向他處服勞務所取得，或故意怠於取得之利益，僱用人得由報酬額內扣除之。","title":"第 七 節 僱傭"},{"no":"第487-1條","text":"受僱人服勞務，因非可歸責於自己之事由，致受損害者，得向僱用人請求賠償。\n前項損害之發生，如別有應負責任之人時，僱用人對於該應負責者，有求償權。","title":"第 七 節 僱傭"},{"no":"第488條","text":"僱傭定有期限者，其僱傭關係，於期限屆滿時消滅。\n僱傭未定期限，亦不能依勞務之性質或目的定其期限者，各當事人得隨時終止契約。但有利於受僱人之習慣者，從其習慣。","title":"第 七 節 僱傭"},{"no":"第489條","text":"當事人之一方，遇有重大事由，其僱傭契約，縱定有期限，仍得於期限屆滿前終止之。\n前項事由，如因當事人一方之過失而生者，他方得向其請求損害賠償。","title":"第 七 節 僱傭"},{"no":"第490條","text":"稱承攬者，謂當事人約定，一方為他方完成一定之工作，他方俟工作完成，給付報酬之契約。\n約定由承攬人供給材料者，其材料之價額，推定為報酬之一部。","title":"第 八 節 承攬"},{"no":"第491條","text":"如依情形，非受報酬即不為完成其工作者，視為允與報酬。\n未定報酬額者，按照價目表所定給付之；無價目表者，按照習慣給付。","title":"第 八 節 承攬"},{"no":"第492條","text":"承攬人完成工作，應使其具備約定之品質及無減少或滅失價值或不適於通常或約定使用之瑕疵。","title":"第 八 節 承攬"},{"no":"第493條","text":"工作有瑕疵者，定作人得定相當期限，請求承攬人修補之。\n承攬人不於前項期限內修補者，定作人得自行修補，並得向承攬人請求償還修補必要之費用。\n如修補所需費用過鉅者，承攬人得拒絕修補，前項規定，不適用之。","title":"第 八 節 承攬"},{"no":"第494條","text":"承攬人不於前條第一項所定期限內修補瑕疵，或依前條第三項之規定拒絕修補或其瑕疵不能修補者，定作人得解除契約或請求減少報酬。但瑕疵非重要，或所承攬之工作為建築物或其他土地上之工作物者，定作人不得解除契約。","title":"第 八 節 承攬"},{"no":"第495條","text":"因可歸責於承攬人之事由，致工作發生瑕疵者，定作人除依前二條之規定，請求修補或解除契約，或請求減少報酬外，並得請求損害賠償。\n前項情形，所承攬之工作為建築物或其他土地上之工作物，而其瑕疵重大致不能達使用之目的者，定作人得解除契約。","title":"第 八 節 承攬"},{"no":"第496條","text":"工作之瑕疵，因定作人所供給材料之性質或依定作人之指示而生者，定作人無前三條所規定之權利。但承攬人明知其材料之性質或指示不適當，而不告知定作人者，不在此限。","title":"第 八 節 承攬"},{"no":"第497條","text":"工作進行中，因承攬人之過失，顯可預見工作有瑕疵或有其他違反契約之情事者，定作人得定相當期限，請求承攬人改善其工作或依約履行。\n承攬人不於前項期限內，依照改善或履行者，定作人得使第三人改善或繼續其工作，其危險及費用，均由承攬人負擔。","title":"第 八 節 承攬"},{"no":"第498條","text":"第四百九十三條至第四百九十五條所規定定作人之權利，如其瑕疵自工作交付後經過一年始發見者，不得主張。\n工作依其性質無須交付者，前項一年之期間，自工作完成時起算。","title":"第 八 節 承攬"},{"no":"第499條","text":"工作為建築物或其他土地上之工作物或為此等工作物之重大之修繕者，前條所定之期限，延為五年。","title":"第 八 節 承攬"},{"no":"第500條","text":"承攬人故意不告知其工作之瑕疵者，第四百九十八條所定之期限，延為五年，第四百九十九條所定之期限，延為十年。","title":"第 八 節 承攬"},{"no":"第501條","text":"第四百九十八條及第四百九十九條所定之期限，得以契約加長。但不得減短。","title":"第 八 節 承攬"},{"no":"第501-1條","text":"以特約免除或限制承攬人關於工作之瑕疵擔保義務者，如承攬人故意不告知其瑕疵，其特約為無效。","title":"第 八 節 承攬"},{"no":"第502條","text":"因可歸責於承攬人之事由，致工作逾約定期限始完成，或未定期限而逾相當時期始完成者，定作人得請求減少報酬或請求賠償因遲延而生之損害。\n前項情形，如以工作於特定期限完成或交付為契約之要素者，定作人得解除契約，並得請求賠償因不履行而生之損害。","title":"第 八 節 承攬"},{"no":"第503條","text":"因可歸責於承攬人之事由，遲延工作，顯可預見其不能於限期內完成而其遲延可為工作完成後解除契約之原因者，定作人得依前條第二項之規定解除契約，並請求損害賠償。","title":"第 八 節 承攬"},{"no":"第504條","text":"工作遲延後，定作人受領工作時不為保留者，承攬人對於遲延之結果，不負責任。","title":"第 八 節 承攬"},{"no":"第505條","text":"報酬應於工作交付時給付之，無須交付者，應於工作完成時給付之。\n工作係分部交付，而報酬係就各部分定之者，應於每部分交付時，給付該部分之報酬。","title":"第 八 節 承攬"},{"no":"第506條","text":"訂立契約時，僅估計報酬之概數者，如其報酬，因非可歸責於定作人之事由，超過概數甚鉅者，定作人得於工作進行中或完成後，解除契約。\n前項情形，工作如為建築物或其他土地上之工作物或為此等工作物之重大修繕者，定作人僅得請求相當減少報酬，如工作物尚未完成者，定作人得通知承攬人停止工作，並得解除契約。\n定作人依前二項之規定解除契約時，對於承攬人，應賠償相當之損害。","title":"第 八 節 承攬"},{"no":"第507條","text":"工作需定作人之行為始能完成者，而定作人不為其行為時，承攬人得定相當期限，催告定作人為之。\n定作人不於前項期限內為其行為者，承攬人得解除契約，並得請求賠償因契約解除而生之損害。","title":"第 八 節 承攬"},{"no":"第508條","text":"工作毀損、滅失之危險，於定作人受領前，由承攬人負擔，如定作人受領遲延者，其危險由定作人負擔。\n定作人所供給之材料，因不可抗力而毀損、滅失者，承攬人不負其責。","title":"第 八 節 承攬"},{"no":"第509條","text":"於定作人受領工作前，因其所供給材料之瑕疵或其指示不適當，致工作毀損、滅失或不能完成者，承攬人如及時將材料之瑕疵或指示不適當之情事通知定作人時，得請求其已服勞務之報酬及墊款之償還，定作人有過失者，並得請求損害賠償。","title":"第 八 節 承攬"},{"no":"第510條","text":"前二條所定之受領，如依工作之性質，無須交付者，以工作完成時視為受領。","title":"第 八 節 承攬"},{"no":"第511條","text":"工作未完成前，定作人得隨時終止契約。但應賠償承攬人因契約終止而生之損害。","title":"第 八 節 承攬"},{"no":"第512條","text":"承攬之工作，以承攬人個人之技能為契約之要素者，如承攬人死亡或非因其過失致不能完成其約定之工作時，其契約為終止。\n工作已完成之部分，於定作人為有用者，定作人有受領及給付相當報酬之義務。","title":"第 八 節 承攬"},{"no":"第513條","text":"承攬之工作為建築物或其他土地上之工作物，或為此等工作物之重大修繕者，承攬人得就承攬關係報酬額，對於其工作所附之定作人之不動產，請求定作人為抵押權之登記；或對於將來完成之定作人之不動產，請求預為抵押權之登記。\n前項請求，承攬人於開始工作前亦得為之。\n前二項之抵押權登記，如承攬契約已經公證者，承攬人得單獨申請之。\n第一項及第二項就修繕報酬所登記之抵押權，於工作物因修繕所增加之價值限度內，優先於成立在先之抵押權。","title":"第 八 節 承攬"},{"no":"第514條","text":"定作人之瑕疵修補請求權、修補費用償還請求權、減少報酬請求權、損害賠償請求權或契約解除權，均因瑕疵發見後一年間不行使而消滅。\n承攬人之損害賠償請求權或契約解除權，因其原因發生後，一年間不行使而消滅。","title":"第 八 節 承攬"},{"no":"第514-1條","text":"稱旅遊營業人者，謂以提供旅客旅遊服務為營業而收取旅遊費用之人。\n前項旅遊服務，係指安排旅程及提供交通、膳宿、導遊或其他有關之服務。","title":"第 八 節之一 旅遊"},{"no":"第514-2條","text":"旅遊營業人因旅客之請求，應以書面記載左列事項，交付旅客：\n一、旅遊營業人之名稱及地址。\n二、旅客名單。\n三、旅遊地區及旅程。\n四、旅遊營業人提供之交通、膳宿、導遊或其他有關服務及其品質。\n五、旅遊保險之種類及其金額。\n六、其他有關事項。\n七、填發之年月日。","title":"第 八 節之一 旅遊"},{"no":"第514-3條","text":"旅遊需旅客之行為始能完成，而旅客不為其行為者，旅遊營業人得定相當期限，催告旅客為之。\n旅客不於前項期限內為其行為者，旅遊營業人得終止契約，並得請求賠償因契約終止而生之損害。\n旅遊開始後，旅遊營業人依前項規定終止契約時，旅客得請求旅遊營業人墊付費用將其送回原出發地。於到達後，由旅客附加利息償還之。","title":"第 八 節之一 旅遊"},{"no":"第514-4條","text":"旅遊開始前，旅客得變更由第三人參加旅遊。旅遊營業人非有正當理由，不得拒絕。\n第三人依前項規定為旅客時，如因而增加費用，旅遊營業人得請求其給付。如減少費用，旅客不得請求退還。","title":"第 八 節之一 旅遊"},{"no":"第514-5條","text":"旅遊營業人非有不得已之事由，不得變更旅遊內容。\n旅遊營業人依前項規定變更旅遊內容時，其因此所減少之費用，應退還於旅客；所增加之費用，不得向旅客收取。\n旅遊營業人依第一項規定變更旅程時，旅客不同意者，得終止契約。\n旅客依前項規定終止契約時，得請求旅遊營業人墊付費用將其送回原出發地。於到達後，由旅客附加利息償還之。","title":"第 八 節之一 旅遊"},{"no":"第514-6條","text":"旅遊營業人提供旅遊服務，應使其具備通常之價值及約定之品質。","title":"第 八 節之一 旅遊"},{"no":"第514-7條","text":"旅遊服務不具備前條之價值或品質者，旅客得請求旅遊營業人改善之。旅遊營業人不為改善或不能改善時，旅客得請求減少費用。其有難於達預期目的之情形者，並得終止契約。\n因可歸責於旅遊營業人之事由致旅遊服務不具備前條之價值或品質者，旅客除請求減少費用或並終止契約外，並得請求損害賠償。\n旅客依前二項規定終止契約時，旅遊營業人應將旅客送回原出發地。其所生之費用，由旅遊營業人負擔。","title":"第 八 節之一 旅遊"},{"no":"第514-8條","text":"因可歸責於旅遊營業人之事由，致旅遊未依約定之旅程進行者，旅客就其時間之浪費，得按日請求賠償相當之金額。但其每日賠償金額，不得超過旅遊營業人所收旅遊費用總額每日平均之數額。","title":"第 八 節之一 旅遊"},{"no":"第514-9條","text":"旅遊未完成前，旅客得隨時終止契約。但應賠償旅遊營業人因契約終止而生之損害。\n第五百十四條之五第四項之規定，於前項情形準用之。","title":"第 八 節之一 旅遊"},{"no":"第514-10條","text":"旅客在旅遊中發生身體或財產上之事故時，旅遊營業人應為必要之協助及處理。\n前項之事故，係因非可歸責於旅遊營業人之事由所致者，其所生之費用，由旅客負擔。","title":"第 八 節之一 旅遊"},{"no":"第514-11條","text":"旅遊營業人安排旅客在特定場所購物，其所購物品有瑕疵者，旅客得於受領所購物品後一個月內，請求旅遊營業人協助其處理。","title":"第 八 節之一 旅遊"},{"no":"第514-12條","text":"本節規定之增加、減少或退還費用請求權，損害賠償請求權及墊付費用償還請求權，均自旅遊終了或應終了時起，一年間不行使而消滅。","title":"第 八 節之一 旅遊"}],"tags":["民法","僱傭","承攬"],"note":"僅收錄第二編第二章第七節「僱傭」（第 482–489 條）及第八節「承攬」（第 490–514 條）。"},{"id":"C06","name":"行政程序法","pcode":"A0030055","level":"法律","authority":"法務部","category":"行政＞法務部＞法律事務目","modified_date":"2021-01-20","history":[{"date":"1999-02-03","summary":"中華民國八十八年二月三日總統（88）華總一義字第 8800027120 號令制定公布全文 175 條；依第 175 條規定：自九十年一月一日施行"},{"date":"2000-12-27","summary":"中華民國八十九年十二月二十七日總統（89）華總一義字第 8900305050 號令增訂公布第 174-1 條條文"},{"date":"2001-06-20","summary":"中華民國九十年六月二十日總統（90）華總一義字第 9000119000 號令修正公布第 174-1 條條文"},{"date":"2001-12-28","summary":"中華民國九十年十二月二十八日總統（90）華總一義字第 9000265010號令修正公布第 174-1 條條文"},{"date":"2005-12-28","summary":"中華民國九十四年十二月二十八日總統華總一義字第 09400212541 號令刪除公布第 44、45 條條文"},{"date":"2013-05-22","summary":"中華民國一百零二年五月二十二日總統華總一義字第 10200092011 號令修正公布第 131 條條文"},{"date":"2015-12-30","summary":"中華民國一百零四年十二月三十日總統華總一義字第 10400151551 號令修正公布第 127、175 條條文；並自公布日施行"},{"date":"2021-01-20","summary":"中華民國一百十年一月二十日總統華總一義字第 11000004181 號令修正公布第 128 條條文"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030055","articles":[{"no":"第1條","text":"為使行政行為遵循公正、公開與民主之程序，確保依法行政之原則，以保障人民權益，提高行政效能，增進人民對行政之信賴，特制定本法。","title":"第 一 節 法例"},{"no":"第2條","text":"本法所稱行政程序，係指行政機關作成行政處分、締結行政契約、訂定法規命令與行政規則、確定行政計畫、實施行政指導及處理陳情等行為之程序。\n本法所稱行政機關，係指代表國家、地方自治團體或其他行政主體表示意思，從事公共事務，具有單獨法定地位之組織。\n受託行使公權力之個人或團體，於委託範圍內，視為行政機關。","title":"第 一 節 法例"},{"no":"第3條","text":"行政機關為行政行為時，除法律另有規定外，應依本法規定為之。\n下列機關之行政行為，不適用本法之程序規定：\n一、各級民意機關。\n二、司法機關。\n三、監察機關。\n下列事項，不適用本法之程序規定：\n一、有關外交行為、軍事行為或國家安全保障事項之行為。\n二、外國人出、入境、難民認定及國籍變更之行為。\n三、刑事案件犯罪偵查程序。\n四、犯罪矯正機關或其他收容處所為達成收容目的所為之行為。\n五、有關私權爭執之行政裁決程序。\n六、學校或其他教育機構為達成教育目的之內部程序。\n七、對公務員所為之人事行政行為。\n八、考試院有關考選命題及評分之行為。","title":"第 一 節 法例"},{"no":"第4條","text":"行政行為應受法律及一般法律原則之拘束。","title":"第 一 節 法例"},{"no":"第5條","text":"行政行為之內容應明確。","title":"第 一 節 法例"},{"no":"第6條","text":"行政行為，非有正當理由，不得為差別待遇。","title":"第 一 節 法例"},{"no":"第7條","text":"行政行為，應依下列原則為之：\n一、採取之方法應有助於目的之達成。\n二、有多種同樣能達成目的之方法時，應選擇對人民權益損害最少者。\n三、採取之方法所造成之損害不得與欲達成目的之利益顯失均衡。","title":"第 一 節 法例"},{"no":"第8條","text":"行政行為，應以誠實信用之方法為之，並應保護人民正當合理之信賴。","title":"第 一 節 法例"},{"no":"第9條","text":"行政機關就該管行政程序，應於當事人有利及不利之情形，一律注意。","title":"第 一 節 法例"},{"no":"第10條","text":"行政機關行使裁量權，不得逾越法定之裁量範圍，並應符合法規授權之目的。","title":"第 一 節 法例"},{"no":"第11條","text":"行政機關之管轄權，依其組織法規或其他行政法規定之。\n行政機關之組織法規變更管轄權之規定，而相關行政法規所定管轄機關尚未一併修正時，原管轄機關得會同組織法規變更後之管轄機關公告或逕由其共同上級機關公告變更管轄之事項。\n行政機關經裁併者，前項公告得僅由組織法規變更後之管轄機關為之。\n前二項公告事項，自公告之日起算至第三日起發生移轉管轄權之效力。但公告特定有生效日期者，依其規定。\n管轄權非依法規不得設定或變更。","title":"第 二 節 管轄"},{"no":"第12條","text":"不能依前條第一項定土地管轄權者，依下列各款順序定之︰\n一、關於不動產之事件，依不動產之所在地。\n二、關於企業之經營或其他繼續性事業之事件，依經營企業或從事事業之處所，或應經營或應從事之處所。\n三、其他事件，關於自然人者，依其住所地，無住所或住所不明者，依其居所地，無居所或居所不明者，依其最後所在地。關於法人或團體者，依其主事務所或會址所在地。\n四、不能依前三款之規定定其管轄權或有急迫情形者，依事件發生之原因定之。","title":"第 二 節 管轄"},{"no":"第13條","text":"同一事件，數行政機關依前二條之規定均有管轄權者，由受理在先之機關管轄，不能分別受理之先後者，由各該機關協議定之，不能協議或有統一管轄之必要時，由其共同上級機關指定管轄。無共同上級機關時，由各該上級機關協議定之。\n前項機關於必要之情形時，應為必要之職務行為，並即通知其他機關。","title":"第 二 節 管轄"},{"no":"第14條","text":"數行政機關於管轄權有爭議時，由其共同上級機關決定之，無共同上級機關時，由各該上級機關協議定之。\n前項情形，人民就其依法規申請之事件，得向共同上級機關申請指定管轄，無共同上級機關者，得向各該上級機關之一為之。受理申請之機關應自請求到達之日起十日內決定之。\n在前二項情形未經決定前，如有導致國家或人民難以回復之重大損害之虞時，該管轄權爭議之一方，應依當事人申請或依職權為緊急之臨時處置，並應層報共同上級機關及通知他方。\n人民對行政機關依本條所為指定管轄之決定，不得聲明不服。","title":"第 二 節 管轄"},{"no":"第15條","text":"行政機關得依法規將其權限之一部分，委任所屬下級機關執行之。\n行政機關因業務上之需要，得依法規將其權限之一部分，委託不相隸屬之行政機關執行之。\n前二項情形，應將委任或委託事項及法規依據公告之，並刊登政府公報或新聞紙。","title":"第 二 節 管轄"},{"no":"第16條","text":"行政機關得依法規將其權限之一部分，委託民間團體或個人辦理。\n前項情形，應將委託事項及法規依據公告之，並刊登政府公報或新聞紙。\n第一項委託所需費用，除另有約定外，由行政機關支付之。","title":"第 二 節 管轄"},{"no":"第17條","text":"行政機關對事件管轄權之有無，應依職權調查；其認無管轄權者，應即移送有管轄權之機關，並通知當事人。\n人民於法定期間內提出申請，依前項規定移送有管轄權之機關者，視同已在法定期間內向有管轄權之機關提出申請。","title":"第 二 節 管轄"},{"no":"第18條","text":"行政機關因法規或事實之變更而喪失管轄權時，應將案件移送有管轄權之機關，並通知當事人。但經當事人及有管轄權機關之同意，亦得由原管轄機關繼續處理該案件。","title":"第 二 節 管轄"},{"no":"第19條","text":"行政機關為發揮共同一體之行政機能，應於其權限範圍內互相協助。\n行政機關執行職務時，有下列情形之一者，得向無隸屬關係之其他機關請求協助︰\n一、因法律上之原因，不能獨自執行職務者。\n二、因人員、設備不足等事實上之原因，不能獨自執行職務者。\n三、執行職務所必要認定之事實，不能獨自調查者。\n四、執行職務所必要之文書或其他資料，為被請求機關所持有者。\n五、由被請求機關協助執行，顯較經濟者。\n六、其他職務上有正當理由須請求協助者。\n前項請求，除緊急情形外，應以書面為之。\n被請求機關於有下列情形之一者，應拒絕之︰\n一、協助之行為，非其權限範圍或依法不得為之者。\n二、如提供協助，將嚴重妨害其自身職務之執行者。\n被請求機關認有正當理由不能協助者，得拒絕之。\n被請求機關認為無提供行政協助之義務或有拒絕之事由時，應將其理由通知請求協助機關。請求協助機關對此有異議時，由其共同上級機關決定之，無共同上級機關時，由被請求機關之上級機關決定之。\n被請求機關得向請求協助機關要求負擔行政協助所需費用。其負擔金額及支付方式，由請求協助機關及被請求機關以協議定之；協議不成時，由其共同上級機關定之。","title":"第 二 節 管轄"},{"no":"第20條","text":"本法所稱之當事人如下︰\n一、申請人及申請之相對人。\n二、行政機關所為行政處分之相對人。\n三、與行政機關締結行政契約之相對人。\n四、行政機關實施行政指導之相對人。\n五、對行政機關陳情之人。\n六、其他依本法規定參加行政程序之人。","title":"第 三 節 當事人"},{"no":"第21條","text":"有行政程序之當事人能力者如下︰\n一、自然人。\n二、法人。\n三、非法人之團體設有代表人或管理人者。\n四、行政機關。\n五、其他依法律規定得為權利義務之主體者。","title":"第 三 節 當事人"},{"no":"第22條","text":"有行政程序之行為能力者如下︰\n一、依民法規定，有行為能力之自然人。\n二、法人。\n三、非法人之團體由其代表人或管理人為行政程序行為者。\n四、行政機關由首長或其代理人、授權之人為行政程序行為者。\n五、依其他法律規定者。\n無行政程序行為能力者，應由其法定代理人代為行政程序行為。\n外國人依其本國法律無行政程序之行為能力，而依中華民國法律有行政程序之行為能力者，視為有行政程序之行為能力。","title":"第 三 節 當事人"},{"no":"第23條","text":"因程序之進行將影響第三人之權利或法律上利益者，行政機關得依職權或依申請，通知其參加為當事人。","title":"第 三 節 當事人"},{"no":"第24條","text":"當事人得委任代理人。但依法規或行政程序之性質不得授權者，不得為之。\n每一當事人委任之代理人，不得逾三人。\n代理權之授與，及於該行政程序有關之全部程序行為。但申請之撤回，非受特別授權，不得為之。\n行政程序代理人應於最初為行政程序行為時，提出委任書。\n代理權授與之撤回，經通知行政機關後，始對行政機關發生效力。","title":"第 三 節 當事人"},{"no":"第25條","text":"代理人有二人以上者，均得單獨代理當事人。\n違反前項規定而為委任者，其代理人仍得單獨代理。\n代理人經本人同意得委任他人為複代理人。","title":"第 三 節 當事人"},{"no":"第26條","text":"代理權不因本人死亡或其行政程序行為能力喪失而消滅。法定代理有變更或行政機關經裁併或變更者，亦同。","title":"第 三 節 當事人"},{"no":"第27條","text":"多數有共同利益之當事人，未共同委任代理人者，得選定其中一人至五人為全體為行政程序行為。\n未選定當事人，而行政機關認有礙程序之正常進行者，得定相當期限命其選定；逾期未選定者，得依職權指定之。\n經選定或指定為當事人者，非有正當理由不得辭退。\n經選定或指定當事人者，僅得由該當事人為行政程序行為，其他當事人脫離行政程序。但申請之撤回、權利之拋棄或義務之負擔，非經全體有共同利益之人同意，不得為之。","title":"第 三 節 當事人"},{"no":"第28條","text":"選定或指定當事人有二人以上時，均得單獨為全體為行政程序行為。","title":"第 三 節 當事人"},{"no":"第29條","text":"多數有共同利益之當事人於選定或經指定當事人後，仍得更換或增減之。\n行政機關對於其指定之當事人，為共同利益人之權益，必要時，得更換或增減之。\n依前二項規定喪失資格者，其他被選定或指定之人得為全體為行政程序行為。","title":"第 三 節 當事人"},{"no":"第30條","text":"當事人之選定、更換或增減，非以書面通知行政機關不生效力。\n行政機關指定、更換或增減當事人者，非以書面通知全體有共同利益之當事人，不生效力。但通知顯有困難者，得以公告代之。","title":"第 三 節 當事人"},{"no":"第31條","text":"當事人或代理人經行政機關之許可，得偕同輔佐人到場。\n行政機關認為必要時，得命當事人或代理人偕同輔佐人到場。\n前二項之輔佐人，行政機關認為不適當時，得撤銷其許可或禁止其陳述。\n輔佐人所為之陳述，當事人或代理人未立即提出異議者，視為其所自為。","title":"第 三 節 當事人"},{"no":"第32條","text":"公務員在行政程序中，有下列各款情形之一者，應自行迴避︰\n一、本人或其配偶、前配偶、四親等內之血親或三親等內之姻親或曾有此關係者為事件之當事人時。\n二、本人或其配偶、前配偶，就該事件與當事人有共同權利人或共同義務人之關係者。\n三、現為或曾為該事件當事人之代理人、輔佐人者。\n四、於該事件，曾為證人、鑑定人者。","title":"第 四 節 迴避"},{"no":"第33條","text":"公務員有下列各款情形之一者，當事人得申請迴避︰\n一、有前條所定之情形而不自行迴避者。\n二、有具體事實，足認其執行職務有偏頗之虞者。\n前項申請，應舉其原因及事實，向該公務員所屬機關為之，並應為適當之釋明；被申請迴避之公務員，對於該申請得提出意見書。\n不服行政機關之駁回決定者，得於五日內提請上級機關覆決，受理機關除有正當理由外，應於十日內為適當之處置。\n被申請迴避之公務員在其所屬機關就該申請事件為准許或駁回之決定前，應停止行政程序。但有急迫情形，仍應為必要處置。\n公務員有前條所定情形不自行迴避，而未經當事人申請迴避者，應由該公務員所屬機關依職權命其迴避。","title":"第 四 節 迴避"},{"no":"第34條","text":"行政程序之開始，由行政機關依職權定之。但依本法或其他法規之規定有開始行政程序之義務，或當事人已依法規之規定提出申請者，不在此限。","title":"第 五 節 程序之開始"},{"no":"第35條","text":"當事人依法向行政機關提出申請者，除法規另有規定外，得以書面或言詞為之。以言詞為申請者，受理之行政機關應作成紀錄，經向申請人朗讀或使閱覽，確認其內容無誤後由其簽名或蓋章。","title":"第 五 節 程序之開始"},{"no":"第36條","text":"行政機關應依職權調查證據，不受當事人主張之拘束，對當事人有利及不利事項一律注意。","title":"第 六 節 調查事實及證據"},{"no":"第37條","text":"當事人於行政程序中，除得自行提出證據外，亦得向行政機關申請調查事實及證據。但行政機關認為無調查之必要者，得不為調查，並於第四十三條之理由中敘明之。","title":"第 六 節 調查事實及證據"},{"no":"第38條","text":"行政機關調查事實及證據，必要時得據實製作書面紀錄。","title":"第 六 節 調查事實及證據"},{"no":"第39條","text":"行政機關基於調查事實及證據之必要，得以書面通知相關之人陳述意見。通知書中應記載詢問目的、時間、地點、得否委託他人到場及不到場所生之效果。","title":"第 六 節 調查事實及證據"},{"no":"第40條","text":"行政機關基於調查事實及證據之必要，得要求當事人或第三人提供必要之文書、資料或物品。","title":"第 六 節 調查事實及證據"},{"no":"第41條","text":"行政機關得選定適當之人為鑑定。\n以書面為鑑定者，必要時，得通知鑑定人到場說明。","title":"第 六 節 調查事實及證據"},{"no":"第42條","text":"行政機關為瞭解事實真相，得實施勘驗。\n勘驗時應通知當事人到場。但不能通知者，不在此限。","title":"第 六 節 調查事實及證據"},{"no":"第43條","text":"行政機關為處分或其他行政行為，應斟酌全部陳述與調查事實及證據之結果，依論理及經驗法則判斷事實之真偽，並將其決定及理由告知當事人。","title":"第 六 節 調查事實及證據"},{"no":"第44條","text":"（刪除）","title":"第 七 節 資訊公開"},{"no":"第45條","text":"（刪除）","title":"第 七 節 資訊公開"},{"no":"第46條","text":"當事人或利害關係人得向行政機關申請閱覽、抄寫、複印或攝影有關資料或卷宗。但以主張或維護其法律上利益有必要者為限。\n行政機關對前項之申請，除有下列情形之一者外，不得拒絕︰\n一、行政決定前之擬稿或其他準備作業文件。\n二、涉及國防、軍事、外交及一般公務機密，依法規規定有保密之必要者。\n三、涉及個人隱私、職業秘密、營業秘密，依法規規定有保密之必要者。\n四、有侵害第三人權利之虞者。\n五、有嚴重妨礙有關社會治安、公共安全或其他公共利益之職務正常進行之虞者。\n前項第二款及第三款無保密必要之部分，仍應准許閱覽。\n當事人就第一項資料或卷宗內容關於自身之記載有錯誤者，得檢具事實證明，請求相關機關更正。","title":"第 七 節 資訊公開"},{"no":"第47條","text":"公務員在行政程序中，除基於職務上之必要外，不得與當事人或代表其利益之人為行政程序外之接觸。\n公務員與當事人或代表其利益之人為行政程序外之接觸時，應將所有往來之書面文件附卷，並對其他當事人公開。\n前項接觸非以書面為之者，應作成書面紀錄，載明接觸對象、時間、地點及內容。","title":"第 七 節 資訊公開"},{"no":"第48條","text":"期間以時計算者，即時起算。\n期間以日、星期、月或年計算者，其始日不計算在內。但法律規定即日起算者，不在此限。\n期間不以星期、月或年之始日起算者，以最後之星期、月或年與起算日相當日之前一日為期間之末日。但以月或年定期間，而於最後之月無相當日者，以其月之末日為期間之末日。\n期間之末日為星期日、國定假日或其他休息日者，以該日之次日為期間之末日；期間之末日為星期六者，以其次星期一上午為期間末日。\n期間涉及人民之處罰或其他不利行政處分者，其始日不計時刻以一日論；其末日為星期日、國定假日或其他休息日者，照計。但依第二項、第四項規定計算，對人民有利者，不在此限。","title":"第 八 節 期日與期間"},{"no":"第49條","text":"基於法規之申請，以掛號郵寄方式向行政機關提出者，以交郵當日之郵戳為準。","title":"第 八 節 期日與期間"},{"no":"第50條","text":"因天災或其他不應歸責於申請人之事由，致基於法規之申請不能於法定期間內提出者，得於其原因消滅後十日內，申請回復原狀。如該法定期間少於十日者，於相等之日數內得申請回復原狀。\n申請回復原狀，應同時補行期間內應為之行政程序行為。\n遲誤法定期間已逾一年者，不得申請回復原狀。","title":"第 八 節 期日與期間"},{"no":"第51條","text":"行政機關對於人民依法規之申請，除法規另有規定外，應按各事項類別，訂定處理期間公告之。\n未依前項規定訂定處理期間者，其處理期間為二個月。\n行政機關未能於前二項所定期間內處理終結者，得於原處理期間之限度內延長之，但以一次為限。\n前項情形，應於原處理期間屆滿前，將延長之事由通知申請人。\n行政機關因天災或其他不可歸責之事由，致事務之處理遭受阻礙時，於該項事由終止前，停止處理期間之進行。","title":"第 八 節 期日與期間"},{"no":"第52條","text":"行政程序所生之費用，由行政機關負擔。但專為當事人或利害關係人利益所支出之費用，不在此限。\n因可歸責於當事人或利害關係人之事由，致程序有顯著之延滯者，其因延滯所生之費用，由其負擔。","title":"第 九 節 費用"},{"no":"第53條","text":"證人或鑑定人得向行政機關請求法定之日費及旅費，鑑定人並得請求相當之報酬。\n前項費用及報酬，得請求行政機關預行酌給之。\n第一項費用，除法規另有規定外，其標準由行政院定之。","title":"第 九 節 費用"},{"no":"第54條","text":"依本法或其他法規舉行聽證時，適用本節規定。","title":"第 十 節 聽證程序"},{"no":"第55條","text":"行政機關舉行聽證前，應以書面記載下列事項，並通知當事人及其他已知之利害關係人，必要時並公告之︰\n一、聽證之事由與依據。\n二、當事人之姓名或名稱及其住居所、事務所或營業所。\n三、聽證之期日及場所。\n四、聽證之主要程序。\n五、當事人得選任代理人。\n六、當事人依第六十一條所得享有之權利。\n七、擬進行預備程序者，預備聽證之期日及場所。\n八、缺席聽證之處理。\n九、聽證之機關。\n依法規之規定，舉行聽證應預先公告者，行政機關應將前項所列各款事項，登載於政府公報或以其他適當方法公告之。\n聽證期日及場所之決定，應視事件之性質，預留相當期間，便利當事人或其代理人參與。","title":"第 十 節 聽證程序"},{"no":"第56條","text":"行政機關得依職權或當事人之申請，變更聽證期日或場所，但以有正當理由為限。\n行政機關為前項之變更者，應依前條規定通知並公告。","title":"第 十 節 聽證程序"},{"no":"第57條","text":"聽證，由行政機關首長或其指定人員為主持人，必要時得由律師、相關專業人員或其他熟諳法令之人員在場協助之。","title":"第 十 節 聽證程序"},{"no":"第58條","text":"行政機關為使聽證順利進行，認為必要時，得於聽證期日前，舉行預備聽證。\n預備聽證得為下列事項︰\n一、議定聽證程序之進行。\n二、釐清爭點。\n三、提出有關文書及證據。\n四、變更聽證之期日、場所與主持人。\n預備聽證之進行，應作成紀錄。","title":"第 十 節 聽證程序"},{"no":"第59條","text":"聽證，除法律另有規定外，應公開以言詞為之。\n有下列各款情形之一者，主持人得依職權或當事人之申請，決定全部或一部不公開︰\n一、公開顯然有違背公益之虞者。\n二、公開對當事人利益有造成重大損害之虞者。","title":"第 十 節 聽證程序"},{"no":"第60條","text":"聽證以主持人說明案由為始。\n聽證開始時，由主持人或其指定之人說明事件之內容要旨。","title":"第 十 節 聽證程序"},{"no":"第61條","text":"當事人於聽證時，得陳述意見、提出證據，經主持人同意後並得對機關指定之人員、證人、鑑定人、其他當事人或其代理人發問。","title":"第 十 節 聽證程序"},{"no":"第62條","text":"主持人應本中立公正之立場，主持聽證。\n主持人於聽證時，得行使下列職權︰\n一、就事實或法律問題，詢問當事人、其他到場人，或促其提出證據。\n二、依職權或當事人之申請，委託相關機關為必要之調查。\n三、通知證人或鑑定人到場。\n四、依職權或申請，通知或允許利害關係人參加聽證。\n五、許可當事人及其他到場人之發問或發言。\n六、為避免延滯程序之進行，禁止當事人或其他到場之人發言；有妨礙聽證程序而情節重大者，並得命其退場。\n七、當事人一部或全部無故缺席者，逕行開始、延期或終結聽證。\n八、當事人曾於預備聽證中提出有關文書者，得以其所載內容視為陳述。\n九、認為有必要時，於聽證期日結束前，決定繼續聽證之期日及場所。\n十、如遇天災或其他事故不能聽證時，得依職權或當事人之申請，中止聽證。\n十一、採取其他為順利進行聽證所必要之措施。\n主持人依前項第九款決定繼續聽證之期日及場所者，應通知未到場之當事人及已知之利害關係人。","title":"第 十 節 聽證程序"},{"no":"第63條","text":"當事人認為主持人於聽證程序進行中所為之處置違法或不當者，得即時聲明異議。\n主持人認為異議有理由者，應即撤銷原處置，認為無理由者，應即駁回異議。","title":"第 十 節 聽證程序"},{"no":"第64條","text":"聽證，應作成聽證紀錄。\n前項紀錄，應載明到場人所為陳述或發問之要旨及其提出之文書、證據，並記明當事人於聽證程序進行中聲明異議之事由及主持人對異議之處理。\n聽證紀錄，得以錄音、錄影輔助之。\n聽證紀錄當場製作完成者，由陳述或發問人簽名或蓋章；未當場製作完成者，由主持人指定日期、場所供陳述或發問人閱覽，並由其簽名或蓋章。\n前項情形，陳述或發問人拒絕簽名、蓋章或未於指定日期、場所閱覽者，應記明其事由。\n陳述或發問人對聽證紀錄之記載有異議者，得即時提出。主持人認異議有理由者，應予更正或補充；無理由者，應記明其異議。","title":"第 十 節 聽證程序"},{"no":"第65條","text":"主持人認當事人意見業經充分陳述，而事件已達可為決定之程度者，應即終結聽證。","title":"第 十 節 聽證程序"},{"no":"第66條","text":"聽證終結後，決定作成前，行政機關認為必要時，得再為聽證。","title":"第 十 節 聽證程序"},{"no":"第67條","text":"送達，除法規另有規定外，由行政機關依職權為之。","title":"第 十一 節 送達"},{"no":"第68條","text":"送達由行政機關自行或交由郵政機關送達。\n行政機關之文書依法規以電報交換、電傳文件、傳真或其他電子文件行之者，視為自行送達。\n由郵政機關送達者，以一般郵遞方式為之。但文書內容對人民權利義務有重大影響者，應為掛號。\n文書由行政機關自行送達者，以承辦人員或辦理送達事務人員為送達人；其交郵政機關送達者，以郵務人員為送達人。\n前項郵政機關之送達準用依民事訴訟法施行法第三條訂定之郵政機關送達訴訟文書實施辦法。","title":"第 十一 節 送達"},{"no":"第69條","text":"對於無行政程序之行為能力人為送達者，應向其法定代理人為之。\n對於機關、法人或非法人之團體為送達者，應向其代表人或管理人為之。\n法定代理人、代表人或管理人有二人以上者，送達得僅向其中之一人為之。\n無行政程序之行為能力人為行政程序之行為，未向行政機關陳明其法定代理人者，於補正前，行政機關得向該無行為能力人為送達。","title":"第 十一 節 送達"},{"no":"第70條","text":"對於在中華民國有事務所或營業所之外國法人或團體為送達者，應向其在中華民國之代表人或管理人為之。\n前條第三項規定，於前項送達準用之。","title":"第 十一 節 送達"},{"no":"第71條","text":"行政程序之代理人受送達之權限未受限制者，送達應向該代理人為之。但行政機關認為必要時，得送達於當事人本人。","title":"第 十一 節 送達"},{"no":"第72條","text":"送達，於應受送達人之住居所、事務所或營業所為之。但在行政機關辦公處所或他處會晤應受送達人時，得於會晤處所為之。\n對於機關、法人、非法人之團體之代表人或管理人為送達者，應向其機關所在地、事務所或營業所行之。但必要時亦得於會晤之處所或其住居所行之。\n應受送達人有就業處所者，亦得向該處所為送達。","title":"第 十一 節 送達"},{"no":"第73條","text":"於應送達處所不獲會晤應受送達人時，得將文書付與有辨別事理能力之同居人、受雇人或應送達處所之接收郵件人員。\n前項規定於前項人員與應受送達人在該行政程序上利害關係相反者，不適用之。\n應受送達人或其同居人、受雇人、接收郵件人員無正當理由拒絕收領文書時，得將文書留置於應送達處所，以為送達。","title":"第 十一 節 送達"},{"no":"第74條","text":"送達，不能依前二條規定為之者，得將文書寄存送達地之地方自治或警察機關，並作送達通知書兩份，一份黏貼於應受送達人住居所、事務所、營業所或其就業處所門首，另一份交由鄰居轉交或置於該送達處所信箱或其他適當位置，以為送達。\n前項情形，由郵政機關為送達者，得將文書寄存於送達地之郵政機關。\n寄存機關自收受寄存文書之日起，應保存三個月。","title":"第 十一 節 送達"},{"no":"第75條","text":"行政機關對於不特定人之送達，得以公告或刊登政府公報或新聞紙代替之。","title":"第 十一 節 送達"},{"no":"第76條","text":"送達人因證明之必要，得製作送達證書，記載下列事項並簽名︰\n一、交送達之機關。\n二、應受送達人。\n三、應送達文書之名稱。\n四、送達處所、日期及時間。\n五、送達方法。\n除電子傳達方式之送達外，送達證書應由收領人簽名或蓋章；如拒絕或不能簽名或蓋章者，送達人應記明其事由。\n送達證書，應提出於行政機關附卷。","title":"第 十一 節 送達"},{"no":"第77條","text":"送達係由當事人向行政機關申請對第三人為之者，行政機關應將已為送達或不能送達之事由，通知當事人。","title":"第 十一 節 送達"},{"no":"第78條","text":"對於當事人之送達，有下列各款情形之一者，行政機關得依申請，准為公示送達︰\n一、應為送達之處所不明者。\n二、於有治外法權人之住居所或事務所為送達而無效者。\n三、於外國或境外為送達，不能依第八十六條之規定辦理或預知雖依該規定辦理而無效者。\n有前項所列各款之情形而無人為公示送達之申請者，行政機關為避免行政程序遲延，認為有必要時，得依職權命為公示送達。\n當事人變更其送達之處所而不向行政機關陳明，致有第一項之情形者，行政機關得依職權命為公示送達。","title":"第 十一 節 送達"},{"no":"第79條","text":"依前條規定為公示送達後，對於同一當事人仍應為公示送達者，依職權為之。","title":"第 十一 節 送達"},{"no":"第80條","text":"公示送達應由行政機關保管送達之文書，而於行政機關公告欄黏貼公告，告知應受送達人得隨時領取；並得由行政機關將文書或其節本刊登政府公報或新聞紙。","title":"第 十一 節 送達"},{"no":"第81條","text":"公示送達自前條公告之日起，其刊登政府公報或新聞紙者，自最後刊登之日起，經二十日發生效力；於依第七十八條第一項第三款為公示送達者，經六十日發生效力。但第七十九條之公示送達，自黏貼公告欄翌日起發生效力。","title":"第 十一 節 送達"},{"no":"第82條","text":"為公示送達者，行政機關應製作記載該事由及年、月、日、時之證書附卷。","title":"第 十一 節 送達"},{"no":"第83條","text":"當事人或代理人經指定送達代收人，向行政機關陳明者，應向該代收人為送達。\n郵寄方式向行政機關提出者，以交郵地無住居所、事務所及營業所者，行政機關得命其於一定期間內，指定送達代收人。\n如不於前項期間指定送達代收人並陳明者，行政機關得將應送達之文書，註明該當事人或代理人之住居所、事務所或營業所，交付郵政機關掛號發送，並以交付文書時，視為送達時。","title":"第 十一 節 送達"},{"no":"第84條","text":"送達，除第六十八條第一項規定交付郵政機關或依第二項之規定辦理者外，不得於星期日或其他休息日或日出前、日沒後為之。但應受送達人不拒絕收領者，不在此限。","title":"第 十一 節 送達"},{"no":"第85條","text":"不能為送達者，送達人應製作記載該事由之報告書，提出於行政機關附卷，並繳回應送達之文書。","title":"第 十一 節 送達"},{"no":"第86條","text":"於外國或境外為送達者，應囑託該國管轄機關或駐在該國之中華民國使領館或其他機構、團體為之。\n不能依前項規定為送達者，得將應送達之文書交郵政機關以雙掛號發送，以為送達，並將掛號回執附卷。","title":"第 十一 節 送達"},{"no":"第87條","text":"對於駐在外國之中華民國大使、公使、領事或其他駐外人員為送達者，應囑託外交部為之。","title":"第 十一 節 送達"},{"no":"第88條","text":"對於在軍隊或軍艦服役之軍人為送達者，應囑託該管軍事機關或長官為之。","title":"第 十一 節 送達"},{"no":"第89條","text":"對於在監所人為送達者，應囑託該監所長官為之。","title":"第 十一 節 送達"},{"no":"第90條","text":"於有治外法權人之住居所或事務所為送達者，得囑託外交部為之。","title":"第 十一 節 送達"},{"no":"第91條","text":"受囑託之機關或公務員，經通知已為送達或不能為送達者，行政機關應將通知書附卷。","title":"第 十一 節 送達"},{"no":"第92條","text":"本法所稱行政處分，係指行政機關就公法上具體事件所為之決定或其他公權力措施而對外直接發生法律效果之單方行政行為。\n前項決定或措施之相對人雖非特定，而依一般性特徵可得確定其範圍者，為一般處分，適用本法有關行政處分之規定。有關公物之設定、變更、廢止或其一般使用者，亦同。","title":"第 一 節 行政處分之成立"},{"no":"第93條","text":"行政機關作成行政處分有裁量權時，得為附款。無裁量權者，以法律有明文規定或為確保行政處分法定要件之履行而以該要件為附款內容者為限，始得為之。\n前項所稱之附款如下︰\n一、期限。\n二、條件。\n三、負擔。\n四、保留行政處分之廢止權。\n五、保留負擔之事後附加或變更。","title":"第 一 節 行政處分之成立"},{"no":"第94條","text":"前條之附款不得違背行政處分之目的，並應與該處分之目的具有正當合理之關聯。","title":"第 一 節 行政處分之成立"},{"no":"第95條","text":"行政處分除法規另有要式之規定者外，得以書面、言詞或其他方式為之。\n以書面以外方式所為之行政處分，其相對人或利害關係人有正當理由要求作成書面時，處分機關不得拒絕。","title":"第 一 節 行政處分之成立"},{"no":"第96條","text":"行政處分以書面為之者，應記載下列事項︰\n一、處分相對人之姓名、出生年月日、性別、身分證統一號碼、住居所或其他足資辨別之特徵；如係法人或其他設有管理人或代表人之團體，其名稱、事務所或營業所，及管理人或代表人之姓名、出生年月日、性別、身分證統一號碼、住居所。\n二、主旨、事實、理由及其法令依據。\n三、有附款者，附款之內容。\n四、處分機關及其首長署名、蓋章，該機關有代理人或受任人者，須同時於其下簽名。但以自動機器作成之大量行政處分，得不經署名，以蓋章為之。\n五、發文字號及年、月、日。\n六、表明其為行政處分之意旨及不服行政處分之救濟方法、期間及其受理機關。\n前項規定於依前條第二項作成之書面，準用之。","title":"第 一 節 行政處分之成立"},{"no":"第97條","text":"書面之行政處分有下列各款情形之一者，得不記明理由︰\n一、未限制人民之權益者。\n二、處分相對人或利害關係人無待處分機關之說明已知悉或可知悉作成處分之理由者。\n三、大量作成之同種類行政處分或以自動機器作成之行政處分依其狀況無須說明理由者。\n四、一般處分經公告或刊登政府公報或新聞紙者。\n五、有關專門知識、技能或資格所為之考試、檢定或鑑定等程序。\n六、依法律規定無須記明理由者。","title":"第 一 節 行政處分之成立"},{"no":"第98條","text":"處分機關告知之救濟期間有錯誤時，應由該機關以通知更正之，並自通知送達之翌日起算法定期間。\n處分機關告知之救濟期間較法定期間為長者，處分機關雖以通知更正，如相對人或利害關係人信賴原告知之救濟期間，致無法於法定期間內提起救濟，而於原告知之期間內為之者，視為於法定期間內所為。\n處分機關未告知救濟期間或告知錯誤未為更正，致相對人或利害關係人遲誤者，如自處分書送達後一年內聲明不服時，視為於法定期間內所為。","title":"第 一 節 行政處分之成立"},{"no":"第99條","text":"對於行政處分聲明不服，因處分機關未為告知或告知錯誤致向無管轄權之機關為之者，該機關應於十日內移送有管轄權之機關，並通知當事人。\n前項情形，視為自始向有管轄權之機關聲明不服。","title":"第 一 節 行政處分之成立"},{"no":"第100條","text":"書面之行政處分，應送達相對人及已知之利害關係人；書面以外之行政處分，應以其他適當方法通知或使其知悉。\n一般處分之送達，得以公告或刊登政府公報或新聞紙代替之。","title":"第 一 節 行政處分之成立"},{"no":"第101條","text":"行政處分如有誤寫、誤算或其他類此之顯然錯誤者，處分機關得隨時或依申請更正之。\n前項更正，附記於原處分書及其正本，如不能附記者，應製作更正書，以書面通知相對人及已知之利害關係人。","title":"第 一 節 行政處分之成立"},{"no":"第102條","text":"行政機關作成限制或剝奪人民自由或權利之行政處分前，除已依第三十九條規定，通知處分相對人陳述意見，或決定舉行聽證者外，應給予該處分相對人陳述意見之機會。但法規另有規定者，從其規定。","title":"第 二 節 陳述意見及聽證"},{"no":"第103條","text":"有下列各款情形之一者，行政機關得不給予陳述意見之機會︰\n一、大量作成同種類之處分。\n二、情況急迫，如予陳述意見之機會，顯然違背公益者。\n三、受法定期間之限制，如予陳述意見之機會，顯然不能遵行者。\n四、行政強制執行時所採取之各種處置。\n五、行政處分所根據之事實，客觀上明白足以確認者。\n六、限制自由或權利之內容及程度，顯屬輕微，而無事先聽取相對人意見之必要者。\n七、相對人於提起訴願前依法律應向行政機關聲請再審查、異議、復查、重審或其他先行程序者。\n八、為避免處分相對人隱匿、移轉財產或潛逃出境，依法律所為保全或限制出境之處分。","title":"第 二 節 陳述意見及聽證"},{"no":"第104條","text":"行政機關依第一百零二條給予相對人陳述意見之機會時，應以書面記載下列事項通知相對人，必要時並公告之︰\n一、相對人及其住居所、事務所或營業所。\n二、將為限制或剝奪自由或權利行政處分之原因事實及法規依據。\n三、得依第一百零五條提出陳述書之意旨。\n四、提出陳述書之期限及不提出之效果。\n五、其他必要事項。\n前項情形，行政機關得以言詞通知相對人，並作成紀錄，向相對人朗讀或使閱覽後簽名或蓋章；其拒絕簽名或蓋章者，應記明其事由。","title":"第 二 節 陳述意見及聽證"},{"no":"第105條","text":"行政處分之相對人依前條規定提出之陳述書，應為事實上及法律上陳述。\n利害關係人亦得提出陳述書，為事實上及法律上陳述，但應釋明其利害關係之所在。\n不於期間內提出陳述書者，視為放棄陳述之機會。","title":"第 二 節 陳述意見及聽證"},{"no":"第106條","text":"行政處分之相對人或利害關係人得於第一百零四條第一項第四款所定期限內，以言詞向行政機關陳述意見代替陳述書之提出。\n以言詞陳述意見者，行政機關應作成紀錄，經向陳述人朗讀或使閱覽確認其內容無誤後，由陳述人簽名或蓋章；其拒絕簽名或蓋章者，應記明其事由。陳述人對紀錄有異議者，應更正之。","title":"第 二 節 陳述意見及聽證"},{"no":"第107條","text":"行政機關遇有下列各款情形之一者，舉行聽證︰\n一、法規明文規定應舉行聽證者。\n二、行政機關認為有舉行聽證之必要者。","title":"第 二 節 陳述意見及聽證"},{"no":"第108條","text":"行政機關作成經聽證之行政處分時，除依第四十三條之規定外，並應斟酌全部聽證之結果。但法規明定應依聽證紀錄作成處分者，從其規定。\n前項行政處分應以書面為之，並通知當事人。","title":"第 二 節 陳述意見及聽證"},{"no":"第109條","text":"不服依前條作成之行政處分者，其行政救濟程序，免除訴願及其先行程序。","title":"第 二 節 陳述意見及聽證"},{"no":"第110條","text":"書面之行政處分自送達相對人及已知之利害關係人起；書面以外之行政處分自以其他適當方法通知或使其知悉時起，依送達、通知或使知悉之內容對其發生效力。\n一般處分自公告日或刊登政府公報、新聞紙最後登載日起發生效力。但處分另訂不同日期者，從其規定。\n行政處分未經撤銷、廢止，或未因其他事由而失效者，其效力繼續存在。\n無效之行政處分自始不生效力。","title":"第 三 節 行政處分之效力"},{"no":"第111條","text":"行政處分有下列各款情形之一者，無效︰\n一、不能由書面處分中得知處分機關者。\n二、應以證書方式作成而未給予證書者。\n三、內容對任何人均屬不能實現者。\n四、所要求或許可之行為構成犯罪者。\n五、內容違背公共秩序、善良風俗者。\n六、未經授權而違背法規有關專屬管轄之規定或缺乏事務權限者。\n七、其他具有重大明顯之瑕疵者。","title":"第 三 節 行政處分之效力"},{"no":"第112條","text":"行政處分一部分無效者，其他部分仍為有效。但除去該無效部分，行政處分不能成立者，全部無效。","title":"第 三 節 行政處分之效力"},{"no":"第113條","text":"行政處分之無效，行政機關得依職權確認之。\n行政處分之相對人或利害關係人有正當理由請求確認行政處分無效時，處分機關應確認其為有效或無效。","title":"第 三 節 行政處分之效力"},{"no":"第114條","text":"違反程序或方式規定之行政處分，除依第一百十一條規定而無效者外，因下列情形而補正︰\n一、須經申請始得作成之行政處分，當事人已於事後提出者。\n二、必須記明之理由已於事後記明者。\n三、應給予當事人陳述意見之機會已於事後給予者。\n四、應參與行政處分作成之委員會已於事後作成決議者。\n五、應參與行政處分作成之其他機關已於事後參與者。\n前項第二款至第五款之補正行為，僅得於訴願程序終結前為之；得不經訴願程序者，僅得於向行政法院起訴前為之。\n當事人因補正行為致未能於法定期間內聲明不服者，其期間之遲誤視為不應歸責於該當事人之事由，其回復原狀期間自該瑕疵補正時起算。","title":"第 三 節 行政處分之效力"},{"no":"第115條","text":"行政處分違反土地管轄之規定者，除依第一百十一條第六款規定而無效者外，有管轄權之機關如就該事件仍應為相同之處分時，原處分無須撤銷。","title":"第 三 節 行政處分之效力"},{"no":"第116條","text":"行政機關得將違法行政處分轉換為與原處分具有相同實質及程序要件之其他行政處分。但有下列各款情形之一者，不得轉換︰\n一、違法行政處分，依第一百十七條但書規定，不得撤銷者。\n二、轉換不符作成原行政處分之目的者。\n三、轉換法律效果對當事人更為不利者。\n羈束處分不得轉換為裁量處分。\n行政機關於轉換前應給予當事人陳述意見之機會。但有第一百零三條之事由者，不在此限。","title":"第 三 節 行政處分之效力"},{"no":"第117條","text":"違法行政處分於法定救濟期間經過後，原處分機關得依職權為全部或一部之撤銷；其上級機關，亦得為之。但有下列各款情形之一者，不得撤銷︰\n一、撤銷對公益有重大危害者。\n二、受益人無第一百十九條所列信賴不值得保護之情形，而信賴授予利益之行政處分，其信賴利益顯然大於撤銷所欲維護之公益者。","title":"第 三 節 行政處分之效力"},{"no":"第118條","text":"違法行政處分經撤銷後，溯及既往失其效力。但為維護公益或為避免受益人財產上之損失，為撤銷之機關得另定失其效力之日期。","title":"第 三 節 行政處分之效力"},{"no":"第119條","text":"受益人有下列各款情形之一者，其信賴不值得保護︰\n一、以詐欺、脅迫或賄賂方法，使行政機關作成行政處分者。\n二、對重要事項提供不正確資料或為不完全陳述，致使行政機關依該資料或陳述而作成行政處分者。\n三、明知行政處分違法或因重大過失而不知者。","title":"第 三 節 行政處分之效力"},{"no":"第120條","text":"授予利益之違法行政處分經撤銷後，如受益人無前條所列信賴不值得保護之情形，其因信賴該處分致遭受財產上之損失者，為撤銷之機關應給予合理之補償。\n前項補償額度不得超過受益人因該處分存續可得之利益。\n關於補償之爭議及補償之金額，相對人有不服者，得向行政法院提起給付訴訟。","title":"第 三 節 行政處分之效力"},{"no":"第121條","text":"第一百十七條之撤銷權，應自原處分機關或其上級機關知有撤銷原因時起二年內為之。\n前條之補償請求權，自行政機關告知其事由時起，因二年間不行使而消滅；自處分撤銷時起逾五年者，亦同。","title":"第 三 節 行政處分之效力"},{"no":"第122條","text":"非授予利益之合法行政處分，得由原處分機關依職權為全部或一部之廢止。但廢止後仍應為同一內容之處分或依法不得廢止者，不在此限。","title":"第 三 節 行政處分之效力"},{"no":"第123條","text":"授予利益之合法行政處分，有下列各款情形之一者，得由原處分機關依職權為全部或一部之廢止：\n一、法規准許廢止者。\n二、原處分機關保留行政處分之廢止權者。\n三、附負擔之行政處分，受益人未履行該負擔者。\n四、行政處分所依據之法規或事實事後發生變更，致不廢止該處分對公益將有危害者。\n五、其他為防止或除去對公益之重大危害者。","title":"第 三 節 行政處分之效力"},{"no":"第124條","text":"前條之廢止，應自廢止原因發生後二年內為之。","title":"第 三 節 行政處分之效力"},{"no":"第125條","text":"合法行政處分經廢止後，自廢止時或自廢止機關所指定較後之日時起，失其效力。但受益人未履行負擔致行政處分受廢止者，得溯及既往失其效力。","title":"第 三 節 行政處分之效力"},{"no":"第126條","text":"原處分機關依第一百二十三條第四款、第五款規定廢止授予利益之合法行政處分者，對受益人因信賴該處分致遭受財產上之損失，應給予合理之補償。\n第一百二十條第二項、第三項及第一百二十一條第二項之規定，於前項補償準用之。","title":"第 三 節 行政處分之效力"},{"no":"第127條","text":"授予利益之行政處分，其內容係提供一次或連續之金錢或可分物之給付者，經撤銷、廢止或條件成就而有溯及既往失效之情形時，受益人應返還因該處分所受領之給付。其行政處分經確認無效者，亦同。\n前項返還範圍準用民法有關不當得利之規定。\n行政機關依前二項規定請求返還時，應以書面行政處分確認返還範圍，並限期命受益人返還之。\n前項行政處分未確定前，不得移送行政執行。","title":"第 三 節 行政處分之效力"},{"no":"第128條","text":"行政處分於法定救濟期間經過後，具有下列各款情形之一者，相對人或利害關係人得向行政機關申請撤銷、廢止或變更之。但相對人或利害關係人因重大過失而未能在行政程序或救濟程序中主張其事由者，不在此限：\n一、具有持續效力之行政處分所依據之事實事後發生有利於相對人或利害關係人之變更者。\n二、發生新事實或發現新證據者，但以如經斟酌可受較有利益之處分者為限。\n三、其他具有相當於行政訴訟法所定再審事由且足以影響行政處分者。\n前項申請，應自法定救濟期間經過後三個月內為之；其事由發生在後或知悉在後者，自發生或知悉時起算。但自法定救濟期間經過後已逾五年者，不得申請。\n第一項之新證據，指處分作成前已存在或成立而未及調查斟酌，及處分作成後始存在或成立之證據。","title":"第 三 節 行政處分之效力"},{"no":"第129條","text":"行政機關認前條之申請為有理由者，應撤銷、廢止或變更原處分；認申請為無理由或雖有重新開始程序之原因，如認為原處分為正當者，應駁回之。","title":"第 三 節 行政處分之效力"},{"no":"第130條","text":"行政處分經撤銷或廢止確定，或因其他原因失其效力後，而有收回因該處分而發給之證書或物品之必要者，行政機關得命所有人或占有人返還之。\n前項情形，所有人或占有人得請求行政機關將該證書或物品作成註銷之標示後，再予發還。但依物之性質不能作成註銷標示，或註銷標示不能明顯而持續者，不在此限。","title":"第 三 節 行政處分之效力"},{"no":"第131條","text":"公法上之請求權，於請求權人為行政機關時，除法律另有規定外，因五年間不行使而消滅；於請求權人為人民時，除法律另有規定外，因十年間不行使而消滅。\n公法上請求權，因時效完成而當然消滅。\n前項時效，因行政機關為實現該權利所作成之行政處分而中斷。","title":"第 三 節 行政處分之效力"},{"no":"第132條","text":"行政處分因撤銷、廢止或其他事由而溯及既往失效時，自該處分失效時起，已中斷之時效視為不中斷。","title":"第 三 節 行政處分之效力"},{"no":"第133條","text":"因行政處分而中斷之時效，自行政處分不得訴請撤銷或因其他原因失其效力後，重行起算。","title":"第 三 節 行政處分之效力"},{"no":"第134條","text":"因行政處分而中斷時效之請求權，於行政處分不得訴請撤銷後，其原有時效期間不滿五年者，因中斷而重行起算之時效期間為五年。","title":"第 三 節 行政處分之效力"},{"no":"第135條","text":"公法上法律關係得以契約設定、變更或消滅之。但依其性質或法規規定不得締約者，不在此限。","title":"第 三 章 行政契約"},{"no":"第136條","text":"行政機關對於行政處分所依據之事實或法律關係，經依職權調查仍不能確定者，為有效達成行政目的，並解決爭執，得與人民和解，締結行政契約，以代替行政處分。","title":"第 三 章 行政契約"},{"no":"第137條","text":"行政機關與人民締結行政契約，互負給付義務者，應符合下列各款之規定︰\n一、契約中應約定人民給付之特定用途。\n二、人民之給付有助於行政機關執行其職務。\n三、人民之給付與行政機關之給付應相當，並具有正當合理之關聯。\n行政處分之作成，行政機關無裁量權時，代替該行政處分之行政契約所約定之人民給付，以依第九十三條第一項規定得為附款者為限。\n第一項契約應載明人民給付之特定用途及僅供該特定用途使用之意旨。","title":"第 三 章 行政契約"},{"no":"第138條","text":"行政契約當事人之一方為人民，依法應以甄選或其他競爭方式決定該當事人時，行政機關應事先公告應具之資格及決定之程序。決定前，並應予參與競爭者表示意見之機會。","title":"第 三 章 行政契約"},{"no":"第139條","text":"行政契約之締結，應以書面為之。但法規另有其他方式之規定者，依其規定。","title":"第 三 章 行政契約"},{"no":"第140條","text":"行政契約依約定內容履行將侵害第三人之權利者，應經該第三人書面之同意，始生效力。\n行政處分之作成，依法規之規定應經其他行政機關之核准、同意或會同辦理者，代替該行政處分而締結之行政契約，亦應經該行政機關之核准、同意或會同辦理，始生效力。","title":"第 三 章 行政契約"},{"no":"第141條","text":"行政契約準用民法規定之結果為無效者，無效。\n行政契約違反第一百三十五條但書或第一百三十八條之規定者，無效。","title":"第 三 章 行政契約"},{"no":"第142條","text":"代替行政處分之行政契約，有下列各款情形之一者，無效︰\n一、與其內容相同之行政處分為無效者。\n二、與其內容相同之行政處分，有得撤銷之違法原因，並為締約雙方所明知者。\n三、締結之和解契約，未符合第一百三十六條之規定者。\n四、締結之雙務契約，未符合第一百三十七條之規定者。","title":"第 三 章 行政契約"},{"no":"第143條","text":"行政契約之一部無效者，全部無效。但如可認為欠缺該部分，締約雙方亦將締結契約者，其他部分仍為有效。","title":"第 三 章 行政契約"},{"no":"第144條","text":"行政契約當事人之一方為人民者，行政機關得就相對人契約之履行，依書面約定之方式，為必要之指導或協助。","title":"第 三 章 行政契約"},{"no":"第145條","text":"行政契約當事人之一方為人民者，其締約後，因締約機關所屬公法人之其他機關於契約關係外行使公權力，致相對人履行契約義務時，顯增費用或受其他不可預期之損失者，相對人得向締約機關請求補償其損失。但公權力之行使與契約之履行無直接必要之關聯者，不在此限。\n締約機關應就前項請求，以書面並敘明理由決定之。\n第一項補償之請求，應自相對人知有損失時起一年內為之。\n關於補償之爭議及補償之金額，相對人有不服者，得向行政法院提起給付訴訟。","title":"第 三 章 行政契約"},{"no":"第146條","text":"行政契約當事人之一方為人民者，行政機關為防止或除去對公益之重大危害，得於必要範圍內調整契約內容或終止契約。\n前項之調整或終止，非補償相對人因此所受之財產上損失，不得為之。\n第一項之調整或終止及第二項補償之決定，應以書面敘明理由為之。\n相對人對第一項之調整難為履行者，得以書面敘明理由終止契約。\n相對人對第二項補償金額不同意時，得向行政法院提起給付訴訟。","title":"第 三 章 行政契約"},{"no":"第147條","text":"行政契約締結後，因有情事重大變更，非當時所得預料，而依原約定顯失公平者，當事人之一方得請求他方適當調整契約內容。如不能調整，得終止契約。\n前項情形，行政契約當事人之一方為人民時，行政機關為維護公益，得於補償相對人之損失後，命其繼續履行原約定之義務。\n第一項之請求調整或終止與第二項補償之決定，應以書面敘明理由為之。\n相對人對第二項補償金額不同意時，得向行政法院提起給付訴訟。","title":"第 三 章 行政契約"},{"no":"第148條","text":"行政契約約定自願接受執行時，債務人不為給付時，債權人得以該契約為強制執行之執行名義。\n前項約定，締約之一方為中央行政機關時，應經主管院、部或同等級機關之認可；締約之一方為地方自治團體之行政機關時，應經該地方自治團體行政首長之認可；契約內容涉及委辦事項者，並應經委辦機關之認可，始生效力。\n第一項強制執行，準用行政訴訟法有關強制執行之規定。","title":"第 三 章 行政契約"},{"no":"第149條","text":"行政契約，本法未規定者，準用民法相關之規定。","title":"第 三 章 行政契約"},{"no":"第150條","text":"本法所稱法規命令，係指行政機關基於法律授權，對多數不特定人民就一般事項所作抽象之對外發生法律效果之規定。\n法規命令之內容應明列其法律授權之依據，並不得逾越法律授權之範圍與立法精神。","title":"第 四 章 法規命令及行政規則"},{"no":"第151條","text":"行政機關訂定法規命令，除關於軍事、外交或其他重大事項而涉及國家機密或安全者外，應依本法所定程序為之。但法律另有規定者，從其規定。\n法規命令之修正、廢止、停止或恢復適用，準用訂定程序之規定。","title":"第 四 章 法規命令及行政規則"},{"no":"第152條","text":"法規命令之訂定，除由行政機關自行草擬者外，並得由人民或團體提議為之。\n前項提議，應以書面敘明法規命令訂定之目的、依據及理由，並附具相關資料。","title":"第 四 章 法規命令及行政規則"},{"no":"第153條","text":"受理前條提議之行政機關，應依下列情形分別處理︰\n一、非主管之事項，依第十七條之規定予以移送。\n二、依法不得以法規命令規定之事項，附述理由通知原提議者。\n三、無須訂定法規命令之事項，附述理由通知原提議者。\n四、有訂定法規命令之必要者，著手研擬草案。","title":"第 四 章 法規命令及行政規則"},{"no":"第154條","text":"行政機關擬訂法規命令時，除情況急迫，顯然無法事先公告周知者外，應於政府公報或新聞紙公告，載明下列事項︰\n一、訂定機關之名稱，其依法應由數機關會同訂定者，各該機關名稱。\n二、訂定之依據。\n三、草案全文或其主要內容。\n四、任何人得於所定期間內向指定機關陳述意見之意旨。\n行政機關除為前項之公告外，並得以適當之方法，將公告內容廣泛周知。","title":"第 四 章 法規命令及行政規則"},{"no":"第155條","text":"行政機關訂定法規命令，得依職權舉行聽證。","title":"第 四 章 法規命令及行政規則"},{"no":"第156條","text":"行政機關為訂定法規命令，依法舉行聽證者，應於政府公報或新聞紙公告，載明下列事項：\n一、訂定機關之名稱，其依法應由數機關會同訂定者，各該機關之名稱。\n二、訂定之依據。\n三、草案之全文或其主要內容。\n四、聽證之日期及場所。\n五、聽證之主要程序。","title":"第 四 章 法規命令及行政規則"},{"no":"第157條","text":"法規命令依法應經上級機關核定者，應於核定後始得發布。\n數機關會同訂定之法規命令，依法應經上級機關或共同上級機關核定者，應於核定後始得會銜發布。\n法規命令之發布，應刊登政府公報或新聞紙。","title":"第 四 章 法規命令及行政規則"},{"no":"第158條","text":"法規命令，有下列情形之一者，無效︰\n一、牴觸憲法、法律或上級機關之命令者。\n二、無法律之授權而剝奪或限制人民之自由、權利者。\n三、其訂定依法應經其他機關核准，而未經核准者。\n法規命令之一部分無效者，其他部分仍為有效。但除去該無效部分，法規命令顯失規範目的者，全部無效。","title":"第 四 章 法規命令及行政規則"},{"no":"第159條","text":"本法所稱行政規則，係指上級機關對下級機關，或長官對屬官，依其權限或職權為規範機關內部秩序及運作，所為非直接對外發生法規範效力之一般、抽象之規定。\n行政規則包括下列各款之規定︰\n一、關於機關內部之組織、事務之分配、業務處理方式、人事管理等一般性規定。\n二、為協助下級機關或屬官統一解釋法令、認定事實、及行使裁量權，而訂頒之解釋性規定及裁量基準。","title":"第 四 章 法規命令及行政規則"},{"no":"第160條","text":"行政規則應下達下級機關或屬官。\n行政機關訂定前條第二項第二款之行政規則，應由其首長簽署，並登載於政府公報發布之。","title":"第 四 章 法規命令及行政規則"},{"no":"第161條","text":"有效下達之行政規則，具有拘束訂定機關、其下級機關及屬官之效力。","title":"第 四 章 法規命令及行政規則"},{"no":"第162條","text":"行政規則得由原發布機關廢止之。\n行政規則之廢止，適用第一百六十條規定。","title":"第 四 章 法規命令及行政規則"},{"no":"第163條","text":"本法所稱行政計畫，係指行政機關為將來一定期限內達成特定之目的或實現一定之構想，事前就達成該目的或實現該構想有關之方法、步驟或措施等所為之設計與規劃。","title":"第 五 章 行政計畫"},{"no":"第164條","text":"行政計畫有關一定地區土地之特定利用或重大公共設施之設置，涉及多數不同利益之人及多數不同行政機關權限者，確定其計畫之裁決，應經公開及聽證程序，並得有集中事權之效果。\n前項行政計畫之擬訂、確定、修訂及廢棄之程序，由行政院另定之。","title":"第 五 章 行政計畫"},{"no":"第165條","text":"本法所稱行政指導，謂行政機關在其職權或所掌事務範圍內，為實現一定之行政目的，以輔導、協助、勸告、建議或其他不具法律上強制力之方法，促請特定人為一定作為或不作為之行為。","title":"第 六 章 行政指導"},{"no":"第166條","text":"行政機關為行政指導時，應注意有關法規規定之目的，不得濫用。\n相對人明確拒絕指導時，行政機關應即停止，並不得據此對相對人為不利之處置。","title":"第 六 章 行政指導"},{"no":"第167條","text":"行政機關對相對人為行政指導時，應明示行政指導之目的、內容、及負責指導者等事項。\n前項明示，得以書面、言詞或其他方式為之。如相對人請求交付文書時，除行政上有特別困難外，應以書面為之。","title":"第 六 章 行政指導"},{"no":"第168條","text":"人民對於行政興革之建議、行政法令之查詢、行政違失之舉發或行政上權益之維護，得向主管機關陳情。","title":"第 七 章 陳情"},{"no":"第169條","text":"陳情得以書面或言詞為之；其以言詞為之者，受理機關應作成紀錄，並向陳情人朗讀或使閱覽後命其簽名或蓋章。\n陳情人對紀錄有異議者，應更正之。","title":"第 七 章 陳情"},{"no":"第170條","text":"行政機關對人民之陳情，應訂定作業規定，指派人員迅速、確實處理之。\n人民之陳情有保密必要者，受理機關處理時，應不予公開。","title":"第 七 章 陳情"},{"no":"第171條","text":"受理機關認為人民之陳情有理由者，應採取適當之措施；認為無理由者，應通知陳情人，並說明其意旨。\n受理機關認為陳情之重要內容不明確或有疑義者，得通知陳情人補陳之。","title":"第 七 章 陳情"},{"no":"第172條","text":"人民之陳情應向其他機關為之者，受理機關應告知陳情人。但受理機關認為適當時，應即移送其他機關處理，並通知陳情人。\n陳情之事項，依法得提起訴願、訴訟或請求國家賠償者，受理機關應告知陳情人。","title":"第 七 章 陳情"},{"no":"第173條","text":"人民陳情案有下列情形之一者，得不予處理︰\n一、無具體之內容或未具真實姓名或住址者。\n二、同一事由，經予適當處理，並已明確答覆後，而仍一再陳情者。\n三、非主管陳情內容之機關，接獲陳情人以同一事由分向各機關陳情者。","title":"第 七 章 陳情"},{"no":"第174條","text":"當事人或利害關係人不服行政機關於行政程序中所為之決定或處置，僅得於對實體決定聲明不服時一併聲明之。但行政機關之決定或處置得強制執行或本法或其他法規另有規定者，不在此限。","title":"第 八 章 附則"},{"no":"第174-1條","text":"本法施行前，行政機關依中央法規標準法第七條訂定之命令，須以法律規定或以法律明列其授權依據者，應於本法施行後二年內，以法律規定或以法律明列其授權依據後修正或訂定；逾期失效。","title":"第 八 章 附則"},{"no":"第175條","text":"本法自中華民國九十年一月一日施行。\n本法修正條文自公布日施行。","title":"第 八 章 附則"}],"tags":["行政程序","行政契約"],"note":"第三章行政契約（第 135–149 條）：聘用、約僱契約實務上被認定為公法（行政）契約。"},{"id":"C07","name":"就業服務法","pcode":"N0090001","level":"法律","authority":"勞動部","category":"行政＞勞動部＞就業服務目","modified_date":"2025-01-20","history":[{"date":"1992-05-08","summary":"中華民國八十一年五月八日總統（81）華總（一）義字第 2359 號令制定公布全文 70 條"},{"date":"1997-05-21","summary":"中華民國八十六年五月二十一日總統（86）華總（一）義字第 8600118890 號令修正公布第 49 條條文"},{"date":"2000-01-26","summary":"中華民國八十九年一月二十六日總統（89）華總一義字第 8900021190號令修正公布第 43、51 條條文"},{"date":"2002-01-21","summary":"中華民國九十一年一月二十一日總統（91）華總一義字第 09100010130號令修正公布全文 83 條；依第 83 條規定：本法施行日期，除第四十八條第一項至第三項規定由行政院以命令定之外，自公布日施行中華民國九十三年一月九日行政院院臺勞字第 0930080307 號令發布第四十八條第一項至第三項規定定自九十三年一月十五日施行"},{"date":"2003-05-13","summary":"中華民國九十二年五月十三日總統華總一義字第 09200087890 號令修正公布第 46、48、51～53 條條文"},{"date":"2003-05-16","summary":"中華民國九十二年五月十六日總統華總一義字第 09200092550 號令修正公布第 52 條條文"},{"date":"2006-05-30","summary":"中華民國九十五年五月三十日總統華總一義字第 09500075901 號令修正公布第 64、83 條條文；依第 83 條規定：並自九十五年七月一日施行"},{"date":"2007-05-23","summary":"中華民國九十六年五月二十三日總統華總一義字第 09600064151 號令修正公布第 5、40、55、58、60 條條文"},{"date":"2007-07-11","summary":"中華民國九十六年七月十一日總統華總一義字第 09600087311 號令修正公布第 52 條條文"},{"date":"2008-08-06","summary":"中華民國九十七年八月六日總統華總一義字第 09700147411 號令修正公布第 48 條條文"},{"date":"2009-05-13","summary":"中華民國九十八年五月十三日總統華總一義字第 09800116311 號令修正公布第 2、24、26 條條文"},{"date":"2012-01-30","summary":"中華民國一百零一年一月三十日總統華總一義字第 10100021441 號令修正公布第 52、55 條條文"},{"date":"2012-11-28","summary":"中華民國一百零一年十一月二十八日總統華總一義字第 10100264211號令修正公布第 5 條條文"},{"date":"2013-12-25","summary":"中華民國一百零二年十二月二十五日總統華總一義字第 10200232701號令修正公布第 20、22、40、46、54、56、58、60、62、67～69 條條文中華民國一百零三年二月十四日行政院院臺規字第 1030124618 號公告第 6 條第 1 項所列屬「行政院勞工委員會」之權責事項，自一百零三年二月十七日起改由「勞動部」管轄中華民國一百零三年三月二十四日行政院院臺規字第 1030128812 號公告第 6 條第 2 項所列屬「行政院原住民委員會」之權責事項，自一百零三年三月二十六日起改由「原住民族委員會」管轄"},{"date":"2015-06-17","summary":"中華民國一百零四年六月十七日總統華總一義字第 10400070741 號令修正公布第 6、7、17、24、29、46、48、50 條條文；並刪除第15 條文"},{"date":"2015-10-07","summary":"中華民國一百零四年十月七日總統華總一義字第 10400116251 號令修正公布第 52、55 條條文；並增訂第 48-1 條條文"},{"date":"2016-11-03","summary":"中華民國一百零五年十一月三日總統華總一義字第 10500136341 號令修正公布第 52 條條文中華民國一百零七年四月二十七日行政院院臺規字第 1070172574 號公告第 62 條第 1 項所列屬「海岸巡防機關」之權責事項原由「行政院海岸巡防署及所屬機關」管轄，自一百零七年四月二十八日起改由「海洋委員會海巡署及所屬機關（構）」管轄"},{"date":"2018-11-28","summary":"中華民國一百零七年十一月二十八日總統華總一義字第 10700128031號令修正公布第 5、24、40、46、54、56、65～68、70 條條文"},{"date":"2023-05-10","summary":"中華民國一百十二年五月十日總統華總一義字第 11200038331 號令修正公布第 58 條條文"},{"date":"2025-01-20","summary":"中華民國一百十四年一月二十日總統華總一義字第 11400004231 號令修正公布第 46 條條文"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0090001","articles":[{"no":"第1條","text":"為促進國民就業，以增進社會及經濟發展，特制定本法；本法未規定者，適用其他法律之規定。","title":"第 一 章 總則"},{"no":"第2條","text":"本法用詞定義如下：\n一、就業服務：指協助國民就業及雇主徵求員工所提供之服務。\n二、就業服務機構：指提供就業服務之機構；其由政府機關設置者，為公立就業服務機構；其由政府以外之私人或團體所設置者，為私立就業服務機構。\n三、雇主：指聘、僱用員工從事工作者。\n四、中高齡者：指年滿四十五歲至六十五歲之國民。\n五、長期失業者：指連續失業期間達一年以上，且辦理勞工保險退保當日前三年內，保險年資合計滿六個月以上，並於最近一個月內有向公立就業服務機構辦理求職登記者。","title":"第 一 章 總則"},{"no":"第3條","text":"國民有選擇職業之自由。但為法律所禁止或限制者，不在此限。","title":"第 一 章 總則"},{"no":"第4條","text":"國民具有工作能力者，接受就業服務一律平等。","title":"第 一 章 總則"},{"no":"第5條","text":"為保障國民就業機會平等，雇主對求職人或所僱用員工，不得以種族、階級、語言、思想、宗教、黨派、籍貫、出生地、性別、性傾向、年齡、婚姻、容貌、五官、身心障礙、星座、血型或以往工會會員身分為由，予以歧視；其他法律有明文規定者，從其規定。\n雇主招募或僱用員工，不得有下列情事：\n一、為不實之廣告或揭示。\n二、違反求職人或員工之意思，留置其國民身分證、工作憑證或其他證明文件，或要求提供非屬就業所需之隱私資料。\n三、扣留求職人或員工財物或收取保證金。\n四、指派求職人或員工從事違背公共秩序或善良風俗之工作。\n五、辦理聘僱外國人之申請許可、招募、引進或管理事項，提供不實資料或健康檢查檢體。\n六、提供職缺之經常性薪資未達新臺幣四萬元而未公開揭示或告知其薪資範圍。","title":"第 一 章 總則"},{"no":"第6條","text":"本法所稱主管機關：在中央為勞動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。\n中央主管機關應會同原住民族委員會辦理相關原住民就業服務事項。\n中央主管機關掌理事項如下：\n一、全國性國民就業政策、法令、計畫及方案之訂定。\n二、全國性就業市場資訊之提供。\n三、就業服務作業基準之訂定。\n四、全國就業服務業務之督導、協調及考核。\n五、雇主申請聘僱外國人之許可及管理。\n六、辦理下列仲介業務之私立就業服務機構之許可、停業及廢止許可：\n（一）仲介外國人至中華民國境內工作。\n（二）仲介香港或澳門居民、大陸地區人民至臺灣地區工作。\n（三）仲介本國人至臺灣地區以外之地區工作。\n七、其他有關全國性之國民就業服務及促進就業事項。\n直轄市、縣（市）主管機關掌理事項如下：\n一、就業歧視之認定。\n二、外國人在中華民國境內工作之管理及檢查。\n三、仲介本國人在國內工作之私立就業服務機構之許可、停業及廢止許可。\n四、前項第六款及前款以外私立就業服務機構之管理。\n五、其他有關國民就業服務之配合事項。","title":"第 一 章 總則"},{"no":"第7條","text":"主管機關得遴聘勞工、雇主、政府機關之代表及學者專家，研議、諮詢有關就業服務及促進就業等事項；其中勞工、雇主及學者專家代表，不得少於二分之一。\n前項代表單一性別，不得少於三分之一。","title":"第 一 章 總則"},{"no":"第8條","text":"主管機關為增進就業服務工作人員之專業知識及工作效能，應定期舉辦在職訓練。","title":"第 一 章 總則"},{"no":"第9條","text":"就業服務機構及其人員，對雇主與求職人之資料，除推介就業之必要外，不得對外公開。","title":"第 一 章 總則"},{"no":"第10條","text":"在依法罷工期間，或因終止勞動契約涉及勞方多數人權利之勞資爭議在調解期間，就業服務機構不得推介求職人至該罷工或有勞資爭議之場所工作。\n前項所稱勞方多數人，係指事業單位勞工涉及勞資爭議達十人以上，或雖未達十人而占該勞資爭議場所員工人數三分之一以上者。","title":"第 一 章 總則"},{"no":"第11條","text":"主管機關對推動國民就業有卓越貢獻者，應予獎勵及表揚。\n前項獎勵及表揚之資格條件、項目、方式及其他應遵行事項之辦法，由中央主管機關定之。","title":"第 一 章 總則"},{"no":"第12條","text":"主管機關得視業務需要，在各地設置公立就業服務機構。\n直轄市、縣（市）轄區內原住民人口達二萬人以上者，得設立因應原住民族特殊文化之原住民公立就業服務機構。\n前兩項公立就業服務機構設置準則，由中央主管機關定之。","title":"第 二 章 政府就業服務"},{"no":"第13條","text":"公立就業服務機構辦理就業服務，以免費為原則。但接受雇主委託招考人才所需之費用，得向雇主收取之。","title":"第 二 章 政府就業服務"},{"no":"第14條","text":"公立就業服務機構對於求職人及雇主申請求職、求才登記，不得拒絕。但其申請有違反法令或拒絕提供為推介就業所需之資料者，不在此限。","title":"第 二 章 政府就業服務"},{"no":"第15條","text":"（刪除）","title":"第 二 章 政府就業服務"},{"no":"第16條","text":"公立就業服務機構應蒐集、整理、分析其業務區域內之薪資變動、人力供需及未來展望等資料，提供就業市場資訊。","title":"第 二 章 政府就業服務"},{"no":"第17條","text":"公立就業服務機構對求職人應先提供就業諮詢，再依就業諮詢結果或職業輔導評量，推介就業、職業訓練、技能檢定、創業輔導、進行轉介或失業認定及轉請核發失業給付。\n前項服務項目及內容，應作成紀錄。\n第一項就業諮詢、職業輔導及其他相關事項之辦法，由中央主管機關定之。","title":"第 二 章 政府就業服務"},{"no":"第18條","text":"公立就業服務機構與其業務區域內之學校應密切聯繫，協助學校辦理學生職業輔導工作，並協同推介畢業學生就業或參加職業訓練及就業後輔導工作。","title":"第 二 章 政府就業服務"},{"no":"第19條","text":"公立就業服務機構為輔導缺乏工作知能之求職人就業，得推介其參加職業訓練；對職業訓練結訓者，應協助推介其就業。","title":"第 二 章 政府就業服務"},{"no":"第20條","text":"公立就業服務機構對申請就業保險失業給付者，應推介其就業或參加職業訓練。","title":"第 二 章 政府就業服務"},{"no":"第21條","text":"政府應依就業與失業狀況相關調查資料，策訂人力供需調節措施，促進人力資源有效運用及國民就業。","title":"第 三 章 促進就業"},{"no":"第22條","text":"中央主管機關為促進地區間人力供需平衡並配合就業保險失業給付之實施，應建立全國性之就業資訊網。","title":"第 三 章 促進就業"},{"no":"第23條","text":"中央主管機關於經濟不景氣致大量失業時，得鼓勵雇主協商工會或勞工，循縮減工作時間、調整薪資、辦理教育訓練等方式，以避免裁減員工；並得視實際需要，加強實施職業訓練或採取創造臨時就業機會、辦理創業貸款利息補貼等輔導措施；必要時，應發給相關津貼或補助金，促進其就業。\n前項利息補貼、津貼與補助金之申請資格條件、項目、方式、期間、經費來源及其他應遵行事項之辦法，由中央主管機關定之。","title":"第 三 章 促進就業"},{"no":"第24條","text":"主管機關對下列自願就業人員，應訂定計畫，致力促進其就業；必要時，得發給相關津貼或補助金：\n一、獨力負擔家計者。\n二、中高齡者。\n三、身心障礙者。\n四、原住民。\n五、低收入戶或中低收入戶中有工作能力者。\n六、長期失業者。\n七、二度就業婦女。\n八、家庭暴力被害人。\n九、更生受保護人。\n十、其他經中央主管機關認為有必要者。\n前項計畫應定期檢討，落實其成效。\n主管機關對具照顧服務員資格且自願就業者，應提供相關協助措施。\n第一項津貼或補助金之申請資格、金額、期間、經費來源及其他相關事項之辦法，由主管機關定之。","title":"第 三 章 促進就業"},{"no":"第25條","text":"公立就業服務機構應主動爭取適合身心障礙者及中高齡者之就業機會，並定期公告。","title":"第 三 章 促進就業"},{"no":"第26條","text":"主管機關為輔導獨力負擔家計者就業，或因妊娠、分娩或育兒而離職之婦女再就業，應視實際需要，辦理職業訓練。","title":"第 三 章 促進就業"},{"no":"第27條","text":"主管機關為協助身心障礙者及原住民適應工作環境，應視實際需要，實施適應訓練。","title":"第 三 章 促進就業"},{"no":"第28條","text":"公立就業服務機構推介身心障礙者及原住民就業後，應辦理追蹤訪問，協助其工作適應。","title":"第 三 章 促進就業"},{"no":"第29條","text":"直轄市及縣（市）主管機關應將轄區內低收入戶及中低收入戶中有工作能力者，列冊送當地公立就業服務機構，推介就業或參加職業訓練。\n公立就業服務機構推介之求職人為低收入戶、中低收入戶或家庭暴力被害人中有工作能力者，其應徵工作所需旅費，得酌予補助。","title":"第 三 章 促進就業"},{"no":"第30條","text":"公立就業服務機構應與當地役政機關密切聯繫，協助推介退伍者就業或參加職業訓練。","title":"第 三 章 促進就業"},{"no":"第31條","text":"公立就業服務機構應與更生保護會密切聯繫，協助推介受保護人就業或參加職業訓練。","title":"第 三 章 促進就業"},{"no":"第32條","text":"主管機關為促進國民就業，應按年編列預算，依權責執行本法規定措施。\n中央主管機關得視直轄市、縣（市）主管機關實際財務狀況，予以補助。","title":"第 三 章 促進就業"},{"no":"第33條","text":"雇主資遣員工時，應於員工離職之十日前，將被資遣員工之姓名、性別、年齡、住址、電話、擔任工作、資遣事由及需否就業輔導等事項，列冊通報當地主管機關及公立就業服務機構。但其資遣係因天災、事變或其他不可抗力之情事所致者，應自被資遣員工離職之日起三日內為之。\n公立就業服務機構接獲前項通報資料後，應依被資遣人員之志願、工作能力，協助其再就業。","title":"第 三 章 促進就業"},{"no":"第33-1條","text":"中央主管機關得將其於本法所定之就業服務及促進就業掌理事項，委任所屬就業服務機構或職業訓練機構、委辦直轄市、縣（市）主管機關或委託相關機關（構）、團體辦理之。","title":"第 三 章 促進就業"},{"no":"第34條","text":"私立就業服務機構及其分支機構，應向主管機關申請設立許可，經發給許可證後，始得從事就業服務業務；其許可證並應定期更新之。\n未經許可，不得從事就業服務業務。但依法設立之學校、職業訓練機構或接受政府機關委託辦理訓練、就業服務之機關（構），為其畢業生、結訓學員或求職人免費辦理就業服務者，不在此限。\n第一項私立就業服務機構及其分支機構之設立許可條件、期間、廢止許可、許可證更新及其他管理事項之辦法，由中央主管機關定之。","title":"第 四 章 民間就業服務"},{"no":"第35條","text":"私立就業服務機構得經營下列就業服務業務：\n一、職業介紹或人力仲介業務。\n二、接受委任招募員工。\n三、協助國民釐定生涯發展計畫之就業諮詢或職業心理測驗。\n四、其他經中央主管機關指定之就業服務事項。\n私立就業服務機構經營前項就業服務業務得收取費用；其收費項目及金額，由中央主管機關定之。","title":"第 四 章 民間就業服務"},{"no":"第36條","text":"私立就業服務機構應置符合規定資格及數額之就業服務專業人員。\n前項就業服務專業人員之資格及數額，於私立就業服務機構許可及管理辦法中規定之。","title":"第 四 章 民間就業服務"},{"no":"第37條","text":"就業服務專業人員不得有下列情事：\n一、允許他人假藉本人名義從事就業服務業務。\n二、違反法令執行業務。","title":"第 四 章 民間就業服務"},{"no":"第38條","text":"辦理下列仲介業務之私立就業服務機構，應以公司型態組織之。但由中央主管機關設立，或經中央主管機關許可設立、指定或委任之非營利性機構或團體，不在此限：\n一、仲介外國人至中華民國境內工作。\n二、仲介香港或澳門居民、大陸地區人民至臺灣地區工作。\n三、仲介本國人至臺灣地區以外之地區工作。","title":"第 四 章 民間就業服務"},{"no":"第39條","text":"私立就業服務機構應依規定備置及保存各項文件資料，於主管機關檢查時，不得規避、妨礙或拒絕。","title":"第 四 章 民間就業服務"},{"no":"第40條","text":"私立就業服務機構及其從業人員從事就業服務業務，不得有下列情事：\n一、辦理仲介業務，未依規定與雇主或求職人簽訂書面契約。\n二、為不實或違反第五條第一項規定之廣告或揭示。\n三、違反求職人意思，留置其國民身分證、工作憑證或其他證明文件。\n四、扣留求職人財物或收取推介就業保證金。\n五、要求、期約或收受規定標準以外之費用，或其他不正利益。\n六、行求、期約或交付不正利益。\n七、仲介求職人從事違背公共秩序或善良風俗之工作。\n八、接受委任辦理聘僱外國人之申請許可、招募、引進或管理事項，提供不實資料或健康檢查檢體。\n九、辦理就業服務業務有恐嚇、詐欺、侵占或背信情事。\n十、違反雇主或勞工之意思，留置許可文件、身分證件或其他相關文件。\n十一、對主管機關規定之報表，未依規定填寫或填寫不實。\n十二、未依規定辦理變更登記、停業申報或換發、補發證照。\n十三、未依規定揭示私立就業服務機構許可證、收費項目及金額明細表、就業服務專業人員證書。\n十四、經主管機關處分停止營業，其期限尚未屆滿即自行繼續營業。\n十五、辦理就業服務業務，未善盡受任事務，致雇主違反本法或依本法所發布之命令，或致勞工權益受損。\n十六、租借或轉租私立就業服務機構許可證或就業服務專業人員證書。\n十七、接受委任引進之外國人入國三個月內發生行蹤不明之情事，並於一年內達一定之人數及比率者。\n十八、對求職人或受聘僱外國人有性侵害、人口販運、妨害自由、重傷害或殺人行為。\n十九、知悉受聘僱外國人疑似遭受雇主、被看護者或其他共同生活之家屬、雇主之代表人、負責人或代表雇主處理有關勞工事務之人為性侵害、人口販運、妨害自由、重傷害或殺人行為，而未於二十四小時內向主管機關、入出國管理機關、警察機關或其他司法機關通報。\n二十、其他違反本法或依本法所發布之命令。\n前項第十七款之人數、比率及查核方式等事項，由中央主管機關定之。","title":"第 四 章 民間就業服務"},{"no":"第41條","text":"接受委託登載或傳播求才廣告者，應自廣告之日起，保存委託者之姓名或名稱、住所、電話、國民身分證統一編號或事業登記字號等資料二個月，於主管機關檢查時，不得規避、妨礙或拒絕。","title":"第 四 章 民間就業服務"},{"no":"第42條","text":"為保障國民工作權，聘僱外國人工作，不得妨礙本國人之就業機會、勞動條件、國民經濟發展及社會安定。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第43條","text":"除本法另有規定外，外國人未經雇主申請許可，不得在中華民國境內工作。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第44條","text":"任何人不得非法容留外國人從事工作。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第45條","text":"任何人不得媒介外國人非法為他人工作。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第46條","text":"雇主聘僱外國人在中華民國境內從事之工作，除本法另有規定外，以下列各款為限：\n一、專門性或技術性之工作。\n二、華僑或外國人經政府核准投資或設立事業之主管。\n三、下列學校教師：\n（一）公立或經立案之私立大專以上校院或外國僑民學校之教師。\n（二）公立或已立案之私立高級中等以下學校之合格外國語文課程教師。\n（三）公立或已立案私立實驗高級中等學校雙語部或雙語學校之學科教師。\n四、依補習及進修教育法立案之短期補習班之專任教師。\n五、運動教練及運動員。\n六、宗教、藝術及演藝工作。\n七、商船、工作船及其他經交通部特許船舶之船員。\n八、海洋漁撈工作。\n九、家庭幫傭、機構看護及家庭看護工作。\n十、為因應國家重要建設工程或經濟社會發展需要，經中央主管機關指定之工作。\n十一、其他因工作性質特殊，國內缺乏該項人才，在業務上確有聘僱外國人從事工作之必要，經中央主管機關專案核定者。\n從事前項工作之外國人，其工作資格及審查標準，除其他法律另有規定外，由中央主管機關會商中央目的事業主管機關定之。但前項第九款之家庭看護工，其被看護者具有原住民身分時，其評估與認定方式應由衛生福利部會商原住民族委員會定之。\n雇主依第一項第八款至第十款規定聘僱外國人，須訂立書面勞動契約，並以定期契約為限；其未定期限者，以聘僱許可之期限為勞動契約之期限。續約時，亦同。\n雇主聘僱外國人從事家庭看護工作，被看護者凡年齡滿八十歲以上，或七十歲至七十九歲患有癌症二期以上者，得免經醫療機構之專業評估。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第47條","text":"雇主聘僱外國人從事前條第一項第八款至第十一款規定之工作，應先以合理勞動條件在國內辦理招募，經招募無法滿足其需要時，始得就該不足人數提出申請，並應於招募時，將招募全部內容通知其事業單位之工會或勞工，並於外國人預定工作之場所公告之。\n雇主依前項規定在國內辦理招募時，對於公立就業服務機構所推介之求職人，非有正當理由，不得拒絕。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第48條","text":"雇主聘僱外國人工作，應檢具有關文件，向中央主管機關申請許可。但有下列情形之一，不須申請許可：\n一、各級政府及其所屬學術研究機構聘請外國人擔任顧問或研究工作者。\n二、外國人與在中華民國境內設有戶籍之國民結婚，且獲准居留者。\n三、受聘僱於公立或經立案之私立大學進行講座、學術研究經教育部認可者。\n前項申請許可、廢止許可及其他有關聘僱管理之辦法，由中央主管機關會商中央目的事業主管機關定之。\n第一項受聘僱外國人入境前後之健康檢查管理辦法，由中央衛生主管機關會商中央主管機關定之。\n前項受聘僱外國人入境後之健康檢查，由中央衛生主管機關指定醫院辦理之；其受指定之資格條件、指定、廢止指定及其他管理事項之辦法，由中央衛生主管機關定之。\n受聘僱之外國人健康檢查不合格經限令出國者，雇主應即督促其出國。\n中央主管機關對從事第四十六條第一項第八款至第十一款規定工作之外國人，得規定其國別及數額。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第48-1條","text":"本國雇主於第一次聘僱外國人從事家庭看護工作或家庭幫傭前，應參加主管機關或其委託非營利組織辦理之聘前講習，並於申請許可時檢附已參加講習之證明文件。\n前項講習之對象、內容、實施方式、受委託辦理之資格、條件及其他應遵行事項之辦法，由中央主管機關定之。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第49條","text":"各國駐華使領館、駐華外國機構、駐華各國際組織及其人員聘僱外國人工作，應向外交部申請許可；其申請許可、廢止許可及其他有關聘僱管理之辦法，由外交部會商中央主管機關定之。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第50條","text":"雇主聘僱下列學生從事工作，得不受第四十六條第一項規定之限制；其工作時間除寒暑假外，每星期最長為二十小時：\n一、就讀於公立或已立案私立大專校院之外國留學生。\n二、就讀於公立或已立案私立高級中等以上學校之僑生及其他華裔學生。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第51條","text":"雇主聘僱下列外國人從事工作，得不受第四十六條第一項、第三項、第四十七條、第五十二條、第五十三條第三項、第四項、第五十七條第五款、第七十二條第四款及第七十四條規定之限制，並免依第五十五條規定繳納就業安定費：                                                    \n一、獲准居留之難民。\n二、獲准在中華民國境內連續受聘僱從事工作，連續居留滿五年，品行端正，且有住所者。                                            \n三、經獲准與其在中華民國境內設有戶籍之直系血親共同生活者。\n四、經取得永久居留者。\n前項第一款、第三款及第四款之外國人得不經雇主申請，逕向中央主管機關申請許可。                                                    \n外國法人為履行承攬、買賣、技術合作等契約之需要，須指派外國人在中華民國境內從事第四十六條第一項第一款或第二款契約範圍內之工作，於中華民國境內未設立分公司或代表人辦事處者，應由訂約之事業機構或授權之代理人，依第四十八條第二項及第三項所發布之命令規定申請許可。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第52條","text":"聘僱外國人從事第四十六條第一項第一款至第七款及第十一款規定之工作，許可期間最長為三年，期滿有繼續聘僱之需要者，雇主得申請展延。\n聘僱外國人從事第四十六條第一項第八款至第十款規定之工作，許可期間最長為三年。有重大特殊情形者，雇主得申請展延，其情形及期間由行政院以命令定之。但屬重大工程者，其展延期間，最長以六個月為限。\n前項每年得引進總人數，依外籍勞工聘僱警戒指標，由中央主管機關邀集相關機關、勞工、雇主、學者代表協商之。\n受聘僱之外國人於聘僱許可期間無違反法令規定情事而因聘僱關係終止、聘僱許可期間屆滿出國或因健康檢查不合格經返國治療再檢查合格者，得再入國工作。但從事第四十六條第一項第八款至第十款規定工作之外國人，其在中華民國境內工作期間，累計不得逾十二年，且不適用前條第一項第二款之規定。\n前項但書所定之外國人於聘僱許可期間，得請假返國，雇主應予同意；其請假方式、日數、程序及其他相關事項之辦法，由中央主管機關定之。\n從事第四十六條第一項第九款規定家庭看護工作之外國人，且經專業訓練或自力學習，而有特殊表現，符合中央主管機關所定之資格、條件者，其在中華民國境內工作期間累計不得逾十四年。\n前項資格、條件、認定方式及其他相關事項之標準，由中央主管機關會商中央目的事業主管機關定之。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第53條","text":"雇主聘僱之外國人於聘僱許可有效期間內，如需轉換雇主或受聘僱於二以上之雇主者，應由新雇主申請許可。申請轉換雇主時，新雇主應檢附受聘僱外國人之離職證明文件。\n第五十一條第一項第一款、第三款及第四款規定之外國人已取得中央主管機關許可者，不適用前項之規定。                                  \n受聘僱從事第四十六條第一項第一款至第七款規定工作之外國人轉換雇主或工作者，不得從事同條項第八款至第十一款規定之工作。            \n受聘僱從事第四十六條第一項第八款至第十一款規定工作之外國人，不得轉換雇主或工作。但有第五十九條第一項各款規定之情事，經中央主管機關核准者，不在此限。                                            \n前項受聘僱之外國人經許可轉換雇主或工作者，其受聘僱期間應合併計算之，並受第五十二條規定之限制。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第54條","text":"雇主聘僱外國人從事第四十六條第一項第八款至第十一款規定之工作，有下列情事之一者，中央主管機關應不予核發招募許可、聘僱許可或展延聘僱許可之一部或全部；其已核發招募許可者，得中止引進：\n一、於外國人預定工作之場所有第十條規定之罷工或勞資爭議情事。\n二、於國內招募時，無正當理由拒絕聘僱公立就業服務機構所推介之人員或自行前往求職者。\n三、聘僱之外國人行蹤不明或藏匿外國人達一定人數或比率。\n四、曾非法僱用外國人工作。\n五、曾非法解僱本國勞工。\n六、因聘僱外國人而降低本國勞工勞動條件，經當地主管機關查證屬實。\n七、聘僱之外國人妨害社區安寧秩序，經依社會秩序維護法裁處。\n八、曾非法扣留或侵占所聘僱外國人之護照、居留證件或財物。\n九、所聘僱外國人遣送出國所需旅費及收容期間之必要費用，經限期繳納屆期不繳納。\n十、於委任招募外國人時，向私立就業服務機構要求、期約或收受不正利益。\n十一、於辦理聘僱外國人之申請許可、招募、引進或管理事項，提供不實或失效資料。\n十二、刊登不實之求才廣告。\n十三、不符申請規定經限期補正，屆期未補正。\n十四、違反本法或依第四十八條第二項、第三項、第四十九條所發布之命令。\n十五、違反職業安全衛生法規定，致所聘僱外國人發生死亡、喪失部分或全部工作能力，且未依法補償或賠償。\n十六、其他違反保護勞工之法令情節重大者。\n前項第三款至第十六款規定情事，以申請之日前二年內發生者為限。\n第一項第三款之人數、比率，由中央主管機關公告之。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第55條","text":"雇主聘僱外國人從事第四十六條第一項第八款至第十款規定之工作，應向中央主管機關設置之就業安定基金專戶繳納就業安定費，作為加強辦理有關促進國民就業、提升勞工福祉及處理有關外國人聘僱管理事務之用。\n前項就業安定費之數額，由中央主管機關考量國家經濟發展、勞動供需及相關勞動條件，並依其行業別及工作性質會商相關機關定之。\n雇主或被看護者符合社會救助法規定之低收入戶或中低收入戶、依身心障礙者權益保障法領取生活補助費，或依老人福利法領取中低收入生活津貼者，其聘僱外國人從事第四十六條第一項第九款規定之家庭看護工作，免繳納第一項之就業安定費。\n第一項受聘僱之外國人有連續曠職三日失去聯繫或聘僱關係終止之情事，經雇主依規定通知而廢止聘僱許可者，雇主無須再繳納就業安定費。\n雇主未依規定期限繳納就業安定費者，得寬限三十日；於寬限期滿仍未繳納者，自寬限期滿之翌日起至完納前一日止，每逾一日加徵其未繳就業安定費百分之零點三滯納金。但以其未繳之就業安定費百分之三十為限。\n加徵前項滯納金三十日後，雇主仍未繳納者，由中央主管機關就其未繳納之就業安定費及滯納金移送強制執行，並得廢止其聘僱許可之一部或全部。\n主管機關並應定期上網公告基金運用之情形及相關會議紀錄。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第56條","text":"受聘僱之外國人有連續曠職三日失去聯繫或聘僱關係終止之情事，雇主應於三日內以書面載明相關事項通知當地主管機關、入出國管理機關及警察機關。但受聘僱之外國人有曠職失去聯繫之情事，雇主得以書面通知入出國管理機關及警察機關執行查察。\n受聘僱外國人有遭受雇主不實之連續曠職三日失去聯繫通知情事者，得向當地主管機關申訴。經查證確有不實者，中央主管機關應撤銷原廢止聘僱許可及限令出國之行政處分。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第57條","text":"雇主聘僱外國人不得有下列情事：\n一、聘僱未經許可、許可失效或他人所申請聘僱之外國人。\n二、以本人名義聘僱外國人為他人工作。\n三、指派所聘僱之外國人從事許可以外之工作。\n四、未經許可，指派所聘僱從事第四十六條第一項第八款至第十款規定工作之外國人變更工作場所。\n五、未依規定安排所聘僱之外國人接受健康檢查或未依規定將健康檢查結果函報衛生主管機關。\n六、因聘僱外國人致生解僱或資遣本國勞工之結果。\n七、對所聘僱之外國人以強暴脅迫或其他非法之方法，強制其從事勞動。\n八、非法扣留或侵占所聘僱外國人之護照、居留證件或財物。\n九、其他違反本法或依本法所發布之命令。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第58條","text":"外國人於聘僱許可有效期間內，因不可歸責於雇主之原因出國、死亡或發生行蹤不明之情事經依規定通知入出國管理機關及警察機關滿三個月仍未查獲者，雇主得向中央主管機關申請遞補。\n雇主聘僱外國人從事第四十六條第一項第九款規定之家庭看護工作，因不可歸責之原因，並有下列情事之一者，亦得向中央主管機關申請遞補：\n一、外國人於入出國機場或收容單位發生行蹤不明之情事，依規定通知入出國管理機關及警察機關。\n二、外國人於雇主處所發生行蹤不明之情事，依規定通知入出國管理機關及警察機關滿一個月仍未查獲。\n三、外國人於聘僱許可有效期間內經雇主同意轉換雇主或工作，由新雇主接續聘僱，或經中央主管機關廢止聘僱許可逾一個月未由新雇主接續聘僱。\n前二項遞補之聘僱許可期間，以補足原聘僱許可期間為限；原聘僱許可所餘期間不足六個月者，不予遞補。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第59條","text":"外國人受聘僱從事第四十六條第一項第八款至第十一款規定之工作，有下列情事之一者，經中央主管機關核准，得轉換雇主或工作：\n一、雇主或被看護者死亡或移民者。\n二、船舶被扣押、沈沒或修繕而無法繼續作業者。\n三、雇主關廠、歇業或不依勞動契約給付工作報酬經終止勞動契約者。\n四、其他不可歸責於受聘僱外國人之事由者。\n前項轉換雇主或工作之程序，由中央主管機關另定之。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第60條","text":"雇主所聘僱之外國人，經入出國管理機關依規定遣送出國者，其遣送所需之旅費及收容期間之必要費用，應由下列順序之人負擔：\n一、非法容留、聘僱或媒介外國人從事工作者。\n二、遣送事由可歸責之雇主。\n三、被遣送之外國人。\n前項第一款有數人者，應負連帶責任。\n第一項費用，由就業安定基金先行墊付，並於墊付後，由該基金主管機關通知應負擔者限期繳納；屆期不繳納者，移送強制執行。\n雇主所繳納之保證金，得檢具繳納保證金款項等相關證明文件，向中央主管機關申請返還。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第61條","text":"外國人在受聘僱期間死亡，應由雇主代為處理其有關喪葬事務。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第62條","text":"主管機關、入出國管理機關、警察機關、海岸巡防機關或其他司法警察機關得指派人員攜帶證明文件，至外國人工作之場所或可疑有外國人違法工作之場所，實施檢查。\n對前項之檢查，雇主、雇主代理人、外國人及其他有關人員不得規避、妨礙或拒絕。","title":"第 五 章 外國人之聘僱與管理"},{"no":"第63條","text":"違反第四十四條或第五十七條第一款、第二款規定者，處新臺幣十五萬元以上七十五萬元以下罰鍰。五年內再違反者，處三年以下有期徒刑、拘役或科或併科新臺幣一百二十萬元以下罰金。\n法人之代表人、法人或自然人之代理人、受僱人或其他從業人員，因執行業務違反第四十四條或第五十七條第一款、第二款規定者，除依前項規定處罰其行為人外，對該法人或自然人亦科處前項之罰鍰或罰金。","title":"第 六 章 罰則"},{"no":"第64條","text":"違反第四十五條規定者，處新臺幣十萬元以上五十萬元以下罰鍰。五年內再違反者，處一年以下有期徒刑、拘役或科或併科新臺幣六十萬元以下罰金。\n意圖營利而違反第四十五條規定者，處三年以下有期徒刑、拘役或科或併科新臺幣一百二十萬元以下罰金。\n法人之代表人、法人或自然人之代理人、受僱人或其他從業人員，因執行業務違反第四十五條規定者，除依前二項規定處罰其行為人外，對該法人或自然人亦科處各該項之罰鍰或罰金。","title":"第 六 章 罰則"},{"no":"第65條","text":"違反第五條第一項、第二項第一款、第四款、第五款、第三十四條第二項、第四十條第一項第二款、第七款至第九款、第十八款規定者，處新臺幣三十萬元以上一百五十萬元以下罰鍰。\n未經許可從事就業服務業務違反第四十條第一項第二款、第七款至第九款、第十八款規定者，依前項規定處罰之。\n違反第五條第一項規定經處以罰鍰者，直轄市、縣（市）主管機關應公布其姓名或名稱、負責人姓名，並限期令其改善；屆期未改善者，應按次處罰。","title":"第 六 章 罰則"},{"no":"第66條","text":"違反第四十條第一項第五款規定者，按其要求、期約或收受超過規定標準之費用或其他不正利益相當之金額，處十倍至二十倍罰鍰。\n未經許可從事就業服務業務違反第四十條第一項第五款規定者，依前項規定處罰之。","title":"第 六 章 罰則"},{"no":"第67條","text":"違反第五條第二項第二款、第三款、第六款、第十條、第三十六條第一項、第三十七條、第三十九條、第四十條第一項第一款、第三款、第四款、第六款、第十款至第十七款、第十九款、第二十款、第五十七條第五款、第八款、第九款或第六十二條第二項規定，處新臺幣六萬元以上三十萬元以下罰鍰。\n未經許可從事就業服務業務違反第四十條第一項第一款、第三款、第四款、第六款或第十款規定者，依前項規定處罰之。","title":"第 六 章 罰則"},{"no":"第68條","text":"違反第九條、第三十三條第一項、第四十一條、第四十三條、第五十六條第一項、第五十七條第三款、第四款或第六十一條規定者，處新臺幣三萬元以上十五萬元以下罰鍰。\n違反第五十七條第六款規定者，按被解僱或資遣之人數，每人處新臺幣二萬元以上十萬元以下罰鍰。\n違反第四十三條規定之外國人，應即令其出國，不得再於中華民國境內工作。\n違反第四十三條規定或有第七十四條第一項、第二項規定情事之外國人，經限期令其出國，屆期不出國者，入出國管理機關得強制出國，於未出國前，入出國管理機關得收容之。","title":"第 六 章 罰則"},{"no":"第69條","text":"私立就業服務機構有下列情事之一者，由主管機關處一年以下停業處分：\n一、違反第四十條第一項第四款至第六款、第八款或第四十五條規定。\n二、同一事由，受罰鍰處分三次，仍未改善。\n三、一年內受罰鍰處分四次以上。","title":"第 六 章 罰則"},{"no":"第70條","text":"私立就業服務機構有下列情事之一者，主管機關得廢止其設立許可：\n一、違反第三十八條、第四十條第一項第二款、第七款、第九款、第十四款、第十八款規定。\n二、一年內受停業處分二次以上。\n私立就業服務機構經廢止設立許可者，其負責人或代表人於五年內再行申請設立私立就業服務機構，主管機關應不予受理。","title":"第 六 章 罰則"},{"no":"第71條","text":"就業服務專業人員違反第三十七條規定者，中央主管機關得廢止其就業服務專業人員證書。","title":"第 六 章 罰則"},{"no":"第72條","text":"雇主有下列情事之一者，應廢止其招募許可及聘僱許可之一部或全部：\n一、有第五十四條第一項各款所定情事之一。\n二、有第五十七條第一款、第二款、第六款至第九款規定情事之一。\n三、有第五十七條第三款、第四款規定情事之一，經限期改善，屆期未改善。\n四、有第五十七條第五款規定情事，經衛生主管機關通知辦理仍未辦理。\n五、違反第六十條規定。","title":"第 六 章 罰則"},{"no":"第73條","text":"雇主聘僱之外國人，有下列情事之一者，廢止其聘僱許可：\n一、為申請許可以外之雇主工作。\n二、非依雇主指派即自行從事許可以外之工作。\n三、連續曠職三日失去聯繫或聘僱關係終止。\n四、拒絕接受健康檢查、提供不實檢體、檢查不合格、身心狀況無法勝任所指派之工作或罹患經中央衛生主管機關指定之傳染病。\n五、違反依第四十八條第二項、第三項、第四十九條所發布之命令，情節重大。\n六、違反其他中華民國法令，情節重大。\n七、依規定應提供資料，拒絕提供或提供不實。","title":"第 六 章 罰則"},{"no":"第74條","text":"聘僱許可期間屆滿或經依前條規定廢止聘僱許可之外國人，除本法另有規定者外，應即令其出國，不得再於中華民國境內工作。\n受聘僱之外國人有連續曠職三日失去聯繫情事者，於廢止聘僱許可前，入出國業務之主管機關得即令其出國。\n有下列情事之一者，不適用第一項關於即令出國之規定：\n一、依本法規定受聘僱從事工作之外國留學生、僑生或華裔學生，聘僱許可期間屆滿或有前條第一款至第五款規定情事之一。\n二、受聘僱之外國人於受聘僱期間，未依規定接受定期健康檢查或健康檢查不合格，經衛生主管機關同意其再檢查，而再檢查合格。","title":"第 六 章 罰則"},{"no":"第75條","text":"本法所定罰鍰，由直轄市及縣（市）主管機關處罰之。","title":"第 六 章 罰則"},{"no":"第76條","text":"依本法所處之罰鍰，經限期繳納，屆期未繳納者，移送強制執行。","title":"第 六 章 罰則"},{"no":"第77條","text":"本法修正施行前，已依有關法令申請核准受聘僱在中華民國境內從事工作之外國人，本法修正施行後，其原核准工作期間尚未屆滿者，在屆滿前，得免依本法之規定申請許可。","title":"第 七 章 附則"},{"no":"第78條","text":"各國駐華使領館、駐華外國機構及駐華各國際組織人員之眷屬或其他經外交部專案彙報中央主管機關之外國人，其在中華民國境內有從事工作之必要者，由該外國人向外交部申請許可。\n前項外國人在中華民國境內從事工作，不適用第四十六條至第四十八條、第五十條、第五十二條至第五十六條、第五十八條至第六十一條及第七十四條規定。\n第一項之申請許可、廢止許可及其他應遵行事項之辦法，由外交部會同中央主管機關定之。","title":"第 七 章 附則"},{"no":"第79條","text":"無國籍人、中華民國國民兼具外國國籍而未在國內設籍者，其受聘僱從事工作，依本法有關外國人之規定辦理。","title":"第 七 章 附則"},{"no":"第80條","text":"大陸地區人民受聘僱於臺灣地區從事工作，其聘僱及管理，除法律另有規定外，準用第五章相關之規定。","title":"第 七 章 附則"},{"no":"第81條","text":"主管機關依本法規定受理申請許可及核發證照，應收取審查費及證照費；其費額，由中央主管機關定之。","title":"第 七 章 附則"},{"no":"第82條","text":"本法施行細則，由中央主管機關定之。","title":"第 七 章 附則"},{"no":"第83條","text":"本法施行日期，除中華民國九十一年一月二十一日修正公布之第四十八條第一項至第三項規定由行政院以命令定之，及中華民國九十五年五月五日修正之條文自中華民國九十五年七月一日施行外，自公布日施行。","title":"第 七 章 附則"}],"tags":["勞動","就業服務","派遣"],"note":"第 5 條就業歧視、第 46 條以下外國人聘僱；派遣相關規範主要在勞基法第 2 條、第 17 條之 1。"},{"id":"C08","name":"勞動部（行政院勞工委員會）指定公部門人員適用勞動基準法之公告","pcode":"","level":"公告（勞基法第 3 條第 3 項指定）","authority":"勞動部","category":"行政＞勞動部＞勞動條件及就業平等","modified_date":"2007-11-30","history":[{"date":"1998-07-01","summary":"勞委會公告公務機構之技工、駕駛人、工友及清潔隊員等自 87.7.1 起適用勞基法（同批尚含醫療保健服務業〈醫師除外〉、國會助理等）"},{"date":"2007-11-30","summary":"勞委會 96.11.30 勞動 1 字第 0960130914 號公告：公部門各業（公務機構、公立教育訓練服務業、公立社會福利機構、公立學術研究服務業、公立藝文業等）非依公務人員法制進用之臨時人員，自 97.1.1 起適用勞基法；但依聘用人員聘用條例、約僱人員僱用辦法進用者，及已另案指定適用之技工、駕駛、工友、清潔隊員、國會助理不在此列"}],"url":"https://www.mol.gov.tw/topic/3066/5834/22675/","articles":[],"tags":["勞動","勞基法","臨時人員","約用","工友","技工","公告"],"note":"來源：勞動部網站「勞動基準法適用行業」專區及常見問答（www.mol.gov.tw 非本環境可連網域，內容依 WebSearch 摘要記錄；公告字號引自新竹市政府轉載文件）。另勞保局說明各公務機構自 95.1.1 起應為非依公務人員法制進用之臨時人員提繳勞退。"},{"id":"D01","name":"訴願法","pcode":"A0030020","level":"法律","authority":"行政（院本部）","category":"行政＞院本部＞通用目","modified_date":"2012-06-27","history":[{"date":"1930-03-24","summary":"中華民國十九年三月二十四日國民政府制定公布全文 14 條"},{"date":"1937-01-08","summary":"中華民國二十六年一月八日國民政府修正公布全文 13 條"},{"date":"1970-12-23","summary":"中華民國五十九年十二月二十三日總統令修正公布全文 28 條"},{"date":"1979-12-07","summary":"中華民國六十八年十二月七日總統令修正公布第 26 條條文"},{"date":"1995-01-16","summary":"中華民國八十四年一月十六日總統（84）華總（一）義字第 0196 號令修正公布第 26 條條文"},{"date":"1998-10-28","summary":"中華民國八十七年十月二十八日總統（87）華總（一）義字第 8700221320 號令修正公布全文 101 條：依第 101 條規定：施行日期，由行政院以命令定之中華民國八十八年七月三十一日行政院（88）台規字第 29626 號令發布：本次修正條文，定自八十九年七月一日起施行"},{"date":"2000-06-14","summary":"中華民國八十九年六月十四日總統（89）華總（一）義字第 8900146990 號令修正公布第 4、9、41 條條文；施行日期，由行政院以命令定之中華民國八十九年六月二十三日行政院臺 89 規字第 18236 號令發布定自八十九年七月一日施行"},{"date":"2012-06-27","summary":"中華民國一百零一年六月二十七日總統華總一義字第 10100146371 號令修正公布第 90 條條文；施行日期，由行政院以命令定之中華民國一百零一年七月十二日行政院院臺規字第 1010136526 號令發布定自一百零一年九月六日施行"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030020","articles":[{"no":"第1條","text":"人民對於中央或地方機關之行政處分，認為違法或不當，致損害其權利或利益者，得依本法提起訴願。但法律另有規定者，從其規定。\n各級地方自治團體或其他公法人對上級監督機關之行政處分，認為違法或不當，致損害其權利或利益者，亦同。","title":"第 一 節 訴願事件"},{"no":"第2條","text":"人民因中央或地方機關對其依法申請之案件，於法定期間內應作為而不作為，認為損害其權利或利益者，亦得提起訴願。\n前項期間，法令未規定者，自機關受理申請之日起為二個月。","title":"第 一 節 訴願事件"},{"no":"第3條","text":"本法所稱行政處分，係指中央或地方機關就公法上具體事件所為之決定或其他公權力措施而對外直接發生法律效果之單方行政行為。\n前項決定或措施之相對人雖非特定，而依一般性特徵可得確定其範圍者，亦為行政處分。有關公物之設定、變更、廢止或一般使用者，亦同。","title":"第 一 節 訴願事件"},{"no":"第4條","text":"訴願之管轄如左：\n一、不服鄉（鎮、市）公所之行政處分者，向縣（市）政府提起訴願。\n二、不服縣（市）政府所屬各級機關之行政處分者，向縣（市）政府提起訴願。\n三、不服縣（市）政府之行政處分者，向中央主管部、會、行、處、局、署提起訴願。\n四、不服直轄市政府所屬各級機關之行政處分者，向直轄市政府提起訴願。\n五、不服直轄市政府之行政處分者，向中央主管部、會、行、處、局、署提起訴願。\n六、不服中央各部、會、行、處、局、署所屬機關之行政處分者，向各部、會、行、處、局、署提起訴願。\n七、不服中央各部、會、行、處、局、署之行政處分者，向主管院提起訴願。\n八、不服中央各院之行政處分者，向原院提起訴願。","title":"第 二 節 管轄"},{"no":"第5條","text":"人民對於前條以外之中央或地方機關之行政處分提起訴願時，應按其管轄等級，比照前條之規定為之。\n訴願管轄，法律另有規定依其業務監督定之者，從其規定。","title":"第 二 節 管轄"},{"no":"第6條","text":"對於二以上不同隸屬或不同層級之機關共為之行政處分，應向其共同之上級機關提起訴願。","title":"第 二 節 管轄"},{"no":"第7條","text":"無隸屬關係之機關辦理受託事件所為之行政處分，視為委託機關之行政處分，其訴願之管轄，比照第四條之規定，向原委託機關或其直接上級機關提起訴願。","title":"第 二 節 管轄"},{"no":"第8條","text":"有隸屬關係之下級機關依法辦理上級機關委任事件所為之行政處分，為受委任機關之行政處分，其訴願之管轄，比照第四條之規定，向受委任機關或其直接上級機關提起訴願。","title":"第 二 節 管轄"},{"no":"第9條","text":"直轄市政府、縣（市）政府或其所屬機關及鄉（鎮、市）公所依法辦理上級政府或其所屬機關委辦事件所為之行政處分，為受委辦機關之行政處分，其訴願之管轄，比照第四條之規定，向受委辦機關之直接上級機關提起訴願。","title":"第 二 節 管轄"},{"no":"第10條","text":"依法受中央或地方機關委託行使公權力之團體或個人，以其團體或個人名義所為之行政處分，其訴願之管轄，向原委託機關提起訴願。","title":"第 二 節 管轄"},{"no":"第11條","text":"原行政處分機關裁撤或改組，應以承受其業務之機關視為原行政處分機關，比照前七條之規定，向承受其業務之機關或其直接上級機關提起訴願。","title":"第 二 節 管轄"},{"no":"第12條","text":"數機關於管轄權有爭議或因管轄不明致不能辨明有管轄權之機關者，由其共同之直接上級機關確定之。\n無管轄權之機關就訴願所為決定，其上級機關應依職權或依申請撤銷之，並命移送於有管轄權之機關。","title":"第 二 節 管轄"},{"no":"第13條","text":"原行政處分機關之認定，以實施行政處分時之名義為準。但上級機關本於法定職權所為之行政處分，交由下級機關執行者，以該上級機關為原行政處分機關。","title":"第 二 節 管轄"},{"no":"第14條","text":"訴願之提起，應自行政處分達到或公告期滿之次日起三十日內為之。\n利害關係人提起訴願者，前項期間自知悉時起算。但自行政處分達到或公告期滿後，已逾三年者，不得提起。\n訴願之提起，以原行政處分機關或受理訴願機關收受訴願書之日期為準。\n訴願人誤向原行政處分機關或受理訴願機關以外之機關提起訴願者，以該機關收受之日，視為提起訴願之日。","title":"第 三 節 期日及期間"},{"no":"第15條","text":"訴願人因天災或其他不應歸責於己之事由，致遲誤前條之訴願期間者，於其原因消滅後十日內，得以書面敘明理由向受理訴願機關申請回復原狀。但遲誤訴願期間已逾一年者，不得為之。\n申請回復原狀，應同時補行期間內應為之訴願行為。","title":"第 三 節 期日及期間"},{"no":"第16條","text":"訴願人不在受理訴願機關所在地住居者，計算法定期間，應扣除其在途期間。但有訴願代理人住居受理訴願機關所在地，得為期間內應為之訴願行為者，不在此限。\n前項扣除在途期間辦法，由行政院定之。","title":"第 三 節 期日及期間"},{"no":"第17條","text":"期間之計算，除法律另有規定外，依民法之規定。","title":"第 三 節 期日及期間"},{"no":"第18條","text":"自然人、法人、非法人之團體或其他受行政處分之相對人及利害關係人得提起訴願。","title":"第 四 節 訴願人"},{"no":"第19條","text":"能獨立以法律行為負義務者，有訴願能力。","title":"第 四 節 訴願人"},{"no":"第20條","text":"無訴願能力人應由其法定代理人代為訴願行為。\n地方自治團體、法人、非法人之團體應由其代表人或管理人為訴願行為。\n關於訴願之法定代理，依民法規定。","title":"第 四 節 訴願人"},{"no":"第21條","text":"二人以上得對於同一原因事實之行政處分，共同提起訴願。\n前項訴願之提起，以同一機關管轄者為限。","title":"第 四 節 訴願人"},{"no":"第22條","text":"共同提起訴願，得選定其中一人至三人為代表人。\n選定代表人應於最初為訴願行為時，向受理訴願機關提出文書證明。","title":"第 四 節 訴願人"},{"no":"第23條","text":"共同提起訴願，未選定代表人者，受理訴願機關得限期通知其選定；逾期不選定者，得依職權指定之。","title":"第 四 節 訴願人"},{"no":"第24條","text":"代表人經選定或指定後，由其代表全體訴願人為訴願行為。但撤回訴願，非經全體訴願人書面同意，不得為之。","title":"第 四 節 訴願人"},{"no":"第25條","text":"代表人經選定或指定後，仍得更換或增減之。\n前項代表人之更換或增減，非以書面通知受理訴願機關，不生效力。","title":"第 四 節 訴願人"},{"no":"第26條","text":"代表人有二人以上者，均得單獨代表共同訴願人為訴願行為。","title":"第 四 節 訴願人"},{"no":"第27條","text":"代表人之代表權不因其他共同訴願人死亡、喪失行為能力或法定代理變更而消滅。","title":"第 四 節 訴願人"},{"no":"第28條","text":"與訴願人利害關係相同之人，經受理訴願機關允許，得為訴願人之利益參加訴願。受理訴願機關認有必要時，亦得通知其參加訴願。\n訴願決定因撤銷或變更原處分，足以影響第三人權益者，受理訴願機關應於作成訴願決定之前，通知其參加訴願程序，表示意見。","title":"第 四 節 訴願人"},{"no":"第29條","text":"申請參加訴願，應以書面向受理訴願機關為之。\n參加訴願應以書面記載左列事項：\n一、本訴願及訴願人。\n二、參加人與本訴願之利害關係。\n三、參加訴願之陳述。","title":"第 四 節 訴願人"},{"no":"第30條","text":"通知參加訴願，應記載訴願意旨、通知參加之理由及不參加之法律效果，送達於參加人，並副知訴願人。\n受理訴願機關為前項之通知前，得通知訴願人或得參加訴願之第三人以書面陳述意見。","title":"第 四 節 訴願人"},{"no":"第31條","text":"訴願決定對於參加人亦有效力。經受理訴願機關通知其參加或允許其參加而未參加者，亦同。","title":"第 四 節 訴願人"},{"no":"第32條","text":"訴願人或參加人得委任代理人進行訴願。每一訴願人或參加人委任之訴願代理人不得超過三人。","title":"第 四 節 訴願人"},{"no":"第33條","text":"左列之人，得為訴願代理人：\n一、律師。\n二、依法令取得與訴願事件有關之代理人資格者。\n三、具有該訴願事件之專業知識者。\n四、因業務或職務關係為訴願人之代理人者。\n五、與訴願人有親屬關係者。\n前項第三款至第五款之訴願代理人，受理訴願機關認為不適當時，得禁止之，並以書面通知訴願人或參加人。","title":"第 四 節 訴願人"},{"no":"第34條","text":"訴願代理人應於最初為訴願行為時，向受理訴願機關提出委任書。","title":"第 四 節 訴願人"},{"no":"第35條","text":"訴願代理人就其受委任之事件，得為一切訴願行為。但撤回訴願，非受特別委任不得為之。","title":"第 四 節 訴願人"},{"no":"第36條","text":"訴願代理人有二人以上者，均得單獨代理訴願人。\n違反前項規定而為委任者，其訴願代理人仍得單獨代理。","title":"第 四 節 訴願人"},{"no":"第37條","text":"訴願代理人事實上之陳述，經到場之訴願人本人即時撤銷或更正者，不生效力。","title":"第 四 節 訴願人"},{"no":"第38條","text":"訴願代理權不因訴願人本人死亡、破產或喪失訴願能力而消滅。法定代理有變更、機關經裁撤、改組或公司、團體經解散、變更組織者，亦同。","title":"第 四 節 訴願人"},{"no":"第39條","text":"訴願委任之解除，應由訴願人、參加人或訴願代理人以書面通知受理訴願機關。","title":"第 四 節 訴願人"},{"no":"第40條","text":"訴願委任之解除，由訴願代理人提出者，自為解除意思表示之日起十五日內，仍應為維護訴願人或參加人權利或利益之必要行為。","title":"第 四 節 訴願人"},{"no":"第41條","text":"訴願人、參加人或訴願代理人經受理訴願機關之許可，得於期日偕同輔佐人到場。\n受理訴願機關認為必要時，亦得命訴願人、參加人或訴願代理人偕同輔佐人到場。\n前二項之輔佐人，受理訴願機關認為不適當時，得廢止其許可或禁止其續為輔佐。","title":"第 四 節 訴願人"},{"no":"第42條","text":"輔佐人到場所為之陳述，訴願人、參加人或訴願代理人不即時撤銷或更正者，視為其所自為。","title":"第 四 節 訴願人"},{"no":"第43條","text":"送達除別有規定外，由受理訴願機關依職權為之。","title":"第 五 節 送達"},{"no":"第44條","text":"對於無訴願能力人為送達者，應向其法定代理人為之；未經陳明法定代理人者，得向該無訴願能力人為送達。\n對於法人或非法人之團體為送達者，應向其代表人或管理人為之。\n法定代理人、代表人或管理人有二人以上者，送達得僅向其中一人為之。","title":"第 五 節 送達"},{"no":"第45條","text":"對於在中華民國有事務所或營業所之外國法人或團體為送達者，應向其在中華民國之代表人或管理人為之。\n前項代表人或管理人有二人以上者，送達得僅向其中一人為之。","title":"第 五 節 送達"},{"no":"第46條","text":"訴願代理人除受送達之權限受有限制者外，送達應向該代理人為之。但受理訴願機關認為必要時，得送達於訴願人或參加人本人。","title":"第 五 節 送達"},{"no":"第47條","text":"訴願文書之送達，應註明訴願人、參加人或其代表人、訴願代理人住、居所、事務所或營業所，交付郵政機關以訴願文書郵務送達證書發送。\n訴願文書不能為前項送達時，得由受理訴願機關派員或囑託原行政處分機關或該管警察機關送達，並由執行送達人作成送達證書。\n訴願文書之送達，除前二項規定外，準用行政訴訟法第六十七條至第六十九條、第七十一條至第八十三條之規定。","title":"第 五 節 送達"},{"no":"第48條","text":"關於訴願事件之文書，受理訴願機關應保存者，應由承辦人員編為卷宗。","title":"第 六 節 訴願卷宗"},{"no":"第49條","text":"訴願人、參加人或訴願代理人得向受理訴願機關請求閱覽、抄錄、影印或攝影卷內文書，或預納費用請求付與繕本、影本或節本。\n前項之收費標準，由主管院定之。","title":"第 六 節 訴願卷宗"},{"no":"第50條","text":"第三人經訴願人同意或釋明有法律上之利害關係，經受理訴願機關許可者，亦得為前條之請求。","title":"第 六 節 訴願卷宗"},{"no":"第51條","text":"左列文書，受理訴願機關應拒絕前二條之請求：\n一、訴願決定擬辦之文稿。\n二、訴願決定之準備或審議文件。\n三、為第三人正當權益有保密之必要者。\n四、其他依法律或基於公益，有保密之必要者。","title":"第 六 節 訴願卷宗"},{"no":"第52條","text":"各機關辦理訴願事件，應設訴願審議委員會，組成人員以具有法制專長者為原則。\n訴願審議委員會委員，由本機關高級職員及遴聘社會公正人士、學者、專家擔任之；其中社會公正人士、學者、專家人數不得少於二分之一。\n訴願審議委員會組織規程及審議規則，由主管院定之。","title":"第 二 章 訴願審議委員會"},{"no":"第53條","text":"訴願決定應經訴願審議委員會會議之決議，其決議以委員過半數之出席，出席委員過半數之同意行之。","title":"第 二 章 訴願審議委員會"},{"no":"第54條","text":"訴願審議委員會審議訴願事件，應指定人員製作審議紀錄附卷。委員於審議中所持與決議不同之意見，經其請求者，應列入紀錄。\n訴願審議經言詞辯論者，應另行製作筆錄，編為前項紀錄之附件，並準用民事訴訟法第二百十二條至第二百十九條之規定。","title":"第 二 章 訴願審議委員會"},{"no":"第55條","text":"訴願審議委員會主任委員或委員對於訴願事件有利害關係者，應自行迴避，不得參與審議。","title":"第 二 章 訴願審議委員會"},{"no":"第56條","text":"訴願應具訴願書，載明左列事項，由訴願人或代理人簽名或蓋章：\n一、訴願人之姓名、出生年月日、住、居所、身分證明文件字號。如係法人或其他設有管理人或代表人之團體，其名稱、事務所或營業所及管理人或代表人之姓名、出生年月日、住、居所。\n二、有訴願代理人者，其姓名、出生年月日、住、居所、身分證明文件字號。\n三、原行政處分機關。\n四、訴願請求事項。\n五、訴願之事實及理由。\n六、收受或知悉行政處分之年、月、日。\n七、受理訴願之機關。\n八、證據。其為文書者，應添具繕本或影本。\n九、年、月、日。\n訴願應附原行政處分書影本。\n依第二條第一項規定提起訴願者，第一項第三款、第六款所列事項，載明應為行政處分之機關、提出申請之年、月、日，並附原申請書之影本及受理申請機關收受證明。","title":"第 一 節 訴願之提起"},{"no":"第57條","text":"訴願人在第十四條第一項所定期間向訴願管轄機關或原行政處分機關作不服原行政處分之表示者，視為已在法定期間內提起訴願。但應於三十日內補送訴願書。","title":"第 一 節 訴願之提起"},{"no":"第58條","text":"訴願人應繕具訴願書經由原行政處分機關向訴願管轄機關提起訴願。\n原行政處分機關對於前項訴願應先行重新審查原處分是否合法妥當，其認訴願為有理由者，得自行撤銷或變更原行政處分，並陳報訴願管轄機關。\n原行政處分機關不依訴願人之請求撤銷或變更原行政處分者，應儘速附具答辯書，並將必要之關係文件，送於訴願管轄機關。\n原行政處分機關檢卷答辯時，應將前項答辯書抄送訴願人。","title":"第 一 節 訴願之提起"},{"no":"第59條","text":"訴願人向受理訴願機關提起訴願者，受理訴願機關應將訴願書影本或副本送交原行政處分機關依前條第二項至第四項規定辦理。","title":"第 一 節 訴願之提起"},{"no":"第60條","text":"訴願提起後，於決定書送達前，訴願人得撤回之。訴願經撤回後，不得復提起同一之訴願。","title":"第 一 節 訴願之提起"},{"no":"第61條","text":"訴願人誤向訴願管轄機關或原行政處分機關以外之機關作不服原行政處分之表示者，視為自始向訴願管轄機關提起訴願。\n前項收受之機關應於十日內將該事件移送於原行政處分機關，並通知訴願人。","title":"第 一 節 訴願之提起"},{"no":"第62條","text":"受理訴願機關認為訴願書不合法定程式，而其情形可補正者，應通知訴願人於二十日內補正。","title":"第 一 節 訴願之提起"},{"no":"第63條","text":"訴願就書面審查決定之。\n受理訴願機關必要時得通知訴願人、參加人或利害關係人到達指定處所陳述意見。\n訴願人或參加人請求陳述意見而有正當理由者，應予到達指定處所陳述意見之機會。","title":"第 二 節 訴願審議"},{"no":"第64條","text":"訴願審議委員會主任委員得指定委員聽取訴願人、參加人或利害關係人到場之陳述。","title":"第 二 節 訴願審議"},{"no":"第65條","text":"受理訴願機關應依訴願人、參加人之申請或於必要時，得依職權通知訴願人、參加人或其代表人、訴願代理人、輔佐人及原行政處分機關派員於指定期日到達指定處所言詞辯論。","title":"第 二 節 訴願審議"},{"no":"第66條","text":"言詞辯論之程序如左：\n一、受理訴願機關陳述事件要旨。\n二、訴願人、參加人或訴願代理人就事件為事實上及法律上之陳述。\n三、原行政處分機關就事件為事實上及法律上之陳述。\n四、訴願或原行政處分機關對他方之陳述或答辯，為再答辯。\n五、受理訴願機關對訴願人及原行政處分機關提出詢問。\n前項辯論未完備者，得再為辯論。","title":"第 二 節 訴願審議"},{"no":"第67條","text":"受理訴願機關應依職權或囑託有關機關或人員，實施調查、檢驗或勘驗，不受訴願人主張之拘束。\n受理訴願機關應依訴願人或參加人之申請，調查證據。但就其申請調查之證據中認為不必要者，不在此限。\n受理訴願機關依職權或依申請調查證據之結果，非經賦予訴願人及參加人表示意見之機會，不得採為對之不利之訴願決定之基礎。","title":"第 二 節 訴願審議"},{"no":"第68條","text":"訴願人或參加人得提出證據書類或證物。但受理訴願機關限定於一定期間內提出者，應於該期間內提出。","title":"第 二 節 訴願審議"},{"no":"第69條","text":"受理訴願機關得依職權或依訴願人、參加人之申請，囑託有關機關、學校、團體或有專門知識經驗者為鑑定。\n受理訴願機關認無鑑定之必要，而訴願人或參加人願自行負擔鑑定費用時，得向受理訴願機關請求准予交付鑑定。受理訴願機關非有正當理由不得拒絕。\n鑑定人由受理訴願機關指定之。\n鑑定人有數人者，得共同陳述意見。但意見不同者，受理訴願機關應使其分別陳述意見。","title":"第 二 節 訴願審議"},{"no":"第70條","text":"鑑定人應具鑑定書陳述意見。必要時，受理訴願機關得請鑑定人到達指定處所說明。","title":"第 二 節 訴願審議"},{"no":"第71條","text":"鑑定所需資料在原行政處分機關或受理訴願機關者，受理訴願機關應告知鑑定人准其利用。但其利用之範圍及方法得限制之。\n鑑定人因行鑑定得請求受理訴願機關調查證據。","title":"第 二 節 訴願審議"},{"no":"第72條","text":"鑑定所需費用由受理訴願機關負擔，並得依鑑定人之請求預行酌給之。\n依第六十九條第二項規定交付鑑定所得結果，據為有利於訴願人或參加人之決定或裁判時，訴願人或參加人得於訴願或行政訴訟確定後三十日內，請求受理訴願機關償還必要之鑑定費用。","title":"第 二 節 訴願審議"},{"no":"第73條","text":"受理訴願機關得依職權或依訴願人、參加人之申請，命文書或其他物件之持有人提出該物件，並得留置之。\n公務員或機關掌管之文書或其他物件，受理訴願機關得調取之。\n前項情形，除有妨害國家機密者外，不得拒絕。","title":"第 二 節 訴願審議"},{"no":"第74條","text":"受理訴願機關得依職權或依訴願人、參加人之申請，就必要之物件或處所實施勘驗。\n受理訴願機關依前項規定實施勘驗時，應將日、時、處所通知訴願人、參加人及有關人員到場。","title":"第 二 節 訴願審議"},{"no":"第75條","text":"原行政處分機關應將據以處分之證據資料提出於受理訴願機關。\n對於前項之證據資料，訴願人、參加人或訴願代理人得請求閱覽、抄錄或影印之。受理訴願機關非有正當理由，不得拒絕。\n第一項證據資料之閱覽、抄錄或影印，受理訴願機關應指定日、時、處所。","title":"第 二 節 訴願審議"},{"no":"第76條","text":"訴願人或參加人對受理訴願機關於訴願程序進行中所為之程序上處置不服者，應併同訴願決定提起行政訴訟。","title":"第 二 節 訴願審議"},{"no":"第77條","text":"訴願事件有左列各款情形之一者，應為不受理之決定：\n一、訴願書不合法定程式不能補正或經通知補正逾期不補正者。\n二、提起訴願逾法定期間或未於第五十七條但書所定期間內補送訴願書者。\n三、訴願人不符合第十八條之規定者。\n四、訴願人無訴願能力而未由法定代理人代為訴願行為，經通知補正逾期不補正者。\n五、地方自治團體、法人、非法人之團體，未由代表人或管理人為訴願行為，經通知補正逾期不補正者。\n六、行政處分已不存在者。\n七、對已決定或已撤回之訴願事件重行提起訴願者。\n八、對於非行政處分或其他依法不屬訴願救濟範圍內之事項提起訴願者。","title":"第 三 節 訴願決定"},{"no":"第78條","text":"分別提起之數宗訴願係基於同一或同種類之事實上或法律上之原因者，受理訴願機關得合併審議，並得合併決定。","title":"第 三 節 訴願決定"},{"no":"第79條","text":"訴願無理由者，受理訴願機關應以決定駁回之。\n原行政處分所憑理由雖屬不當，但依其他理由認為正當者，應以訴願為無理由。\n訴願事件涉及地方自治團體之地方自治事務者，其受理訴願之上級機關僅就原行政處分之合法性進行審查決定。","title":"第 三 節 訴願決定"},{"no":"第80條","text":"提起訴願因逾法定期間而為不受理決定時，原行政處分顯屬違法或不當者，原行政處分機關或其上級機關得依職權撤銷或變更之。但有左列情形之一者，不得為之：\n一、其撤銷或變更對公益有重大危害者。\n二、行政處分受益人之信賴利益顯然較行政處分撤銷或變更所欲維護之公益更值得保護者。\n行政處分受益人有左列情形之一者，其信賴不值得保護：\n一、以詐欺、脅迫或賄賂方法，使原行政處分機關作成行政處分者。\n二、對重要事項提供不正確資料或為不完全陳述，致使原行政處分機關依該資料或陳述而作成行政處分者。\n三、明知原行政處分違法或因重大過失而不知者。\n行政處分之受益人值得保護之信賴利益，因原行政處分機關或其上級機關依第一項規定撤銷或變更原行政處分而受有損失者，應予補償。但其補償額度不得超過受益人因該處分存續可得之利益。","title":"第 三 節 訴願決定"},{"no":"第81條","text":"訴願有理由者，受理訴願機關應以決定撤銷原行政處分之全部或一部，並得視事件之情節，逕為變更之決定或發回原行政處分機關另為處分。但於訴願人表示不服之範圍內，不得為更不利益之變更或處分。\n前項訴願決定撤銷原行政處分，發回原行政處分機關另為處分時，應指定相當期間命其為之。","title":"第 三 節 訴願決定"},{"no":"第82條","text":"對於依第二條第一項提起之訴願，受理訴願機關認為有理由者，應指定相當期間，命應作為之機關速為一定之處分。\n受理訴願機關未為前項決定前，應作為之機關已為行政處分者，受理訴願機關應認訴願為無理由，以決定駁回之。","title":"第 三 節 訴願決定"},{"no":"第83條","text":"受理訴願機關發現原行政處分雖屬違法或不當，但其撤銷或變更於公益有重大損害，經斟酌訴願人所受損害、賠償程度、防止方法及其他一切情事，認原行政處分之撤銷或變更顯與公益相違背時，得駁回其訴願。\n前項情形，應於決定主文中載明原行政處分違法或不當。","title":"第 三 節 訴願決定"},{"no":"第84條","text":"受理訴願機關為前條決定時，得斟酌訴願人因違法或不當處分所受損害，於決定理由中載明由原行政處分機關與訴願人進行協議。\n前項協議，與國家賠償法之協議有同一效力。","title":"第 三 節 訴願決定"},{"no":"第85條","text":"訴願之決定，自收受訴願書之次日起，應於三個月內為之；必要時，得予延長，並通知訴願人及參加人。延長以一次為限，最長不得逾二個月。\n前項期間，於依第五十七條但書規定補送訴願書者，自補送之次日起算，未為補送者，自補送期間屆滿之次日起算；其依第六十二條規定通知補正者，自補正之次日起算；未為補正者，自補正期間屆滿之次日起算。","title":"第 三 節 訴願決定"},{"no":"第86條","text":"訴願之決定以他法律關係是否成立為準據，而該法律關係在訴訟或行政救濟程序進行中者，於該法律關係確定前，受理訴願機關得停止訴願程序之進行，並即通知訴願人及參加人。\n受理訴願機關依前項規定停止訴願程序之進行者，前條所定訴願決定期間，自該法律關係確定之日起，重行起算。","title":"第 三 節 訴願決定"},{"no":"第87條","text":"訴願人死亡者，由其繼承人或其他依法得繼受原行政處分所涉權利或利益之人，承受其訴願。\n法人因合併而消滅者，由因合併而另立或合併後存續之法人，承受其訴願。\n依前二項規定承受訴願者，應於事實發生之日起三十日內，向受理訴願機關檢送因死亡繼受權利或合併事實之證明文件。","title":"第 三 節 訴願決定"},{"no":"第88條","text":"受讓原行政處分所涉權利或利益之人，得檢具受讓證明文件，向受理訴願機關申請許其承受訴願。","title":"第 三 節 訴願決定"},{"no":"第89條","text":"訴願決定書，應載明左列事項：\n一、訴願人姓名、出生年月日、住、居所、身分證明文件字號。如係法人或其他設有管理人或代表人之團體，其名稱、事務所或營業所，管理人或代表人之姓名、出生年月日、住、居所、身分證明文件字號。\n二、有法定代理人或訴願代理人者，其姓名、出生年月日、住、居所、身分證明文件字號。\n三、主文、事實及理由。其係不受理決定者，得不記載事實。\n四、決定機關及其首長。\n五、年、月、日。\n訴願決定書之正本，應於決定後十五日內送達訴願人、參加人及原行政處分機關。","title":"第 三 節 訴願決定"},{"no":"第90條","text":"訴願決定書應附記，如不服決定，得於決定書送達之次日起二個月內向行政法院提起行政訴訟。","title":"第 三 節 訴願決定"},{"no":"第91條","text":"對於得提起行政訴訟之訴願決定，因訴願決定機關附記錯誤，向非管轄機關提起行政訴訟，該機關應於十日內將行政訴訟書狀連同有關資料移送管轄行政法院，並即通知原提起行政訴訟之人。\n有前項規定之情形，行政訴訟書狀提出於非管轄機關者，視為自始向有管轄權之行政法院提起行政訴訟。","title":"第 三 節 訴願決定"},{"no":"第92條","text":"訴願決定機關附記提起行政訴訟期間錯誤時，應由訴願決定機關以通知更正之，並自更正通知送達之日起，計算法定期間。\n訴願決定機關未依第九十條規定為附記，或附記錯誤而未依前項規定通知更正，致原提起行政訴訟之人遲誤行政訴訟期間者，如自訴願決定書送達之日起一年內提起行政訴訟，視為於法定期間內提起。","title":"第 三 節 訴願決定"},{"no":"第93條","text":"原行政處分之執行，除法律另有規定外，不因提起訴願而停止。\n原行政處分之合法性顯有疑義者，或原行政處分之執行將發生難以回復之損害，且有急迫情事，並非為維護重大公共利益所必要者，受理訴願機關或原行政處分機關得依職權或依申請，就原行政處分之全部或一部，停止執行。\n前項情形，行政法院亦得依聲請，停止執行。","title":"第 三 節 訴願決定"},{"no":"第94條","text":"停止執行之原因消滅，或有其他情事變更之情形，受理訴願機關或原行政處分機關得依職權或依申請撤銷停止執行。\n前項情形，原裁定停止執行之行政法院亦得依聲請，撤銷停止執行之裁定。","title":"第 三 節 訴願決定"},{"no":"第95條","text":"訴願之決定確定後，就其事件，有拘束各關係機關之效力；就其依第十條提起訴願之事件，對於受委託行使公權力之團體或個人，亦有拘束力。","title":"第 三 節 訴願決定"},{"no":"第96條","text":"原行政處分經撤銷後，原行政處分機關須重為處分者，應依訴願決定意旨為之，並將處理情形以書面告知受理訴願機關。","title":"第 三 節 訴願決定"},{"no":"第97條","text":"於有左列各款情形之一者，訴願人、參加人或其他利害關係人得對於確定訴願決定，向原訴願決定機關申請再審。但訴願人、參加人或其他利害關係人已依行政訴訟主張其事由或知其事由而不為主張者，不在此限：\n一、適用法規顯有錯誤者。\n二、決定理由與主文顯有矛盾者。\n三、決定機關之組織不合法者。\n四、依法令應迴避之委員參與決定者。\n五、參與決定之委員關於該訴願違背職務，犯刑事上之罪者。\n六、訴願之代理人，關於該訴願有刑事上應罰之行為，影響於決定者。\n七、為決定基礎之證物，係偽造或變造者。\n八、證人、鑑定人或通譯就為決定基礎之證言、鑑定為虛偽陳述者。\n九、為決定基礎之民事、刑事或行政訴訟判決或行政處分已變更者。\n十、發見未經斟酌之證物或得使用該證物者。\n前項聲請再審，應於三十日內提起。\n前項期間，自訴願決定確定時起算。但再審之事由發生在後或知悉在後者，自知悉時起算。","title":"第 四 章 再審程序"},{"no":"第98條","text":"依本法規定所為之訴願、答辯及應備具之書件，應以中文書寫；其科學名詞之譯名以國立編譯館規定者為原則，並應附註外文原名。\n前項書件原係外文者，並應檢附原外文資料。","title":"第 五 章 附則"},{"no":"第99條","text":"本法修正施行前，尚未終結之訴願事件，其以後之訴願程序，依修正之本法規定終結之。\n本法修正施行前，尚未終結之再訴願案件，其以後之再訴願程序，準用修正之本法有關訴願程序規定終結之。","title":"第 五 章 附則"},{"no":"第100條","text":"公務人員因違法或不當處分，涉有刑事或行政責任者，由最終決定之機關於決定後責由該管機關依法辦理。","title":"第 五 章 附則"},{"no":"第101條","text":"本法自公布日施行。\n本法修正條文之施行日期，由行政院以命令定之。","title":"第 五 章 附則"}],"tags":["救濟","訴願"],"note":"第 1 條、第 3 條適用範圍；聘僱契約爭議是否得提訴願，實務上多認屬公法契約應循行政訴訟。"},{"id":"D02","name":"行政訴訟法","pcode":"A0030154","level":"法律","authority":"司法（院本部）","category":"司法＞院本部＞行懲及智財目","modified_date":"2022-06-22","history":[{"date":"1932-11-17","summary":"中華民國二十一年十一月十七日國民政府制定公布全文 27 條；並自中華民國二十二年六月二十三日施行"},{"date":"1937-01-08","summary":"中華民國二十六年一月八日國民政府修正公布全文 29 條"},{"date":"1942-07-27","summary":"中華民國三十一年七月二十七日國民政府修正公布全文 30 條"},{"date":"1969-11-05","summary":"中華民國五十八年十一月五日總統令修正公布第 24 條條文"},{"date":"1975-12-12","summary":"中華民國六十四年十二月十二日總統令修正公布全文 34 條"},{"date":"1998-10-28","summary":"中華民國八十七年十月二十八日總統（87）華總（一）義字第 8700221330 號令修正公布全文 308 條中華民國八十八年七月八日司法院（88）院台廳行一字第 17712 號令定自八十九年七月一日起施行"},{"date":"2007-07-04","summary":"中華民國九十六年七月四日總統華總一義字第 09600083721 號令修正公布 49、98～100、103、104、107、276 條條文；並增訂第 12-1～12-4、98-1～98-6 條條文；施行日期，由司法院以命令定之中華民國九十六年七月三十一日司法院院台廳行一字第 0960016042 號令發布定自九十六年八月十五日施行"},{"date":"2010-01-13","summary":"中華民國九十九年一月十三日總統華總一義字第 09900006281 號令修正公布第 6、12-2、12-4、15、16、18～20、24、37、39、43、57、59、62、64、67、70、73、75、77、81、83、96、97、100、104～106、108、111、112、121、128、129、131、132、141、145、146、149、151、154、163、166、176、189、196、200、204、209、229、230、243、244、253、259、272、273、277、286 條條文；並增訂第 12-5、15-1、15-2、274-1、307-1 條條文；施行日期，由司法院以命令定之中華民國九十九年四月二十三日司法院院台廳行一字第 0990009843 號令發布定自九十九年五月一日施行"},{"date":"2011-05-25","summary":"中華民國一百年五月二十五日總統華總一義字第 10000104001 號令修正公布第 73、229 條條文；增訂第 241-1 條條文；施行日期，由司法院以命令定之中華民國一百年十二月二十六日司法院院台廳行一字第 1000032864 號函定自一百零一年九月六日施行"},{"date":"2011-11-23","summary":"中華民國一百年十一月二十三日總統華總一義字第 10000257891 號令修正公布第 4～6、8、16、21、42、55、63、75、76、106、107、113、114、120、143、148、169、175、183～185、194、199、216、217、219、229、230、233、235、236、238、244、246、248、267、269、275、294、299、300、305～307 條條文、第二編編名及第一章、第二章章名；增訂第 3-1、98-7、104-1、114-1、125-1、175-1、178-1、235-1、236-1、236-2、237-1～237-9、256-1 條條文及第二編第三章章名；刪除第 252 條條文；施行日期，由司法院以命令定之中華民國一百年十二月二十六日司法院院台廳行一字第 1000032864號函定自一百零一年九月六日施行"},{"date":"2013-01-09","summary":"中華民國一百零二年一月九日總統華總一義字第 10200000791 號令修正公布第 131 條條文；並增訂第 130-1 條條文；施行日期，由司法院以命令定之中華民國一百零二年六月七日司法院院台廳行一字第 1020015332 號函定自一百零二年六月十日施行"},{"date":"2014- 8286 號令發布定自一百十二年八月十五日施行"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=A0030154","articles":[{"no":"第1條","text":"行政訴訟以保障人民權益，確保國家行政權之合法行使，增進司法功能為宗旨。","title":"第 一 章 行政訴訟事件"},{"no":"第2條","text":"公法上之爭議，除法律別有規定外，得依本法提起行政訴訟。","title":"第 一 章 行政訴訟事件"},{"no":"第3條","text":"前條所稱之行政訴訟，指撤銷訴訟、確認訴訟及給付訴訟。","title":"第 一 章 行政訴訟事件"},{"no":"第3-1條","text":"本法所稱高等行政法院，指高等行政法院高等行政訴訟庭；所稱地方行政法院，指高等行政法院地方行政訴訟庭。","title":"第 一 章 行政訴訟事件"},{"no":"第4條","text":"人民因中央或地方機關之違法行政處分，認為損害其權利或法律上之利益，經依訴願法提起訴願而不服其決定，或提起訴願逾三個月不為決定，或延長訴願決定期間逾二個月不為決定者，得向行政法院提起撤銷訴訟。\n逾越權限或濫用權力之行政處分，以違法論。\n訴願人以外之利害關係人，認為第一項訴願決定，損害其權利或法律上之利益者，得向行政法院提起撤銷訴訟。","title":"第 一 章 行政訴訟事件"},{"no":"第5條","text":"人民因中央或地方機關對其依法申請之案件，於法令所定期間內應作為而不作為，認為其權利或法律上利益受損害者，經依訴願程序後，得向行政法院提起請求該機關應為行政處分或應為特定內容之行政處分之訴訟。\n人民因中央或地方機關對其依法申請之案件，予以駁回，認為其權利或法律上利益受違法損害者，經依訴願程序後，得向行政法院提起請求該機關應為行政處分或應為特定內容之行政處分之訴訟。","title":"第 一 章 行政訴訟事件"},{"no":"第6條","text":"確認行政處分無效及確認公法上法律關係成立或不成立之訴訟，非原告有即受確認判決之法律上利益者，不得提起之。其確認已執行而無回復原狀可能之行政處分或已消滅之行政處分為違法之訴訟，亦同。\n確認行政處分無效之訴訟，須已向原處分機關請求確認其無效未被允許，或經請求後於三十日內不為確答者，始得提起之。\n確認訴訟，於原告得提起或可得提起撤銷訴訟、課予義務訴訟或一般給付訴訟者，不得提起之。但確認行政處分無效之訴訟，不在此限。\n應提起撤銷訴訟、課予義務訴訟，誤為提起確認行政處分無效之訴訟，其未經訴願程序者，行政法院應以裁定將該事件移送於訴願管轄機關，並以行政法院收受訴狀之時，視為提起訴願。","title":"第 一 章 行政訴訟事件"},{"no":"第7條","text":"提起行政訴訟，得於同一程序中，合併請求損害賠償或其他財產上給付。","title":"第 一 章 行政訴訟事件"},{"no":"第8條","text":"人民與中央或地方機關間，因公法上原因發生財產上之給付或請求作成行政處分以外之其他非財產上之給付，得提起給付訴訟。因公法上契約發生之給付，亦同。\n前項給付訴訟之裁判，以行政處分應否撤銷為據者，應於依第四條第一項或第三項提起撤銷訴訟時，併為請求。原告未為請求者，審判長應告以得為請求。","title":"第 一 章 行政訴訟事件"},{"no":"第9條","text":"人民為維護公益，就無關自己權利及法律上利益之事項，對於行政機關之違法行為，得提起行政訴訟。但以法律有特別規定者為限。","title":"第 一 章 行政訴訟事件"},{"no":"第10條","text":"選舉罷免事件之爭議，除法律別有規定外，得依本法提起行政訴訟。","title":"第 一 章 行政訴訟事件"},{"no":"第11條","text":"前二條訴訟依其性質，準用撤銷、確認或給付訴訟有關之規定。","title":"第 一 章 行政訴訟事件"},{"no":"第12條","text":"民事或刑事訴訟之裁判，以行政處分是否無效或違法為據者，應依行政爭訟程序確定之。\n前項行政爭訟程序已經開始者，於其程序確定前，民事或刑事法院應停止其審判程序。","title":"第 一 章 行政訴訟事件"},{"no":"第12-1條","text":"（刪除）","title":"第 一 章 行政訴訟事件"},{"no":"第12-2條","text":"（刪除）","title":"第 一 章 行政訴訟事件"},{"no":"第12-3條","text":"（刪除）","title":"第 一 章 行政訴訟事件"},{"no":"第12-4條","text":"（刪除）","title":"第 一 章 行政訴訟事件"},{"no":"第12-5條","text":"（刪除）","title":"第 一 章 行政訴訟事件"},{"no":"第13條","text":"對於公法人之訴訟，由其公務所所在地之行政法院管轄。其以公法人之機關為被告時，由該機關所在地之行政法院管轄。\n對於私法人或其他得為訴訟當事人之團體之訴訟，由其主事務所或主營業所所在地之行政法院管轄。\n對於外國法人或其他得為訴訟當事人之團體之訴訟，由其在中華民國之主事務所或主營業所所在地之行政法院管轄。","title":"第 一 節 管轄"},{"no":"第14條","text":"前條以外之訴訟，由被告住所地之行政法院管轄，其住所地之行政法院不能行使職權者，由其居所地之行政法院管轄。\n被告在中華民國現無住所或住所不明者，以其在中華民國之居所，視為其住所；無居所或居所不明者，以其在中華民國最後之住所，視為其住所；無最後住所者，以中央政府所在地，視為其最後住所地。\n訴訟事實發生於被告居所地者，得由其居所地之行政法院管轄。","title":"第 一 節 管轄"},{"no":"第15條","text":"因不動產徵收、徵用或撥用之訴訟，專屬不動產所在地之行政法院管轄。\n除前項情形外，其他有關不動產之公法上權利或法律關係涉訟者，得由不動產所在地之行政法院管轄。","title":"第 一 節 管轄"},{"no":"第15-1條","text":"關於公務員職務關係之訴訟，得由公務員職務所在地之行政法院管轄。","title":"第 一 節 管轄"},{"no":"第15-2條","text":"因公法上之保險事件涉訟者，得由為原告之被保險人、受益人之住居所地或被保險人從事職業活動所在地之行政法院管轄。\n前項訴訟事件於投保單位為原告時，得由其主事務所或主營業所所在地之行政法院管轄。","title":"第 一 節 管轄"},{"no":"第15-3條","text":"因原住民、原住民族部落之公法上權利或法律關係涉訟者，除兩造均為原住民或原住民族部落外，得由為原告之原住民住居所地或經核定部落所在地之行政法院管轄。","title":"第 一 節 管轄"},{"no":"第16條","text":"有下列各款情形之一者，直接上級行政法院應依當事人之聲請或受訴行政法院之請求，指定管轄：\n一、有管轄權之行政法院因法律或事實不能行審判權者。\n二、因管轄區域境界不明，致不能辨別有管轄權之行政法院者。\n三、因特別情形由有管轄權之行政法院審判，恐影響公安或難期公平者。\n前項聲請得向受訴行政法院或直接上級行政法院為之。","title":"第 一 節 管轄"},{"no":"第17條","text":"定行政法院之管轄以起訴時為準。","title":"第 一 節 管轄"},{"no":"第18條","text":"民事訴訟法第三條、第六條、第十五條、第十七條、第二十條至第二十二條、第二十八條第一項、第三項、第二十九條至第三十一條之規定，於本節準用之。","title":"第 一 節 管轄"},{"no":"第19條","text":"法官有下列情形之一者，應自行迴避，不得執行職務：\n一、有民事訴訟法第三十二條第一款至第六款情形之一。\n二、曾在中央或地方機關參與該訴訟事件之行政處分或訴願決定。\n三、曾參與該訴訟事件相牽涉之民刑事裁判。\n四、曾參與該訴訟事件相牽涉之法官、檢察官或公務員懲戒事件議決或裁判。\n五、曾參與該訴訟事件之前審裁判。\n六、曾參與該訴訟事件再審前之裁判。但其迴避以一次為限。","title":"第 二 節 法官之迴避"},{"no":"第20條","text":"民事訴訟法第三十三條至第三十八條之規定，於本節準用之。","title":"第 二 節 法官之迴避"},{"no":"第21條","text":"前二條規定於行政法院之司法事務官、書記官及通譯準用之。","title":"第 二 節 法官之迴避"},{"no":"第22條","text":"自然人、法人、中央及地方機關、非法人之團體，有當事人能力。","title":"第 一 節 當事人能力及訴訟能力"},{"no":"第23條","text":"訴訟當事人謂原告、被告及依第四十一條與第四十二條參加訴訟之人。","title":"第 一 節 當事人能力及訴訟能力"},{"no":"第24條","text":"經訴願程序之行政訴訟，其被告為下列機關：\n一、駁回訴願時之原處分機關。\n二、撤銷或變更原處分時，為撤銷或變更之機關。","title":"第 一 節 當事人能力及訴訟能力"},{"no":"第25條","text":"人民與受委託行使公權力之團體或個人，因受託事件涉訟者，以受託之團體或個人為被告。","title":"第 一 節 當事人能力及訴訟能力"},{"no":"第26條","text":"被告機關經裁撤或改組者，以承受其業務之機關為被告機關；無承受其業務之機關者，以其直接上級機關為被告機關。","title":"第 一 節 當事人能力及訴訟能力"},{"no":"第27條","text":"能獨立以法律行為負義務者，有訴訟能力。\n法人、中央及地方機關、非法人之團體，應由其代表人或管理人為訴訟行為。\n前項規定於依法令得為訴訟上行為之代理人準用之。","title":"第 一 節 當事人能力及訴訟能力"},{"no":"第28條","text":"民事訴訟法第四十六條至第四十九條、第五十一條之規定，於本節準用之。","title":"第 一 節 當事人能力及訴訟能力"},{"no":"第29條","text":"多數有共同利益之人得由其中選定一人至五人為全體起訴或被訴。\n訴訟標的對於多數有共同利益之人，必須合一確定而未為前項選定者，行政法院得限期命為選定，逾期未選定者，行政法院得依職權指定之。\n訴訟繫屬後經選定或指定當事人者，其他當事人脫離訴訟。","title":"第 二 節 選定當事人"},{"no":"第30條","text":"多數有共同利益之人於選定當事人或由行政法院依職權指定當事人後，得經全體當事人之同意更換或增減之。\n行政法院依前條第二項指定之當事人，如有必要，得依職權更換或增減之。\n依前兩項規定更換或增減者，原被選定或指定之當事人喪失其資格。","title":"第 二 節 選定當事人"},{"no":"第31條","text":"被選定或被指定之人中有因死亡或其他事由喪失其資格者，他被選定或被指定之人得為全體為訴訟行為。","title":"第 二 節 選定當事人"},{"no":"第32條","text":"第二十九條及第三十條訴訟當事人之選定、指定及其更換、增減應通知他造當事人。","title":"第 二 節 選定當事人"},{"no":"第33條","text":"被選定人非得全體之同意，不得為捨棄、認諾、撤回或和解。但訴訟標的對於多數有共同利益之各人非必須合一確定，經原選定人之同意，就其訴之一部為撤回或和解者，不在此限。","title":"第 二 節 選定當事人"},{"no":"第34條","text":"訴訟當事人之選定及其更換、增減，應以文書證之。","title":"第 二 節 選定當事人"},{"no":"第35條","text":"以公益為目的之社團法人，於其章程所定目的範圍內，由多數有共同利益之社員，就一定之法律關係，授與訴訟實施權者，得為公共利益提起訴訟。\n前項規定於以公益為目的之非法人之團體準用之。\n前二項訴訟實施權之授與，應以文書證之。\n第三十三條之規定，於第一項之社團法人或第二項之非法人之團體，準用之。","title":"第 二 節 選定當事人"},{"no":"第36條","text":"民事訴訟法第四十八條、第四十九條之規定，於本節準用之。","title":"第 二 節 選定當事人"},{"no":"第37條","text":"二人以上於下列各款情形，得為共同訴訟人，一同起訴或一同被訴：\n一、為訴訟標的之行政處分係二以上機關共同為之者。\n二、為訴訟標的之權利、義務或法律上利益，為其所共同者。\n三、為訴訟標的之權利、義務或法律上利益，於事實上或法律上有同一或同種類之原因者。\n依前項第三款同種類之事實上或法律上原因行共同訴訟者，以被告之住居所、公務所、機關、主事務所或主營業所所在地在同一行政法院管轄區域內者為限。","title":"第 三 節 共同訴訟"},{"no":"第38條","text":"共同訴訟中，一人之行為或他造對於共同訴訟人中一人之行為及關於其一人所生之事項，除別有規定外，其利害不及於他共同訴訟人。","title":"第 三 節 共同訴訟"},{"no":"第39條","text":"訴訟標的對於共同訴訟之各人，必須合一確定者，適用下列各款之規定：\n一、共同訴訟人中一人之行為有利益於共同訴訟人者，其效力及於全體；不利益者，對於全體不生效力。\n二、他造對於共同訴訟人中一人之行為，其效力及於全體。\n三、共同訴訟人中之一人，生有訴訟當然停止或裁定停止之原因者，其當然停止或裁定停止之效力及於全體。","title":"第 三 節 共同訴訟"},{"no":"第40條","text":"共同訴訟人各有續行訴訟之權。\n行政法院指定期日者，應通知各共同訴訟人到場。","title":"第 三 節 共同訴訟"},{"no":"第41條","text":"訴訟標的對於第三人及當事人一造必須合一確定者，行政法院應以裁定命該第三人參加訴訟。","title":"第 四 節 訴訟參加"},{"no":"第42條","text":"行政法院認為撤銷訴訟之結果，第三人之權利或法律上利益將受損害者，得依職權命其獨立參加訴訟，並得因該第三人之聲請，裁定允許其參加。\n前項參加，準用第三十九條第三款規定。參加人並得提出獨立之攻擊或防禦方法。\n前二項規定，於其他訴訟準用之。\n訴願人已向行政法院提起撤銷訴訟，利害關係人就同一事件再行起訴者，視為第一項之參加。","title":"第 四 節 訴訟參加"},{"no":"第43條","text":"第三人依前條規定聲請參加訴訟者，應向本訴訟繫屬之行政法院提出參加書狀，表明下列各款事項：\n一、本訴訟及當事人。\n二、參加人之權利或法律上利益，因撤銷訴訟之結果將受如何之損害。\n三、參加訴訟之陳述。\n行政法院認前項聲請不合前條規定者，應以裁定駁回之。\n關於前項裁定，得為抗告。\n駁回參加之裁定未確定前，參加人得為訴訟行為。","title":"第 四 節 訴訟參加"},{"no":"第44條","text":"行政法院認其他行政機關有輔助一造之必要者，得命其參加訴訟。\n前項行政機關或有利害關係之第三人亦得聲請參加。","title":"第 四 節 訴訟參加"},{"no":"第45條","text":"命參加之裁定應記載訴訟程度及命參加理由，送達於訴訟當事人。\n行政法院為前項裁定前，應命當事人或第三人以書狀或言詞為陳述。\n對於命參加訴訟之裁定，不得聲明不服。","title":"第 四 節 訴訟參加"},{"no":"第46條","text":"第四十一條之參加訴訟，準用第三十九條之規定。","title":"第 四 節 訴訟參加"},{"no":"第47條","text":"判決對於經行政法院依第四十一條及第四十二條規定，裁定命其參加或許其參加而未為參加者，亦有效力。","title":"第 四 節 訴訟參加"},{"no":"第48條","text":"民事訴訟法第五十九條至第六十一條、第六十三條至第六十七條之規定，於第四十四條之參加訴訟準用之。","title":"第 四 節 訴訟參加"},{"no":"第49條","text":"當事人得委任代理人為訴訟行為。但每一當事人委任之訴訟代理人不得逾三人。\n行政訴訟應以律師為訴訟代理人。非律師具有下列情形之一者，亦得為訴訟代理人：\n一、稅務行政事件，具備會計師資格。\n二、專利行政事件，具備專利師資格或依法得為專利代理人。\n三、當事人為公法人、中央或地方機關、公法上之非法人團體時，其所屬專任人員辦理法制、法務、訴願業務或與訴訟事件相關業務。\n四、交通裁決事件，原告為自然人時，其配偶、三親等內之血親或二親等內之姻親；原告為法人或非法人團體時，其所屬人員辦理與訴訟事件相關業務。\n委任前項之非律師為訴訟代理人者，應得審判長許可。\n第二項之非律師為訴訟代理人，審判長許其為本案訴訟行為者，視為已有前項之許可。\n前二項之許可，審判長得隨時以裁定撤銷之，並應送達於為訴訟委任之人。\n訴訟代理人委任複代理人者，不得逾一人。前四項之規定，於複代理人適用之。","title":"第 五 節 訴訟代理人及輔佐人"},{"no":"第49-1條","text":"下列各款事件及其程序進行中所生之其他事件，當事人應委任律師為訴訟代理人：\n一、高等行政法院管轄之環境保護、土地爭議之第一審通常訴訟程序事件及都市計畫審查程序事件。\n二、高等行政法院管轄之通常訴訟程序上訴事件。\n三、向最高行政法院提起之事件。\n四、適用通常訴訟程序或都市計畫審查程序之再審事件。\n五、適用通常訴訟程序或都市計畫審查程序之聲請重新審理及其再審事件。\n前項情形，不因訴之減縮、一部撤回、變更或程序誤用而受影響。前項第一款之事件範圍由司法院以命令定之。\n第一項情形，符合下列各款之一者，當事人得不委任律師為訴訟代理人：\n一、當事人或其代表人、管理人、法定代理人具備法官、檢察官、律師資格或為教育部審定合格之大學或獨立學院公法學教授、副教授。\n二、稅務行政事件，當事人或其代表人、管理人、法定代理人具備前條第二項第一款規定之資格。\n三、專利行政事件，當事人或其代表人、管理人、法定代理人具備前條第二項第二款規定之資格。\n第一項各款事件，非律師具有下列情形之一，經本案之行政法院認為適當者，亦得為訴訟代理人：\n一、當事人之配偶、三親等內之血親、二親等內之姻親具備律師資格。\n二、符合前條第二項第一款、第二款或第三款規定。\n前二項情形，應於提起
