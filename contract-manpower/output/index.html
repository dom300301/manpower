印或攝錄卷內文書，或預納費用請求付與繕本、影本或節本。但以維護其法律上利益有必要者為限。\n保訓會對前項之請求，除有下列情形之一者外，不得拒絕：\n一、復審事件決定擬辦之文稿。\n二、復審事件決定之準備或審議文件。\n三、為第三人之正當權益有保密之必要者。\n四、其他依法律或基於公益，有保密之必要者。\n第一項之收費標準，由保訓會定之。","title":"第 三 章 復審程序"},{"no":"第43條","text":"提起復審應具復審書，載明下列事項，由復審人或其代理人簽名或蓋章：\n一、復審人之姓名、出生年月日、住居所、國民身分證統一編號或身分證明文件及字號。有代理人者，其姓名、出生年月日、職業、住居所或事務所、國民身分證統一編號或身分證明文件及字號。\n二、復審人之服務機關、職稱、官職等。\n三、原處分機關。\n四、復審請求事項。\n五、事實及理由。\n六、證據。其為文書者，應添具影本或繕本。\n七、行政處分達到之年月日。\n八、提起之年月日。\n提起復審應附原行政處分書影本。\n依第二十六條第一項規定提起復審者，第一項第三款、第七款所列事項，載明應為行政處分之機關、申請之年月日，並附原申請書之影本及受理申請機關收受證明。","title":"第 三 章 復審程序"},{"no":"第44條","text":"復審人應繕具復審書經由原處分機關向保訓會提起復審。\n原處分機關對於前項復審應先行重新審查原行政處分是否合法妥當，其認為復審為有理由者，得自行變更或撤銷原行政處分，並函知保訓會。\n原處分機關自收到復審書之次日起二十日內，不依復審人之請求變更或撤銷原行政處分者，應附具答辯書，並將必要之關係文件，送於保訓會。\n原處分機關檢卷答辯時，應將前項答辯書抄送復審人。\n復審人向保訓會提起復審者，保訓會應將復審書影本或副本送交原處分機關依第二項至第四項規定辦理。","title":"第 三 章 復審程序"},{"no":"第45條","text":"原處分機關未於前條第三項期間內處理者，保訓會得依職權或依復審人之申請，通知原處分機關於十五日內檢送相關卷證資料；逾期未檢送者，保訓會得逕為決定。","title":"第 三 章 復審程序"},{"no":"第46條","text":"復審人在第三十條第一項所定期間向原處分機關或保訓會為不服原行政處分之表示者，視為已在法定期間內提起復審。但應於三十日內補送復審書。","title":"第 三 章 復審程序"},{"no":"第47條","text":"復審提起後，於保訓會復審決定書送達前，復審人得撤回之。復審經撤回後，不得再提起同一之復審。","title":"第 三 章 復審程序"},{"no":"第48條","text":"復審提起後，復審人死亡或喪失復審能力者，得由其繼承人或其他依法得繼受原行政處分所涉權利或利益之人承受復審程序。但已無取得復審決定之法律上利益或依其性質不得承受者，不在此限。\n依前項規定承受復審者，應於事實發生之日起三十日內，向保訓會檢送繼受權利之證明文件。","title":"第 三 章 復審程序"},{"no":"第49條","text":"保訓會認為復審書不合法定程式，而其情形可補正者，應通知復審人於二十日內補正。","title":"第 三 章 復審程序"},{"no":"第50條","text":"復審就書面審查決定之。\n保訓會必要時，得通知復審人或有關人員到達指定處所陳述意見並接受詢問。\n復審人請求陳述意見而有正當理由者，應予到達指定處所陳述意見之機會。","title":"第 三 章 復審程序"},{"no":"第51條","text":"保訓會得指定副主任委員、委員聽取前條到場人員之陳述。","title":"第 三 章 復審程序"},{"no":"第52條","text":"保訓會必要時，得依職權或依復審人之申請，通知復審人或其代表人、復審代理人、輔佐人及原處分機關派員於指定期日到達指定處所言詞辯論。","title":"第 三 章 復審程序"},{"no":"第53條","text":"言詞辯論由保訓會主任委員或其指定之副主任委員、委員主持之。","title":"第 三 章 復審程序"},{"no":"第54條","text":"言詞辯論之程序如下：\n一、主持人或其指定之人員陳述事件要旨。\n二、復審人或其代理人就事件為事實上及法律上之陳述。\n三、原處分機關就事件為事實上及法律上之陳述。\n四、有關機關或人員之陳述。\n五、復審人或原處分機關對他方之陳述或答辯，為再陳述或再答辯。\n六、保訓會委員對復審人及原處分機關或有關人員提出詢問。\n七、復審人之最後陳述。\n言詞辯論未完備者，得再為辯論。","title":"第 三 章 復審程序"},{"no":"第55條","text":"復審人得提出證據書類或證物。保訓會限定於一定期間內提出者，應於該期間內提出。","title":"第 三 章 復審程序"},{"no":"第56條","text":"保訓會必要時，得依職權或依復審人之申請，命文書或其他物件之持有人提出該物件，並得留置之。\n公務人員或機關掌管之文書或其他物件，保訓會得調閱之。\n前項情形，除有妨害國家機密者外，該公務人員或機關不得拒絕。","title":"第 三 章 復審程序"},{"no":"第57條","text":"保訓會必要時，得依職權或囑託有關機關、學校、團體或具專門知識經驗者，就必要之物件、證據，實施檢驗、勘驗或鑑定。\n前項所需費用由保訓會負擔。\n保訓會依第一項檢驗、勘驗或鑑定之結果，非經賦予復審人表示意見之機會，不得採為對之不利之復審決定之基礎。\n復審人願自行負擔費用而請求依第一項規定實施檢驗、勘驗或鑑定時，保訓會非有正當理由不得拒絕。\n依前項規定檢驗、勘驗或鑑定所得結果，據為復審人有利之決定或裁判時，復審人得於事件確定後三十日內，請求保訓會償還必要之費用。","title":"第 三 章 復審程序"},{"no":"第58條","text":"鑑定人依前條所為之鑑定，應具鑑定書陳述意見。保訓會必要時，並得請其到達指定處所說明。\n鑑定人有數人時，得共同陳述意見。但意見不同者，保訓會應使其分別陳述意見。\n鑑定所需資料在原處分機關或保訓會者，保訓會應告知鑑定人准其利用，並得限制其利用之範圍及方法。","title":"第 三 章 復審程序"},{"no":"第59條","text":"原處分機關應將據以處分之證據資料提出於保訓會。\n對於前項之證據資料，復審人或其代理人得請求閱覽、抄錄或影印之。保訓會非有正當理由，不得拒絕。\n第一項證據資料之閱覽、抄錄或影印，保訓會應指定日、時、處所。","title":"第 三 章 復審程序"},{"no":"第60條","text":"復審人對保訓會於復審程序進行中所為之程序上處置不服者，應併同復審決定提起行政訴訟。","title":"第 三 章 復審程序"},{"no":"第61條","text":"復審事件有下列各款情形之一者，應為不受理決定：\n一、復審書不合法定程式不能補正或經酌定相當期間通知補正逾期不補正者。\n二、提起復審逾法定期間或未於第四十六條但書所定期間，補送復審書者。\n三、復審人無復審能力而未由法定代理人代為復審行為，經通知補正逾期不補正者。\n四、復審人不適格者。\n五、行政處分已不存在者。\n六、對已決定或已撤回之復審事件重行提起復審者。\n七、對不屬復審救濟範圍內之事項，提起復審者。\n前項第五款情形，如復審人因該處分之撤銷而有可回復之法律上利益時，不得為不受理之決定。\n第一項第七款情形，如屬應提起申訴、再申訴事項，公務人員誤提復審者，保訓會應移轉申訴受理機關依申訴程序處理，並通知該公務人員，不得逕為不受理決定。","title":"第 三 章 復審程序"},{"no":"第62條","text":"分別提起之數宗復審事件係基於同一或同種類之事實上或法律上之原因者，保訓會得合併審議，並得合併決定。","title":"第 三 章 復審程序"},{"no":"第63條","text":"復審無理由者，保訓會應以決定駁回之。\n原行政處分所憑之理由雖屬不當，但依其他理由認為正當者，應以復審為無理由。\n復審事件涉及地方自治團體之地方自治事務者，保訓會僅就原行政處分之合法性進行審查決定。","title":"第 三 章 復審程序"},{"no":"第64條","text":"提起復審因逾法定期間而為不受理決定時，原行政處分顯屬違法或顯然不當者，保訓會應於決定理由中指明。","title":"第 三 章 復審程序"},{"no":"第65條","text":"復審有理由者，保訓會應於復審人表示不服之範圍內，以決定撤銷原行政處分之全部或一部，並得視事件之情節，發回原處分機關另為處分。但原處分機關於復審人表示不服之範圍內，不得為更不利益之處分。\n前項發回原處分機關另為處分，原處分機關未於規定期限內依復審決定意旨處理，經復審人再提起復審時，保訓會得逕為變更之決定。","title":"第 三 章 復審程序"},{"no":"第66條","text":"對於依第二十六條第一項提起之復審，保訓會認為有理由者，應指定相當期間，命應作為之機關速為一定之處分。\n保訓會未為前項決定前，應作為之機關已為行政處分者，保訓會應認為復審無理由，以決定駁回之。","title":"第 三 章 復審程序"},{"no":"第67條","text":"保訓會發現原行政處分雖屬違法或顯然不當，但其撤銷或變更於公益有重大損害，經斟酌復審人所受損害、賠償程度、防止方法及其他一切情事，認原行政處分之撤銷或變更顯與公益相違背時，得駁回其復審。\n前項情形，應於決定主文中載明原行政處分違法或顯然不當。","title":"第 三 章 復審程序"},{"no":"第68條","text":"保訓會為前條決定時，得斟酌復審人因違法或顯然不當行政處分所受損害，於決定理由中載明由原處分機關與復審人進行賠償協議。\n前項協議，與國家賠償法之協議有同一之效力。","title":"第 三 章 復審程序"},{"no":"第69條","text":"復審決定應於保訓會收受原處分機關檢卷答辯之次日起三個月內為之；其尚待補正者，自補正之次日起算，未為補正者，自補正期間屆滿之次日起算；復審人係於表示不服後三十日內補送復審書者，自補送之次日起算，未為補送者，自補送期間屆滿之次日起算；復審人於復審事件決定期間內續補具理由者，自最後補具理由之次日起算。\n復審事件不能於前項期間內決定者，得予延長，並通知復審人。延長以一次為限，最長不得逾二個月。","title":"第 三 章 復審程序"},{"no":"第70條","text":"復審之決定以他法律關係是否成立為準據，而該法律關係在訴訟或行政救濟程序進行中者，於該法律關係確定前，保訓會得停止復審程序之進行，並即通知復審人。\n保訓會依前項規定停止復審程序之進行者，前條所定復審決定期間，自該法律關係確定之日起，重行起算。","title":"第 三 章 復審程序"},{"no":"第71條","text":"復審決定書，應載明下列事項：\n一、復審人之姓名、出生年月日、服務機關、職稱、住居所、國民身分證統一編號或身分證明文件及字號。\n二、有法定代理人或復審代理人者，其姓名、出生年月日、住居所、國民身分證統一編號或身分證明文件及字號。\n三、主文、事實及理由；其係不受理決定者，得不記載事實。\n四、決定機關及其首長。\n五、年、月、日。\n復審決定書之正本應於決定後十五日內送達復審人及原處分機關。","title":"第 三 章 復審程序"},{"no":"第72條","text":"保訓會復審決定依法得聲明不服者，復審決定書應附記如不服決定，得於決定書送達之次日起二個月內，依法向該管司法機關請求救濟。\n前項附記錯誤時，應通知更正，並自更正通知送達之次日起，計算法定期間。\n如未附記救濟期間，或附記錯誤未通知更正，致復審人遲誤者，如於復審決定書送達之次日起一年內請求救濟，視為於第一項之期間內所為。","title":"第 三 章 復審程序"},{"no":"第73條","text":"復審事件有下列情形之一者，不予處理：\n一、無具體之事實內容者。\n二、未具真實姓名、服務機關或住所者。","title":"第 三 章 復審程序"},{"no":"第74條","text":"對於無復審能力人為送達者，應向其法定代理人為之。\n法定代理人有二人以上者，送達得僅向其中一人為之。","title":"第 三 章 復審程序"},{"no":"第75條","text":"復審代理人除受送達之權限受有限制者外，送達應向該代理人為之。但保訓會認為必要時，得送達於復審人本人。","title":"第 三 章 復審程序"},{"no":"第76條","text":"復審事件文書之送達，應註明復審人或其代表人、代理人之住居所、事務所，交付郵務機構以復審事件文書郵務送達證書發送。\n復審事件文書不能為前項之送達時，得由保訓會派員或囑託原處分機關、公務人員服務機關送達，並由執行送達人作成送達證書。\n復審事件文書之送達，除前二項規定外，準用行政訴訟法第六十七條至第六十九條、第七十一條至第八十三條之規定。","title":"第 三 章 復審程序"},{"no":"第77條","text":"公務人員對於服務機關所為之管理措施或有關工作條件之處置認為不當，致影響其權益者，得依本法提起申訴、再申訴。\n公務人員離職後，接獲原服務機關之管理措施或處置者，亦得依前項規定提起申訴、再申訴。","title":"第 四 章 申訴及再申訴程序"},{"no":"第78條","text":"申訴之提起，應於管理措施或有關工作條件之處置達到之次日起三十日內，向服務機關為之。不服服務機關函復者，得於復函送達之次日起三十日內，向保訓會提起再申訴。\n前項之服務機關，以管理措施或有關工作條件之處置之權責處理機關為準。","title":"第 四 章 申訴及再申訴程序"},{"no":"第79條","text":"應提起復審之事件，公務人員誤提申訴者，申訴受理機關應移由原處分機關依復審程序處理，並通知該公務人員。\n應提起復審之事件，公務人員誤向保訓會逕提再申訴者，保訓會應函請原處分機關依復審程序處理，並通知該公務人員。","title":"第 四 章 申訴及再申訴程序"},{"no":"第80條","text":"申訴應以書面為之，載明下列事項，由申訴人或其代理人簽名或蓋章：\n一、申訴人之姓名、出生年月日、住居所、國民身分證統一編號或身分證明文件及字號、服務機關、職稱、官職等。有代理人者，其姓名、出生年月日、職業、住居所或事務所、國民身分證統一編號或身分證明文件及字號。\n二、請求事項。\n三、事實及理由。\n四、證據。\n五、管理措施或有關工作條件之處置達到之年月日。\n六、提起之年月日。\n前項規定，於再申訴準用之。","title":"第 四 章 申訴及再申訴程序"},{"no":"第81條","text":"服務機關對申訴事件，應於收受申訴書之次日起三十日內，就請求事項詳備理由函復，必要時得延長二十日，並通知申訴人。逾期未函復，申訴人得逕提再申訴。\n申訴復函應附記如不服函復者，得於三十日內向保訓會提起再申訴之意旨。\n再申訴決定應於收受再申訴書之次日起三個月內為之。必要時得延長一個月，並通知再申訴人。","title":"第 四 章 申訴及再申訴程序"},{"no":"第82條","text":"各機關對於保訓會查詢之再申訴事件，應於二十日內將事實、理由及處理意見，並附有關資料，回復保訓會。\n各機關對於再申訴事件未於前項規定期間內回復者，保訓會得逕為決定。","title":"第 四 章 申訴及再申訴程序"},{"no":"第83條","text":"再申訴決定書，應載明下列事項：\n一、再申訴人之姓名、出生年月日、服務機關及職稱、住居所、國民身分證統一編號或身分證明文件及字號。\n二、有再申訴代理人者，其姓名、出生年月日、住居所、國民身分證統一編號或身分證明文件及字號。\n三、主文、事實及理由；其係不受理決定者，得不記載事實。\n四、決定機關及其首長。\n五、年、月、日。\n六、附記對於保訓會所為再申訴之決定不得以同一事由復提再申訴。","title":"第 四 章 申訴及再申訴程序"},{"no":"第84條","text":"申訴、再申訴除本章另有規定外，準用第三章第二十六條至第四十二條、第四十三條第三項、第四十四條第四項、第四十六條至第五十九條、第六十一條至第六十八條、第六十九條第一項、第七十條、第七十一條第二項、第七十三條至第七十六條之復審程序規定。","title":"第 四 章 申訴及再申訴程序"},{"no":"第85條","text":"保障事件審理中，保訓會得依職權或依申請，指定副主任委員或委員一人至三人，進行調處。\n前項調處，於多數人共同提起之保障事件，其代表人非徵得全體復審人或再申訴人之書面同意，不得為之。","title":"第 五 章 調處程序"},{"no":"第86條","text":"保訓會進行調處時，應以書面通知復審人、再申訴人，或其代表人、代理人及有關機關，於指定期日到達指定處所行之。\n前項之代理人，應提出經特別委任之授權證明，始得參與調處。\n復審人、再申訴人，或其代表人、經特別委任之代理人及有關機關，無正當理由，於指定期日不到場者，視為調處不成立。但保訓會認為有成立調處之可能者，得另定調處期日。\n調處之過程及結果應製作紀錄，由參與調處之人員簽名；其拒絕簽名者，應記明其事由。","title":"第 五 章 調處程序"},{"no":"第87條","text":"保障事件經調處成立者，保訓會應作成調處書，記載下列事項，並函知復審人、再申訴人、代表人、經特別委任之代理人及有關機關：\n一、復審人或再申訴人之姓名、出生年月日、服務機關及職稱、住居所、國民身分證統一編號或身分證明文件及字號。\n二、有代表人或經特別委任之代理人者，其姓名、出生年月日、住居所、國民身分證統一編號或身分證明文件及字號。\n三、參與調處之副主任委員、委員姓名。\n四、調處事由。\n五、調處成立之內容。\n六、調處成立之場所。\n七、調處成立之年月日。\n前項經調處成立之保障事件，保訓會應終結其審理程序。","title":"第 五 章 調處程序"},{"no":"第88條","text":"保障事件經調處不成立者，保訓會應逕依本法所定之復審程序或再申訴程序為審議決定。","title":"第 五 章 調處程序"},{"no":"第89條","text":"原行政處分、管理措施或有關工作條件之處置，不因依本法所進行之各項程序而停止執行。\n原行政處分、管理措施或有關工作條件之處置合法性顯有疑義者，或其執行將發生難以回復之損害，且有急迫情事，並非為維護重大公共利益所必要者，保訓會、原處分機關或服務機關得依職權或依申請，就原行政處分、管理措施或有關工作條件之處置全部或一部，停止執行。","title":"第 六 章 執行"},{"no":"第90條","text":"停止執行之原因消滅，或有其他情事變更之情形，保訓會、原處分機關或服務機關得依職權或依申請撤銷停止執行。","title":"第 六 章 執行"},{"no":"第91條","text":"保訓會所為保障事件之決定確定後，有拘束各關係機關之效力；其經保訓會作成調處書者，亦同。\n原處分機關應於復審決定確定之次日起二個月內，將處理情形回復保訓會。必要時得予延長，但不得超過二個月，並通知復審人及保訓會。\n服務機關應於收受再申訴決定書之次日起二個月內，將處理情形回復保訓會。必要時得予延長，但不得超過二個月，並通知再申訴人及保訓會。\n保障事件經調處成立者，原處分機關或服務機關應於收受調處書之次日起二個月內，將處理情形回復保訓會。","title":"第 六 章 執行"},{"no":"第92條","text":"原處分機關、服務機關於前條規定期限內未處理者，保訓會應檢具證據將違失人員移送監察院依法處理。但違失人員為薦任第九職等以下人員，由保訓會通知原處分機關或服務機關之上級機關依法處理。\n前項違失人員如為民意機關首長，由保訓會處新臺幣十萬元以上一百萬元以下罰鍰，並公布違失事實。\n前項罰鍰，經通知限期繳納，逾期不繳納者，依法移送強制執行。","title":"第 六 章 執行"},{"no":"第93條","text":"保障事件決定書及其執行情形，應定期刊登政府公報並公布於機關網站。","title":"第 六 章 執行"},{"no":"第94條","text":"保障事件經保訓會審議決定，除復審事件復審人已依法向司法機關請求救濟者外，於復審決定或再申訴決定確定後，有下列情形之一者，原處分機關、服務機關、復審人或再申訴人得向保訓會申請再審議：\n一、適用法規顯有錯誤者。\n二、決定理由與主文顯有矛盾者。\n三、決定機關之組織不合法者。\n四、依本法應迴避之委員參與決定者。\n五、參與決定之委員關於該保障事件違背職務，犯刑事上之罪者。\n六、復審、再申訴之代理人或代表人，關於該復審、再申訴有刑事上應罰之行為，影響於決定者。\n七、證人、鑑定人或通譯就為決定基礎之證言、鑑定或通譯為虛偽陳述者。\n八、為決定基礎之證物，係偽造或變造者。\n九、為決定基礎之民事、刑事或行政訴訟判決或行政處分，依其後之確定裁判或行政處分已變更者。\n十、發現未經斟酌之證物或得使用該證物者。但以如經斟酌可受較有利益之決定者為限。\n十一、原決定就足以影響於決定之重要證物漏未斟酌者。\n前項申請於原行政處分、原管理措施、原工作條件之處置及原決定執行完畢後，亦得為之。\n第一項第五款至第八款情形，以宣告有罪之判決已確定，或其刑事訴訟不能開始或續行非因證據不足者為限。","title":"第 七 章 再審議"},{"no":"第95條","text":"申請再審議應於三十日之不變期間內為之。\n前項期間自復審決定或再申訴決定確定時起算。但再審議之理由知悉在後者，自知悉時起算。\n再審議之申請，自復審決定或再申訴決定確定時起，如逾五年者，不得提起。","title":"第 七 章 再審議"},{"no":"第96條","text":"申請再審議應以書面敘述理由，附具繕本，連同原決定書影本及證據，向保訓會提起。","title":"第 七 章 再審議"},{"no":"第97條","text":"再審議之申請，於保訓會作成決定前得撤回之。\n為前項撤回者，不得更以同一原因申請再審議。","title":"第 七 章 再審議"},{"no":"第98條","text":"保訓會認為申請再審議程序不合法者，應為不受理決定。","title":"第 七 章 再審議"},{"no":"第99條","text":"保訓會認為再審議無理由者，應以決定駁回之。\n經前項決定後，不得更以同一原因申請再審議。","title":"第 七 章 再審議"},{"no":"第100條","text":"保訓會認為再審議有理由者，應撤銷或變更原復審決定或再申訴決定。","title":"第 七 章 再審議"},{"no":"第101條","text":"再審議，除本章另有規定外，準用第三章復審程序、第四章再申訴程序及第六章執行之規定。","title":"第 七 章 再審議"},{"no":"第102條","text":"下列人員準用本法之規定：\n一、教育人員任用條例公布施行前已進用未經銓敘合格之公立學校職員。\n二、私立學校改制為公立學校未具任用資格之留用人員。\n三、公營事業依法任用之人員。\n四、各機關依法派用、聘用、聘任、僱用或留用人員。\n五、應各種公務人員考試錄取參加訓練之人員，或訓練期滿成績及格未獲分發任用之人員。\n前項第五款應各種公務人員考試錄取參加訓練之人員，不服保訓會所為之行政處分者，有關其權益之救濟，依訴願法之規定行之。\n法定機關（構）非屬第三條及第一項所定人員，而有依法令從事於公務者，其提起職場霸凌之申訴，準用第十九條至第十九條之二及依第十九條第一項所定辦法等相關規定。但不含醫療機構及公立學校。","title":"第 八 章 附則"},{"no":"第103條","text":"本法修正施行前，尚未終結之保障事件，其以後之程序，依修正之本法規定終結之。","title":"第 八 章 附則"},{"no":"第104條","text":"本法自公布日施行。\n本法中華民國一百十一年五月三十日修正之第二十三條施行日期，由考試院定之。\n本法中華民國一百十四年六月二十四日修正之第十九條至第十九條之二、第二十一條及第一百零二條條文，自公布後六個月施行。","title":"第 八 章 附則"}],"tags":["公務人員","救濟","復審","申訴"],"note":"第 102 條列舉準用本法之人員（含各機關依法聘用、僱用人員）；114.7.9 修正增訂職場霸凌申訴之準用。"},{"id":"B03","name":"公務員服務法","pcode":"S0020038","level":"法律","authority":"銓敘部","category":"考試＞銓敘部＞人事管理目","modified_date":"2022-06-22","history":[{"date":"1939-10-23","summary":"中華民國二十八年十月二十三日國民政府制定公布全文 25 條"},{"date":"1943-01-04","summary":"中華民國三十二年一月四日國民政府修正公布第 13、22～24 條條文"},{"date":"1947-07-11","summary":"中華民國三十六年七月十一日國民政府修正公布第 12、13 條條文"},{"date":"1996-01-15","summary":"中華民國八十五年一月十五日總統（85）華總（一）義字第 8500004660 號令修正公布第 13、14 條條文；並增訂第 14-1、14-2、14-3、22-1 條條文"},{"date":"2000-07-19","summary":"中華民國八十九年七月十九日總統（89）華總一義字第 8900177720 號令修正公布第 11 條條文"},{"date":"2022-06-22","summary":"中華民國一百十一年六月二十二日總統華總一義字第 11100050751 號令修正公布全文 27 條；依第 27 條規定：自公布日施行，但第 12 條施行日期，由考試院定之中華民國一百十一年八月一日考試院考臺組貳一字第 11100055001 號令發布定自一百十二年一月一日施行"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=S0020038","articles":[{"no":"第1條","text":"公務員應恪守誓言，忠心努力，依法律、命令所定執行其職務。"},{"no":"第2條","text":"本法適用於受有俸給之文武職公務員及公營事業機構純勞工以外之人員。\n前項適用對象不包括中央研究院未兼任行政職務之研究人員、研究技術人員。"},{"no":"第3條","text":"公務員對於長官監督範圍內所發之命令有服從義務，如認為該命令違法，應負報告之義務；該管長官如認其命令並未違法，而以書面署名下達時，公務員即應服從；其因此所生之責任，由該長官負之。但其命令有違反刑事法律者，公務員無服從之義務。\n前項情形，該管長官非以書面署名下達命令者，公務員得請求其以書面署名為之，該管長官拒絕時，視為撤回其命令。"},{"no":"第4條","text":"公務員對於兩級長官同時所發命令，以上級長官之命令為準；主管長官與兼管長官同時所發命令，以主管長官之命令為準。"},{"no":"第5條","text":"公務員有絕對保守政府機關（構）機密之義務，對於機密事件，無論是否主管事務，均不得洩漏；離職後，亦同。\n公務員未經機關（構）同意，不得以代表機關（構）名義或使用職稱，發表與其職務或服務機關（構）業務職掌有關之言論。\n前項同意之條件、程序及其他應遵循事項之辦法，由考試院會同行政院定之。"},{"no":"第6條","text":"公務員應公正無私、誠信清廉、謹慎勤勉，不得有損害公務員名譽及政府信譽之行為。"},{"no":"第7條","text":"公務員不得假借權力，以圖本身或他人之利益，並不得利用職務上之機會加損害於人。"},{"no":"第8條","text":"公務員執行職務，應力求切實，不得畏難規避，互相推諉或無故稽延。"},{"no":"第9條","text":"公務員收受人事派令後，應於一個月內就（到）職。但具有正當事由，經任免權責機關（構）同意者，得延長之；其延長期間，以一個月為限。\n駐外人員應於收受人事派令後三個月內就（到）職。但有其他不可歸責於當事人之事由，得請求延長之，並於該事由終止後一個月內就（到）職。"},{"no":"第10條","text":"公務員奉派出差，除天災或其他不可歸責之事由延後完成工作等情形外，應於核准之期程內往返。"},{"no":"第11條","text":"公務員未經機關（構）同意，不得擅離職守；其出差者，亦同。"},{"no":"第12條","text":"公務員應依法定時間辦公，不得遲到早退，每日辦公時數為八小時，每週辦公總時數為四十小時，每週應有二日之休息日。但法律另有規定者，從其規定。\n前項辦公時數及休息日數，各機關（構）在不影響為民服務品質原則下，得為下列之調整：\n一、總統府、國家安全會議及五院，於維持每週辦公總時數下，調整所屬機關（構）每日辦公時數及每週休息日數。\n二、各級學校主管機關，於維持全年辦公總時數下，調整學校每日、每週辦公時數及每週休息日數。\n三、行政院配合紀念日及節日之放假，調整每週辦公時數及每週休息日數。\n各機關（構）為推動業務需要，得指派公務員延長辦公時數加班。延長辦公時數，連同第一項辦公時數，每日不得超過十二小時；延長辦公時數，每月不得超過六十小時。但為搶救重大災害、處理緊急或重大突發事件、辦理重大專案業務或辦理季節性、週期性工作等例外情形，延長辦公時數上限，由總統府、國家安全會議及五院分別定之。\n各機關（構）應保障因業務特性或工作性質特殊而須實施輪班輪休人員之健康，辦公日中應給予適當之連續休息時數，並得合理彈性調整辦公時數、延長辦公時數及休息日數。\n輪班制公務員更換班次時，至少應有連續十一小時之休息時間。但因應勤（業）務需要或其他特殊情形，不在此限。\n前二項辦公日中連續休息時數下限、彈性調整辦公時數、延長辦公時數上限、更換班次時連續休息時間之調整及休息日數等相關事項，包括其適用對象、特殊情形及勤務條件最低保障，應於維護公務員健康權之原則下，由總統府、國家安全會議及五院分別訂定，或授權所屬機關（構）依其業務特性定之。"},{"no":"第13條","text":"公務員因公務需要、法定義務或其他與職務有關之事項須離開辦公處所者，應經機關（構）同意給予公假。\n公務員連續服務滿一定期間，應按年資給予休假。\n公務員因事、照顧家庭成員、婚喪、疾病、分娩或其他正當事由得請假。\n前三項公務員請假之假別、日數、程序及其他相關事項，除公務人員請假規則由考試院會同行政院訂定外，其餘非適用公務人員請假規則者，由總統府、國家安全會議及五院分別定之。但其他法律另有特別規定者，依其規定。"},{"no":"第14條","text":"公務員不得經營商業。\n前項經營商業，包括依公司法擔任公司發起人或公司負責人、依商業登記法擔任商業負責人，或依其他法令擔任以營利為目的之事業負責人、董事、監察人或相類似職務。但經公股股權管理機關（構）指派代表公股或遴薦兼任政府直接或間接投資事業之董事、監察人或相類似職務，並經服務機關（構）事先核准或機關（構）首長經上級機關（構）事先核准者，不受前項規定之限制。\n公務員就（到）職前擔任前項職務或經營事業須辦理解任登記者，至遲應於就（到）職時提出書面辭職，於三個月內完成解任登記，並向服務機關（構）繳交有關證明文件。但有特殊情形未能依限完成解任登記，並經服務機關（構）同意或機關（構）首長經上級機關（構）同意者，得延長之；其延長期間，以三個月為限，惟於完成解任登記前，不得參與經營及支領報酬。\n公務員所任職務對營利事業有直接監督或管理權限者，不得取得該營利事業之股份或出資額。\n公務員就（到）職前已持有前項營利事業之股份或出資額，應於就（到）職後三個月內全部轉讓或信託予信託業；就（到）職後因其他法律原因當然取得者，亦同。"},{"no":"第15條","text":"公務員除法令規定外，不得兼任他項公職；其依法令兼職者，不得兼薪。\n公務員除法令規定外，不得兼任領證職業及其他反覆從事同種類行為之業務。但於法定工作時間以外，從事社會公益性質之活動或其他非經常性、持續性之工作，且未影響本職工作者，不在此限。\n公務員依法令兼任前二項公職或業務者，應經服務機關（構）同意；機關（構）首長應經上級機關（構）同意。\n公務員兼任教學或研究工作或非以營利為目的之事業或團體職務，應經服務機關（構）同意；機關（構）首長應經上級機關（構）同意。但兼任無報酬且未影響本職工作者，不在此限。\n公務員有第二項但書及前項但書規定情形，應報經服務機關（構）備查；機關（構）首長應報經上級機關（構）備查。\n公務員得於法定工作時間以外，依個人才藝表現，獲取適當報酬，並得就其財產之處分、智慧財產權及肖像權之授權行使，獲取合理對價。\n第二項、第四項及第六項之行為，對公務員名譽、政府信譽、其本職性質有妨礙或有利益衝突者，不得為之。\n公務員兼任第三項所定公職或業務及第四項所定工作或職務；其申請同意之條件、程序、限制及其他應遵行事項之辦法，由考試院會同行政院定之。"},{"no":"第16條","text":"公務員於其離職後三年內，不得擔任與其離職前五年內之職務直接相關之營利事業董事、監察人、經理、執行業務之股東或顧問。"},{"no":"第17條","text":"公務員不得餽贈長官財物或於所辦事件收受任何餽贈。但符合廉政相關法令規定者，不在此限。"},{"no":"第18條","text":"公務員不得利用視察、調查等機會，接受招待或餽贈。但符合廉政相關法令規定者，不在此限。"},{"no":"第19條","text":"公務員執行職務時，遇有涉及本身或其親（家）屬之利害關係者，應依法迴避。"},{"no":"第20條","text":"公務員非因職務之需要，不得動用行政資源。"},{"no":"第21條","text":"公務員對於職務上所管理之行政資源，應負善良管理人責任，不得毀損、變換、私用或借給他人使用。"},{"no":"第22條","text":"公務員對於下列各款與其職務有關係者，不得私相借貸，訂立互利契約或享受其他不正利益：\n一、承辦本機關（構）或所屬機關（構）之工程。\n二、經營本機關（構）或所屬事業來往款項之銀行。\n三、承辦本機關（構）或所屬事業公用物品之營利事業。\n四、受有政府機關（構）獎（補）助費。"},{"no":"第23條","text":"公務員違反本法規定者，應按情節輕重，分別予以懲戒或懲處，其觸犯刑事法令者，並依各該法令處罰。"},{"no":"第24條","text":"離職公務員違反第十六條規定者，處二年以下有期徒刑，得併科新臺幣一百萬元以下罰金。"},{"no":"第25條","text":"公務員有違反本法之行為，該管長官知情而不依法處置者，應受懲戒或懲處。"},{"no":"第26條","text":"公營事業機構對經營政策負有主要決策責任者以外人員及公立學校兼任行政職務教師不適用第十四條及第十五條規定；其經營商業、執行業務及兼課、兼職之範圍、限制、程序等相關事項之辦法，由各該主管機關定之。\n前項公營事業機構對經營政策負有主要決策責任人員職務範圍，由各該公營事業機構主管機關列冊，並送銓敘部備查。"},{"no":"第27條","text":"本法自公布日施行。\n本法中華民國一百十一年五月三十日修正之第十二條施行日期，由考試院定之。"}],"tags":["公務人員","服務"],"note":"111.6.22 全文修正後，適用範圍改列於第 2 條（受有俸給之文武職公務員及公營事業機構純勞工以外之人員；原第 24 條）；第 26 條：公營事業非決策人員及兼任行政職務教師不適用第 14、15 條。聘僱人員依職務代理注意事項第 7 點須遵守本法。"},{"id":"B04","name":"公務人員考績法","pcode":"S0040001","level":"法律","authority":"銓敘部","category":"考試＞銓敘部＞考績目","modified_date":"2025-11-19","history":[{"date":"1949-01-01","summary":"中華民國三十八年一月一日總統令公布施行"},{"date":"1954-01-09","summary":"中華民國四十三年一月九日總統令公布同日施行"},{"date":"1962-04-09","summary":"中華民國五十一年四月九日總統令修正公布同日施行"},{"date":"1970-08-27","summary":"中華民國五十九年八月二十七日總統令修正公布"},{"date":"1986-07-11","summary":"中華民國七十五年七月十一日總統令制定公布全文 25 條；依第 25 條規定：自七十六年一月十六日起施行"},{"date":"1990-12-28","summary":"中華民國七十九年十二月二十八日總統令修正公布第 7、8、11、12 條條文"},{"date":"1997-06-04","summary":"中華民國八十六年六月四日總統（86）華總（一）義字第 8600127600號令修正公布第 3、7、11、12、14、16、18、19、23 條條文；並刪除第 17 條條文"},{"date":"2001-06-20","summary":"中華民國九十年六月二十日總統（90）華總一義字第 9000117000 號令修正公布第 4、6、7、10、11、12、14、18、25 條條文"},{"date":"2007-03-21","summary":"中華民國九十六年三月二十一日總統華總一義字第 09600034561 號令修正公布第 14 條條文"},{"date":"2025-11-19","summary":"中華民國一百十四年十一月十九日總統華總一義字第 11400117191號令修正公布第 3、11、12 條條文"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=S0040001","articles":[{"no":"第1條","text":"公務人員之考績，依本法行之。"},{"no":"第2條","text":"公務人員之考績，應本綜覈名實、信賞必罰之旨，作準確客觀之考核。"},{"no":"第3條","text":"公務人員考績區分如下：\n一、年終考績：指各官等人員，於每年年終辦理其當年一月至十二月連續任職期間之考績。\n二、另予考績：指各官等人員，於同一考績年度內，任職不滿一年，而累計任職已達六個月者辦理之考績。\n三、專案考績：指各官等人員，平時有重大功過時，隨時辦理之考績。\n公務人員任職期間符合前項第一款或第二款規定，惟全無工作事實者，不辦理年終考績或另予考績。但經機關選送帶職帶薪進修者，不在此限。"},{"no":"第4條","text":"公務人員任現職，經銓敘審定合格實授至年終滿一年者，予以年終考績；不滿一年者，如係升任高一官等職務，得以前經銓敘審定有案之低一官等職務合併計算，辦理高一官等之年終考績；如係調任同一官等或降調低一官等職務，得以前經銓敘審定有案之同官等或高官等職務合併計算，辦理所敘官等職等之年終考績。但均以調任並繼續任職者為限。\n具有公務人員任用資格之政務人員、教育人員或公營事業人員轉任公務人員，經銓敘審定合格實授者，其轉任當年未辦理考核及未採計提敘官職等級之年資，得比照前項經銓敘審定合格實授之年資，合併計算參加年終考績。"},{"no":"第5條","text":"年終考績應以平時考核為依據。平時考核就其工作、操行、學識、才能行之。\n前項考核之細目，由銓敘機關訂定。但性質特殊職務之考核得視各職務需要，由各機關訂定，並送銓敘機關備查。"},{"no":"第6條","text":"年終考績以一百分為滿分，分甲、乙、丙、丁四等，各等分數如左：\n甲等：八十分以上。\n乙等：七十分以上，不滿八十分。\n丙等：六十分以上，不滿七十分。\n丁等：不滿六十分。\n考列甲等之條件，應於施行細則中明定之。\n除本法另有規定者外，受考人在考績年度內，非有左列情形之一者，不得考列丁等：\n一、挑撥離間或誣控濫告，情節重大，經疏導無效，有確實證據者。\n二、不聽指揮，破壞紀律，情節重大，經疏導無效，有確實證據者。\n三、怠忽職守，稽延公務，造成重大不良後果，有確實證據者。\n四、品行不端，或違反有關法令禁止事項，嚴重損害公務人員聲譽，有確實證據者。"},{"no":"第7條","text":"年終考績獎懲依左列規定︰\n一、甲等︰晉本俸一級，並給與一個月俸給總額之一次獎金；已達所敘職等本俸最高俸級或已敘年功俸級者，晉年功俸一級，並給與一個月俸給總額之一次獎金；已敘年功俸最高俸級者，給與二個月俸給總額之一次獎金。\n二、乙等︰晉本俸一級，並給與半個月俸給總額之一次獎金；已達所敘職等本俸最高俸級或已敘年功俸級者，晉年功俸一級，並給與半個月俸給總額之一次獎金；已敘年功俸最高俸級者，給與一個半月俸給總額之一次獎金。\n三、丙等︰留原俸級。\n四、丁等︰免職。\n前項所稱俸給總額，指公務人員俸給法所定之本俸、年功俸及其他法定加給。"},{"no":"第8條","text":"另予考績人員之獎懲，列甲等者，給與一個月俸給總額之一次獎金；列乙等者，給與半個月俸給總額之一次獎金；列丙等者，不予獎勵；列丁等者，免職。"},{"no":"第9條","text":"公務人員之考績，除機關首長由上級機關長官考績外，其餘人員應以同官等為考績之比較範圍。"},{"no":"第10條","text":"年終考績應晉俸級，在考績年度內已依法晉敘俸級或在考績年度內升任高一官等、職等職務已敘較高俸級，其以前經銓敘審定有案之低官等、職等職務合併計算辦理高一官等、職等之年終考績者，考列乙等以上時，不再晉敘。但專案考績不在此限。"},{"no":"第11條","text":"各機關參加考績人員任本職等年終考績，具有下列各款情形之一者，取得同官等高一職等之任用資格：\n一、二年列甲等者。\n二、一年列甲等二年列乙等者。\n前項所稱任本職等年終考績，指當年一月至十二月任職期間均任同一職等辦理之年終考績。因育嬰留職停薪辦理之另予考績，二年列甲等者，視為年終考績一年列甲等；一年列甲等一年列乙等或二年列乙等者，視為年終考績一年列乙等。\n前項以外另予考績及以不同官等職等併資辦理年終考績之年資，均不得予以併計取得高一職等升等任用資格。但以不同官等職等併資辦理年終考績之年資，得予以併計取得該併資之較低官等高一職等升等任用資格。"},{"no":"第12條","text":"各機關辦理公務人員平時考核獎懲，獎勵分嘉獎、記功、記一大功；懲處分申誡、記過、記一大過。於年終考績時，併計成績增減總分。平時考核獎懲得互相抵銷，無獎懲抵銷而累積達二大過者，年終考績應列丁等。\n專案考績，於有重大功過時行之；其結果依下列規定：\n一、一次記二大功者，晉本俸一級，已達所敘職等本俸最高俸級或已敘年功俸級者，晉年功俸一級，均給與一個月俸給總額之一次獎金；已敘至年功俸最高俸級者，給與二個月俸給總額之一次獎金。但在同一年度內再因一次記二大功辦理專案考績者，不再晉敘俸級，改給二個月俸給總額之一次獎金。\n二、一次記二大過者，免職。\n前項第一款一次記二大功之標準，應於施行細則中明定之。專案考績不得與平時考核獎懲相抵銷。\n公務人員除在同一考績年度內曠職繼續達四日或累計達十日，應予一次記二大過者外，非有具體事證，足認有下列情形之一者，不得為一次記二大過處分：\n一、圖謀背叛國家。\n二、執行國家政策不力，或怠忽職責，或洩漏職務上之機密，致政府遭受重大損害。\n三、違抗政府重大政令，或嚴重傷害政府信譽。\n四、涉及貪污案件，其行政責任重大。\n五、圖謀不法利益或言行不檢，致嚴重損害政府或公務人員聲譽。\n六、因服用酒類或施用毒品等致不能安全駕駛動力交通工具，且發生交通事故致人於死或重傷，或致人死傷而逃逸，違反有關法律規定。\n七、對他人為性侵害，經有關機關或依法組成之相關委員會查證屬實。但經檢察官提起公訴者，應予一次記二大過處分。\n八、對他人為性騷擾或跟蹤騷擾，使其遭受身心不法侵害，情節重大，致受害人重大身心創傷或死亡。\n九、對他人為職場霸凌，使其遭受身心不法侵害，情節重大，致受害人重大身心創傷或死亡。\n十、脅迫、公然侮辱或誣告長官，情節重大。\n十一、挑撥離間或破壞紀律，情節重大。\n十二、違反有關法令規定，致嚴重損害政府或公務人員聲譽。\n前項第七款但書人員經無罪判決確定者，應撤銷其一次記二大過處分。\n公務人員之違失行為，經主管機關或授權之所屬機關認屬一次記二大過者，懲處權行使期間為十五年；屬記一大過者，懲處權行使期間為七年；屬記過或申誡者，懲處權行使期間為五年。\n前項期間，自違失行為終了之日起算；行為屬不作為者，自作為義務消滅時起算。但行為之結果發生在後者，自該結果發生時起算。\n各機關對公務人員所為之懲處，經相關救濟程序撤銷並由原處分機關另為適法之處分者，懲處權行使期間自原懲處被撤銷確定之日重行起算。但上開案件部分撤銷原因係原懲處事由已逾懲處權行使期間者，該等懲處事由不重行起算懲處權行使期間。"},{"no":"第13條","text":"平時成績紀錄及獎懲，應為考績評定分數之重要依據。平時考核之功過，除依前條規定抵銷或免職者外，曾記二大功人員，考績不得列乙等以下；曾記一大功人員，考績不得列丙等以下；曾記一大過人員，考績不得列乙等以上。"},{"no":"第14條","text":"各機關對於公務人員之考績，應由主管人員就考績表項目評擬，遞送考績委員會初核，機關長官覆核，經由主管機關或授權之所屬機關核定，送銓敘部銓敘審定。但非於年終辦理之另予考績或長官僅有一級，或因特殊情形報經上級機關核准不設置考績委員會時，除考績免職人員應送經上級機關考績委員會考核外，得逕由其長官考核。\n考績委員會對於考績案件，認為有疑義時，得調閱有關考核紀錄及案卷，並得向有關人員查詢。\n考績委員會對於擬予考績列丁等及一次記二大過人員，處分前應給予當事人陳述及申辯之機會。\n第一項所稱主管機關為總統府、國家安全會議、五院、各部（會、處、局、署與同層級之機關）、省政府、省諮議會、直轄市政府、直轄市議會、縣（市）政府及縣（市）議會。"},{"no":"第15條","text":"各機關應設考績委員會，其組織規程，由考試院定之。"},{"no":"第16條","text":"公務人員考績案，送銓敘部銓敘審定時，如發現有違反考績法規情事者，應照原送案程序，退還原考績機關另為適法之處分。"},{"no":"第17條","text":"（刪除）"},{"no":"第18條","text":"年終辦理之考績結果，應自次年一月起執行；一次記二大功專案考績及非於年終辦理之另予考績，自主管機關核定之日起執行。但考績應予免職人員，自確定之日起執行；未確定前，應先行停職。"},{"no":"第19條","text":"各機關辦理考績人員如有不公或徇私舞弊情事時，其主管機關應查明責任予以懲處，並通知原考績機關對受考人重加考績。"},{"no":"第20條","text":"辦理考績人員，對考績過程應嚴守秘密，並不得遺漏舛錯，違者按情節輕重予以懲處。"},{"no":"第21條","text":"派用人員之考成，準用本法之規定。"},{"no":"第22條","text":"不受任用資格限制人員及其他不適用本法考績人員之考成，得由各機關參照本法之規定辦理。"},{"no":"第23條","text":"教育人員及公營事業人員之考績，均另以法律定之。"},{"no":"第24條","text":"本法施行細則，由考試院定之。"},{"no":"第25條","text":"本法施行日期，由考試院以命令定之。\n本法修正條文自公布日施行。"}],"tags":["公務人員","考績"],"note":""},{"id":"B05","name":"公務人員俸給法","pcode":"S0030001","level":"法律","authority":"銓敘部","category":"考試＞銓敘部＞俸給目","modified_date":"2008-01-16","history":[{"date":"1949-01-01","summary":"中華民國三十八年一月一日總統令公布施行"},{"date":"1954-01-09","summary":"中華民國四十三年一月九日總統令公布同日施行"},{"date":"1986-07-16","summary":"中華民國七十五年七月十六日總統令制定公布全文 21 條；依第 21 條規定：自七十六年一月十六日起施行"},{"date":"1990-12-28","summary":"中華民國七十九年十二月二十八日總統華總（一）義字第 7432 號令修正公布 4 條條文"},{"date":"1997-05-21","summary":"中華民國八十六年五月二十一日總統華總（一）義字第 8600116220 號令修正公布第 2、6、8、9、11、16、19 條條文；並增訂第 6-1 條條文"},{"date":"2002-06-26","summary":"中華民國九十一年六月二十六日總統華總一義字第 09100128130 號令修正公布全文 28 條；依第 28 條規定：施行日期，由考試院定之中華民國九十一年八月二十八日考試院考台組貳一字第 0910007267 號令發布定自九十一年八月三十日施行"},{"date":"2005-05-18","summary":"中華民國九十四年五月十八日總統華總一義字第 09400072541 號令修正公布第 3、12、17、20～22、24 條條文；本法條施行日期，由考試院定之中華民國九十四年十月十七日考試院考臺組貳二字第 09400082911 號令發布自九十四年五月二十日施行"},{"date":"2008-01-16","summary":"中華民國九十七年一月十六日總統華總一義字第 09700005031 號令修正公布第 6、9、11、28 條條文；並自公布日施行"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=S0030001","articles":[{"no":"第1條","text":"公務人員之俸給，依本法行之。"},{"no":"第2條","text":"本法所用名詞意義如下：\n一、本俸：係指各職等人員依法應領取之基本給與。\n二、年功俸：係指各職等高於本俸最高俸級之給與。\n三、俸級：係指各職等本俸及年功俸所分之級次。\n四、俸點：係指計算俸給折算俸額之基數。\n五、加給：係指本俸、年功俸以外，因所任職務種類、性質與服務地區之不同，而另加之給與。"},{"no":"第3條","text":"公務人員之俸給，分本俸（年功俸）及加給，均以月計之。\n服務未滿整月者，按實際在職日數覈實計支；其每日計發金額，以當月全月俸給總額除以該月全月之日數計算。但死亡當月之俸給按全月支給。"},{"no":"第4條","text":"公務人員俸級區分如下：\n一、委任分五個職等，第一職等本俸分七級，年功俸分六級，第二至第五職等本俸各分五級，第二職等年功俸分六級，第三職等、第四職等年功俸各分八級，第五職等年功俸分十級。\n二、薦任分四個職等，第六至第八職等本俸各分五級，年功俸各分六級，第九職等本俸分五級，年功俸分七級。\n三、簡任分五個職等，第十至第十二職等本俸各分五級，第十職等、第十一職等年功俸各分五級，第十二職等年功俸分四級，第十三職等本俸及年功俸均分三級，第十四職等本俸為一級。\n本俸、年功俸之俸級及俸點，依所附俸表之規定。"},{"no":"第5條","text":"加給分下列三種：\n一、職務加給：對主管人員或職責繁重或工作具有危險性者加給之。\n二、技術或專業加給：對技術或專業人員加給之。\n三、地域加給：對服務邊遠或特殊地區與國外者加給之。"},{"no":"第6條","text":"初任各官等職務人員，其等級起敘規定如下：\n一、高等考試之一級考試或特種考試之一等考試及格者，初任薦任職務時，敘薦任第九職等本俸一級；先以薦任第八職等任用者，敘薦任第八職等本俸四級。\n二、高等考試之二級考試或特種考試之二等考試及格者，初任薦任職務時，敘薦任第七職等本俸一級；先以薦任第六職等任用者，敘薦任第六職等本俸三級。\n三、高等考試之三級考試或特種考試之三等考試及格者，初任薦任職務時，敘薦任第六職等本俸一級；先以委任第五職等任用者，敘委任第五職等本俸五級。\n四、普通考試或特種考試之四等考試及格者，敘委任第三職等本俸一級。\n五、初等考試或特種考試之五等考試及格者，敘委任第一職等本俸一級。\n中華民國八十五年一月十七日公務人員考試法修正施行前，考試及格人員，初任各官等職務時，其等級起敘規定如下：\n一、特種考試甲等考試及格者，初任簡任職務時，敘簡任第十職等本俸一級；先以薦任第九職等任用者，敘薦任第九職等本俸五級。\n二、高等考試之一級考試及格者，初任薦任職務時，敘薦任第七職等本俸一級；先以薦任第六職等任用者，敘薦任第六職等本俸三級。\n三、高等考試之二級考試及格者，初任薦任職務時，敘薦任第六職等本俸一級；先以委任第五職等任用者，敘委任第五職等本俸五級。\n四、高等考試或特種考試之乙等考試及格者，初任薦任職務時，敘薦任第六職等本俸一級；先以委任第五職等任用者，敘委任第五職等本俸五級。\n五、普通考試或特種考試之丙等考試及格者，敘委任第三職等本俸一級。\n六、特種考試之丁等考試及格者，敘委任第一職等本俸一級。"},{"no":"第7條","text":"升官等考試及格人員初任各官等職務等級之起敘，依下列規定：\n一、簡任升官等考試及格者，初任簡任職務時，敘簡任第十職等本俸一級。\n二、薦任升官等考試及格者，初任薦任職務時，敘薦任第六職等本俸一級。\n三、委任升官等考試及格者，初任委任職務時，敘委任第一職等本俸一級。\n本法施行前經依考試法、分類職位公務人員考試法或公務人員升等考試法考試及格者，初任其考試及格職等職務時，分別自各該職等之最低俸級起敘。"},{"no":"第8條","text":"試用人員俸級之起敘，依前二條規定辦理，改為實授者，仍敘原俸級。"},{"no":"第9條","text":"依各種考試或任用法規限制調任之人員、專門職業及技術人員轉任公務人員條例轉任之人員，在限制轉調機關、職系或年限內，如依另具之公務人員任用資格任用時，應以其所具該公務人員任用資格重新銓敘審定俸級。\n前項人員以其他任用資格於原職務改任時，應以其所具該公務人員任用資格重新銓敘審定俸級。"},{"no":"第10條","text":"各機關現職人員，經銓敘合格者，應在其職務列等表所列職等範圍內換敘相當等級；其換敘辦法，由考試院定之。"},{"no":"第11條","text":"依法銓敘合格人員，調任同職等職務時，仍依原俸級銓敘審定。在同官等內調任高職等職務時，具有所任職等職務任用資格者，自所任職等最低俸級起敘；如未達所任職等之最低俸級者，敘最低俸級；如原敘俸級之俸點高於所任職等最低俸級之俸點時，敘同數額俸點之俸級。在同官等內調任低職等職務以原職等任用人員，仍敘原俸級。\n權理人員，仍依其所具資格銓敘審定俸級。\n調任低官等職務以調任官等之最高職等任用人員，其原敘俸級如在所調任官等之最高職等內有同列俸級時，敘同列俸級；如高於所調任官等之最高職等最高俸級時，敘至年功俸最高級為止，其原敘較高俸級之俸點仍予照支。\n前項仍予照支原敘較高俸級俸點人員，日後再調回原任高官等職務時，其照支之俸級如在所調任職等內有同列俸級時，敘同列俸級；如高於所調任職等最高俸級時，敘至年功俸最高級為止，其原照支較高俸級之俸點仍予照支。"},{"no":"第12條","text":"公立學校教育人員、公營事業人員轉任行政機關職務時，其俸級之核敘，除其他法規另有規定外，依其考試及格所具資格或曾經銓敘審定有案之職等銓敘審定俸級。行政機關人員轉任公立學校教育人員或公營事業人員時，其服務年資之採計，亦同。\n曾任行政機關銓敘審定有案之年資，如符合公務人員考績法第十一條第一項規定，應先於所轉任職務列等範圍內晉升職等，再銓敘審定俸級。"},{"no":"第13條","text":"不受任用資格限制人員，依法調任或改任受任用資格限制之同職等職務時，具有相當性質等級之資格者，應依其所具資格之職等最低級起敘，其原服務較高或相當等級年資得按年核計加級。"},{"no":"第14條","text":"本法施行前，經銓敘合格人員，於離職後再任時，其俸級核敘比照第十條規定辦理；本法施行後，經銓敘合格人員，於離職後再任時，其俸級核敘比照第十一條規定辦理。但所再任職務列等之俸級，高於原敘俸級者，敘與原俸級相當之俸級；低於原敘俸級者，敘所再任職務列等之相當俸級，以敘至所任職務之最高職等年功俸最高級為止。如有超過之俸級，仍予保留。俟將來調任相當職等之職務時，再予回復。"},{"no":"第15條","text":"升任官等人員，自升任官等最低職等之本俸最低級起敘。但原敘年功俸者，得敘同數額俸點之本俸或年功俸。曾任公務人員依考試及格資格，再任較高官等職務者，亦同。\n現任或曾任公務人員，依所具較高考試及格資格，升任或再任較高職等職務時，其原敘俸級，高於擬任職等最低俸級者，得敘同數額俸點之本俸或年功俸。\n初任委任官等職務人員，其俸級依所具任用資格等級起敘，曾任雇員原支雇員年功薪點，得敘該職等同數額俸點之俸級，以敘至年功俸最高級為止，其超過之年功薪點仍准暫支，俟將來升任較高職等職務時，照其所暫支薪點敘所升任職等相當俸級。"},{"no":"第16條","text":"公務人員本俸及年功俸之晉敘，依公務人員考績法之規定。\n在同官等內調任低職等職務仍以原職等任用，並敘原俸級人員，考績時得在原銓敘審定職等俸級內晉敘。"},{"no":"第17條","text":"公務人員曾任下列年資，如與現任職務職等相當、性質相近且服務成績優良者，得按年核計加級至其所銓敘審定職等之本俸最高級；如尚有積餘年資，且其年終（度）考績（成、核）合於或比照合於公務人員考績法晉敘俸級之規定，得按年核計加級至其所銓敘審定職等之年功俸最高級為止：\n一、經銓敘部銓敘審定有案之年資。\n二、公營事業機構具公務員身分之年資。\n三、依法令任官有案之軍職年資。\n四、公立學校之教育人員年資。\n五、公立訓練機構職業訓練師年資。\n曾任政務人員、民選首長、公立專科以上學校教師、公立社會教育機構專業人員及公立學術研究機構研究人員年資，如繳有成績優良證明文件，得比照前項規定，按年核計加級至其所銓敘審定職等之年功俸最高級為止。\n公務人員曾任前二項以外之公務年資，如與現任職務職等相當、性質相近且服務成績優良者，得按年核計加級至其所銓敘審定職等之本俸最高級為止。\n第一項所稱職等相當，指公務人員曾任職務等級與現所銓敘審定之職等相當；所稱性質相近，指公務人員曾任職務工作性質與擬任職務之性質相近。\n公務人員曾任職等相當、性質相近、服務成績優良年資提敘俸級之認定，其辦法，由考試院定之。"},{"no":"第18條","text":"本法各種加給之給與條件、類別、適用對象、支給數額及其他事項，由考試院會同行政院訂定加給給與辦法辦理之。\n本俸、年功俸之俸點折算俸額，由行政院會商考試院定之。"},{"no":"第19條","text":"各機關不得另行自定俸給項目及數額支給，未經權責機關核准而自定項目及數額支給或不依規定項目及數額支給者，審計機關應不准核銷，並予追繳。\n銓審互核實施辦法，由銓敘部會同審計部定之。"},{"no":"第20條","text":"降級人員，改敘所降之俸級。\n降級人員在本職等內無級可降時，以應降之級為準，比照俸差減俸。\n降級人員依法再予晉級時，自所降之級起遞晉；其無級可降，比照俸差減俸者，應依所減之俸差逐年復俸。\n給與年功俸人員應降級者，應先就年功俸降級。"},{"no":"第21條","text":"依法停職人員，於停職期間，得發給半數之本俸（年功俸），至其復職、撤職、休職、免職或辭職時為止。\n復職人員補發停職期間之本俸（年功俸），在停職期間領有半數之本俸（年功俸）者，應於補發時扣除之。\n先予復職人員，應俟刑事判決確定未受徒刑之執行；或經移付懲戒，須未受撤職、休職之懲戒處分者，始得補發停職期間未發之本俸（年功俸）。\n停職、復職、先予復職人員死亡者，得補發停職期間未發之本俸（年功俸），並由依法得領受撫卹金之人具領之。\n公務人員失蹤期間，在未確定死亡前，應發給全數之本俸（年功俸）。"},{"no":"第22條","text":"公務人員曠職或請事假超過規定日數者，應按第三條第二項計算方式，扣除其曠職或超過規定事假日數之俸給。"},{"no":"第23條","text":"經銓敘部銓敘審定之等級，非依本法、公務員懲戒法及其他法律之規定，不得降敘。"},{"no":"第24條","text":"公務人員俸級經銓敘部銓敘審定後，如有不服，得依公務人員保障法提起救濟；如有顯然錯誤，或有發生新事實、發現新證據等行政程序再開事由，得依行政程序法相關規定辦理。\n現職人員取得較高考試及格資格，申請改敘俸級者，應於取得考試及格證書之日起三個月內辦理。依限申請改敘核准者，其為免經訓練、實習或學習程序之考試及格人員，自考試榜示及格之日改支；其為須經訓練、實習或學習期滿成績及格，始完成考試程序之人員，自訓練、實習或學習期滿成績及格之次日改支。逾限申請而核准者，自申請之日改支。"},{"no":"第25條","text":"派用人員之薪給，準用本法之規定。"},{"no":"第26條","text":"教育人員及公營事業人員之俸給，均另以法律定之。"},{"no":"第27條","text":"本法施行細則，由考試院定之。"},{"no":"第28條","text":"本法施行日期，由考試院定之。\n本法修正條文，自公布日施行。"}],"tags":["公務人員","俸給"],"note":"聘用、約僱人員薪點比照公務人員俸點（報酬標準表）之對照基礎。","attachments":[{"FileName":"公務人員俸表.PDF","FileURL":"https://law.moj.gov.tw/LawClass/LawGetFile.ashx?FileId=0000233074"},{"FileName":"公務人員俸表.DOC","FileURL":"https://law.moj.gov.tw/LawClass/LawGetFile.ashx?FileId=0000002287"}]},{"id":"B06","name":"公務人員退休資遣撫卹法","pcode":"S0080034","level":"法律","authority":"銓敘部","category":"考試＞銓敘部＞退休目","modified_date":"2025-12-26","history":[{"date":"2017-08-09","summary":"中華民國一百零六年八月九日總統華總一義字第 10600095491 號令制定公布全文 95 條；依第 95 條規定：除第 7 條第 4 項及第 69 條自公布日施行外，其餘條文自一百零七年七月一日施行"},{"date":"2022-01-19","summary":"中華民國一百十一年一月十九日總統華總一義字第 11100002561 號令修正公布第 7、67、77、95 條條文；依第 95 條規定：除第 7 條自一百十年一月一日施行、第 67 條自一百十一年七月一日施行及第 77條自一百零八年八月二十三日施行外，自公布日施行"},{"date":"2023-01-11","summary":"中華民國一百十二年一月十一日總統華總一義字第 11200001561 號令修正公布第 93、95 條條文；依第 95 條規定：第 93 條自一百十二年七月一日施行"},{"date":"2025-12-26","summary":"中華民國一百十四年十二月二十六日總統華總一義字第 11400132311號令修正公布第 37、38、67 條條文"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=S0080034","articles":[{"no":"第1條","text":"公務人員退休、資遣及撫卹，依本法行之。","title":"第 一 節 通例"},{"no":"第2條","text":"本法之主管機關為銓敘部。","title":"第 一 節 通例"},{"no":"第3條","text":"本法適用於依公務人員任用法及其相關法律任用，並經銓敘審定之人員。\n前項人員退休、資遣或撫卹之辦理，除本法另有規定外，以現職人員為限。","title":"第 一 節 通例"},{"no":"第4條","text":"本法用詞定義如下：\n一、退撫新制：指中華民國八十四年七月一日起實施之公務人員退休撫卹制度；該制度係由政府與公務人員共同提撥費用建立公務人員退休撫卹基金（以下簡稱退撫基金）之「共同儲金制」。\n二、本（年功）俸（薪）額：指公務人員依銓敘審定之俸（薪）點，按公務人員俸給法規定所折算之俸（薪）額。但機關（構）所適用之待遇規定與公務人員俸給法規定不同者，其所屬公務人員銓敘審定之俸（薪）點，應比照公務人員俸給法規定，折算俸（薪）額。\n三、俸給總額慰助金：指公務人員退休或資遣當月所支領下列給與項目之合計數額：\n（一）本（年功）俸（薪）額。\n（二）技術或專業加給。\n（三）主管職務加給。\n四、退休所得替代率（以下簡稱替代率）：指公務人員退休後所領每月退休所得占最後在職同等級人員每月所領本（年功）俸（薪）額加計一倍金額之比率。但兼領月退休金者，其替代率上限應按兼領月退休金之比率調整之。\n五、每月退休所得，依公務人員支領退休金種類，定義如下：\n（一）於支領月退休金人員，指每月所領月退休金（含月補償金）加計公務人員保險（以下簡稱公保）一次養老給付優惠存款利息（以下簡稱優存利息），或於政府機關、公立學校、公營事業機構參加各項社會保險所支領保險年金（以下簡稱社會保險年金）之合計金額。\n（二）於兼領月退休金人員，指每月按審定比率所領月退休金（含月補償金），加計一次退休金及公保一次養老給付優存利息或社會保險年金之合計金額。\n（三）於支領一次退休金人員，指每月所領一次退休金優存利息，加計公保一次養老給付優存利息或社會保險年金之合計金額。\n六、最低保障金額：指公務人員委任第一職等本俸最高級之本俸額與該職等一般公務人員專業加給合計數額。\n七、退離給與：指按公營事業機構移轉民營條例或其他退休（職、伍）、資遣規定，辦理退休（職、伍）、資遣或年資結算並領取相當退休（職、伍）金、年資結算金、資遣給與或離職給與等給付。","title":"第 一 節 通例"},{"no":"第5條","text":"公務人員或其遺族依本法請領之給與，分為退休金、資遣給與、退撫基金費用本息、撫卹金、遺屬一次金或遺屬年金（以下統稱退撫給與）。","title":"第 一 節 通例"},{"no":"第6條","text":"前條所定退撫給與，屬於退撫新制實施前年資計得者，應由各級政府編列預算支給；屬於退撫新制實施後年資計得者，應由退撫基金支給。\n前項退撫新制之實施，因機關改制或其他原因而另定實施日期者，依其實施日期認定。","title":"第 二 節 退撫給與之提存準備與管理"},{"no":"第7條","text":"第六條所定退撫基金，由公務人員與政府共同按月撥繳退撫基金費用設立之，並由政府負最後支付保證責任。\n前項退撫基金費用按公務人員本（年功）俸（薪）額加一倍百分之十二至百分之十八之提撥費率，按月由政府撥繳百分之六十五；公務人員繳付百分之三十五。\n公務人員依法令辦理留職停薪，借調至其他公務機關占缺並依公務人員俸給法令支薪者，其留職停薪期間之退撫基金費用撥繳事宜，由借調機關按其銓敘審定之官職等級，比照前項規定辦理。\n公務人員具有本項公布施行後，依法令辦理育嬰留職停薪之年資，得選擇全額負擔並繼續繳付退撫基金費用。\n公務人員依本法規定繳付之退撫基金費用，不計入繳付年度薪資收入課稅。","title":"第 二 節 退撫給與之提存準備與管理"},{"no":"第8條","text":"前條第二項所定退撫基金費用之實際提撥費率，由考試院會同行政院，依據退撫基金定期財務精算結果，共同釐訂並公告之。\n前項財務精算結果之不攤提過去未提存負債最適提撥費率超過現行實際提撥費率達一點五倍以上時，考試院應於三個月內會同行政院提高提撥費率至少百分之一，但不得超過前條第二項所定之提撥費率上限。\n第一項所定退撫基金定期財務精算，由退撫基金管理機關就退撫基金之收支、管理與運用情形，每三年精算一次；每次至少精算五十年。","title":"第 二 節 退撫給與之提存準備與管理"},{"no":"第9條","text":"公務人員辦理退休、資遣或撫卹時，其依本法規定繳付退撫基金費用而未予併計發給退休金、資遣給與或撫卹金之年資，由退撫基金管理機關按未採計年資占繳費年資之比率計算後，一次發還其本人原繳付之退撫基金費用本息。\n公務人員不符合退休或資遣條件而離職者，得申請一次發還本人原繳付之退撫基金費用本息。\n公務人員死亡後，有第五十二條第二項但書所定不予撫卹之情形者，得由其第六十二條所定遺族，申請一次發還其本人原繳付之退撫基金費用本息。\n公務人員依本法繳付退撫基金費用之年資已支領退離給與者，不適用前二項發還退撫基金費用本息之規定。","title":"第 二 節 退撫給與之提存準備與管理"},{"no":"第10條","text":"退撫基金之運用及委託經營，應由專責單位進行專業投資，並按季公告收支及運用情形。\n本法所定退撫基金之收支、管理、運用事項及前項專責單位型態，除本法另有規定外，另以法律定之。","title":"第 二 節 退撫給與之提存準備與管理"},{"no":"第11條","text":"公務人員依本法辦理退休、資遣或撫卹時，其所具下列退撫新制實施前之未曾領取退離給與之年資，得予採計：\n一、曾任編制內有給專任且符合第三條第一項規定之公務人員年資。\n二、曾任編制內有給專任之軍用文職人員年資，經銓敘部登記有案，或經國防部或其他權責機關覈實出具證明者。\n三、曾任志願役軍職年資，經國防部或其他權責機關覈實出具證明者。\n四、曾任編制內雇員、同委任及委任或比照警佐待遇警察人員年資，經原服務機關覈實出具證明者。\n五、曾任公立學校編制內有給專任且符合教育人員任用條例規定之教職員，經原服務學校覈實出具證明者。\n六、曾任公營事業具公務員身分之編制內有給專任職員，經原服務機構覈實出具證明者。\n七、其他曾經銓敘部核定得予併計之年資。\n公務人員於中華民國八十七年六月五日以後退休、資遣生效或死亡，其退撫新制實施前曾任義務役年資，未併計核給退離給與者，得採計為退休、資遣及撫卹年資。\n公務人員於退撫新制實施前，曾任工友、駐衛警察、職務代理人、學校代理（課）教師或其他非經銓敘審定之年資，均不得採計為退休、資遣或撫卹年資。但本法公布施行前，經銓敘部核准採計者，於未重行檢討停止適用前，仍得依原核准規定辦理。","title":"第 三 節 退撫年資之採計及其相關事宜"},{"no":"第12條","text":"公務人員依本法辦理退休、資遣或撫卹時，其所具退撫新制實施後之任職年資採計，依下列規定辦理：\n一、應以依法繳付退撫基金費用之實際繳付日數計算。\n二、曾經申請發還退撫基金費用本息、曾由政府編列預算或退撫基金支付退離給與之年資，均不得採計。\n三、退撫新制實施後，曾任政務人員、公立學校教育人員或軍職人員且已撥繳退撫基金費用之年資，於轉任公務人員時，應由退撫基金管理機關將其與政府共同撥繳而未曾領取之退撫基金費用本息，移撥公務人員退撫基金帳戶，以併計年資。\n四、具有退撫新制實施後之義務役年資，未併計核給退離給與者，應於初任到職支薪或復職復薪之日起十年內，依銓敘審定等級，由服務機關與公務人員比照第七條第二項規定之撥繳比率，共同負擔並一次補繳退撫基金費用本息後，始得併計年資。\n五、由公立學校教育人員轉任公務人員者，其所具退撫新制實施後之義務役年資，應依轉任公務人員前適用之退休法令規定，補繳退撫基金費用本息，並依第三款規定辦理移撥後，始得併計年資。\n六、公務人員所具下列未曾領取退離給與之退撫新制實施後任職年資，除本法另有規定外，得於轉任公務人員到職支薪或復職復薪之日起十年內，依其任職年資及等級，對照同期間相同俸級公務人員之繳費標準，換算複利終值總和，由申請補繳人一次全額補繳退撫基金費用本息後，始得併計年資：\n（一）依其他法律規定，得予併計之年資。\n（二）依公務人員留職停薪辦法第四條第一項第四款及第六款規定，辦理留職停薪之年資。\n七、依法停職而奉准復職者，其依公務人員俸給法規定補發停職期間未發之本（年功）俸（薪）額時，應由服務機關與公務人員比照第七條第二項所定之撥繳比率，共同負擔並一次補繳停職期間之退撫基金費用本息，以併計年資。","title":"第 三 節 退撫年資之採計及其相關事宜"},{"no":"第13條","text":"公務人員依前條第四款、第六款及第七款規定，申請補繳退撫基金費用本息時，自初任或轉任到職支薪或復職復薪之日起算，逾三個月後始申請者，應另加計利息。\n前條及前項補繳退撫基金費用本息期限之計算，不因公務人員離（免）職而中斷。\n公務人員撥（補）繳退撫基金費用本息之標準、期限、申請程序及其他有關事項，由退撫基金管理機關擬訂，報銓敘部核定。","title":"第 三 節 退撫年資之採計及其相關事宜"},{"no":"第14條","text":"本法公布施行前退休生效公務人員，於退撫新制實施前、後均有任職年資者，應前後合併計算。其中屬於退撫新制實施前之任職年資，最高採計三十年；退撫新制實施後之任職年資可連同併計，最高採計三十五年。\n本法公布施行後退休生效公務人員，其退撫新制實施前之任職年資最高仍採計三十年。退撫新制實施前、後之任職年資可連同併計；擇領月退休金者，最高採計四十年；擇領一次退休金者，最高採計四十二年。任職年資併計後逾本項所定年資採計上限者，其退撫新制實施前、後年資之採計，由當事人自行取捨。\n前項人員不依前項規定取捨年資時，由退休案審定機關逕予取捨審定之。","title":"第 三 節 退撫年資之採計及其相關事宜"},{"no":"第15條","text":"公務人員曾依法令領取由政府編列預算或退撫基金支付退離給與或發還退撫基金費用本息者，其再任公務人員時，不得繳回原已領取之退離給與或退撫基金費用本息；其依本法重行退休、資遣或辦理撫卹時，不再核發該段年資之退撫給與。\n前項人員所具由政府編列預算或退撫基金支付退離給與或發還政府撥付之退撫基金費用或離職儲金本息之下列年資，應與依本法重行退休或資遣之年資合併計算；合計總年資不得超過前條所定最高年資採計上限，且不得超過第二十八條及第二十九條所定給與上限：\n一、公務人員年資。\n二、公立學校教職員年資。\n三、政務人員年資。\n四、公營事業人員年資。\n五、民選首長年資。\n六、中華民國八十四年七月一日退撫新制實施後轉任之軍職人員或其他公職人員年資。\n前二項人員重行退休或資遣時，其再任職年資之給與，依下列規定辦理：\n一、未曾領取退離給與之退撫新制實施前年資，應接續於前次由政府編列預算支付退撫新制實施前年資之退離給與年資之後，按接續後年資之退休金種類計算標準，核發給與。資遣者，亦同。\n二、再任年資滿十五年者，其退休金得就第二十六條第一項所定退休金種類，擇一支領，並按其審定退休年資，計算退休給與。但擇領或兼領月退休金時，應分別依第三十條、第三十一條及第三十三條所定月退休金起支年齡之規定辦理。","title":"第 三 節 退撫年資之採計及其相關事宜"},{"no":"第16條","text":"公務人員之退休，分自願退休、屆齡退休及命令退休。\n依法銓敘審定之法官，不適用第十九條屆齡退休及第二十條命令退休之規定。但合於本法所定退休條件者，得申請退休。","title":"第 一 節 退休種類及要件"},{"no":"第17條","text":"公務人員有下列情形之一者，應准其自願退休：\n一、任職滿五年，年滿六十歲。\n二、任職滿二十五年。\n公務人員任職滿十五年，有下列情形之一者，應准其自願退休：\n一、出具經中央衛生主管機關評鑑合格醫院（以下簡稱合格醫院）開立已達公教人員保險失能給付標準（以下簡稱公保失能給付標準）所訂半失能以上之證明或經鑑定符合中央衛生主管機關所定身心障礙等級為重度以上等級。\n二、罹患末期之惡性腫瘤或為安寧緩和醫療條例第三條第二款所稱之末期病人，且繳有合格醫院出具之證明。\n三、領有權責機關核發之全民健康保險永久重大傷病證明，並經服務機關認定不能從事本職工作，亦無法擔任其他相當工作。\n四、符合法定身心障礙資格，且經依勞工保險條例第五十四條之一所定個別化專業評估機制，出具為終生無工作能力之證明。\n第一項第一款所定年滿六十歲之自願退休年齡，於擔任具有危險及勞力等特殊性質職務（以下簡稱危勞職務）者，應由其權責主管機關就所屬相關機關相同職務之屬性，及其人力運用需要與現有人力狀況，統一檢討擬議酌減方案後，送銓敘部核備。但調降後之自願退休年齡不得低於五十歲。\n前項危勞職務之認定標準，由考試院會同行政院另定之。\n前項危勞職務之認定標準及依第三項規定送銓敘部核備之危勞職務範圍、年齡，應予公告。\n第一項第一款所定年滿六十歲之自願退休年齡，於具原住民身分者，降為五十五歲。但本法公布施行後，應配合原住民平均餘命與全體國民平均餘命差距之縮短，逐步提高自願退休年齡至六十歲，並由銓敘部每五年檢討一次，報考試院核定之。\n前項所定原住民身分之認定，依其戶籍登載資料為準。\n第三項所稱權責主管機關，於中央指中央二級或相當二級以上機關；於直轄市指直轄市政府及直轄市議會；於縣（市）指縣（市）政府及縣（市）議會。","title":"第 一 節 退休種類及要件"},{"no":"第18條","text":"公務人員配合機關裁撤、組織變更或業務緊縮，經其服務機關依法令辦理精簡並符合下列情形之一者，應准其自願退休：\n一、任職滿二十年。\n二、任職滿十年而未滿二十年，且年滿五十五歲。\n三、任本職務最高職等年功俸最高級滿三年，且年滿五十五歲。","title":"第 一 節 退休種類及要件"},{"no":"第19條","text":"公務人員任職滿五年，且年滿六十五歲者，應辦理屆齡退休。\n前項所定年滿六十五歲之屆齡退休年齡，於擔任危勞職務者，應由其權責主管機關就所屬相關機關相同職務之屬性，及其人力運用需要與現有人力狀況，統一檢討擬議酌減方案後，送銓敘部核備。但調降後之屆齡退休年齡不得低於五十五歲。\n前項危勞職務之認定標準，由考試院會同行政院另定之。\n前項危勞職務之認定標準及依第二項規定送銓敘部核備之危勞職務範圍、年齡，應予公告。\n第二項所稱權責主管機關，比照第十七條第八項規定認定之。\n公務人員應予屆齡退休之至遲退休生效日期（以下簡稱屆退日）如下：\n一、於一月至六月間出生者，至遲為七月十六日。\n二、於七月至十二月間出生者，至遲為次年一月十六日。","title":"第 一 節 退休種類及要件"},{"no":"第20條","text":"公務人員任職滿五年且有下列情事之一者，由其服務機關主動申辦命令退休：\n一、未符合第十七條所定自願退休條件，並受監護或輔助宣告尚未撤銷。\n二、有下列身心傷病或障礙情事之一，經服務機關出具其不能從事本職工作，亦無法擔任其他相當工作之證明：\n（一）繳有合格醫院出具已達公保失能給付標準之半失能以上之證明，且已依法領取失能給付，或經鑑定符合中央衛生主管機關所定身心障礙等級為重度以上等級之證明。\n（二）罹患第三期以上之惡性腫瘤，且繳有合格醫院出具之證明。\n服務機關依前項第二款第一目規定主動申辦公務人員之命令退休前，應比照身心障礙者權益保障法第三十三條規定提供職業重建服務。\n第一項所稱服務機關，於人事、政風及主計人員，指具有考核權責之機關。","title":"第 一 節 退休種類及要件"},{"no":"第21條","text":"前條第一項第一款及第二款人員受監護或輔助宣告或身心傷病或障礙係因執行公務所致（以下簡稱因公傷病）者，其命令退休不受任職年資滿五年之限制。\n前項所稱因公傷病，指由服務機關證明並經審定機關審定公務人員之身心傷病或障礙，確與下列情事之一具有相當因果關係者：\n一、於執行職務時，發生意外危險事故、遭受暴力事件或罹患疾病，以致傷病。\n二、於辦公場所、公差期間或因辦公、公差往返途中，發生意外危險事故，以致傷病。但因公務人員本人之重大交通違規行為以致傷病者，不適用之。\n三、於執行職務期間、辦公場所或因辦公、公差往返途中，猝發疾病，以致傷病。\n四、戮力職務，積勞過度，以致傷病。\n前項各款因公傷病及其因果關係之認定，遇有疑義時，應遴聘學者及專家組成公務人員因公命令退休及因公撫卹疑義案件審查小組進行審查。\n第二項第三款及第四款所定猝發疾病或戮力職務，積勞過度，以致傷病之審認，比照第五十三條第五項所定審查參考指引，提供前項審查小組審查個案之參考。","title":"第 一 節 退休種類及要件"},{"no":"第22條","text":"公務人員有下列各款情事之一者，應予資遣：\n一、機關裁撤、組織變更或業務緊縮時，不符本法所定退休條件而須裁減之人員。\n二、現職工作不適任，經調整其他相當工作後，仍未能達到要求標準，或本機關已無其他工作可予調任。\n三、依其他法規規定，應予資遣。\n以機要人員任用之公務人員，有前項第二款情事者，不適用前項資遣規定。","title":"第 一 節 退休種類及要件"},{"no":"第23條","text":"各機關對於公務人員之資遣，應由其服務機關首長初核後，送權責主管機關或其授權機關（構）核定，再由服務機關檢齊有關證明文件，函送審定機關依本法審定其年資及給與。\n依前條第一項第二款或第三款資遣者，其服務機關首長考核予以資遣之前，應先經考績委員會初核；考績委員會初核前，應給予當事人陳述及申辯之機會。\n前二項所稱服務機關，於人事、政風及主計人員，比照第二十條第三項規定認定之；所稱權責主管機關，比照第十七條第八項規定認定之。","title":"第 一 節 退休種類及要件"},{"no":"第24條","text":"公務人員有下列情形之一而申請退休或資遣者，應不予受理：\n一、留職停薪期間。\n二、停職期間。\n三、休職期間。\n四、動員戡亂時期終止後，涉嫌內亂罪或外患罪而有下列情形之一者：\n（一）所涉犯罪尚未判決確定。\n（二）所涉犯罪經檢察官為不起訴或緩起訴處分，尚未確定。\n（三）所涉犯罪經檢察官為緩起訴處分確定，尚未期滿。\n五、涉嫌貪污治罪條例或刑法瀆職罪章之罪，且經法院判處有期徒刑以上之刑，尚未確定。\n六、因案經權責機關依法移送懲戒或送請監察院審查中，或已經權責機關依法為懲戒判決但尚未發生效力。\n七、其他法律有特別規定。\n前項第四款至第七款人員，自屆退日起，應先行停職。\n第一項第二款及前項人員自屆退日至原因消滅之日，得比照停職人員發給半數之本（年功）俸額。","title":"第 一 節 退休種類及要件"},{"no":"第25條","text":"公務人員有前條第一項第二款至第七款情形而逾屆退日者，應於原因消滅後六個月內，以書面檢同相關證明文件，送原服務機關申請屆齡退休。\n前項人員均以其屆退日為退休生效日。但休職人員應以原因消滅並經權責機關核准復職之日為其退休生效日。\n第一項人員於所定六個月應辦理期限內死亡者，其第四十三條所定遺族得申請依一次退休金之標準核發給與。但其已達得擇領月退休金條件者，其遺族得依第四十三條至第四十八條規定，擇領遺屬一次金或遺屬年金。\n第一項人員依前條第三項規定所領之半數本（年功）俸（薪）額，由退休金支給或發放機關自所發退休金，或遺屬一次金或遺屬年金中覈實扣抵收回之。\n第一項人員有下列情形之一者，仍不得辦理退休：\n一、依法被撤職、免職或免除職務。\n二、六個月應辦理期限屆滿時，仍有第七十五條所定喪失辦理退休權利之法定事由者。","title":"第 一 節 退休種類及要件"},{"no":"第26條","text":"退休人員之退休金分下列三種：\n一、一次退休金。\n二、月退休金。\n三、兼領二分之一之一次退休金與二分之一之月退休金。\n公務人員依前項第三款兼領月退休金之退休金，各依其應領一次退休金與月退休金，按比率計算之。","title":"第 二 節 退休給付"},{"no":"第27條","text":"於本法公布施行前退休之公務人員，其退休金以最後在職經銓敘審定之本（年功）俸（薪）額為計算基準，並依下列規定計算基數內涵：\n一、退撫新制實施前年資之給與：一次退休金以最後在職同等級人員之本（年功）俸（薪）額加新臺幣九百三十元為基數內涵；月退休金以最後在職同等級人員之本（年功）俸（薪）額為基數內涵，另十足發給新臺幣九百三十元。\n二、退撫新制實施後年資之給與：以最後在職同等級人員之本（年功）俸（薪）額加一倍為基數內涵。\n於本法公布施行後退休之公務人員，其退撫新制實施前、後年資應給之退休金，依下列規定計算基數內涵：\n一、退撫新制實施前年資之給與：\n（一）一次退休金：依附表一所列退休年度適用之平均俸（薪）額，加新臺幣九百三十元為基數內涵。\n（二）月退休金：依附表一所列退休年度適用之平均俸（薪）額為基數內涵；另十足發給新臺幣九百三十元。\n二、退撫新制實施後年資之給與：依附表一所列各年度平均俸（薪）額加一倍為基數內涵。\n於本法公布施行前，已符合法定支領月退休金條件而於本法公布施行後退休生效之公務人員，其退撫新制實施前、後年資應給之退休金仍按第一項所定退休金計算基準與基數內涵計給之。","title":"第 二 節 退休給付"},{"no":"第28條","text":"公務人員所具退撫新制實施前任職年資應給與之退休金，依前條所定退休金計算基準與基數內涵，按下列標準計算給與：\n一、一次退休金：任職滿五年者，給與九個基數；以後每增一年，加給二個基數；滿十五年後，另行一次加發二個基數；最高總數以六十一個基數為限。其退休年資未滿一年之畸零月數，按畸零月數比率計給；未滿一個月者，以一個月計。\n二、月退休金：每任職一年，照基數內涵百分之五給與；未滿一年者，每一個月給與一千二百分之五；滿十五年後，每增一年給與百分之一；最高以百分之九十為限。其退休年資未滿一年之畸零月數，按畸零月數比率計給；未滿一個月者，以一個月計。","title":"第 二 節 退休給付"},{"no":"第29條","text":"公務人員所具退撫新制實施後任職年資應給與之退休金，依第二十七條所定退休金計算基準與基數內涵，按下列標準計給：\n一、一次退休金：按照任職年資，每任職一年，給與一又二分之一個基數，最高三十五年，給與五十三個基數；退休審定總年資超過三十五年者，自第三十六年起，每增加一年，增給一個基數，最高給與六十個基數。其退休年資未滿一年之畸零月數，按畸零月數比率計給；未滿一個月者，以一個月計。\n二、月退休金：按照任職年資，每任職一年，照基數內涵百分之二給與，最高三十五年，給與百分之七十；退休審定總年資超過三十五年者，自第三十六年起，每增一年，照基數內涵百分之一給與，最高給與百分之七十五。其退休年資未滿一年之畸零月數，按畸零月數比率計給；未滿一個月者，以一個月計。","title":"第 二 節 退休給付"},{"no":"第30條","text":"公務人員任職年資未滿十五年而依本法辦理退休者，除本法另有規定外，應支領一次退休金。\n公務人員任職滿十五年而依第十七條第二項或第十九條至第二十一條規定，辦理退休者，除本法另有規定外，其退休金由公務人員依第二十六條所定退休金種類，擇一支領。\n公務人員依第十八條規定辦理退休者，依下列規定支領退休金：\n一、任職滿二十年者：\n（一）年滿六十歲，得依第二十六條所定退休金種類，擇一支領。\n（二）年齡未滿六十歲者，得依第三十一條第四項規定，擇一支領退休金並以年滿六十歲為月退休金起支年齡。\n二、任職滿十五年而未滿二十年，且年滿五十五歲者，得依第三十一條第四項規定，擇一支領退休金並以年滿六十五歲為月退休金起支年齡。\n三、任本職務最高職等年功俸最高級滿三年且年滿五十五歲者：\n（一）任職年資超過十五年者，得依第三十一條第四項規定，擇一支領退休金並以年滿六十五歲為月退休金起支年齡。\n（二）任職年資未滿十五年者，應支領一次退休金。","title":"第 二 節 退休給付"},{"no":"第31條","text":"公務人員任職滿十五年，依第十七條第一項規定辦理退休者，符合下列月退休金起支年齡規定，得擇領全額月退休金：\n一、中華民國一百零九年十二月三十一日以前退休且符合下列規定之一者：\n（一）年滿六十歲。\n（二）任職年資滿三十年且年滿五十五歲。\n二、中華民國一百十年退休者，應年滿六十歲，其後每一年提高一歲，至中華民國一百十五年一月一日以後為六十五歲。\n公務人員任職滿十五年，依第十七條第二項規定辦理退休者，年滿五十五歲，得擇領全額月退休金。\n公務人員任職滿二十五年，依第十七條第六項規定辦理退休者，年滿五十五歲，得擇領全額月退休金；於中華民國一百十年後退休者，其後每一年提高一歲，至中華民國一百十五年一月一日以後為六十歲。\n前三項人員於未達月退休金起支年齡前，得就下列方式，擇一請領退休金：\n一、支領一次退休金。\n二、至年滿月退休金起支年齡之日起，領取全額月退休金（以下簡稱展期月退休金）。\n三、提前於年滿月退休金起支年齡前，開始領取月退休金；每提前一年，減發百分之四（以下簡稱減額月退休金），最多得提前五年，減發百分之二十。\n四、支領二分之一之一次退休金，並至年滿月退休金起支年齡之日起領取二分之一之月退休金。\n五、支領二分之一之一次退休金，並提前於年滿月退休金起支年齡前開始領取二分之一之月退休金，每提前一年減發百分之四，最多得提前五年減發百分之二十。\n公務人員退休生效日在本法公布施行前，原經審定支領展期月退休金或減額月退休金者，仍依原適用之規定辦理。\n第一項人員依第十七條第一項規定辦理退休而有下列情事之一者，得擇領或兼領全額月退休金，不受第一項月退休金起支年齡之限制：\n一、曾依公教人員保險法規定領有失能給付，且於退休前五年內有申請延長病假致考績列丙等或無考績之事實。\n二、退休生效時符合下列年齡規定，且可採計退休年資與實際年齡合計數大於或等於附表二所定年度指標數：\n（一）中華民國一百零九年十二月三十一日以前退休者，應年滿五十歲。\n（二）中華民國一百十年一月一日至中華民國一百十四年十二月三十一日退休者，應年滿五十五歲。\n（三）中華民國一百十五年一月一日以後退休者，應年滿六十歲。\n前項第二款所定退休年資與實際年齡合計數，應以整數年資及整數歲數合併計算之；未滿一年之畸零年資或歲數均不計。","title":"第 二 節 退休給付"},{"no":"第32條","text":"公務人員依第二十一條規定辦理因公傷病命令退休並請領一次退休金時，其任職未滿五年者，以五年計給。其請領月退休金時，任職未滿二十年者，以二十年計給。\n公務人員依第二十一條第二項第一款規定辦理因公傷病命令退休者，加發五至十五個基數之一次退休金；其加發標準於本法施行細則定之。\n前項人員加發一次退休金時，因同一事由而其他法律另有加發規定者，僅得擇一支領。\n本法公布施行前、後因公傷病命令退休人員，有下列情形之一者，不適用第三十七條及第三十八條規定：\n一、因執行職務時，發生意外危險事故、遭受暴力事件或罹患疾病，以致傷病。\n二、因前款以外之情形，以致傷病且致全身癱瘓或致日常生活無法自理。","title":"第 二 節 退休給付"},{"no":"第33條","text":"公務人員依第十七條第三項規定，辦理危勞職務自願退休時，其退休金依下列規定給與：\n一、退休年資未滿十五年者，給與一次退休金。\n二、退休年資滿十五年且年滿五十五歲者，得依第二十六條所定退休金種類，擇一支領。\n三、退休年資滿十五年而未滿五十五歲者，依第三十一條第四項規定，擇一支領退休金。","title":"第 二 節 退休給付"},{"no":"第34條","text":"退休公務人員因兼具退撫新制實施前、後年資而得依原公務人員退休法第三十條第二項及第三項規定核發補償金者，於本法公布施行之日起一年內退休生效時，仍依原規定核發。\n本法公布施行前已依原公務人員退休法第三十條第二項及第三項規定審定並領取補償金者，仍照本法公布施行前原適用之規定發給。\n前項人員已依原公務人員退休法第三十條第二項規定審定並領取月補償金者，於本法公布施行後，以其核定退休年資、等級，按退休時同等級現職人員本（年功）俸（薪）額，依原公務人員退休法第三十條第二項規定，計算其應領之一次補償金，扣除其於本法公布施行前、後所領之月補償金後，補發其餘額。無餘額者，不再補發。","title":"第 二 節 退休給付"},{"no":"第35條","text":"退休公務人員按其退撫新制實施前任職年資所領取之一次退休金，及退撫新制實施前參加公保年資所領取之一次養老給付，得由臺灣銀行股份有限公司辦理優惠存款。\n前項一次退休金與公保一次養老給付優惠存款之適用對象、辦理條件、可辦理優惠存款金額、期限、利息差額補助及其他有關優惠存款之事項，由考試院會同行政院以辦法定之。\n本法公布施行前已退休並支領或兼領月退休金人員，其辦理公保一次養老給付優惠存款之金額，依本法公布施行前之規定辦理。","title":"第 二 節 退休給付"},{"no":"第36條","text":"退休公務人員支領月退休金者，其公保一次養老給付之優惠存款利率（以下簡稱優存利率），依下列規定辦理：\n一、自中華民國一百零七年七月一日至一百零九年十二月三十一日止，年息百分之九。\n二、自中華民國一百十年一月一日起，年息為零。\n前項人員除支領減額月退休金者外，其公保一次養老給付之優存利息，依前項規定計算後，致每月退休所得低於第三十七條及附表三所定最末年替代率上限金額時，按該金額中，屬於公保一次養老給付優存利息部分，照年息百分之十八計算其公保一次養老給付可辦理優惠儲存之金額。但依本法公布施行前規定計算之每月退休所得（以下簡稱原金額）原即低於第三十七條及附表三所定最末年替代率上限金額者，依原儲存之金額及年息百分之十八辦理優惠存款。\n依前二項、第三十七條至第三十九條規定計算後之每月退休所得低於或等於最低保障金額者，應按最低保障金額中，屬於公保一次養老給付優存利息部分，照年息百分之十八計算其公保一次養老給付可辦理優惠儲存之金額。但原金額原即低於最低保障金額者，依原儲存之金額及年息百分之十八辦理優惠存款。\n退休公務人員支領一次退休金者，其一次退休金與公保一次養老給付之優存利率，依下列規定辦理：\n一、一次退休金與公保一次養老給付合計之每月優存利息高於最低保障金額者：\n（一）最低保障金額之優存利息相應之本金，以年息百分之十八計息。\n（二）超出最低保障金額之優存利息相應之本金，其優存利率依下列規定辦理：\n      1.自中華民國一百零七年七月一日至一百零九年十二月三十一日止，年息百分之十二。\n      2.自中華民國一百十年一月一日至一百十一年十二月三十一日止，年息百分之十。\n      3.自中華民國一百十二年一月一日至一百十三年十二月三十一日止，年息百分之八。\n      4.自中華民國一百十四年一月一日起，年息百分之六。\n二、一次退休金與公保一次養老給付合計之每月優存利息低於或等於最低保障金額者，其優存本金以年息百分之十八計息。\n退休公務人員兼領月退休金者，依下列規定辦理：\n一、按兼領月退休金比率計得之公保一次養老給付優存金額，依第一項至第三項規定辦理。但最低保障金額及第二項所定最末年替代率上限金額應按其兼領月退休金之比率計算。\n二、兼領之一次退休金得辦理優惠存款金額，加計按兼領一次退休金比率計得之公保一次養老給付優存金額，依前項規定辦理。但最低保障金額應按其兼領一次退休金之比率計算。","title":"第 二 節 退休給付"},{"no":"第37條","text":"本法公布施行前退休生效者之每月退休所得，於本法公布施行後，不得超過依替代率上限計算之金額。\n前項替代率應依退休人員審定之退休年資，照附表三所定替代率計算，任職滿十五年者，替代率為百分之四十五，其後每增加一年，替代率增給百分之一點五，最高增至三十五年，為百分之七十五。未滿一年之畸零年資，按比率計算；未滿一個月者，以一個月計。\n前項替代率之上限，依退休人員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本法公布施行前退休生效者，應按本法公布施行時之待遇標準，依前四項規定重新計算每月退休所得；經審定後，不再隨在職同等級人員本（年功）俸之調整重新計算。\n本法於中華民國一百十四年十二月十二日修正公布前或後退休生效者，一律以附表三所定中華民國一百十二年一月一日至一百十二年十二月三十一日之退休所得替代率上限認定之；附表三有關自中華民國一百十三年一月一日以後，逐年下降所得替代率之部分，不適用之。","title":"第 二 節 退休給付"},{"no":"第38條","text":"本法公布施行後退休生效者之每月退休所得，不得超過依替代率上限計算之金額。\n前項替代率應依退休人員審定之退休年資，照附表三所定替代率計算；任職滿十五年至第三十五年者，照前條第二項規定辦理；超過第三十五年者，每增加一年，增給百分之零點五，最高增至四十年止。未滿一年之畸零年資，按比率計算；未滿一個月者，以一個月計。\n前項替代率之上限，依退休人員審定之退休年資，照附表三所列各年度替代率認定。\n前三項所定替代率，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。\n本法公布施行後退休生效者，應按退休生效時之待遇標準，依前四項規定計算每月退休所得；經審定後，不再隨在職同等級人員本（年功）俸之調整重新計算。\n本法於中華民國一百十四年十二月十二日修正公布前或後退休生效者，一律以附表三所定中華民國一百十二年一月一日至一百十二年十二月三十一日之退休所得替代率上限認定之；附表三有關自中華民國一百十三年一月一日以後，逐年下降所得替代率之部分，不適用之。","title":"第 二 節 退休給付"},{"no":"第39條","text":"退休人員每月退休所得，依第三十六條規定調降優存利息後，仍超出附表三所定各年度替代率上限者，應依下列順序，扣減每月退休所得，至不超過其替代率上限所得金額止：\n一、每月所領公保一次養老給付或一次退休金優存利息。\n二、退撫新制實施前年資所計得之月退休金（含月補償金）。\n三、退撫新制實施後年資所計得之月退休金。\n退休人員每月所領退休所得，依第三十七條或前條規定計算後，有低於最低保障金額者，支給最低保障金額。但原金額原即低於最低保障金額者，依原金額支給。\n前項所定最低保障金額，於選擇兼領月退休金者，各依其兼領一次退休金與兼領月退休金比率計算。","title":"第 二 節 退休給付"},{"no":"第40條","text":"退休公務人員退休所得依第三十六條至第三十八條規定扣減後，各級政府每年所節省之退撫經費支出，應全數挹注退撫基金，不得挪作他用。\n前項挹注退撫基金之金額，由考試院會同行政院於退休公務人員每月退休所得調降後之次年三月一日前確定，再由基金管理機關依據預算程序，編列為下一年度預算並由各級政府於年度預算完成立法程序後撥付之。\n前項每年度之挹注金額，由基金管理機關定期上網公告之。","title":"第 二 節 退休給付"},{"no":"第41條","text":"公務人員因配合機關裁撤、組織變更或業務緊縮，依法令辦理精簡而退休或資遣者，除屆齡退休者外，得一次加發最高七個月之俸給總額慰助金。\n前項人員已達屆齡退休生效日前七個月者，加發之俸給總額慰助金應按提前退休之月數發給。\n前二項人員於退休、資遣生效日起七個月內，再任第七十七條第一項各款所列職務之一且每月支領薪酬總額超過法定基本工資，應由再任機關扣除其退休、資遣月數之俸給總額慰助金後，收繳其餘額，並繳回原服務機關、改隸機關或上級主管機關。","title":"第 二 節 退休給付"},{"no":"第42條","text":"公務人員之資遣給與，準用第二十八條及第二十九條所定一次退休金給與標準計給。","title":"第 二 節 退休給付"},{"no":"第43條","text":"支領或兼領月退休金人員死亡後，另核給其遺族遺屬一次金。其應核給金額，除由未再婚配偶領受二分之一外，其餘由下列順序之遺族，依序平均領受之：\n一、子女。\n二、父母。\n三、兄弟姊妹。\n四、祖父母。\n亡故退休人員無前項第一款及第二款遺族者，其遺屬一次金由未再婚配偶單獨領受；無配偶時，其應領之遺屬一次金，依序由前項各款遺族領受；同一順序遺族有數人時，遺屬一次金由同一順序有領受權之遺族平均領受。\n同一順序遺族有拋棄或因法定事由而喪失領受權者，其遺屬一次金應由同一順序其他遺族依前二項規定領受；無第一順序遺族時，由次一順序遺族依前項規定領受。\n前三項具有遺屬一次金領受權之同一順序遺族有數人請領時，得委任其中具有行為能力者一人代為申請。遺族為無行為能力者，由其法定代理人代為申請。","title":"第 三 節 遺屬一次金與遺屬年金"},{"no":"第44條","text":"前條遺屬一次金應依下列方式計給：\n一、先依退休人員審定之退休年資及最後支領月退休金之計算基準及基數內涵，按退休人員退休時適用之支給標準，計算其應領之一次退休金並扣除已領月退休金後，核給其餘額。無餘額者，不再發給。\n二、再依退休人員最後在職同等級人員每月所領本（年功）俸（薪）額加計一倍金額，另計給六個基數之遺屬一次金。無前款所定餘額者，亦同。","title":"第 三 節 遺屬一次金與遺屬年金"},{"no":"第45條","text":"第四十三條第一項所定遺族為配偶、未成年子女、身心障礙且無工作能力之已成年子女或父母而不支領遺屬一次金者，得依下列規定，按退休人員亡故時所領月退休金之二分之一或兼領月退休金之二分之一，改領遺屬年金：\n一、具備以下條件之一且未再婚配偶，給與終身。但以其法定婚姻關係於退休人員亡故時，已累積存續十年以上為限：\n（一）年滿五十五歲。\n（二）身心障礙且無工作能力。\n二、未成年子女給與至成年為止。但身心障礙且無工作能力之已成年子女，給與終身。\n三、父母給與終身。\n未滿五十五歲而不得依前項第一款領受遺屬年金之未再婚配偶，得自年滿五十五歲之日起，支領終身遺屬年金。\n第一項第一款及第二款所定亡故退休人員因身心障礙且無工作能力之未再婚配偶，或因身心障礙且無工作能力之子女，應符合法定重度以上身心障礙資格領有身心障礙手冊或證明，或受監護宣告尚未撤銷，並每年度出具前一年度年終所得申報資料，證明其平均每月所得未超過法定基本工資。\n第一項各款所定遺族領有依本法或其他法令規定核給之退休金、撫卹金、優存利息或其他由政府預算、公營事業機構支給相當於退離給與之定期性給付者，不得擇領遺屬年金。但遺族選擇放棄本人應領之定期給與並經原發給定期給與之權責機關同意者，不在此限。\n亡故退休人員遺族依第一項規定擇領遺屬年金後，有死亡或其他法定喪失遺屬年金原因，致應終止領受遺屬年金時，應依前條規定計算亡故退休人員應領之一次退休金，扣除其與遺族已領之月退休金及遺屬年金後，若有餘額，由其餘遺族，按第四十三條規定之順序及比率領受之。","title":"第 三 節 遺屬一次金與遺屬年金"},{"no":"第46條","text":"支領或兼領月退休金而於本法公布施行前死亡者，其遺族除有前條第五項情形外，仍依本法公布施行前之原規定，擇領遺屬一次金或遺屬年金。\n支領或兼領月退休金而於本法公布施行之日起一年內死亡者，其遺族擇領遺屬年金時，依本法公布施行前之原公務人員退休法第十八條規定辦理，不適用前條第四項規定。","title":"第 三 節 遺屬一次金與遺屬年金"},{"no":"第47條","text":"支領或兼領月退休金人員死亡而有下列情形之一者，原服務機關得先行具領三個基數之遺屬一次金，辦理其喪葬事宜：\n一、無合法之遺屬一次金領受遺族。\n二、在臺灣地區無遺族，其居住大陸地區遺族未隨侍辦理喪葬。\n三、在臺灣地區無遺族且不明大陸地區有無遺族。\n前項用以辦理亡故退休人員喪葬事宜之遺屬一次金如有賸餘，依其退撫新制實施前、後審定年資之比率計算，分別歸屬公庫及退撫基金。\n第一項第二款、第三款人員合於請領遺屬一次金之大陸地區遺族，得於行政程序法所定公法上請求權時效內，請領服務機關未具領之三個基數遺屬一次金及前項遺屬一次金餘額。","title":"第 三 節 遺屬一次金與遺屬年金"},{"no":"第48條","text":"退休人員生前預立遺囑，於第四十三條第一項遺族中，指定遺屬一次金或遺屬年金領受人者，從其遺囑。但退休人員未成年子女之領受比率，不得低於其原得領取比率。\n退休人員生前未立遺囑且同一順序遺族無法協調選擇同一種類之遺屬一次金或遺屬年金時，由遺族分別依其擇領種類，按第四十三條第一項規定之比率領取。","title":"第 三 節 遺屬一次金與遺屬年金"},{"no":"第49條","text":"退休人員依第三十條第三項、第三十一條第四項第二款及第三十三條第三款規定，擇領展期月退休金人員，於未達月退休金起支年齡前亡故時，其遺族得按所具資格條件，依第四十三條或第四十五條規定，請領遺屬一次金或遺屬年金。","title":"第 三 節 遺屬一次金與遺屬年金"},{"no":"第50條","text":"退撫新制實施後，至本法公布施行前已審定支領或兼領月退休金而於本法公布施行後亡故者，其遺族應依第四十三條至第四十五條規定，請領遺屬一次金或遺屬年金。\n退撫新制實施前已審定支領或兼領月退休金人員於本法公布施行後亡故時，其遺族所領遺屬一次金照退撫新制實施前原規定給與標準支給。\n前項遺族符合第四十五條規定者，得改領遺屬年金。","title":"第 三 節 遺屬一次金與遺屬年金"},{"no":"第51條","text":"公務人員在職死亡者，由其遺族或服務機關申辦撫卹。\n公務人員於休職、停職或留職停薪期間死亡者，其遺族或服務機關得依本法規定，申辦撫卹。\n本法公布施行前死亡之公務人員撫卹案，依本法公布施行前原規定辦理。","title":"第 一 節 撫卹要件及原因"},{"no":"第52條","text":"公務人員在職死亡之撫卹原因如下：\n一、病故或意外死亡。\n二、因執行公務以致死亡（以下簡稱因公死亡）。\n自殺死亡比照病故或意外死亡認定。但因犯罪經判刑確定後，於免職處分送達前自殺者，不予撫卹。","title":"第 一 節 撫卹要件及原因"},{"no":"第53條","text":"公務人員在職因公死亡者，應辦理因公撫卹。\n前項所稱因公死亡，指現職公務人員係因下列情事之一死亡，且其死亡與該情事具有相當因果關係者：\n一、執行搶救災害（難）或逮捕罪犯等艱困任務，或執行與戰爭有關任務時，面對存有高度死亡可能性之危害事故，仍然不顧生死，奮勇執行任務，以致死亡。\n二、於辦公場所，或奉派公差（出）執行前款以外之任務時，發生意外或危險事故，或遭受暴力事件，或罹患疾病，以致死亡。\n三、於辦公場所，或奉派公差（出）執行前二款任務時，猝發疾病，以致死亡。\n四、因有下列情形之一，以致死亡：\n（一）執行第一款任務之往返途中，發生意外或危險事故。\n（二）執行第一款或第二款任務之往返途中，猝發疾病，或執行第二款任務之往返途中，發生意外或危險事故。\n（三）為執行任務而為必要之事前準備或事後之整理期間，發生意外或危險事故，或猝發疾病。\n五、戮力職務，積勞過度，以致死亡。\n前項第四款第一目及第二目規定，係因公務人員本人之重大交通違規行為而發生意外事故以致死亡者，以意外死亡辦理撫卹。\n第二項各款因公撫卹事由及其因果關係之認定，應延聘醫學、法律及人事行政等領域之學者或專家，組成專案審查小組，依據事實及學理審認之。\n第二項第三款與第四款所定猝發疾病及第五款所定戮力職務，積勞過度，以致死亡之審認，由銓敘部另訂公務人員因公猝發疾病或因戮力職務積勞過度以致死亡審查參考指引，提供前項審查小組審查個案之參考。","title":"第 一 節 撫卹要件及原因"},{"no":"第54條","text":"公務人員在職病故或意外死亡者，其撫卹金給與之種類如下：\n一、一次撫卹金。\n二、一次撫卹金及月撫卹金。\n前項撫卹金之給與，依下列標準計算：\n一、任職未滿十五年者，依下列規定，發給一次撫卹金：\n（一）任職滿十年而未滿十五年者，每任職一年，給與一又二分之一個基數；未滿一年者，每一個月給與八分之一個基數；其未滿一個月者，以一個月計。\n（二）任職未滿十年者，除依前目規定給卹外，每少一個月，加給十二分之一個基數，加至滿九又十二分之十一個基數後，不再加給（如附表四）。但曾依法令領取由政府編列預算或退撫基金支付之退離給與或發還退撫基金費用本息者，其年資應合併計算；逾十年者，不再加給。\n二、任職滿十五年者，依下列規定發給一次撫卹金及月撫卹金：\n（一）每月給與二分之一個基數之月撫卹金。\n（二）前十五年給與十五個基數一次撫卹金。超過十五年部分，每增一年，加給二分之一個基數，最高給與二十七又二分之一個基數；未滿一年之月數，每一個月給與二十四分之一個基數；未滿一個月者，以一個月計。\n前項基數內涵之計算，以附表一所列平均俸額加一倍為準。","title":"第 二 節 撫卹給與"},{"no":"第55條","text":"公務人員於退撫新制實施前、後均有任職年資者，其撫卹年資應合併計算。但退撫新制實施前任職年資，最高採計三十年；退撫新制實施後任職年資，可連同併計；併計後不得超過四十年。\n前項任職年資之取捨，應優先採計退撫新制實施後年資。\n公務人員因公死亡者，依下列規定擬制撫卹金給與年資：\n一、依第五十三條第二項第一款撫卹者，其任職未滿十五年者，以十五年計給撫卹金；其任職滿十五年而未滿二十五年者，以二十五年計給撫卹金；其任職滿二十五年而未滿三十五年者，以三十五年計給撫卹金。\n二、依第五十三條第二項第二款至第五款規定撫卹者，其任職未滿十五年者，以十五年計給撫卹金；其任職滿十五年者，以實際任職年資計給撫卹金。","title":"第 二 節 撫卹給與"},{"no":"第56條","text":"公務人員在職亡故後，其遺族月撫卹金之給與月數規定如下：\n一、依第五十三條第二項第一款規定撫卹者，給與二百四十個月之月撫卹金。\n二、依第五十三條第二項第二款規定撫卹者，給與一百八十個月之月撫卹金。\n三、依第五十三條第二項第三款、第四款第二目與第三目及第五款規定撫卹者，給與一百二十個月之月撫卹金。\n四、依第五十三條第二項第四款第一目規定撫卹者，給與一百八十個月之月撫卹金。\n五、病故或意外死亡者，給與一百二十個月之月撫卹金。\n前項領受人屬未成年子女者，於前項所定給卹期限屆滿時尚未成年者，得繼續給卹至成年為止；子女雖已成年，仍在學就讀者，得繼續給卹至取得學士學位止。\n前項所定在學就讀者，以就讀國內學校具有學籍之學生，且在法定修業年限之就學期間為限；就讀大學或獨立學院者，以取得一個學士學位為限。\n第一項月撫卹金領受人屬因身心障礙而無工作能力之子女，得檢同法定重度以上身心障礙手冊或證明，或已受監護宣告尚未撤銷之證明，依第六十二條所定給與比率，申請終身給卹；其屬已成年子女者，並應每年度出具前一年度年終所得申報資料，證明其平均每月所得未超過法定基本工資。","title":"第 二 節 撫卹給與"},{"no":"第57條","text":"公務人員依第五十三條第二項規定辦理因公撫卹者，除依第五十四條第二項、第五十五條第三項及第五十六條規定給卹外，並依下列規定，加給一次撫卹金：\n一、依第五十三條第二項第一款規定撫卹者，加給百分之五十。\n二、依第五十三條第二項第二款規定撫卹者，加給百分之二十五。\n三、依第五十三條第二項第三款、第四款第二目與第三目及第五款規定撫卹者，加給百分之十。\n四、依第五十三條第二項第四款第一目規定撫卹者，加給百分之十五。","title":"第 二 節 撫卹給與"},{"no":"第58條","text":"公務人員任職未滿十五年而病故或意外死亡且遺有未成年子女者，其遺族除依第五十四條第二項第一款規定給卹外，每一未成年子女每月再比照國民年金法規定之老年基本保證年金給與標準，加發撫卹金，至成年為止。\n公務人員任職滿十五年而病故或意外死亡且遺有未成年子女者，除依第五十四條第二項第二款及第五十六條規定給卹外，每一未成年子女每月再比照國民年金法規定之老年基本保證年金給與標準，加發撫卹金，至成年為止。","title":"第 二 節 撫卹給與"},{"no":"第59條","text":"公務人員因公死亡而遺有未成年子女者，其遺族除依第五十四條第二項第二款、第五十五條第三項、第五十六條及第五十七條規定給卹外，每一未成年子女每月再比照國民年金法規定之老年基本保證年金給與標準，加發撫卹金，至成年為止。","title":"第 二 節 撫卹給與"},{"no":"第60條","text":"公務人員任職滿十五年死亡者，其生前預立遺囑，不依第五十四條第二項第二款規定請領撫卹金者，得改按一次退休金之標準，發給一次撫卹金。其無遺囑而遺族不依第五十四條第二項第二款規定辦理者，亦同。\n公務人員因公死亡，或任職滿十五年病故或意外死亡，且遺族僅存祖父母或兄弟姊妹者，應改按一次退休金之標準，發給一次撫卹金。\n亡故公務人員之遺族依第一項規定請領撫卹金者，其依第五十七條規定應加給之一次撫卹金，仍依第五十四條第二項第二款第二目所定標準計給。","title":"第 二 節 撫卹給與"},{"no":"第61條","text":"亡故公務人員應由各級政府編列預算，給與殮葬補助費。公務人員於休職、停職或留職停薪期間死亡者，亦同。\n前項應給與之殮葬補助費給與標準，於本法施行細則定之。\n公務人員受有勳章或有特殊功績者，得給與勳績撫卹金；其給與標準，於本法施行細則定之。","title":"第 二 節 撫卹給與"},{"no":"第62條","text":"公務人員之遺族撫卹金，由未再婚配偶領受二分之一；其餘由下列順序之遺族，依序平均領受之：\n一、子女。\n二、父母。\n三、祖父母。\n四、兄弟姊妹。\n亡故公務人員無前項第一款至第三款遺族者，其撫卹金由未再婚配偶單獨領受；無配偶或配偶再婚時，其應領之撫卹金，依序由前項各款遺族領受；同一順序遺族有數人時，撫卹金由同一順序具有領受權之遺族平均領受。\n同一順序遺族有死亡、拋棄或因法定事由而喪失或停止領受權者，其撫卹金應由同一順序其他遺族依前二項規定領受；無第一順序遺族時，由次一順序遺族依前項規定領受。\n前三項具有撫卹金領受權之同一順序遺族有數人請領時，得委任其中具有行為能力者一人代為申請。遺族為無行為能力者，由其法定代理人代為申請。\n亡故公務人員之遺族行蹤不明，或未能依前項規定，取得一致請領之協議者，得由其他遺族按具有領受權之人數比率，分別請領撫卹金。\n依法審定之同一順序月撫卹金領受人，於月撫卹金領受期限內均喪失領受權時，依下列規定辦理：\n一、依一次退休金之標準，計算一次撫卹金，減除已領月撫卹金金額後，補發其餘額；無餘額者，不再發給。\n二、依前款規定核算而應補發餘額者，依序由次一順序之遺族平均領受；無次一順序遺族或次一順序遺族均喪失領受權時，不再發給。","title":"第 三 節 撫卹金領受人"},{"no":"第63條","text":"前條第一項第一款所定領受人死亡、拋棄或因法定事由而喪失領受權者，由其子女代位領受之，不適用前條第三項規定。\n公務人員生前預立遺囑，於前條第一項遺族中，指定撫卹金領受人者，從其遺囑。但公務人員未成年子女之領受比率，不得低於其原得領取比率。\n公務人員死亡而無前條第一項遺族可申辦撫卹者，其繼承人得向退撫基金管理機關申請發還原繳付之退撫基金本息；無繼承人者，得由原服務機關先行具領，辦理喪葬事宜。有賸餘者，歸屬退撫基金。","title":"第 三 節 撫卹金領受人"},{"no":"第64條","text":"公務人員請領退休金及資遣給與，屬公務人員之專屬權利，除下列情形外，不得由他人代為申請及領受：\n一、年滿六十五歲而拒依規定辦理屆齡退休，經服務機關主動檢同相關文件，送審定機關審定屆齡退休者。\n二、經服務機關依第二十條規定，檢同相關文件，送審定機關辦理命令退休者。\n三、資遣人員未依規定填具資遣事實表並檢同相關證明文件，交由服務機關函轉審定機關審定資遣年資及給與，須由服務機關代為辦理者。\n四、受監護宣告尚未撤銷，須由法定監護人代為申請退休或資遣者。\n五、依第二十五條第三項規定，改由遺族按一次退休金標準支領給與者。","title":"第 一 節 退撫給與之發給"},{"no":"第65條","text":"公務人員或其遺族依本法申請退撫給與之案件，應由審（核）定機關以書面行政處分為之。\n本法公布施行前退休生效者之每月退休所得，依第三十六條、第三十七條及第三十九條規定重新計算時，應由審（核）定機關以書面行政處分為之。","title":"第 一 節 退撫給與之發給"},{"no":"第66條","text":"本法所定退撫給與，一律採金融機構直撥入帳方式為之，並依下列規定發給：\n一、一次退休金及首期月退休金經審定機關審定後，自退休生效日起發給。但依第三十條第三項、第三十一條第四項第二款及第三十三條第三款規定擇領展期月退休金者，自其年滿法定起支年齡之日起發給。第二期以後之月退休金，配合統一作業，每一個月發給一次。\n二、資遣給與經審定機關審定後，自資遣生效日起發給。\n三、遺屬一次金及一次撫卹金，經審定機關審定後發給。\n四、遺屬年金經審定機關審定後，自退休人員死亡時之次一個月退休金定期發給日起發給。但未再婚配偶依第四十五條第二項規定擇領遺屬年金者，應自其年滿法定起支年齡之日起發給。第二期以後之遺屬年金，配合統一作業，每月發給一次。\n五、首期月撫卹金經審定機關審定後，自公務人員死亡之次月起發給；第二期以後之月撫卹金，配合統一作業，每月發給一次。第五十八條及第五十九條所定按遺族未成年子女人數，每月加發之撫卹金，亦同。\n前項退撫給與之領受人資格之查驗、發放作業程序及其他相關事項，由主管機關另以辦法定之。","title":"第 一 節 退撫給與之發給"},{"no":"第67條","text":"公務人員退休後所領月退休金，或遺族所領之月撫卹金或遺屬年金給付金額，於中央主計機關發布之消費者物價指數累計成長率達正百分之五時，應依該成長率調整之；或至少每四年應予檢討，適當調整，但成長率為零或負數時，不予調整；其相關執行規定，於本法施行細則定之。","title":"第 一 節 退撫給與之發給"},{"no":"第68條","text":"公務人員於退撫新制實施前、後均有任職年資者，其退撫給與及優存利息依下列規定支給：\n一、退撫新制實施前任職年資應領之退撫給與及優存利息，由各級政府編列預算支給。\n二、退撫新制實施後任職年資應領之退撫給與，由退撫基金支給。\n三、依第三十二條第二項規定加發之退休金，由各級政府編列預算支給。\n四、依第四十一條規定加發之俸給總額慰助金，由服務機關編列預算支給。\n五、下列各目所定給與，由各級政府編列預算支給：\n（一）依第五十四條第二項第一款第二目加發之一次撫卹金；依第五十五條第三項及第五十七條規定因公死亡加發之撫卹金。\n（二）依第五十八條及第五十九條規定加發之撫卹金。\n（三）依第六十一條規定發給之殮葬補助費與勳績撫卹金。","title":"第 一 節 退撫給與之發給"},{"no":"第69條","text":"公務人員或其遺族請領退撫給與之權利，不得作為讓與、抵銷、扣押或供擔保之標的。但公務人員之退休金依第八十二條規定被分配者，不在此限。\n退撫給與之領受人，得於金融機構開立專戶，專供存入退撫給與之用。\n前項專戶內之存款不得作為抵銷、扣押、供擔保或強制執行之標的。\n退撫給與領受人有冒領或溢領情事者，支給或發放機關應就其冒領或溢領之款項覈實收回，不受第一項及前項規定之限制。","title":"第 一 節 退撫給與之發給"},{"no":"第70條","text":"公務人員或其遺族因法定事由發生，或行政處分經撤銷或廢止而應暫停、停止、喪失請領權利，或有機關（構）誤發情事，而溢領或誤領相關退撫給與者，由支給或發放機關以書面行政處分，命當事人於一定期限內繳還自應暫停、喪失、停止請領權利之日起溢領或誤領之金額；屆期而不繳還者，依行政執行法相關規定強制執行之。\n前項人員溢領或誤領之金額，屬定期給付者，得由支給或發放機關通知當事人自下一定期以後發給之退撫給與中覈實收回；當事人若有異議且未以其他方式繳回者，由支給或發放機關依前項規定辦理。\n支領一次退休金或公保一次養老給付並辦理優惠存款之退休人員有暫停、喪失、停止、依法撤銷或廢止其請領退撫給與之情事者，其優惠存款應同時停止辦理。未依規定停止辦理者，由支給或服務機關依第一項規定辦理追繳。\n前三項人員屆期仍不繳還者且有可歸責於當事人責任時，由支給、服務或發放機關按年息百分之二，加計利息併同依第一項規定追繳之。\n前四項相關當事人未依限繳還溢領或誤領之相關退撫給與及優存利息，或未全數繳還溢領或誤領之相關退撫給與及優存利息者，其於支給、發放或服務機關依行政執行法相關規定強制執行追繳之前又重行退休、資遣，或申領遺屬一次金或遺屬年金時，其溢領或誤領之金額，得由支給機關自其再核發之退撫給與中，覈實抵銷或收回之。本法公布施行前之案件，亦同。","title":"第 一 節 退撫給與之發給"},{"no":"第71條","text":"支領或兼領月退休金之退休人員或支領月撫卹金、遺屬年金之遺族，於行蹤不明或發放機關無法聯繫時，應暫停發給退休金、撫卹金或遺屬年金，並通知受理優惠存款機構，一併暫停發放優存利息，俟其親自申請後，再依相關規定補發。","title":"第 一 節 退撫給與之發給"},{"no":"第72條","text":"支領或兼領月退休金之退休人員或支領月撫卹金、遺屬年金之遺族赴大陸地區長期居住，而未在大陸地區設有戶籍或領用大陸地區護照者，發放機關應於其居住大陸地區期間，暫停發給退休金、撫卹金或遺屬年金，俟其親自依規定申請改領一次退休金或回臺居住時，再依相關規定補發。","title":"第 一 節 退撫給與之發給"},{"no":"第73條","text":"公務人員或其遺族請領退撫給與及優存利息等權利，應於行政程序法所定公法上請求權時效內為之。\n公務人員離職後，轉任公、民營單位或私立學校服務，並依勞動基準法、勞工退休金條例、私立學校教職員退休法令或其單行規章辦理退休者，其依第九條規定申請發還本人撥繳之退撫基金費用本息，得至遲於年滿六十五歲之日起六個月內，向退撫基金管理機關申請發還，不適用前項時效規定。","title":"第 一 節 退撫給與之發給"},{"no":"第74條","text":"本法公布施行前已經審定之月撫慰金或亡故公務人員之遺族年撫卹金者，其給與標準仍照本法公布施行前原適用之規定辦理。","title":"第 一 節 退撫給與之發給"},{"no":"第75條","text":"公務人員或其遺族有下列情形之一者，喪失申請退撫給與之權利：\n一、褫奪公權終身。\n二、動員戡亂時期終止後，犯內亂罪、外患罪，經判刑確定。\n三、喪失或未具中華民國國籍。\n四、為支領遺屬一次金、遺屬年金或撫卹金，故意致該退休人員、現職公務人員或其他具領受權之遺族於死，經判刑確定。\n五、其他法律有特別規定。\n支領或兼領月退休金人員，或支領月撫卹金、遺屬年金之遺族有下列情形之一者，喪失繼續領受月退休金、月撫卹金或遺屬年金之權利：\n一、死亡。\n二、褫奪公權終身。\n三、動員戡亂時期終止後，犯內亂罪、外患罪，經判刑確定。\n四、喪失中華民國國籍。\n公務人員已依規定繳付退撫基金費用而有前二項喪失退撫給與領受權利者，仍得依第九條第二項規定申請發還本人繳付之退撫基金費用本息。但前項人員僅得發還該退休或在職死亡公務人員本人所繳付之退撫基金費用本息金額與已領之月退休金、月撫卹金或遺屬年金之差額；無差額者，不再發還。","title":"第 二 節 退撫給與之變更與保障"},{"no":"第76條","text":"退休人員經審定支領或兼領月退休金而有下列情形之一者，停止領受月退休金權利，至原因消滅時恢復之：\n一、卸任總統、副總統領有禮遇金期間。\n二、犯貪污治罪條例或刑法瀆職罪章之罪，經判刑確定而入監服刑期間。\n三、褫奪公權，尚未復權。\n四、因案被通緝期間。\n五、其他法律有特別規定。\n領受月撫卹金或遺屬年金之遺族有前項各款情形之一者，停止領受月撫卹金或遺屬年金之權利，至原因消滅時恢復。","title":"第 二 節 退撫給與之變更與保障"},{"no":"第77條","text":"退休人員經審定支領或兼領月退休金再任有給職務且有下列情形時，停止領受月退休金權利，至原因消滅時恢復之：\n一、再任由政府編列預算支給俸（薪）給、待遇或公費（以下簡稱薪酬）之機關（構）、學校或團體之職務且每月支領薪酬總額超過法定基本工資。\n二、再任下列職務且每月支領薪酬總額超過法定基本工資：\n（一）行政法人或公法人之職務。\n（二）由政府原始捐助（贈）或捐助（贈）經費，累計達財產總額百分之二十以上之財團法人之職務。\n（三）由政府及其所屬營業基金、非營業基金轉投資，且其轉投資金額累計占該事業資本額百分之二十以上事業之職務。\n（四）受政府直接或間接控制其人事、財務或業務之下列團體或機構之職務：\n1.財團法人及其所屬團體或機構。\n2.事業機構及其所屬團體或機構。\n公務人員月退休金發放或支給機關查知退休公務人員再於第一項所定機關（構）、學校、團體及法人參加保險時，得先暫停發給其月退休金，俟該退休公務人員檢具其再任每月支領薪酬總額未超過法定基本工資之相關證明申復後，再予恢復發給並補發其經停發之月退休金。\n退休人員經審定機關審定支領或兼領月退休金而再任第一項第二款所列機構董（理）事長及執行長者，其初任年齡不得逾六十五歲。\n前項人員任期屆滿前年滿七十歲者，應即更換。但有特殊考量而經主管院核准者，不在此限。","title":"第 二 節 退撫給與之變更與保障"},{"no":"第78條","text":"公務人員退休後再任下列職務每月所領薪酬，不適用前條所定不得超過法定基本工資之規定：\n一、受聘（僱）執行政府因應緊急或危難事故之救災或救難職務。\n二、受聘（僱）擔任山地、離島或其他偏遠地區之公立醫療機關（構），從事基層醫療照護職務。","title":"第 二 節 退撫給與之變更與保障"},{"no":"第79條","text":"公務人員在職期間涉犯貪污治罪條例、刑法瀆職罪章之罪或假借職務上之權力、機會或方法犯其他罪，先行退休、資遣或離職後始經判刑確定者，應依下列規定剝奪或減少退離（職）相關給與；其已支領者，照應剝奪或減少之全部或一部分追繳之：\n一、經判處死刑、無期徒刑或七年以上有期徒刑確定者，應自始剝奪其退離（職）相關給與。\n二、經判處有期徒刑三年以上，未滿七年者，應自始減少其應領退離（職）相關給與百分之五十。\n三、經判處有期徒刑二年以上，未滿三年者，應自始減少其應領退離（職）相關給與百分之三十。\n四、經判處有期徒刑一年以上，未滿二年者，應自始減少其應領退離（職）相關給與百分之二十。\n前項人員受緩刑宣告期滿而未經撤銷者，自緩刑宣告期滿後，不適用前項第三款及第四款規定；其已減少之退離（職）相關給與，應由各支給機關補發之。\n第一項所定應剝奪或減少之退離（職）相關給與，以最近一次退休、資遣或離職前，依其任職年資所核給者為限；其內涵包含以下各項給與：\n一、依本法支給之退休金、資遣給與。\n二、公教人員退休金其他現金給與補償金發給辦法之補償金。\n三、政府撥付之退撫基金費用本息。\n四、優存利息。\n五、遺族遺屬一次金或遺屬年金。\n第一項人員因同一案件，於其他法律有較重之剝奪或減少退離（職）相關給與處分者，從重處罰。\n退休公務人員依本法退休或資遣後，再任為公務人員者，其曾依第一項規定受剝奪或減少退離（職）相關給與之任職年資，於重行退休、資遣、離職或再任期間亡故時，不再核給退撫給與，且是項任職年資連同再任後之年資併計後，依第十五條規定辦理。","title":"第 二 節 退撫給與之變更與保障"},{"no":"第80條","text":"公務人員依本法退休或資遣後始受降級或減俸之懲戒處分者，應改按降級或減俸後之俸（薪）級或俸（薪）額計算退休或資遣給與；其執行日期依下列規定辦理：\n一、懲戒處分判決書於退休或資遣後送達受懲戒人主管機關者，自判決書送達該主管機關之翌日起執行。\n二、懲戒處分判決書於退休或資遣前送達受懲戒人主管機關，但尚未執行者，自懲戒處分判決執行之日起執行。","title":"第 二 節 退撫給與之變更與保障"},{"no":"第81條","text":"依本法申請退休或資遣人員，或請領撫卹金，或遺屬一次金或遺屬年金之遺族，對於審（核）定機關所為審（核）定結果不服者，得依公務人員保障法規定，提起救濟；其有顯然錯誤或有發生新事實、發現新證據等行政程序再開事由者，得依行政程序法相關規定辦理。","title":"第 二 節 退撫給與之變更與保障"},{"no":"第82條","text":"公務人員之離婚配偶與該公務人員婚姻關係存續期間滿二年者，於法定財產制或共同財產制關係因離婚而消滅時，得依下列規定，請求分配該公務人員依本法規定支領之退休金：\n一、以其與該公務人員法定財產制或共同財產制關係在該公務人員審定退休年資期間所占比率二分之一為分配比率，計算得請求分配之退休金。\n二、前款所定得請求分配之退休金數額，按其審定退休年資計算之應領一次退休金為準。\n三、所定法定財產制或共同財產制關係期間之計算以月計之，未滿一個月者，以一個月計。\n四、本項第一款所定二分之一分配顯失公平者，當事人一方得聲請法院調整或免除其分配額。\n前項所定離婚配偶於婚姻關係存續期間依其他法律得享有退休金者，其分配請求權之行使，以該公務人員得依該其他法律享有同等離婚配偶退休金分配請求權者為限。\n第一項請求權不得讓與或繼承。\n公務人員之離婚配偶自知悉有第一項請求權時起，二年間不行使而消滅；自法定財產制或共同財產制關係消滅時起，逾五年者，亦同。\n公務人員係命令退休或本法公布施行前退休者，其依本法支領之退休金，不適用本條規定。\n本法公布施行前已離婚者，不適用本條規定。","title":"第 三 節 退撫給與之分配"},{"no":"第83條","text":"公務人員之離婚配偶依前條規定請求分配公務人員退休金，其給付方式依當事人之協議。無法協議或協議不成者，得通知退休金審（核）定機關於審定該公務人員退休金時，按前條規定審定應分配之退休金總額並由支給機關一次發給。\n公務人員之退休金依前項規定被分配時，按被分配比率依下列規定扣減：\n一、支領一次退休金者，自其支領之一次退休金扣減。\n二、支領月退休金者，按月照被分配比率扣減，至應被分配之退休金總額扣減完畢後，不再扣減。\n三、兼領月退休金者，先自其兼領一次退休金扣減；不足扣減時，再自兼領之月退休金依前款規定按月扣減，至應被分配之退休金總額扣減完畢後，不再扣減。\n公務人員於本法公布施行後退休，於支領或兼領月退休金期間離婚者，其退休金依前條規定被分配時，依前二項規定辦理。\n本條所定退休金之扣減、通知退休金審（核）定機關請求分配之方式及其他相關事項，於本法施行細則定之。","title":"第 三 節 退撫給與之分配"},{"no":"第84條","text":"公務人員之離婚配偶有第七十五條第一項所定情形者，喪失第八十二條所定分配該公務人員退休金權利。","title":"第 三 節 退撫給與之分配"},{"no":"第85條","text":"公務人員任職滿五年，於本法公布施行後未辦理退休或資遣而離職者，除本法另有規定外，其任職年資得予保留，俟其年滿六十五歲之日起六個月內，以書面檢同相關證明文件，送原服務機關函轉審定機關依第三十條第一項及第二項規定審定其年資及退休金。\n前項人員支領之退休金，依第二十七條第二項及第二十九條規定計算。支領月退休金者，其每月退休所得應依第三十八條及第三十九條規定辦理。\n第一項人員於尚未支領本條所定退休金之前死亡者，得由其第四十三條所定遺族，依第九條規定申請發還其本人原繳付之退撫基金費用本息。\n第一項人員有下列情形之一者，不適用第一項及第二項規定：\n一、依法被撤職、免職或免除職務。\n二、第一項所定六個月辦理期限屆滿時，有第七十五條所定喪失辦理退休權利之法定事由。\n三、第一項所定六個月辦理期限屆滿時，有第二十四條第一項所定不得受理退休案之情事。\n四、所具公務人員年資業依第八十六條第二項規定辦理。","title":"第 五 章 年資制度轉銜"},{"no":"第86條","text":"公務人員依本法辦理屆齡或命令退休且任職年資未滿十五年者，得併計曾任適用其他職域職業退休金法令且未曾辦理退休（職、伍）、資遣或年資結算已領取退離給與之年資，成就請領月退休金條件。\n公務人員任職滿五年，於本法公布施行後未辦理退休或資遣而離職且未支領退撫給與者，於轉任其他職域工作後辦理退休（職）時，得併計原公務人員年資成就請領月退休金條件，並於年滿六十五歲之日起六個月內，以書面檢同相關證明文件，送原服務機關函轉審定機關審定其年資及月退休金。\n前項人員支領之月退休金，依第二十七條第二項及第二十九條規定計算。其每月退休所得應依第三十八條及第三十九條規定辦理。\n第二項人員有下列情形之一者，不適用第二項規定：\n一、依法被撤職、免職或免除職務。\n二、第二項所定六個月辦理期限屆滿時，有第七十五條所定喪失辦理退休權利之法定事由。\n三、第二項所定六個月辦理期限屆滿時，有第二十四條第一項所定不得受理退休案之情事。\n第二項人員於尚未支領本條所定退休金之前死亡者，得由其第四十三條所定遺族，依第九條規定申請發還其本人原繳付之退撫基金費用本息。\n前條及第二項人員於月退休金支領期間死亡者，其遺族不適用本法遺屬年金或遺屬一次金之規定。","title":"第 五 章 年資制度轉銜"},{"no":"第87條","text":"依前二條規定支領退休金者，亦適用第七十九條及第八十條規定。\n依前二條規定支領月退休金者，於支領月退休金期間，亦適用第七十一條、第七十二條及第七十六條至第七十八條規定。","title":"第 五 章 年資制度轉銜"},{"no":"第88條","text":"各機關申請自願退休、屆齡退休人員，應填造申請書表並檢齊有關證明文件，由服務機關於退休生效日前一日至前三個月間，送達審定機關審定。","title":"第 六 章 附則"},{"no":"第89條","text":"依本法辦理自願退休或屆齡退休之人員，其生效日期應於申請時審慎決定；逾審定生效日後，不得請求變更。\n公務人員或其遺族依本法請領退撫給與之種類、方式及退撫新制實施前、後年資取捨，應於申請時審慎決定；經審定機關審定生效後，不得請求變更。","title":"第 六 章 附則"},{"no":"第90條","text":"本法所定公務人員退休年齡之認定，依戶籍記載，自出生之日起，十足計算之。\n第四十三條與第六十二條所定遺族，及第四十五條所定配偶領取遺屬年金之年齡及婚姻存續關係，均依戶籍登載資料認定。","title":"第 六 章 附則"},{"no":"第91條","text":"第二十一條第二項因公傷病及第五十三條第二項因公死亡情事之認定標準、審查機制及重大交通違規行為之範圍，於本法施行細則定之。","title":"第 六 章 附則"},{"no":"第92條","text":"本法公布施行後，考試院應會同行政院建立年金制度監控機制，五年內檢討制度設計與財務永續發展，之後定期檢討。","title":"第 六 章 附則"},{"no":"第93條","text":"中華民國一百十二年七月一日以後初任公務人員者，其退撫制度由主管機關重行建立，並另以法律定之。\n前項退撫制度之建立，致退撫基金用罄年度提前之財務缺口，由政府依退撫基金財務精算結果，自前項退撫制度實施之日起，分年編列預算撥款補助之。\n政府依前項規定完成撥補後，應依退撫基金財務精算結果，接續分年編列預算撥補現行退撫基金，以健全基金財務。","title":"第 六 章 附則"},{"no":"第94條","text":"本法施行細則由考試院定之。","title":"第 六 章 附則"},{"no":"第95條","text":"本法除第七條第四項及第六十九條自公布日施行外，其餘條文自中華民國一百零七年七月一日施行。\n自中華民國一百零七年七月一日起，原公務人員退休法及原公務人員撫卹法不再適用。\n本法修正條文，除中華民國一百十年十二月二十八日修正之第七條自一百十年一月一日施行、第六十七條自一百十一年七月一日施行及第七十七條自一百零八年八月二十三日施行外，自公布日施行。\n本法中華民國一百十一年十二月十六日修正之第九十三條，自一百十二年七月一日施行。","title":"第 六 章 附則"}],"tags":["公務人員","退休","撫卹"],"note":"","attachments":[{"FileName":"附表一本法公布施行後退休公務人員退休金給與之計算基準彙整表.PDF","FileURL":"https://law.moj.gov.tw/LawClass/LawGetFile.ashx?FileId=0000202505"},{"FileName":"附表二自願退休人員年資與年齡合計法定指標數.PDF","FileURL":"https://law.moj.gov.tw/LawClass/LawGetFile.ashx?FileId=0000202506"},{"FileName":"附表三退休公務人員經審定退休年資之退休所得替代率對照彙整表.PDF","FileURL":"https://law.moj.gov.tw/LawClass/LawGetFile.ashx?FileId=0000409995"},{"FileName":"附表四公務人員任職未滿十年者加給一次撫卹金計算標準表.PDF","FileURL":"https://law.moj.gov.tw/LawClass/LawGetFile.ashx?FileId=0000202508"}]},{"id":"B07","name":"公教人員保險法","pcode":"S0070001","level":"法律","authority":"銓敘部","category":"考試＞銓敘部＞保險目","modified_date":"2024-01-03","history":[{"date":"1958-01-29","summary":"中華民國四十七年一月二十九日總統令制定公布全文 25 條"},{"date":"1974-01-29","summary":"中華民國六十三年一月二十九日總統令修正公布全文 25 條"},{"date":"1995-01-28","summary":"中華民國八十四年一月二十八日總統令增訂第 23-1 條；並修正第 8條條文"},{"date":"1999-05-29","summary":"中華民國八十八年五月二十九日總統（88）華總（一）義字第 8800124300 號令修正公布名稱及全文 26 條（原名稱：公務人員保險法；新名稱：公教人員保險法）"},{"date":"2000-01-26","summary":"中華民國八十九年一月二十六日總統（89）華總一義字第 8900022120號令修正公布第 13、14、26 條條文"},{"date":"2002-06-26","summary":"中華民國九十一年六月二十六日總統華總一義字第 09100128650 號令修正公布第 9 條條文"},{"date":"2005-01-19","summary":"中華民國九十四年一月十九日總統華總一義字第 09400004901 號令修正公布第 5、6、8、10、13、14、18、26 條條文；增訂第 13-1、15-1、16-1、24-1 條條文；依第 26 條規定：除另定施行日期者外，自公布日施行"},{"date":"2009-07-08","summary":"中華民國九十八年七月八日總統華總一義字第 09800167931 號令修正公布第 3、4、10、18、26 條條文；增訂第 17-1 條條文；依第 26 條規定：施行日期由考試院會同行政院定之中華民國九十八年八月五日考試院考臺組貳二字第 09800061981 號令、行政院院授人給字第 09800233862 號令會同發布定自九十八年八月一日施行"},{"date":"2014-01-29","summary":"中華民國一百零三年一月二十九日總統華總一義字第 10300014271 號令修正公布全文 51 條；依第 51 條規定：施行日期，由考試院會同行政院定之中華民國一百零三年五月二十九日考試院考臺組貳一字第 10300045042號令、行政院院授人給揆字第 1030034945 號令會同發布定自一百零三年六月一日施行"},{"date":"2015-06-10","summary":"中華民國一百零四年六月十日總統華總一義字第 10400067451 號令修正公布第 36 條條文；施行日期，由考試院會同行政院定之中華民國一百零四年十月七日考試院考臺組貳二字第 10400071083號令、行政院院授人給揆字第 10400476603 號令會同發布定自一百零四年六月十二日施行"},{"date":"2015-06-17","summary":"中華民國一百零四年六月十七日總統華總一義字第 10400070771 號令修正公布第 48 條條文；施行日期，由考試院會同行政院定之中華民國一百零四年十月七日考試院考臺組貳二字第 10400071083號令、行政院院授人給揆字第 10400476603 號令會同發布定自一百零四年六月十九日施行"},{"date":"2015-12-02","summary":"中華民國一百零四年十二月二日總統華總一義字第 10400140901 號令修正公布第 3、12～15、18、33、51 條條文及第二節節名；並自公布日施行"},{"date":"2022-01-19","summary":"中華民國一百十一年一月十九日總統華總一義字第 11100002551 號令修正公布第 35、51 條條文；依第 51 條規定：第 35 條施行日期由考試院會同行政院定之中華民國一百十一年二月二十五日考試院考臺組貳二字第 11100013091 號令、行政院院授人給字第 11100004113 號令會同發布自一百十一年二月十日施行"},{"date":"2023-01-11","summary":"中華民國一百十二年一月十一日總統華總一義字第 11200001551 號令修正公布第 8、16、21、27、51 條條文；增訂第 6-1 條條文；依第 51 條規定：自一百十二年七月一日施行"},{"date":"2023-12-15","summary":"中華民國一百十二年十二月十五日總統華總一義字第 11200109961號令修正公布第 10 條條文"},{"date":"2024-01-03","summary":"中華民國一百十三年一月三日總統華總一義字第 11200115311 號令修正公布第 36 條條文"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=S0070001","articles":[{"no":"第1條","text":"為安定公教人員生活，辦理公教人員保險（以下簡稱本保險），特制定本法。本法未規定者，適用其他有關法律。","title":"第 一 章 總則"},{"no":"第2條","text":"本保險之保險對象，包括下列人員：\n一、法定機關（構）編制內之有給專任人員。但依其他法律規定不適用本法或不具公務員身分者，不得參加本保險。\n二、公立學校編制內之有給專任教職員。\n三、依私立學校法規定，辦妥財團法人登記，並經主管教育行政機關核准立案之私立學校編制內之有給專任教職員。\n四、其他經本保險主管機關認定之人員。\n前項第一款人員不包括法定機關編制內聘用人員。但本法中華民國一百零三年一月十四日修正施行時仍在保者，不在此限。","title":"第 一 章 總則"},{"no":"第3條","text":"本保險之保險範圍，包括失能、養老、死亡、眷屬喪葬、生育及育嬰留職停薪六項。","title":"第 一 章 總則"},{"no":"第4條","text":"本保險之主管機關為銓敘部。\n為監督本保險業務，由本保險主管機關邀請有關機關、專家學者及被保險人代表組織監理委員會；各以占三分之一為原則；其組織規程由考試院會同行政院定之。","title":"第 一 章 總則"},{"no":"第5條","text":"本保險由考試院會同行政院指定之機關（構）（以下稱承保機關）辦理承保、現金給付、財務收支及本保險準備金管理運用等保險業務。\n本保險之財務責任，屬於中華民國八十八年五月三十日以前之保險年資應計給之養老給付金額，由財政部審核撥補；屬於中華民國八十八年五月三十一日以後之虧損，應調整費率挹注。\n本保險財務收支結餘，全部提列為保險準備金；其運用事宜，經本保險監理委員會及本保險主管機關同意後，得委託經營。\n本保險準備金之管理及運用辦法，由本保險主管機關定之。\n承保機關辦理本保險所需事務費，由本保險主管機關編列預算撥付；其金額不得超過年度保險費總額百分之三點五。\n本保險準備金應按期上網公布有關保險準備金運用規模與資產配置、收益率、投資股票類別比率、持股成本及買賣資訊。","title":"第 一 章 總則"},{"no":"第6條","text":"符合第二條規定之保險對象，應一律參加本保險（以下簡稱加保）為被保險人；其保險期間應自承保之日起，至退出本保險（以下簡稱退保）前一日止。\n被保險人應在其支領全額俸（薪）給之機關加保，不得重行加保。\n本保險之同一保險事故，不得重複請領給付。\n被保險人不得另行參加勞工保險、軍人保險、農民健康保險（以下簡稱其他職域社會保險）或國民年金保險。但本法另有規定者，不在此限。\n被保險人重複參加其他職域社會保險或國民年金保險（以下簡稱重複加保）期間，發生第三條所列保險事故（以下簡稱保險事故），除本法另有規定外，不予給付；該段年資亦不予採認；其所繳之本保險保險費，概不退還。但非可歸責於服務機關（構）學校或被保險人之事由所致者，得退還其所繳之保險費。\n被保險人具有下列各款年資之一者，不適用前項規定：\n一、於中華民國九十四年一月二十日以前之重複加保年資。\n二、因其他職域社會保險之保險效力起算規定與本保險不同所致且不超過六十日之重複加保年資。\n第五項人員之重複加保年資得併計成就請領本保險養老給付之條件。但不予給付。\n被保險人於本法中華民國一百零三年一月十四日修正施行後，依規定得另受僱於固定雇主，擔任具有固定工作及薪給且屬其他職域社會保險應加保對象之職務者（以下簡稱依規定得重複加保者），自參加其他職域社會保險之日起六十日內，得選擇溯自參加其他職域社會保險之日起退保；一經選定後，不得變更。逾期未選擇者或選擇不退保者，其重複加保期間如發生保險事故，除本法另有規定外，不予給付；該段年資亦不予採認。\n前項人員之重複加保年資得併計成就請領本保險養老給付之條件，並依第十二條第二項規定計給養老給付。\n不符合本保險加保資格而加保者，取消其被保險人資格；其所繳保險費，比照第五項規定辦理；期間領有之保險給付，得自退還之自付部分保險費中扣抵；不足部分，應向被保險人追償。","title":"第 一 章 總則"},{"no":"第6-1條","text":"被保險人受免職、解職（聘）、不續聘、撤職或免除職務處分後，因撤銷、廢止或其他事由而溯及既往失效者，得於復職（聘）並補薪時，追溯加保。\n前項人員於免職、解職（聘）、不續聘、撤職或免除職務期間已參加其他職域社會保險，且屬其他職域社會保險強制加保對象者，得選擇不追溯加保；一經選定後，不得變更。選擇追溯加保者之重複加保年資，除得併計成就請領本保險養老給付之條件，並依第十二條第二項規定計給養老給付外，不予給付。","title":"第 一 章 總則"},{"no":"第7條","text":"被保險人之受益人，除死亡給付或遺屬年金給付外，均為被保險人本人。\n被保險人或其受益人為無行為能力者，由其法定代理人代為申請。\n被保險人或其受益人生前未申請給付者，除本法另有規定外，他人不得代為請領。","title":"第 一 章 總則"},{"no":"第8條","text":"本保險之保險費率為被保險人每月保險俸（薪）額百分之七至百分之十八。\n前項費率應由承保機關委託精算機構，至少每三年辦理一次精算，每次精算五十年；精算時，第五條第二項所定中華民國八十八年五月三十日以前之保險年資應計給之養老給付金額，不計入本保險之保險費率。\n本保險主管機關應評估保險實際收支情形及精算結果，有下列情形之一而需調整費率時，應報請考試院會同行政院覈實釐定：\n一、精算之保險費率與當年保險費率相差幅度超過正負百分之五。\n二、本保險增減給付項目、給付內容或給付標準，致影響保險財務。\n第一項所稱每月保險俸（薪）額，係以公務人員及公立學校教職員俸（薪）給法規所定本俸（薪）或年功俸（薪）額為準。私立學校教職員比照公立同級同類學校同薪級教職員保險薪額為準釐定。但機關（構）學校所適用之待遇規定與公務人員或公立學校教職員俸（薪）給法規規定不同者，其所屬被保險人之保險俸（薪）額，由本保險主管機關比照公務人員或公立學校教職員之標準核定之。\n本法中華民國一百零三年一月十四日修正施行後，被保險人每月保險俸（薪）額，以不超過部長級之月俸額為限。\n第一項所定費率範圍，包含適用中華民國一百十二年七月一日施行之公務人員個人專戶制退休資遣撫卹法及公立學校教職員個人專戶制退休資遣撫卹條例且未請領第十六條第四項第三款所定月退休（職、伍）給與，亦未辦理優惠存款者，依第四十八條第七項規定年金所需費率。\n前項人員所領養老年金之財務責任由本保險準備金支應，不適用第二十條規定。\n第六項人員於取得任用資格前受訓或研習期間，依第二條第一項第四款規定加保時，保險費率比照第六項規定辦理。\n前項人員受訓或研習期間跨越本法中華民國一百十一年十二月十六日修正之條文施行前後者，於修正施行前已加保年資，應依修正施行後規定所釐定費率，補繳保險費。","title":"第 二 章 保險費"},{"no":"第9條","text":"本保險之保險費，由被保險人自付百分之三十五，政府補助百分之六十五。但私立學校教職員由政府及學校各補助百分之三十二點五；政府補助私立學校教職員之保險費，由各級主管教育行政機關分別編列預算核撥之。\n前項保險費應按月繳付；當月之保險費由各該服務機關（構）學校於當月十五日前，彙繳承保機關；逾期未繳者，承保機關得俟其繳清後，始予辦理各項給付。其因而致被保險人或受益人蒙受損失時，由服務機關（構）學校負責。\n被保險人應自付之保險費，各該服務機關（構）學校得於每月發薪時代扣。\n被保險人依法退休（職）並請領本保險養老給付且於本法中華民國一百零三年一月十四日修正施行後再加保者，其保險費應由被保險人自付百分之六十七點五，其餘百分之三十二點五應由服務機關（構）學校補助。","title":"第 二 章 保險費"},{"no":"第10條","text":"被保險人依法徵服兵役而保留原職時，其服役期間之自付部分保險費，由政府負擔。但私立學校教職員應由學校負擔。\n前項規定以外之留職停薪被保險人在申請留職停薪時，應選擇於留職停薪期間退保或自付全部保險費，繼續加保；一經選定後，不得變更。\n前項人員於留職停薪期間選擇繼續加保又同時參加其他職域社會保險者，應自重複加保之日起六十日內，申請溯自參加其他職域社會保險之日起退保，並得退還其所繳之保險費；退出後不得再選擇加保。未申請退保或逾限申請者，其重複加保期間發生保險事故，不予給付；該段年資除本法另有規定外，亦不予採認；其所繳之保險費，不予退還。\n前項未申請退保或逾限申請者之重複加保年資，得併計成就請領本保險養老給付之條件。但不予給付。\n依第二項規定，於留職停薪期間選擇繼續加保之被保險人，逾六十日未繳納其應自付保險費，或未繳納依法遞延繳納之自付部分保險費者，溯自未繳納保險費之日起，視為退保。其於欠繳保險費期間發生保險事故所領取之保險給付，應依法追還。\n依本條規定選擇繼續加保者，其保險俸（薪）額，依同等級公教人員保險俸（薪）額調整。\n本法所定繳納保險費之規定，於身心障礙者權益保障法或性別平等工作法另有規定者，從其規定。","title":"第 二 章 保險費"},{"no":"第11條","text":"被保險人發生依法停職（聘）、休職或失蹤之事故時，除失蹤者應予退保外，其餘人員得比照前條留職停薪人員，由其選擇於停職（聘）、休職期間退保，或自付全部保險費，繼續加保；一經選定後，不得變更。\n前項選擇退保者，應自復職之日辦理加保手續並接算其保險年資。\n第一項選擇繼續加保而於繼續加保期間離職或達屆齡退休條件者，應予退保。\n依法停職（聘）並選擇於停職（聘）期間自付全部保險費繼續加保，且經復職（聘）並補薪者，其服務機關（構）學校、政府應按第九條第一項所定負擔繳交保險費比率，計算停職（聘）期間應負擔之保險費並由要保機關發還被保險人。\n被保險人於本法中華民國一百零三年一月十四日修正施行前停職（聘）或休職者，依修正施行前之規定辦理。是類被保險人於停職（聘）期間已參加其他職域社會保險者，該段參加各該保險之年資，不得於復職（聘）補薪時，追溯加保。","title":"第 二 章 保險費"},{"no":"第12條","text":"被保險人在保險有效期間，發生失能、養老、死亡、眷屬喪葬、生育或育嬰留職停薪之保險事故時，應予現金給付；其給付金額之計算標準，依下列規定：\n一、養老給付及死亡給付：按被保險人發生保險事故當月起，前十年投保年資之實際保險俸（薪）額平均計算（以下簡稱平均保俸額）。但加保未滿十年者，按其實際投保年資之保險俸（薪）額平均計算。\n二、育嬰留職停薪津貼：按被保險人育嬰留職停薪當月起，往前推算六個月保險俸（薪）額之平均數百分之六十計算。\n三、失能給付、生育給付及眷屬喪葬津貼：按被保險人發生保險事故當月起，往前推算六個月保險俸（薪）額之平均數計算。但加保未滿六個月者，按其實際加保月數之平均保險俸（薪）額計算。\n第六條第八項所定依規定得重複加保者，其重複加保年資應計給養老給付金額之計算標準，按平均保俸額，扣除已領受其他職域社會保險與本保險養老給付性質相近給付（以下簡稱其他性質相近給付）所據之投保金額計算。\n按前項標準計算之本保險養老給付，自領受其他性質相近給付之日起發給。但於本保險養老給付核定之前領受其他性質相近給付者，應自養老給付核定之日起發給。\n依第二項規定計給養老給付之人員，於領受其他性質相近給付前死亡者，其重複加保期間不再計給。","title":"第 一 節 通則"},{"no":"第13條","text":"被保險人發生傷害事故或罹患疾病，經醫治終止後，身體仍遺留無法改善之障礙而符合失能標準，並經中央衛生主管機關評鑑合格之醫院鑑定為永久失能者，按其確定永久失能日當月往前推算六個月保險俸（薪）額之平均數，依下列規定核給失能給付：\n一、因執行公務或服兵役致成全失能者，給付三十六個月；半失能者，給付十八個月；部分失能者，給付八個月。\n二、因疾病或意外傷害致成全失能者，給付三十個月；半失能者，給付十五個月；部分失能者，給付六個月。\n前項所稱全失能、半失能、部分失能之標準，由本保險主管機關定之。\n第一項所稱經醫治終止，指被保險人罹患之傷病經醫治後，症狀固定，再行醫治仍無法改善，並符合前項失能標準。\n承保機關對請領失能給付之案件，得施以調查、複驗、鑑定後，審核認定之。","title":"第 二 節 失能給付"},{"no":"第14條","text":"失能給付應依下列規定審核辦理：\n一、在加入本保險前已失能者，不得請領本保險失能給付。\n二、同一部位之失能，同時適用二種以上失能程度者，依最高標準給付，不得合併或分別請領。\n三、不同部位之失能，無論同時或先後發生者，其合計給付月數，以三十個月為限；因公致失能者，以三十六個月為限。\n四、原已失能部位復因再次發生疾病或傷害，致加重其失能程度者，按二種標準之差額給付。\n五、手術切除器官者，須存活期滿一個月以上，始可請領失能給付。被保險人確定永久失能日係於死亡前一個月內，或彌留狀態期間，不得據以請領失能給付。","title":"第 二 節 失能給付"},{"no":"第15條","text":"第十三條所定確定永久失能日之認定，依下列規定辦理：\n一、手術切除器官，存活一個月以上者，以該手術日期為準。\n二、醫療或手術後，仍需施行復健治療者，須以復健治療期滿六個月仍無法改善時為準；其他需經治療觀察始能確定永久失能者，經主治醫師敘明理由，以治療觀察期滿六個月仍無法改善時為準。\n三、失能標準已明定治療最低期限者，以期限屆滿仍無法改善時為準。\n四、失能標準明定治療最低期限屆滿前即辦理退休、資遣或離職退保，且於治療達規定期限以上仍無法矯治者，以退保前一日為準。","title":"第 二 節 失能給付"},{"no":"第16條","text":"被保險人依法退休（職）、資遣，或繳付本保險保險費滿十五年且年滿五十五歲以上而離職退保時，給與養老給付。\n養老給付之請領方式及給與標準如下：\n一、一次養老給付：保險年資每滿一年，給付一點二個月；最高以給付四十二個月為限。但辦理優惠存款者，最高以三十六個月為限。\n二、養老年金給付：保險年資每滿一年，在給付率百分之零點七五（以下簡稱基本年金率）至百分之一點三（以下簡稱上限年金率）之間核給養老年金給付，最高採計三十五年；其總給付率最高為百分之四十五點五。但中華民國一百十二年七月一日以後初次參加本保險者，最高採計四十年；其總給付率最高為百分之五十二。\n三、依前二款規定計算給付月數或給付率之年資有畸零月數及未滿一個月之畸零日數，均按比例發給。\n依第一項規定請領養老給付之被保險人符合下列條件之一者，給與養老年金給付：\n一、繳付本保險保險費滿十五年以上且年滿六十五歲。\n二、繳付本保險保險費滿二十年以上且年滿六十歲。\n三、繳付本保險保險費滿三十年以上且年滿五十五歲。\n被保險人請領養老年金給付而有下列情形之一者，其養老年金給付應依基本年金率計給：\n一、依法資遣。\n二、繳付本保險保險費滿十五年以上而離職退保。\n三、支（兼）領之月退休（職、伍）給與係由下列權責單位負最後財務責任：\n（一）政府機關（構）或學校。\n（二）政府機關（構）或學校與被保險人共同提儲設立之基金。但所設基金屬個人帳戶者，不在此限。\n被保險人已依第三項規定請領養老年金給付者，再支（兼）領前項第三款所定月退休（職、伍）給與時，其原經承保機關審定之養老年金給付，應自再支（兼）領月退休（職、伍）給與之日起，改依前項及第八項規定計給。\n依第一項規定請領養老給付之被保險人有下列情形之一者，以支領一次養老給付為限：\n一、未符合第三項養老年金給付條件。\n二、犯貪污治罪條例之罪，或犯刑法瀆職罪，或於動員戡亂時期終止後，犯內亂罪、外患罪，經判刑確定。\n三、依第四十五條規定準用本法之外國人。\n依第一項規定請領養老給付之被保險人具有中華民國一百零三年一月十四日修正施行前之保險年資且符合第三項各款條件之一者，可選擇依本條規定請領養老年金給付，亦得選擇請領一次養老給付；一經領受，不得變更。\n依第四項規定按基本年金率計給養老年金給付之被保險人，其每月退休（職、伍）給與，加計每月可領養老年金給付之總和，不得超過其最後在職加保投保俸（薪）額二倍之百分之八十；超過者，應調降養老年金給付，或得選擇不請領養老年金給付而請領一次養老給付；一經領受，不得變更。\n前項所定每月退休（職、伍）給與之內涵，比照第十七條第四項及第五項規定辦理。\n被保險人具有本法中華民國一百零三年一月十四日修正施行前後保險年資且選擇請領一次養老給付者，修正施行前之保險年資最高以給付三十六個月為限；修正施行後之保險年資，每滿一年，應加給一點二個月，合併修正施行前保險年資最高以給付四十二個月為限；畸零月數及未滿一個月之畸零日數，均按比例發給。\n本法中華民國一百零三年一月十四日修正施行前已退保而未再加保，並依第八項規定選擇請領一次養老給付之被保險人，其加保超過三十年之保險年資，每滿一年，加給一點二個月，合併最高以給付四十二個月為限；畸零月數及未滿一個月之畸零日數，均按比例發給。但被保險人所領一次養老給付依規定得辦理優惠存款者，不適用上述加給規定。\n前項加給之養老給付金額，應由承保機關依本法審定後，通知最後服務機關（構）學校負擔財務責任並支給被保險人。\n第八項之給付率自公務人員及公立學校教職員退撫法律制定通過後，另行調整。","title":"第 三 節 養老給付"},{"no":"第17條","text":"被保險人依前條第三項規定請領養老年金給付者，其每月退休（職、伍）給與，加計每月可領養老年金給付之總和，不得超過其最後在職加保投保俸（薪）額二倍之一定百分比（以下簡稱退休年金給與上限）。\n被保險人依前項規定計得之每月養老年金給付率，於前條第四項有特別規定者，從其規定。\n第一項所定退休年金給與上限，應依下列規定計算：\n一、保險年資十五年以下，每滿一年，以百分之二計；第十六年起，每滿一年，以百分之二點五計，最高增至百分之八十。\n二、保險年資未滿六個月者，以六個月計；滿六個月以上未滿一年者，以一年計。\n第一項所定每月退休（職、伍）給與，包含下列內涵：\n一、被保險人支（兼）領之月退休（職、伍）給與或類此之非一次性離退給與。\n二、被保險人支（兼）領之一次性退休（職、伍）給與、資遣給與、年資結算金或類此之一次性離退給與，應依平均餘命，按月攤提併入每月退休給與計算。\n三、被保險人依規定領有其支（兼）領一次退休（職、伍）給與之每月優惠存款利息。\n前項第二款所定一次性離退給與之按月攤提計算方式，於本法施行細則定之。\n第一項及第三項之退休年金給與上限自公務人員及公立學校教職員退撫法律制定通過後，另行調整。","title":"第 三 節 養老給付"},{"no":"第18條","text":"被保險人擔任具有危險及勞力等特殊性質職務而屆齡退休者，其繳付本保險保險費滿十五年以上，可請領養老年金給付，不受第十六條第三項各款年齡之限制。\n被保險人因公傷病致不堪勝任職務而命令退休者，或符合第十三條所定失能標準之全失能，且經評估為終身無工作能力而退休（職）或資遣者，其請領養老年金給付，不受第十六條第三項各款加保年資及年齡之限制；其加保年資未滿十五年者，以十五年計。\n被保險人未符合第十六條第三項所定養老年金給付請領年齡者，得選擇至年滿養老年金給付起支年齡之日起領取（以下簡稱展期養老年金給付）；一經領受，不得變更。\n法定機關（構）編制內之有給專任人員經本保險主管機關同意得參加勞工保險，嗣因原機關（構）依法律整併或改制（隸）者，除其他法律另有規定外，應改參加本保險；其加保年資未達第十六條第三項所定請領養老年金給付之加保年資條件，應併計於原機關（構）參加勞工保險之保險年資，以符合養老年金給付請領條件；該參加勞工保險之保險年資不計給本保險養老年金給付。\n具有任期之公職被保險人於任期屆滿，依法退職時，其加保年資未達第十六條第三項所定請領養老年金給付之加保年資條件者，得併計退職前曾參加國民年金保險或得領取其他性質相近給付之保險年資，以成就請領本保險養老年金給付之條件。但併計本保險以外之其他保險年資，不計給本保險養老年金給付。\n被保險人保險年資滿十五年，未符合第十六條養老年金給付請領資格者，得提前五年請領養老年金給付，每提前一年，依第十六條規定計算之給付金額減給百分之四，最多減給百分之二十。","title":"第 三 節 養老給付"},{"no":"第19條","text":"依第十七條規定計得之每月可領養老年金給付，其保險年資每滿一年之給付率低於基本年金率時，仍應按基本年金率計給；超過上限年金率時，應按上限年金率計給。","title":"第 三 節 養老給付"},{"no":"第20條","text":"依第十七條規定計得之每月可領養老年金給付中，屬於超過基本年金率計得之金額（以下簡稱超額年金），應由承保機關依本法審定後，通知負擔財務責任之最後服務機關（構）學校按月支給被保險人。但私立學校之被保險人所領超額年金，由政府及學校各負擔百分之五十。\n前項應負擔支給責任之最後服務機關（構）學校有改制（隸）、裁併、解散、消滅或民營化等情形，應依其情形，改由承受其業務之機關（構）學校或上級機關或法人主管機關或事業主管機關按月支給。\n第一項所定應負支給及財務責任者有未支給或逾期支給情形，致被保險人蒙受損失時，應由各該負支給及財務責任之最後服務機關（構）學校或政府負責；如有爭議，應由其主管機關或上級機關協調處理之。\n依第二十二條第四項、第七項，或第二十五條第二項規定，按原領養老年金給付金額之半數給與遺屬年金給付者，其原領養老年金給付包含超額年金時，比照本條規定辦理。","title":"第 三 節 養老給付"},{"no":"第21條","text":"被保險人於本法中華民國八十八年五月三十一日修正生效前後之保險年資，應合併計算發給養老給付，並受第十六條所定養老年金給付最高採計年資或一次養老給付最高給付月數上限（以下簡稱養老給付上限）之限制。\n前項屬於本法修正生效前保險年資之一次養老給付，仍依原公務人員保險法或原私立學校教職員保險條例規定標準計算；其未滿五年者，每滿一年給付一個月，未滿一年之畸零月數，按比例發給；屬於修正生效後之保險年資，依第十六條第二項第一款及第三款規定計算。\n被保險人於本法中華民國八十八年五月三十一日修正生效前後保險年資，合計十二年六個月以上者，其一次養老給付之平均養老給付月數未達一年一點二個月時，以一年一點二個月計算；其保險年資合計未滿十二年六個月者，其一次養老給付月數未達原公務人員保險法或原私立學校教職員保險條例規定標準時，補其差額月數。","title":"第 三 節 養老給付"},{"no":"第22條","text":"養老年金給付除本法另有規定外，應自符合請領條件之日起，按月發給，至被保險人死亡當月止。\n領受養老年金給付者有下列情形之一，應即停止領受之權利，俟原因消滅後恢復：\n一、再加保。\n二、卸任總統、副總統享有禮遇期間。\n領受養老年金給付者有下列情形之一，喪失領受之權利：\n一、死亡。\n二、依第十八條第二項後段所定未滿十五年而以十五年計給規定請領養老年金給付者，再參加其他職域社會保險或本保險。是類人員有再任職之事實而未依其身分參加社會保險者亦同。\n三、喪失中華民國國籍。\n四、犯貪污治罪條例之罪，或犯刑法瀆職罪，或於動員戡亂時期終止後，犯內亂罪、外患罪，經判刑確定。\n前項第一款人員之養老年金給付，其遺屬得就以下方式之一請領；一經領受，不得變更：\n一、請領一次養老給付者，應扣除已領受養老年金給付總額後，給與其餘額（以下簡稱一次養老給付之餘額）。\n二、請領遺屬年金給付者，按原領養老年金給付金額之半數，改領遺屬年金給付。\n依第三項第二款規定喪失領受養老年金給付權利者，改給與依其實際加保年資應給與一次養老給付之餘額；已無餘額者，不再計給。\n依第三項第三款及第四款規定喪失領受養老年金給付權利者，改給與一次養老給付之餘額；已無餘額者，不再計給。\n依第十八條第三項規定請領展期養老年金給付之被保險人，於領受給與之前死亡者，由其遺屬請領一次養老給付金額；其符合請領遺屬年金給付條件之遺屬不請領一次養老給付金額時，得選擇按原得領養老年金給付金額之半數，改領遺屬年金給付；一經領受，不得變更。","title":"第 三 節 養老給付"},{"no":"第23條","text":"被保險人請領養老給付後再加保時，原領養老給付不得繳回；其原有保險年資不得合併計算。其再次符合請領本保險養老給付條件者，合併各次計給養老給付，不得超過養老給付上限。\n被保險人領受養老給付已達養老給付上限後再加保者，日後退休（職）、資遣或離職退保時，不再發給養老給付。但再加保期間未領取本保險其他給付者，其自付部分之保險費應加計利息發還。\n被保險人符合請領本保險養老給付條件者，應自符合條件之日起三個月內選擇請領或不請領；逾期未作選擇者，視同選擇不請領。\n前項人員選擇不請領者，仍得於第三十八條所定時效內請領。但屬於再加保者，於再次退保前，不得請領原有保險年資之養老給付。\n前項人員於再次退保時，併計原有保險年資及再加保年資後，符合請領本保險養老給付條件者，按其再次退保時之平均保俸額給付；未符合請領本保險養老給付條件者，得請領原未請領之養老給付；得請領養老年金給付者，自再次退保之日起發給。\n被保險人依第三項及第四項規定選擇不請領且於第三十八條所定期限內死亡者，原未請領之養老給付得由其遺屬比照第二十二條第七項規定，請領一次養老給付或改領遺屬年金給付。","title":"第 三 節 養老給付"},{"no":"第24條","text":"本法中華民國八十八年五月三十一日修正生效前，原參加公務人員保險及私立學校教職員保險之年資，得合併計算；其養老給付不得超過養老給付上限。\n被保險人在本法中華民國八十八年五月三十一日修正生效前，已依公務人員保險法規定請領養老給付並再參加私立學校教職員保險者，或已依私立學校教職員保險條例規定請領養老給付並再參加公務人員保險者，其重行參加各該保險之年資，依本法規定請領養老給付。","title":"第 三 節 養老給付"},{"no":"第25條","text":"被保險人因停職（聘）、休職或留職停薪而選擇退保者，於復職（聘）同日辦理退休或資遣，應以停職（聘）、休職或留職停薪退保當時之保險年資及平均保俸額，依復職（聘）當時之規定，請領養老給付。\n被保險人因停職（聘）或休職而選擇繼續加保並於繼續加保期間達屆齡退休條件應予退保者，該被保險人或其遺屬應於原因消滅後，依下列規定請領給付：\n一、被保險人依法補辦退休者，應以達屆齡退休條件而退保當時之保險年資及依原因消滅當時之規定，請領養老給付。\n二、被保險人於依法辦理退休期限屆滿前死亡，或於原因消滅前死亡，應由其遺屬以被保險人達屆齡退休條件而退保當時之保險年資及依原因消滅或死亡當時之規定，請領一次養老給付金額。\n三、前款被保險人於本法中華民國一百零三年一月十四日修正施行後死亡時，已符合第十六條第一項及第三項所定養老年金給付請領條件者，其符合請領遺屬年金給付條件之遺屬得請領一次養老給付金額，或選擇按原領養老年金給付金額之半數，改領遺屬年金給付；一經領受，不得變更。","title":"第 三 節 養老給付"},{"no":"第26條","text":"被保險人於本法中華民國九十四年一月二十一日修正生效後退保而未請領本保險養老給付者，除第四十九條另有規定外，其保險年資予以保留，俟其符合下列條件之一時，得由原服務機關（構）學校，以其退保當時之保險年資，依退保當時之規定，請領本保險養老給付：\n一、於參加勞工保險或軍人保險期間依法退休（職、伍）。\n二、領受國民年金保險老年給付。\n三、年滿六十五歲。\n前項人員所具本保險保留年資已領取補償金者，不適用前項規定。\n第一項人員於本法中華民國一百零三年一月十四日修正施行後退保而請領本保險養老給付時，符合第十六條第三項規定者，得請領養老年金給付，並自申請之日起發給。","title":"第 三 節 養老給付"},{"no":"第27條","text":"被保險人死亡時，依下列規定給與一次死亡給付：\n一、因公死亡者，繳付保險費未滿二十年者，給與三十六個月；繳付保險費滿二十年以上者，給與四十八個月。\n二、病故或意外死亡者，繳付保險費未滿二十年者，給與三十個月；繳付保險費滿二十年，未滿三十年者，給與三十六個月；繳付保險費滿三十年，未滿三十五年者，給與四十二個月；繳付保險費滿三十五年以上者，給與四十八個月。\n被保險人死亡時，其符合請領遺屬年金給付條件之遺屬不請領前項一次死亡給付，得選擇請領遺屬年金給付，並依平均保俸額，以保險年資滿一年，按百分之零點七五給付率計算，最高以給付百分之三十為限。畸零月數及未滿一個月之畸零日數，按比率發給。\n被保險人加保年資未滿十五年而因公死亡者，其遺屬請領遺屬年金給付時，得以十五年計給。\n被保險人曾領取本保險或公務人員保險或私立學校教職員保險之養老給付者，其遺屬依前三項規定請領一次死亡給付或遺屬年金時，應扣除已領養老年金給付之年資或給付月數後，發給之；其合併前後給付，不得超過死亡給付上限。\n本保險失蹤退保之被保險人，其遺屬得於其死亡或受死亡宣告之日起，按退保當時之保險年資，依死亡或受死亡宣告當時之規定，請領一次死亡給付或遺屬年金給付。\n請領本保險展期養老年金給付之被保險人於再加保期間死亡者，其遺屬不請領遺屬年金給付或不合請領遺屬年金給付條件時，應就本條所定一次死亡給付或一次養老給付金額，擇一請領；一經領受，不得變更。\n依第二十二條第二項規定停止領受養老年金給付者，於再加保期間死亡，其遺屬不請領遺屬年金給付或不合請領遺屬年金給付條件時，應就一次死亡給付或一次養老給付之餘額，擇一請領；一經領受，不得變更。\n第一項所定繳付保險費年資，包含已領養老給付之保險年資。","title":"第 四 節 死亡給付"},{"no":"第28條","text":"前條一次死亡給付，應由亡故被保險人之配偶領受二分之一；其餘依序由下列受益人平均領受之：\n一、子女。\n二、父母。\n三、祖父母。\n四、兄弟姐妹。\n具中華民國國籍之遺屬為配偶、子女、父母或第五項但書所定領受者，得依第二十二條、第二十五條或前條規定，選擇請領遺屬年金給付，並應由未再婚配偶領受二分之一；其領受順序依前項規定。\n前項遺屬請領遺屬年金給付時，須符合下列條件：\n一、配偶須未再婚且符合下列條件之一：\n（一）年滿五十五歲且婚姻關係於被保險人死亡時已存續二年以上。未滿五十五歲者，得自年滿五十五歲之日起支領。\n（二）因身心障礙而無謀生能力且婚姻關係於被保險人死亡時已存續二年以上。\n二、子女或第五項但書所定領受者，須符合下列條件之一：\n（一）未成年。\n（二）因身心障礙且無謀生能力之成年人。\n三、父母須年滿五十五歲且每月工作收入未超過公務人員俸給法規所定二百八十俸點折算之俸額。未滿五十五歲者，得自年滿五十五歲之日起支領。\n前項所稱無謀生能力之範圍，於本法施行細則定之。\n亡故被保險人無第一項第一款至第三款受益人時，由配偶單獨領受；無配偶時，其應領之一次死亡給付或遺屬年金給付，由第一項各款受益人依序領受。同一順序受益人有數人時，應共同具名並平均領受；有喪失或拋棄領受權者，由同一順序其他受益人平均領受。但第一項第一款所定第一順序之領受人喪失或拋棄領受權者，由其子女代位領受之。\n第一項所定同一順序受益人有數人時，得委任其中具有行為能力者一人代為申請；受益人均無行為能力者，由各受益人之法定代理人推派一人代為申請；因故無法共同請領時，其他受益人得分別按其擇領種類及本條規定之比例請領。承保機關核付後，另有未具名之同一順序受益人申請時，由具領之受益人負責分與之。\n被保險人生前預立遺囑，於第一項受益人中指定領受人者，從其遺囑。無第一項受益人時，得由被保險人指定受益人。\n亡故被保險人之遺屬依第二十二條第四項、第七項，或第二十五條第二項規定，分別請領一次養老給付餘額、一次養老給付金額或遺屬年金給付者，其遺屬範圍、請領順序、限制等，比照本條及臺灣地區與大陸地區人民關係條例有關本保險死亡給付受益人相關規定辦理。\n被保險人於本法中華民國一百零三年一月十四日修正施行前死亡者，其死亡給付之受益人及其領受順序，依修正施行前之規定辦理。","title":"第 四 節 死亡給付"},{"no":"第29條","text":"遺屬年金給付應自符合請領條件之日起，按月發給，至受益人死亡當月止。\n領受遺屬年金給付之受益人有下列情形之一，停止其領受之權利，俟原因消滅後恢復：\n一、入獄服刑、因案羈押或拘禁。\n二、失蹤。\n三、前條第三項所定無謀生能力之遺屬已有謀生能力。\n領受遺屬年金給付之受益人有下列情形之一，喪失其領受之權利：\n一、死亡。\n二、喪失中華民國國籍。\n三、動員戡亂時期終止後，犯內亂罪、外患罪，經判刑確定。\n四、前條第三項第一款之配偶再婚。\n五、前條第三項第二款第一目之領受者已成年。","title":"第 四 節 死亡給付"},{"no":"第30條","text":"亡故被保險人之遺屬具有領受二個以上遺屬年金給付之資格時，應擇一請領。\n被保險人或其受益人同時符合請領養老年金及遺屬年金給付條件時，應就養老年金或遺屬年金給付擇一請領。","title":"第 五 節 養老年金給付之請領及因公條件認定"},{"no":"第31條","text":"本保險之年金給付金額，於中央主計機關發布之消費者物價指數累計成長率達正負百分之五時，由考試院會同行政院，考量國家經濟環境、政府財政與本保險準備金之財務盈虧，另定調整比率。\n被保險人或其遺屬有下列情形之一者，得比照前項規定辦理：\n一、請領展期養老年金給付。\n二、依第二十二條第二項規定恢復領受養老年金給付。\n三、依第二十三條第五項後段規定請領原未請領之養老年金給付。\n四、依第二十九條第二項規定恢復領受遺屬年金給付。","title":"第 五 節 養老年金給付之請領及因公條件認定"},{"no":"第32條","text":"依本法領受養老年金或遺屬年金給付者停止或喪失領受權利時，本人或其遺屬應自事實發生之日起三十日內，檢具相關文件資料，經原服務機關（構）學校轉陳或直接通知承保機關，自事實發生之次月起，停止發給年金給付。\n前項人員溢領年金給付時，承保機關應以書面通知溢領人於三十日內繳還；逾期未繳還者，承保機關得自匯發年金給付帳戶餘額中，追回溢領之年金給付金額。","title":"第 五 節 養老年金給付之請領及因公條件認定"},{"no":"第33條","text":"第十三條第一項第一款所稱因執行公務或服兵役致成失能者及第二十七條所稱因公死亡者，指下列情形之一，且具有相當因果關係者：\n一、因執行職務發生危險。\n二、因公差遭遇意外危險或罹病。\n三、因辦公往返或在辦公場所遇意外危險。\n四、奉召入營或服役期滿，在往返途中遇意外危險。\n五、於執行職務、服役、公差、辦公場所，或因辦公、服役往返途中，猝發疾病。\n六、因盡力職務，積勞過度。\n七、在服役期內，因服役而積勞過度，或在演習中遇意外危險。\n前項第六款及第七款所定積勞過度，應由服務機關（構）學校列舉因公積勞之具體事實及負責出具證明書，並繳驗醫療診斷書。\n因被保險人本人之交通違規行為所致失能或死亡者，不適用第一項規定。","title":"第 五 節 養老年金給付之請領及因公條件認定"},{"no":"第34條","text":"被保險人之眷屬因疾病或意外傷害而致死亡者，依下列標準，給與喪葬津貼：\n一、父母及配偶，給與三個月。\n二、子女之喪葬津貼如下：\n（一）年滿十二歲，未滿二十五歲者，給與二個月。\n（二）已為出生登記且未滿十二歲者，給與一個月。\n符合請領同一眷屬喪葬津貼之被保險人有數人時，應自行協商，推由一人檢證請領；具領之後，不得更改。有協商不實，致損及其他被保險人權益時，由具領人負責。\n被保險人之生父（母）、養父（母）或繼父（母）死亡時，其喪葬津貼應在不重領原則下，擇一請領。","title":"第 六 節 眷屬喪葬津貼、生育給付及育嬰留職停薪津貼"},{"no":"第35條","text":"被保險人加保年資滿一年以上，養育三足歲以下子女，辦理育嬰留職停薪並選擇繼續加保者，得請領育嬰留職停薪津貼。\n前項津貼，自留職停薪之日起，按月發給；最長發給六個月。但留職停薪期間未滿六個月者，以實際留職停薪月數發給；未滿一個月之畸零日數，按實際留職停薪日數計算。\n同時撫育子女二人以上者，以請領一人之津貼為限。","title":"第 六 節 眷屬喪葬津貼、生育給付及育嬰留職停薪津貼"},{"no":"第36條","text":"被保險人有下列情形之一者，得請領生育給付：\n一、在保險有效期間分娩或早產。\n二、在保險有效期間懷孕，且於保險效力停止後一年內，因同一懷孕事故而分娩或早產。\n被保險人符合前項規定者，給與二個月生育給付。\n第一項被保險人分娩或早產為雙生以上者，生育給付按前項標準比例增給。\n被保險人同時符合相關社會保險生育給付或因軍公教身分請領國家給與之生育補助請領條件者，僅得擇一請領。\n被保險人於本法中華民國一百零三年六月一日修正生效後至一百十二年十二月十八日修正之本條文施行前，具有第一項各款情形之一，且未因同一分娩或早產事實領取本保險或相關社會保險生育給付，或因軍公教身分請領國家給與之生育補助者，得依一百十二年十二月十八日修正之本條文施行前之給與標準，請領生育給付。","title":"第 六 節 眷屬喪葬津貼、生育給付及育嬰留職停薪津貼"},{"no":"第37條","text":"被保險人或其受益人領取各項保險給付之權利，不得作為讓與、抵銷、扣押或供擔保之標的。但被保險人有下列情形之一者，承保機關得自其現金給付或發還之保險費中扣抵：\n一、欠繳保險費。\n二、欠繳依法遞延繳納之自付部分保險費。\n三、溢領或誤領保險給付。","title":"第 四 章 附則"},{"no":"第38條","text":"請領本保險給付之權利，自請求權可行使之日起，因十年間不行使而當然消滅。\n被保險人或其受益人於前項期限內請領本保險給付者，除本法另有規定外，應依保險事故發生時之規定辦理。\n本保險定期發給之給付，其各期請求權時效，依第一項規定計算。","title":"第 四 章 附則"},{"no":"第39條","text":"因戰爭變亂或因被保險人或其父母、子女、配偶故意犯罪行為，以致發生保險事故者，概不給與保險給付。","title":"第 四 章 附則"},{"no":"第40條","text":"被保險人或其受益人以詐欺行為領得各項給付，除依法治罪外，應追繳其領得保險給付之本息。","title":"第 四 章 附則"},{"no":"第41條","text":"依本法支付之各項給付，經承保機關核定後，應於十五日內給付之。逾期給付係歸責於承保機關，或最後服務機關（構）學校、政府者，其逾期部分應加給利息；其利率於本法施行細則定之。\n本保險之定期給付，屬按月給付者，除核定當期外，各期給付至遲於次月底前發給。但本法及其施行細則另有規定者，不在此限。\n被保險人或其受益人赴國外、香港、澳門等地區超過一個月者，得申請改為每滿六個月發給一次。","title":"第 四 章 附則"},{"no":"第42條","text":"本保險就下列情形有最優先受清償之權：\n一、服務機關（構）學校或被保險人積欠之保險費。\n二、被保險人或其受益人應繳還溢領或誤領之給付。\n被保險人或其受益人就私立學校未依第二十條規定負擔之給付，有最優先受清償之權。","title":"第 四 章 附則"},{"no":"第43條","text":"為辦理承保作業、審核保險給付，或審議爭議案件等本保險業務所需資料，本保險主管機關或承保機關得洽請相關機關（構），或要求被保險人、受益人提供之；各該機關（構）、被保險人及其受益人不得拒絕。\n前項資料之提供機關（構）已建置電腦化作業者，本保險主管機關或承保機關得逕洽連結提供；各該機關（構）不得拒絕。\n承保機關辦理按月給付查證所需相關資料，由承保機關按月將其基本資料送本保險主管機關轉送或逕送戶政主管機關、入出國主管機關或其他相關機關比對；資料比對結果應於次月第三個工作日以前送承保機關。\n本保險主管機關或承保機關所取得之資料，應盡善良管理人之注意義務，確實辦理資訊安全稽核作業；其保有、處理及利用，應遵循個人資料保護法之規定。\n被保險人或其受益人領受年金給付期間，承保機關得予以查證，並得於查證期間暫停發給；查證期間暫停發給者，經查證符合給付條件時，應補發查證期間之給付，並繼續發給。\n被保險人或其受益人無正當理由，不繳交或補具承保機關審核給付或查證所需相關證明文件者，承保機關不負發給或遲發保險給付之責任。","title":"第 四 章 附則"},{"no":"第44條","text":"本保險之一切帳冊、單據及業務收支，均免課稅捐。","title":"第 四 章 附則"},{"no":"第45條","text":"法定機關編制內有給之民選公職人員及外國人任第二條所定職務者，準用本法之規定。","title":"第 四 章 附則"},{"no":"第46條","text":"中華民國七十四年六月三十日以前已參加退休人員保險，於本法中華民國九十四年一月二十一日修正生效時仍在保者，得繼續參加該保險；其辦法由考試院會同行政院定之。","title":"第 四 章 附則"},{"no":"第47條","text":"被保險人或其受益人對於承保機關現金給付案之審定結果如有不服，得按其身分，分依公務人員保障法或訴願法之規定，提起救濟；如有顯然錯誤，或有發生新事實、發現新證據等行政程序再開事由，得依行政程序法相關規定辦理。\n第二十條所定應負最後支付責任之機關（構）學校或政府，未支付或逾期支付超額年金或遺屬年金給付時，該給付之領受人得以應負最後支付責任之機關（構）學校或政府為相對人，依法提起救濟。","title":"第 四 章 附則"},{"no":"第48條","text":"本法中華民國一百零三年六月一日修正生效之養老年金及遺屬年金給付規定之適用，依下列規定：\n一、私立學校被保險人自中華民國一百零三年六月一日適用之。\n二、前款以外被保險人適用之離退給與相關法令未定有本法第十六條第四項第三款所定月退休（職、伍）給與，亦未定有優惠存款制度者，自本法中華民國一百零四年五月二十九日修正之條文施行後適用之。但法定機關編制內有給之民選公職人員及政務人員不適用之。\n三、前二款以外之其他被保險人，俟公務人員及公立學校教職員適用之退撫法律及本法修正通過後適用之。\n前項第一、二款被保險人符合下列情形者，得溯及適用本法關於請領養老年金給付之規定，並自符合請領條件之日起，按月發給，不受第五十一條規定限制：\n一、前項第一款被保險人於中華民國九十九年一月一日至本法中華民國一百零三年六月一日修正生效前，繳付本保險保險費滿十五年以上而退保且符合養老給付請領條件及養老年金給付之起支年齡條件。\n二、前項第二款被保險人於本法中華民國一百零三年六月一日修正生效後至本法中華民國一百零四年五月二十九日修正之條文施行前，繳付本保險保險費滿十五年以上而退保且符合養老給付請領條件及養老年金給付之起支年齡條件。\n前項被保險人已領取一次養老給付者，應於下列期限內一次全數繳回承保機關，始得申請改領養老年金給付；逾期不得再申請改領：\n一、第一項第一款被保險人應於本法中華民國一百零三年六月一日修正生效後六個月內，一次全數繳回。\n二、第一項第二款被保險人應於本法中華民國一百零四年五月二十九日修正之條文施行後六個月內，一次全數繳回。\n第一項第一款被保險人於本法中華民國一百零三年六月一日修正生效前死亡者，或同項第二款被保險人於本法中華民國一百零四年五月二十九日修正之條文施行前死亡者，不適用前二項規定。\n第一項前二款被保險人因重複參加其他職域社會保險而依規定選擇退出本保險者，其依第二十六條規定請領之養老年金給付，應依基本年金率計給，並應受第六項規定之限制。\n第一項前二款被保險人，其每月退休（職、伍）給與，加計每月可領養老年金給付之總和，不得超過其最後在職加保投保俸（薪）額二倍之百分之八十；超過者，應調降養老年金給付，不適用第十九條規定，或得選擇不請領養老年金給付而請領一次養老給付；一經領受，不得變更。\n第一項前二款被保險人養老年金及遺屬年金給付之保險費率，應依第八條所定精算機制，按年金所需費率覈實釐定之。\n第一項前二款被保險人曾領取本保險
