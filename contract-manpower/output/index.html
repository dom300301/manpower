J5qWtLS3mlL%2FlupzlpZHntITkurrlipvkuYvmlL%2FnrZblrprkvY3oiIfnj77lr6YxMDEwMjA5LnBkZg%3D%3D","accessible":false},{"title":"考試院委託研究：契約進用公務人力之範圍、甄選、權利及義務之研究（2012）","url":"https://ws.exam.gov.tw/Download.ashx?u=LzAwMS9VcGxvYWQvMS9yZWxmaWxlLzEyMDgyLzI4NDM5L2EwMWVmNDBiLWM4ZmQtNDE4Ni1hMGFkLWI0YjM5NTBkODdlMS5wZGY%3D&n=MDEyNTE2MTUyMDQwLnBkZg%3D%3D","accessible":false}]},{"date":"2012-03-27","roc_year":"101","event":"考試院、行政院第4度會銜函送《公務人員基準法》草案，第5條將聘任人員納入常務人員","actor":"考試院","category":"草案提出","personnel_types":["公務人員","聘用"],"summary":"5章71條；以基準法第5條為法源，銓敘部另擬「聘任人員人事條例」草案（101.9.28送考試院）定位聘任人員為常務人員，不簽契約、無聘期；聘用及約僱則定位為公法契約用人。","significance":"轉換：將「聘任」從契約用人切離回常務體系，契約人力範圍縮小為聘用、約僱兩類。","sources":[{"title":"政府機關用人體制之研究－從公法契約用人法制論析（人事總處，103.5.15）","url":"https://www.dgpa.gov.tw/Uploads/public/Attachment/51161738378.pdf","accessible":true},{"title":"考試院新聞稿：考試院審議通過公務人員基準法草案 近期將函請行政院同意會銜","url":"https://www.exam.gov.tw/News_Content.aspx?n=1&s=19485","accessible":false}]},{"date":"2013-05-17","roc_year":"102","event":"銓敘部函送考試院新版《聘用人員人事條例》草案（41條，整合聘用及約僱）","actor":"銓敘部","category":"草案提出","personnel_types":["聘用","約僱"],"summary":"研擬原則：維持「聘用人員」名稱、進用比率不逾職員預算總人數10%、不適用勞基法（公法契約）、一等至五等、學經歷資格、公開甄選、主管機關每5年檢討業務計畫以避免久任、年度考核、參加勞保並準用勞退條例。","significance":"路徑依賴：第二代草案延續「公法契約＋不適用勞基法」路徑，但保障內容改借用勞保勞退，顯示「借用勞動制度填補公法空洞」的折衷。","sources":[{"title":"政府機關用人體制之研究－從公法契約用人法制論析（人事總處，103.5.15）","url":"https://www.dgpa.gov.tw/Uploads/public/Attachment/51161738378.pdf","accessible":true}]},{"date":"2014-05-15","roc_year":"103","event":"人事總處研究報告《政府機關用人體制之研究－從公法契約用人法制論析》","actor":"人事總處","category":"調查報告","personnel_types":["聘用","約僱","約用"],"summary":"比較聘任、聘用兩草案，分析聘僱改適用勞基法之衝擊，提出「廢除聘僱法制：高度專業者納入聘任制度、例行事務性約僱改進用臨時人員受勞動法制保障」等重組方案。","significance":"行政院幕僚立場：傾向以勞動法制與聘任制度「兩端吸收」契約人力，與考試院「第三軌公法契約」路線分歧。","sources":[{"title":"政府機關用人體制之研究－從公法契約用人法制論析（人事總處，103.5.15）","url":"https://www.dgpa.gov.tw/Uploads/public/Attachment/51161738378.pdf","accessible":true}]},{"date":"2015-06-17","roc_year":"104","event":"《派用人員派用條例》廢止；公務人員任用法增訂第36條之1設9年過渡期","actor":"立法院","category":"法制定","personnel_types":["公務人員"],"summary":"立法院104年6月2日三讀，現職派用人員104.6.19至113.6.18過渡期後留任原職；114年8月1日再修正第36條之1放寬調任。","significance":"轉換：五類非考試用人中的「派用」軌道正式終結，回歸考試用人，為考試院在契約用人議題上少數成功的「收編」。","sources":[{"title":"法源法律網：派用人員9年後不升遷 立法院三讀通過公務人員任用法（2015-06-04）","url":"https://www.lawbank.com.tw/news/NewsContent.aspx?NID=128959","accessible":false}]},{"date":"2015-08","roc_year":"104","event":"立法院預算中心專題：中央政府各機關運用非典型人力之現況","actor":"立法院","category":"調查報告","personnel_types":["約用","承攬"],"summary":"100至103年度非典型人力由82,461人增至84,805人，臨時人員由33,210人增至39,677人；批評部分機關委外比率偏高「儼然成為發包中心」、超額人力偏高卻運用非典型人力。","significance":"量化證據顯示總員額法施行後非典型人力不減反增。","sources":[{"title":"立法院預算中心專題：中央政府各機關運用非典型人力之現況（104年8月）","url":"https://www.ly.gov.tw/Pages/Detail.aspx?nodeid=10084&pid=139750","accessible":false}]},{"date":"2015","roc_year":"104","event":"李靜宜臺大政治學博士論文《我國中央機關非典型人力運用政策之分析：歷史制度論觀點》","actor":"學界","category":"調查報告","personnel_types":["約用","承攬","聘用","約僱"],"summary":"以路徑依循與斷續均衡理論分析：長期考試用人、人事制度僵化、財政危機與新公共管理使非典型人力運用「實屬必然」；各機關因歷史沿革、預算、民意機關關注與受僱者動員差異而有不同時點與作法。","significance":"直接以歷史制度論驗證本題核心命題。","sources":[{"title":"李靜宜（2015）我國中央機關非典型人力運用政策之分析：歷史制度論觀點，臺大政治學研究所博士論文","url":"https://www.airitilibrary.com/Article/Detail/U0001-1307201516341300","accessible":false}]},{"date":"2016-02-04","roc_year":"105","event":"勞動部訂定「政府機關（構）運用勞務承攬參考原則」","actor":"勞動部","category":"法制定","personnel_types":["承攬"],"summary":"依立法院104年決議由勞動部會同人事總處訂定；要求避免自然人承攬、不得指揮監督派駐勞工、設申訴管道、薪資列固定費用；113年5月1日修正。","significance":"層疊：承攬人力亦僅以「參考原則」（行政指導）治理，法律位階最低，卻承接最多人力。","sources":[{"title":"勞動部：政府機關（構）運用勞務承攬參考原則（105.2.4訂定）","url":"https://www.mol.gov.tw/media/blnol2pf/政府機關-構-運用勞務承攬應行注意事項-核定版-1050204訂定.pdf?mediaDL=true","accessible":false},{"title":"政府機關（構）運用勞務承攬參考原則（植根法律網，1130501版）","url":"https://www.rootlaw.com.tw/LawArticle.aspx?LawID=A040290031005900-1130501","accessible":false},{"title":"勞動部〈勞動權益相關法規及政府機關（構）運用承攬參考原則說明〉（人事總處113年研習簡報）","url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa%2Ffiles%2F202404%2Fdcb818dc-f2fe-4f41-b561-f23bff693cca.pdf&nfix=&name=承攬參考原則說明.pdf","accessible":true}]},{"date":"2017-04-20","roc_year":"106","event":"考試院院會審議銓敘部「契約人員人事條例草案」（聘用六至十三等、約僱一至五等）","actor":"考試院","category":"草案審議","personnel_types":["聘用","約僱"],"summary":"因銓敘部與人事總處對適用範圍看法不同而延宕；同年10月27日立委林岱樺等17人以「契約人員人事條例草案」提案（第9屆第4會期），明定契約人員與國家為公法契約關係，109年1月屆期不續審。","significance":"否決點：兩院幕僚機關之管轄歧見成為內部否決點；委員提案版亦因缺乏行政部門支持而消失。","sources":[{"title":"新北市政府人事處108年度自行研究報告：我國聘僱人員人事法制之研究","url":"https://www.rde.ntpc.gov.tw/userfiles/1160700/files/16我國聘僱人員人事法制之研究.pdf","accessible":false},{"title":"法源法律網：「契約人員人事條例」草案（林岱樺等17人提案，2017-10-26）","url":"https://www.lawbank.com.tw/news/NewsContent_print.aspx?NID=147434.00","accessible":false}]},{"date":"2018-07-18","roc_year":"107","event":"行政院訂定「行政院暨所屬機關（構）檢討運用勞動派遣實施計畫」（派遣歸零）","actor":"行政院","category":"政策","personnel_types":["承攬","約用"],"summary":"目標110年起不再運用派遣；涉核心業務者改以公開遴選自僱（臨時人員），電話總機、清潔、檔案管理、駕駛等8項非核心業務改採勞務承攬。107年底承攬43,622人、派遣7,522人；審計部指派遣歸零可能「遁入承攬」。","significance":"轉換：以「派遣→承攬／臨時人員」的形式轉換回應勞權批評，實質僱用關係未改，審計部與預算中心均警告「承攬為名、派遣為實」。","sources":[{"title":"行政院暨所屬機關（構）檢討運用勞動派遣實施計畫（107.7.18；臺中市主計處轉載）","url":"https://www.dbas.taichung.gov.tw/media/529424/61-1-new-檢討運用勞動派遣實施計畫-107718訂定.pdf","accessible":false},{"title":"政府機關多元人力運用及管理（人事總處簡報，110年6月）","url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa%2Ffiles%2F202106%2Fa5dc4cdd-59a4-495a-b1d9-1dab0ee1b34a.pdf&name=政府機關多元人力運用及管理.pdf","accessible":true},{"title":"立法院預算中心：派遣歸零政策實施後，允宜儘速訂定細部注意事項並依時程完備派遣專法，以防堵「承攬為名，派遣為實」","url":"https://www.ly.gov.tw/Pages/Detail.aspx?nodeid=33364&pid=185035","accessible":false},{"title":"關鍵評論網：行政院7千位派遣兩年內將「歸零」，但勞動條件更差的「承攬」卻有4萬多人","url":"https://www.thenewslens.com/article/100155","accessible":false},{"title":"報導者：政府派遣人力下降背後……問題真的改善嗎？","url":"https://www.twreporter.org/a/temporary-worker-public-sector","accessible":false}]},{"date":"2018-12-22","roc_year":"107","event":"監察院財經委員會巡察行政院提出「政府對於非典型就業規範及執行情形之探討」通案調查","actor":"監察院","category":"調查報告","personnel_types":["約用","承攬"],"summary":"指地方政府臨時人員管控缺乏明文規定，主管機關應評估正式編制是否不足並考慮規範各級政府臨時人員進用數額。","significance":"監察院再次指向「編制不足→非典型替代」的結構。","sources":[{"title":"監察院新聞稿：政府應落實立法保護非典型就業權益，並確實掌握相關資訊（107.12.22巡察行政院）","url":"https://www.cy.gov.tw/News_Content.aspx?n=124&sms=8912&s=13227","accessible":false}]},{"date":"2019-10-01","roc_year":"108","event":"行政院全文修正約僱辦法並更名為《行政院與所屬中央及地方各機關約僱人員僱用辦法》；考試院同日修正聘用條例施行細則第6條","actor":"行政院","category":"修正","personnel_types":["約僱","聘用"],"summary":"配合分類職位任用法廢止重新定義約僱人員為「以行政契約定期僱用，辦理事務性、簡易性等行政或技術工作」，明定公開甄選程序、消極資格、65歲終止、提高撫慰金；109年5月增訂第8-1條、111年9月修正第4條。","significance":"修補式層疊：47年未動的命令終於修正，但仍停留在命令層次；明文「行政契約」是為回應勞基法適用爭議（法制局指出人事總處於108年修正以釐清適用關係）。","sources":[{"title":"行政院與所屬中央及地方各機關約僱人員僱用辦法 沿革","url":"https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=S0110014","accessible":true},{"title":"行政院暨所屬機關約僱人員僱用辦法修正總說明（108年，行政院公報）","url":"https://gazette.nat.gov.tw/EG_FileManager/eguploadpub/eg025185/ch01/type1/gov01/num1/images/AA.pdf","accessible":true},{"title":"聘用人員聘用條例施行細則 沿革","url":"https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=S0020015","accessible":true},{"title":"立法院法制局議題研析：公部門聘僱小編人員勞動權益之研析（蔡琮浩，109年9月，R01083）","url":"https://www.ly.gov.tw/Pages/Detail.aspx?nodeid=6590&pid=199057","accessible":false}]},{"date":"2019-11-15","roc_year":"108","event":"行政院修正臨時人員要點：不再以定期契約為限、改採主管機關總量控管","actor":"行政院","category":"修正","personnel_types":["約用"],"summary":"配合零派遣，派遣改自僱人員多屬繼續性工作，故由機關依勞基法簽訂定期或不定期契約；上限改為「96年度人數＋派遣改臨時人員人數＋97年後新設機關人數」，專案補助與重大政策人力不受限。","significance":"漂移的正式化：要點放棄「臨時性」要件，承認臨時人員已是常態人力，但仍以要點而非法律處理。","sources":[{"title":"約用人員管理規定（人事總處組編人力處簡報，113.4.18）","url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa/files/202404/308f2535-a6e0-4dd1-bbca-5d4a6c82fb80.pdf&nfix=&name=約用人員管理規定.pdf","accessible":true},{"title":"政府機關多元人力運用及管理（人事總處簡報，110年6月）","url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa%2Ffiles%2F202106%2Fa5dc4cdd-59a4-495a-b1d9-1dab0ee1b34a.pdf&name=政府機關多元人力運用及管理.pdf","accessible":true},{"title":"多元人力簡介（人事總處委外及多元人力運用專區，113.2.27）","url":"https://www.dgpa.gov.tw/mp/archive?uid=577&mid=152","accessible":true}]},{"date":"2019-12-31","roc_year":"108","event":"總統公布《中央政府機關總員額法》修正第3、4、11條","actor":"立法院","category":"修正","personnel_types":["公務人員","聘用","約僱"],"summary":"將公立醫院職員排除於第一類員額（調降12,100人）；第三類（司法）上限提高至15,000人，第二類（聘僱、駐衛警、工友）由41,200人下調為40,100人。","significance":"顯示總量上限可因個別部門需求局部調整，但聘僱員額上限反遭壓縮，加深員額外人力的替代誘因。","sources":[{"title":"中央政府機關總員額法 沿革","url":"https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=S0110038","accessible":true},{"title":"立法院：中央政府機關總員額法修正第3條、第4條及第11條條文（108年12月）","url":"https://www.ly.gov.tw/Pages/Detail.aspx?nodeid=33324&pid=190941","accessible":false}]},{"date":"2020-02","roc_year":"109","event":"立法院預算中心專題研究：臨時人員納入中央政府機關總員額法之探討（賴怡瑩，A01511）","actor":"立法院","category":"調查報告","personnel_types":["約用"],"summary":"認為臨時人員與第二類人員定位差異不大，納入總員額法控管「尚屬可行」，法律、財政、行政層面無礙，政治層面可能加劇勞基法適用與權益衡平爭議。","significance":"提出將「員額外」人力拉回「員額內」的制度選項，迄今未採。","sources":[{"title":"立法院預算中心專題研究：臨時人員納入中央政府機關總員額法之探討（賴怡瑩，109年2月，A01511）","url":"https://www.ly.gov.tw/Pages/Detail.aspx?nodeid=6586&pid=191973","accessible":false}]},{"date":"2020-06","roc_year":"109","event":"人事總處研擬完成《聘約人員人事條例》草案，函請各機關於6月19日前表示意見","actor":"人事總處","category":"草案提出","personnel_types":["聘用","約僱"],"summary":"整合聘用與約僱為「聘約人員」，公法契約關係，列為機關預算員額，一等至五等（五等最高，須博士學位及年資），甄審考核委員會、公開甄選、利益迴避、續約與終止、服務行為規範、參加勞保勞退；第4條：三等以上聘約人員進用滿3年得任特定機關（研究、文化館所、科技專業等非公權力領域）有職稱職務。","significance":"關鍵節點（未成）：首次由行政院（而非考試院）主導契約人力專法，且突破「不得兼任有職等職務」的58年禁令，立即觸發考試權／文官體制的否決反應。","sources":[{"title":"【澄清稿】媒體報導「聘約人員人事條例」草案相關議題（人事總處新聞稿，109.7.12）","url":"https://www.dgpa.gov.tw/information?uid=82&pid=10228","accessible":true},{"title":"中央社：約聘人員可取得職等 人事行政總處：無公務員身分（2020.7.11）","url":"https://www.cna.com.tw/news/aipl/202007110190.aspx","accessible":false},{"title":"立法院法制局議題研析：聘約人員人事條例草案之妥適性研析（方華香，109年8月，R01065）","url":"https://www.ly.gov.tw/Pages/Detail.aspx?nodeid=6590&pid=198459","accessible":false}]},{"date":"2020-07-12","roc_year":"109","event":"人事總處發布澄清稿；7月13日行政院長蘇貞昌稱聘約人員與公務人員「完全不相干」","actor":"行政院","category":"草案審議","personnel_types":["聘用","約僱"],"summary":"國民黨團質疑「開後門、破壞文官體制」、第4條「三年條款」；全國公務人員協會、林清汶等批評侵犯考試權、酬庸；社工團體批評仍不適用勞基法。人事總處強調不取得公務員身分、不擴及一般行政機關、無時間表。","significance":"否決聯盟：在野黨＋公務人員團體＋考試權論述形成跨黨派反對，草案停留在徵詢階段；此後未再送行政院會。","sources":[{"title":"【澄清稿】媒體報導「聘約人員人事條例」草案相關議題（人事總處新聞稿，109.7.12）","url":"https://www.dgpa.gov.tw/information?uid=82&pid=10228","accessible":true},{"title":"工商時報：蘇揆：聘約人員人事條例和公務人員完全不相干（2020.7.13）","url":"https://www.ctee.com.tw/news/20200713700589-430104","accessible":false},{"title":"自由時報：約聘人員修法被誤解為排擠公務員 人事總處：提案沒有時間表（2020.9）","url":"https://news.ltn.com.tw/news/politics/breakingnews/3300840","accessible":false},{"title":"林清汶觀點：聘約人員人事條例將破壞文官體系（風傳媒）","url":"https://www.storm.mg/article/2853773","accessible":false},{"title":"全國公務人員協會：針對令人憂心疑慮的「聘約人員人事條例」","url":"https://ncsatw.org/news/79","accessible":false},{"title":"簡評行政院人事行政總處的「聘約人員人事條例」（台灣社會福利總盟/社工專協評論）","url":"https://www.sunnyswa.org.tw/25001/","accessible":false}]},{"date":"2020-07-15","roc_year":"109","event":"監察院糾正法務部：矯正署以勞務承攬進用心理師、社工涉「假承攬真僱傭」","actor":"監察院","category":"調查報告","personnel_types":["承攬"],"summary":"王幼玲、王美玉調查：各監所108年中起以承攬進用專業人力，契約要求全職8小時、配合上下班、加班受訓出差，實具指揮監督卻規避雇主責任，留任率僅62%、50%；請行政院督導整合部會意見研議常設人力。","significance":"監察院將「承攬替代」的實質僱傭問題正式定性，是派遣歸零後承攬治理失靈的指標案例。","sources":[{"title":"監察院新聞稿：監所進用心理及社工人員涉「假承攬真僱傭」，監委王幼玲、王美玉糾正法務部（109.7.15）","url":"https://www.cy.gov.tw/News_Content.aspx?n=125&s=18071","accessible":false},{"title":"監察院調查報告：法務部矯正署以勞務承攬方式運用專業人力（社工及心理師）至各監所案","url":"https://cybsbox.cy.gov.tw/CYBSBoxSSL/edoc/download/61829","accessible":false}]},{"date":"2020-08","roc_year":"109","event":"立法院法制局議題研析：聘約人員人事條例草案之妥適性研析（方華香，R01065）","actor":"立法院","category":"調查報告","personnel_types":["聘用","約僱"],"summary":"肯定整合方向，但指出聘用人員主管機關為銓敘部、約僱為人事總處，草案通過後與《聘用人員聘用條例》適用界線及是否限縮考試權有疑義，建議先與考試院協商；另指可能排擠考試進用人員。","significance":"法制局再度扮演否決論述供應者，核心仍是兩院管轄。","sources":[{"title":"立法院法制局議題研析：聘約人員人事條例草案之妥適性研析（方華香，109年8月，R01065）","url":"https://www.ly.gov.tw/Pages/Detail.aspx?nodeid=6590&pid=198459","accessible":false}]},{"date":"2020-09","roc_year":"109","event":"立法院法制局議題研析：公部門聘僱小編人員勞動權益之研析（蔡琮浩，R01083）；監委自動調查金山區公所小編過勞死","actor":"立法院","category":"調查報告","personnel_types":["約僱","約用"],"summary":"金山區公所陳姓僱員猝死（月薪不到3萬、加班逾百小時）；研析指出銓敘部視聘用人員為廣義公務員、人事總處視為公法契約不適用勞基法，主管機關咸認不適用勞基法；聘僱人員亦不得組織工會。監察院110年8月糾正金山區公所。","significance":"個案暴露公法契約定位下「非勞非公」的保障真空；監委建議考試院與人事總處通盤考量並立法保障。","sources":[{"title":"立法院法制局議題研析：公部門聘僱小編人員勞動權益之研析（蔡琮浩，109年9月，R01083）","url":"https://www.ly.gov.tw/Pages/Detail.aspx?nodeid=6590&pid=199057","accessible":false},{"title":"監察院新聞稿：金山區公所小編過勞猝死，糾正新北市金山區公所（110.8）","url":"https://www.cy.gov.tw/News_Content.aspx?n=125&sms=8912&s=20668","accessible":false}]},{"date":"2021-02-01","roc_year":"110","event":"行政院停止適用「運用勞動派遣應行注意事項」，110年起行政院暨所屬不再運用派遣","actor":"行政院","category":"政策","personnel_types":["承攬","約用"],"summary":"多元人力自此僅剩「約用（臨時）人員」與「勞務承攬派駐人力」兩類；人事總處110年6月簡報整理94至108年多元人力運用進程。","significance":"轉換完成：派遣制度性消失，人力轉入承攬與臨時人員，契約人力版圖重組。","sources":[{"title":"政府機關多元人力運用及管理（人事總處簡報，110年6月）","url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa%2Ffiles%2F202106%2Fa5dc4cdd-59a4-495a-b1d9-1dab0ee1b34a.pdf&name=政府機關多元人力運用及管理.pdf","accessible":true},{"title":"約用人員管理規定（人事總處組編人力處簡報，113.4.18）","url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa/files/202404/308f2535-a6e0-4dd1-bbca-5d4a6c82fb80.pdf&nfix=&name=約用人員管理規定.pdf","accessible":true}]},{"date":"2021-07-15","roc_year":"110","event":"監察院糾正教育部：大專校院專案教師「非勞非教」、以行政規則空白授權","actor":"監察院","category":"調查報告","personnel_types":["聘用"],"summary":"教育部自87年開放編制外專案教師，部分學校比例達八成；糾正指身分「非勞非教」、法位階與授權依據有疑義；教育部111年5月24日訂定「專科以上學校進用編制外專任教學人員實施原則」。","significance":"教育領域的平行案例：契約人力在教育人員法制中同樣以行政規則層疊、形成保障真空。","sources":[{"title":"監察院新聞稿：大專校院專案教師權益長期遭受漠視「非勞非教」，監察院通過糾正教育部（110.7.15）","url":"https://www.cy.gov.tw/News_Content.aspx?n=125&s=20498","accessible":false},{"title":"監察院糾正案文：教育部自87年起開放大專校院編制外專案教師案","url":"https://cybsbox.cy.gov.tw/CYBSBoxSSL/edoc/download/72599","accessible":false},{"title":"監察院公報第3231期（糾正教育部專案教師案文）","url":"https://www-ws.cy.gov.tw/Download.ashx?u=LzAwMS9VcGxvYWQvMy9yZWxmaWxlLzg5MTYvMjA2NzkvYzJhMmU5YzQtZGUxYy00YWM1LTk1OWUtYzg0YjUxNDA2ODlhLnBkZg%3D%3D&n=MzIzMS5wZGY%3D&icon=..pdf","accessible":false}]},{"date":"2022-10-20","roc_year":"111","event":"數位發展部約聘比例爭議，銓敘部長周志宏表示《聘用人員聘用條例》過於簡陋將研修、預計112年送立法院","actor":"銓敘部","category":"政策","personnel_types":["聘用"],"summary":"數位部組織法允許聘用最多300人（預算員額598人），在野質疑養網軍、破壞文官體制；數位部書面報告稱111年聘用占比14.21%。其後未見銓敘部修正草案送立法院之紀錄。","significance":"新設機關以高比例聘用突破5%慣例，引發新一輪「契約人力法制化」承諾，但再度停留在宣示。","sources":[{"title":"中時：數位部約聘僱人力過半 銓敘部研議修法（2022.10.20）","url":"https://www.chinatimes.com/realtimenews/20221020002405-263101","accessible":false}]},{"date":"2024-01-30","roc_year":"113","event":"行政院函修正臨時人員要點，更名為「行政院及所屬各機關學校約用人員進用及運用要點」","actor":"行政院","category":"修正","personnel_types":["約用"],"summary":"因臨時人員已不限臨時性工作（例如法務部以臨時人員進用檢察官助理辦理打詐常態業務）而「名實不符」，在不變動身分屬性、契約性質、勞動條件之下正名為「約用人員」；控管改由行政院核定各主管機關用人額度上限。114年12月19日再修正。","significance":"漂移的制度承認：政府以更名方式接受「臨時人員常態化」既成事實，形成聘用／約僱／約用三種名稱並存的契約人力體系。","sources":[{"title":"修正臨時人員要點並更名為約用人員要點（人事總處最新消息，113.1.30）","url":"https://www.dgpa.gov.tw/information?uid=2&pid=11786","accessible":true},{"title":"行政院及所屬各機關學校約用人員進用及運用要點（113.1.30修正）","url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa%2Ffiles%2F202402%2F6fe2dab8-4b2c-4275-9112-b5dde436166c.pdf&nfix=&name=約用人員要點-1130130.pdf","accessible":true},{"title":"約用人員管理規定（人事總處組編人力處簡報，113.4.18）","url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa/files/202404/308f2535-a6e0-4dd1-bbca-5d4a6c82fb80.pdf&nfix=&name=約用人員管理規定.pdf","accessible":true},{"title":"多元人力簡介（人事總處委外及多元人力運用專區，113.2.27）","url":"https://www.dgpa.gov.tw/mp/archive?uid=577&mid=152","accessible":true}]},{"date":"2025-07-09","roc_year":"114","event":"總統公布《公務人員保障法》修正，第102條增訂第3項：約僱、約用、工友等依法令從事公務者就職場霸凌申訴準用保障法（115年1月9日施行）","actor":"立法院","category":"修正","personnel_types":["約僱","約用","聘用"],"summary":"保訓會解釋：依法律或法律授權命令進用者（聘用人員）得準用保障法救濟，依行政命令進用之約僱人員原則不在保障範圍；本次修正僅就霸凌申訴擴及各類契約人力。","significance":"層疊：保障機制以「準用」方式零碎擴張，仍未處理約僱、約用人員的整體救濟定位。","sources":[{"title":"保訓會：公務人員保障法第19條至第19條之2、第21條、第102條及第104條修正條文，自115年1月9日施行","url":"https://www.csptc.gov.tw/News_Content.aspx?n=4555&s=43915","accessible":false},{"title":"保訓會：各機關聘僱人員可否依公務人員保障法請求保障？","url":"https://www.csptc.gov.tw/News_Content.aspx?n=3521&s=16277","accessible":false}]},{"date":"2025-07","roc_year":"114","event":"立法院預算中心專題研究：中央政府聘用及約僱人力運用情形之探討（劉宜姈，114116）","actor":"立法院","category":"調查報告","personnel_types":["聘用","約僱"],"summary":"發現：聘僱預算員額逐年攀升且增幅高於職員，部分機關超逾5%原則；長期以聘僱辦理經常性業務、久任化未改善；總預算未呈現聘僱人力全貌、薪點折合率缺客觀標準；法制基礎不足須待各主管機關凝聚共識。","significance":"最新官方幕僚診斷：問題與95年評估幾乎相同，證明二十年制度停滯。","sources":[{"title":"立法院預算中心專題研究：中央政府聘用及約僱人力運用情形之探討（劉宜姈，114年7月，114116）","url":"https://www.ly.gov.tw/Pages/List.aspx?nodeid=56067","accessible":false},{"title":"立法院預算中心：近年中央機關聘僱預算員額逐年攀升，部分機關已超逾5%之原則（114年7月）","url":"https://www.ly.gov.tw/Pages/Detail.aspx?nodeid=56067&pid=252977","accessible":false}]},{"date":"2025-10-22","roc_year":"114","event":"人事總處澄清「聘僱暴增、政務人員膨脹」報導：115年總預算聘僱16,375人，近10年淨增599人","actor":"人事總處","category":"政策","personnel_types":["聘用","約僱"],"summary":"回應媒體引用預算中心「4萬人」說法，強調聘用、約僱進用比率分別為4.7%與3.8%，整體未超過職員5%；增加多因AI智慧政府、打詐法官助理、新設機關籌備。","significance":"行政與立法幕僚對「契約人力規模」的統計口徑之爭（員額內聘僱 vs. 含約用、承攬之廣義契約人力）本身即制度縫隙的表徵。","sources":[{"title":"中央社：人事總處：政府用人均符員額法 無大量增政務人員（2025.10.22）","url":"https://www.cna.com.tw/news/aipl/202510220259.aspx","accessible":false}]},{"date":"2026-01","roc_year":"115","event":"立法院法制局連續發布：聘用人員人事規範之淺析（R02983，115年1月）、德國公部門契約人員人事法制簡介（R03012，115年3月）、聘僱人員人事法制相關問題探討（A01848，115年5月）","actor":"立法院","category":"調查報告","personnel_types":["聘用","約僱"],"summary":"賴怡瑩系列研究，顯示第11屆立法院幕僚再度啟動契約人力法制議題（內文本環境無法取得）。","significance":"議程再開啟的訊號；是否成為新關鍵節點待觀察。","sources":[{"title":"立法院法制局議題研析：聘用人員人事規範之淺析（賴怡瑩，115年1月，R02983）；德國公部門契約人員人事法制簡介（R03012，115年3月）","url":"https://www.ly.gov.tw/Pages/List.aspx?nodeid=6590","accessible":false},{"title":"立法院法制局專題研究：聘僱人員人事法制相關問題探討（賴怡瑩，115年5月，A01848）","url":"https://www.ly.gov.tw/Pages/List.aspx?nodeid=6586","accessible":false}]},{"date":"2026-03-25","roc_year":"115","event":"人事總處向立法院司法及法制委員會提出業務及立法計畫報告；基層公務員人力荒成焦點","actor":"人事總處","category":"政策","personnel_types":["公務人員"],"summary":"人事長蘇俊榮表示6月底前提專業加給調整方案；行政院於114年4月調增聘用、約僱薪點折合率至139.1元、約用人員調薪3%。","significance":"基層人力短缺成為新的外生壓力，可能推動從「契約替代」轉向「常任待遇改善」或反向擴大契約進用。","sources":[{"title":"中時：讓用人機關決定晉升 銓敘部修法刪學歷等限制（2026.7.15）","url":"https://www.chinatimes.com/realtimenews/20260715002753-260407","accessible":false}]},{"date":"2026-07-15","roc_year":"115","event":"立法院審查銓敘部《公務人員任用法》部分條文修正草案：機關得自行遴用具任用資格人員、刪除升簡任訓練與碩士學歷門檻","actor":"銓敘部","category":"草案審議","personnel_types":["公務人員"],"summary":"銓敘部長施能傑（前人事長，109年聘約人員草案主事者）稱為補充人力缺口與提升用人彈性；學者批評削弱功績原則。","significance":"行動者跨院流動（施能傑由人事總處轉任銓敘部）可能改變兩院在契約人力議題上的對立結構，值得追蹤。","sources":[{"title":"中時：讓用人機關決定晉升 銓敘部修法刪學歷等限制（2026.7.15）","url":"https://www.chinatimes.com/realtimenews/20260715002753-260407","accessible":false}]},{"date":"2026-10-15","roc_year":"115","event":"考試院會通過「各機關職稱及官等職等員額配置準則」第7條修正草案，刪除委任一至三職等基層職務最低配置標準","actor":"考試院","category":"草案提出","personnel_types":["公務人員","承攬","約用"],"summary":"理由：基層例行性及事務性工作多已透過業務委外或資訊科技辦理，且基層職務待遇不利攬才；待行政院會銜。","significance":"路徑依賴的終點之一：正式編制主動退出事務性工作，承認委外／約用已是基層事務性人力的常態供給。","sources":[{"title":"中央社：考試院通過配置準則修正草案 增加機關用人彈性（2026.10.15）","url":"https://www.cna.com.tw/news/aipl/202610150291.aspx","accessible":false}]}],"drafts":[{"name":"公務人員基準法草案","year":"2000／2002／2006／2012（民國89、91、95、101年四度送審）","proposer":"考試院會銜行政院","status":"屆期不續審（四次均未完成三讀；101年版送審後未再重提）","key_provisions":["界定公務人員範圍與身分關係，統攝政務、常務、契約用人三元體制","101年版第5條將聘任人員納入常務人員範疇並授權另以法律定之","89年版6章60條；101年版5章71條"],"controversies":["行政院認為立法期程難以預期，改以個別修正公務員服務法等方式處理","常任文官對納入契約用人的疑慮"],"comparison_with_current":"現行無基準法，公務人員定義散見任用法、服務法等；契約人力之上位定位因此缺乏法源錨點，各專法草案均須自行界定「公法契約關係」。","sources":[{"title":"考試院新聞稿：考試院審議通過公務人員基準法草案 近期將函請行政院同意會銜","url":"https://www.exam.gov.tw/News_Content.aspx?n=1&s=19485","accessible":false},{"title":"考試院新聞稿：銓敘部函陳「公務人員基準法」草案及其總說明","url":"https://www.exam.gov.tw/News_Content.aspx?n=3438&s=18275","accessible":false},{"title":"政府機關用人體制之研究－從公法契約用人法制論析（人事總處，103.5.15）","url":"https://www.dgpa.gov.tw/Uploads/public/Attachment/51161738378.pdf","accessible":true}]},{"name":"聘用人員聘用條例修正草案（含配合修正或廢止任用法等相關法規）","year":"2002-2004（民國91-93年）","proposer":"考試院／銓敘部","status":"未送立法院，嗣併入94年「聘用人員人事條例」草案","key_provisions":["落實政府改造委員會91年「政府人力運用彈性化計畫方案」","明定聘用人員與國家間為公法上職務關係，不適用勞動基準法","各機關聘用人員以不超過職員預算員額15%為原則","職務分類、新進人員公開甄選"],"controversies":["「公法上職務關係」與「公法上契約關係」之界定應審慎","對常任文官體制衝擊"],"comparison_with_current":"現行條例僅10條、無比例上限（僅行政院內規以聘僱不逾職員預算員額5%為原則）、無公開甄選明文（約僱辦法108年始增訂）。","sources":[{"title":"考試院新聞稿：考試院積極研修「聘用人員聘用條例」修正草案","url":"https://www.exam.gov.tw/News_Content.aspx?n=3438&s=18497","accessible":false},{"title":"考試院新聞稿：院會審議聘用人員聘用條例修正草案暨配合修正（或廢止）任用法等相關法規草案","url":"https://www.exam.gov.tw/News_Content.aspx?n=3438&s=18556","accessible":false},{"title":"考試院新聞稿：院會就政府改造委員會「政府人力運用彈性化計畫方案」作成決定","url":"https://www.exam.gov.tw/News_Content.aspx?n=3438&s=18288","accessible":false}]},{"name":"約聘人員人事條例草案","year":"約2001-2003（考試院新聞稿未標年份，依內容推定）","proposer":"銓敘部函陳考試院","status":"撤回／暫緩研訂（考試院院會決議暫緩，待聘任人員人事條例施行後再評估）","key_provisions":["整合聘用、派用、機要、約僱等各類非常任臨時人員之管理法制，取代現行各類規定"],"controversies":["業務屬性、現有人員權益、身分屬性、職務代理制度、經費負擔、憲法規定及與聘任人員人事條例之關係","院會認為現行規定執行無窒礙，權益不足處先修離職儲金與給假規定"],"comparison_with_current":"即為後來94年草案之前身；考試院選擇以修正子法處理權益，專法暫緩。","sources":[{"title":"考試院新聞稿：審查銓敘部函陳「約聘人員人事條例」草案一案（暫緩研訂）","url":"https://www.exam.gov.tw/News_Content.aspx?n=3438&s=18010","accessible":false}]},{"name":"聘用人員人事條例草案（第一代，整合五類人員）","year":"2005（民國94年7月28日考試院通過、8月15日函送立法院）","proposer":"考試院","status":"屆期不續審（97年1月第6屆立委任期屆滿；95年12月法制局評估、95年座談、96年12月公聽會後未進入審查）","key_provisions":["7章62條；整合聘用、派用、機要、聘任、約僱五類人員，並擬廢止聘用條例與派用條例","聘用人員與機關間契約屬行政程序法第135條之行政契約，自聘用日起與國家發生公法上契約關係","進用以學經歷為主，依工作性質分研究性、專業性、技術性三類；公開甄選","各機關聘用人員以不超過職員預算員額15%為原則","建立考核機制淘汰不適任者","退職撫卹參酌勞工退休金條例之集中管理、可攜式、月退休金及最低收益保障機制","排除以業務費或工程管理費自行僱用之臨時人員"],"controversies":["法制局：違背國家考試用人精神、影響文官體制健全、恐生政治分贓與用人弊端，質疑制定必要","公聽會：為解決臨時人員問題而創設契約聘用新制，對考試進用之常任公務人員不公平","排除臨時人員恐引發不平與陳情","開南大學委託研究（柯三吉等，2008）認為國家與聘用人員間應為私法契約關係","蘇偉業（2010）批評改革建議過於保守"],"comparison_with_current":"現制五類人員分由法律（聘用條例、派用條例—已廢止）、命令（約僱辦法）與機關組織法規（聘任、機要）規範；草案擬以單一法律統一，並首度給予法定退撫機制。","sources":[{"title":"考試院新聞稿：考試院通過聘用人員人事條例草案","url":"https://www.exam.gov.tw/News_Content.aspx?n=1&s=18713","accessible":false},{"title":"考試院新聞稿：加速推動「聘用人員人事條例草案」完成立法程序","url":"https://www.exam.gov.tw/News_Content.aspx?n=1&s=18963","accessible":false},{"title":"考試院新聞稿：繼續推動聘用人員人事條例草案完成立法，合理保障聘僱人員權益","url":"https://www.exam.gov.tw/News_Content.aspx?n=1&s=19011","accessible":false},{"title":"立法院法制局法案評估：聘用人員人事條例草案（何善為，95年12月，B00493）","url":"https://www.ly.gov.tw/Pages/Detail.aspx?nodeid=6588&pid=83610","accessible":false},{"title":"柯三吉等（開南大學）：考試院擬定之「聘用人員人事條例」草案對現行公務人員體制影響之研究（考試院委託研究，2008）","url":"https://ws.exam.gov.tw/Download.ashx?u=LzAwMS9VcGxvYWQvMS9yZWxmaWxlLzEyMDgyLzI4NDE0LzRjODc3ZjI1LTc3YjYtNDEyZi1iZGYxLWI5N2IwOGE2Y2MxYi5wZGY%3D&n=MDEyMjE3MTU1MzYzLnBkZg%3D%3D","accessible":false},{"title":"蘇偉業〈從地方政府運用約聘僱人員之調查剖析我國契約公務人力之改革〉文官制度季刊2(2)，2010","url":"https://ws.exam.gov.tw/Download.ashx?u=LzAwMS9VcGxvYWQvMS9yZWxmaWxlLzkzMjMvMjE5NDQvOWM5NjcyNzMtMGU0MC00NzJhLThmOWUtYmU2NmQ4MTcwMjA1LnBkZg%3D%3D&n=MDUyODE2MzIyNjcxLnBkZg%3D%3D","accessible":false}]},{"name":"聘任人員人事條例草案","year":"2012（民國101年9月28日銓敘部函送考試院審查）","proposer":"銓敘部","status":"未審（考試院審議中陸續修正，未送立法院；人事總處103年研究質疑單獨立法必要）","key_provisions":["以公務人員基準法草案第5條為法源，定位聘任人員為常務人員","不簽訂契約、不發聘書、無聘期；公開競爭、學經歷及專門著作審查","27條：聘任職務等別與資格、指名商調、解聘不續聘、考核、適用公務人員退撫保險、俸級表由考試院會同行政院定之"],"controversies":["聘任人員屬常務人員卻非考試進用，與憲法考試用人之關係","與聘用人員人事條例合併或分立"],"comparison_with_current":"現行聘任人員依各機關組織法規（研究機構、博物館等）進用，無統一法制；草案將其移出契約用人範圍。","sources":[{"title":"政府機關用人體制之研究－從公法契約用人法制論析（人事總處，103.5.15）","url":"https://www.dgpa.gov.tw/Uploads/public/Attachment/51161738378.pdf","accessible":true}]},{"name":"聘用人員人事條例草案（第二代，整合聘用及約僱）","year":"2013（民國102年5月17日銓敘部函送考試院）","proposer":"銓敘部","status":"未審（考試院審議未定案；106年調整為「契約人員人事條例草案」）","key_provisions":["41條；以現行聘用及約僱人員為適用對象，維持「聘用人員」名稱（現行法令含「聘用」文字者134種）","進用比率不逾職員預算總人數10%，由主管機關總量調控","與機關間為公法上契約關係，不適用勞基法","聘用一等至五等（一等最高），以學歷配合工作經驗為資格","公開甄選原則；主管機關每5年檢討業務計畫存廢以避免久任","年度工作考核作為續聘準據","參加勞工保險、退休準用勞工退休金條例；原離職儲金處理","現職聘用、約僱人員改依本條例繼續聘用"],"controversies":["人事總處研究：公法契約似為私法契約外之「第四種法制」，建議整併納入勞動法制或聘任制度","聘僱改適用勞基法將使定期契約變不定期，與制度目的衝突且財政負擔增加"],"comparison_with_current":"與現制差異：約僱首次取得法律依據；比例上限法定化；保障借用勞保勞退；明定久任檢討機制。","sources":[{"title":"政府機關用人體制之研究－從公法契約用人法制論析（人事總處，103.5.15）","url":"https://www.dgpa.gov.tw/Uploads/public/Attachment/51161738378.pdf","accessible":true},{"title":"新北市政府人事處108年度自行研究報告：我國聘僱人員人事法制之研究","url":"https://www.rde.ntpc.gov.tw/userfiles/1160700/files/16我國聘僱人員人事法制之研究.pdf","accessible":false}]},{"name":"契約人員人事條例草案（考試院版／立委林岱樺等17人版）","year":"2017（民國106年4月20日考試院審議；106年10月27日立委提案，第9屆第4會期）","proposer":"考試院（銓敘部）／立法委員林岱樺等17人","status":"屆期不續審（109年1月第9屆屆滿）；考試院版因銓敘部與人事總處對適用範圍歧見而延宕","key_provisions":["界定契約人員範圍納入現行約聘僱人員","等別：聘用六等至十三等（十三等最高）、約僱一等至五等","契約人員與國家間為公法上契約關係","進用程序、契約與績效結合、考核、薪給、保險、退職撫卹及過渡條款","參照經濟社會文化權利國際公約第7條平等權意旨"],"controversies":["銓敘部與人事總處對適用範圍看法不同","缺乏行政部門共同推動"],"comparison_with_current":"等別設計由第二代草案的五等擴張為十三等，試圖容納實務上高階聘用人員。","sources":[{"title":"新北市政府人事處108年度自行研究報告：我國聘僱人員人事法制之研究","url":"https://www.rde.ntpc.gov.tw/userfiles/1160700/files/16我國聘僱人員人事法制之研究.pdf","accessible":false},{"title":"法源法律網：「契約人員人事條例」草案（林岱樺等17人提案，2017-10-26）","url":"https://www.lawbank.com.tw/news/NewsContent_print.aspx?NID=147434.00","accessible":false}]},{"name":"聘約人員人事條例草案","year":"2020（民國109年6月人事總處徵詢各機關意見，6月19日截止）","proposer":"行政院人事行政總處（人事長施能傑）","status":"撤回／停擺（未定稿、未送行政院會，人事總處稱「沒有時間表」；其後未再推動）","key_provisions":["整合聘用與約僱為「聘約人員」，與政府為公法契約關係，不適用勞基法但參加勞保、勞退","聘約人員列為機關預算員額，受員額管控與立法院預算監督","契約等別一等至五等（五等最高，須博士學位、相關年資及研究成果）","各機關設甄審考核委員會辦理公開甄選、續約及提前終止審議；利益迴避；服務行為規範","第4條：三等以上聘約人員進用滿3年，得擔任或兼任特定非公權力領域（研究、文化館所、科技專業）機關有職稱職務","薪級表草案；工作考核、續約、終止聘約規範"],"controversies":["國民黨團：開後門、熬3年成公務員、破壞文官體制、酬庸（口譯哥、學姊）","全國公務人員協會、林清汶：侵犯考試院人事法制權、進用與薪資超越公務人員體制","法制局R01065：聘用主管機關銓敘部、約僱主管機關人事總處，草案通過後與聘用條例適用界線及限縮考試權疑義，可能排擠考試進用人員","社工團體：仍不適用勞基法、救濟空間受限、未解決權利保障不足","人事總處澄清：不取得公務員身分、不影響升遷、不擴及一般行政機關、非行政考試兩院爭權"],"comparison_with_current":"最大差異在突破聘用條例第7條「不得兼任有職等之職務」禁令，並由行政院取代考試院主導立法；保障內容與考試院第二代草案相近（公法契約＋勞保勞退）。","sources":[{"title":"【澄清稿】媒體報導「聘約人員 "legal_basis":"政府採購法、民法承攬章；承攬廠商適用勞基法"}],"verification_note":"每格 basis 欄引用之條號為草擬時依記憶填寫，需與 data/laws.json 全文核對後把 verified 改為 true；已核對者會在畫面顯示 ✓。"},"dimensions":[{"key":"entry","group":"進用","name":"進用方式與資格","cells":{"civil":{"text":"依公務人員任用法，須經國家考試及格或其他法定資格，經銓敘部銓敘審定。","basis":"公務人員任用法§9、§24","verified":false},"pinyong":{"text":"應業務需要，以契約定期聘用之專業或技術人員；須報人事總處（原行政院）核定，並送銓敘部登記備查。不得擔任主管職務。","basis":"聘用條例§2、§3、§6、§7","verified":false},"yuegu":{"text":"機關學校應業務需要，定期僱用擔任相當分類職位公務人員第五職等以下之臨時性工作；不得擔任主管及正式職務。","basis":"約僱辦法§2、§3、§4","verified":false},"linshi":{"text":"機關以年度預算（或計畫經費）進用，依臨時人員要點公開甄選；各地方政府依自訂要點進用，部分縣市設總量管制。","basis":"臨時人員進用及運用要點§3～§5；各縣市約用人員管理要點","verified":false},"contract":{"text":"機關依政府採購法辦理勞務採購，由得標廠商提供人力完成工作；機關不直接進用人員，不得對廠商人員為指揮監督（否則有假承攬真僱傭疑慮）。","basis":"政府採購法§2、§7；民法§490","verified":false}}},{"key":"term","group":"進用","name":"契約期間與續約","cells":{"civil":{"text":"無任期，經任用即具永業性身分，非依法不得免職。","basis":"公務人員保障法§9","verified":false},"pinyong":{"text":"以契約定期聘用，期滿得續聘；聘期配合計畫或預算年度，一般一年一聘。","basis":"聘用條例§3、§5；施行細則","verified":false},"yuegu":{"text":"僱用期間依業務需要定之，最長不得超過一年；期滿得續僱。","basis":"約僱辦法§5","verified":false},"linshi":{"text":"原則以一年為限，得續約；依勞基法§9 定期契約規定，連續性工作應為不定期契約（實務多以年度預算定期）。","basis":"臨時人員要點；勞基法§9","verified":false},"contract":{"text":"依採購契約期間（通常一至三年），期滿重新招標；人員與廠商間契約依勞基法。","basis":"政府採購法§52、§63","verified":false}}},{"key":"headcount","group":"進用","name":"員額管制","cells":{"civil":{"text":"中央：總員額法第一類員額（政務人員、定有職稱官等職等之文職人員、醫事人員及聘任人員）上限 74,600 人內；地方：地方行政機關組織準則、各地方員額設置基準。","basis":"中央政府機關總員額法§3、§4（108.12.31 修正）；地方行政機關組織準則","verified":true},"pinyong":{"text":"中央：總員額法第二類員額（依法令進用之聘僱人員、駐衛警察及工友）上限 40,100 人內，列入機關預算員額；司法院、檢察機關之聘僱人員分屬第三、四類。地方：依地方制度相關規定與預算。","basis":"總員額法§3 第 2 款、§4；員額管理辦法§12","verified":true},"yuegu":{"text":"同聘用，屬總員額法第二類員額（聘僱人員）。","basis":"總員額法§3 第 2 款","verified":true},"linshi":{"text":"不屬總員額法§3 任一類員額（非「依法令進用之聘僱人員」）；以業務費等預算進用，人事總處另以約用人員要點與人力運用統計管控；部分縣市設占預算員額比例上限。","basis":"總員額法§3（未列入）；約用人員進用及運用要點","verified":true},"contract":{"text":"不計入員額，僅受採購預算限制。","basis":"—","verified":false}}},{"key":"pay","group":"待遇","name":"待遇／報酬制度","cells":{"civil":{"text":"依公務人員俸給法支本俸、加給（職務、技術或專業、地域）。","basis":"公務人員俸給法§3、§5","verified":false},"pinyong":{"text":"依「聘用人員比照分類職位公務人員俸點支給報酬標準表」以薪點折算，按月支給，原則不得支給加給（另有專業加給比照）。","basis":"聘用條例§6；報酬標準表","verified":false},"yuegu":{"text":"依「約僱人員僱用辦法」比照相當職等薪點支給，第五職等以下。","basis":"約僱辦法§6","verified":false},"linshi":{"text":"依機關自訂薪資標準（多比照約僱薪點或依學歷分級），不得低於勞基法基本工資。","basis":"臨時人員要點；勞基法§21","verified":false},"contract":{"text":"由廠商決定，採購契約得約定最低薪資或人力規格；機關不直接給付。","basis":"採購契約","verified":false}}},{"key":"bonus","group":"待遇","name":"年終工作獎金／考績獎金","cells":{"civil":{"text":"年終工作獎金 1.5 個月；考績獎金依考績等第（甲等 1 個月、乙等 0.5 個月）。","basis":"軍公教人員年終工作獎金發給注意事項；考績法§7","verified":false},"pinyong":{"text":"年終工作獎金比照支給；考核獎金依「聘用人員考核」規定（甲等 1 個月薪酬）。","basis":"年終工作獎金注意事項；聘僱人員考核規定","verified":false},"yuegu":{"text":"同聘用。","basis":"同左","verified":false},"linshi":{"text":"年終獎金依機關預算與要點（多比照 1.5 個月）；無考績獎金，部分機關有考核獎勵。","basis":"臨時人員要點；各機關規定","verified":false},"contract":{"text":"依廠商與勞工約定；機關不給付。","basis":"—","verified":false}}},{"key":"appraisal","group":"考核","name":"考績／考核","cells":{"civil":{"text":"公務人員考績法：年終考績、另予考績、專案考績；丁等免職。","basis":"公務人員考績法§3～§12","verified":false},"pinyong":{"text":"依「行政院及所屬各機關聘僱人員考核辦法」（或機關自訂）辦理年終考核，分甲乙丙等，丙等不續聘。","basis":"聘用條例施行細則；聘僱人員考核規定","verified":false},"yuegu":{"text":"同聘用。","basis":"同左","verified":false},"linshi":{"text":"依機關考核規定；表現不佳依勞基法§11、§12 終止契約。","basis":"臨時人員要點；勞基法§11、§12","verified":false},"contract":{"text":"機關考核廠商履約（驗收、違約金），不考核個人。","basis":"政府採購法§70-1、採購契約","verified":false}}},{"key":"leave","group":"待遇","name":"休假制度","cells":{"civil":{"text":"公務人員請假規則：事假、病假、婚假、娩假、休假（年資 1 年 7 日起至 30 日）。","basis":"公務人員請假規則§3、§7","verified":false},"pinyong":{"text":"準用公務人員請假規則（休假日數依年資比照）。","basis":"公務人員請假規則§19","verified":false},"yuegu":{"text":"同聘用（準用請假規則）。","basis":"請假規則§19","verified":false},"linshi":{"text":"依勞基法特別休假（6 個月 3 日、1 年 7 日…）及性別工作平等法假別；機關得優於法定。","basis":"勞基法§38；勞工請假規則","verified":false},"contract":{"text":"依勞基法，由廠商給假。","basis":"勞基法§38","verified":false}}},{"key":"insurance","group":"保險","name":"保險","cells":{"civil":{"text":"公教人員保險（公保）＋全民健保。","basis":"公教人員保險法§2","verified":false},"pinyong":{"text":"公保（聘用人員為公保被保險人）＋健保。","basis":"公教人員保險法§2、施行細則","verified":false},"yuegu":{"text":"公保（約僱人員 88 年起納入公保）＋健保。","basis":"公教人員保險法§2","verified":false},"linshi":{"text":"勞工保險＋就業保險＋健保；機關負擔雇主保費。","basis":"勞工保險條例§6；就業保險法§5","verified":false},"contract":{"text":"勞保、就保、健保由廠商投保。","basis":"勞工保險條例§6","verified":false}}},{"key":"retirement","group":"退休","name":"退休／離職給與","cells":{"civil":{"text":"公務人員退休資遣撫卹法：退撫基金共同提撥，月退休金或一次退休金。","basis":"公務人員退休資遣撫卹法","verified":false},"pinyong":{"text":"不適用退撫法；依「各機關學校聘僱人員離職儲金給與辦法」，機關與個人各提撥薪酬 6%（原 5%），離職時一次給付；另公保養老給付。","basis":"離職儲金給與辦法§3～§6","verified":false},"yuegu":{"text":"同聘用（離職儲金）。","basis":"離職儲金給與辦法","verified":false},"linshi":{"text":"勞工退休金條例（新制）：雇主提繳 6% 至個人專戶；具舊制年資者依勞基法§53～§55。","basis":"勞工退休金條例§6、§14","verified":false},"contract":{"text":"由廠商依勞退條例提繳。","basis":"勞工退休金條例§6","verified":false}}},{"key":"compensation","group":"退休","name":"撫卹／職災／資遣","cells":{"civil":{"text":"退撫法撫卹金、資遣給與；公務人員執行職務意外傷亡慰問金。","basis":"退撫法；慰問金發給辦法","verified":false},"pinyong":{"text":"公保死亡給付、殘廢給付；離職儲金；無撫卹金。","basis":"公教人員保險法","verified":false},"yuegu":{"text":"同聘用。","basis":"同左","verified":false},"linshi":{"text":"勞基法職災補償（§59）、資遣費（§17 或勞退條例§12）；勞保職災給付。","basis":"勞基法§17、§59；勞工職業災害保險及保護法","verified":false},"contract":{"text":"由廠商負責；機關依民法§189 原則不負責任，但有定作或指示過失者除外。","basis":"民法§189","verified":false}}},{"key":"service_act","group":"義務","name":"公務員服務法（兼職、旋轉門、保密）","cells":{"civil":{"text":"適用。","basis":"公務員服務法§2","verified":false},"pinyong":{"text":"適用（受有俸給之文武職公務員，聘用人員經解釋納入）；旋轉門條款於主管職務不適用因不得任主管。","basis":"公務員服務法§2、§24；銓敘部函釋","verified":false},"yuegu":{"text":"適用（同聘用）。","basis":"公務員服務法§2、§24","verified":false},"linshi":{"text":"不適用公務員服務法；但刑法公務員、貪污治罪條例依「依法令從事公務」個案認定；機關多於契約約定保密與兼職限制。","basis":"公務員服務法§2 反面；刑法§10","verified":false},"contract":{"text":"不適用；契約約定保密義務。","basis":"—","verified":false}}},{"key":"neutrality", const $ = s => document.querySelector(s);
const el = (t, a={}, ...k) => { const e=document.createElement(t); for(const [x,y] of Object.entries(a)){ if(x==='class')e.className=y; else if(x==='html')e.innerHTML=y; else if(x.startsWith('on'))e.addEventListener(x.slice(2),y); else e.setAttribute(x,y);} for(const c of k.flat()){ if(c==null)continue; e.append(c.nodeType?c:document.createTextNode(String(c))); } return e; };
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SERIES = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
$('#built').textContent = DATA ? `資料建檔日 ${DATA.built}` : '';
if (!DATA) document.body.innerHTML = '<p class="empty">尚未建檔：請執行 python3 build.py</p>';

/* ---------- 分頁 ---------- */
const tabs = [...document.querySelectorAll('#nav button')];
function showTab(name){ tabs.forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===name)); document.querySelectorAll('main > section').forEach(s=>s.hidden = s.id!=='tab-'+name); try{localStorage.setItem('cm.tab',name);}catch(e){} if(name==='headcount') drawChart(); }
tabs.forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
let initTab='laws'; try{ initTab = localStorage.getItem('cm.tab')||'laws'; }catch(e){}

/* ---------- 工具 ---------- */
function highlight(text, kws){ let h=esc(text); for(const k of kws){ if(!k)continue; h=h.replace(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'), m=>`<mark>${m}</mark>`);} return h; }
function fillSelect(sel, values, keep){ const cur=sel.value; [...sel.options].slice(1).forEach(o=>o.remove()); [...new Set(values.filter(Boolean))].sort().forEach(v=>sel.append(el('option',{value:v},v))); if(keep) sel.value=cur; }
function fmt(n){ const x=Number(String(n).replace(/,/g,'')); return isNaN(x)?String(n??''):x.toLocaleString('zh-Hant-TW'); }

/* ---------- 法規 ---------- */
const laws = Array.isArray(DATA&&DATA.laws)?DATA.laws:[];
fillSelect($('#lawtag'), laws.flatMap(l=>l.tags||[]));
fillSelect($('#lawlevel'), laws.map(l=>l.level));
function renderLaws(){
  const kws=$('#lawq').value.trim().split(/\s+/).filter(Boolean), tag=$('#lawtag').value, level=$('#lawlevel').value;
  const box=$('#lawlist'); box.innerHTML='';
  let n=0;
  for(const l of laws){
    if(tag && !(l.tags||[]).includes(tag)) continue;
    if(level && l.level!==level) continue;
    const arts=l.articles||[];
    const full=l.name+' '+arts.map(a=>(a.no||'')+' '+(a.text||'')).join('\n');
    if(kws.length && !kws.every(k=>full.includes(k))) continue;
    n++;
    const hit = kws.length ? arts.filter(a=>kws.some(k=>((a.no||'')+(a.text||'')).includes(k))) : [];
    const card=el('div',{class:'card'});
    card.append(el('h3',{html:highlight(l.name,kws)}));
    card.append(el('div',{class:'sub'}, [l.level, l.authority, l.modified_date?`最近異動 ${l.modified_date}`:null].filter(Boolean).join('　')));
    card.append(el('div',{}, (l.tags||[]).map(t=>el('span',{class:'tag'},t))));
    if(l.note) card.append(el('p',{class:'note'},l.note));
    if(hit.length){ const d=el('article',{class:'law'}); hit.slice(0,12).forEach(a=>d.append(el('div',{class:'art',html:`<b>${esc(a.no||'')}</b> ${highlight(a.text,kws)}`}))); if(hit.length>12)d.append(el('p',{class:'note'},`…另有 ${hit.length-12} 條符合`)); card.append(el('div',{class:'note'},`符合條文 ${hit.length} 條：`), d); }
    const det=el('details'); det.append(el('summary',{},`全文（${arts.length} 條）、沿革、來源`));
    const body=el('div');
    if(l.history&&l.history.length){ body.append(el('p',{},el('b',{},'沿革：')), el('ul',{}, (Array.isArray(l.history)?l.history:[l.history]).map(h=>el('li',{}, typeof h==='string'?h:`${h.date||''} ${h.summary||h.text||''}`)))); }
    if(l.url) body.append(el('p',{class:'src',html:`來源：<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url)}</a>`}));
    const art=el('article',{class:'law'}); arts.forEach(a=>art.append(el('div',{class:'art',html:`<b>${esc(a.no||'')}</b> ${highlight(a.text,kws)}`}))); body.append(art);
    det.append(body); card.append(det); box.append(card);
  }
  $('#lawcount').textContent=`${n} / ${laws.length} 部`;
  if(!n) box.append(el('p',{class:'empty'},laws.length?'沒有符合的法規':'尚無法規資料（data/laws.json）'));
}
['#lawq','#lawtag','#lawlevel'].forEach(s=>$(s).addEventListener('input',renderLaws));

/* ---------- 沿革與草案 ---------- */
const tl=(Array.isArray(DATA&&DATA.timeline)?DATA.timeline:[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
fillSelect($('#tlactor'), tl.map(e=>e.actor)); fillSelect($('#tlcat'), tl.map(e=>e.category));
function renderTimeline(){
  const q=$('#tlq').value.trim(), actor=$('#tlactor').value, cat=$('#tlcat').value; const box=$('#tllist'); box.innerHTML=''; let n=0;
  for(const e of tl){
    if(actor&&e.actor!==actor)continue; if(cat&&e.category!==cat)continue;
    if(q && !(e.event+' '+(e.summary||'')+' '+(e.significance||'')).includes(q))continue; n++;
    const d=el('div',{class:'tl'});
    d.append(el('div',{class:'date'},`${e.date}${e.roc_year?`（民國 ${e.roc_year} 年）`:''}`));
    d.append(el('div',{},el('b',{},e.event)), el('div',{class:'actor'},[e.actor,e.category,(e.personnel_types||[]).join('、')].filter(Boolean).join('　·　')));
    if(e.summary)d.append(el('div',{},e.summary));
    if(e.significance)d.append(el('div',{class:'note'},'制度論觀點：'+e.significance));
    if(e.sources&&e.sources.length)d.append(el('div',{class:'src note',html:'來源：'+e.sources.map(s=>s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a>${s.accessible===false?'（本環境未能取得全文）':''}`:esc(s.title||'')).join('；')}));
    box.append(d);
  }
  $('#tlcount').textContent=`${n} / ${tl.length} 件`;
  if(!n)box.append(el('p',{class:'empty'},tl.length?'沒有符合的事件':'尚無沿革資料（data/timeline.json）'));
}
['#tlq','#tlactor','#tlcat'].forEach(s=>$(s).addEventListener('input',renderTimeline));
function renderDrafts(){
  const box=$('#drafts'); box.innerHTML=''; const ds=Array.isArray(DATA&&DATA.drafts)?DATA.drafts:[];
  box.append(el('h3',{},`歷次專法草案（${ds.length}）`));
  if(!ds.length){box.append(el('p',{class:'empty'},'尚無草案資料（data/drafts.json）'));return;}
  for(const d of ds){
    const c=el('div',{class:'card'});

    const det=el('details'); det.append(el('summary',{},'條文要點、爭議、與現制差異'));

    if(d.sources&&d.sources.length)det.append(el('div',{class:'src note',html:'來源：'+d.sources.map(s=>s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a>`:esc(s.title||s)).join('；')}));

/* ---------- 權益對照 ---------- */
const cmp=(DATA&&DATA.comparison)||{meta:{personnel_types:[]},dimensions:[]};
const cmpGroups=[...new Set(cmp.dimensions.map(d=>d.group))]; let cmpSel=new Set(cmpGroups);
function renderCmp(){
  const gb=$('#cmpgroups'); gb.innerHTML='';
  cmpGroups.forEach(g=>gb.append(el('button',{class:'chip','aria-pressed':cmpSel.has(g),onclick:()=>{cmpSel.has(g)?cmpSel.delete(g):cmpSel.add(g);renderCmp();}},g)));
  const types=cmp.meta.personnel_types||[]; const t=$('#cmptable'); t.innerHTML='';
  const thead=el('thead'); const tr=el('tr'); tr.append(el('th',{},'項目')); types.forEach(p=>tr.append(el('th',{},p.name,el('div',{class:'note'},p.nature||'')))); thead.append(tr); t.append(thead);
  const tb=el('tbody');
  for(const d of cmp.dimensions){ if(!cmpSel.has(d.group))continue; const r=el('tr'); r.append(el('td',{},d.name,el('div',{class:'note'},d.group)));
    types.forEach(p=>{const c=(d.cells||{})[p.key]||{}; r.append(el('td',{},c.text||'—',el('span',{class:'b'},(c.basis||'')+(c.verified?' ✓':''))));}); tb.append(r); }
  t.append(tb);
  const v=cmp.dimensions.flatMap(d=>Object.values(d.cells||{})); const ok=v.filter(c=>c.verified).length;
  $('#cmpnote').textContent=cmp.dimensions.length?`${cmp.dimensions.length} 項 × ${types.length} 類；法源已核對 ${ok}/${v.length} 格（✓）`:'尚無對照資料';
}

/* ---------- 員額趨勢 ---------- */
const hc=Array.isArray(DATA&&DATA.headcount)?DATA.headcount:[];
const hcCatSel=new Set();
function hcOptions(){
  const scopes=[...new Set(hc.map(r=>r.scope))].filter(Boolean).sort();
  const s=$('#hcscope'); s.innerHTML=''; scopes.forEach(v=>s.append(el('option',{value:v},v))); if(!scopes.length)s.append(el('option',{value:''},'（無資料）'));
  hcGroupOptions();
}
function hcGroupOptions(){
  const scope=$('#hcscope').value; const g=$('#hcgroup'); const cur=g.value; g.innerHTML='';
  const groups=[...new Set(hc.filter(r=>r.scope===scope).map(r=>r.agency_group))].filter(Boolean).sort((a,b)=>(a==='全體'?-1:b==='全體'?1:a.localeCompare(b)));
  groups.forEach(v=>g.append(el('option',{value:v},v))); if(groups.includes(cur))g.value=cur;
  const m=$('#hcmeasure'); const curm=m.value; m.innerHTML='';
  [...new Set(hc.filter(r=>r.scope===scope&&r.agency_group===g.value).map(r=>r.measure))].filter(Boolean).forEach(v=>m.append(el('option',{value:v},v))); if([...m.options].some(o=>o.value===curm))m.value=curm;
  hcCatChips();
}
function hcCatChips(){
  const scope=$('#hcscope').value, group=$('#hcgroup').value, meas=$('#hcmeasure').value;
  const cats=[...new Set(hc.filter(r=>r.scope===scope&&r.agency_group===group&&r.measure===meas).map(r=>r.category))].filter(Boolean);
  const box=$('#hccats'); box.innerHTML='';
  for(const c of [...hcCatSel]) if(!cats.includes(c)) hcCatSel.delete(c);
  if(!hcCatSel.size) cats.slice(0,4).forEach(c=>hcCatSel.add(c));
  cats.forEach((c,i)=>box.append(el('button',{class:'chip','aria-pressed':hcCatSel.has(c),onclick:()=>{hcCatSel.has(c)?hcCatSel.delete(c):(hcCatSel.size<8&&hcCatSel.add(c));hcCatChips();}},el('i',{class:'sw',style:`background:${css(SERIES[cats.indexOf(c)%8])}`}),c)));
  drawChart();
}
$('#hcscope').onchange=hcGroupOptions; $('#hcgroup').onchange=()=>{hcGroupOptions();}; $('#hcmeasure').onchange=hcCatChips;
function drawChart(){
  const svg=$('#hcsvg'); if(!svg||svg.closest('section').hidden)return; svg.innerHTML='';
  const scope=$('#hcscope').value, group=$('#hcgroup').value, meas=$('#hcmeasure').value;
  const rows=hc.filter(r=>r.scope===scope&&r.agency_group===group&&r.measure===meas&&hcCatSel.has(r.category));
  const allCats=[...new Set(hc.filter(r=>r.scope===scope&&r.agency_group===group&&r.measure===meas).map(r=>r.category))];
  const cats=allCats.filter(c=>hcCatSel.has(c));
  $('#hctitle').textContent=`${scope||''}${group&&group!=='全體'?'・'+group:''}　各類人員${meas||'人數'}`;
  $('#hcsub').textContent=rows.length?`民國 ${Math.min(...rows.map(r=>r.year))}～${Math.max(...rows.map(r=>r.year))} 年；資料來源見下方資料表`:'';
  const lg=$('#hclegend'); lg.innerHTML=''; if(cats.length>1)cats.forEach(c=>lg.append(el('span',{style:`color:${css(SERIES[allCats.indexOf(c)%8])}`},el('i'),el('span',{style:'color:var(--ink2)'},c))));
  renderHcTable(rows);
  if(!rows.length){ svg.innerHTML=`<text x="50%" y="50%" text-anchor="middle" fill="${css('--muted')}">尚無資料（data/headcount.csv）</text>`; return; }
  const W=svg.clientWidth||900,H=340,m={t:16,r:24,b:36,l:64}; svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const years=[...new Set(rows.map(r=>r.year))].sort((a,b)=>a-b); const ymax=Math.max(...rows.map(r=>r.value))*1.08||1;
  const x=y=>m.l+(years.length>1?(years.indexOf(y)/(years.length-1)):0.5)*(W-m.l-m.r), yy=v=>m.t+(1-v/ymax)*(H-m.t-m.b);
  const ns='http://www.w3.org/2000/svg', S=(t,a)=>{const e=document.createElementNS(ns,t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e;};
  const ticks=5; for(let i=0;i<=ticks;i++){const v=ymax/ticks*i; svg.append(S('line',{x1:m.l,x2:W-m.r,y1:yy(v),y2:yy(v),stroke:css('--grid'),'stroke-width':1})); const t=S('text',{x:m.l-8,y:yy(v)+4,'text-anchor':'end',fill:css('--muted'),'font-size':11}); t.textContent=v>=10000?(v/10000).toFixed(1)+'萬':Math.round(v).toLocaleString(); svg.append(t);}
  svg.append(S('line',{x1:m.l,x2:W-m.r,y1:yy(0),y2:yy(0),stroke:css('--axis')}));
  const step=Math.ceil(years.length/12); years.forEach((y,i)=>{ if(i%step&&i!==years.length-1)return; const t=S('text',{x:x(y),y:H-m.b+18,'text-anchor':'middle',fill:css('--muted'),'font-size':11}); t.textContent=y; svg.append(t); });
  const series=cats.map(c=>({name:c,color:css(SERIES[allCats.indexOf(c)%8]),pts:years.map(y=>{const r=rows.find(r=>r.category===c&&r.year===y);return r?{y,v:r.value,r}:null;})}));
  for(const s of series){ const seg=[]; let cur=[]; s.pts.forEach(p=>{ if(p)cur.push(p); else if(cur.length){seg.push(cur);cur=[];} }); if(cur.length)seg.push(cur);
    seg.forEach(sg=>svg.append(S('path',{d:sg.map((p,i)=>(i?'L':'M')+x(p.y)+','+yy(p.v)).join(' '),fill:'none',stroke:s.color,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'})));
    s.pts.filter(Boolean).forEach(p=>svg.append(S('circle',{cx:x(p.y),cy:yy(p.v),r:4,fill:s.color,stroke:css('--surface'),'stroke-width':2})));
    const last=[...s.pts].reverse().find(Boolean); if(last&&cats.length<=4){const t=S('text',{x:x(last.y)+8,y:yy(last.v)+4,fill:css('--ink2'),'font-size':11});t.textContent=fmt(last.v);svg.append(t);}
  }
  const cross=S('line',{y1:m.t,y2:H-m.b,stroke:css('--axis'),'stroke-width':1,visibility:'hidden'}); svg.append(cross);
  const tip=$('#hctip');
  svg.onpointermove=e=>{ const rect=svg.getBoundingClientRect(); const px=(e.clientX-rect.left)*W/rect.width; let best=years[0],bd=1e9; years.forEach(y=>{const d=Math.abs(x(y)-px);if(d<bd){bd=d;best=y;}}); cross.setAttribute('x1',x(best));cross.setAttribute('x2',x(best));cross.setAttribute('visibility','visible');
    tip.innerHTML=''; tip.append(el('div',{},el('b',{},`民國 ${best} 年`))); series.forEach(s=>{const p=s.pts.find(p=>p&&p.y===best); tip.append(el('div',{},el('span',{class:'k',style:`background:${s.color}`}),el('b',{},p?fmt(p.v):'—'),el('span',{style:'color:var(--ink2)'},' '+s.name)));});
    tip.style.display='block'; const cr=svg.closest('.chartcard').getBoundingClientRect(); let lx=e.clientX-cr.left+12; if(lx+tip.offsetWidth>cr.width-8)lx=e.clientX-cr.left-tip.offsetWidth-12; tip.style.left=lx+'px'; tip.style.top=(e.clientY-cr.top-10)+'px'; };
  svg.onpointerleave=()=>{tip.style.display='none';cross.setAttribute('visibility','hidden');};
}
function renderHcTable(rows){
  const t=$('#hctable'); t.innerHTML=''; if(!rows.length)return;
  t.append(el('thead',{},el('tr',{},['民國年','類別','數值','單位','來源','備註'].map((h,i)=>el('th',{class:i===2?'num':''},h)))));
  const tb=el('tbody'); rows.slice().sort((a,b)=>a.year-b.year||a.category.localeCompare(b.category)).forEach(r=>tb.append(el('tr',{},el('td',{},r.year),el('td',{},r.category),el('td',{class:'num'},fmt(r.value)),el('td',{},r.unit||'人'),el('td',{class:'src',html:r.source_url?`<a href="${esc(r.source_url)}" target="_blank" rel="noopener">${esc(r.source_name||r.source_url)}</a>`:esc(r.source_name||'')}),el('td',{},r.note||'')))); t.append(tb);
}
window.addEventListener('resize',()=>drawChart());

/* ---------- 地方樣態 ---------- */
const lg=Array.isArray(DATA&&DATA.local_gov)?DATA.local_gov:[];
const yes=v=>v&&/^(有|是|true)/.test(String(typeof v==='object'?v.status||v.exists||'':v));
function renderLocal(){
  const q=$('#lgq').value.trim(), f=$('#lgfilter').value; const t=$('#lgtable'); t.innerHTML=''; const cards=$('#lgcards'); cards.innerHTML=''; let n=0;
  t.append(el('thead',{},el('tr',{},['縣市','契約人力類型','隨首長進退','適用勞基法','總量管制','核心／公權力限制','規定數'].map(h=>el('th',{},h)))));
  const tb=el('tbody');
  for(const g of lg){
    const blob=JSON.stringify(g); if(q&&!blob.includes(q))continue;
    const pol=g.political_appointee_clause, lsa=g.labor_standards_act;
    if(f==='political'&&!yes(pol))continue; if(f==='caps'&&!(g.caps_or_limits&&g.caps_or_limits!=='不明'&&g.caps_or_limits!=='無'))continue; if(f==='core'&&!(g.core_noncore_rule&&g.core_noncore_rule!=='不明'&&g.core_noncore_rule!=='無'))continue; if(f==='lsa'&&!yes(lsa))continue; n++;
    const txt=v=>v==null?'—':typeof v==='object'?(v.status||v.exists||'')+(v.content?'：'+v.content:''):String(v);
    tb.append(el('tr',{},el('td',{},g.name),el('td',{},(g.contract_types||[]).join('、')),el('td',{class:yes(pol)?'ok':''},txt(pol)),el('td',{},txt(lsa)),el('td',{},txt(g.caps_or_limits)),el('td',{},txt(g.core_noncore_rule)),el('td',{class:'num'},(g.regulations||[]).length)));
    const c=el('div',{class:'card'}); c.append(el('h3',{},`${g.name}（${g.type||''}）`));
    if(g.salary_scheme)c.append(el('p',{},el('b',{},'薪資制度：'),txt(g.salary_scheme)));
    if(g.notable_practices)c.append(el('p',{},el('b',{},'特殊作法：'),Array.isArray(g.notable_practices)?g.notable_practices.join('；'):txt(g.notable_practices)));
    if(g.headcount&&g.headcount.length)c.append(el('p',{},el('b',{},'人數：'),g.headcount.map(h=>`${h.year} ${h.category} ${fmt(h.value)}（${h.source||''}）`).join('；')));
    if(g.regulations&&g.regulations.length){const d=el('details');d.append(el('summary',{},`規定 ${g.regulations.length} 件`));d.append(el('ul',{},g.regulations.map(r=>{const link=r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:esc(r.title); const yr=r.year?'（'+esc(r.year)+'）':''; const acc=r.accessible; const na=(acc===true||acc==='true'||acc==='accessible')?'':`<span class="na">　${acc==='listing'?'僅見目錄名稱':'全文未取得（網域受限）'}</span>`; const sm=r.summary?'<br>'+esc(r.summary):''; return el('li',{class:'src',html:link+yr+na+sm});}))); c.append(d);}
    cards.append(c);
  }
  t.append(tb); $('#lgcount').textContent=`${n} / ${lg.length} 縣市`;
  if(!lg.length)cards.append(el('p',{class:'empty'},'尚無地方資料（data/local_gov.json）'));
}
['#lgq','#lgfilter'].forEach(s=>$(s).addEventListener('input',renderLocal));

/* ---------- 啟動 ---------- */
if(DATA){ renderLaws(); renderTimeline(); renderDrafts(); renderCmp(); hcOptions(); renderLocal(); showTab(initTab); }
</script>
