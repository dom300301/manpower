或委任時釋明之。\n第一項規定，於下列各款事件不適用之：\n一、聲請訴訟救助及其抗告。\n二、聲請選任律師為訴訟代理人。\n三、聲請核定律師酬金。\n原告、上訴人、聲請人或抗告人未依第一項至第四項規定委任訴訟代理人，或雖依第四項規定委任，行政法院認為不適當者，應先定期間命補正。逾期未補正，亦未依第四十九條之三為聲請者，應以裁定駁回之。\n被告、被上訴人、相對人或依第四十一條及第四十二條參加訴訟之人未依第一項至第四項規定委任訴訟代理人，或雖依第四項規定委任，本案之行政法院認為不適當者，審判長得先定期間命補正。\n當事人依前二項規定補正者，其訴訟行為經訴訟代理人追認，溯及於行為時發生效力；逾期補正者，自追認時起發生效力。","title":"第 五 節 訴訟代理人及輔佐人"},{"no":"第49-2條","text":"前條第一項事件，訴訟代理人得偕同當事人於期日到場，經審判長許可後，當事人得以言詞為陳述。\n前項情形，當事人得依法自為下列訴訟行為：\n一、自認。\n二、成立和解或調解。\n三、撤回起訴或聲請。\n四、撤回上訴或抗告。","title":"第 五 節 訴訟代理人及輔佐人"},{"no":"第49-3條","text":"第四十九條之一第一項事件，當事人無資力委任訴訟代理人者，得依訴訟救助之規定，聲請行政法院為其選任律師為訴訟代理人。\n當事人提起上訴或抗告依前項規定聲請者，原行政法院應將訴訟卷宗送交上級審行政法院。\n第一項選任律師為訴訟代理人之辦法，由司法院參酌法務部及全國律師聯合會等意見定之。","title":"第 五 節 訴訟代理人及輔佐人"},{"no":"第50條","text":"訴訟代理人應於最初為訴訟行為時提出委任書。但由當事人以言詞委任經行政法院書記官記明筆錄者，不在此限。","title":"第 五 節 訴訟代理人及輔佐人"},{"no":"第51條","text":"訴訟代理人就其受委任之事件，有為一切訴訟行為之權。但捨棄、認諾、撤回、和解、提起反訴、上訴或再審之訴及選任代理人，非受特別委任不得為之。\n關於強制執行之行為或領取所爭物，準用前項但書之規定。\n如於第一項之代理權加以限制者，應於前條之委任書或筆錄內表明。","title":"第 五 節 訴訟代理人及輔佐人"},{"no":"第52條","text":"訴訟代理人有二人以上者，均得單獨代理當事人。\n違反前項之規定而為委任者，仍得單獨代理之。","title":"第 五 節 訴訟代理人及輔佐人"},{"no":"第53條","text":"訴訟代理權不因本人死亡、破產或訴訟能力喪失而消滅。法定代理有變更或機關經裁撤、改組者，亦同。","title":"第 五 節 訴訟代理人及輔佐人"},{"no":"第54條","text":"訴訟委任之終止，應以書狀提出於行政法院，由行政法院送達於他造。\n由訴訟代理人終止委任者，自為終止之意思表示之日起十五日內，仍應為防衛本人權利所必要之行為。","title":"第 五 節 訴訟代理人及輔佐人"},{"no":"第55條","text":"當事人或訴訟代理人經審判長之許可，得於期日偕同輔佐人到場。但人數不得逾二人。\n審判長認為必要時亦得命當事人或訴訟代理人偕同輔佐人到場。\n前二項之輔佐人，審判長認為不適當時，得撤銷其許可或禁止其續為訴訟行為。","title":"第 五 節 訴訟代理人及輔佐人"},{"no":"第56條","text":"民事訴訟法第七十二條、第七十五條及第七十七條之規定，於本節準用之。","title":"第 五 節 訴訟代理人及輔佐人"},{"no":"第57條","text":"當事人書狀，除別有規定外，應記載下列各款事項：\n一、當事人姓名及住所或居所；當事人為法人、機關或其他團體者，其名稱及所在地、事務所或營業所。\n二、有法定代理人、代表人或管理人者，其姓名及住所或居所。\n三、有訴訟代理人者，其姓名及住所或居所。\n四、應為之聲明。\n五、事實上及法律上之陳述。\n六、供證明或釋明用之證據。\n七、附屬文件及其件數。\n八、行政法院。\n九、年、月、日。\n書狀內宜記載當事人、法定代理人、代表人、管理人或訴訟代理人之出生年月日、職業、身分證明文件字號、營利事業統一編號、電話號碼及法定代理人、代表人或管理人與法人、機關或團體之關係或其他足資辨別之特徵。\n當事人書狀格式、記載方法及效力之規則，由司法院定之。未依該規則為之者，行政法院得拒絕其書狀之提出。\n當事人得以科技設備將書狀傳送於行政法院，其適用範圍、程序、效力及其他應遵循事項之辦法，由司法院定之。\n當事人以科技設備傳送書狀，未依前項辦法為之者，不生書狀提出之效力。\n其他訴訟關係人亦得以科技設備將訴訟文書傳送於行政法院，並準用前二項規定。","title":"第 一 節 當事人書狀"},{"no":"第58條","text":"當事人、法定代理人、代表人、管理人或訴訟代理人應於書狀內簽名或蓋章；其以指印代簽名者，應由他人代書姓名，記明其事由並簽名。\n依法規以科技設備傳送前項書狀者，其效力與提出經簽名或蓋章之書狀同。其他訴訟關係人以科技設備傳送應簽名或蓋章之訴訟文書者，亦同。","title":"第 一 節 當事人書狀"},{"no":"第59條","text":"民事訴訟法第一百十八條至第一百二十一條之規定，於本節準用之。","title":"第 一 節 當事人書狀"},{"no":"第60條","text":"於言詞辯論外，關於訴訟所為之聲明或陳述，除依本法應用書狀者外，得於行政法院書記官前以言詞為之。\n前項情形，行政法院書記官應作筆錄，並於筆錄內簽名。\n前項筆錄準用第五十七條及民事訴訟法第一百十八條至第一百二十條之規定。","title":"第 一 節 當事人書狀"},{"no":"第61條","text":"送達除別有規定外，由行政法院書記官依職權為之。","title":"第 二 節 送達"},{"no":"第62條","text":"送達由行政法院書記官交執達員或郵務機構行之。\n由郵務機構行送達者，以郵務人員為送達人；其實施辦法由司法院會同行政院定之。","title":"第 二 節 送達"},{"no":"第63條","text":"行政法院得向送達地之地方法院為送達之囑託。","title":"第 二 節 送達"},{"no":"第64條","text":"對於無訴訟能力人為送達者，應向其全體法定代理人為之。但法定代理人有二人以上，如其中有應為送達處所不明者，送達得僅向其餘之法定代理人為之。\n對於法人、中央及地方機關或非法人之團體為送達者，應向其代表人或管理人為之。\n代表人或管理人有二人以上者，送達得僅向其中一人為之。\n無訴訟能力人為訴訟行為，未向行政法院陳明其法定代理人者，於補正前，行政法院得向該無訴訟能力人為送達。","title":"第 二 節 送達"},{"no":"第65條","text":"對於在中華民國有事務所或營業所之外國法人或團體為送達者，應向其在中華民國之代表人或管理人為之。\n前項代表人或管理人有二人以上者，送達得僅向其中一人為之。","title":"第 二 節 送達"},{"no":"第66條","text":"訴訟代理人除受送達之權限受有限制者外，送達應向該代理人為之。但審判長認為必要時，得命併送達於當事人本人。\n第四十九條之一第一項事件，其訴訟代理人受送達之權限，不受限制。\n第一項但書情形，送達效力以訴訟代理人受送達為準。","title":"第 二 節 送達"},{"no":"第67條","text":"當事人或代理人經指定送達代收人，向受訴行政法院陳明者，應向該代收人為送達。但審判長認為必要時，得命送達於當事人本人。","title":"第 二 節 送達"},{"no":"第68條","text":"送達代收人經指定陳明後，其效力及於同地之各級行政法院。但該當事人或代理人別有陳明者，不在此限。","title":"第 二 節 送達"},{"no":"第69條","text":"當事人或代理人於中華民國無住居所、事務所及營業所者，應指定送達代收人向受訴行政法院陳明。","title":"第 二 節 送達"},{"no":"第70條","text":"當事人或代理人未依前條規定指定送達代收人者，行政法院得將應送達之文書交付郵務機構以掛號發送。","title":"第 二 節 送達"},{"no":"第71條","text":"送達，於應受送達人之住居所、事務所或營業所行之。但在他處會晤應受送達人時，得於會晤處所行之。\n對於法人、機關、非法人之團體之代表人或管理人為送達者，應向其事務所、營業所或機關所在地行之。但必要時亦得於會晤之處所或其住居所行之。\n應受送達人有就業處所者，亦得向該處所為送達。","title":"第 二 節 送達"},{"no":"第72條","text":"送達於住居所、事務所、營業所或機關所在地不獲會晤應受送達人者，得將文書付與有辨別事理能力之同居人、受雇人或願代為收受而居住於同一住宅之主人。\n前條所定送達處所之接收郵件人員，視為前項之同居人或受雇人。\n如同居人、受雇人、居住於同一住宅之主人或接收郵件人員為他造當事人者，不適用前二項之規定。","title":"第 二 節 送達"},{"no":"第73條","text":"送達不能依前二條規定為之者，得將文書寄存於送達地之自治或警察機關，並作送達通知書二份，一份黏貼於應受送達人住居所、事務所或營業所門首，一份交由鄰居轉交或置於應受送達人之信箱或其他適當之處所，以為送達。\n前項情形，如係以郵務人員為送達人者，得將文書寄存於附近之郵務機構。\n寄存送達，自寄存之日起，經十日發生效力。\n寄存之文書自寄存之日起，寄存機關或機構應保存二個月。","title":"第 二 節 送達"},{"no":"第74條","text":"應受送達人拒絕收領而無法律上理由者，應將文書置於送達處所，以為送達。\n前項情形，如有難達留置情事者，準用前條之規定。","title":"第 二 節 送達"},{"no":"第75條","text":"送達，除由郵務機構行之者外，非經審判長或受命法官、受託法官或送達地地方法院法官之許可，不得於星期日或其他休息日或日出前、日沒後為之。但應受送達人不拒絕收領者，不在此限。\n前項許可，書記官應於送達之文書內記明。","title":"第 二 節 送達"},{"no":"第76條","text":"行政法院書記官於法院內將文書付與應受送達人者，應命受送達人提出收據附卷。","title":"第 二 節 送達"},{"no":"第77條","text":"於外國或境外為送達者，應囑託該國管轄機關或駐在該國之中華民國使領館或其他機構、團體為之。\n不能依前項之規定為囑託送達者，得將應送達之文書交郵務機構以雙掛號發送，以為送達。","title":"第 二 節 送達"},{"no":"第78條","text":"對於駐在外國之中華民國大使、公使、領事或其他駐外人員為送達者，應囑託外交部為之。","title":"第 二 節 送達"},{"no":"第79條","text":"對於在軍隊或軍艦服役之軍人為送達者，應囑託該管軍事機關或長官為之。","title":"第 二 節 送達"},{"no":"第80條","text":"對於在監所人為送達者，應囑託該監所長官為之。","title":"第 二 節 送達"},{"no":"第81條","text":"行政法院對於當事人之送達，有下列情形之一者，得依聲請或依職權為公示送達：\n一、應為送達之處所不明。\n二、於有治外法權人住居所或事務所為送達而無效。\n三、於外國為送達，不能依第七十七條之規定辦理或預知雖依該條規定辦理而無效。","title":"第 二 節 送達"},{"no":"第82條","text":"公示送達，自將公告或通知書黏貼公告處之日起，公告於行政法院網站者，自公告之日起，其登載公報或新聞紙者，自最後登載之日起，經二十日發生效力；於依前條第三款為公示送達者，經六十日發生效力。但對同一當事人仍為公示送達者，自黏貼公告處之翌日起發生效力。","title":"第 二 節 送達"},{"no":"第83條","text":"經訴訟關係人之同意，得以科技設備傳送訴訟文書，其傳送與送達或通知有同一之效力。\n前項適用範圍、程序、效力及其他應遵循事項之辦法，由司法院定之。\n民事訴訟法第一百二十六條、第一百三十一條、第一百三十五條、第一百四十一條、第一百四十二條、第一百四十四條、第一百四十八條、第一百五十一條及第一百五十三條之規定，於本節準用之。","title":"第 二 節 送達"},{"no":"第84條","text":"期日，除別有規定外，由審判長依職權定之。\n期日，除有不得已之情形外，不得於星期日或其他休息日定之。","title":"第 三 節 期日及期間"},{"no":"第85條","text":"審判長定期日後，行政法院書記官應作通知書，送達於訴訟關係人。但經審判長面告以所定之期日命其到場，或訴訟關係人曾以書狀陳明屆期到場者，與送達有同一之效力。","title":"第 三 節 期日及期間"},{"no":"第86條","text":"期日應為之行為於行政法院內為之。但在行政法院內不能為或為之而不適當者，不在此限。","title":"第 三 節 期日及期間"},{"no":"第87條","text":"期日，以朗讀案由為始。\n期日，如有重大理由，得變更或延展之。\n變更或延展期日，除別有規定外，由審判長裁定之。","title":"第 三 節 期日及期間"},{"no":"第88條","text":"期間，除法定者外，由行政法院或審判長酌量情形定之。\n行政法院或審判長所定期間，自送達定期間之文書時起算，無庸送達者，自宣示定期間之裁判時起算。\n期間之計算，依民法之規定。","title":"第 三 節 期日及期間"},{"no":"第89條","text":"當事人不在行政法院所在地住居者，計算法定期間，應扣除其在途之期間，但有訴訟代理人住居行政法院所在地，得為期間內應為之訴訟行為者，不在此限。\n前項應扣除之在途期間，由司法院定之。","title":"第 三 節 期日及期間"},{"no":"第90條","text":"期間，如有重大理由得伸長或縮短之。但不變期間不在此限。\n伸長或縮短期間由行政法院裁定。但期間係審判長所定者，由審判長裁定。","title":"第 三 節 期日及期間"},{"no":"第91條","text":"因天災或其他不應歸責於己之事由，致遲誤不變期間者，於其原因消滅後一個月內，如該不變期間少於一個月者，於相等之日數內，得聲請回復原狀。\n前項期間不得伸長或縮短之。\n遲誤不變期間已逾一年者，不得聲請回復原狀，遲誤第一百零六條之起訴期間已逾三年者，亦同。\n第一項之聲請應以書狀為之，並釋明遲誤期間之原因及其消滅時期。","title":"第 三 節 期日及期間"},{"no":"第92條","text":"因遲誤上訴或抗告期間而聲請回復原狀者，向為裁判之原行政法院為之；遲誤其他期間者，向管轄該期間內應為之訴訟行為之行政法院為之。\n聲請回復原狀，應同時補行期間內應為之訴訟行為。","title":"第 三 節 期日及期間"},{"no":"第93條","text":"回復原狀之聲請，由受聲請之行政法院與補行之訴訟行為合併裁判之。但原行政法院認其聲請應行許可，而將上訴或抗告事件送交上級行政法院者，應由上級行政法院合併裁判。\n因回復原狀而變更原裁判者，準用第二百八十二條之規定。","title":"第 三 節 期日及期間"},{"no":"第94條","text":"受命法官或受託法官關於其所為之行為，得定期日及期間。\n第八十四條至第八十七條、第八十八條第一項、第二項及第九十條之規定，於受命法官或受託法官定期日及期間者，準用之。","title":"第 三 節 期日及期間"},{"no":"第95條","text":"當事人書狀、筆錄、裁判書及其他關於訴訟事件之文書，行政法院應保存者，應由行政法院書記官編為卷宗。\n卷宗滅失事件之處理，準用民刑事訴訟卷宗滅失案件處理法之規定。","title":"第 四 節 訴訟卷宗"},{"no":"第96條","text":"當事人得向行政法院書記官聲請閱覽、抄錄、影印或攝影卷內文書，或預納費用請求付與繕本、影本或節本。\n第三人經當事人同意或釋明有法律上之利害關係，而為前項之聲請者，應經行政法院裁定許可。\n當事人、訴訟代理人、第四十四條之參加人及其他經許可之第三人之閱卷規則，由司法院定之。","title":"第 四 節 訴訟卷宗"},{"no":"第97條","text":"裁判草案及其準備或評議文件，除法律別有規定外，不得交當事人或第三人閱覽、抄錄、影印或攝影，或付與繕本、影本或節本；裁判書在宣示或公告前，或未經法官簽名者，亦同。","title":"第 四 節 訴訟卷宗"},{"no":"第98條","text":"訴訟費用指裁判費及其他進行訴訟之必要費用，由敗訴之當事人負擔。但為第一百九十八條之判決時，由被告負擔。\n起訴，按件徵收裁判費新臺幣四千元。適用簡易訴訟程序之事件，徵收裁判費新臺幣二千元。","title":"第 五 節 訴訟費用"},{"no":"第98-1條","text":"以一訴主張數項標的，或為訴之變更、追加或提起反訴者，不另徵收裁判費。","title":"第 五 節 訴訟費用"},{"no":"第98-2條","text":"上訴，依第九十八條第二項規定，加徵裁判費二分之一。\n發回或發交更審再行上訴，或依第二百五十七條第二項為移送，經判決後再行上訴者，免徵裁判費。","title":"第 五 節 訴訟費用"},{"no":"第98-3條","text":"再審之訴，按起訴法院之審級，依第九十八條第二項及前條第一項規定徵收裁判費。\n對於確定之裁定聲請再審者，徵收裁判費新臺幣一千元。","title":"第 五 節 訴訟費用"},{"no":"第98-4條","text":"抗告，徵收裁判費新臺幣一千元。","title":"第 五 節 訴訟費用"},{"no":"第98-5條","text":"聲請或聲明，不徵收裁判費。但下列聲請，徵收裁判費新臺幣一千元：\n一、聲請參加訴訟或駁回參加。\n二、聲請回復原狀。\n三、聲請停止執行或撤銷停止執行之裁定。\n四、起訴前聲請證據保全。\n五、聲請重新審理。\n六、聲請假扣押、假處分或撤銷假扣押、假處分之裁定。\n七、第二百三十七條之三十聲請事件。","title":"第 五 節 訴訟費用"},{"no":"第98-6條","text":"下列費用之徵收，除法律另有規定外，其項目及標準由司法院定之：\n一、影印費、攝影費、抄錄費、翻譯費、運送費、公告行政法院網站費及登載公報新聞紙費。\n二、證人及通譯之日費、旅費。\n三、鑑定人之日費、旅費、報酬及鑑定所需費用。\n四、其他進行訴訟及強制執行之必要費用。\n郵電送達費及行政法院人員於法院外為訴訟行為之食、宿、交通費，不另徵收。","title":"第 五 節 訴訟費用"},{"no":"第98-7條","text":"交通裁決事件之裁判費，第二編第三章別有規定者，從其規定。","title":"第 五 節 訴訟費用"},{"no":"第98-8條","text":"行政法院或審判長依法律規定，為當事人選任律師為特別代理人或訴訟代理人者，其律師之酬金由行政法院或審判長定之。\n前項及第四十九條之一第一項事件之律師酬金為訴訟費用之一部，應限定其最高額。其支給標準，由司法院參酌法務部及全國律師聯合會等意見定之。\n前項律師酬金之數額，行政法院為終局裁判時，應併予酌定。訴訟不經裁判而終結者，行政法院應依聲請以裁定酌定之。\n對於酌定律師酬金數額之裁判，得抗告。","title":"第 五 節 訴訟費用"},{"no":"第99條","text":"因可歸責於參加人之事由致生無益之費用者，行政法院得命該參加人負擔其全部或一部。\n依第四十四條參加訴訟所生之費用，由參加人負擔。但他造當事人依第九十八條第一項及準用民事訴訟法第七十九條至第八十四條規定應負擔之訴訟費用，仍由該當事人負擔。","title":"第 五 節 訴訟費用"},{"no":"第100條","text":"裁判費除法律別有規定外，當事人應預納之。其未預納者，審判長應定期命當事人繳納；逾期未納者，行政法院應駁回其訴、上訴、抗告、再審或其他聲請。\n進行訴訟之必要費用，審判長得定期命當事人預納。逾期未納者，由國庫墊付，並於判決確定後，依職權裁定，向應負擔訴訟費用之人徵收之。\n前項裁定得為執行名義。","title":"第 五 節 訴訟費用"},{"no":"第101條","text":"當事人無資力支出訴訟費用者，行政法院應依聲請，以裁定准予訴訟救助。但顯無勝訴之望者，不在此限。","title":"第 五 節 訴訟費用"},{"no":"第102條","text":"聲請訴訟救助，應向受訴行政法院為之。\n聲請人無資力支出訴訟費用之事由應釋明之。\n前項釋明，得由受訴行政法院管轄區域內有資力之人出具保證書代之。\n前項保證書內，應載明具保證書人於聲請訴訟救助人負擔訴訟費用時，代繳暫免之費用。","title":"第 五 節 訴訟費用"},{"no":"第103條","text":"准予訴訟救助者，暫行免付訴訟費用。","title":"第 五 節 訴訟費用"},{"no":"第104條","text":"民事訴訟法第七十七條之二十六、第七十九條至第八十五條、第八十七條至第九十四條、第九十五條、第九十六條至第一百零六條、第一百零八條、第一百零九條之一、第一百十一條至第一百十三條、第一百十四條第一項、第一百十四條之一及第一百十五條之規定，於本節準用之。","title":"第 五 節 訴訟費用"},{"no":"第104-1條","text":"適用通常訴訟程序之事件，以高等行政法院為第一審管轄法院。但下列事件，以地方行政法院為第一審管轄法院：\n一、關於稅捐課徵事件涉訟，所核課之稅額在新臺幣一百五十萬元以下者。\n二、因不服行政機關所為新臺幣一百五十萬元以下之罰鍰或其附帶之其他裁罰性、管制性不利處分而涉訟者。\n三、其他關於公法上財產關係之訴訟，其標的之金額或價額在新臺幣一百五十萬元以下者。\n四、其他依法律規定或經司法院指定由地方行政法院管轄之事件。\n前項所定數額，司法院得因情勢需要，以命令增至新臺幣一千萬元。","title":"第 一 節 起訴"},{"no":"第105條","text":"起訴，應以訴狀表明下列各款事項，提出於行政法院為之：\n一、當事人。\n二、起訴之聲明。\n三、訴訟標的及其原因事實。\n訴狀內宜記載適用程序上有關事項、證據方法及其他準備言詞辯論之事項；其經訴願程序者，並附具決定書。","title":"第 一 節 起訴"},{"no":"第106條","text":"第四條及第五條訴訟之提起，除本法別有規定外，應於訴願決定書送達後二個月之不變期間內為之。但訴願人以外之利害關係人知悉在後者，自知悉時起算。\n第四條及第五條之訴訟，自訴願決定書送達後，已逾三年者，不得提起。\n不經訴願程序即得提起第四條或第五條第二項之訴訟者，應於行政處分達到或公告後二個月之不變期間內為之。\n不經訴願程序即得提起第五條第一項之訴訟者，於應作為期間屆滿後，始得為之。但於期間屆滿後，已逾三年者，不得提起。","title":"第 一 節 起訴"},{"no":"第107條","text":"原告之訴，有下列各款情形之一者，行政法院應以裁定駁回之。但其情形可以補正者，審判長應先定期間命補正：\n一、訴訟事件不屬行政訴訟審判權，不能依法移送。\n二、訴訟事件不屬受訴行政法院管轄而不能請求指定管轄，亦不能為移送訴訟之裁定。\n三、原告或被告無當事人能力。\n四、原告或被告未由合法之法定代理人、代表人或管理人為訴訟行為。\n五、由訴訟代理人起訴，而其代理權有欠缺。\n六、起訴逾越法定期限。\n七、當事人就已向行政法院或其他審判權之法院起訴之事件，於訴訟繫屬中就同一事件更行起訴。\n八、本案經終局判決後撤回其訴，復提起同一之訴。\n九、訴訟標的為確定判決、和解或調解之效力所及。\n十、起訴不合程式或不備其他要件。\n十一、起訴基於惡意、不當或其他濫用訴訟程序之目的或有重大過失，且事實上或法律上之主張欠缺合理依據。\n撤銷訴訟及課予義務訴訟，原告於訴狀誤列被告機關者，準用前項之規定。\n原告之訴，有下列各款情形之一者，行政法院得不經言詞辯論，逕以判決駁回之。但其情形可以補正者，審判長應先定期間命補正：\n一、除第二項以外之當事人不適格或欠缺權利保護必要。\n二、依其所訴之事實，在法律上顯無理由。\n前三項情形，原告之訴因逾期未補正經裁判駁回後，不得再為補正。\n第一項至第三項之裁判書理由得僅記載要領，且得以原告書狀、筆錄或其他文書作為附件。\n行政法院依第一項第十一款規定駁回原告之訴者，得各處原告、代表人或管理人、代理人新臺幣十二萬元以下之罰鍰。\n前項處罰應與本案訴訟合併裁定之。裁定內應記載受處罰人供相當金額之擔保後，得停止執行。\n原告對於本案訴訟之裁定聲明不服，關於處罰部分，視為提起抗告。\n第一項及第四項至第八項規定，於聲請或聲明事件準用之。","title":"第 一 節 起訴"},{"no":"第108條","text":"行政法院除依前條規定駁回原告之訴或移送者外，應將訴狀送達於被告。並得命被告以答辯狀陳述意見。\n原處分機關、被告機關或受理訴願機關經行政法院通知後，應於十日內將卷證送交行政法院。","title":"第 一 節 起訴"},{"no":"第109條","text":"審判長認已適於為言詞辯論時，應速定言詞辯論期日。\n前項言詞辯論期日，距訴狀之送達，至少應有十日為就審期間。但有急迫情形者，不在此限。","title":"第 一 節 起訴"},{"no":"第110條","text":"訴訟繫屬中，為訴訟標的之法律關係雖移轉於第三人，於訴訟無影響。但第三人如經兩造同意，得代當事人承當訴訟。\n前項情形，僅他造不同意者，移轉之當事人或第三人得聲請行政法院以裁定許第三人承當訴訟。\n前項裁定得為抗告。\n行政法院知悉訴訟標的有移轉者，應即以書面將訴訟繫屬情形通知第三人。\n訴願決定後，為訴訟標的之法律關係移轉於第三人者，得由受移轉人提起撤銷訴訟。","title":"第 一 節 起訴"},{"no":"第111條","text":"訴狀送達後，原告不得將原訴變更或追加他訴。但經被告同意或行政法院認為適當者，不在此限。\n被告於訴之變更或追加無異議，而為本案之言詞辯論者，視為同意變更或追加。\n有下列情形之一者，訴之變更或追加，應予准許：\n一、訴訟標的對於數人必須合一確定，追加其原非當事人之人為當事人。\n二、訴訟標的之請求雖有變更，但其請求之基礎不變。\n三、因情事變更而以他項聲明代最初之聲明。\n四、應提起確認訴訟，誤為提起撤銷訴訟。\n五、依第一百九十七條或其他法律之規定，應許為訴之變更或追加。\n前三項規定，於變更或追加之新訴為撤銷訴訟而未經訴願程序者不適用之。\n對於行政法院以訴為非變更追加，或許訴之變更追加之裁判，不得聲明不服。但撤銷訴訟，主張其未經訴願程序者，得隨同終局判決聲明不服。","title":"第 一 節 起訴"},{"no":"第112條","text":"被告於言詞辯論終結前，得在本訴繫屬之行政法院提起反訴。但對於撤銷訴訟及課予義務訴訟，不得提起反訴。\n原告對於反訴，不得復行提起反訴。\n反訴之請求如專屬他行政法院管轄，或與本訴之請求或其防禦方法不相牽連者，不得提起。\n被告意圖延滯訴訟而提起反訴者，行政法院得駁回之。","title":"第 一 節 起訴"},{"no":"第113條","text":"原告於判決確定前得撤回訴之全部或一部。但於公益之維護有礙者，不在此限。\n前項撤回，被告已為本案之言詞辯論者，應得其同意。\n訴之撤回，應以書狀為之。但於期日得以言詞為之。\n以言詞所為之撤回，應記載於筆錄，如他造不在場，應將筆錄送達。\n訴之撤回，被告於期日到場，未為同意與否之表示者，自該期日起；其未於期日到場或係以書狀撤回者，自前項筆錄或撤回書狀送達之日起，十日內未提出異議者，視為同意撤回。","title":"第 一 節 起訴"},{"no":"第114條","text":"行政法院就前條訴之撤回認有礙公益之維護者，應以裁定不予准許。\n前項裁定不得抗告。","title":"第 一 節 起訴"},{"no":"第114-1條","text":"地方行政法院適用通常訴訟程序之事件，因訴之變更或一部撤回，致其訴之全部屬於簡易訴訟程序或交通裁決事件訴訟程序之範圍者，地方行政法院應改依簡易訴訟程序或交通裁決事件訴訟程序之規定，由原受命法官繼續審理。\n地方行政法院適用通常訴訟程序之事件，因訴之追加、變更或反訴，致其訴之全部或一部屬於高等行政法院管轄者，應裁定移送管轄之高等行政法院。\n高等行政法院適用通常訴訟程序之事件，因訴之變更或一部撤回，致其訴之全部屬於地方行政法院管轄之事件者，高等行政法院應裁定移送管轄之地方行政法院。","title":"第 一 節 起訴"},{"no":"第115條","text":"民事訴訟法第二百四十五條、第二百四十六條、第二百四十八條、第二百五十二條、第二百五十三條、第二百五十七條、第二百六十一條、第二百六十三條及第二百六十四條之規定，於本節準用之。","title":"第 一 節 起訴"},{"no":"第116條","text":"原處分或決定之執行，除法律另有規定外，不因提起行政訴訟而停止。\n行政訴訟繫屬中，行政法院認為原處分或決定之執行，將發生難於回復之損害，且有急迫情事者，得依職權或依聲請裁定停止執行。但於公益有重大影響，或原告之訴在法律上顯無理由者，不得為之。\n於行政訴訟起訴前，如原處分或決定之執行將發生難於回復之損害，且有急迫情事者，行政法院亦得依受處分人或訴願人之聲請，裁定停止執行。但於公益有重大影響者，不在此限。\n行政法院為前二項裁定前，應先徵詢當事人之意見。如原處分或決定機關已依職權或依聲請停止執行者，應為駁回聲請之裁定。\n停止執行之裁定，得停止原處分或決定之效力、處分或決定之執行或程序之續行之全部或部份。","title":"第 二 節 停止執行"},{"no":"第117條","text":"前條規定，於確認行政處分無效之訴訟準用之。","title":"第 二 節 停止執行"},{"no":"第118條","text":"停止執行之原因消滅，或有其他情事變更之情形，行政法院得依職權或依聲請撤銷停止執行之裁定。","title":"第 二 節 停止執行"},{"no":"第119條","text":"關於停止執行或撤銷停止執行之裁定，得為抗告。","title":"第 二 節 停止執行"},{"no":"第120條","text":"原告因準備言詞辯論之必要，應提出準備書狀。\n被告因準備言詞辯論，宜於未逾就審期間二分之一以前，提出答辯狀。","title":"第 三 節 言詞辯論"},{"no":"第121條","text":"行政法院因使辯論易於終結，認為必要時，得於言詞辯論前，為下列各款之處置：\n一、命當事人、法定代理人、代表人或管理人本人到場。\n二、命當事人提出圖案、表冊、外國文文書之譯本或其他文書、物件。\n三、行勘驗、鑑定或囑託機關、團體為調查。\n四、通知證人或鑑定人，及調取或命第三人提出文書、物件。\n五、使受命法官或受託法官調查證據。\n行政法院因闡明或確定訴訟關係，於言詞辯論時，得為前項第一款至第三款之處置，並得將當事人或第三人提出之文書、物件暫留置之。","title":"第 三 節 言詞辯論"},{"no":"第122條","text":"言詞辯論，以當事人聲明起訴之事項為始。\n當事人應就訴訟關係為事實上及法律上之陳述。\n當事人不得引用文件以代言詞陳述。但以舉文件之辭句為必要時，得朗讀其必要之部分。","title":"第 三 節 言詞辯論"},{"no":"第122-1條","text":"當事人、證人、鑑定人或其他訴訟關係人如不通曉中華民國語言，行政法院應用通譯；法官不通曉訴訟關係人所用之方言者，亦同。\n前項訴訟關係人如為聽覺、聲音或語言障礙者，行政法院應用通譯。但亦得以文字發問或使其以文字陳述。\n前二項之通譯，準用關於鑑定人之規定。\n有第二項情形者，其訴訟關係人之配偶、直系或三親等內旁系血親、家長、家屬、醫師、心理師、輔導人員、社工人員或其信賴之人，經審判長許可後，得陪同在場。","title":"第 三 節 言詞辯論"},{"no":"第123條","text":"行政法院調查證據，除別有規定外，於言詞辯論期日行之。\n當事人應依第二編第一章第四節之規定，聲明所用之證據。","title":"第 三 節 言詞辯論"},{"no":"第124條","text":"審判長開始、指揮及終結言詞辯論，並宣示行政法院之裁判。\n審判長對於不服從言詞辯論之指揮者，得禁止發言。\n言詞辯論須續行者，審判長應速定其期日。","title":"第 三 節 言詞辯論"},{"no":"第125條","text":"行政法院應依職權調查事實關係，不受當事人事實主張及證據聲明之拘束。\n前項調查，當事人應協力為之。\n審判長應注意使當事人得為事實上及法律上適當完全之辯論。\n審判長應向當事人發問或告知，令其陳述事實、聲明證據，或為其他必要之聲明及陳述；其所聲明、陳述或訴訟類型有不明瞭或不完足者，應令其敘明或補充之。\n陪席法官告明審判長後，得向當事人發問或告知。","title":"第 三 節 言詞辯論"},{"no":"第125-1條","text":"審判長得於徵詢當事人之意見後，定期間命其為下列事項：\n一、陳述事實或指出證據方法。\n二、提出其依法負提出義務之文書或物件。\n當事人逾前項期間，遲延陳述事實、指出或提出證據方法，符合下列情形者，除法律別有規定外，行政法院得不予斟酌，逕依調查結果裁判之：\n一、其遲延有礙訴訟之終結。\n二、當事人未能釋明其遲延係不可歸責於己。\n三、審判長已告知其遲延之效果。","title":"第 三 節 言詞辯論"},{"no":"第125-2條","text":"行政法院為使訴訟關係明確，必要時得命司法事務官就事實上及法律上之事項，基於專業知識對當事人為說明。\n行政法院因司法事務官提供而獲知之特殊專業知識，應予當事人辯論之機會，始得採為裁判之基礎。","title":"第 三 節 言詞辯論"},{"no":"第126條","text":"凡依本法使受命法官為行為者，由審判長指定之。\n行政法院應為之囑託，除別有規定外，由審判長行之。","title":"第 三 節 言詞辯論"},{"no":"第127條","text":"分別提起之數宗訴訟係基於同一或同種類之事實上或法律上之原因者，行政法院得命合併辯論。\n命合併辯論之數宗訴訟，得合併裁判之。","title":"第 三 節 言詞辯論"},{"no":"第128條","text":"行政法院書記官應作言詞辯論筆錄，記載下列各款事項：\n一、辯論之處所及年、月、日。\n二、法官、書記官及通譯姓名。\n三、訴訟事件。\n四、到場當事人、法定代理人、代表人、管理人、訴訟代理人、輔佐人及其他經通知到場之人姓名。\n五、辯論之公開或不公開；如不公開者，其理由。","title":"第 三 節 言詞辯論"},{"no":"第129條","text":"言詞辯論筆錄內，應記載辯論進行之要領，並將下列各款事項記載明確：\n一、訴訟標的之捨棄、認諾、自認及訴之撤回。\n二、證據之聲明或撤回，及對於違背訴訟程序規定之異議。\n三、當事人所為其他重要聲明或陳述，及經告知而不為聲明或陳述之情形。\n四、依本法規定應記載筆錄之其他聲明或陳述。\n五、證人或鑑定人之陳述，及勘驗所得之結果。\n六、審判長命令記載之事項。\n七、不作裁判書附卷之裁判。\n八、裁判之宣示。","title":"第 三 節 言詞辯論"},{"no":"第130條","text":"筆錄或筆錄內所引用附卷或作為附件之文書內所記前條第一款至第六款事項，應依聲請於法庭向關係人朗讀或令其閱覽，並於筆錄內附記其事由。\n關係人對於筆錄所記有異議者，行政法院書記官得更正或補充之。如以異議為不當，應於筆錄內附記其異議。\n以機器記錄言詞辯論之進行者，其實施辦法由司法院定之。","title":"第 三 節 言詞辯論"},{"no":"第130-1條","text":"當事人、代表人、管理人、代理人、輔佐人、證人、鑑定人或其他關係人之所在處所或所在地法院與行政法院間，有聲音及影像相互傳送之科技設備而得直接審理者，行政法院認為適當時，得依聲請或依職權以該設備審理之。\n前項情形，其期日通知書記載之應到處所為該設備所在處所。\n依第一項進行程序之筆錄及其他文書，須陳述人簽名者，由行政法院傳送至陳述人所在處所，經陳述人確認內容並簽名後，將筆錄及其他文書以電信傳真或其他科技設備傳回行政法院。\n第一項之審理及前項文書傳送之辦法，由司法院定之。","title":"第 三 節 言詞辯論"},{"no":"第131條","text":"第四十九條第三項至第六項、第四十九條之一第四項、第八項、第四十九條之二第一項、第五十五條、第六十六條第一項、第六十七條但書、第一百條第一項前段、第二項、第一百零七條第一項但書、第二項、第三項但書、第一百十條第四項、第一百二十一條第一項第一款至第四款、第二項、第一百二十二條之一、第一百二十四條、第一百二十五條、第一百二十五條之一、第一百二十五條之二、第一百三十條之一及民事訴訟法第四十九條、第七十五條第一項、第一百二十條第一項、第一百二十一條第一項、第二項、第二百條、第二百零八條、第二百十三條第二項、第二百十三條之一、第二百十四條、第二百十七條、第二百六十八條、第二百六十八條之一第二項、第三項、第二百六十八條之二第一項、第三百七十一條第一項、第二項及第三百七十二條關於法院或審判長權限之規定，於受命法官行準備程序時準用之。","title":"第 三 節 言詞辯論"},{"no":"第132條","text":"民事訴訟法第一百九十五條至第一百九十七條、第二百條、第二百零一條、第二百零四條、第二百零六條、第二百零八條、第二百十條、第二百十一條、第二百十三條第二項、第二百十四條、第二百十五條、第二百十七條至第二百十九條、第二百六十五條至第二百六十八條之一、第二百六十八條之二、第二百七十條第一項、第二百七十條之一至第二百七十一條之一、第二百七十三條至第二百七十六條之規定，於本節準用之。","title":"第 三 節 言詞辯論"},{"no":"第133條","text":"行政法院應依職權調查證據。","title":"第 四 節 證據"},{"no":"第134條","text":"當事人主張之事實，雖經他造自認，行政法院仍應調查其他必要之證據。","title":"第 四 節 證據"},{"no":"第135條","text":"當事人因妨礙他造使用，故意將證據滅失、隱匿或致礙難使用者，行政法院得審酌情形認他造關於該證據之主張或依該證據應證之事實為真實。\n前項情形，於裁判前應令當事人有辯論之機會。","title":"第 四 節 證據"},{"no":"第136條","text":"除本法有規定者外，民事訴訟法第二百七十七條之規定於本節準用之。","title":"第 四 節 證據"},{"no":"第137條","text":"習慣及外國之現行法為行政法院所不知者，當事人有舉證之責任。但行政法院得依職權調查之。","title":"第 四 節 證據"},{"no":"第138條","text":"行政法院得囑託普通法院或其他機關、學校、團體調查證據。","title":"第 四 節 證據"},{"no":"第139條","text":"行政法院認為適當時，得使庭員一人為受命法官或囑託他行政法院指定法官調查證據。","title":"第 四 節 證據"},{"no":"第140條","text":"受訴行政法院於言詞辯論前調查證據，或由受命法官、受託法官調查證據者，行政法院書記官應作調查證據筆錄。\n第一百二十八條至第一百三十條之規定，於前項筆錄準用之。\n受託法官調查證據筆錄，應送交受訴行政法院。","title":"第 四 節 證據"},{"no":"第141條","text":"調查證據之結果，應告知當事人為辯論。\n於受訴行政法院外調查證據者，當事人應於言詞辯論時陳述其調查之結果。但審判長得令行政法院書記官朗讀調查證據筆錄代之。","title":"第 四 節 證據"},{"no":"第142條","text":"除法律別有規定外，不問何人，於他人之行政訴訟有為證人之義務。","title":"第 四 節 證據"},{"no":"第143條","text":"證人受合法之通知，無正當理由而不到場者，行政法院得以裁定處新臺幣三萬元以下罰鍰。\n證人已受前項裁定，經再次通知仍不到場者，得再處新臺幣六萬元以下罰鍰，並得拘提之。\n拘提證人，準用刑事訴訟法關於拘提被告之規定；證人為現役軍人者，應以拘票囑託該管長官執行。\n處證人罰鍰之裁定，得為抗告，抗告中應停止執行。","title":"第 四 節 證據"},{"no":"第143-1條","text":"證人不能到場，或有其他必要情形時，得就其所在處所訊問之。\n證人須依據文書、資料為陳述，或依事件之性質、證人之狀況，經行政法院認為適當者，得命當事人會同證人於公證人前作成陳述書狀。\n經當事人同意者，證人亦得於行政法院外以書狀為陳述。\n依前二項為陳述後，如認證人之書狀陳述須加說明，或經當事人之一造聲請對證人為必要之發問者，行政法院仍得通知該證人到場陳述。\n證人以書狀為陳述者，仍應具結，並將結文附於書狀，經公證人認證後提出。其依第一百三十條之一為訊問者，亦應於訊問前或訊問後具結。","title":"第 四 節 證據"},{"no":"第144條","text":"以公務員、中央民意代表或曾為公務員、中央民意代表之人為證人，而就其職務上應守秘密之事項訊問者，應得該監督長官或民意機關之同意。\n前項同意，除有妨害國家高度機密者外，不得拒絕。\n以受公務機關委託承辦公務之人為證人者，準用前二項之規定。","title":"第 四 節 證據"},{"no":"第145條","text":"證人恐因陳述致自己或下列之人受刑事訴追或蒙恥辱者，得拒絕證言：\n一、證人之配偶、前配偶或四親等內之血親、三親等內之姻親或曾有此親屬關係或與證人訂有婚約者。\n二、證人之監護人或受監護人。","title":"第 四 節 證據"},{"no":"第146條","text":"證人有下列各款情形之一者，得拒絕證言：\n一、證人有第一百四十四條之情形。\n二、證人為醫師、藥師、藥商、心理師、助產士、宗教師、律師、會計師或其他從事相類業務之人或其業務上佐理人或曾任此等職務之人，就其因業務所知悉有關他人秘密之事項受訊問。\n三、關於技術上或職業上之秘密受訊問。\n前項規定，於證人秘密之責任已經免除者，不適用之。","title":"第 四 節 證據"},{"no":"第147條","text":"依前二條規定，得拒絕證言者，審判長應於訊問前或知有該項情形時告知之。","title":"第 四 節 證據"},{"no":"第148條","text":"證人不陳明拒絕之原因事實而拒絕證言，或以拒絕為不當之裁定已確定而仍拒絕證言者，行政法院得以裁定處新臺幣三萬元以下罰鍰。\n前項裁定得為抗告，抗告中應停止執行。","title":"第 四 節 證據"},{"no":"第149條","text":"審判長於訊問前，應命證人各別具結。但其應否具結有疑義者，於訊問後行之。\n審判長於證人具結前，應告以具結之義務及偽證之處罰。\n證人以書狀為陳述者，不適用前二項之規定。","title":"第 四 節 證據"},{"no":"第150條","text":"以未滿十六歲或因精神或其他心智障礙，致不解具結意義及其效果之人為證人者，不得令其具結。","title":"第 四 節 證據"},{"no":"第151條","text":"以下列各款之人為證人者，得不令其具結：\n一、證人為當事人之配偶、前配偶或四親等內之血親、三親等內之姻親或曾有此親屬關係或與當事人訂有婚約。\n二、有第一百四十五條情形而不拒絕證言。\n三、當事人之受雇人或同居人。","title":"第 四 節 證據"},{"no":"第152條","text":"證人就與自己或第一百四十五條所列之人有直接利害關係之事項受訊問者，得拒絕具結。","title":"第 四 節 證據"},{"no":"第153條","text":"第一百四十八條之規定 ，於證人拒絕具結者準用之。","title":"第 四 節 證據"},{"no":"第154條","text":"當事人得就應證事實及證言信用之事項，聲請審判長對於證人為必要之發問，或向審判長陳明後自行發問。\n前項之發問，與應證事實無關、重複發問、誘導發問、侮辱證人或有其他不當情形，審判長得依聲請或依職權限制或禁止。\n關於發問之限制或禁止有異議者，行政法院應就其異議為裁定。","title":"第 四 節 證據"},{"no":"第155條","text":"行政法院應發給證人法定之日費及旅費；證人亦得於訊問完畢後請求之。但被拘提或無正當理由拒絕具結或證言者，不在此限。\n前項關於日費及旅費之裁定，得為抗告。\n證人所需之旅費，得依其請求預行酌給之。","title":"第 四 節 證據"},{"no":"第156條","text":"鑑定，除別有規定外，準用本法關於人證之規定。","title":"第 四 節 證據"},{"no":"第157條","text":"從事於鑑定所需之學術、技藝或職業，或經機關委任有鑑定職務者，於他人之行政訴訟有為鑑定人之義務。\n鑑定人應於選任前揭露下列資訊；其經選任後發現者，應即時向審判長及當事人揭露之：\n一、學經歷、專業領域及本於其專業學識經驗曾參與訴訟、非訟或法院調解程序之案例。\n二、關於專業學識經驗及相關資料之準備或提出，曾與當事人、輔助參加人、輔佐人或其代理人有分工或合作關係。\n三、關於專業學識經驗及相關資料之準備或提出，曾受當事人、輔助參加人、輔佐人或其代理人之金錢報酬或資助及其金額或價值。\n四、關於該事件，有其他提供金錢報酬或資助者之身分及其金額或價值。\n五、有其他情事足認有不能公正、獨立執行職務之虞。","title":"第 四 節 證據"},{"no":"第158條","text":"鑑定人不得拘提。","title":"第 四 節 證據"},{"no":"第159條","text":"鑑定人拒絕鑑定，雖其理由不合於本法關於拒絕證言之規定，如行政法院認為正當者，亦得免除其鑑定義務。","title":"第 四 節 證據"},{"no":"第160條","text":"鑑定人於法定之日費、旅費外，得請求相當之報酬。\n鑑定所需費用，得依鑑定人之請求預行酌給之。\n關於前二項請求之裁定，得為抗告。","title":"第 四 節 證據"},{"no":"第161條","text":"行政法院依第一百三十八條之規定，囑託機關、學校或團體陳述鑑定意見或審查之者，準用第一百六十條及民事訴訟法第三百三十五條至第三百三十七條之規定。其鑑定書之說明，由該機關、學校或團體所指定之人為之。","title":"第 四 節 證據"},{"no":"第162條","text":"行政法院認有必要時，得就訴訟事件之專業法律問題徵詢從事該學術研究之人，以書面或於審判期日到場陳述其法律上意見。\n前項意見，於裁判前應告知當事人使為辯論。\n第一項陳述意見之人，準用鑑定人之規定。但不得令其具結。","title":"第 四 節 證據"},{"no":"第163條","text":"下列各款文書，當事人有提出之義務：\n一、該當事人於訴訟程序中曾經引用者。\n二、他造依法律規定，得請求交付或閱覽者。\n三、為他造之利益而作者。\n四、就與本件訴訟關係有關之事項所作者。\n五、商業帳簿。","title":"第 四 節 證據"},{"no":"第164條","text":"公務員或機關掌管之文書，行政法院得調取之。如該機關為當事人時，並有提出之義務。\n前項情形，除有妨害國家高度機密者外，不得拒絕。","title":"第 四 節 證據"},{"no":"第165條","text":"當事人無正當理由不從提出文書之命者，行政法院得審酌情形認他造關於該文書之主張或依該文書應證之事實為真實。\n前項情形，於裁判前應令當事人有辯論之機會。","title":"第 四 節 證據"},{"no":"第166條","text":"聲明書證係使用第三人所執之文書者，應聲請行政法院命第三人提出或定由舉證人提出之期間。\n民事訴訟法第三百四十二條第二項、第三項之規定，於前項聲請準用之。\n文書為第三人所執之事由及第三人有提出義務之原因，應釋明之。","title":"第 四 節 證據"},{"no":"第167條","text":"行政法院認應證之事實重要且舉證人之聲請正當者，應以裁定命第三人提出文書或定由舉證人提出文書之期間。\n行政法院為前項裁定前，應使該第三人有陳述意見之機會。","title":"第 四 節 證據"},{"no":"第168條","text":"關於第三人提出文書之義務，準用第一百四十四條至第一百四十七條及第一百六十三條第二款至第五款之規定。","title":"第 四 節 證據"},{"no":"第169條","text":"第三人無正當理由不從提出文書之命者，行政法院得以裁定處新臺幣三萬元以下罰鍰；於必要時，並得為強制處分。\n前項強制處分之執行，適用第三百零六條規定。\n第一項裁定得為抗告，抗告中應停止執行。","title":"第 四 節 證據"},{"no":"第170條","text":"第三人得請求提出文書之費用。\n第一百五十五條之規定，於前項情形準用之。","title":"第 四 節 證據"},{"no":"第171條","text":"文書之真偽，得依核對筆跡或印跡證之。\n行政法院得命當事人或第三人提出文書，以供核對。核對筆跡或印跡，適用關於勘驗之規定。","title":"第 四 節 證據"},{"no":"第172條","text":"無適當之筆跡可供核對者，行政法院得指定文字，命該文書之作成名義人書寫，以供核對。\n文書之作成名義人無正當理由不從前項之命者，準用第一百六十五條或第一百六十九條之規定。\n因供核對所書寫之文字應附於筆錄；其他供核對之文件不須發還者，亦同。","title":"第 四 節 證據"},{"no":"第173條","text":"本法關於文書之規定，於文書外之物件，有與文書相同之效用者，準用之。\n文書或前項物件，須以科技設備始能呈現其內容或提出原件有事實上之困難者，得僅提出呈現其內容之書面並證明其內容與原件相符。","title":"第 四 節 證據"},{"no":"第174條","text":"第一百六十四條至第一百七十條之規定，於勘驗準用之。","title":"第 四 節 證據"},{"no":"第175條","text":"保全證據之聲請，在起訴後，向受訴行政法院為之；在起訴前，向受訊問人住居地或證物所在地之地方行政法院為之。\n遇有急迫情形時，於起訴後，亦得向前項地方行政法院聲請保全證據。","title":"第 四 節 證據"},{"no":"第175-1條","text":"行政法院於保全證據時，得命司法事務官協助調查證據。","title":"第 四 節 證據"},{"no":"第176條","text":"民事訴訟法第二百十五條、第二百十七條至第二百十九條、第二百七十八條、第二百八十一條、第二百八十二條、第二百八十四條至第二百八十六條、第二百九十一條至第二百九十三條、第二百九十五條、第二百九十六條、第二百九十六條之一、第二百九十八條至第三百零一條、第三百零四條、第三百零九條、第三百十條、第三百十三條、第三百十三條之一、第三百十六條至第三百十九條、第三百二十一條、第三百二十二條、第三百二十五條至第三百二十七條、第三百三十一條至第三百三十七條、第三百三十九條、第三百四十一條至第三百四十三條、第三百五十二條至第三百五十八條、第三百六十一條、第三百六十四條至第三百六十六條、第三百六十八條、第三百七十條至第三百七十六條之二之規定，於本節準用之。","title":"第 四 節 證據"},{"no":"第177條","text":"行政訴訟之裁判須以民事法律關係是否成立為準據，而該法律關係已經訴訟繫屬尚未終結者，行政法院應以裁定停止訴訟程序。\n除前項情形外，有民事、刑事或其他行政爭訟牽涉行政訴訟之裁判者，行政法院在該民事、刑事或其他行政爭訟終結前，得以裁定停止訴訟程序。","title":"第 五 節 訴訟程序之停止"},{"no":"第178條","text":"（刪除）","title":"第 五 節 訴訟程序之停止"},{"no":"第178-1條","text":"行政法院就其受理事件，對所應適用之法律位階法規範，聲請憲法法庭判決宣告違憲者，應裁定停止訴訟程序。","title":"第 五 節 訴訟程序之停止"},{"no":"第179條","text":"本於一定資格，以自己名義為他人任訴訟當事人之人，喪失其資格或死亡者，訴訟程序在有同一資格之人承受其訴訟以前當然停止。\n依第二十九條規定，選定或指定為訴訟當事人之人全體喪失其資格者，訴訟程序在該有共同利益人全體或新選定或指定為訴訟當事人之人承受其訴訟以前當然停止。","title":"第 五 節 訴訟程序之停止"},{"no":"第180條","text":"第一百七十九條之規定，於有訴訟代理人時不適用之。但行政法院得酌量情形裁定停止其訴訟程序。","title":"第 五 節 訴訟程序之停止"},{"no":"第181條","text":"訴訟程序當然停止後，依法律所定之承受訴訟之人，於得為承受時，應即為承受之聲明。\n他造當事人亦得聲明承受訴訟。","title":"第 五 節 訴訟程序之停止"},{"no":"第182條","text":"訴訟程序當然或裁定停止間，行政法院及當事人不得為關於本案之訴訟行為。但於言詞辯論終結後當然停止者，本於其辯論之裁判得宣示之。\n訴訟程序當然或裁定停止者，期間停止進行；自停止終竣時起，其期間更始進行。","title":"第 五 節 訴訟程序之停止"},{"no":"第183條","text":"當事人得以合意停止訴訟程序。但於公益之維護有礙者，不在此限。\n前項合意，應由兩造向受訴行政法院陳明。\n行政法院認第一項之合意有礙公益之維護者，應於兩造陳明後，一個月內裁定續行訴訟。\n前項裁定不得聲明不服。\n不變期間之進行不因第一項合意停止而受影響。","title":"第 五 節 訴訟程序之停止"},{"no":"第184條","text":"除有前條第三項之裁定外，合意停止訴訟程序之當事人，自陳明合意停止時起，如於四個月內不續行訴訟者，視為撤回其訴；續行訴訟而再以合意停止訴訟程序者，以一次為限。如再次陳明合意停止訴訟程序，視為撤回其訴。","title":"第 五 節 訴訟程序之停止"},{"no":"第185條","text":"當事人兩造無正當理由遲誤言詞辯論期日，除有礙公益之維護者外，視為合意停止訴訟程序。如於四個月內不續行訴訟者，視為撤回其訴。但行政法院認有必要時，得依職權續行訴訟。\n行政法院依前項但書規定續行訴訟，兩造如無正當理由仍不到者，視為撤回其訴。\n行政法院認第一項停止訴訟程序有礙公益之維護者，除別有規定外，應自該期日起，一個月內裁定續行訴訟。\n前項裁定不得聲明不服。","title":"第 五 節 訴訟程序之停止"},{"no":"第186條","text":"民事訴訟法第一百六十八條至第一百七十一條、第一百七十三條、第一百七十四條、第一百七十六條至第一百八十一條、第一百八十五條至第一百八十七條之規定，於本節準用之。","title":"第 五 節 訴訟程序之停止"},{"no":"第187條","text":"裁判，除依本法應用判決者外，以裁定行之。","title":"第 六 節 裁判"},{"no":"第188條","text":"行政訴訟除別有規定外，應本於言詞辯論而為裁判。\n法官非參與裁判基礎之辯論者，不得參與裁判。\n裁定得不經言詞辯論為之。\n裁定前不行言詞辯論者，除別有規定外，得命關係人以書狀或言詞為陳述。","title":"第 六 節 裁判"},{"no":"第189條","text":"行政法院為裁判時，應斟酌全辯論意旨及調查證據之結果，依論理及經驗法則判斷事實之真偽。但別有規定者，不在此限。\n當事人已證明受有損害而不能證明其數額或證明顯有重大困難者，法院應審酌一切情況，依所得心證定其數額。\n得心證之理由，應記明於判決。","title":"第 六 節 裁判"},{"no":"第190條","text":"行政訴訟達於可為裁判之程度者，行政法院應為終局判決。","title":"第 六 節 裁判"},{"no":"第191條","text":"訴訟標的之一部，或以一訴主張之數項標的，其一達於可為裁判之程度者，行政法院得為一部之終局判決。\n前項規定，於命合併辯論之數宗訴訟，其一達於可為裁判之程度者，準用之。","title":"第 六 節 裁判"},{"no":"第192條","text":"各種獨立之攻擊或防禦方法，達於可為裁判之程度者，行政法院得為中間判決；請求之原因及數額俱有爭執時，行政法院以其原因為正當者，亦同。","title":"第 六 節 裁判"},{"no":"第193條","text":"行政訴訟進行中所生程序上之爭執，達於可為裁判之程度者，行政法院得先為裁定。","title":"第 六 節 裁判"},{"no":"第194條","text":"行政訴訟有關公益之維護者，當事人兩造於言詞辯論期日無正當理由均不到場時，行政法院得依職權調查事實，不經言詞辯論，逕為判決。","title":"第 六 節 裁判"},{"no":"第194-1條","text":"當事人於辯論期日到場不為辯論者，視同不到場。第四十九條之一第一項事件，當事人之訴訟代理人未到場者，亦同。","title":"第 六 節 裁判"},{"no":"第195條","text":"行政法院認原告之訴為有理由者，除別有規定外，應為其勝訴之判決；認為無理由者，應以判決駁回之。\n撤銷訴訟之判決，如係變更原處分或決定者，不得為較原處分或決定不利於原告之判決。","title":"第 六 節 裁判"},{"no":"第196條","text":"行政處分已執行者，行政法院為撤銷行政處分判決時，經原告聲請，並認為適當者，得於判決中命行政機關為回復原狀之必要處置。\n撤銷訴訟進行中，原處分已執行而無回復原狀可能或已消滅者，於原告有即受確認判決之法律上利益時，行政法院得依聲請，確認該行政處分為違法。","title":"第 六 節 裁判"},{"no":"第197條","text":"撤銷訴訟，其訴訟標的之行政處分涉及金錢或其他代替物之給付或確認者，行政法院得以確定不同金額之給付或以不同之確認代替之。","title":"第 六 節 裁判"},{"no":"第198條","text":"行政法院受理撤銷訴訟，發現原處分或決定雖屬違法，但其撤銷或變更於公益有重大損害，經斟酌原告所受損害、賠償程度、防止方法及其他一切情事，認原處分或決定之撤銷或變更顯與公益相違背時，得駁回原告之訴。\n前項情形，應於判決主文中諭知原處分或決定違法。","title":"第 六 節 裁判"},{"no":"第199條","text":"行政法院為前條判決時，應依原告之聲明，將其因違法處分或決定所受之損害，於判決內命被告機關賠償。\n原告未為前項聲明者，得於前條判決確定後一年內，向行政法院訴請賠償。","title":"第 六 節 裁判"},{"no":"第200條","text":"行政法院對於人民依第五條規定請求應為行政處分或應為特定內容之行政處分之訴訟，應為下列方式之裁判：\n一、原告之訴不合法者，應以裁定駁回之。\n二、原告之訴無理由者，應以判決駁回之。\n三、原告之訴有理由，且案件事證明確者，應判命行政機關作成原告所申請內容之行政處分。\n四、原告之訴雖有理由，惟案件事證尚未臻明確或涉及行政機關之行政裁量決定者，應判命行政機關遵照其判決之法律見解對於原告作成決定。","title":"第 六 節 裁判"},{"no":"第201條","text":"行政機關依裁量權所為之行政處分，以其作為或不作為逾越權限或濫用權力者為限，行政法院得予撤銷。","title":"第 六 節 裁判"},{"no":"第202條","text":"當事人於言詞辯論時為訴訟標的之捨棄或認諾者，以該當事人具有處分權及不涉及公益者為限，行政法院得本於其捨棄或認諾為該當事人敗訴之判決。","title":"第 六 節 裁判"},{"no":"第203條","text":"公法上契約成立後，情事變更，非當時所得預料，而依其原有效果顯失公平者，行政法院得依當事人聲請，為增、減給付或變更、消滅其他原有效果之判決。\n為當事人之行政機關，因防止或免除公益上顯然重大之損害，亦得為前項之聲請。\n前二項規定，於因公法上其他原因發生之財產上給付，準用之。","title":"第 六 節 裁判"},{"no":"第204條","text":"判決應公告之；經言詞辯論之判決，應宣示之，但當事人明示於宣示期日不到場或於宣示期日未到場者，不在此限。\n宣示判決應於辯論終結之期日或辯論終結時指定之期日為之。\n前項指定之宣示期日，自辯論終結時起，不得逾三星期。但案情繁雜或有特殊情形者，不在此限。\n公告判決，應於行政法院公告處或網站公告其主文，行政法院書記官並應作記載該事由及年、月、日、時之證書附卷。","title":"第 六 節 裁判"},{"no":"第205條","text":"宣示判決，不問當事人是否在場，均有效力。\n判決經宣示或公告後，當事人得不待送達，本於該判決為訴訟行為。","title":"第 六 節 裁判"},{"no":"第206條","text":"判決經宣示後，為該判決之行政法院受其羈束；其不宣示者，經公告主文後，亦同。","title":"第 六 節 裁判"},{"no":"第207條","text":"經言詞辯論之裁定，應宣示之。但當事人明示於宣示期日不到場或於宣示期日未到場者，以公告代之。\n終結訴訟之裁定，應公告之。","title":"第 六 節 裁判"},{"no":"第208條","text":"裁定經宣示後，為該裁定之行政法院、審判長、受命法官或受託法官受其羈束；不宣示者，經公告或送達後受其羈束。但關於指揮訴訟或別有規定者，不在此限。","title":"第 六 節 裁判"},{"no":"第209條","text":"判決應作判決書記載下列各款事項：\n一、當事人姓名及住所或居所；當事人為法人、機關或其他團體者，其名稱及所在地、事務所或營業所。\n二、有法定代理人、代表人、管理人者，其姓名及住所或居所。\n三、有訴訟代理人者，其姓名及住所或居所。\n四、判決經言詞辯論者，其言詞辯論終結日期。\n五、主文。\n六、事實。\n七、理由。\n八、年、月、日。\n九、行政法院。\n事實項下，應記載言詞辯論時當事人之聲明及所提攻擊或防禦方法之要領；必要時，得以書狀、筆錄或其他文書作為附件。\n理由項下，應記載關於攻擊或防禦方法之意見及法律上之意見。","title":"第 六 節 裁判"},{"no":"第210條","text":"判決，應以正本送達於當事人；正本以電子文件為之者，應經應受送達人同意。但對於在監所之人，正本不得以電子文件為之。\n前項送達，自行政法院書記官收領判決原本時起，至遲不得逾十日。\n對於判決得為上訴者，應於送達當事人之正本內告知其期間及提出上訴狀之行政法院。\n前項告知期間有錯誤時，告知期間較法定期間為短者，以法定期間為準；告知期間較法定期間為長者，應由行政法院書記官於判決正本送達後二十日內，以通知更正之，並自更正通知送達之日起計算法定期間。\n行政法院未依第三項規定為告知，或告知錯誤未依前項規定更正，致當事人遲誤上訴期間者，視為不應歸責於己之事由，得自判決送達之日起一年內，適用第九十一條之規定，聲請回復原狀。","title":"第 六 節 裁判"},{"no":"第211條","text":"不得上訴之判決，不因告知錯誤而受影響。","title":"第 六 節 裁判"},{"no":"第212條","text":"判決，於上訴期間屆滿時確定。但於上訴期間內有合法之上訴者，阻其確定。\n不得上訴之判決，於宣示時確定；不宣示者，於公告主文時確定。","title":"第 六 節 裁判"},{"no":"第213條","text":"訴訟標的於確定之終局判決中經裁判者，有確定力。","title":"第 六 節 裁判"},{"no":"第214條","text":"確定判決，除當事人外，對於訴訟繫屬後為當事人之繼受人者及為當事人或其繼受人占有請求之標的物者，亦有效力。\n對於為他人而為原告或被告者之確定判決，對於該他人亦有效力。","title":"第 六 節 裁判"},{"no":"第215條","text":"撤銷或變更原處分或決定之判決，對第三人亦有效力。","title":"第 六 節 裁判"},{"no":"第216條","text":"撤銷或變更原處分或決定之判決，就其事件有拘束各關係機關之效力。\n原處分或決定經判決撤銷後，機關須重為處分或決定者，應依判決意旨為之。\n前二項判決，如係指摘機關適用法律之見解有違誤時，該機關即應受判決之拘束，不得為相左或歧異之決定或處分。\n前三項之規定，於其他訴訟準用之。","title":"第 六 節 裁判"},{"no":"第217條","text":"第二百零四條第二項至第四項、第二百零五條、第二百十條及民事訴訟法第二百二十八條規定，於裁定準用之。","title":"第 六 節 裁判"},{"no":"第218條","text":"民事訴訟法第二百二十四條、第二百二十七條、第二百二十八條、第二百三十條、第二百三十二條、第二百三十三條、第二百三十六條、第二百三十七條、第二百四十條、第三百八十五條、第三百八十六條、第三百八十八條、第三百九十六條第一項、第二項及第三百九十九條之規定，於本節準用之。","title":"第 六 節 裁判"},{"no":"第219條","text":"當事人就訴訟標的具有處分權且其和解無礙公益之維護者，行政法院不問訴訟程度如何，得隨時試行和解。必要時，得就訴訟標的以外之事項，併予和解。\n受命法官或受託法官亦得為前項之和解。\n第三人經行政法院之許可，得參加和解。行政法院認為必要時，得通知第三人參加。","title":"第 七 節 和解"},{"no":"第220條","text":"因試行和解，得命當事人、法定代理人、代表人或管理人本人到場。","title":"第 七 節 和解"},{"no":"第221條","text":"試行和解而成立者，應作成和解筆錄。\n第一百二十八條至第一百三十條、民事訴訟法第二百十四條、第二百十五條、第二百十七條至第二百十九條之規定，於前項筆錄準用之。\n和解筆錄應於和解成立之日起十日內，以正本送達於當事人及參加和解之第三人。","title":"第 七 節 和解"},{"no":"第222條","text":"和解成立者，其效力準用第二百十三條、第二百十四條及第二百十六條之規定。","title":"第 七 節 和解"},{"no":"第223條","text":"和解有無效或得撤銷之原因者，當事人得請求繼續審判。","title":"第 七 節 和解"},{"no":"第224條","text":"請求繼續審判，應於三十日之不變期間內為之。\n前項期間，自和解成立時起算。但無效或得撤銷之原因知悉在後者，自知悉時起算。\n和解成立後經過三年者，不得請求繼續審判。但當事人主張代理權有欠缺者，不在此限。","title":"第 七 節 和解"},{"no":"第225條","text":"請求繼續審判不合法者，行政法院應以裁定駁回之。\n請求繼續審判顯無理由者，得不經言詞辯論，以判決駁回之。","title":"第 七 節 和解"},{"no":"第226條","text":"因請求繼續審判而變更和解內容者，準用第二百八十二條之規定。","title":"第 七 節 和解"},{"no":"第227條","text":"當事人與第三人間之和解，有無效或得撤銷之原因者，得向原行政法院提起宣告和解無效或撤銷和解之訴。\n前項情形，當事人得請求就原訴訟事件合併裁判。","title":"第 七 節 和解"},{"no":"第228條","text":"第二百二十四條至第二百二十六條之規定，於前條第一項情形準用之。","title":"第 七 節 和解"},{"no":"第228-1條","text":"民事訴訟法第三百七十七條之一、第三百七十七條之二及第三百八十條第三項之規定，於本節準用之。","title":"第 七 節 和解"},{"no":"第228-2條","text":"當事人就訴訟標的具有處分權且其調解無礙公益之維護者，行政法院得於訴訟繫屬中，經當事人合意將事件移付調解。\n受命法官或受託法官亦得為前項之調解。\n必要時，經行政法院許可者，得就訴訟標的以外之事項，併予調解。\n第三人經行政法院之許可，得參加調解。行政法院認為必要時，得依聲請或依職權通知第三人參加調解。","title":"第 八 節 調解"},{"no":"第228-3條","text":"調解由原行政法院、受命法官或受託法官選任調解委員一人至三人先行調解，俟至相當程度有成立之望或其他必要情形時，再報請法官到場。但法官認為適當時，亦得逕由法官行之。\n當事人對於前項調解委員人選有異議者，法官得另行選任之。","title":"第 八 節 調解"},{"no":"第228-4條","text":"行政法院應將適於為調解委員之人選列冊，以供選任；其資格、任期、聘任、解任、應揭露資訊、日費、旅費及報酬等事項，由司法院定之。\n法官於調解事件認有必要時，亦得選任前項名冊以外之人為調解委員。\n第一項之日費、旅費及報酬，由國庫負擔。","title":"第 八 節 調解"},{"no":"第228-5條","text":"第八十五條、第八十七條第二項、第三項、第一百三十條之一、第二百二十條、第二百二十一條第二項、第三項、第二百二十二條至第二百二十八條之一之規定，於本節準用之。","title":"第 八 節 調解"},{"no":"第228-6條","text":"民事訴訟法第八十四條第一項、第四百零七條第一項、第四百零七條之一、第四百十條、第四百十三條、第四百十四條、第四百二十條、第四百二十條之一第二項、第三項、第四百二十一條第一項、第四百二十二條及第四百二十六條之規定，於本節準用之。","title":"第 八 節 調解"},{"no":"第229條","text":"適用簡易訴訟程序之事件，以地方行政法院為第一審管轄法院。\n下列各款行政訴訟事件，除本法別有規定外，適用本章所定之簡易程序：\n一、關於稅捐課徵事件涉訟，所核課之稅額在新臺幣五十萬元以下者。\n二、因不服行政機關所為新臺幣五十萬元以下罰鍰處分而涉訟者。\n三、其他關於公法上財產關係之訴訟，其標的之金額或價額在新臺幣五十萬元以下者。\n四、因不服行政機關所為告誡、警告、記點、記次、講習、輔導教育或其他相類之輕微處分而涉訟者。\n五、關於內政部移民署（以下簡稱移民署）之行政收容事件涉訟，或合併請求損害賠償或其他財產上給付者。\n六、依法律之規定應適用簡易訴訟程序者。\n前項所定數額，司法院得因情勢需要，以命令減為新臺幣二十五萬元或增至新臺幣七十五萬元。\n第二項第五款之事件，由受收容人受收容或曾受收容所在地之地方行政法院管轄，不適用第十三條之規定。但未曾受收容者，由被告機關所在地之地方行政法院管轄。","title":"第 二 章 簡易訴訟程序"},{"no":"第230條","text":"前條第二項之訴，因訴之變更或一部撤回，致其訴屬於地方行政法院適用通常訴訟程序之事件或交通裁決事件者，應改依通常訴訟程序或交通裁決事件訴訟程序之規定審理。追加之新訴或反訴，以原訴與之合併辯論及裁判者，亦同。\n前項情形，訴之全部或一部屬於高等行政法院管轄者，地方行政法院應裁定移送管轄之高等行政法院。","title":"第 二 章 簡易訴訟程序"},{"no":"第231條","text":"起訴及其他期日外之聲明或陳述，概得以言詞為之。\n以言詞起訴者，應將筆錄送達於他造。","title":"第 二 章 簡易訴訟程序"},{"no":"第232條","text":"簡易訴訟程序在獨任法官前行之。\n簡易訴訟程序之審理，當事人一造之住居所、公務所、機關、主事務所或主營業所所在地位於與法院相距過遠之地區者，行政法院應徵詢其意見，以遠距審理、巡迴法庭或其他便利之方式行之。\n前項與法院相距過遠地區之標準、審理方式及巡迴法庭臨時開庭辦法，由司法院定之。","title":"第 二 章 簡易訴訟程序"},{"no":"第233條","text":"言詞辯論期日之通知書，應與訴狀或第二百三十一條第二項之筆錄一併送達於他造。\n簡易訴訟程序事件行言詞辯論終結者，指定宣示判決之期日，自辯論終結時起，不得逾二星期。但案情繁雜或有特殊情形者，不在此限。","title":"第 二 章 簡易訴訟程序"},{"no":"第234條","text":"判決書內之事實、理由，得不分項記載，並得僅記載其要領。\n地方行政法院亦得於宣示判決時，命將判決主文及其事實、理由之要領，記載於言詞辯論筆錄或宣示判決筆錄，不另作判決書。\n前項筆錄正本或節本，應分別記明之，由書記官簽名並蓋法院印。\n第二項筆錄正本或節本之送達，與判決正本之送達，有同一之效力。","title":"第 二 章 簡易訴訟程序"},{"no":"第235條","text":"（刪除）","title":"第 二 章 簡易訴訟程序"},{"no":"第235-1條","text":"（刪除）","title":"第 二 章 簡易訴訟程序"},{"no":"第236條","text":"簡易訴訟程序除本章別有規定外，仍適用通常訴訟程序之規定。","title":"第 二 章 簡易訴訟程序"},{"no":"第236-1條","text":"（刪除）","title":"第 二 章 簡易訴訟程序"},{"no":"第236-2條","text":"（刪除）","title":"第 二 章 簡易訴訟程序"},{"no":"第237條","text":"民事訴訟法第四百三十條、第四百三十一條及第四百三十三條之規定，於本章準用之。","title":"第 二 章 簡易訴訟程序"},{"no":"第237-1條","text":"本法所稱交通裁決事件如下：\n一、不服道路交通管理處罰條例第八條及第三十七條第六項之裁決，而提起之撤銷訴訟、確認訴訟。\n二、合併請求返還與前款裁決相關之已繳納罰鍰或已繳送之駕駛執照、計程車駕駛人執業登記證、汽車牌照。\n合併提起前項以外之訴訟者，應適用簡易訴訟程序或通常訴訟程序之規定。\n第二百三十七條之二、第二百三十七條之三、第二百三十七條之四第一項及第二項規定，於前項情形準用之。","title":"第 三 章 交通裁決事件訴訟程序"},{"no":"第237-2條","text":"交通裁決事件，得由原告住所地、居所地、所在地或違規行為地之地方行政法院管轄。","title":"第 三 章 交通裁決事件訴訟程序"},{"no":"第237-3條","text":"交通裁決事件訴訟之提起，應以原處分機關為被告，逕向管轄之地方行政法院為之。\n交通裁決事件中撤銷訴訟之提起，應於裁決書送達後三十日之不變期間內為之。\n前項訴訟，因原處分機關未為告知或告知錯誤，致原告於裁決書送達三十日內誤向原處分機關遞送起訴狀者，視為已遵守起訴期間，原處分機關並應即將起訴狀移送管轄法院。","title":"第 三 章 交通裁決事件訴訟程序"},{"no":"第237-4條","text":"地方行政法院收受前條起訴狀後，應將起訴狀繕本送達被告。\n被告收受起訴狀繕本後，應於二十日內重新審查原裁決是否合法妥當，並分別為如下之處置：\n一、原告提起撤銷之訴，被告認原裁決違法或不當者，應自行撤銷或變更原裁決。但不得為更不利益之處分。\n二、原告提起確認之訴，被告認原裁決無效或違法者，應為確認。\n三、原告合併提起給付之訴，被告認原告請求有理由者，應即返還。\n四、被告重新審查後，不依原告之請求處置者，應附具答辯狀，並將重新審查之紀錄及其他必要之關係文件，一併提出於管轄之地方行政法院。\n被告依前項第一款至第三款規定為處置者，應即陳報管轄之地方行政法院；被告於第一審終局裁判生效前已完全依原告之請求處置者，以其陳報管轄之地方行政法院時，視為原告撤回起訴。","title":"第 三 章 交通裁決事件訴訟程序"},{"no":"第237-5條","text":"交通裁決事件，按下列規定徵收裁判費：\n一、起訴，按件徵收新臺幣三百元。\n二、上訴，按件徵收新臺幣七百五十元。\n三、抗告，徵收新臺幣三百元。\n四、再審之訴，按起訴法院之審級，依第一款、第二款徵收裁判費；對於確定之裁定聲請再審者，徵收新臺幣三百元。\n五、本法第九十八條之五各款聲請，徵收新臺幣三百元。\n依前條第三項規定，視為撤回起訴者，法院應依職權退還已繳之裁判費。","title":"第 三 章 交通裁決事件訴訟程序"},{"no":"第237-6條","text":"因訴之變更、追加，致其訴之全部或一部，不屬於交通裁決事件之範圍者，地方行政法院應改依簡易訴訟程序或通常訴訟程序審理；無通常訴訟程序管轄權者，應裁定移送管轄之高等行政法院。","title":"第 三 章 交通裁決事件訴訟程序"},{"no":"第237-7條","text":"交通裁決事件之裁判，得不經言詞辯論為之。","title":"第 三 章 交通裁決事件訴訟程序"},{"no":"第237-8條","text":"行政法院為訴訟費用之裁判時，應確定其費用額。\n前項情形，行政法院得命當事人提出費用計算書及釋明費用額之文書。","title":"第 三 章 交通裁決事件訴訟程序"},{"no":"第237-9條","text":"交通裁決事件，除本章別有規定外，準用簡易訴訟程序之規定。","title":"第 三 章 交通裁決事件訴訟程序"},{"no":"第237-10條","text":"本法所稱收容聲請事件如下：\n一、依入出國及移民法、臺灣地區與大陸地區人民關係條例及香港澳門關係條例提起收容異議、聲請續予收容及延長收容事件。\n二、依本法聲請停止收容事件。","title":"第 四 章 收容聲請事件程序"},{"no":"第237-11條","text":"收容聲請事件，以地方行政法院為第一審管轄法院。\n前項事件，由受收容人所在地之地方行政法院管轄，不適用第十三條之規定。","title":"第 四 章 收容聲請事件程序"},{"no":"第237-12條","text":"行政法院審理收容異議、續予收容及延長收容之聲請事件，應訊問受收容人；移民署並應到場陳述。\n行政法院審理前項聲請事件時，得徵詢移民署為其他收容替代處分之可能，以供審酌收容之必要性。","title":"第 四 章 收容聲請事件程序"},{"no":"第237-13條","text":"行政法院裁定續予收容或延長收容後，受收容人及得提起收容異議之人，認為收容原因消滅、無收容必要或有得不予收容情形者，得聲請法院停止收容。\n行政法院審理前項事件，認有必要時，得訊問受收容人或徵詢移民署之意見，並準用前條第二項之規定。","title":"第 四 章 收容聲請事件程序"},{"no":"第237-14條","text":"行政法院認收容異議、停止收容之聲請為無理由者，應以裁定駁回之。認有理由者，應為釋放受收容人之裁定。\n行政法院認續予收容、延長收容之聲請為無理由者，應以裁定駁回之。認有理由者，應為續予收容或延長收容之裁定。","title":"第 四 章 收容聲請事件程序"},{"no":"第237-15條","text":"行政法院所為續予收容或延長收容之裁定，應於收容期間屆滿前當庭宣示或以正本送達受收容人。未於收容期間屆滿前為之者，續予收容或延長收容之裁定，視為撤銷。\n前項正本以電子文件為之者，應以囑託收容處所長官列印裁定影本交付之方式為送達。","title":"第 四 章 收容聲請事件程序"},{"no":"第237-16條","text":"聲請人、受裁定人或移民署對地方行政法院所為收容聲請事件之裁定不服者，應於裁定送達後五日內抗告於管轄之高等行政法院。對於抗告法院之裁定，不得再為抗告。\n抗告程序，除依前項規定外，準用第四編之規定。\n收容聲請事件之裁定已確定，而有第二百七十三條之情形者，得準用第五編之規定，聲請再審。","title":"第 四 章 收容聲請事件程序"},{"no":"第237-17條","text":"行政法院受理收容聲請事件，不適用第一編第四章第五節訴訟費用之規定。但依第九十八條之六第一項第一款之規定徵收者，不在此限。\n收容聲請事件，除本章別有規定外，準用簡易訴訟程序之規定。","title":"第 四 章 收容聲請事件程序"},{"no":"第237-18條","text":"人民、地方自治團體或其他公法人認為行政機關依都市計畫法發布之都市計畫違法，而直接損害、因適用而損害或在可預見之時間內將損害其權利或法律上利益者，得依本章規定，以核定都市計畫之行政機關為被告，逕向管轄之高等行政法院提起訴訟，請求宣告該都市計畫無效。\n前項情形，不得與非行本章程序之其他訴訟合併提起。","title":"第 五 章 都市計畫審查程序"},{"no":"第237-19條","text":"前條訴訟，專屬都市計畫區所在地之高等行政法院管轄。","title":"第 五 章 都市計畫審查程序"},{"no":"第237-20條","text":"本章訴訟，應於都市計畫發布後一年之不變期間內提起。但都市計畫發布後始發生違法之原因者，應自原因發生時起算。","title":"第 五 章 都市計畫審查程序"},{"no":"第237-21條","text":"高等行政法院收受起訴狀後，應將起訴狀繕本送達被告。\n被告收受起訴狀繕本後，應於二個月內重新檢討原告請求宣告無效之都市計畫是否合法，並分別依下列規定辦理：\n一、如認其違反作成之程序規定得補正者，應為補正，並陳報高等行政法院。\n二、如認其違法者，應將其違法情形陳報高等行政法院，並得為必要之處置。\n三、如認其合法者，應於答辯狀說明其理由。\n被告應附具答辯狀，並將原都市計畫與重新檢討之卷證及其他必要文件，一併提出於管轄之高等行政法院。如有與原告請求宣告無效之都市計畫具不可分關係者，亦應一併陳報。","title":"第 五 章 都市計畫審查程序"},{"no":"第237-22條","text":"高等行政法院受理都市計畫審查程序事件，不適用前編第三章第四節訴訟參加之規定。","title":"第 五 章 都市計畫審查程序"},{"no":"第237-23條","text":"高等行政法院認為都市計畫如宣告無效、失效或違法，第三人之權利或法律上利益將直接受損害者，得依職權命其參加訴訟，並得因該第三人之聲請，裁定允許其參加。\n前項情形，準用第四十二條第二項、第四十三條、第四十五條及第四十七條規定。\n依第一項參加訴訟之人為訴訟當事人。","title":"第 五 章 都市計畫審查程序"},{"no":"第237-24條","text":"都市計畫審查程序事件，高等行政法院認為具利害關係之第三人有輔助一造之必要者，得命其參加訴訟。有利害關係之第三人亦得聲請參加。\n前項情形，準用民事訴訟法第五十九條至第六十一條及第六十三條至第六十七條之規定。","title":"第 五 章 都市計畫審查程序"},{"no":"第237-25條","text":"高等行政法院審理都市計畫審查程序事件，應依職權通知都市計畫之擬定機關及發布機關於期日到場陳述意見，並得通知權限受都市計畫影響之行政機關於期日到場陳述意見。權限受都市計畫影響之行政機關亦得聲請於期日到場陳述意見。","title":"第 五 章 都市計畫審查程序"},{"no":"第237-26條","text":"都市計畫審查程序事件已經訴訟繫屬尚未終結，同一都市計畫經聲請憲法法庭判決宣告違憲者，高等行政法院在憲法法庭審理程序終結前，得以裁定停止訴訟程序。","title":"第 五 章 都市計畫審查程序"},{"no":"第237-27條","text":"高等行政法院認都市計畫未違法者，應以判決駁回原告之訴。都市計畫僅違反作成之程序規定，而已於第一審言詞辯論終結前合法補正者，亦同。","title":"第 五 章 都市計畫審查程序"},{"no":"第237-28條","text":"高等行政法院認原告請求宣告無效之都市計畫違法者，應宣告該都市計畫無效。同一都市計畫中未經原告請求，而與原告請求宣告無效之部分具不可分關係，經法院審查認定違法者，併宣告無效。\n前項情形，都市計畫發布後始發生違法原因者，應宣告自違法原因發生時起失效。\n都市計畫違法，而依法僅得為違法之宣告者，應宣告其違法。\n前三項確定判決，對第三人亦有效力。\n第一項情形，高等行政法院認與原告請求宣告無效之部分具不可分關係之不同都市計畫亦違法者，得於判決理由中一併敘明。","title":"第 五 章 都市計畫審查程序"},{"no":"第237-29條","text":"都市計畫經判決宣告無效、失效或違法確定者，判決正本應送達原發布機關，由原發布機關依都市計畫發布方式公告判決主文。\n因前項判決致刑事確定裁判違背法令者，得依刑事訴訟法規定提起非常上訴。\n前項以外之確定裁判，其效力不受影響。但該裁判尚未執行或執行未完畢者，自宣告都市計畫無效或失效之判決確定之日起，於無效或失效之範圍內不得強制執行。\n適用第一項受無效或失效宣告之都市計畫作成之行政處分確定者，其效力與後續執行準用前項之規定。\n依前條第三項宣告都市計畫違法確定者，相關機關應依判決意旨為必要之處置。","title":"第 五 章 都市計畫審查程序"},{"no":"第237-30條","text":"於爭執之都市計畫，為防止發生重大之損害或避免急迫之危險而有必要時，得聲請管轄本案之行政法院暫時停止適用或執行，或為其他必要之處置。\n前項情形，準用第二百九十五條至第二百九十七條、第二百九十八條第三項、第四項、第三百零一條及第三百零三條之規定。\n行政法院裁定准許第一項之聲請者，準用前條第一項規定。該裁定經廢棄、變更或撤銷者，亦同。","title":"第 五 章 都市計畫審查程序"},{"no":"第237-31條","text":"都市計畫審查程序，除本章別有規定外，準用本編第一章之規定。","title":"第 五 章 都市計畫審查程序"},{"no":"第238條","text":"對於高等行政法院之終局判決，除法律別有規定外，得上訴於最高行政法院。\n於上訴審程序，不得為訴之變更、追加或提起反訴。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第239條","text":"前條判決前之裁判，牽涉該判決者，並受最高行政法院之審判。但依本法不得聲明不服或得以抗告聲明不服者，不在此限。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第240條","text":"當事人於高等行政法院判決宣示、公告或送達後，得捨棄上訴權。\n當事人於宣示判決時，以言詞捨棄上訴權者，應記載於言詞辯論筆錄；如他造不在場，應將筆錄送達。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第241條","text":"提起上訴，應於高等行政法院判決送達後二十日之不變期間內為之。但宣示或公告後送達前之上訴，亦有效力。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第241-1條","text":"（刪除）","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第242條","text":"對於高等行政法院判決之上訴，非以其違背法令為理由，不得為之。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第243條","text":"判決不適用法規或適用不當者，為違背法令。\n有下列各款情形之一者，其判決當然違背法令：\n一、判決法院之組織不合法。\n二、依法律或裁判應迴避之法官參與裁判。\n三、行政法院於審判權之有無辨別不當或違背專屬管轄之規定。但其他法律別有規定者，從其規定。\n四、當事人於訴訟未經合法代理或代表。\n五、違背言詞辯論公開之規定。\n六、判決不備理由或理由矛盾。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第244條","text":"提起上訴，應以上訴狀表明下列各款事項，提出於原高等行政法院為之：\n一、當事人。\n二、高等行政法院判決，及對於該判決上訴之陳述。\n三、對於高等行政法院判決不服之程度，及應如何廢棄或變更之聲明。\n四、上訴理由。\n前項上訴理由應表明下列各款事項：\n一、原判決所違背之法令及其具體內容。\n二、依訴訟資料合於該違背法令之具體事實。\n第一項上訴狀內並應添具關於上訴理由之必要證據。\n在監獄或看守所之當事人，於上訴期間內向監所長官提出上訴狀者，視為上訴期間內之上訴；監所長官接受上訴狀後，應附記接受之年、月、日、時，送交原高等行政法院。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第245條","text":"上訴狀內未表明上訴理由者，上訴人應於提起上訴後二十日內提出理由書於原高等行政法院；未提出者，毋庸命其補正，由原高等行政法院以裁定駁回之。\n判決宣示或公告後送達前提起上訴者，前項期間應自判決送達後起算。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第246條","text":"上訴不合法而其情形不能補正者，原高等行政法院應以裁定駁回之。\n上訴不合法而其情形可以補正者，原高等行政法院應定期間命其補正；如不於期間內補正，原高等行政法院應以裁定駁回之。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第247條","text":"上訴未經依前條規定駁回者，高等行政法院應速將上訴狀送達被上訴人。\n被上訴人得於上訴狀或第二百四十五條第一項理由書送達後十五日內，提出答辯狀於原高等行政法院。\n高等行政法院送交訴訟卷宗於最高行政法院，應於收到答辯狀或前項期間已滿，及各當事人之上訴期間已滿後為之。\n前項應送交之卷宗，如為高等行政法院所需者，應自備繕本、影本或節本。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第248條","text":"被上訴人在最高行政法院未判決前得提出答辯狀及其追加書狀於最高行政法院，上訴人亦得提出上訴理由追加書狀。\n最高行政法院認有必要時，得將前項書狀送達於他造。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第249條","text":"上訴不合法者，最高行政法院應以裁定駁回之。但其情形可以補正者，審判長應先定期間命補正。\n上訴不合法之情形，已經原高等行政法院命補正而未補正者，得不行前項但書之程序。\n最高行政法院認上訴人之上訴基於惡意、不當或其他濫用訴訟程序之目的或有重大過失，且事實上或法律上之主張欠缺合理依據，應以裁定駁回之。但其情形可以補正者，審判長應先定期間命補正。\n最高行政法院依前項規定駁回上訴者，得各處上訴人、代表人或管理人、代理人新臺幣十二萬元以下之罰鍰。\n第一百零七條第五項及第七項前段規定，於前二項情形準用之。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第250條","text":"上訴之聲明不得變更或擴張之。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第251條","text":"最高行政法院應於上訴聲明之範圍內調查之。\n最高行政法院調查高等行政法院判決有無違背法令，不受上訴理由之拘束。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第252條","text":"（刪除）","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第253條","text":"最高行政法院之判決，有下列情形之一者，應行言詞辯論：\n一、法律關係複雜或法律見解紛歧，有以言詞辯明之必要。\n二、涉及專門知識或特殊經驗法則，有以言詞說明之必要。\n三、涉及公益或影響當事人權利義務重大，有行言詞辯論之必要。\n前項言詞辯論實施之辦法由最高行政法院定之。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第253-1條","text":"言詞辯論應於上訴聲明之範圍內為之。\n言詞辯論期日，被上訴人、依第四十一條、第四十二條參加訴訟之人未委任訴訟代理人或當事人一造之訴訟代理人無正當理由未到場者，得依職權由到場之訴訟代理人辯論而為判決。當事人之訴訟代理人無正當理由均未到場者，得不行言詞辯論，逕為判決。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第254條","text":"除別有規定外，最高行政法院應以高等行政法院判決確定之事實為判決基礎。\n以違背訴訟程序之規定為上訴理由時，所舉違背之事實，及以違背法令確定事實或遺漏事實為上訴理由時，所舉之該事實，最高行政法院得斟酌之。\n行言詞辯論所得闡明或補充訴訟關係之資料，最高行政法院亦得斟酌之。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第255條","text":"最高行政法院認上訴為無理由者，應為駁回之判決。\n原判決依其理由雖屬不當，而依其他理由認為正當者，應以上訴為無理由。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第256條","text":"最高行政法院認上訴為有理由者，就該部分應廢棄原判決。\n因違背訴訟程序之規定廢棄原判決者，其違背之訴訟程序部分，視為亦經廢棄。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第256-1條","text":"以地方行政法院為第一審管轄法院之事件，高等行政法院依通常訴訟程序審理並為判決者，最高行政法院不得以高等行政法院無管轄權而廢棄原判決。\n前項情形，最高行政法院應依該事件所應適用之上訴審程序規定為裁判。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第257條","text":"最高行政法院不得以高等行政法院無管轄權而廢棄原判決。但違背專屬管轄之規定者，不在此限。\n因高等行政法院無管轄權而廢棄原判決者，應以判決將該事件移送於管轄行政法院。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第258條","text":"除第二百四十三條第二項第一款至第五款之情形外，高等行政法院判決違背法令而不影響裁判之結果者，不得廢棄原判決。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第259條","text":"經廢棄原判決而有下列各款情形之一者，最高行政法院應就該事件自為判決：\n一、因基於確定之事實或依法得斟酌之事實，不適用法規或適用不當廢棄原判決，而事件已可依該事實為裁判。\n二、原判決就欠缺實體判決要件之事件誤為實體判決。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第259-1條","text":"最高行政法院駁回上訴或廢棄原判決自為裁判時，法官對於裁判之主文或理由，已於評議時提出與多數意見不同之法律上意見，經記明於評議簿，並於評決後三日內補具書面者，得於裁判附記之；逾期提出者，不予附記。\n前項實施之辦法由最高行政法院定之。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第260條","text":"除別有規定外，經廢棄原判決者，最高行政法院應將該事件發回原高等行政法院或發交其他高等行政法院。\n前項發回或發交判決，就高等行政法院應調查之事項，應詳予指示。\n受發回或發交之高等行政法院，應以最高行政法院所為廢棄理由之法律上判斷為其判決基礎。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第261條","text":"為發回或發交之判決者，最高行政法院應速將判決正本附入卷宗，送交受發回或發交之高等行政法院。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第261-1條","text":"最高行政法院判決書應記載之事實及理由，如與高等行政法院判決相同者，得引用之。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第262條","text":"上訴人於終局判決宣示或公告前得將上訴撤回。\n撤回上訴者，喪失其上訴權。\n上訴之撤回，應以書狀為之。但在言詞辯論時，得以言詞為之。\n於言詞辯論時所為上訴之撤回，應記載於言詞辯論筆錄，如他造不在場，應將筆錄送達。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第263條","text":"除本編別有規定外，前編第一章及第五章之規定，於最高行政法院上訴審程序準用之。","title":"第 一 章 最高行政法院上訴審程序"},{"no":"第263-1條","text":"對於地方行政法院之終局判決，除法律別有規定外，得依本章規定上訴於管轄之高等行政法院。\n對於高等行政法院之第二審判決，不得上訴。","title":"第 二 章 高等行政法院上訴審程序"},{"no":"第263-2條","text":"應適用簡易訴訟程序或交通裁決訴訟程序之事件，高等行政法院不得以地方行政法院行通常訴訟程序而廢棄原判決。\n應適用交通裁決訴訟程序之事件，高等行政法院不得以地方行政法院行簡易訴訟程序而廢棄原判決。\n前二項情形，高等行政法院應依該事件所應適用之上訴審程序規定為裁判。","title":"第 二 章 高等行政法院上訴審程序"},{"no":"第263-3條","text":"地方行政法院就其應適用通常訴訟程序之事件，而誤用簡易訴訟程序或交通裁決事件訴訟程序審判；或應適用簡易訴訟程序之事件，而誤用交通裁決事件訴訟程序審判者，受理上訴之高等行政法院應廢棄原判決，將該事件發回或發交管轄地方行政法院。\n以高等行政法院為第一審管轄法院之事件，誤由地方行政法院審判者，受理上訴之高等行政法院應廢棄原判決，逕依通常訴訟程序為第一審判決。\n當事人對於第一項程序誤用或第二項管轄錯誤已表示無異議，或明知或可得而知並無異議而就本案有所聲明或陳述者，高等行政法院應依原程序之上訴審規定為裁判，不適用前二項規定。","title":"第 二 章 高等行政法院上訴審程序"},{"no":"第263-4條","text":"高等行政法院受理上訴事件，認有確保裁判見解統一之必要者，應以裁定敘明理由移送最高行政法院裁判之。\n高等行政法院審理上訴事件期間，當事人認為足以影響裁判結果之法律見解，先前裁判之法律見解已產生歧異，得向受理本案之高等行政法院聲請以裁定敘明理由移送最高行政法院裁判之。其程序準用行政法院組織法第十五條之四規定。\n前二項之移送裁定及駁回聲請之裁定，均不得聲明不服。\n最高行政法院認高等行政法院裁定移送之事件，並未涉及裁判見解統一之必要者，應以裁定發回。受發回之高等行政法院，不得再將上訴事件裁定移送最高行政法院。\n除前項情形外，最高行政法院各庭應先以徵詢書徵詢其他庭之意見，並準用行政法院組織法第十五條之一、第十五條之二、第十五條之五至第十五條之十一規定。","title":"第 二 章 高等行政法院上訴審程序"},{"no":"第263-5條","text":"除第二百五十九條之一及本章別有規定外，本編第一章及前編第一章之規定，於高等行政法院上訴審程序準用之；交通裁決事件之上訴，並準用第二百三十七條之八規定。","title":"第 二 章 高等行政法院上訴審程序"},{"no":"第264條","text":"對於裁定得為抗告。但別有不許抗告之規定者，不在此限。","title":"第 四 編 抗告程序"},{"no":"第265條","text":"訴訟程序進行中所為之裁定，除別有規定外，不得抗告。","title":"第 四 編 抗告程序"},{"no":"第266條","text":"受命法官或受託法官之裁定，不得抗告。但其裁定如係受訴行政法院所為而依法得為抗告者，得向受訴行政法院提出異議。\n前項異議，準用對於行政法院同種裁定抗告之規定。\n受訴行政法院就異議所為之裁定，得依本編之規定抗告。\n繫屬於上訴審行政法院之事件，受命法官、受託法官所為之裁定，得向受訴行政法院提出異議。其不得上訴之事件，第一審行政法院受命法官、受託法官所為之裁定，亦同。","title":"第 四 編 抗告程序"},{"no":"第267條","text":"抗告，由直接上級行政法院裁定。\n對於抗告法院之裁定，不得再為抗告。","title":"第 四 編 抗告程序"},{"no":"第268條","text":"提起抗告，應於裁定送達後十日之不變期間內為之。但送達前之抗告亦有效力。","title":"第 四 編 抗告程序"},{"no":"第269條","text":"提起抗告，應向為裁定之原行政法院或原審判長所屬行政法院提出抗告狀為之。\n關於訴訟救助提起抗告，及由證人、鑑定人或執有證物之第三人提起抗告者，得以言詞為之。","title":"第 四 編 抗告程序"},{"no":"第270條","text":"關於捨棄上訴權及撤回上訴之規定，於抗告準用之。","title":"第 四 編 抗告程序"},{"no":"第271條","text":"依本編規定，應為抗告而誤為異議者，視為已提起抗告；應提出異議而誤為抗告者，視為已提出異議。","title":"第 四 編 抗告程序"},{"no":"第272條","text":"除本編別有規定外，第二百四十九條第三項至第五項、第二百五十六條之一、第二百六十一條之一、第二百六十三條之二至第二百六十三條之四規定，於抗告程序準用之。\n第二百五十九條之一規定，於最高行政法院抗告程序準用之。\n民事訴訟法第四百九十條至第四百九十二條及第三編第一章之規定，於本編準用之。","title":"第 四 編 抗告程序"},{"no":"第273條","text":"有下列各款情形之一者，得以再審之訴對於確定終局判決聲明不服。但當事人已依上訴主張其事由經判決為無理由，或知其事由而不為上訴主張者，不在此限：\n一、適用法規顯有錯誤。\n二、判決理由與主文顯有矛盾。\n三、判決法院之組織不合法。\n四、依法律或裁判應迴避之法官參與裁判。\n五、當事人於訴訟未經合法代理或代表。但當事人知訴訟代理權有欠缺而未於該訴訟言詞辯論終結前爭執者，不在此限。\n六、當事人知他造應為送達之處所，指為所在不明而與涉訟。但他造已承認其訴訟程序者，不在此限。\n七、參與裁判之法官關於該訴訟違背職務，犯刑事上之罪已經證明，或關於該訴訟違背職務受懲戒處分，足以影響原判決。\n八、當事人之代理人、代表人、管理人或他造或其代理人、代表人、管理人關於該訴訟有刑事上應罰之行為，影響於判決。\n九、為判決基礎之證物係偽造或變造。\n十、證人、鑑定人或通譯就為判決基礎之證言、鑑定或通譯為虛偽陳述。\n十一、為判決基礎之民事或刑事判決及其他裁判或行政處分，依其後之確定裁判或行政處分已變更。\n十二、當事人發現就同一訴訟標的在前已有確定判決、和解或調解或得使用該判決、和解或調解。\n十三、當事人發現未經斟酌之證物或得使用該證物。但以如經斟酌可受較有利益之判決為限。\n十四、原判決就足以影響於判決之重要證物漏未斟酌。\n確定終局判決所適用之法規範，經憲法法庭判決宣告違憲，或適用法規範所表示之見解，與憲法法庭統一見解之裁判有異者，其聲請人亦得提起再審之訴。\n第一項第七款至第十款情形之證明，以經判決確定，或其刑事、懲戒訴訟不能開始、續行或判決不受理、免議非因證據不足者為限，得提起再審之訴。\n第一項第十三款情形，以當事人非因可歸責於己之事由，不能於該訴訟言詞辯論終結前提出者為限，得提起再審之訴。","title":"第 五 編 再審程序"},{"no":"第274條","text":"為判決基礎之裁判，如有前條所定之情形者，得據以對於該判決提起再審之訴。","title":"第 五 編 再審程序"},{"no":"第274-1條","text":"再審之訴，行政法院認無再審理由，判決駁回後，不得以同一事由對於原確定判決或駁回再審之訴之確定判決，更行提起再審之訴。","title":"第 五 編 再審程序"},{"no":"第275條","text":"再審之訴專屬為判決之原行政法院管轄。\n對於審級不同之行政法院就同一事件所為之判決提起再審之訴者，專屬上級行政法院合併管轄之。\n對於上訴審行政法院之判決，本於第二百七十三條第一項第九款至第十四款事由聲明不服者，雖有前二項之情形，仍專屬原第一審行政法院管轄。","title":"第 五 編 再審程序"},{"no":"第276條","text":"再審之訴應於三十日之不變期間內提起。\n前項期間自判決確定時起算，判決於送達前確定者，自送達時起算；其再審事由發生或知悉在後者，均自知悉時起算。\n依第二百七十三條第二項提起再審之訴者，第一項期間自裁判送達之翌日起算。\n再審之訴自判決確定時起，如已逾五年者，不得提起。但以第二百七十三條第一項第五款、第六款或第十二款情形為再審事由者，不在此限。\n對於再審確定判決不服，復提起再審之訴者，前項所定期間，自原判決確定時起算。但再審之訴有理由者，自該再審判決確定時起算。\n第二百七十三條第二項之情形，自聲請案件繫屬之日起至裁判送達聲請人之日止，不計入第四項所定期間。","title":"第 五 編 再審程序"},{"no":"第277條","text":"再審之訴，應以訴狀表明下列各款事項，提出於管轄行政法院為之：\n一、當事人。\n二、聲明不服之判決及提起再審之訴之陳述。\n三、應於如何程度廢棄原判決及就本案如何判決之聲明。\n四、再審理由及關於再審理由並遵守不變期間之證據。\n再審訴狀內，宜記載準備本案言詞辯論之事項，並添具確定終局判決繕本或影本。","title":"第 五 編 再審程序"},{"no":"第278條","text":"再審之訴不合法者，行政法院應以裁定駁回之。\n再審之訴顯無再審理由者，得不經言詞辯論，以判決駁回之。","title":"第 五 編 再審程序"},{"no":"第279條","text":"本案之辯論及裁判，以聲明不服之部分為限。","title":"第 五 編 再審程序"},{"no":"第280條","text":"再審之訴雖有再審理由，行政法院如認原判決為正當者，應以判決駁回之。","title":"第 五 編 再審程序"},{"no":"第281條","text":"除本編別有規定外，再審之訴訟程序準用關於各該審級訴訟程序之規定。","title":"第 五 編 再審程序"},{"no":"第282條","text":"再審之訴之判決，對第三人因信賴確定終局判決以善意取得之權利無影響。但顯於公益有重大妨害者，不在此限。","title":"第 五 編 再審程序"},{"no":"第283條","text":"裁定已經確定，而有第二百七十三條之情形者，得準用本編之規定，聲請再審。","title":"第 五 編 再審程序"},{"no":"第284條","text":"因撤銷或變更原處分或決定之判決，而權利受損害之第三人，如非可歸責於己之事由，未參加訴訟，致不能提出足以影響判決結果之攻擊或防禦方法者，得對於確定終局判決聲請重新審理。\n前項聲請，應於知悉確定判決之日起三十日之不變期間內為之。但自判決確定之日起已逾一年者，不得聲請。","title":"第 六 編 重新審理"},{"no":"第285條","text":"重新審理之聲請準用第二百七十五條第一項、第二項管轄之規定。","title":"第 六 編 重新審理"},{"no":"第286條","text":"聲請重新審理，應以聲請狀表明下列各款事項，提出於管轄行政法院為之：\n一、聲請人及原訴訟之兩造當事人。\n二、聲請重新審理之事件，及聲請重新審理之陳述。\n三、就本案應為如何判決之聲明。\n四、聲請理由及關於聲請理由並遵守不變期間之證據。\n聲請狀內，宜記載準備本案言詞辯論之事項。","title":"第 六 編 重新審理"},{"no":"第287條","text":"聲請重新審理不合法者，行政法院應以裁定駁回之。","title":"第 六 編 重新審理"},{"no":"第288條","text":"行政法院認為第二百八十四條第一項之聲請有理由者，應以裁定命為重新審理；認為無理由者，應以裁定駁回之。","title":"第 六 編 重新審理"},{"no":"第289條","text":"聲請人於前二條裁定確定前得撤回其聲請。\n撤回聲請者，喪失其聲請權。\n聲請之撤回，得以書狀或言詞為之。","title":"第 六 編 重新審理"},{"no":"第290條","text":"開始重新審理之裁定確定後，應即回復原訴訟程序，依其審級更為審判。\n聲請人於回復原訴訟程序後，當然參加訴訟。","title":"第 六 編 重新審理"},{"no":"第291條","text":"聲請重新審理無停止原確定判決執行之效力。但行政法院認有必要時，得命停止執行。","title":"第 六 編 重新審理"},{"no":"第292條","text":"第二百八十二條之規定於重新審理準用之。","title":"第 六 編 重新審理"},{"no":"第293條","text":"為保全公法上金錢給付之強制執行，得聲請假扣押。\n前項聲請，就未到履行期之給付，亦得為之。","title":"第 七 編 保全程序"},{"no":"第294條","text":"假扣押之聲請，由管轄本案之行政法院或假扣押標的所在地之地方行政法院管轄。\n管轄本案之行政法院為訴訟已繫屬或應繫屬之第一審法院。\n假扣押之標的如係債權，以債務人住所或擔保之標的所在地，為假扣押標的所在地。","title":"第 七 編 保全程序"},{"no":"第295條","text":"假扣押裁定後，尚未提起給付之訴者，應於裁定送達後十日內提起；逾期未起訴者，行政法院應依聲請撤銷假扣押裁定。","title":"第 七 編 保全程序"},{"no":"第296條","text":"假扣押裁定因自始不當而撤銷，或因前條及民事訴訟法第五百三十條第三項之規定而撤銷者，債權人應賠償債務人因假扣押或供擔保所受之損害。\n假扣押所保全之本案請求已起訴者，前項賠償，行政法院於言詞辯論終結前，應依債務人之聲明，於本案判決內命債權人為賠償；債務人未聲明者，應告以得為聲明。","title":"第 七 編 保全程序"},{"no":"第297條","text":"民事訴訟法第五百二十三條、第五百二十五條至第五百二十八條及第五百三十條之規定，於本編假扣押程序準用之。","title":"第 七 編 保全程序"},{"no":"第298條","text":"公法上之權利因現狀變更，有不能實現或甚難實現之虞者，為保全強制執行，得聲請假處分。\n於爭執之公法上法律關係，為防止發生重大之損害或避免急迫之危險而有必要時，得聲請為定暫時狀態之處分。\n前項處分，得命先為一定之給付。\n行政法院為假處分裁定前，得訊問當事人、關係人或為其他必要之調查。","title":"第 七 編 保全程序"},{"no":"第299條","text":"得依第一百十六條請求停止原處分或決定之執行者，不得聲請為前條之假處分。","title":"第 七 編 保全程序"},{"no":"第300條","text":"假處分之聲請，由管轄本案之行政法院管轄。但有急迫情形時，得由請求標的所在地之地方行政法院管轄。","title":"第 七 編 保全程序"},{"no":"第301條","text":"關於假處分之請求及原因，非有特別情事，不得命供擔保以代釋明。","title":"第 七 編 保全程序"},{"no":"第302條","text":"除別有規定外，關於假扣押之規定，於假處分準用之。","title":"第 七 編 保全程序"},{"no":"第303條","text":"民事訴訟法第五百三十五條及第五百三十六條之規定，於本編假處分程序準用之。","title":"第 七 編 保全程序"},{"no":"第304條","text":"撤銷判決確定者，關係機關應即為實現判決內容之必要處置。","title":"第 八 編 強制執行"},{"no":"第305條","text":"行政訴訟之裁判命債務人為一定之給付，經裁判確定後，債務人不為給付者，債權人得以之為執行名義，聲請地方行政法院強制執行。\n地方行政法院應先定相當期間通知債務人履行；逾期不履行者，強制執行。\n債務人為中央或地方機關或其他公法人者，並應通知其上級機關督促其如期履行。\n依本法成立之和解或調解，及其他依本法所為之裁定得為強制執行者，或科處罰鍰之裁定，均得為執行名義。","title":"第 八 編 強制執行"},{"no":"第306條","text":"地方行政法院為辦理行政訴訟強制執行事務，得囑託地方法院民事執行處或行政機關代為執行。\n執行程序，除本法別有規定外，應視執行機關為法院或行政機關而分別準用強制執行法或行政執行法之規定。\n債務人對第一項囑託代為執行之執行名義有異議者，由地方行政法院裁定之。","title":"第 八 編 強制執行"},{"no":"第307條","text":"債務人異議之訴，依作成執行名義之第一審行政法院，分別由地方行政法院或高等行政法院受理；其餘有關強制執行之訴訟，由普通法院受理。","title":"第 八 編 強制執行"},{"no":"第307-1條","text":"民事訴訟法之規定，除本法已規定準用者外，與行政訴訟性質不相牴觸者，亦準用之。","title":"第 九 編 附則"},{"no":"第308條","text":"本法自公布日施行。\n本法修正條文施行日期，由司法院以命令定之。","title":"第 九 編 附則"}],"tags":["救濟","行政訴訟"],"note":"第 2 條公法上爭議、第 8 條一般給付訴訟（公法契約爭議之救濟途徑）。"},{"id":"D03","name":"勞資爭議處理法","pcode":"N0020007","level":"法律","authority":"勞動部","category":"行政＞勞動部＞勞動關係目","modified_date":"2021-04-28","history":[{"date":"1928-06-09","summary":"中華民國十七年六月九日國民政府制定公布施行"},{"date":"1930-03-17","summary":"中華民國十九年三月十七日國民政府修正公布"},{"date":"1932-09-27","summary":"中華民國二十一年九月二十七日國民政府修正公布"},{"date":"1943-05-31","summary":"中華民國三十二年五月三十一日國民政府修正公布"},{"date":"1988-06-27","summary":"中華民國七十七年六月二十七日總統令修正公布 45 條"},{"date":"2000-07-19","summary":"中華民國八十九年七月十九日總統（89）華總一義字第 8900177640 號令修正公布第 3、11、28、30 條條文"},{"date":"2002-05-29","summary":"中華民國九十一年五月二十九日總統華總一義字第 09100108410 號令修正公布第 30 條條文"},{"date":"2009-07-01","summary":"中華民國九十八年七月一日總統華總一義字第 09800165161 號令修正公布全文 66 條；依第 66 條規定：施行日期，由行政院定之中華民國一百年四月二十六日行政院院臺勞字第 1000019757 號令發布定自一百年五月一日施行中華民國一百零三年二月十四日行政院院臺規字第 1030124618 號公告第 4 條所列屬「行政院勞工委員會」之權責事項，自一百零三年二月十七日起改由「勞動部」管轄"},{"date":"2015-07-01","summary":"中華民國一百零四年七月一日總統華總一義字第 10400077231 號令修正公布第 4 條條文；施行日期，由行政院定之中華民國一百零四年十月五日行政院院臺勞字第 1040046667 號令發布定自一百零四年七月三日施行"},{"date":"2017-01-18","summary":"中華民國一百零六年一月十八日總統華總一義字第 10600005891 號令修正公布第 6、43 條條文；施行日期，由行政院定之中華民國一百零六年四月二十一日行政院院臺勞字第 1060011491 號令發布定自一百零六年五月一日施行"},{"date":"2021-04-28","summary":"中華民國一百十年四月二十八日總統華總一義字第 11000038661 號令修正公布第 43 條條文；增訂第 47-1 條條文；施行日期，由行政院定之中華民國一百十年八月二十三日行政院院臺勞字第 1100025012 號令發布定自一百十年十月一日施行"}],"url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0020007","articles":[{"no":"第1條","text":"為處理勞資爭議，保障勞工權益，穩定勞動關係，特制定本法。","title":"第 一 章 總則"},{"no":"第2條","text":"勞資雙方當事人應本誠實信用及自治原則，解決勞資爭議。","title":"第 一 章 總則"},{"no":"第3條","text":"本法於雇主或有法人資格之雇主團體（以下簡稱雇主團體）與勞工或工會發生勞資爭議時，適用之。但教師之勞資爭議屬依法提起行政救濟之事項者，不適用之。","title":"第 一 章 總則"},{"no":"第4條","text":"本法所稱主管機關：在中央為勞動部；在直轄市為直轄市政府；在縣（市）為縣（市）政府。","title":"第 一 章 總則"},{"no":"第5條","text":"本法用詞，定義如下：\n一、勞資爭議：指權利事項及調整事項之勞資爭議。\n二、權利事項之勞資爭議：指勞資雙方當事人基於法令、團體協約、勞動契約之規定所為權利義務之爭議。\n三、調整事項之勞資爭議：指勞資雙方當事人對於勞動條件主張繼續維持或變更之爭議。\n四、爭議行為：指勞資爭議當事人為達成其主張，所為之罷工或其他阻礙事業正常運作及與之對抗之行為。\n五、罷工：指勞工所為暫時拒絕提供勞務之行為。","title":"第 一 章 總則"},{"no":"第6條","text":"權利事項之勞資爭議，得依本法所定之調解、仲裁或裁決程序處理之。\n法院為審理權利事項之勞資爭議，必要時應設勞工法庭。\n權利事項之勞資爭議，勞方當事人有下列情形之一者，中央主管機關得給予適當扶助：\n一、提起訴訟。\n二、依仲裁法提起仲裁。\n三、因工會法第三十五條第一項第一款至第四款所定事由，依本法申請裁決。\n前項扶助業務，中央主管機關得委託民間團體辦理。\n前二項扶助之申請資格、扶助範圍、審核方式及委託辦理等事項之辦法，由中央主管機關定之。","title":"第 一 章 總則"},{"no":"第7條","text":"調整事項之勞資爭議，依本法所定之調解、仲裁程序處理之。\n前項勞資爭議之勞方當事人，應為工會。但有下列情形者，亦得為勞方當事人：\n一、未加入工會，而具有相同主張之勞工達十人以上。\n二、受僱於僱用勞工未滿十人之事業單位，其未加入工會之勞工具有相同主張者達三分之二以上。","title":"第 一 章 總則"},{"no":"第8條","text":"勞資爭議在調解、仲裁或裁決期間，資方不得因該勞資爭議事件而歇業、停工、終止勞動契約或為其他不利於勞工之行為；勞方不得因該勞資爭議事件而罷工或為其他爭議行為。","title":"第 一 章 總則"},{"no":"第9條","text":"勞資爭議當事人一方申請調解時，應向勞方當事人勞務提供地之直轄市或縣（市）主管機關提出調解申請書。\n前項爭議當事人一方為團體協約法第十條第二項規定之機關（構）、學校者，其出席調解時之代理人應檢附同條項所定有核可權機關之同意書。\n第一項直轄市、縣（市）主管機關對於勞資爭議認為必要時，得依職權交付調解，並通知勞資爭議雙方當事人。\n第一項及前項調解，其勞方當事人有二人以上者，各勞方當事人勞務提供地之主管機關，就該調解案件均有管轄權。","title":"第 二 章 調解"},{"no":"第10條","text":"調解之申請，應提出調解申請書，並載明下列事項：\n一、當事人姓名、性別、年齡、職業及住所或居所；如為法人、雇主團體或工會時，其名稱、代表人及事務所或營業所；有代理人者，其姓名、名稱及住居所或事務所。\n二、請求調解事項。\n三、依第十一條第一項選定之調解方式。","title":"第 二 章 調解"},{"no":"第11條","text":"直轄市或縣（市）主管機關受理調解之申請，應依申請人之請求，以下列方式之一進行調解：\n一、指派調解人。\n二、組成勞資爭議調解委員會（以下簡稱調解委員會）。\n直轄市或縣（市）主管機關依職權交付調解者，得依前項方式之一進行調解。\n第一項第一款之調解，直轄市、縣（市）主管機關得委託民間團體指派調解人進行調解。\n第一項調解之相關處理程序、充任調解人或調解委員之遴聘條件與前項受託民間團體之資格及其他應遵行事項之辦法，由中央主管機關定之。\n主管機關對第三項之民間團體，除委託費用外，並得予補助。","title":"第 二 章 調解"},{"no":"第12條","text":"直轄市或縣（市）主管機關指派調解人進行調解者，應於收到調解申請書三日內為之。\n調解人應調查事實，並於指派之日起七日內開始進行調解。\n直轄市或縣（市）主管機關於調解人調查時，得通知當事人、相關人員或事業單位，以言詞或書面提出說明；調解人為調查之必要，得經主管機關同意，進入相關事業單位訪查。\n前項受通知或受訪查人員，不得為虛偽說明、提供不實資料或無正當理由拒絕說明。\n調解人應於開始進行調解十日內作出調解方案，並準用第十九條、第二十條及第二十二條之規定。","title":"第 二 章 調解"},{"no":"第13條","text":"調解委員會置委員三人或五人，由下列代表組成之，並以直轄市或縣（市）主管機關代表一人為主席：\n一、直轄市、縣（市）主管機關指派一人或三人。\n二、勞資爭議雙方當事人各自選定一人。","title":"第 二 章 調解"},{"no":"第14條","text":"直轄市、縣（市）主管機關以調解委員會方式進行調解者，應於收到調解申請書或職權交付調解後通知勞資爭議雙方當事人於收到通知之日起三日內各自選定調解委員，並將調解委員之姓名、性別、年齡、職業及住居所具報；屆期未選定者，由直轄市、縣（市）主管機關代為指定。\n前項主管機關得備置調解委員名冊，以供參考。","title":"第 二 章 調解"},{"no":"第15條","text":"直轄市、縣（市）主管機關以調解委員會方式進行調解者，應於調解委員完成選定或指定之日起十四日內，組成調解委員會並召開調解會議。","title":"第 二 章 調解"},{"no":"第16條","text":"調解委員會應指派委員調查事實，除有特殊情形外，該委員應於受指派後十日內，將調查結果及解決方案提報調解委員會。\n調解委員會應於收到前項調查結果及解決方案後十五日內開會。必要時或經勞資爭議雙方當事人同意者，得延長七日。","title":"第 二 章 調解"},{"no":"第17條","text":"調解委員會開會時，調解委員應親自出席，不得委任他人代理；受指派調查時，亦同。\n直轄市、縣（市）主管機關於調解委員調查或調解委員會開會時，得通知當事人、相關人員或事業單位以言詞或書面提出說明；調解委員為調查之必要，得經主管機關同意，進入相關事業單位訪查。\n前項受通知或受訪查人員，不得為虛偽說明、提供不實資料或無正當理由拒絕說明。","title":"第 二 章 調解"},{"no":"第18條","text":"調解委員會應有調解委員過半數出席，始得開會；經出席委員過半數同意，始得決議，作成調解方案。","title":"第 二 章 調解"},{"no":"第19條","text":"依前條規定作成之調解方案，經勞資爭議雙方當事人同意在調解紀錄簽名者，為調解成立。但當事人之一方為團體協約法第十條第二項規定之機關（構）、學校者，其代理人簽名前，應檢附同條項所定有核可權機關之同意書。","title":"第 二 章 調解"},{"no":"第20條","text":"勞資爭議當事人對調解委員會之調解方案不同意者，為調解不成立。","title":"第 二 章 調解"},{"no":"第21條","text":"有下列情形之一者，視為調解不成立：\n一、經調解委員會主席召集會議，連續二次調解委員出席人數未過半數。\n二、未能作成調解方案。","title":"第 二 章 調解"},{"no":"第22條","text":"勞資爭議調解成立或不成立，調解紀錄均應由調解委員會報由直轄市、縣（市）主管機關送達勞資爭議雙方當事人。","title":"第 二 章 調解"},{"no":"第23條","text":"勞資爭議經調解成立者，視為爭議雙方當事人間之契約；當事人一方為工會時，視為當事人間之團體協約。","title":"第 二 章 調解"},{"no":"第24條","text":"勞資爭議調解人、調解委員、參加調解及經辦調解事務之人員，對於調解事件，除已公開之事項外，應保守秘密。","title":"第 二 章 調解"},{"no":"第25條","text":"勞資爭議調解不成立者，雙方當事人得共同向直轄市或縣（市）主管機關申請交付仲裁。但調整事項之勞資爭議，當事人一方為團體協約法第十條第二項規定之機關（構）、學校時，非經同條項所定機關之核可，不得申請仲裁。\n勞資爭議當事人之一方為第五十四條第二項之勞工者，其調整事項之勞資爭議，任一方得向直轄市或縣（市）申請交付仲裁；其屬同條第三項事業調整事項之勞資爭議，而雙方未能約定必要服務條款者，任一方得向中央主管機關申請交付仲裁。\n勞資爭議經雙方當事人書面同意，得不經調解，逕向直轄市或縣（市）主管機關申請交付仲裁。\n調整事項之勞資爭議經調解不成立者，直轄市或縣（市）主管機關認有影響公眾生活及利益情節重大，或應目的事業主管機關之請求，得依職權交付仲裁，並通知雙方當事人。","title":"第 三 章 仲裁"},{"no":"第26條","text":"主管機關受理仲裁之申請，應依申請人之請求，以下列方式之一進行仲裁，其為一方申請交付仲裁或依職權交付仲裁者，僅得以第二款之方式為之：\n一、選定獨任仲裁人。\n二、組成勞資爭議仲裁委員會（以下簡稱仲裁委員會）。\n前項仲裁人與仲裁委員之資格條件、遴聘方式、選定及仲裁程序及其他應遵行事項之辦法，由中央主管機關定之。","title":"第 三 章 仲裁"},{"no":"第27條","text":"雙方當事人合意以選定獨任仲裁人方式進行仲裁者，直轄市或縣（市）主管機關應於收到仲裁申請書後，通知勞資爭議雙方當事人於收到通知之日起五日內，於直轄市、縣（市）主管機關遴聘之仲裁人名冊中選定獨任仲裁人一人具報；屆期未選定者，由直轄市、縣（市）主管機關代為指定。\n前項仲裁人名冊，由直轄市、縣（市）主管機關遴聘具一定資格之公正並富學識經驗者充任、彙整之，並應報請中央主管機關備查。\n第三十二條、第三十三條及第三十五條至第三十七條之規定，於獨任仲裁人仲裁程序準用之。","title":"第 三 章 仲裁"},{"no":"第28條","text":"申請交付仲裁者，應提出仲裁申請書，並檢附調解紀錄或不經調解之同意書；其為一方申請交付仲裁者，並應檢附符合第二十五條第二項規定之證明文件。","title":"第 三 章 仲裁"},{"no":"第29條","text":"以組成仲裁委員會方式進行仲裁者，主管機關應於收到仲裁申請書或依職權交付仲裁後，通知勞資爭議雙方當事人於收到通知之日起五日內，於主管機關遴聘之仲裁委員名冊中各自選定仲裁委員具報；屆期未選定者，由主管機關代為指定。\n勞資雙方仲裁委員經選定或指定後，主管機關應於三日內通知雙方仲裁委員，於七日內依第三十條第一項及第二項或第四項規定推選主任仲裁委員及其餘仲裁委員具報；屆期未推選者，由主管機關指定。","title":"第 三 章 仲裁"},{"no":"第30條","text":"仲裁委員會置委員三人或五人，由下列人員組成之：\n一、勞資爭議雙方當事人各選定一人。\n二、由雙方當事人所選定之仲裁委員於仲裁委員名冊中，共同選定一人或三人。\n前項仲裁委員會置主任仲裁委員一人，由前項第二款委員互推一人擔任，並為會議主席。\n仲裁委員由直轄市、縣（市）主管機關遴聘具一定資格之公正並富學識經驗者任之。直轄市、縣（市）主管機關遴聘後，應報請中央主管機關備查。\n依第二十五條第二項規定由中央主管機關交付仲裁者，其仲裁委員會置委員五人或七人，由勞資爭議雙方當事人各選定二人之外，再共同另選定一人或三人，並由共同選定者互推一人為主任仲裁委員，並為會議主席。\n前項仲裁委員名冊，由中央主管機關會商相關目的事業主管機關後遴聘之。","title":"第 三 章 仲裁"},{"no":"第31條","text":"主管機關應於主任仲裁委員完成選定或指定之日起十四日內，組成仲裁委員會，並召開仲裁會議。","title":"第 三 章 仲裁"},{"no":"第32條","text":"有下列情形之一者，不得擔任同一勞資爭議事件之仲裁委員：\n一、曾為該爭議事件之調解委員。\n二、本人或其配偶、前配偶或與其訂有婚約之人為爭議事件當事人，或與當事人有共同權利人、共同義務人或償還義務人之關係。\n三、為爭議事件當事人八親等內之血親或五親等內之姻親，或曾有此親屬關係。\n四、現為或曾為該爭議事件當事人之代理人或家長、家屬。\n五、工會為爭議事件之當事人者，其會員、理事、監事或會務人員。\n六、雇主團體或雇主為爭議事件之當事人者，其會員、理事、監事、會務人員或其受僱人。\n仲裁委員有前項各款所列情形之一而不自行迴避，或有具體事實足認其執行職務有偏頗之虞者，爭議事件當事人得向主管機關申請迴避，其程序準用行政程序法第三十三條規定。","title":"第 三 章 仲裁"},{"no":"第33條","text":"仲裁委員會應指派委員調查事實，除有特殊情形外，調查委員應於指派後十日內，提出調查結果。\n仲裁委員會應於收到前項調查結果後二十日內，作成仲裁判斷。但經勞資爭議雙方當事人同意，得延長十日。\n主管機關於仲裁委員調查或仲裁委員會開會時，應通知當事人、相關人員或事業單位以言詞或書面提出說明；仲裁委員為調查之必要，得經主管機關同意後，進入相關事業單位訪查。\n前項受通知或受訪查人員，不得為虛偽說明、提供不實資料或無正當理由拒絕說明。","title":"第 三 章 仲裁"},{"no":"第34條","text":"仲裁委員會由主任仲裁委員召集，其由委員三人組成者，應有全體委員出席，經出席委員過半數同意，始得作成仲裁判斷；其由委員五人或七人組成者，應有三分之二以上委員出席，經出席委員四分之三以上同意，始得作成仲裁判斷。\n仲裁委員連續二次不參加會議，當然解除其仲裁職務，由主管機關另行指定仲裁委員代替之。","title":"第 三 章 仲裁"},{"no":"第35條","text":"仲裁委員會作成仲裁判斷後，應於十日內作成仲裁判斷書，報由主管機關送達勞資爭議雙方當事人。","title":"第 三 章 仲裁"},{"no":"第36條","text":"勞資爭議當事人於仲裁程序進行中和解者，應將和解書報仲裁委員會及主管機關備查，仲裁程序即告終結；其和解與依本法成立之調解有同一效力。","title":"第 三 章 仲裁"},{"no":"第37條","text":"仲裁委員會就權利事項之勞資爭議所作成之仲裁判斷，於當事人間，與法院之確定判決有同一效力。\n仲裁委員會就調整事項之勞資爭議所作成之仲裁判斷，視為爭議當事人間之契約；當事人一方為工會時，視為當事人間之團體協約。\n對於前二項之仲裁判斷，勞資爭議當事人得準用仲裁法第五章之規定，對於他方提起撤銷仲裁判斷之訴。\n調整事項經作成仲裁判斷者，勞資雙方當事人就同一爭議事件不得再為爭議行為；其依前項規定向法院提起撤銷仲裁判斷之訴者，亦同。","title":"第 三 章 仲裁"},{"no":"第38條","text":"第九條第四項、第十條、第十七條第一項及第二十四條之規定，於仲裁程序準用之。","title":"第 三 章 仲裁"},{"no":"第39條","text":"勞工因工會法第三十五條第二項規定所生爭議，得向中央主管機關申請裁決。\n前項裁決之申請，應自知悉有違反工會法第三十五條第二項規定之事由或事實發生之次日起九十日內為之。","title":"第 四 章 裁決"},{"no":"第40條","text":"裁決之申請，應以書面為之，並載明下列事項：\n一、當事人之姓名、性別、年齡、職業及住所或居所；如為法人、雇主團體或工會，其名稱、代表人及事務所或營業所；有代理人者，其姓名、名稱及住居所或事務所。\n二、請求裁決之事項及其原因事實。","title":"第 四 章 裁決"},{"no":"第41條","text":"基於工會法第三十五條第二項規定所為之裁決申請，違反第三十九條第二項及前條規定者，裁決委員應作成不受理之決定。但其情形可補正者，應先限期令其補正。\n前項不受理決定，不得聲明不服。","title":"第 四 章 裁決"},{"no":"第42條","text":"當事人就工會法第三十五條第二項所生民事爭議事件申請裁決，於裁決程序終結前，法院應依職權停止民事訴訟程序。\n當事人於第三十九條第二項所定期間提起之訴訟，依民事訴訟法之規定視為調解之聲請者，法院仍得進行調解程序。\n裁決之申請，除經撤回者外，與起訴有同一效力，消滅時效因而中斷。","title":"第 四 章 裁決"},{"no":"第43條","text":"中央主管機關為辦理裁決事件，應組成不當勞動行為裁決委員會（以下簡稱裁決委員會）。\n裁決委員會應秉持公正立場，獨立行使職權。\n裁決委員會置裁決委員七人至十五人，均為兼職，其中一人至三人為常務裁決委員，由中央主管機關遴聘熟悉勞工法令、勞資關係事務之專業人士任之，任期二年，並由委員互推一人為主任裁決委員。\n中央主管機關應調派專任人員或聘用專業人員，承主任裁決委員之命，協助辦理裁決案件之程序審查、爭點整理及資料蒐集等事務。具專業證照執業資格者，經聘用之期間，計入其專業執業年資。\n裁決委員會之組成、裁決委員之資格條件、遴聘方式、裁決委員會相關處理程序、前項人員之調派或遴聘及其他應遵行事項之辦法，由中央主管機關定之。","title":"第 四 章 裁決"},{"no":"第44條","text":"中央主管機關應於收到裁決申請書之日起七日內，召開裁決委員會處理之。\n裁決委員會應指派委員一人至三人，依職權調查事實及必要之證據，並應於指派後二十日內作成調查報告，必要時得延長二十日。\n裁決委員調查或裁決委員會開會時，應通知當事人、相關人員或事業單位以言詞或書面提出說明；裁決委員為調查之必要，得經主管機關同意，進入相關事業單位訪查。\n前項受通知或受訪查人員，不得為虛偽說明、提供不實資料或無正當理由拒絕說明。\n申請人經依第三項規定通知，無正當理由二次不到場者，視為撤回申請；相對人二次不到場者，裁決委員會得經到場一造陳述為裁決。\n裁決當事人就同一爭議事件達成和解或經法定調解機關調解成立者，裁決委員會應作成不受理之決定。","title":"第 四 章 裁決"},{"no":"第45條","text":"主任裁決委員應於裁決委員作成調查報告後七日內，召開裁決委員會，並於開會之日起三十日內作成裁決決定。但經裁決委員會應出席委員二分之一以上同意者得延長之，最長以三十日為限。","title":"第 四 章 裁決"},{"no":"第46條","text":"裁決委員會應有三分之二以上委員出席，並經出席委員二分之一以上同意，始得作成裁決決定；作成裁決決定前，應由當事人以言詞陳述意見。\n裁決委員應親自出席，不得委任他人代理。\n裁決委員審理案件相關給付報酬標準，由中央主管機關定之。","title":"第 四 章 裁決"},{"no":"第47條","text":"裁決決定書應載明下列事項：\n一、當事人姓名、住所或居所；如為法人、雇主團體或工會，其名稱、代表人及主事務所或主營業所。\n二、有代理人者，其姓名、名稱及住居所或事務所。\n三、主文。\n四、事實。\n五、理由。\n六、主任裁決委員及出席裁決委員之姓名。\n七、年、月、日。\n裁決委員會作成裁決決定後，中央主管機關應於二十日內將裁決決定書送達當事人。","title":"第 四 章 裁決"},{"no":"第47-1條","text":"中央主管機關應以定期出版、登載於網站或其他適當方式公開裁決決定書。但裁決決定書含有依政府資訊公開法應限制公開或不予提供之事項者，應僅就其他部分公開之。\n前項公開，得不含自然人之名字、身分證統一編號及其他足資識別該個人之資料。但應公開自然人之姓氏及足以區辨人別之代稱。","title":"第 四 章 裁決"},{"no":"第48條","text":"對工會法第三十五條第二項規定所生民事爭議事件所為之裁決決定，當事人於裁決決定書正本送達三十日內，未就作為裁決決定之同一事件，以他方當事人為被告，向法院提起民事訴訟者，或經撤回其訴者，視為雙方當事人依裁決決定書達成合意。\n裁決經依前項規定視為當事人達成合意者，裁決委員會應於前項期間屆滿後七日內，將裁決決定書送請裁決委員會所在地之法院審核。\n前項裁決決定書，法院認其與法令無牴觸者，應予核定，發還裁決委員會送達當事人。\n法院因裁決程序或內容與法令牴觸，未予核定之事件，應將其理由通知裁決委員會。但其情形可以補正者，應定期間先命補正。\n經法院核定之裁決有無效或得撤銷之原因者，當事人得向原核定法院提起宣告裁決無效或撤銷裁決之訴。\n前項訴訟，當事人應於法院核定之裁決決定書送達後三十日內提起之。","title":"第 四 章 裁決"},{"no":"第49條","text":"前條第二項之裁決經法院核定後，與民事確定判決有同一效力。","title":"第 四 章 裁決"},{"no":"第50條","text":"當事人本於第四十八條第一項裁決決定之請求，欲保全強制執行或避免損害之擴大者，得於裁決決定書經法院核定前，向法院聲請假扣押或假處分。\n前項聲請，債權人得以裁決決定代替請求及假扣押或假處分原因之釋明，法院不得再命債權人供擔保後始為假扣押或假處分。\n民事訴訟法有關假扣押或假處分之規定，除第五百二十九條規定外，於前二項情形準用之。\n裁決決定書未經法院核定者，當事人得聲請法院撤銷假扣押或假處分之裁定。","title":"第 四 章 裁決"},{"no":"第51條","text":"基於工會法第三十五條第一項及團體協約法第六條第一項規定所為之裁決申請，其程序準用第三十九條、第四十條、第四十一條第一項、第四十三條至第四十七條規定。\n前項處分並得令當事人為一定之行為或不行為。\n不服第一項不受理決定者，得於決定書送達之次日起三十日內繕具訴願書，經由中央主管機關向行政院提起訴願。\n對於第一項及第二項之處分不服者，得於決定書送達之次日起二個月內提起行政訴訟。","title":"第 四 章 裁決"},{"no":"第52條","text":"本法第三十二條規定，於裁決程序準用之。","title":"第 四 章 裁決"},{"no":"第53條","text":"勞資爭議，非經調解不成立，不得為爭議行為；權利事項之勞資爭議，不得罷工。\n雇主、雇主團體經中央主管機關裁決認定違反工會法第三十五條、團體協約法第六條第一項規定者，工會得依本法為爭議行為。","title":"第 五 章 爭議行為"},{"no":"第54條","text":"工會非經會員以直接、無記名投票且經全體過半數同意，不得宣告罷工及設置糾察線。\n下列勞工，不得罷工：\n一、教師。\n二、國防部及其所屬機關（構）、學校之勞工。\n下列影響大眾生命安全、國家安全或重大公共利益之事業，勞資雙方應約定必要服務條款，工會始得宣告罷工：\n一、自來水事業。\n二、電力及燃氣供應業。\n三、醫院。\n四、經營銀行間資金移轉帳務清算之金融資訊服務業與證券期貨交易、結算、保管事業及其他辦理支付系統業務事業。\n前項必要服務條款，事業單位應於約定後，即送目的事業主管機關備查。\n提供固定通信業務或行動通信業務之第一類電信事業，於能維持基本語音通信服務不中斷之情形下，工會得宣告罷工。\n第二項及第三項所列之機關（構）及事業之範圍，由中央主管機關會同其主管機關或目的事業主管機關定之；前項基本語音通信服務之範圍，由目的事業主管機關定之。\n重大災害發生或有發生之虞時，各級政府為執行災害防治法所定災害預防工作或有應變處置之必要，得於災害防救期間禁止、限制或停止罷工。","title":"第 五 章 爭議行為"},{"no":"第55條","text":"爭議行為應依誠實信用及權利不得濫用原則為之。\n雇主不得以工會及其會員依本法所為之爭議行為所生損害為由，向其請求賠償。\n工會及其會員所為之爭議行為，該當刑法及其他特別刑法之構成要件，而具有正當性者，不罰。但以強暴脅迫致他人生命、身體受侵害或有受侵害之虞時，不適用之。","title":"第 五 章 爭議行為"},{"no":"第56條","text":"爭議行為期間，爭議當事人雙方應維持工作場所安全及衛生設備之正常運轉。","title":"第 五 章 爭議行為"},{"no":"第57條","text":"勞工或工會提起確認僱傭關係或給付工資之訴，暫免徵收依民事訴訟法所定裁判費之二分之一。","title":"第 六 章 訴訟費用之暫減及強制執行之裁定"},{"no":"第58條","text":"除第五十條第二項所規定之情形外，勞工就工資、職業災害補償或賠償、退休金或資遣費等給付，為保全強制執行而對雇主或雇主團體聲請假扣押或假處分者，法院依民事訴訟法所命供擔保之金額，不得高於請求標的金額或價額之十分之一。","title":"第 六 章 訴訟費用之暫減及強制執行之裁定"},{"no":"第59條","text":"勞資爭議經調解成立或仲裁者，依其內容當事人一方負私法上給付之義務，而不履行其義務時，他方當事人得向該管法院聲請裁定強制執行並暫免繳裁判費；於聲請強制執行時，並暫免繳執行費。\n前項聲請事件，法院應於七日內裁定之。\n對於前項裁定，當事人得為抗告，抗告之程序適用非訟事件法之規定，非訟事件法未規定者，準用民事訴訟法之規定。","title":"第 六 章 訴訟費用之暫減及強制執行之裁定"},{"no":"第60條","text":"有下列各款情形之一者，法院應駁回其強制執行裁定之聲請：\n一、調解內容或仲裁判斷，係使勞資爭議當事人為法律上所禁止之行為。\n二、調解內容或仲裁判斷，與爭議標的顯屬無關或性質不適於強制執行。\n三、依其他法律不得為強制執行。","title":"第 六 章 訴訟費用之暫減及強制執行之裁定"},{"no":"第61條","text":"依本法成立之調解，經法院裁定駁回強制執行聲請者，視為調解不成立。但依前條第二款規定駁回，或除去經駁回強制執行之部分亦得成立者，不適用之。","title":"第 六 章 訴訟費用之暫減及強制執行之裁定"},{"no":"第62條","text":"雇主或雇主團體違反第八條規定者，處新臺幣二十萬元以上六十萬元以下罰鍰。\n工會違反第八條規定者，處新臺幣十萬元以上三十萬元以下罰鍰。\n勞工違反第八條規定者，處新臺幣一萬元以上三萬元以下罰鍰。","title":"第 七 章 罰則"},{"no":"第63條","text":"違反第十二條第四項、第十七條第三項、第三十三條第四項或第四十四條第四項規定，為虛偽之說明或提供不實資料者，處新臺幣三萬元以上十五萬元以下罰鍰。\n違反第十二條第三項、第十七條第三項、第三十三條第四項或第四十四條第四項規定，無正當理由拒絕說明或拒絕調解人或調解委員進入事業單位者，處新臺幣一萬元以上五萬元以下罰鍰。\n勞資雙方當事人無正當理由未依通知出席調解會議者，處新臺幣二千元以上一萬元以下罰鍰。","title":"第 七 章 罰則"},{"no":"第64條","text":"權利事項之勞資爭議，經依鄉鎮市調解條例調解成立者，其效力依該條例之規定。\n權利事項勞資爭議經當事人雙方合意，依仲裁法所為之仲裁，其效力依該法之規定。\n第八條之規定於前二項之調解及仲裁適用之。","title":"第 八 章 附則"},{"no":"第65條","text":"為處理勞資爭議，保障勞工權益，中央主管機關應捐助設置勞工權益基金。\n前項基金來源如下：\n一、勞工權益基金（專戶）賸餘專款。\n二、由政府逐年循預算程序之撥款。\n三、本基金之孳息收入。\n四、捐贈收入。\n五、其他有關收入。","title":"第 八 章 附則"},{"no":"第66條","text":"本法施行日期，由行政院定之。","title":"第 八 章 附則"}],"tags":["救濟","勞動","勞資爭議"],"note":"約用（臨時）人員、技工工友等適用勞基法者之爭議處理途徑。"}],"timeline":[{"date":"1969-04-28","roc_year":"58","event":"總統令制定公布《聘用人員聘用條例》全文10條","actor":"立法院","category":"法制定","personnel_types":["聘用"],"summary":"依公務人員任用法第21條（現第36條）授權制定，規定各機關得以契約定期聘用專業或技術人員，職稱、員額、期限、報酬列入預算並送銓敘部登記備查；不適用俸給、退休、撫卹法；不得兼任有職等之職務、不得充任法定主管。施行細則於58年8月12日由考試院訂定。","significance":"關鍵節點：契約用人首次取得法律位階，但條文僅10條且定位為「輔助性、臨時性」，權利義務大量留白；此後半世紀所有補充均以行政命令層疊其上，形成「法律空殼＋命令實體」的路徑起點。","sources":[{"title":"聘用人員聘用條例（全國法規資料庫）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=S0020014","accessible":true},{"title":"聘用人員聘用條例 沿革（全國法規資料庫）","url":"https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=S0020014","accessible":true},{"title":"聘用人員聘用條例（考試院主管法規共用系統）","url":"https://law.exam.gov.tw/LawContent.aspx?id=FL016991","accessible":true},{"title":"聘用人員聘用條例施行細則 沿革","url":"https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=S0020015","accessible":true}]},{"date":"1972-02-03","roc_year":"61","event":"《聘用人員聘用條例》修正第6條（唯一一次修法）","actor":"立法院","category":"修正","personnel_types":["聘用"],"summary":"將原不適用「俸給法、退休法、撫卹法及考績法」改為不適用「俸給法、退休法及撫卹法」，病故或因公死亡得酌給撫慰金。此後條例再無修正，施行細則則於60、71、96、108年修正。","significance":"路徑依賴：本法53年未再修正，顯示立法成本高而行政命令修補成本低，制度維持靠「細則與要點」而非母法。","sources":[{"title":"聘用人員聘用條例 沿革（全國法規資料庫）","url":"https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=S0020014","accessible":true},{"title":"聘用人員聘用條例（考試院主管法規共用系統）","url":"https://law.exam.gov.tw/LawContent.aspx?id=FL016991","accessible":true}]},{"date":"1972-12-27","roc_year":"61","event":"行政院訂定發布《行政院暨所屬機關約僱人員僱用辦法》","actor":"行政院","category":"法制定","personnel_types":["約僱"],"summary":"以行政命令建立「約僱」制度，僱用對象為相當分類職位公務人員第五職等以下之臨時性工作，無法律授權依據；68年、71年小幅修正後直到108年才全文修正。","significance":"層疊（layering）：在考試院主管的「聘用」軌道之外，行政院自建「約僱」軌道，形成兩院分管、法律與命令並存的雙軌結構，是日後整合立法屢遭「考試權／行政權」爭議的制度根源。","sources":[{"title":"行政院與所屬中央及地方各機關約僱人員僱用辦法 沿革","url":"https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=S0110014","accessible":true},{"title":"行政院暨所屬機關約僱人員僱用辦法修正總說明（108年，行政院公報）","url":"https://gazette.nat.gov.tw/EG_FileManager/eguploadpub/eg025185/ch01/type1/gov01/num1/images/AA.pdf","accessible":true},{"title":"政府機關用人體制之研究－從公法契約用人法制論析（人事總處，103.5.15）","url":"https://www.dgpa.gov.tw/Uploads/public/Attachment/51161738378.pdf","accessible":true}]},{"date":"1987-01-16","roc_year":"76","event":"《分類職位公務人員任用法》廢止失效","actor":"考試院","category":"修正","personnel_types":["約僱"],"summary":"約僱辦法以「相當分類職位公務人員第五職等以下」界定約僱工作，於分類職位制廢止後失去參照對象，卻仍沿用32年至108年才修正。","significance":"漂移（drift）：外部制度變動使規範文字與實務脫節，約僱人員實際工作性質逐漸擴張，但規範未隨之更新。","sources":[{"title":"行政院暨所屬機關約僱人員僱用辦法修正總說明（108年，行政院公報）","url":"https://gazette.nat.gov.tw/EG_FileManager/eguploadpub/eg025185/ch01/type1/gov01/num1/images/AA.pdf","accessible":true}]},{"date":"1990-03-27","roc_year":"79","event":"行政院訂定「中央各機關學校事務勞力替代措施推動方案」","actor":"行政院","category":"政策","personnel_types":["承攬","公務人員"],"summary":"透過工友設置基準、員額凍結不補、鼓勵退離，並以機具現代化、資訊化、委外、志工、替代役等替代事務性工友人力；92年7月31日修正。","significance":"關鍵節點：政府首次以「替代」而非「補充」思維處理事務性人力，開啟事務性工作委外化的路徑，日後承攬派駐人力大增的遠因。","sources":[{"title":"張毓珊〈工友員額控管做法及展望〉（人事月刊第328期，2012.12）","url":"https://www.dgpa.gov.tw/Uploads/public/Attachment/4813956097.pdf","accessible":true},{"title":"行政院所屬機關學校事務勞力替代措施推動方案（92.7.31修正；中興大學人事室轉載）","url":"https://person.nchu.edu.tw/admin/upload/行政院所屬機關學校事務勞力替代措施推動方案.pdf","accessible":false}]},{"date":"1998-07-01","roc_year":"87","event":"公務機關工友（含技工、駕駛）適用勞動基準法","actor":"勞動部","category":"政策","personnel_types":["公務人員"],"summary":"工友自87年7月1日起（技工駕駛87年12月31日）適用勞基法，解僱須符合勞基法要件；人事行政局於94年7月1日訂定「工友管理要點」。","significance":"轉換（conversion）：工友由公務體系管理轉入勞動法制，成為後來臨時人員適用勞基法的前例。","sources":[{"title":"林延增、賴思涵〈工友管理措施之探討與展望〉（人事月刊第333期，2013.5）","url":"https://www.dgpa.gov.tw/Uploads/public/Attachment/366174295.pdf","accessible":true},{"title":"張毓珊〈工友員額控管做法及展望〉（人事月刊第328期，2012.12）","url":"https://www.dgpa.gov.tw/Uploads/public/Attachment/4813956097.pdf","accessible":true}]},{"date":"2000-04-24","roc_year":"89","event":"考試院會銜行政院首次函送《公務人員基準法》草案至立法院","actor":"考試院","category":"草案提出","personnel_types":["公務人員","聘用"],"summary":"基準法草案（六章60條）擬統攝公務人員身分與契約用人定位，此後於91年10月30日、95年6月16日、101年3月27日四度送審，均因屆期不續審而未完成立法。","significance":"路徑依賴：契約用人之上位定位（政務／常務／契約三元）繫於基準法，基準法屢挫，使契約人力專法失去法源錨點。","sources":[{"title":"考試院新聞稿：考試院審議通過公務人員基準法草案 近期將函請行政院同意會銜","url":"https://www.exam.gov.tw/News_Content.aspx?n=1&s=19485","accessible":false},{"title":"考試院新聞稿：銓敘部函陳「公務人員基準法」草案及其總說明","url":"https://www.exam.gov.tw/News_Content.aspx?n=3438&s=18275","accessible":false}]},{"date":"2002-07-01","roc_year":"91","event":"行政院函：所屬機關學校工友員額自即日起一律凍結不補","actor":"行政院","category":"政策","personnel_types":["公務人員","承攬"],"summary":"配合91年2月19日「超額工友處理原則」與員額裁減1.5%政策，全面凍結工友進用，缺額只能移撥，不得新僱。","significance":"路徑依賴：工友出缺不補持續20餘年，事務性工作改由承攬派駐人力承接，人事總處日後承認承攬人數增加多因「工友退離不補」。","sources":[{"title":"行政院91.7.1函：工友員額一律凍結不補（人事總處法規公告）","url":"https://www.dgpa.gov.tw/information?uid=84&pid=2069","accessible":true},{"title":"張毓珊〈工友員額控管做法及展望〉（人事月刊第328期，2012.12）","url":"https://www.dgpa.gov.tw/Uploads/public/Attachment/4813956097.pdf","accessible":true}]},{"date":"2002-09-15","roc_year":"91","event":"總統府政府改造委員會通過「政府人力運用彈性化計畫方案」","actor":"行政院","category":"政策","personnel_types":["聘用","約僱","公務人員"],"summary":"含政務職位、高級行政主管職位、契約性職位三子方案；考試院隨之研修《聘用人員聘用條例》修正草案，擬明定公法上職務關係、不適用勞基法、聘用人員不逾職員預算員額15%、公開甄選。","significance":"關鍵節點：新公共管理思潮下的「彈性用人」首次成為兩院共同政策議程，但考試院將之導向「法制化、規範化」而非「彈性化」，是蘇偉業所指台灣改革取向與英美不同之起點。","sources":[{"title":"考試院新聞稿：院會就政府改造委員會「政府人力運用彈性化計畫方案」作成決定","url":"https://www.exam.gov.tw/News_Content.aspx?n=3438&s=18288","accessible":false},{"title":"考試院新聞稿：考試院積極研修「聘用人員聘用條例」修正草案","url":"https://www.exam.gov.tw/News_Content.aspx?n=3438&s=18497","accessible":false},{"title":"考試院新聞稿：院會審議聘用人員聘用條例修正草案暨配合修正（或廢止）任用法等相關法規草案","url":"https://www.exam.gov.tw/News_Content.aspx?n=3438&s=18556","accessible":false},{"title":"蘇偉業（2007）〈管理主義下的政府機關人力彈性化：台灣與香港政府契約人力制度之比較分析〉公共行政學報23：29-66","url":"https://www.airitilibrary.com/","accessible":false}]},{"date":"2003","roc_year":"約90-92","event":"考試院院會通過「暫緩研訂約聘人員人事條例草案」","actor":"考試院","category":"草案審議","personnel_types":["聘用","約僱"],"summary":"銓敘部原擬以「約聘人員人事條例」統一各類非常任臨時人員管理，院會以現行規定執行無窒礙、宜俟「聘任人員人事條例」施行後再評估為由暫緩，權益不足處改循修正離職儲金、給假等規定處理（新聞稿未標年份，依內容推定約民國90年代初）。","significance":"否決點（veto point）：考試院內部即先行擱置整合立法，顯示「以小修補代替大改」的制度偏好。","sources":[{"title":"考試院新聞稿：審查銓敘部函陳「約聘人員人事條例」草案一案（暫緩研訂）","url":"https://www.exam.gov.tw/News_Content.aspx?n=3438&s=18010","accessible":false}]},{"date":"2005-02-05","roc_year":"94","event":"立法院通過94年度總預算審查總報告，決議臨時人員應訂管控規定、不得長僱化","actor":"立法院","category":"政策","personnel_types":["約用"],"summary":"通案決議要求人事行政局就中央各機關業務費項下雇員及臨時人員專案研處訂定管控規定；人事局94年8月調查發現各機關臨時人員管理分散。","significance":"關鍵節點：臨時人員問題由立法院預算權驅動進入議程，開啟「以預算決議取代立法」的管制模式。","sources":[{"title":"臨時人員進用及運用要點問答集（人事總處，109.3.2配合通函版）","url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa%2Ffiles%2F202108%2F3515d795-6c20-4a64-9cb2-fd626fd6d22f.doc&nfix=pdf&name=臨時人員要點QA.doc","accessible":true},{"title":"政府機關多元人力運用及管理（人事總處簡報，110年6月）","url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa%2Ffiles%2F202106%2Fa5dc4cdd-59a4-495a-b1d9-1dab0ee1b34a.pdf&name=政府機關多元人力運用及管理.pdf","accessible":true},{"title":"約用人員管理規定（人事總處組編人力處簡報，113.4.18）","url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa/files/202404/308f2535-a6e0-4dd1-bbca-5d4a6c82fb80.pdf&nfix=&name=約用人員管理規定.pdf","accessible":true}]},{"date":"2005-03-08","roc_year":"94","event":"行政院、考試院會銜函送《中央政府機關總員額法》草案（14條）","actor":"行政院","category":"草案提出","personnel_types":["公務人員","聘用","約僱"],"summary":"草案總說明：參考日本總定員法，訂員額總數上限20萬人（6年後降至18.5萬），員額分六類，第二類為聘僱人員、駐衛警、工友；要求機關推動委外化、法人化等「四化」。行政院自87年至97年五度送審均未完成。","significance":"總量管制的設計一開始即將聘僱納入員額、臨時人員排除在外，形成日後「員額內／員額外」的制度縫隙。","sources":[{"title":"「中央政府機關總員額法」草案總說明（94.3.8，人事總處）","url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa%2Ffiles%2F201612%2F452f2037-e69f-4544-bbfe-6ca114f36b05.doc&nfix=pdf&name=總員額法草案總說明.doc","accessible":true}]},{"date":"2005-07-28","roc_year":"94","event":"考試院第10屆第144次會議通過《聘用人員人事條例》草案，8月15日函送立法院","actor":"考試院","category":"草案提出","personnel_types":["聘用","約僱"],"summary":"整合聘用、派用、機要、聘任、約僱五類人員，7章62條；明定行政契約、公法契約關係、公開甄選、考核淘汰、退撫比照勞退條例機制；同時擬廢止聘用條例與派用條例。列為第6屆第6會期優先法案。","significance":"關鍵節點（未成）：第一次完整的契約人力專法；因五類人員制度差異過大、「違背考試用人」質疑而受阻。","sources":[{"title":"考試院新聞稿：考試院通過聘用人員人事條例草案","url":"https://www.exam.gov.tw/News_Content.aspx?n=1&s=18713","accessible":false},{"title":"考試院新聞稿：加速推動「聘用人員人事條例草案」完成立法程序","url":"https://www.exam.gov.tw/News_Content.aspx?n=1&s=18963","accessible":false},{"title":"考試院新聞稿：繼續推動聘用人員人事條例草案完成立法，合理保障聘僱人員權益","url":"https://www.exam.gov.tw/News_Content.aspx?n=1&s=19011","accessible":false},{"title":"立法院法制局法案評估：聘用人員人事條例草案（何善為，95年12月，B00493）","url":"https://www.ly.gov.tw/Pages/Detail.aspx?nodeid=6588&pid=83610","accessible":false}]},{"date":"2006-12","roc_year":"95","event":"立法院法制局提出《聘用人員人事條例草案》法案評估報告（何善為，B00493）","actor":"立法院","category":"草案審議","personnel_types":["聘用","約僱"],"summary":"評估認為新制違背國家考試用人精神、影響文官體制健全、恐生政治分贓，質疑制定必要；另指草案排除以業務費進用之臨時人員，恐引發不平。立法院另於95年要求銓敘部座談、96年12月召開公聽會。","significance":"否決點：立法院幕僚機構以「考試用人」規範性論述反對，彰顯憲法考試權作為否決點的制度力量。","sources":[{"title":"立法院法制局法案評估：聘用人員人事條例草案（何善為，95年12月，B00493）","url":"https://www.ly.gov.tw/Pages/Detail.aspx?nodeid=6588&pid=83610","accessible":false},{"title":"考試院新聞稿：繼續推動聘用人員人事條例草案完成立法，合理保障聘僱人員權益","url":"https://www.exam.gov.tw/News_Content.aspx?n=1&s=19011","accessible":false}]},{"date":"2006","roc_year":"95","event":"立委王幸男等39人提案：約僱人員勞動條件不得低於勞基法最低標準","actor":"立法院","category":"草案提出","personnel_types":["約僱"],"summary":"就約僱人員勞動條件、年資計算及離職退休撫卹提出修法主張，法制局就此研析。","significance":"顯示立法院內部存在「勞動法制化」與「公法契約化」兩種路徑競爭。","sources":[{"title":"立法院法制局：約聘僱人員之相關條文不得低於勞動基準法之最低標準（王幸男等39人提案研析）","url":"https://www.ly.gov.tw/Pages/Detail.aspx?nodeid=5641&pid=48267","accessible":false}]},{"date":"2007-02-06","roc_year":"96","event":"行政院「研商臨時人員適用勞基法」會議政策指示","actor":"行政院","category":"政策","personnel_types":["約用"],"summary":"指出部分機關以臨時人員長期擔任核心公務，責成人事局研擬禁止不當使用機制，使臨時人員回歸臨時性本質。","significance":"政策論述確立「臨時人員＝非核心、非公權力」的切割原則，成為日後要點第3點的來源。","sources":[{"title":"臨時人員進用及運用管理（人事總處104年非典型人力巡迴說明會簡報）","url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa%2Ffiles%2F201612%2Fa08b9898-aaa6-4789-992e-aee93d1edea3.pdf&nfix=&name=臨時人員進用及運用管理.pdf","accessible":true},{"title":"臨時人員進用及運用要點問答集（人事總處，109.3.2配合通函版）","url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa%2Ffiles%2F202108%2F3515d795-6c20-4a64-9cb2-fd626fd6d22f.doc&nfix=pdf&name=臨時人員要點QA.doc","accessible":true}]},{"date":"2007-05","roc_year":"96","event":"立法院法制局專題研究：聘僱人員適用勞動基準法爭議問題之研析（李淑娟，A00500）","actor":"立法院","category":"調查報告","personnel_types":["聘用","約僱"],"summary":"回顧勞委會86年起研議聘僱人員適用勞基法，整理公法／私法契約、管理權限、財政負擔等爭點，比較英、德、紐、日契約人力，提出管理面及制度面建議。","significance":"顯示「適用勞基法」路徑早在86年即被提出並持續被行政、考試兩院排除。","sources":[{"title":"立法院法制局專題研究：聘僱人員適用勞動基準法爭議問題之研析（李淑娟，96年5月，A00500）","url":"https://www.ly.gov.tw/Pages/Detail.aspx?nodeid=6586&pid=83653","accessible":false}]},{"date":"2007-11-30","roc_year":"96","event":"勞委會公告：公部門各業臨時人員自97年1月1日起適用勞基法","actor":"勞動部","category":"政策","personnel_types":["約用"],"summary":"勞動1字第0960130914號公告，將非依公務人員法規、以人事費以外經費進用之臨時人員納入勞基法；立法院同時決議97年度臨時人員酬金不得高於96年度。","significance":"關鍵節點：契約人力正式「雙軌化」—聘僱人員留在公法契約、臨時人員轉入私法勞動契約，兩者身分、保障、救濟從此分流。","sources":[{"title":"政府機關多元人力運用及管理（人事總處簡報，110年6月）","url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa%2Ffiles%2F202106%2Fa5dc4cdd-59a4-495a-b1d9-1dab0ee1b34a.pdf&name=政府機關多元人力運用及管理.pdf","accessible":true},{"title":"臨時人員進用及運用要點問答集（人事總處，109.3.2配合通函版）","url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa%2Ffiles%2F202108%2F3515d795-6c20-4a64-9cb2-fd626fd6d22f.doc&nfix=pdf&name=臨時人員要點QA.doc","accessible":true},{"title":"多元人力簡介（人事總處委外及多元人力運用專區，113.2.27）","url":"https://www.dgpa.gov.tw/mp/archive?uid=577&mid=152","accessible":true}]},{"date":"2008-01-10","roc_year":"97","event":"行政院訂頒「行政院及所屬各機關學校臨時人員進用及運用要點」，溯自97年1月1日實施","actor":"行政院","category":"法制定","personnel_types":["約用"],"summary":"定義臨時人員為機關非依公務人員法規、以人事費以外經費自行進用者；限辦非公權力之臨時性、短期性、季節性、特定性定期契約工作；以96年度進用人數為上限；須經委外、簡化、志工檢討後仍不能負荷始得進用；訂定後修正10次。","significance":"層疊：行政院在「聘用（法律）」「約僱（命令）」之外再疊上「臨時人員（要點）」第三層，以行政規則取代專法；上限以96年度人數凍結，成為往後十餘年總量控管基準。","sources":[{"title":"臨時人員進用及運用要點問答集（人事總處，109.3.2配合通函版）","url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa%2Ffiles%2F202108%2F3515d795-6c20-4a64-9cb2-fd626fd6d22f.doc&nfix=pdf&name=臨時人員要點QA.doc","accessible":true},{"title":"臨時人員進用及運用管理（人事總處104年非典型人力巡迴說明會簡報）","url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa%2Ffiles%2F201612%2Fa08b9898-aaa6-4789-992e-aee93d1edea3.pdf&nfix=&name=臨時人員進用及運用管理.pdf","accessible":true},{"title":"約用人員管理規定（人事總處組編人力處簡報，113.4.18）","url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa/files/202404/308f2535-a6e0-4dd1-bbca-5d4a6c82fb80.pdf&nfix=&name=約用人員管理規定.pdf","accessible":true}]},{"date":"2008-01-31","roc_year":"97","event":"第6屆立法委員任期屆滿，《聘用人員人事條例》草案屆期不續審","actor":"立法院","category":"草案審議","personnel_types":["聘用","約僱"],"summary":"依立法院職權行使法第13條不予審議；考試院表示將由銓敘部重新研擬。同年考試院委託開南大學柯三吉等研究草案對文官體制之影響，研究認為國家與聘用人員間應為私法契約關係。","significance":"否決點：屆期不續審機制使專法無聲消失，無須政治表態；學界對公法／私法定性歧見持續。","sources":[{"title":"考試院新聞稿：繼續推動聘用人員人事條例草案完成立法，合理保障聘僱人員權益","url":"https://www.exam.gov.tw/News_Content.aspx?n=1&s=19011","accessible":false},{"title":"柯三吉等（開南大學）：考試院擬定之「聘用人員人事條例」草案對現行公務人員體制影響之研究（考試院委託研究，2008）","url":"https://ws.exam.gov.tw/Download.ashx?u=LzAwMS9VcGxvYWQvMS9yZWxmaWxlLzEyMDgyLzI4NDE0LzRjODc3ZjI1LTc3YjYtNDEyZi1iZGYxLWI5N2IwOGE2Y2MxYi5wZGY%3D&n=MDEyMjE3MTU1MzYzLnBkZg%3D%3D","accessible":false},{"title":"政府機關用人體制之研究－從公法契約用人法制論析（人事總處，103.5.15）","url":"https://www.dgpa.gov.tw/Uploads/public/Attachment/51161738378.pdf","accessible":true}]},{"date":"2009-06-18","roc_year":"98","event":"考試院第11屆第39次會議通過「文官制度興革規劃方案」，確立政務、常務、契約用人三元體制","actor":"考試院","category":"政策","personnel_types":["聘用","約僱","公務人員"],"summary":"第二案「統整文官法制、活化管理體系」中程目標「健全政府契約用人制度」交銓敘部規劃，預定2011年中期完成；以現行聘用及約僱人員為適用對象，在常任文官之外建立契約用人完整制度。","significance":"關鍵節點：考試院正式承認契約用人為文官體系第三支柱，但仍限定在「聘用、約僱」，未納入已轉入勞基法的臨時人員。","sources":[{"title":"變革中的文官制度：介紹「文官制度興革規劃方案」（考試院）","url":"https://www.exam.gov.tw/public/data/011317504871.pdf","accessible":false},{"title":"政府機關用人體制之研究－從公法契約用人法制論析（人事總處，103.5.15）","url":"https://www.dgpa.gov.tw/Uploads/public/Attachment/51161738378.pdf","accessible":true},{"title":"蔡良文〈政府契約用人制度變革之研析〉考銓季刊第53期（2008）","url":"https://lawdata.com.tw/File/DC/Journal/J1549/A08880053_063.pdf","accessible":false}]},{"date":"2010-02-03","roc_year":"99","event":"總統公布《中央政府機關總員額法》全文11條，4月1日施行；立法院附帶決議5年內員額降至16萬人","actor":"立法院","category":"法制定","personnel_types":["公務人員","聘用","約僱"],"summary":"99年1月12日三讀（與組織再造四法同時）。員額最高17.3萬人，第二類員額為聘僱人員、駐衛警、工友；第8條建立每2年員額評鑑；人事總處每4年向立法院報告。108年12月31日修正第3、4、11條。","significance":"關鍵節點：總量管制使正式員額成為硬約束，而業務持續擴張，機關只能向「員額外」人力（臨時人員、派遣、承攬）求解—非典型人力擴張的結構性誘因由此制度化。","sources":[{"title":"中央政府機關總員額法（全國法規資料庫）","url":"https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=S0110038","accessible":true},{"title":"中央政府機關總員額法 沿革","url":"https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=S0110038","accessible":true},{"title":"彭錦鵬〈中央政府機關總員額法制度之理想與實踐〉","url":"https://www.ea.sinica.edu.tw/file/Image/total%20member.pdf","accessible":false},{"title":"立法院預算中心：總員額法施行後，中央政府機關員額總數雖略為精簡，惟近年員額規模漸增（113年度總預算整體評估）","url":"https://www.ly.gov.tw/Pages/Detail.aspx?nodeid=46405&pid=231928","accessible":false},{"title":"員額評鑑制度簡介（人事總處員額評鑑服務專區）","url":"https://www.dgpa.gov.tw/mp/archive?uid=278&mid=277","accessible":true}]},{"date":"2010-04","roc_year":"99","event":"蘇偉業於《文官制度季刊》發表地方政府約聘僱人員調查研究","actor":"學界","category":"調查報告","personnel_types":["聘用","約僱"],"summary":"以高雄市、臺中市、花蓮縣361份有效問卷與訪談指出：約聘僱人員實為機關基層穩定人力而非臨時補充人力；員額控制下地方以其他名目聘用，正式統計低估實況；批評考試院新版草案改革過於保守。","significance":"學界揭示「名義臨時、實質常態」的漂移現象，並指出員額替代為主因。","sources":[{"title":"蘇偉業〈從地方政府運用約聘僱人員之調查剖析我國契約公務人力之改革〉文官制度季刊2(2)，2010","url":"https://ws.exam.gov.tw/Download.ashx?u=LzAwMS9VcGxvYWQvMS9yZWxmaWxlLzkzMjMvMjE5NDQvOWM5NjcyNzMtMGU0MC00NzJhLThmOWUtYmU2NmQ4MTcwMjA1LnBkZg%3D%3D&n=MDUyODE2MzIyNjcxLnBkZg%3D%3D","accessible":false}]},{"date":"2010-08-27","roc_year":"99","event":"行政院訂定「行政院運用勞動派遣應行注意事項」，派遣人數以99年1月31日實際人數15,514人為上限","actor":"行政院","category":"政策","personnel_types":["承攬"],"summary":"依立法院99年度總預算決議訂定；103年6月4日修正第6、7點，上限因立法院103年度預算決議下調為11,166人；110年2月1日停止適用。","significance":"層疊：派遣作為第四層非典型人力亦以「凍結上限」方式控管，複製臨時人員要點的治理模式。","sources":[{"title":"公部門運用派遣人力之研究（人事行政局，100年10月修正本）","url":"https://www.dgpa.gov.tw/uploads/dgpa/files/202202/60e3e57d-48fc-403a-bd27-255537e85048.pdf","accessible":true},{"title":"政府機關多元人力運用及管理（人事總處簡報，110年6月）","url":"https://www.dgpa.gov.tw/FileConversion?filename=dgpa%2Ffiles%2F202106%2Fa5dc4cdd-59a4-495a-b1d9-1dab0ee1b34a.pdf&name=政府機關多元人力運用及管理.pdf","accessible":true}]},{"date":"2011-10","roc_year":"100","event":"人事行政局出版《公部門運用派遣人力之研究》","actor":"人事總處","category":"調查報告","personnel_types":["承攬"],"summary":"檢討注意事項執行情形，指出業務範圍正面表列、總量管制、指定派遣與轉掛派遣禁止等問題；回顧國美館派遣濫用、立法院要求檢討等背景。","significance":"行政部門自我檢討顯示派遣治理依賴行政規則，拘束力有限。","sources":[{"title":"公部門運用派遣人力之研究（人事行政局，100年10月修正本）","url":"https://www.dgpa.gov.tw/uploads/dgpa/files/202202/60e3e57d-48fc-403a-bd27-255537e85048.pdf","accessible":true}]},{"date":"2012","roc_year":"101","event":"監察院通過「我國中央行政機關勞動派遣問題」調查報告（101財調0132）","actor":"監察院","category":"調查報告","personnel_types":["承攬"],"summary":"沈美真、楊美鈴、程仁宏、劉玉山等委員調查；指出中央機關受總員額法限制無法擴充員額，派遣人數曾達1.5萬人，若全面禁用恐致上萬人失業；相關糾正案文編號099財正0034。人事總處網站另列監察院100.11.22至101.10.4就委外業務之調查意見。","significance":"監察院首度將派遣擴張與總員額法連結，確認「總量管制→非典型替代」的因果。","sources":[{"title":"監察院調查報告：我國中央行政機關勞動派遣問題（101財調0132；糾正案文099財正0034）—僅見部落格轉載","url":"https://buildingfocus.blogspot.com/2017/03/","accessible":false}]},{"date":"2012-01","roc_year":"101","event":"蘇偉業〈政府契約人力之政策定位與現實：政府內部人力市場之啟示〉","actor":"學界","category":"調查報告","personnel_types":["聘用","約僱"],"summary":"指出機關進用約聘僱是因正式人力不足，與制度定位（臨時性）落差；考試院2009年提出三元體制至今未完成任何新立法。","significance":"學界持續記錄「政策定位／實際運作」的漂移。","sources":[{"title":"蘇偉業〈政府契約人力之政策定位與現實：政府內部人力市場之啟示〉文官制度季刊4(1)，2012","url":"https://ws.exam.gov.tw/Download.ashx?u=LzAwMS9VcGxvYWQvMTUvcmVsZmlsZS8xMjAwMS8yNDQ0NC8wY2ZkOTdhNy0wZTk5LTRlOWEtYmM1NC01ODNhNTE0M2NmNWEucGRm&n=NC0xLTIg6JiH5YG
