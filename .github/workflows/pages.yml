# 把 org-compare/output/index.html（組織法規查詢）與 grade-check/output/index.html（官職等配置審核）發布到 GitHub Pages
# 啟用方式（一次）：GitHub 專案 → Settings → Pages → Build and deployment → Source 選「GitHub Actions」
# 之後只要 main 或預設分支的兩個 index.html 有更新，就會自動重新發布。網址：根目錄＝組織法規查詢；/grade/＝官職等配置審核。
name: 發布查詢網頁
on:
  push:
    branches: [main, claude/dreamy-davinci-0xuicp]
    paths: ['org-compare/output/index.html', 'grade-check/output/index.html']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p site/grade
          cp org-compare/output/index.html site/index.html
          cp grade-check/output/index.html site/grade/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
